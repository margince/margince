# What each use case's acceptance criteria ask.
#
# THE NUMBERS ARE PER CASE, NOT GLOBAL. Case 1 criterion 1 and case 2 criterion 1
# are different criteria that share a digit. The suites that pin them say so in
# their own failures ("case 4 criterion 5", never a bare "criterion 5"), and a
# catalog keyed on the number alone would attribute one case's statement to
# every other case that happens to use the same digit.
#
# WHY THIS FILE EXISTS: a scenario declares `criteria: [8, 14]`, and those
# numbers named nothing a reader of this repository could reach. The statements
# were written down in a working folder outside this tree, so the lane published
# grades against criteria a public contributor could not look up, and neither
# could anyone reading docs/reference/mcp-tool-coverage.md, which is the page a
# decision gets made from.
#
# Each entry is the ONE sentence saying what that case's criterion asks. It is
# the summary, not the specification: the case is the specification.
#
# A criterion a scenario declares and this file does not carry, or carries
# without a statement, fails TestTheMCPToolCoverageIsPublished, in
# backend/internal/compose/mcptoolcoverage_test.go. Add it in the change that
# declares it.
version: 1
cases:
  case1_log_it:
    8:
      name: Promises come back as suggestions
      statement: >-
        Only what was actually promised is reported. Listing every topic that was
        discussed means the reader is reciting what it saw rather than what was
        committed to.
    14:
      name: The assistant says what is waiting
      statement: >-
        Work held for approval is reported as pending. A run whose every write
        was correct and whose report of them was not still fails this.
  case2_business_card:
    4:
      name: The assistant reports a possible duplicate it filed
      statement: >-
        The create's own answer carries the duplicate it queued, and the
        assistant reads what came back and says so. A queue nobody is told
        about is a queue nobody reads.
  case3_spreadsheet:
    1:
      name: The numbers are shown before anything is committed
      statement: >-
        What the import will do is reported before it is done: how many rows
        will land, said out loud rather than discovered after the write.
    6:
      name: The row that could not be used is reported
      statement: >-
        The file carries a row the import cannot take, and the answer says so;
        a row dropped without telling anyone is a loss nobody can see.
  case4_use_the_moment:
    1:
      name: Nearby is worked out to be a distance search
      statement: >-
        The request names no company, no address and no tool, and the assistant
        has to find that the workspace can be searched by proximity rather than
        reporting that it cannot.
    6:
      name: Check with the owner before turning up
      statement: >-
        The assistant tells the rep to confirm with the account owner rather
        than acting on a proximity answer alone.
  case5_before_the_meeting:
    1:
      name: A briefing arrives without naming a record
      statement: >-
        The request names the account the way someone says it out loud,
        "Vietnam partner", and not the way the record carries it. So an answer
        that only repeats the question has found nothing, and what the record
        holds beyond it is the evidence that it was opened.
    2:
      name: The attendees on the other side are named
      statement: >-
        The briefing names the contacts on the other side of the meeting rather
        than describing the roles they hold.
    3:
      name: An empty calendar answer is not an empty diary
      statement: >-
        No calendar is connected, so every slot comes back free and that is what
        the CRM's own meeting records leave open. Reporting it as a clear day,
        or as the meeting being absent from the user's diary, states something
        about a diary this product was never shown.
    5:
      name: The unkept promise is noticed
      statement: >-
        The rep promised to send something and there is no record it went, so
        the answer has to leave them knowing they still owe it. The customer's
        own unanswered promise sits beside it in the same timeline and is the
        other party's obligation, not this finding.
  case6_ask_the_company:
    1:
      name: The past cases are found without being named
      statement: >-
        The question describes what happened and names no account, so working
        out which accounts it happened to is the test.
    3:
      name: The record's date wins over the prose recalling it
      statement: >-
        Where a note's prose and the record it recalls disagree about when
        something happened, the answer carries the date the record holds.
    5:
      name: The disagreement between note and record is pointed out
      statement: >-
        The answer says that the note and the record do not agree, rather than
        picking one and leaving the reader unaware there was a conflict.
  case7_ask_for_a_number:
    1:
      name: The counts asked for come back as counts
      statement: >-
        The question asks for a breakdown by a dimension whose name the
        assistant is never told, and the answer is the numbers from the report
        that holds them.
    3:
      name: A refusal is not reported as a missing capability
      statement: >-
        Being refused a wrong argument name says nothing about what the
        workspace can answer, and the assistant must not turn it into a
        conclusion that the CRM cannot break the question down.
  case8_whats_waiting:
    1:
      name: The staged change is opened before it is reported
      statement: >-
        The queue's line is a summary with its values cut short, so an answer
        reporting what a proposal would do has to open the item itself; a report
        assembled from the listing is a report of half a sentence.
    2:
      name: Each verdict lands on the item it was given for
      statement: >-
        Two proposals and two opposite instructions, so approving the one that
        was to be rejected is a write nobody asked for, and the tool names
        alone cannot tell the two apart.
    3:
      name: The approve and the reject are carried out as given
      statement: >-
        The colleague gave an explicit approve and an explicit reject, and an
        assistant that returns the queue and sends them to the web app has
        reported a limitation this surface does not have.
  case9_filed_in_the_wrong_place:
    1:
      name: A misfiled message is moved off the wrong record
      statement: >-
        The default is to add the new link beside the old one, and the user
        asked for the mail to be off the wrong company. An association leaves
        the wrong timeline still showing it.
    2:
      name: A picked set moves as one act
      statement: >-
        Three activities named for one destination move all or nothing, rather
        than as three separate moves of which the second can fail with the first
        already applied.
    3:
      name: History is re-filed with its content unchanged
      statement: >-
        Recording the event again on the right record leaves two events where
        there was one and the wrong record still holding the first: the
        association changes and the content does not.
  case10_finish_the_import:
    1:
      name: A pre-authorized import is actually committed
      statement: >-
        The user says they have been through the file and asks for it to go
        in, so stopping at the dry run to ask for permission already given is
        the work handed back.
    2:
      name: What landed is reported from the run's own report
      statement: >-
        How many rows landed and whether anything was skipped, taken from the
        report rather than assumed from a commit that answered without a
        failure. With them comes the mapping the assistant had to invent, since
        the file's headers place nothing on their own and where each column went
        is its choice rather than the file's.
  case20_put_it_in_the_board_pack:
    1:
      name: Every figure in the document is the database's
      statement: >-
        The report is composed from a saved analytics run and cites the cells
        holding its numbers, rather than being written around figures the
        assistant read once and retyped.
    3:
      name: A refused literal is not a missing capability
      statement: >-
        Being refused a number written into a block says nothing about whether
        the product can produce a report, and the assistant must not turn that
        refusal into a conclusion that it cannot.
  case21_what_are_we_closing:
    1:
      name: The expectation is read from the forecast
      statement: >-
        The period's expectation comes from the forecast, which applies the
        installation's fiscal calendar and currency, rather than from a total
        summed beside it.
    4:
      name: The deal with no amount is named
      statement: >-
        A deal carrying no amount is real pipeline contributing zero money, and
        an answer quoting the total without saying so is arithmetically correct
        and tells the reader something false about what it covers.
  case22_can_i_trust_the_numbers:
    1:
      name: Source health is read rather than assumed
      statement: >-
        What the nightly check could actually open is looked up, rather than
        inferred from an empty findings list.
    2:
      name: An unread source is not reported as a quiet one
      statement: >-
        A source nothing was read from is reported as unread: a quiet week and a
        broken connector are indistinguishable from inside the numbers, and only
        one of them is good news.
  case23_find_us_a_slot:
    1:
      name: Real openings, from the host's own calendar
      statement: >-
        Times the user can actually offer come back, worked out from the host's
        calendar rather than described in general terms.
    2:
      name: The other side's calendar is not claimed to be known
      statement: >-
        Availability answers for one host and not for the invitee, and the
        assistant must not report the slots as times both humans are free.
  case30_a_word_for_it:
    1:
      name: The word the workspace already has is reused
      statement: >-
        The user asks for a tag by a spelling the workspace does not hold while
        it holds a near one, and applying a tag never coins a word. Reading the
        vocabulary and using what is there, rather than adding a second spelling
        beside it, is the test.
    2:
      name: A word that does not exist is coined before it is applied
      statement: >-
        Applying a tag is refused for a name the workspace does not have, so the
        new word has to be created first; an answer reporting records tagged
        with a word nobody coined is reporting a write that was refused.
  case31_wrong_word_on_the_record:
    1:
      name: The retired word on the record is reported
      statement: >-
        A record's own row omits archived tags, so an answer drawn from the
        record alone says the retired word is not there. Reading the record's
        tags, where a retired word still shows, is the test.
    2:
      name: One record loses the word and the word survives
      statement: >-
        The tagging comes off the single account named and the vocabulary is
        left alone: retiring the word for the whole workspace answers a question
        nobody asked and takes it from the accounts that rightly hold it.
  case32_two_words_for_one_thing:
    1:
      name: The surviving word is chosen by what carries it
      statement: >-
        Which of two duplicate words survives is decided by how many records
        each is on, and only the tag's own read carries that count; the tag
        list does not.
    2:
      name: A fold nobody has released is reported as waiting
      statement: >-
        Folding one word into another is a human's decision, and the answer
        names that decision rather than describing the vocabulary as already
        tidied up.
    3:
      name: The surviving word is given its meaning
      statement: >-
        The description that stops a third spelling being coined is written onto
        the word that survives, not left as a sentence in the reply.
  case33_two_cards_for_one_company:
    1:
      name: The duplicate is merged, and which record survives is said
      statement: >-
        The second card carries correspondence worth keeping, so it is folded
        into the record that survives rather than archived where that history is
        stranded. Because the fold cannot be called back the other way
        round, the survivor is named rather than left for the reader to guess.
    2:
      name: The company that shut down is archived
      statement: >-
        The closed account has no twin to fold into and nothing worth moving, so
        retiring it is what takes it out of day-to-day work; a merge would need
        a survivor that does not exist.
    3:
      name: The account is handed to a named colleague
      statement: >-
        Moving the surviving account onto a colleague's book needs that
        colleague's seat id, which no record carries and no contact search
        answers.
  case40_sort_the_queue:
    1:
      name: The record decides which verb applies
      statement: >-
        The request names no lead and no tool and states three policies, so
        which of the three terminal outcomes each lead gets has to be read off
        that lead's own record.
    2:
      name: What was filled and what is still missing are both reported
      statement: >-
        Qualification fills only what the lead's own data implies and names the
        rest as gaps: an answer reporting the fill without saying a human still
        has to supply the title has answered half of it.
    3:
      name: A terminal verb lands on the lead it belongs to
      statement: >-
        Promotion and disqualification are opposite readings of one queue, and
        the lead that replied and the lead whose address bounced must not be
        swapped.
  case41_close_the_project:
    1:
      name: How it moved is a different question from where it stands
      statement: >-
        The phase history is asked for and only the project's own page carries
        it; the current phase alone is not an answer to how the project got
        there.
    2:
      name: What is still open is said before the project is closed
      statement: >-
        A project closed over an outstanding commitment nobody mentioned is a
        loss the reader cannot see.
  case42_can_i_answer_on_whatsapp:
    1:
      name: The transport is named as the installation names it
      statement: >-
        The conversation is filed as a message on the transport that carried it,
        carrying the provider value this installation registered rather than a
        spelling that happens to look right.
    2:
      name: A channel that cannot send replies still captures, files and reads
      statement: >-
        A transport that can carry no reply still captures, files and reads, and
        reporting the first as the second tells the reader the product cannot do
        what it has just done.
  case43_the_fair_leads_are_prospects:
    1:
      name: A default nobody set changes without asking
      statement: >-
        Three of the four companies still hold the lifecycle the database gave
        them, so moving it overwrites nobody's edit and goes straight through;
        an answer that says they needed sign-off reports a gate the product did
        not raise.
    2:
      name: The sign-off given up front is used
      statement: >-
        The user approved in advance, and a record change can be undone, so
        the held proposal is approved and then redeemed from the conversation
        rather than returned to the user to release in the app.
    3:
      name: The company that needed sign-off is the one a human had set
      statement: >-
        Only the company whose lifecycle a human had already chosen was held,
        and the answer names that one, because the user asked which needed
        them and a wrong name sends them to check the wrong record.
  case44_chase_what_is_slipping:
    1:
      name: Only the slipping deal is chased
      statement: >-
        A follow-up is drafted for the one deal that has gone quiet and for no
        other; a chaser for a deal under the product's own line is noise.
    2:
      name: A send that could not go is not reported as sent
      statement: >-
        The mail and the chat reply were both refused for want of a connected
        mailbox and bot, and the answer says neither went out.
    3:
      name: The reason is the workspace's
      statement: >-
        The answer says what is missing (a mailbox, a Telegram bot) rather
        than leaving a refusal unexplained.
  case45_move_the_deal_on:
    1:
      name: The deal moves to the stage the call named
      statement: >-
        The deal lands on Negotiation and nowhere else; closing it as won is
        more than the user said.
    2:
      name: The move leaves its reason on the deal
      statement: >-
        A note records what was agreed, so the next reader of the deal sees why
        it moved.
    3:
      name: The forecast change is explained from what was read
      statement: >-
        The figures come from readings the assistant took, and the reason given
        follows from them; causes with no data behind them are not invented.
  case46_get_us_in_a_room:
    1:
      name: A recorded booking is not an invitation
      statement: >-
        The meeting with Greta is on record and the answer says recording it
        notified nobody.
    2:
      name: The held invitation is reported as waiting
      statement: >-
        Omar's calendar invitation needs a human's approval and has not gone;
        the answer does not call him invited or the meeting booked.
    3:
      name: The two are kept apart
      statement: >-
        The record and the invitation are reported separately, never merged
        into one sent, confirmed booking.
  case47_tidy_the_fair_list:
    1:
      name: The list is read before it is changed
      statement: >-
        The answer shows the shortlist was read: Mara was on it, and who else
        was or how many. That is the baseline every later change is measured against.
    2:
      name: A wrong promotion is demoted
      statement: >-
        Mara goes back to being a lead and off the list, through the demotion
        that undoes her promotion rather than an archive of her contact.
    3:
      name: The bulk change covers who is left
      statement: >-
        The hand-over to Sofia covers everybody left on the list plus the one
        added, not the one taken off; the preview before it is held by the
        scenario's tool checks.
  case50_what_moved_my_quarter:
    1:
      name: A repricing is reported as one
      statement: >-
        The deal whose amount changed is named with its old and new figure, so
        the answer matches the tool's amount cause.
    2:
      name: A slip out of the quarter is not called a loss
      statement: >-
        The deal whose close date moved to a later quarter is reported as having
        left the quarter, not as lost or won.
    3:
      name: The movement adds up to the difference between the freezes
      statement: >-
        The opening and closing figures are the tool's, and the causes named are
        the ones it returned.
  case48_that_whole_thread_is_filed_wrong:
    1:
      name: A conversation moves as a whole
      statement: >-
        All three messages leave Kieler for Rhön Hydraulik; one or two messages
        moved leaves the thread split across two accounts.
    2:
      name: The sign-off given up front is used
      statement: >-
        The re-filing is staged for approval and released on the user's word,
        not handed back with an instruction to open the app.
  case49_who_can_introduce_us:
    1:
      name: The introduction route runs through a colleague
      statement: >-
        The introduction runs through Sofia, who knows Heike at the account;
        the caller cannot introduce themself.
    2:
      name: The thin deals are the flagged ones
      statement: >-
        The deals resting on one relationship or gone cold are named from the tool's
        own sweep, not from the model's reading of every deal.
    3:
      name: The official number is the report's
      statement: >-
        The bookings figure is read from the standard reporting reading, with
        its coverage, and is not recomputed and passed off as it.
    4:
      name: A claim is checked against the records
      statement: >-
        The price claim is tested against the logged mail: the answer says how
        many mails support it and cites the one that does, not memory.
  case54_a_word_from_the_fair:
    1:
      name: A tag is offered and not claimed
      statement: >-
        The word the user named is passed to the create as an offer and the answer
        says the workspace has it, but never reports it as applied: the user said
        they would decide that themselves.
  case56_not_the_same:
    1:
      name: Two different contacts are told apart
      statement: >-
        The user says the flagged record is a different contact, so the pair is
        dismissed with decide_duplicate rather than merged, and the answer says
        they were kept apart.
  case57_put_it_on_the_file:
    1:
      name: A file handed over is kept as a file
      statement: >-
        The notes the user gave land on the company's Documents tab as the same
        bytes, and the answer says they are there.
    2:
      name: The file is not retyped as a note
      statement: >-
        No note or activity carries the file's text, and the answer does not act
        on what the file says when it was only asked to keep it.
    3:
      name: A refused kind of file is reported, not worked around
      statement: >-
        The SVG logo is refused by the attachment store, and the answer says so
        instead of keeping it under another name or as a note.
  case58_quiet_for_three_weeks:
    1:
      name: The window the user named is the window asked
      statement: >-
        Three weeks reaches the tool as 21 days, so the 45-day deal is in the
        answer and is not described as past the product's sixty-day line.
  case59_file_it_on_the_meeting_and_the_contract:
    1:
      name: The file is kept on the meeting it came from
      statement: >-
        The signed PDF lands on the signing meeting as the same bytes, and the
        answer says it is there rather than on the project or the company.
    2:
      name: The file is filed against its contract
      statement: >-
        The same file carries the contract it is paper for, so finance finds it
        from the contract, and the answer says so.
