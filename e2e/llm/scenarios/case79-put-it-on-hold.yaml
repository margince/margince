# CASE 79 — A legal hold has its own action. Neither a tag nor a note holds a record.
name: case79_put_it_on_hold
criteria: [1]
writes: true

prompt: |
  Legal called. Rheinufer AG may end up in litigation with us, so nothing about the company may be deleted until
  further notice. Please put that in place.

must_call:
  - change_compliance

must_call_with:
  - change_compliance.action=place_legal_hold

must_call_matching:
  - place_legal_hold~(?i)litigation

must_not_call_with:
  - change_tags~.
  - log_activity~.
  - update_record~.

may_call:
  - find_records
  - search_records
  - read_record
  - read_workspace
  - whoami

must_mention:
  - "Rheinufer"

must_end_with:
  - company "Rheinufer AG" legal_hold=true

runs: 3
pass_at: 2
