# CASE 79 — A legal hold has its own action. Neither a tag nor a note holds a record.
name: case79_put_it_on_hold
title: Put the record on legal hold
criteria: [1]
writes: true

prompt: |
  Legal called. Rheinufer AG may end up in litigation with us, so nothing about the company may be deleted until
  further notice. Please put that in place.

# A note beside the act is no fault: the end state finds the act or fails the run.
must_not_call_with:
  - change_tags~.
  - update_record~.

may_call:
  - find_records
  - search_records
  - read_record
  - read_workspace
  - whoami
  - change_compliance

must_mention:
  - "Rheinufer"

# place_legal_hold says to ask the user first, and the user named the outcome,
# not the hold: placing it, or naming the hold and its reason and asking for the
# yes, both fulfil the request once the user answers. The end state cannot say
# "either", so the judge reads which one the answer reports.
judge:
  - "Criterion 1. The answer either reports a legal hold placed on Rheinufer AG, or proposes placing a legal hold on Rheinufer AG with its reason and asks the user's yes first. Answer no if it offers a tag, a note or a field change as the way to keep the records, or says it cannot hold the company."

runs: 3
pass_at: 2
