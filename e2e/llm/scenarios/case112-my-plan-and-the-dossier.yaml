# CASE 112 — The weekly plan and a company's dossier are both read_details panels.
# Reading them starts no plan and refreshes no dossier: a refresh would spend the
# enrich scope, and the user asked only to be told.
name: case112_my_plan_and_the_dossier
title: My week's plan and the company dossier
criteria: [1]
writes: false

prompt: |
  What is on my weekly plan right now, and what does the dossier say about
  Nordholz Anlagenbau GmbH? Only tell me. Change nothing and do not create
  anything new.

may_call:
  - find_records
  - search_records
  - list_records
  - read_record
  - read_context
  - read_attention
  - read_workspace
  - whoami
  - read_details

must_not_call_with:
  - run_research~.
  - change_attention~.

# The admin has started no plan this week, and no research has filled the dossier.
# Its one section states the industry from the company's own fields, so "empty"
# and "only the record's own fields" are both true. Both facts come only from
# the reads, so the answer must carry both.
must_mention:
  - "Nordholz"
  - "(?i)\bplan\b"
  - "(?i)dossier[^\n]{0,120}(?:empty|blank|no (?:sections?|content|research|entries|findings)|nothing|not (?:yet )?(?:been )?(?:written|generated|researched|built|filled)|n['’]t (?:yet )?(?:been )?(?:written|generated|researched|built|filled))|\b(?:empty|no|blank)\b[^.\n]{0,40}dossier|dossier[\s\S]{0,200}?(?:only|just|thin|sparse|minimal|bare)[\s\S]{0,160}?(?:record(?:['’]s)? own|own fields|from the (?:company )?record|industry)|dossier[\s\S]{0,300}?(?:record(?:['’]s)? own fields|(?:not|n['’]t) (?:from|by|through) (?:a |any )?research)"
  # "Weekly plan: none is saved" says it with the plan first. The none must be
  # the plan's own, so "plan: 3 calls; dossier: empty" and "plan has nothing
  # overdue" are not it. A "not started" is the plan's when no clause break and
  # no dossier stand between them; the plan may be a heading on the line above.
  - "(?i)\bno\b[^.]{0,40}\bplan\b|\bplan\b(?:(?!dossier)[^.;,]){0,60}?(?:\bnot|n['’]t) (?:yet )?(?:been )?(?:started|begun|opened)|(?:^|[.;,\n])(?:(?!dossier)[^.;,\n])*?(?:\bnot|n['’]t) (?:yet )?(?:been )?(?:started|begun|opened)(?:(?!dossier)[^.;,]){0,40}?\bplan\b|\bplan\b(?:\s*:\s*(?:none|nothing|empty)\b|\s+is\s+(?:currently\s+)?empty\b|\s+(?:has|holds|contains)\s+nothing\s*(?:[.;,\n]|$|(?:on|in) it\b|yet\b))"

# What the dossier holds is one industry line. An answer that reports anything a
# research run would have found invented it; "no products yet" is not a claim.
must_not_mention:
  - "(?i)dossier\b(?:(?!\bno\b|\bnot\b|n['’]t\b|\bnothing\b|\bwithout\b|\bnone\b)[^.\n]){0,120}?\b(?:revenue|turnover|employees|headcount|founded|headquarter\w*|competitors?|plants?|factor(?:y|ies)|subsidiar(?:y|ies)|customers?|products?|news|funding)\b"

runs: 3
pass_at: 2
