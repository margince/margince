# CASE 112 — The weekly plan and a company's dossier are both read_details panels.
# Reading them starts no plan and refreshes no dossier: a refresh would spend the
# enrich scope, and the user asked only to be told.
name: case112_my_plan_and_the_dossier
title: My week's plan and the company dossier
criteria: [1]
writes: false

prompt: |
  What is on my weekly plan right now, and what does the dossier say about
  Nordholz Anlagenbau GmbH? Only tell me. Change nothing and do not create
  anything new.

must_call:
  - read_details

must_call_with:
  - read_details.action=dossier
  - read_details.action=weekly_plan

# The admin has started no plan this week, and the weekly plan read answers that
# with a 404 by design: a read that opened a plan would put an empty week in the
# history. So the refused read is the answer, and the answer must say no plan is open.
counts_when_refused:
  - read_details

may_call:
  - find_records
  - search_records
  - list_records
  - read_record
  - read_context
  - read_attention
  - read_workspace
  - whoami

must_not_call_with:
  - run_research~.
  - change_attention~.

must_mention:
  - "Nordholz"
  - "(?i)\bplan\b"
  - "(?i)\bno\b[^.]{0,40}\bplan\b|not (yet )?(started|begun|opened)|hasn't been started|haven't started"

runs: 3
pass_at: 2
