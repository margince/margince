# CASE 45 — Move the deal on.
#
# progress_deal moves a deal and may leave a note explaining the move. The bare
# move (advance_deal) is still callable by name but no longer offered, since
# progress_deal with the note left off does the same thing.
#
# THE MOVE IS OPEN TO OPEN (Qualified to Negotiation), so it runs without anyone's
# sign-off. A move onto Won or Lost is staged for a human, which is a different
# case; this one keeps the stage a rep reads off the call, so a run that
# closes the deal as Won has done more than it was told.
#
# forecast_movement is case 50's. This case grades the honest half of "what does
# that do to my quarter": figures come from readings the model took, and a reason
# is one those readings support — the stage's probability against the deal's
# amount — never causes it has no data for.
name: case45_move_the_deal_on
criteria: [1, 2, 3]

# WRITES: the author's own statement that this case changes the world. It is not
# what decides the reset — the runner rebuilds whenever the LAST run dirtied the
# world, because the assistant is offered the whole server and any run can write
# regardless of what its file says. TestEveryWritingScenarioDeclaresThatItWrites
# holds this line against the tools the case names.
writes: true

prompt: |
  Just out of Rheinufer — their purchasing joined the call and we are talking
  terms now. Put the Netzmodernisierung deal in Negotiation and note that
  purchasing is at the table. What does that do to my quarter?

must_call:
  - progress_deal
may_call:
  - read_workspace
  - search_records
  - read_record
  - list_records
  - resolve_entities
  - query_workspace
  - read_forecast

must_mention:
  - "Negotiation"

judge:
  - "Criterion 1. The answer reports the Rheinufer Netzmodernisierung deal as moved to the Negotiation stage, and says nothing that puts it on Won, Lost or any other stage. Answer no if it reports a different stage, says the move is waiting for approval, or does not report a move."
  - "Criterion 2. The answer says a note was left on the deal recording that purchasing joined the call or is at the table. Any wording of why the deal moved will do. Answer no if it says no note was written, or never mentions one."
  - "Criterion 3. The answer gives the forecast figures from readings it took — before and after the move, or the reading as it stands — and any reason it offers for the change follows from what it read, such as the deal's stage probability and amount. Answer no if it names causes it never read and cannot derive (a re-score, a slipped date, a definition change, other deals moving), says the forecast was unaffected without having looked, or quotes figures no tool gave it. Answer yes when every figure it quotes matches a reading it took, even if it offers no reason for the change and does not show where each figure came from."


# Open to open runs without sign-off, so the deal ends on the stage it was
# told, read by name: a stage id is minted per seed.
must_end_with:
  - deal "Rheinufer Netzmodernisierung" stage=Negotiation

runs: 3
pass_at: 2
