# CASE 114 — A team and a share are both change_access: create the team, add each
# member, then share the one company at read access. Read was asked, so write
# access is more than the user gave.
name: case114_the_fleet_team
criteria: [1, 2]
writes: true

prompt: |
  Set up a new team called Fleet Accounts, with Sofia Meier and Lena Fischer in it.
  Sofia takes over the service calls for Nordholz Anlagenbau GmbH next week, so give
  her read access to that company.

must_call:
  - change_access

must_call_with:
  - change_access.action=share
  - change_access.action=create_team
  - change_access.action=add_team_member

must_call_matching:
  - share_record~"access": "read"
  - create_team~Fleet Accounts

must_not_call_with:
  - share_record~"access": "write"

may_call:
  - find_records
  - search_records
  - list_records
  - read_record
  - read_workspace
  - whoami
  - list_colleagues

must_mention:
  - "Sofia"

must_end_with:
  - team "Fleet Accounts" member=Sofia Meier
  - team "Fleet Accounts" member=Lena Fischer

runs: 3
pass_at: 2
