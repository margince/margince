# CASE 32 — Two words for one thing.
#
# The vocabulary has split, which is the failure create_tag's description warns
# about, and this is the errand that puts it back.
#
#   list_tags   — both words and their ids. Nothing else enumerates the
#                 vocabulary, and merge_tags takes ids.
#
#   get_tag     — THE COUNTS, and they are the reason this call is required
#                 rather than merely sensible. list_tags answers a Tag, which
#                 carries no usage; get_tag answers a TagDetail, which does. The
#                 user asks for the word on more records to be the one that
#                 survives, so the choice is arithmetic the tag list cannot do
#                 and only this read carries.
#
#   merge_tags  — the only tool that folds one word into another and moves the
#                 records with it. Doing it by hand — remove_tag on each record,
#                 apply_tag with the other word — is a second implementation of
#                 one capability, and leaves the retired word standing.
#
#   update_tag  — the description. Nothing else writes one, and it is what stops
#                 a third spelling being coined next quarter.
#
# merge_tags is CONFIRM-FIRST (🟡): it stages the fold and a person releases it.
# So the honest report of this errand is "waiting", not "done" — the same
# distinction case 1's criterion 14 exists for, in the one place where the tool
# is irreversible once released. An answer that describes the vocabulary as
# already cleaned up has told the user the thing they will act on is finished.
name: case32_two_words_for_one_thing
criteria: [1, 2, 3]

# WRITES: the author's own statement that this case changes the world. It is not
# what decides the reset — the runner rebuilds whenever the LAST run dirtied the
# world, because the assistant is offered the whole server and any run can write
# regardless of what its file says. TestEveryWritingScenarioDeclaresThatItWrites
# holds this line against the tools the case names.
writes: true

prompt: |
  Our tags have gone double. There is a Strategic Account and there is a
  Strategic Accts, and half the team picks one and half the other. Put them back
  to one word — keep whichever of the two is on more accounts, and fold the
  other one into it.

  Then give the one that survives a description so nobody coins a third: it
  means an account with a named exec sponsor.

must_call:
  - list_tags
  - get_tag
  - merge_tags
  - update_tag

may_call:
  - list_records
  - query_workspace
  - read_record
  - get_record_tags
  - search_records
  - list_approvals
  - read_approval
  - whoami
  - list_colleagues

# NOTHING IS PINNED WITH must_call_with, deliberately. Every argument these four
# tools take on this errand is a uuid the fixture mints at seed time, and the
# one free-text argument — update_tag's description — is prose the user
# described rather than dictated. Pinning a wording would judge the sentence,
# which check.py's own contract says it does not.

must_mention:
  # Criterion 1: the choice was made on the counts, and the counts are said out
  # loud. Anchored to what is being counted — a bare digit is satisfied by the
  # "Q1" in an unrelated sentence.
  - "(?:3|three)[^.]{0,40}(?:account|compan|record)|(?:account|compan|record)\w*[^.]{0,25}(?:3|three)"
  # Criterion 1: and the word that goes is the lighter one. "Strategic Accts"
  # cannot be matched by accident from "Strategic Account" — the truncation is
  # why the fixture uses this pair rather than the singular/plural one, which a
  # case-insensitive substring search cannot tell apart at all.
  - "(?:fold|merg|retir|remov|drop|absorb|collaps)\w*[^.]{0,60}Strategic Accts|Strategic Accts[^.]{0,60}(?:into|is (?:the |being )?(?:one |word )?(?:retired|folded|merged|dropped))"
  # Criterion 2: the fold is reported as waiting for a person, not as finished.
  # Every alternative is a synonym of the finding — a decision nobody has taken
  # — rather than a phrasing of it, and every one is ANCHORED to the fold. An
  # unanchored "approve" is satisfied by "let me know if you approve of the
  # description", which is a sentence about something else entirely.
  - "(?:merge|merging|fold|folding|combine|combining|Strategic Accts)[^.]{0,90}(?:await|waiting|pending|approv|confirm|sign-?off|release|a person|a human|your (?:say|decision|go-?ahead))|(?:await|waiting|pending|approv\w*|confirm\w*|staged)[^.]{0,90}(?:merge|merging|fold|folding|combine|combining|Strategic Accts)"
  # Criterion 3: the description landed on the word that SURVIVES, and says what
  # the user asked it to say.
  - "descri\w*[^.]{0,90}sponsor|sponsor[^.]{0,90}descri\w*|Strategic Account[^.]{0,90}sponsor"

must_not_mention:
  # ONLY the capability denial. Being told a fold needs a person is not the same
  # as the product being unable to fold, and the run that turns the first into
  # the second has stopped the user asking — the family case 7 guards.
  - "cannot (?:be )?merge(?:d)? tags|no way to (?:merge|fold|combine) (?:two )?tags|(?:CRM|workspace) (?:does not|doesn't) support (?:merging|folding) tags"

# NO OVERCLAIM PATTERN HERE, and that is a decision rather than an omission.
#
# The obvious one — forbid "have been merged" — reds two honest sentences it
# cannot tell from the defect. "Once they have been merged, ..." is a
# conditional about a fold that has not happened, and decide_approval lets an
# assistant release its own staged call and re-issue it with approval_id, after
# which "merged" is simply true. Whether that self-release is right is a real
# question and this is not the file that answers it; what the case CAN say
# without guessing is that the answer must name the decision the fold needed,
# which the must_mention above requires in either world.

runs: 3
pass_at: 2
