# CASE 101 — Which model the installation runs is readable. Changing it stays with the user, so the question never reaches a write.
name: case101_which_model_reads_our_mail
criteria: [1]
writes: true

prompt: |
  Which AI models are we routing to at the moment?

must_call:
  - read_workspace

must_call_with:
  - read_workspace.topic=ai_routing

must_not_call_with:
  - change_settings~.

may_call:
  - whoami
  - read_details

runs: 3
pass_at: 2
