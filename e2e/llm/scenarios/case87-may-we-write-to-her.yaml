# CASE 87 — An agent records consent, so it must be able to check first: the state, the proof and the guard are read on read_details.
name: case87_may_we_write_to_her
criteria: [1]
writes: false

prompt: |
  Has Katrin Sommer at Reply Deutschland agreed to our marketing emails, and may we write to her right now?

must_call:
  - read_details

must_call_matching:
  - read_details~contact_consent

must_not_call_with:
  - change_compliance~.
  - update_record~consent
  - send_outbound~.

may_call:
  - find_records
  - search_records
  - read_record
  - read_workspace
  - whoami

runs: 3
pass_at: 2
