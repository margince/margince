# CASE 92 — Near neighbour of case91. Moving a deal stays on the old tool, and the pipeline's ladder stays as it is.
name: case92_move_the_deal_not_the_ladder
criteria: [1]
writes: true

prompt: |
  Put the Rheinufer Netzmodernisierung deal in Negotiation, we are talking terms now.

must_call:
  - change_state|progress_deal

must_not_call_with:
  - change_settings~.

may_call:
  - find_records
  - search_records
  - read_record
  - read_workspace
  - whoami
  - log_activity
  - change_activities

must_mention:
  - "Negotiation"

must_end_with:
  - deal "Rheinufer Netzmodernisierung" stage=Negotiation

runs: 3
pass_at: 2
