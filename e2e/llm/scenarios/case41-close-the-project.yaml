# CASE 41 — Close the project out.
#
# read_project_360 and advance_project_phase, neither of which a model had ever
# been asked for on this surface.
#
# WHY read_project_360 IS GENUINELY REQUIRED and not merely convenient. The
# prompt asks how the project MOVED — phase by phase — and the phase history is
# the one thing no other tool answers. read_record carries the current phase
# alone; catch_me_up_on carries recent activity; prepare_handoff carries the
# delivery gaps. A project sitting in `delivering` looks identical through all
# three, and only the 360's phase history says it came through `initiative` and
# `pursuing` to get there. That is also what the must_mention below rests on.
#
# WHY THE PHASE VOCABULARY IS THE SUBJECT. advance_project_phase's own copy says
# it: "Use advance_deal for a deal's pipeline stages; a project's phases are a
# different vocabulary on a different record." An assistant that reaches for a
# deal here has answered a different question on a record this fixture does not
# have.
#
# CLOSING REQUIRES A REASON — 422 closed_reason_required otherwise — so the
# assistant has to supply one rather than sending the bare transition. That is
# not asserted directly: `reason` is free text, and an assertion over it —
# pattern or judged criterion — would be judging wording. It is asserted through
# the fact that the call has to succeed for the answer to report the close at all.
#
# NOTHING HERE DEPENDS ON THE WRITE HAVING LANDED — only on the call having been
# made with the right phase, and on what the assistant read before making it.
# The phase move is `auto_execute` on this contract, and a scenario that asserted
# the applied state would be asserting that policy rather than the errand.
name: case41_close_the_project
criteria: [1, 2]

# WRITES: the author's own statement that this case changes the world. It is not
# what decides the reset — the runner rebuilds whenever the LAST run dirtied the
# world, because the assistant is offered the whole server and any run can write
# regardless of what its file says. TestEveryWritingScenarioDeclaresThatItWrites
# holds this line against the tools the case names.
writes: true

prompt: |
  The Elbwerk rollout is done — we handed it over to their team last week.
  Before I sign it off in the CRM, walk me through how it actually moved along,
  phase by phase, and tell me whether anything is still hanging on it. Then
  close it out.

must_call:
  - read_project_360
  - advance_project_phase
may_call:
  - list_records
  - search_records
  - read_record
  - review_commitments
  - catch_me_up_on
  - prepare_handoff
  - query_workspace

# The tool name alone would pass on a call that moved the project BACK to
# `pursuing`, or forward to `delivering` it is already in — the wrong phase on
# the right record, with prose about closing beside it. The phase is the whole
# act, so the phase is pinned.
must_call_with:
  - advance_project_phase.to_phase=closed

must_mention:
  # MECHANICAL, all three, and none of them has ever leaked.
  #
  # The project it acted on.
  - "Elbwerk"
  # THE PHASE HISTORY. The project stands in `delivering`; `initiative` and
  # `pursuing` are behind it and appear nowhere but the history
  # read_project_360 returns. Two entries rather than one alternation, because
  # an answer that walks the ladder names both and an answer that recites the
  # enum from the tool schema is not what was asked for.
  - "initiative"
  - "pursuing"
  # AND THE LADDER'S ENUM IS NOT THE WALK-THROUGH. Both words above are handed
  # over by advance_project_phase's own argument list, so a run that never
  # opened the project could write them from the schema alone — the same false
  # green case 8 answers with "Werkzeugbau".
  #
  # The reasons recorded on the two transitions are the only thing that carries
  # any of the words below: the offer released after the site visit in Wismar,
  # the order placed with the installation planned for Wismar and Greifswald.
  # They are on no record, in no tool description and in no other fixture, so an
  # answer reaching one of them has read WHY the project moved rather than the
  # names of the rungs. Wide on purpose and in the direction under-recognition
  # must not fail in: a place name survives translation, and a walk-through
  # written in English from German reasons still says where the visit was.
  - "Wismar|Greifswald|Standorttermin|Standortbesuch|site visit"

# THE SEMANTIC HALF. Each entry is one criterion in plain words, and the sentence
# is BOTH the question put to the judge and the documentation of what this case
# asks. A criterion is a statement ABOUT THE ANSWER and "yes" means it holds, for
# the forbidding ones too.
#
# WHAT MOVED AND WHY. The open commitment used to be a name alternation
# ("Abnahmeprotokoll|acceptance protocol|handover document") and the false
# all-clear a negation-guarded claim pattern; the deal claim was the third. All
# three are the shape this lane has measured not working — did the answer report
# a gap, did it avoid a claim — and each had already been widened for a sentence
# a correct answer writes: the all-clear needed an exception clause spared in
# front of the claim AND behind it, because "apart from the Abnahmeprotokoll,
# there are no open tasks" is the answer that FOUND the thing; then the positive
# form of the same claim ("all tasks are done") arrived carrying no absence at
# all. The deal pattern red "I closed the project, not the deal" and "…but left
# the deal as is", which are the right answer saying which record it touched,
# until the gap was taught to stop at a comma and at a "but".
judge:
  - "Criterion 2. The answer tells the reader what is still hanging on the Elbwerk project before it reports the close: one commitment is outstanding, the Abnahmeprotokoll — the acceptance protocol, the handover document — and the answer names it or describes it AS STILL OPEN. Any wording or language will do. Answer no if the answer never reports the outstanding item at all, and equally if it names the Abnahmeprotokoll while presenting it as done, filed, delivered or handled — naming a commitment is not reporting it when the reader is told it is closed. The loss this criterion exists for is a project closed over an open commitment nobody was told about, and an answer that mentions the document only to call it finished leaves the reader exactly as uninformed."
  - "Criterion 2, the other direction. The answer never gives the reader an all-clear about open work on this project: no claim that nothing is outstanding, that there are no open tasks or commitments, that everything is done, or that nothing is left hanging on it. One commitment IS open. Naming that commitment and then reporting the rest of the queue honestly — 'apart from the Abnahmeprotokoll, there is nothing else open' — is what a correct answer does: answer yes to that, in either order. A closing sentence about there being nothing further for the reader to DO now that the project is closed is not a claim about the queue: answer yes."
  - "Criterion 1, the wrong record. The answer never claims to have moved, advanced or closed a DEAL. There is no deal on this project, and a project's phases are a different vocabulary on a different record. Explaining that distinction, or saying which record it did not touch — 'I closed the project, not the deal', 'I left the deal alone' — is what a correct answer does: answer yes. Answer no only where the answer reports an act of its own on a deal."

runs: 3
pass_at: 2
