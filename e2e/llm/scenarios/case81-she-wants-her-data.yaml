# CASE 81 — A subject asking for their data opens a request in the queue. It is not a task and not a note.
name: case81_she_wants_her_data
criteria: [1]
writes: true

prompt: |
  Katrin Sommer (katrin.sommer@reply.test) wrote asking which personal data we hold about her. Open a data
  subject access request for it, received today.

must_call:
  - change_compliance

must_call_with:
  - change_compliance.action=open_data_subject_request

must_call_matching:
  - open_data_subject_request~"kind": "access"

must_not_call_with:
  - create_record~.
  - change_activities~.
  - log_activity~.

may_call:
  - find_records
  - search_records
  - read_record
  - read_workspace
  - whoami

must_mention:
  - "Katrin"

runs: 3
pass_at: 2
