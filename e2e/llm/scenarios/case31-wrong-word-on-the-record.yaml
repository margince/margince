# CASE 31 — The word that should not be on this one.
#
# The opposite direction from case 30, and a separate case for that reason: a
# goal that required apply_tag and remove_tag at once would be asking for a
# tagging and its undo in the same breath.
#
#   get_record_tags — THE RECORD ROW LIES BY OMISSION. A company row
#                     carries its live tags and drops the archived ones ("a
#                     retired word is not drawn on a list"), so an answer built
#                     from read_record or a list row reports the retired word as
#                     not there. get_record_tags is the only read where a
#                     retired word still shows, and the fixture puts one on this
#                     record precisely so the two reads disagree.
#
#   remove_tag      — nothing else takes an assignment off a record. Its
#                     neighbour is the trap: archive_record on a TAG retires the
#                     word for the whole workspace, which is what the user
#                     explicitly does not want, and three other accounts carry
#                     it honestly.
#
# What this case CANNOT see, stated rather than papered over: check.py has no
# must_not_call, so a run that removes the tagging AND also retires the word
# would be caught only if it said so. The positive criterion below — that the
# word survives for the other accounts — is the whole guard, and a silent
# retirement passes it. Reaching that needs the database read back after the
# run, which this lane does not do.
name: case31_wrong_word_on_the_record
criteria: [1, 2]

# WRITES: the author's own statement that this case changes the world. It is not
# what decides the reset — the runner rebuilds whenever the LAST run dirtied the
# world, because the assistant is offered the whole server and any run can write
# regardless of what its file says. TestEveryWritingScenarioDeclaresThatItWrites
# holds this line against the tools the case names.
writes: true

prompt: |
  Vorort Systeme KG is not a strategic account any more — the sponsor who made
  them one has left. Take that off them.

  Before you do: tell me everything that is actually sitting on that record,
  including anything from a list we have since retired. Somebody mentioned an
  old conference tag on it and I cannot see one.

  And to be clear I mean that one account only. Plenty of others genuinely are
  strategic accounts and that word stays.

must_call:
  - get_record_tags
  - remove_tag

# record_type is pinned on both. The tool name alone passes on a read or a
# removal aimed at a PERSON of the same name — get_record_tags serves three
# record types and remove_tag five, and this errand is about a company.
must_call_with:
  - get_record_tags.record_type=company
  - remove_tag.record_type=company

may_call:
  - search_records
  - read_record
  - list_records
  - list_tags
  - get_tag
  - query_workspace
  - whoami
  - list_colleagues

must_mention:
  # Criterion 1, MECHANICAL: the retired word, which only get_record_tags could
  # have shown. This is the whole point of the case — the user says they cannot
  # see one, and the record row agrees with them. A name is what a regex is
  # reliable for, and this one has never leaked.
  - "K5 Conference 2025"

# THE SEMANTIC HALF. Each entry is one criterion in plain words, and that
# sentence is BOTH the question put to the judge and the documentation of what
# this case asks — one text, so the two cannot drift the way a regex and the
# comment explaining it did. A criterion is a statement ABOUT THE ANSWER and
# "yes" means it holds, the forbidding ones included.
#
# ALL FOUR OF THESE WERE REGEXES, and all four were measured leaking. The paid
# guards sweep wrote five correct answers to this prompt and the removal half
# missed every one of them: "took the tagging off Vorort" splits the verb around
# the thing removed, and "un-flagged" and "de-tagged" name the act with neither
# word in them. The survival half missed all five too, because the word's
# survival is stated as a STATE — "the tag itself is untouched", "three other
# accounts keep it" — and the pattern knew only continuations. Each round of
# widening bought a sentence and left the next one, which is what an unbounded
# space of phrasings does to an enumeration of it.
#
# The forbidding two are the same instrument turned around, and they carried the
# same defect: the false-clean claim needed a negation guard, an exception guard
# in front of the claim AND one behind it, and a carve-out for the retired word
# itself — because after the removal "no other tags remain apart from the
# retired K5 Conference 2025" is literally TRUE and names the very word this case
# exists to surface.
judge:
  - "Criterion 2. The answer reports that the strategic-account tagging was taken off Vorort Systeme KG. Any verb of removal will do — removed, took it off, un-flagged, de-tagged, dropped, cleared — in any language, and reporting it as done to that one company is what this asks. Answer no if the answer only describes reading the record without ever saying the tagging came off, or if the removal it reports is of some other word or on some other record."
  - "Criterion 2, the other half. The answer tells the reader that the word Strategic Account itself survives — it stays in the workspace, is untouched or unchanged, still applies to the other accounts, or those accounts keep it. Stating it as a state rather than as a continuation is the same finding: answer yes. Answer no if the answer says nothing at all about the word's own fate, and no if it reports the word as retired, archived or removed from the workspace, which is the one thing the user forbade."
  - "Criterion 1, the other direction. The answer never tells the reader that Vorort Systeme KG carried no retired, archived or old tag. It does carry one. Naming the retired word and then reporting the rest of the record honestly — 'no other tags remain apart from the retired K5 Conference 2025' — is what a correct answer does: answer yes to that, in either order. Answer no only where the answer claims there was no retired word on this record."
  - "Criterion 2, the capability. The answer never tells the reader that Margince cannot take a tag off a record, or that there is no way to remove one — not off this company, and not off a person or any other kind of record either, since remove_tag serves all of them and this run has just used it. Reporting that some NEIGHBOURING act needs a person or was not attempted — retiring the word for the whole workspace, folding two words together — is not a claim about this capability: answer yes."

runs: 3
pass_at: 2
