# CASE 31 — The word that should not be on this one.
#
# The opposite direction from case 30, and a separate case for that reason: a
# goal that required apply_tag and remove_tag at once would be asking for a
# tagging and its undo in the same breath.
#
#   get_record_tags — THE RECORD ROW LIES BY OMISSION. A company row
#                     carries its live tags and drops the archived ones ("a
#                     retired word is not drawn on a list"), so an answer built
#                     from read_record or a list row reports the retired word as
#                     not there. get_record_tags is the only read where a
#                     retired word still shows, and the fixture puts one on this
#                     record precisely so the two reads disagree.
#
#   remove_tag      — nothing else takes an assignment off a record. Its
#                     neighbour is the trap: archive_record on a TAG retires the
#                     word for the whole workspace, which is what the user
#                     explicitly does not want, and three other accounts carry
#                     it honestly.
#
# What this case CANNOT see, stated rather than papered over: check.py has no
# must_not_call, so a run that removes the tagging AND also retires the word
# would be caught only if it said so. The positive criterion below — that the
# word survives for the other accounts — is the whole guard, and a silent
# retirement passes it. Reaching that needs the database read back after the
# run, which this lane does not do.
name: case31_wrong_word_on_the_record
criteria: [1, 2]

# WRITES: the author's own statement that this case changes the world. It is not
# what decides the reset — the runner rebuilds whenever the LAST run dirtied the
# world, because the assistant is offered the whole server and any run can write
# regardless of what its file says. TestEveryWritingScenarioDeclaresThatItWrites
# holds this line against the tools the case names.
writes: true

prompt: |
  Vorort Systeme KG is not a strategic account any more — the sponsor who made
  them one has left. Take that off them.

  Before you do: tell me everything that is actually sitting on that record,
  including anything from a list we have since retired. Somebody mentioned an
  old conference tag on it and I cannot see one.

  And to be clear I mean that one account only. Plenty of others genuinely are
  strategic accounts and that word stays.

must_call:
  - read_tags
  - change_tags

# record_type is pinned on both. The tool name alone passes on a read or a
# removal aimed at a CONTACT of the same name — get_record_tags serves three
# record types and remove_tag five, and this errand is about a company.
must_call_with:
  - read_tags.mode=record
  - change_tags.action=remove
  - read_tags.record_type=company
  - change_tags.record_type=company

may_call:
  - search_records
  - read_record
  - list_records
  - query_workspace
  - whoami
  - read_workspace

must_mention:
  # Criterion 1, MECHANICAL: the retired word, which only get_record_tags could
  # have shown. This is the whole point of the case — the user says they cannot
  # see one, and the record row agrees with them. A name is what a regex is
  # reliable for, and this one has never leaked.
  - "K5 Conference 2025"

# CRITERION 2 is held by the end state below, which reads the world after the
# run: the tagging is off Vorort Systeme KG, and the word itself still marks the
# other three accounts. Nothing in it needs a judge, so the case costs one short
# run per attempt.
must_end_with:
  - company "Vorort Systeme KG" untagged=Strategic Accts
  - tag "Strategic Account" records=3

runs: 3
pass_at: 2
