# CASE 2 — When somebody hands you a business card.
#
# Criterion 4: the assistant REPORTS the possible duplicate it filed. The
# create's own answer carries it, so this is purely about whether the assistant
# reads what came back and says it — a queue nobody is told about is a queue
# nobody reads.
#
# The card arrives as FIELDS. Reading the photo is the assistant's job and
# Margince never sees an image.
name: case2_business_card
criteria: [4]

# WRITES: the author's own statement that this case changes the world. It is not
# what decides the reset — the runner rebuilds whenever the LAST run dirtied the
# world, because the assistant is offered the whole server and any run can write
# regardless of what its file says. TestEveryWritingScenarioDeclaresThatItWrites
# holds this line against the tools the case names.
writes: true

prompt: |
  I met her at a conference. Tech Sauce in Bangkok actually. Add her to the crm.
  The card says: Lucy Vo, Cybersecurity Sales Manager, Terralogic,
  lucy.vo@terralogic-vn.test, +84 28 3825 6789

must_call:
  - create_record
may_call:
  - resolve_entities
  - search_records
  - read_record
  - apply_tag
  - query_workspace

must_mention:
  - "Lucy Vo"
  # Criterion 4, MECHANICAL and the weaker half of the pair: the vocabulary of a
  # queued match appears at all. It cannot be the case's proof, because the
  # DENIAL is written in the same words — "Margince found nothing resembling her
  # already on file" satisfies this through the bare "already". What catches the
  # denial is the judged half below.
  - "duplicate|already|possible match|review|similar"

# CRITERION 4, THE OTHER DIRECTION, AND WHY IT IS NOT A REGEX.
#
# A flat pattern over the whole answer cannot tell WHICH RECORD a denial is
# about, and this prompt creates two: a CONTACT who has a possible duplicate in
# the queue, and a COMPANY that genuinely has none. "Terralogic, domain
# terralogic-vn.test (new; no existing record matched)" is grounded —
# resolve_entities answered `unresolved` with no matches — and it is a sentence
# the asker wants. The pattern that stood here forbade it, and red two of three
# runs that had reported the contact's duplicate correctly in the paragraph
# above.
#
# The subject of a denial is what decides it, and a subject is semantic.
judge:
  - "Criterion 4, the other direction. The answer never gives the reader an all-clear about the PERSON: no claim that nothing resembling Lucy Vo was already on file, that the duplicate check turned nothing up against her, that there were no possible matches for her, or that there is nothing for anybody to review. A possible duplicate of her IS queued, so each of those is false. Two kinds of sentence are NOT this criterion's subject and are answered yes. First, anything said about the COMPANY: Terralogic really is new and nothing matched it, so 'no existing organization matched' is true. Second, a statement about the WRITE rather than about what was found: 'no duplicate record was created', 'the match is only flagged, nothing was merged'. Answer no only where the answer tells the reader that the search for a matching person found nothing."

runs: 3
pass_at: 2
