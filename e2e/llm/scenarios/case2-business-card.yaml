# CASE 2 — When somebody hands you a business card.
#
# Criterion 4: the assistant REPORTS the possible duplicate it filed. The
# create's own answer carries it, so this is purely about whether the assistant
# reads what came back and says it — a queue nobody is told about is a queue
# nobody reads.
#
# The card arrives as FIELDS. Reading the photo is the assistant's job and
# Margince never sees an image.
name: case2_business_card
criteria: [4]

# WRITES: the author's own statement that this case changes the world. It is not
# what decides the reset — the runner rebuilds whenever the LAST run dirtied the
# world, because the assistant is offered the whole server and any run can write
# regardless of what its file says. TestEveryWritingScenarioDeclaresThatItWrites
# holds this line against the tools the case names.
writes: true

prompt: |
  I met her at a conference. Tech Sauce in Bangkok actually. Add her to the crm.
  The card says: Lucy Vo, Cybersecurity Sales Manager, Terralogic,
  lucy.vo@terralogic-vn.test, +84 28 3825 6789

must_call:
  - create_record
may_call:
  - resolve_entities
  - search_records
  - read_record
  - apply_tag
  - query_workspace

must_mention:
  - "Lucy Vo"
  # Criterion 4: a possible duplicate was filed and the user is told.
  - "duplicate|already|possible match|review|similar"

must_not_mention:
  # The earlier run said this while a candidate sat in the queue.
  #
  # THREE SPELLINGS WERE NOT THE CLAIM. "Margince found nothing resembling her
  # already on file" is the same false all-clear, and it also satisfies the
  # required half above through the bare word "already" — the denial scoring as
  # the report. So the denial is forbidden in the registers a model writes it,
  # while the answer that DID find the candidate stays green: "no duplicate was
  # created" is a true statement about the write, and only a claim that nothing
  # was FOUND is forbidden here.
  - "no duplicates|nothing similar|no existing|nothing resembling|nobody (?:similar|resembling|like)|no (?:possible|potential|near|close|obvious|likely) match(?:es)?|no match(?:es)? (?:was |were |)(?:found|filed|flagged|raised|in the)|no (?:similar|comparable|matching) (?:contact|person|record|entry|entries)|nothing (?:was |were |)(?:flagged|queued) for review|(?:did not|didn'?t|nothing) (?:flag|turn up|come back|match)"

runs: 3
pass_at: 2
