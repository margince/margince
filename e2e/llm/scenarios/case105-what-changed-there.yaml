# CASE 105 — Near neighbour of case104. Reading what changed must not spend the marker the answer is counted from.
name: case105_what_changed_there
criteria: [1]
writes: true

prompt: |
  What changed at Reply Deutschland since I last looked?

must_call:
  - read_context|read_attention|read_record|read_details|find_records|search_records

must_not_call_with:
  - change_attention~acknowledge_company_view

may_call:
  - find_records
  - search_records
  - read_record
  - read_context
  - read_details
  - read_workspace
  - whoami
  - read_attention

must_mention:
  - "Reply Deutschland"

runs: 3
pass_at: 2
