# CASE 105 — Near neighbour of case104. Reading what changed must not spend the marker the answer is counted from.
name: case105_what_changed_there
title: What changed there?
criteria: [1]
writes: true

prompt: |
  What changed at Reply Deutschland since I last looked?

must_not_call_with:
  - change_attention~acknowledge_company_view

may_call:
  - find_records
  - search_records
  - read_record
  - read_context
  - read_details
  - read_workspace
  - whoami
  - read_attention

must_mention:
  - "Reply Deutschland"
  # Only the records name these: the deal, the company's full name, its people
  # and its latest activities. An answer that names none of them read nothing.
  - "(?i)Verlängerung|Betreuerwechsel|Sofia|Jonas|Katrin|Post-mortem|Nachfrage"

runs: 3
pass_at: 2
