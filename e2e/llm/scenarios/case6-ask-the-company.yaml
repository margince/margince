# CASE 6 — Ask the company.
#
# The sharpest assertion in the whole lane, and the half of #2059 no
# deterministic test can reach.
#
# The seeded history contains a deliberate contradiction: an email dated in
# September, and a post-mortem note whose prose says the complaint was raised
# "im Oktober". The Go suite proves BOTH reach the caller and the record carries
# its date — so the assistant has the choice. This scenario asks whether it
# makes the right one.
#
# The record is right. The prose is wrong. An answer that says October has
# repeated a human's faulty memory back to the person about to walk into the
# meeting.
name: case6_ask_the_company
criteria: [1, 3, 5]

# WRITES: nothing — this case only reads. Said out loud because a scenario that
# does not say is refused: an absent or misspelled field used to arrive as the
# value that skips work, so a forgotten declaration and a deliberate one were the
# same silence.
writes: false

prompt: |
  We are about to change the account manager on one of our major accounts, and
  in the past customers complained if we swapped the responsible people too
  much. Did we have it in the past, what happened, how did we react, what should
  I be prepared for? Is there something we can learn? Check in our CRM.

must_call:
  - search_context
may_call:
  - query_workspace
  - catch_me_up_on
  - read_record
  - search_records

# WHAT IS A REGEX HERE AND WHAT IS A JUDGE, and why.
#
# must_mention below is MECHANICAL: does the answer carry this date, do the
# account names appear. A regex is reliable for that and cheap, and neither has
# ever leaked.
#
# The two criteria under `judge:` are SEMANTIC — did the answer notice that two
# sources disagree, and did it avoid adopting the wrong one — and those are what
# no regex in this repository has ever held. This file carried a 2,000-character
# alternation for them and it was rewritten five times: every round of human
# review found a correct answer scored red AND a wrong answer scored green, each
# round's fix introducing the next round's finding, and two paid sweeps of
# scripts/e2e-llm-guards.sh then measured 15% and 20% of correct answers scored
# as failures over 183 and 230 model-written candidates. The 120 committed
# fixtures still passed both times: the leaks were never regressions, they were
# new phrasings, and the space of phrasings does not end.
#
# What the alternation could never reach is written down in its own epitaph. An
# invented recurrence carrying no month at all — "Reply Deutschland said it twice
# before anyone wrote it down" — is the same defect with nothing to anchor to,
# and "said it twice" is also a true sentence about the two November emails, so
# a pattern wide enough to catch it fails a correct answer. A sentence-level
# reader is the only thing that reaches it, and now there is one.

# Criterion 3, MECHANICAL: the record wins. September is what the email says.
#
# "Sep" is in the alternation because a real answer writes the date the way a
# person does — every run of 2026-08-27 said "18 Sep 2025" and the pattern,
# which demanded the month spelled out or a numeric 09, called all three a
# failure. That was a bug in this file, not in the answer.
must_mention:
  - "September|Sept|Sep 2025|09/|09-|-09-"
# Criterion 1, MECHANICAL: it found the accounts without being told which.
  - "Reply|valantic|Körber"

# THE SEMANTIC HALF. Each entry is one criterion in plain words, and that
# sentence is BOTH the question put to the judge and the documentation of what
# this case asks — one text, so the two cannot drift the way a regex and the
# comment explaining it did.
#
# A criterion is a statement ABOUT THE ANSWER and "yes" means it holds, for the
# forbidding ones too: "the answer never claims X" is answered yes by an answer
# that did not claim X. Both are held offline by scripts/test-e2e-llm-check.sh
# against every fixture in e2e/llm/testdata/case6/, whose verdicts are recorded
# from a real judge; a criterion reworded here misses its recordings and fails
# loudly rather than replaying a verdict about the question that used to be
# asked.
judge:
  - "Criterion 5. The answer tells the reader that the post-mortem note and the CRM record disagree about when the complaint was raised: it names the disagreement, or calls the note's October date wrong or loosely recalled, or says that no October complaint exists in the system. Answer no if the answer never compares the two dates at all, or if it silently picks one and leaves the reader unaware there was a conflict. It does not matter which words carry the finding, whether it is split over several sentences, or which language it is in."
  - "Criterion 3. The answer never states in its own voice that the customer complained, escalated, repeated a complaint or followed up in October, and never invents a second complaint that the record does not carry. Quoting the note or attributing the October date to it — 'the post-mortem says October, but the record is dated 18 September' — is exactly what a correct answer does: answer yes to that. Denying an October event ('nothing was logged in October') is also correct: answer yes. Answer no only where the assistant adopts an October event as a fact of its own."

runs: 3
pass_at: 2
