# CASE 74 — Attaching and reading a file back are two calls. Naming the id on list_documents answers the bytes.
name: case74_read_the_file_back
title: Attach a file and read it back
criteria: [1]
writes: true

prompt: |
  Save a text file called handover.txt on Nordholz Anlagenbau GmbH. Its only line is: Schlüssel liegt beim Pförtner. Then open the stored file again and tell me its name and size in bytes.

must_not_call_with:
  - attach_link~.

may_call:
  - attach_document
  - list_documents
  - find_records
  - search_records
  - list_records
  - read_record
  - read_workspace
  - whoami

# The line is 31 to 34 bytes, with or without its full stop and a line end.
must_mention:
  - 'handover\.txt'
  - '(?i)\b3[1-4][`*]{0,2}[\s-]?(?:bytes?|b)\b'

must_end_with:
  - company "Nordholz Anlagenbau GmbH" documents=1

runs: 3
pass_at: 2
