# CASE 85 — How a project is going has its own reading. It does not move the project's phase.
name: case85_the_pilot_slipped
title: The pilot slipped
criteria: [1]
writes: true

prompt: |
  The Leitstand Goslar project slipped a month, and I would call it at risk now. Record that as the project's health.

# A note beside the act is no fault: the end state finds the act or fails the run.
must_not_call_with:
  - change_state~move_project

may_call:
  - find_records
  - search_records
  - read_record
  - read_workspace
  - whoami
  - read_project
  - change_state

must_mention:
  - "Goslar"

must_end_with:
  - project "Leitstand Goslar" health=at_risk

runs: 3
pass_at: 2
