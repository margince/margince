# CASE 85 — How a project is going has its own reading. It does not move the project's phase.
name: case85_the_pilot_slipped
criteria: [1]
writes: true

prompt: |
  The Leitstand Goslar project slipped a month, and I would call it at risk now. Record that as the project's health.

must_call:
  - change_state

must_call_with:
  - change_state.action=record_project_health

must_call_matching:
  - create_project_health_assessment~"state": "at_risk"

must_not_call_with:
  - change_state~move_project
  - log_activity~.

may_call:
  - find_records
  - search_records
  - read_record
  - read_workspace
  - whoami
  - read_project

must_mention:
  - "Goslar"

runs: 3
pass_at: 2
