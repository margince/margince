# CASE 5 — Before the meeting.
#
# Two [M] criteria the Go suite cannot reach:
#
#   Criterion 1 — a briefing arrives without naming a record. The prompt says
#   "Vietnam partner", which is not the account's name. Finding it is the test.
#
#   Criterion 5 — the unkept promise. Somebody said they would send something
#   and there is no record it went. The fixture builds that gap deliberately;
#   noticing it is the highest-value thing this case produces, and it needs a
#   model to read across the timeline.
#
# The calendar half stays out. The prompt says "check my calendar" because the
# real one did, and an assistant with no calendar connected should say so and
# carry on rather than stopping.
name: case5_before_the_meeting
criteria: [1, 2, 5]

# WRITES: nothing — this case only reads. Said out loud because a scenario that
# does not say is refused: an absent or misspelled field used to arrive as the
# value that skips work, so a forgotten declaration and a deliberate one were the
# same silence.
writes: false

prompt: |
  Hey. Tomorrow I'm meeting, uh, finally, Vietnam partner. Could check in my
  calendar. Can you prep me for the meeting? Check in the CRM.

must_call:
  - search_records
may_call:
  - prep_for_meeting
  - account_coverage
  - catch_me_up_on
  - query_workspace
  - read_record
  - search_context
  - who_knows

must_mention:
  # Criterion 1: it found the account from a description, not a name.
  # "JSC", not "Vietnam Partner" alone. The prompt already says "Vietnam
  # partner", so the old assertion was satisfied by echoing the question back
  # and could not tell a run that FOUND the account from one that repeated the
  # user. The legal suffix appears only on the record.
  #
  # It is thin — the fixture named the company after the description the user
  # gives, so there is no other token the workspace alone can supply. Mai
  # Nguyen below is the stronger evidence that the record was opened, and this
  # entry is the weaker half of a pair rather than the case's proof.
  - "Vietnam Partner JSC|\bJSC\b"
  # Criterion 5: the promise nobody kept. The fixture logs an outbound message
  # saying the list would be sent, and nothing after it.
  # THE UNKEPT PROMISE, which the header calls the highest-value thing this
  # case produces. A bare "list" matched; so did "no record" — so an answer
  # DENYING the finding ("there is no record of Mai Nguyen, nothing was
  # promised") scored the criterion. Anchored to something being owed and not
  # delivered.
  - "(?:Aufstellung|breakdown|summary)[\s\S]{0,120}(?:waiting|no reply|outstanding|never (?:replied|came|sent)|quiet|promis\w*|zugesagt|owed)|(?:waiting for them|no reply|outstanding|promis\w*|zugesagt|owed)[\s\S]{0,120}(?:Aufstellung|breakdown|summary)"
  # Criterion 2's server half is already pinned; here it must NAME the people
  # rather than describing seats.
  - "Mai Nguyen"

must_not_mention:
  # An assistant that cannot see a calendar must say so, not invent a meeting.
  - "I have scheduled|I've added the meeting"

runs: 3
pass_at: 2
