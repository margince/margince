# CASE 90 — The user's own language is not the language the whole company writes in.
name: case90_show_it_in_german
criteria: [1]
writes: true

prompt: |
  Please switch my Margince to German. Only mine, my colleagues keep theirs.

must_call:
  - change_my_settings

must_call_with:
  - change_my_settings.action=save_locale

must_call_matching:
  - 'change_my_settings~"locale": "de"'

must_not_call_with:
  - change_settings~.

may_call:
  - read_workspace
  - whoami

runs: 3
pass_at: 2
