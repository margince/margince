# CASE 116 — The FX sheet and the company logo are workspace setup, written
# through change_settings. The logo comes as base64, as attach_document takes a
# file, and is attached to no record.
name: case116_the_rate_and_the_logo
criteria: [1, 2]
writes: true

prompt: |
  Two setup jobs. Finance gave us today's rate: one USD is 0.92 EUR. Please put that on the rate sheet.
  And this is our new logo, a PNG, already in base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
  Please set it as our company logo, the wide one.

must_call:
  - change_settings

must_call_with:
  - change_settings.action=set_fx_rate
  - change_settings.action=upload_company_logo

must_call_matching:
  - 'change_settings~"from_currency": "USD"'
  - 'change_settings~"rate": "0\.92"'
  - 'change_settings~iVBORw0KGgo'

must_not_call_with:
  - attach_document~.
  - update_record~.
  - log_activity~.

may_call:
  - read_workspace
  - whoami
  - list_documents

runs: 3
pass_at: 2
