# CASE 102 — The Voice DNA is the user's own. Its preferences go to change_my_settings, and no workspace template changes.
name: case102_shorter_in_my_voice
title: Shorter, in my voice
criteria: [1]
writes: true

prompt: |
  My drafts come out too long. Add to my Voice DNA that I keep mails under five sentences. Create it if I have none.

# The end state reads the Voice DNA by one glob word and cannot tell five from
# 5, so the number the user gave is held on the call that saved it.
must_call:
  - change_my_settings

must_call_matching:
  - 'change_my_settings~(?i)(five|5)[- ]sentences?'

must_not_call_with:
  - change_settings~.

may_call:
  - read_workspace
  - read_view
  - whoami

must_end_with:
  - me "admin@demo.test" voice=*sentence*

runs: 3
pass_at: 2
