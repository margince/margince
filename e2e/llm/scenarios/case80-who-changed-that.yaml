# CASE 80 — The workspace's trail is a read of its own. This case holds only the choice of tool, because the trail's content moves with the run.
name: case80_who_changed_that
criteria: [1]
writes: false

prompt: |
  I want the audit trail. Show me the last things that were changed across the workspace and who changed them.

must_call:
  - read_workspace

must_call_with:
  - read_workspace.topic=audit_log

may_call:
  - whoami

runs: 3
pass_at: 2
