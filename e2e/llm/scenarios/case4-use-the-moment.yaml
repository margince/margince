# CASE 4 — Use the moment.
#
# The [M] criteria the Go suite cannot answer: criterion 6, the assistant
# telling the rep to check with the owner before turning up.
#
# The prompt is the HARD version, verbatim from the 2026-08-26 run. It never
# says "companies", never says "address", never says "distance", and names no
# tool. Working out that "nearby" is a question the workspace can be asked at
# all — and that it can ASK which fields carry a place — is the whole case.
#
# Do NOT replace it with the earlier scripted wording ("Which customers are
# nearby? Rank them by fit and relationship strength"). That version hands over
# the answer and tests something materially easier.
#
# WHAT "NEARBY" CAN BE ANSWERED WITH HERE, and it is a fact about this stack
# rather than about the product. The three Köln companies carry an address and
# no coordinates: the public API has no field for a point and no geocoder runs
# in the LLM stack, so nothing places them. A `within_radius` plan therefore
# matches none of them and a filter on address.city matches all three, which is
# why nothing below requires the radius plan — requiring it would reward a call
# that comes back empty. The route is not the assertion; what is asserted is
# that the assistant finds the companies, names whose they are, and never
# reports that this workspace cannot answer where anybody is.
#
# The Go suite measures the radius half, because it seeds the coordinates
# through SQL that the API carries no way to express.
name: case4_use_the_moment
criteria: [1, 6]

# WRITES: nothing — this case only reads. Said out loud because a scenario that
# does not say is refused: an absent or misspelled field used to arrive as the
# value that skips work, so a forgotten declaration and a deliberate one were the
# same silence.
writes: false

prompt: |
  hey I am in cologne right now and wanted to visit a client but my appointment
  got canceled. Anyone nearby in our crm I should visit?

# The route is the model's: a city filter, a search or query_workspace all find
# the three. The answer has to name at least one of them.
may_call:
  - query_workspace
  - read_workspace
  - search_records
  - read_record
  - search_context

# Criterion 6. Naming a nearby company is not enough — two thirds of the CRM
# belongs to somebody else, and an assistant that knows the owner and does not
# say so sends a rep into a colleague's account.
must_mention:
  - "Dom Digital|Rheinufer|Vorort Systeme"
  - "Sofia Meier|Lena Fischer|Phạm Hương Giang"

# CRITERION 6 is the ADVICE, not the fact: "all three are owned by Sofia Meier"
# knows the owner and says nothing about what to do. Advice has more wordings
# than a pattern can list, so a judge reads it.
judge:
  - "Criterion 6. The answer tells the reader to go through the account's owner before visiting: to ask, check with or tell the owner first, or that the visit is the owner's call. Naming the owner by first name, full name or a pronoun that follows the name all count. Answer no if it only names who owns each company without saying what that means for the visit, or if it advises calling or checking first without naming whom to go through."

# Run 1 of the real scenario failed exactly here: correct companies, and it
# never said whose they were, because the row carried a bare uuid.
must_not_mention:
  # "No address field" is the defect when it is said of the workspace, and true
  # when it is said of LEADS, which carry none: a sentence that names leads is
  # an aside about what was searched, not a claim that nearby cannot be found.
  - "(?:^|[.!?\n])(?![^.!?\n]*\bleads?\b)[^.!?\n]*no address field|cannot determine location|unable to search by distance"

runs: 3
pass_at: 2
