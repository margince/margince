# CASE 77 — A user who asks for it by name gets consent recorded through change_compliance, with the wording the contact agreed to.
name: case77_record_her_yes
criteria: [1]
writes: true

prompt: |
  Yes, please record it: Katrin Sommer at Reply Deutschland agreed to our marketing emails today. The wording I
  showed her was "You agree that we may send you our newsletter." I checked this with her myself, so go ahead.

must_call:
  - change_compliance

must_call_with:
  - change_compliance.action=record_consent

must_call_matching:
  - record_consent~"wording": "You agree that we may send you our newsletter\."

must_not_call_with:
  - update_record~consent
  - log_activity~.

may_call:
  - find_records
  - search_records
  - read_record
  - read_workspace
  - whoami
  - read_view

runs: 3
pass_at: 2
