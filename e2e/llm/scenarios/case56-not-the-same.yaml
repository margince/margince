# CASE 56 — Not the same contact.
#
# A business card files a possible duplicate when the contact it names is already here.
# Here the user knows better: the other Lucy Vo on file is a different contact.
# decide_duplicate is the verb for that call. It is undoable (decision reopen
# lifts it), which is the whole reason an assistant may make it, and it is the
# one acting tool on this surface no other case drives.
#
# WHAT IS HELD: the dismissal is made with the pair the create reported, by
# candidate_id, and the answer does not claim the two were merged. merge_records
# is not in may_call and the answer may not report a merge, which
# must_not_mention below holds; the lane does not fail a run for an extra call
# by itself.
name: case56_not_the_same
title: Not the same contact
criteria: [1, 2]

writes: true

prompt: |
  I met her at a conference. Tech Sauce in Bangkok actually. Add her to the crm.
  The card says: Lucy Vo, Cybersecurity Sales Manager, Terralogic,
  lucy.vo@terralogic-vn.test, +84 28 3825 6789

  I know the CRM will say there is already a Lucy Vo. That is a different
  one, at another company, nothing to do with her. Make sure the two are
  not flagged as the same woman.

# Two contacts share the name, so no end-state entry can read either one's
# fields, and no form reads a dismissed pair. The dismissal and the card's own
# words are held on their calls.
must_call:
  - resolve_duplicates
  - create_record

must_call_with:
  - resolve_duplicates.decision=not_the_same

# The card's own words make the contact. The address carries the company's
# domain too, so Terralogic is matched where it is not the address.
must_call_matching:
  - 'create_record~lucy\.vo@terralogic-vn\.test'
  - 'create_record~terralogic(?!-vn)'

must_not_call_with:
  - change_capture~import_vcards

# Held on the MCP door only: the REST door names the decision on the pair's disposition
# route, not as a decision argument. A REST run is graded on everything else: the answer,
# and the records it leaves.
mcp_only:
  - resolve_duplicates.decision=not_the_same

may_call:
  - read_tags
  - change_tags
  - resolve_entities
  - search_records
  - read_record
  - query_workspace
  - whoami

must_mention:
  - "Lucy Vo"
  - "not (?:the same|a duplicate|flagged)|different (?:pers\w+|woman|contact)|dismiss|keep(?:ing)? (?:them )?separate"

must_not_mention:
  # A merge reported: the user said they are different contacts.
  - "(?:I|we)(?:'ve| have)? merged"

# The new card beside the Lucy Vo the seed holds, and no merge of the two.
must_end_with:
  - contact "Lucy Vo" records=2

runs: 3
pass_at: 2
