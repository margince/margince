# CASE 7 — Ask for a number.
#
# The regression guard for a description that stopped carrying its own
# vocabulary.
#
# `run_report` used to recite, into its `report` argument, every prebuilt
# report's grouping, filter and measure names — 3.4KB, six per cent of the
# served tool catalog in one tool. That moved to margince://schema/reports, with
# describe_vocabulary (topic report_vocabulary) as the door, and what stayed behind is the enum plus
# the fact that a wrong name is refused BY name with that argument's accepted
# list.
#
# So this scenario asks a question whose answer is a NUMBER broken down by a
# dimension whose name the model is not told: `meeting_status`. Four routes are
# legitimate and the scenario is deliberately indifferent between them —
#
#   - guess `meeting_status`, which is a good guess, and be right first time;
#   - guess wrong, read the refusal, and use the list it carries;
#   - open describe_vocabulary and read the names;
#   - take the same population through the analytics engine instead, which is
#     where the catalog's silence about `meeting_status` sends a careful reader.
#
# What it is NOT indifferent about is the fourth outcome: concluding that this
# workspace cannot answer the question. That is the failure the query vocabulary
# already produced once in the field — a client probed four spellings of a geo
# field, was correctly refused four times, and told its user the workspace held
# no addresses at all. Honest refusals, false conclusion.
#
# THIS LANE IS A TOOLS-ONLY CLIENT. scripts/e2e-llm.sh passes `--tools ""`,
# which disables the built-ins including resource reading, so the document is
# unreachable here by construction. The lane measures the door and the refusals;
# nothing in it can measure the resource.
#
# MEETINGS, BECAUSE THE REPORT COUNTS MEETINGS AND TASKS ONLY. Email, messages,
# calls and notes are outside the activities population, so a question about
# mail would have an honest answer of "reports do not count it". The seed holds
# meetings in two standings: case 23 books two (`booked`) and case 59 logs one
# signing (`held`).
#
# WHAT IS NEVER ASSERTED HERE IS THE ARITHMETIC. Other scenarios add meetings on
# the runs that precede this one, so a count named in this file would move with a
# sibling scenario. What is asked instead is that the answer carries a count per
# standing at all — which is criterion 1 below, and a judgement rather than a
# pattern for exactly that reason.
name: case7_ask_for_a_number
criteria: [1, 3]

# WRITES: nothing — this case only reads. Said out loud because a scenario that
# does not say is refused: an absent or misspelled field used to arrive as the
# value that skips work, so a forgotten declaration and a deliberate one were the
# same silence.
writes: false

prompt: |
  Of the meetings in the CRM, how many have actually taken place and how many
  are only booked so far? I want the counts, not the individual meetings.

# EITHER ENGINE, AND THE POPULATION IS WHAT IS PINNED.
#
# Two doors answer this question from the same aggregate: run_report over the
# prebuilt `activities-by-kind` report, and run_analytics_query over the entity
# of that name. Both read the activity population and group it; neither is the
# wrong route. The catalog publishes each report's DEFAULT grouping and warns
# that a default is not that report's reach, but it names no dimension: a model
# that reads it, sees nothing resembling a meeting standing and follows run_report's own
# boundary sentence into the analytics engine has done what the surface told it
# to. Which door it takes is therefore the surface's answer, not the model's,
# and scoring the model for it measures the wrong party.
#
# Case 20 already refuses to pin which population answers a question that has
# more than one honest answer, for the same reason: failing a run for the engine
# it picked measures the model's taste, not the product.
#
# What IS the assertion is that the counts came from an aggregate over the
# activity population rather than from the model's own reading of the records —
# so the population name is pinned on whichever door was used. `group_by` stays
# unpinned: grouping by `meeting_status` and filtering to each standing in turn
# are both honest plans.
must_call:
  - run_report|run_analytics_query
must_call_with:
  - run_report.report=activities-by-kind|run_analytics_query.entity=activities-by-kind
may_call:
  # The doors, when a name is wanted rather than guessed. Optional on purpose:
  # a run that guesses `meeting_status` correctly and never opens one has done the
  # better thing, and requiring the call would score the cheap path as a failure.
  - read_workspace
  - query_workspace
  - search_records
  - list_records
  - read_record

# NOTHING MECHANICAL IS LEFT TO ASSERT HERE, and that is the finding rather
# than an omission. The number this case asks for is deliberately NOT a fixed
# one: other scenarios add meetings on the runs before this one, so an
# arithmetic assertion here would move with a sibling scenario. A bare "[0-9]"
# stood here once. What a bare digit
# actually holds is a date, which is the shape a run takes when it gave up on the
# report and described the tool — a PASS with no failing assertion anywhere to
# notice it.
#
# So the counts are judged: whether the answer gives a number for each standing
# is a question about what the sentence reports, and the report answers in
# German as readily as in English.
#
# AND ONE REGEX IS DELETED WITHOUT A REPLACEMENT. It forbade handing back the
# grouping and filter names in place of the numbers, which is now exactly what
# criterion 1 fails: an answer that spends its turn on the vocabulary carries no
# counts, and an answer that gives the counts AND names the fields it grouped by
# has answered the question. Requiring both would be two assertions on one
# question, and the second could only fire on an answer the first already caught.
judge:
  - "Criterion 1. The answer gives a count for each of the two standings — how many meetings have taken place (held), and how many are only booked so far. Two numbers, one per standing, in any language: the report answers in German too, so 'zwei gebucht, ein stattgefunden' is exactly as good as 'one held against two booked'. Answer no if the answer gives only a single total, or describes the split in words with no numbers behind it, or reports the report's grouping and filter names instead of the counts. Which of the two is larger, whether it also counts cancelled meetings or no-shows, and whether the answer hedges about precision, is not yours to judge."
  - "Criterion 3. The answer never tells the reader that Margince cannot break this question down: no claim that the report does not exist, that the CRM does not track whether a meeting took place, that the split is unsupported, or that this is a limitation of the product. A refusal of a wrong argument name says nothing about what the workspace can answer, and turning one into the other is the failure this case exists for — it stops the person asking. A caveat about how ROUGH this answer is ('the counts move as people log things', 'I would not call it exact') is honest and says nothing about the product: answer yes."

runs: 3
pass_at: 2
