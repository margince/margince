# CASE 7 — Ask for a number.
#
# The regression guard for a description that stopped carrying its own
# vocabulary.
#
# `run_report` used to recite, into its `report` argument, every prebuilt
# report's grouping, filter and measure names — 3.4KB, six per cent of the
# served tool catalog in one tool. That moved to margince://schema/reports, with
# describe_report_vocabulary as the door, and what stayed behind is the enum plus
# the fact that a wrong name is refused BY name with that argument's accepted
# list.
#
# So this scenario asks a question whose answer is a NUMBER broken down by a
# dimension whose name the model is not told: `direction`. Three routes are
# legitimate and the scenario is deliberately indifferent between them —
#
#   - guess `direction`, which is a good guess, and be right first time;
#   - guess wrong, read the refusal, and use the list it carries;
#   - open describe_report_vocabulary and read the names.
#
# What it is NOT indifferent about is the fourth outcome: concluding that this
# workspace cannot answer the question. That is the failure the query vocabulary
# already produced once in the field — a client probed four spellings of a geo
# field, was correctly refused four times, and told its user the workspace held
# no addresses at all. Honest refusals, false conclusion.
#
# THIS LANE IS A TOOLS-ONLY CLIENT. scripts/e2e-llm.sh passes `--tools ""`,
# which disables the built-ins including resource reading, so the document is
# unreachable here by construction. The lane measures the door and the refusals;
# nothing in it can measure the resource.
#
# WHAT IS NEVER ASSERTED HERE IS THE ARITHMETIC. The seed writes emails in both
# directions and one note, and case 1 and case 3 add activity of their own on the
# runs that precede this one, so a count named in this file would be a number that
# moves with a sibling scenario. What is asked instead is that the answer carries
# a count per direction at all — which is criterion 1 below, and a judgement
# rather than a pattern for exactly that reason.
name: case7_ask_for_a_number
criteria: [1, 3]

# WRITES: nothing — this case only reads. Said out loud because a scenario that
# does not say is refused: an absent or misspelled field used to arrive as the
# value that skips work, so a forgotten declaration and a deliberate one were the
# same silence.
writes: false

prompt: |
  Roughly how much of what we have logged in the CRM is us reaching out versus
  them coming to us? I want the counts, not the individual records.

must_call:
  - run_report

# The tool name alone is not the assertion. `must_call` would pass on a call to
# some OTHER report followed by invented inbound and outbound counts, and nothing
# that reads the closing prose can tell an invented number from a read one — so
# the report itself is pinned.
#
# `group_by` is deliberately NOT pinned. More than one plan answers this
# honestly: grouping by `direction`, or filtering to each direction in turn. What
# would be wrong is answering from a different report, and that is what this
# catches.
must_call_with:
  - run_report.report=activities-by-kind
may_call:
  # The door, when a name is wanted rather than guessed. Optional on purpose:
  # a run that guesses `direction` correctly and never opens it has done the
  # better thing, and requiring the call would score the cheap path as a failure.
  - describe_report_vocabulary
  - query_workspace
  - search_records
  - list_records
  - read_record

# NOTHING MECHANICAL IS LEFT TO ASSERT HERE, and that is the finding rather
# than an omission. The three regexes that stood in this place were a
# direction-vocabulary list, its mirror, and a bare "[0-9]" — and the number this
# case asks for is deliberately NOT a fixed one: the seed writes activity in both
# directions and case 1 and case 3 add more on the runs before this one, so an
# arithmetic assertion here would move with a sibling scenario. What a bare digit
# actually holds is a date, which is the shape a run takes when it gave up on the
# report and described the tool — a PASS with no failing assertion anywhere to
# notice it.
#
# So the counts are judged: whether the answer gives a number for each direction
# is a question about what the sentence reports, and the report answers in
# German as readily as in English.
#
# AND ONE REGEX IS DELETED WITHOUT A REPLACEMENT. It forbade handing back the
# grouping and filter names in place of the numbers, which is now exactly what
# criterion 1 fails: an answer that spends its turn on the vocabulary carries no
# counts, and an answer that gives the counts AND names the fields it grouped by
# has answered the question. Requiring both would be two assertions on one
# question, and the second could only fire on an answer the first already caught.
judge:
  - "Criterion 1. The answer gives a count for each of the two directions — how much was outbound, us reaching out, and how much was inbound, them coming to us. Two numbers, one per direction, in any language: the report answers in German too, so 'acht ausgehend, fünf eingehend' is exactly as good as 'seven outbound against four inbound'. Answer no if the answer gives only a single total, or describes the split in words with no numbers behind it, or reports the report's grouping and filter names instead of the counts. Which of the two is larger, and whether the answer hedges about precision, is not yours to judge."
  - "Criterion 3. The answer never tells the reader that Margince cannot break this question down: no claim that the report does not exist, that the CRM does not track direction, that the split is unsupported, or that this is a limitation of the product. A refusal of a wrong argument name says nothing about what the workspace can answer, and turning one into the other is the failure this case exists for — it stops the person asking. A caveat about how ROUGH this answer is ('the counts move as people log things', 'I would not call it exact') is honest and says nothing about the product: answer yes."

runs: 3
pass_at: 2
