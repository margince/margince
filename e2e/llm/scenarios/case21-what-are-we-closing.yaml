# CASE 21 — What are we closing.
#
# The forecast read, and the number beside the number.
#
# forecast_readings answers four money figures for a period, and its own
# contract says what a caller must do before quoting any of them: read
# `eligible_count` against `priced_count`. An unpriced deal is REAL pipeline
# contributing zero money — it is in the count and absent from the total — so a
# total quoted flat is arithmetically correct and tells the reader something
# false about how much pipeline it covers.
#
# That is the same defect case 6 is built around, in a different subsystem: the
# product hands over both facts, and the assistant chooses whether the reader
# gets one of them or both. Nothing deterministic can ask this, because every
# field arrives correctly either way.
#
# The seed makes the gap real rather than hypothetical: twelve deals fall in the
# current period — seven still open and five already won — and eleven of them
# carry an amount. The twelfth does not. A deal with no number on it is not a
# fixture contrivance — it is the single commonest state of a deal somebody
# created in a hurry after a call.
#
# THE GAP IS ONE DEAL WIDE and the counts around it are the fixture's, not this
# case's. What is asserted below is the FINDING — that the unpriced deal is named
# as absent from the money — so nothing here spells the totals: a pattern that
# hard-coded "six of seven" went stale the moment the fixture grew the won deals
# case 20 needs, and read as a passing case that had stopped asking anything.
#
# THE PROMPT NAMES NO TOOL and no period boundary. "This quarter" is the
# installation's own financial quarter, which need not start in January, and
# working that out is the forecast's job rather than the model's arithmetic.
name: case21_what_are_we_closing
criteria: [1, 4]

# WRITES: nothing — this case only reads. Said out loud because a scenario that
# does not say is refused: an absent or misspelled field used to arrive as the
# value that skips work, so a forgotten declaration and a deliberate one were the
# same silence.
writes: false

prompt: |
  Board call is Thursday and they will ask what we are bringing in this
  quarter. What does our pipeline actually say — and how much of that would you
  put your name to?

# The only tool that answers what a PERIOD is expected to close. run_report's
# forecast report and a hand-summed query_workspace both produce a number, and
# neither is the forecast: the readings apply the fiscal calendar, the base
# currency conversion and the weighting, and a total assembled beside them is a
# second answer to the same question.
must_call:
  - forecast_readings

may_call:
  # The readiness verdict and the open findings. Genuinely optional: this
  # workspace's nightly check ran before any deal existed, so neither has
  # anything to add here — and a run that opens them anyway has done the
  # careful thing rather than the wrong one.
  - forecast_input_checks
  - list_input_checks
  - data_coverage
  - run_report
  - run_analytics_query
  - list_records
  - query_workspace
  - read_record

must_mention:
  # It came back with money, not with a description of the forecast.
  # A MONEY FIGURE, not any digit. A bare [0-9] is satisfied by a date, an id
  # or a quarter label — and "the forecast for Q3 is EUR 0 across 0 deals"
  # passed it. The route is already held by must_call: forecast_readings, so
  # what this adds is that a FIGURE reached the reader.
  - "(?:\u20ac|EUR|\$)\s?[0-9]|[0-9][0-9.,]*\s?(?:\u20ac|EUR|k\b|m\b|million|Mio)|\b[0-9]+\s+(?:open |won |priced )?deals?\b|\b[0-9]{1,3}(?:[.,][0-9]{3})+\b"
  # CRITERION 4 — the unpriced deal is named as absent from the total.
  #
  # Judged on the FINDING, not the wording. "One deal carries no amount, so it
  # is in the count and not in the money" and "the total covers six of the seven
  # — one has no value on it yet" are the same answer, and a pattern greening
  # only the first would be measuring vocabulary.
  #
  # EVERY alternative is anchored to its own subject, because `re.search` looks
  # anywhere in the whole answer. An unanchored "missing" is satisfied by "the
  # close date is missing from my note above"; an unanchored "not included" is
  # satisfied by a sentence about the per-rep split nobody asked for. The anchor
  # is a word the observation cannot be made without: a deal, an amount, a
  # value, a price, or the total the deal is absent from.
  - "unpriced|(deal|deals|opportunit\w+|one|1|Weserbund)[^.]{0,60}(no|without|missing|lacks?|not)[^.]{0,25}(amount|value|price|figure|number|priced)|(amount|value|price)[^.]{0,40}(is |are |)(missing|absent|blank|empty|not (set|recorded|entered|filled))|(has|have|had|with|carries) no (amount|value|price|figure|number)|(not|never|n['’]t) (been )?priced|(excluded|left out|not counted|not included|does not (count|include)|outside)[^.]{0,45}(total|forecast|figure|number|sum)|(eligible|counted)[^.]{0,30}(vs\.?|versus|against|but only)[^.]{0,30}priced|(?i:(?:[0-9]+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)) of (?:the )?(?i:(?:[0-9]+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve))\b[^.]{0,45}(priced|amount|value|figure|deals?)|(eligible|counted)[^.]{0,25}(?i:(?:[0-9]+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve))\b[^.]{0,35}(?i:(?:[0-9]+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve))\b[^.]{0,35}(priced|amount|value)"

must_not_mention:
  # `(?:not |un)` AND NOT `(not|un)`, which is what this said and is a false
  # green rather than a false red: with no space, the alternation matches
  # "unavailable" and never "not available" — and "Forecasting is not available"
  # is how the denial actually gets written. A capability guard that lets the
  # exact sentence it exists for through reports PASS with nothing failing.
  #
  # A MISSING FORECAST VALUE IS NOT A MISSING FORECAST, either: "there is no
  # forecast value available for Weserbund" is criterion 4 being answered, and it
  # was firing the capability guard. The denial is about the forecast itself, so
  # the alternative refuses a "value", "figure", "number" or "amount" behind it.
  #
  # THE CAPABILITY DENIAL, the same failure case 7 guards. The forecast is
  # right there; concluding the workspace has none is worse than saying nothing,
  # because the person reading it stops asking.
  #
  # Each alternative claims something about the PRODUCT. A hedge about the
  # answer — "I would not put much weight on this with so little history" — is
  # honest, is exactly what the prompt asked for, and must stay green.
  #
  # FOUR DENIALS THE LIST DID NOT SPELL, each a whole answer from the paid
  # sweep: "forecasting is not enabled on this installation", "I cannot give
  # you a forecast" (two words between the verb and its object), "there is no
  # forecast in Margince for this quarter", and "I have no access to a
  # forecasting tool here". The lookahead that spares "no forecast VALUE for
  # the Weserbund deal" — the finding this case rewards — is kept, and the
  # widening is anchored to forecasting itself, so an honest caveat about how
  # much of the number the assistant will stand behind stays green.
  - "no forecast\b(?!\s+(?:value|figure|number|amount|total))[^.]{0,25}(available|in (the|this) (CRM|system|workspace|installation)|in Margince|here\b|for (?:this|the) quarter)|cannot (produce|give|calculate|generate|compute)[^.]{0,20}forecast|(the CRM|this workspace|Margince) (does not|doesn'?t) (do |support |have )?forecast|forecasting is (?:not |un)(?:available|supported|configured|possible|enabled|switched on|turned on)|no forecasting (capability|feature|data|tool)|no access to[^.]{0,20}forecast"

runs: 3
pass_at: 2
