# CASE 83 — A decision from a sales review is a change_reports action on its deal, not a plain task.
name: case83_write_the_decision_down
criteria: [1]
writes: true

prompt: |
  From today's sales review: we decided that on Rheinufer Netzmodernisierung we bring in their CFO before the end
  of the month. I own it. Record it as the review's decision, to be reviewed in four weeks.

must_call:
  - change_reports

must_call_with:
  - change_reports.action=record_decision

must_call_matching:
  - record_sales_decision~"deal_id"
  - record_sales_decision~CFO
  - record_sales_decision~"owner_id"
  - record_sales_decision~"review_on"

must_not_call_with:
  - change_state~.
  - archive_record~.
  - change_activities~.

may_call:
  - find_records
  - search_records
  - read_record
  - read_workspace
  - whoami

must_mention:
  - "Rheinufer"

runs: 3
pass_at: 2
