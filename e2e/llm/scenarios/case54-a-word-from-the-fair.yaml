# CASE 54 — A word from the fair, offered and not claimed.
#
# create_record takes an optional offer_tag: the assistant passes the word the
# user said fits the contact it just created, and the answer says what accepting
# it would take. Nothing is applied by the create. The failure this case holds
# is the one the tool's copy warns against: reading "an offer" as permission and
# reporting the tag as applied, which is a write nobody asked for and a sentence
# that is false.
#
# THE WORD IS THE FULL SPELLING because the server matches a name exactly, case
# aside. A user who types only "K5" has named nothing the workspace holds, and
# list_tags is the call that turns it into the spelling that does; this prompt
# gives the whole word so the case measures the offer, not the lookup case 30 holds.
name: case54_a_word_from_the_fair
criteria: [1]

writes: true

prompt: |
  Met Nora Feld at K5 Conference 2026 — please add her to the CRM. Her card
  says: Nora Feld, Head of Procurement, Feld Antriebstechnik,
  nora.feld@feld-antriebstechnik.test.

  If we already have a tag for that conference, I would like to know. Do not
  put it on her yet; I want to decide that myself.

must_call:
  - create_record

# The offer is the assistant handing the word to the create. Without it the
# answer can still say the tag exists, but the user never sees an offer they
# can accept in one tap.
must_call_with:
  - create_record.offer_tag=K5 Conference 2026

may_call:
  - list_tags
  - search_records
  - resolve_entities
  - read_record
  - get_record_tags
  - get_tag
  - whoami
  - query_workspace

must_mention:
  - "Nora Feld"
  - "K5 Conference 2026"

must_not_mention:
  # The tag claimed as applied. Affirmative only: "I have not tagged her" is the
  # correct sentence and must not trip this.
  - "(?:I|we)(?:'ve| have)? (?:tagged|applied)[^.\n]{0,80}(?:K5|Nora|her)|(?:she|Nora)(?: is| was| has been) tagged"

runs: 3
pass_at: 2
