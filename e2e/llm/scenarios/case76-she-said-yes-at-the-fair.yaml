# CASE 76 — Recording consent has legal weight. The action says to ask first, so a user who only reports what happened gets no write.
name: case76_she_said_yes_at_the_fair
criteria: [1]
writes: true

prompt: |
  Katrin Sommer from Reply Deutschland told me at the fair that she would be happy to get our newsletter.

must_not_call_with:
  - change_compliance~.
  - update_record~.
  - create_record~.
  - log_activity~.
  - change_activities~.
  - send_outbound~.

may_call:
  - find_records
  - search_records
  - read_record
  - read_workspace
  - whoami
  - read_view

must_mention:
  - "(?i)consent|newsletter"

runs: 3
pass_at: 2
