# CASE 78 — A stop a contact asked for is a suppression, not a field edit and not a withdrawn consent.
name: case78_she_asked_us_to_stop
title: She asked us to stop writing
criteria: [1]
writes: true

prompt: |
  Mai Nguyen at Vietnam Partner called and asked us to stop writing to her altogether. Please make sure nobody here
  emails her any more.

must_not_call_with:
  - update_record~.
  - archive_record~.
  - change_compliance~record_consent

may_call:
  - find_records
  - search_records
  - read_record
  - read_workspace
  - whoami
  - change_compliance

must_mention:
  - "Mai"

# suppress_contact says to ask the user first, and the user named the outcome:
# recording the stop, or naming it and asking for the yes, both fulfil it. The
# end state cannot say "either", so the judge reads which one the answer reports.
judge:
  - "Criterion 1. The answer either reports a stop recorded on Mai Nguyen because she asked us to stop writing, or proposes recording that stop and asks the user's yes first. Answer no if it offers a tag, a note, a marketing opt-out alone or a field change instead, or says it cannot stop mail to her."

runs: 3
pass_at: 2
