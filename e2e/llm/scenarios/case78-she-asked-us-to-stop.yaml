# CASE 78 — A stop a contact asked for is a suppression, not a field edit and not a withdrawn consent.
name: case78_she_asked_us_to_stop
criteria: [1]
writes: true

prompt: |
  Mai Nguyen at Vietnam Partner called and asked us to stop writing to her altogether. Please make sure nobody here
  emails her any more.

must_call:
  - change_compliance

must_call_with:
  - change_compliance.action=suppress_contact

must_call_matching:
  - suppress_contact~"kind": "subject_request"

must_not_call_with:
  - update_record~.
  - archive_record~.
  - change_compliance~record_consent

may_call:
  - find_records
  - search_records
  - read_record
  - read_workspace
  - whoami

must_mention:
  - "Mai"

runs: 3
pass_at: 2
