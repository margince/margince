# CASE 109 — A user's own time zone, working hours and language are theirs
# alone, so all three go to change_my_settings. No workspace setting moves, and
# no colleague's language.
#
# An agent sets its user's time zone only as source `agent`. The zone then reads
# as the agent's and not as one the user picked, so timezone_chosen stays false
# until the user picks a zone in the app. The server refuses `chosen` or
# `browser` from an agent, so a run that tries `chosen` first is a model
# claiming the user's own pick, and fails here even though a retry would land.
#
# THE END STATE reads the zone and the language through whoami, and the hours
# through read_workspace my_working_hours. The stored timezone flag and stamp
# are on the user's own seat only, which no agent tool reads; the Go integration
# test TestATimeZoneSaysItsAgentOnTheUsersOwnSeatOnly holds them.
name: case109_my_hours_zone_and_language
title: My hours, my time zone and my language
criteria: [1, 2, 3]
writes: true

prompt: |
  I am working from Lisbon for the next three months. Show my times in Lisbon
  time from now on. Keep me out of bookings on Fridays: I work Monday to
  Thursday, nine to five. And please switch my Margince to German. Only mine, my
  colleagues keep theirs.

must_call:
  - change_my_settings

must_call_with:
  - change_my_settings.action=save_timezone
  - change_my_settings.action=save_working_hours
  - change_my_settings.action=save_locale

must_call_matching:
  - 'change_my_settings~"timezone": "Europe/Lisbon"'
  - 'change_my_settings~"source": "agent"'
  - 'change_my_settings~"days": \[1, 2, 3, 4\]'
  - 'change_my_settings~"start_time": "09:00"'
  - 'change_my_settings~"end_time": "17:00"'
  - 'change_my_settings~"locale": "de"'

must_not_call_with:
  - 'change_my_settings~"source": "(?:chosen|browser)"'
  - change_settings~.
  - update_record~.

may_call:
  - whoami
  - read_workspace

must_end_with:
  - me "admin@demo.test" timezone=Europe/Lisbon
  - me "admin@demo.test" locale=de
  - me "admin@demo.test" working_days=1,2,3,4
  - me "admin@demo.test" working_hours=09:00-17:00

runs: 3
pass_at: 2
