# CASE 1 — Log it while it is fresh.
#
# Two [M] criteria:
#
#   Criterion 8 — promises made in the meeting come back as suggestions. The
#   transcript states ONE commitment ("Ich schicke Ihnen die Preisliste bis
#   Freitag") and discusses one topic WITHOUT one. Reporting both would mean the
#   reader is listing everything it sees rather than what was promised.
#
#   Criterion 14 — the assistant says what is waiting. The 2026-08-25 run
#   reported "nothing pending approval" while a held draft sat in the queue.
#   Every write was correct and the report of it was not.
#
# The transcript arrives as TEXT in the prompt, which is the same boundary the
# deck's hosts draw: Plaud is the assistant's business and the server cannot
# tell a paste from an upload.
name: case1_log_it
criteria: [8, 14]

# WRITES: the author's own statement that this case changes the world. It is not
# what decides the reset — the runner rebuilds whenever the LAST run dirtied the
# world, because the assistant is offered the whole server and any run can write
# regardless of what its file says. TestEveryWritingScenarioDeclaresThatItWrites
# holds this line against the tools the case names.
writes: true

prompt: |
  Just left Kugellager-online. Met Matthias Ortner, went well, they want to move
  forward. Here is the transcript from Plaud, put it all in the CRM:

  Matthias: Danke für die Übersicht zu den Lieferzeiten.
  Lars: Wie sieht es mit dem Thema Verpackung aus?
  Lars: Ich schicke Ihnen die Preisliste bis Freitag.
  Matthias: Passt, dann schauen wir uns das nächste Woche an.

must_call:
  - create_record
  - log_activity
may_call:
  - resolve_entities
  - search_records
  - list_pipelines
  - list_approvals
  - read_record
  - query_workspace

must_mention:
  # It created what the sentence named.
  - "Kugellager"
  - "Matthias Ortner"
  # Criterion 8: the one stated commitment, not the topic beside it.
  - "Preisliste|price list|pricing"

# BOTH [M] CRITERIA ARE SEMANTIC, so both are judged and this case forbids
# nothing by regex.
#
# Criterion 8 asks whether a topic was reported as a promise, which is a
# question about what the sentence CLAIMS: "committed to sending packaging
# samples", "agreed to send packaging options" and "Verpackung: von Lars
# zugesagt" are one claim in three registers and were shipped as three literal
# strings, then as a verb list with a negation guard so that "packaging was
# discussed and nothing was promised" — the correct answer — stayed green.
# Criterion 14 asks whether a denial about the approval queue is a denial about
# THIS meeting's own writes (true, and correct) or about the workspace (false,
# and the failure the 2026-08-25 run shipped). Neither distinction is a string.
judge:
  - "Criterion 8. The answer reports only what was actually promised in the meeting. The transcript carries one commitment — Lars will send the price list by Friday — and one topic raised with nothing promised about it, packaging. Answer no if the answer reports packaging as a commitment, promise, agreement, undertaking or action item by anyone. Recording that packaging was raised or discussed, or proposing to pick it up next week, is what logging the transcript means and is not a promise: answer yes."
  - "Criterion 14. The answer never tells the reader that nothing is waiting for approval, that the approval queue is empty, or anything else denying that work is pending in this workspace — two proposals are pending in it. A statement scoped to this meeting's own writes ('nothing from this transcript needed approval', 'both entries were saved outright') is true: answer yes. An answer that says nothing about approvals at all is also a yes; this criterion forbids a false all-clear, it does not require a report."

runs: 3
pass_at: 2
