# CASE 1 — Log it while it is fresh.
#
# Two [M] criteria:
#
#   Criterion 8 — promises made in the meeting come back as suggestions. The
#   transcript states ONE commitment ("Ich schicke Ihnen die Preisliste bis
#   Freitag") and discusses one topic WITHOUT one. Reporting both would mean the
#   reader is listing everything it sees rather than what was promised.
#
#   Criterion 14 — the assistant says what is waiting. The 2026-08-25 run
#   reported "nothing pending approval" while a held draft sat in the queue.
#   Every write was correct and the report of it was not.
#
# The transcript arrives as TEXT in the prompt, which is the same boundary the
# deck's hosts draw: Plaud is the assistant's business and the server cannot
# tell a paste from an upload.
name: case1_log_it
criteria: [8, 14]

# WRITES: the author's own statement that this case changes the world. It is not
# what decides the reset — the runner rebuilds whenever the LAST run dirtied the
# world, because the assistant is offered the whole server and any run can write
# regardless of what its file says. TestEveryWritingScenarioDeclaresThatItWrites
# holds this line against the tools the case names.
writes: true

prompt: |
  Just left Kugellager-online. Met Matthias Ortner, went well, they want to move
  forward. Here is the transcript from Plaud, put it all in the CRM:

  Matthias: Danke für die Übersicht zu den Lieferzeiten.
  Lars: Wie sieht es mit dem Thema Verpackung aus?
  Lars: Ich schicke Ihnen die Preisliste bis Freitag.
  Matthias: Passt, dann schauen wir uns das nächste Woche an.

must_call:
  - create_record
  - log_activity
may_call:
  - resolve_entities
  - search_records
  - list_pipelines
  - list_approvals
  - read_record
  - query_workspace

must_mention:
  # It created what the sentence named.
  - "Kugellager"
  - "Matthias Ortner"
  # Criterion 8: the one stated commitment, not the topic beside it.
  - "Preisliste|price list|pricing"

must_not_mention:
  # The packaging question was DISCUSSED and nobody promised anything about it.
  # Reporting it as a commitment is the failure this transcript is shaped for.
  #
  # THREE LITERAL PHRASINGS WERE NOT THE CLAIM, they were three ways of writing
  # it: "committed to sending packaging samples" puts a word between the verb and
  # the noun, "promised packaging options" never reaches the German spelling, and
  # "Verpackung: von Lars zugesagt" says it in the language the transcript is in.
  # The claim is what is forbidden, in either order.
  #
  # ONLY A COMMITMENT. Recording that packaging was raised is what logging the
  # transcript MEANS, and proposing to pick it up next week is a suggestion
  # rather than a promise — so the verbs here are verbs of undertaking, and the
  # run to them refuses to cross a negation: "packaging was discussed and nothing
  # was promised about it" is the answer that got criterion 8 right.
  - "(?:commit\w*|promis\w*|zusag\w*|zugesagt|agreed[^.;!?\n]{0,15}to|undertook|undertaken|action item|owes?\b)(?:(?!\b(?:not|no|nothing|never|nobody|none|kein\w*|nichts|nie)\b)[^.;!?\n]){0,40}(?:packaging|Verpackung)|(?:packaging|Verpackung)(?:(?!\b(?:not|no|nothing|never|nobody|none|kein\w*|nichts|nie)\b)[^.;!?\n]){0,40}(?:commit\w*|promis\w*|zusag\w*|zugesagt|agreed|undertook|undertaken|action item|owed?\b)"
  # CRITERION 14, and the sentence the run of 2026-08-25 wrote: "nothing is
  # pending approval", said into a workspace where two proposals are waiting.
  # The seed asserts exactly those two before it exits, so this claim is false in
  # case 1's world whenever it is made.
  #
  # A CLAIM ABOUT THE QUEUE, not about this meeting's own writes. Both writes
  # here execute outright, so "nothing from this transcript needed approval" is
  # true and stays green: the run to the state verb refuses to cross a word that
  # scopes it to this errand.
  - "(?:nothing|none|no items?|no approvals?|no proposals?)(?:(?!\b(?:this|these|that|here|today|from|about|of the meeting|needed|required|need)\b)[^.;!?\n]){0,30}(?:is |are |)(?:currently |still |)(?:pending|awaiting|outstanding|waiting)[^.;!?\n]{0,25}(?:approv|confirm|sign-?off|decision)|(?:approval|decision)s? queue is empty"

runs: 3
pass_at: 2
