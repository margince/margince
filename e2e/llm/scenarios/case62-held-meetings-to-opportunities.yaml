# CASE 62 — Held meetings that became opportunities.
#
# A routing case. The meeting-to-opportunity conversion is a figure Margince's
# reporting gives: the meeting-conversion report, an analytics query on that
# entity, or the meetings-held and accepted-opportunities metrics. A model that
# sums meetings and deals by hand reaches a number none of them gives, because
# the report joins the handoff acceptance and a deal at the same company
# converts nothing. The prompt names no tool and no report key.
name: case62_held_meetings_to_opportunities
title: Held meetings that became opportunities
criteria: [1]
writes: false

prompt: |
  Quarterly review with my manager is coming up. Of the meetings I held, how
  many turned into an opportunity?

# The figures come from Margince's reporting, by any of its engines: the
# meeting-conversion report, an analytics query on that entity, or the
# meetings-held and accepted-opportunities metrics. The counts move with the
# quarter the lane runs in, so no fixed fact holds them: a read of the reporting
# is what makes the judged counts the product's and not invented.
must_call:
  - read_reports|run_report|read_analytics

judge:
  - "Criterion 1. The answer gives how many meetings the user held and how many of them became an opportunity, as numbers read from Margince. Answer no if it gives no count, or only one of the two."

may_call:
  - read_analytics
  - run_analytics_query
  - read_reporting
  - list_records
  - search_records
  - query_workspace
  - read_workspace
  - whoami

runs: 3
pass_at: 2
