<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
      anything at all; without it the phone nav's clearance for the home
      indicator silently computes to zero. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Margince</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Margince" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B7A53" />
    <meta
      name="description"
      content="Margince updates CRM records from approved customer activity while your team controls its actions, deployment, model and source customization."
    />
    <!-- Not og:url: no build knows an installation's address; cards link to it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Margince" />
    <meta property="og:title" content="Margince - A CRM that fills itself" />
    <meta
      property="og:description"
      content="Margince updates CRM records from approved customer activity while your team controls its actions, deployment, model and source customization."
    />
    <meta property="og:image" content="https://margince.com/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Margince — The sovereign AI business platform for the Mittelstand."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
