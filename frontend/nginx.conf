# SPA static serving. This server only ever sees requests the reverse proxy /
# ingress routed to the web service (everything the api owns — /v1, /healthz,
# /readyz, /metrics — is routed to the api service by longest-path match, so it
# never reaches here). Any ingress that path-routes this way works; District 13
# is not a prerequisite.
server {
    # 8080, not 80: the nginx-unprivileged base runs as a non-root user that
    # cannot bind a privileged port. The ingress targets this container port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No version in the Server header or on any error page.
    server_tokens off;

    # Every miss answers a short plain-text 404 rather than nginx's HTML page.
    error_page 404 @not_found;

    # ── Browser security headers ────────────────────────────────────────────
    # These guard the ONE origin that executes the app's JavaScript and holds
    # its SameSite=Strict session cookie. The api sets an equivalent set on
    # /v1 (httpserver.SecureHeaders), but that middleware is Go and never runs
    # here — the SPA shell would otherwise ship with none, leaving it
    # frameable (clickjacking) and with no content policy on the origin that
    # matters most.
    #
    # The CSP mirrors the api's, with the differences this server needs because
    # it emits the APP (HTML, fonts, framed previews) while the api emits only
    # JSON:
    #   - style-src adds fonts.googleapis.com — index.html loads the Google
    #     Fonts stylesheet from there.
    #   - font-src adds fonts.gstatic.com — that stylesheet fetches the font
    #     files from there. (Without an explicit font-src it falls back to
    #     default-src 'self' and the fonts silently do not load.)
    #   - img-src adds blob: — image previews are fetched same-origin and shown
    #     through an <img> whose src is a URL.createObjectURL blob
    #     (design-system/filepreview.tsx). data: stays for parity with the api
    #     and is cheap; no prod code relies on it today.
    #   - frame-src blob: — a PDF preview is the SAME fetched blob shown in an
    #     <iframe> instead of an <img> (filepreview.tsx, mediaType === PDF).
    #     frame-src falls back to default-src 'self', and 'self' does NOT match
    #     the blob: scheme, so without this line every PDF preview renders an
    #     empty frame. There is no same-origin framing to allow besides it.
    # Everything else the SPA fetches is same-origin by construction
    # (api/client.ts pins the base to location.origin + /v1), so script-src and
    # connect-src stay 'self'; there are no inline scripts. style-src keeps
    # 'unsafe-inline' for the runtime inline styles the component layer sets.
    # base-uri and object-src are locked to close injection classes the rest of
    # the policy already pays for. form-action is deliberately NOT constrained:
    # the OAuth consent screen POSTs to /oauth/authorize, which 302s to the
    # client's registered (off-origin, unknowable) redirect_uri, and a
    # form-action 'self' would break "Approve" for every connected agent.
    #
    # Referrer-Policy: no referrers leave this origin, ever. The default
    # (strict-origin-when-cross-origin) sends the FULL url on same-origin
    # requests, and those api calls are same-origin — so any secret a url ever
    # carries would be handed to the api in a header.
    #
    # HSTS mirrors the api's exact value so the app is pinned to HTTPS even
    # behind an ingress that does not add its own (the file's premise is that
    # any path-routing ingress works). A browser ignores it on a plain-HTTP hop,
    # so it is safe to set always.
    #
    # X-Robots-Tag keeps this private CRM out of every search index — the app is
    # served only to authenticated users and nothing here is meant to be
    # crawled. This header de-indexes any crawler that fetches (including one
    # that ignores robots.txt) and covers non-HTML responses. public/robots.txt
    # is the complementary half — it tells a COMPLIANT crawler not to fetch at
    # all, except the link-preview fetchers it names, which may read the static
    # app shell. The two do not fully layer: a crawler that obeys Disallow
    # never reads the noindex, so a URL-only listing from an external link stays
    # possible. A URL-only listing carries no snippet, so that gap is
    # acceptable, and blocking the fetch still saves the crawl budget.
    #
    # Permissions-Policy, Cross-Origin-Opener-Policy and Cross-Origin-Resource-
    # Policy carry the api's exact values (httpserver.SecureHeaders; a backend
    # gate holds the two equal):
    #   - Permissions-Policy denies every powerful feature the app does not use.
    #     The one it does use, writing to the clipboard (the copy buttons,
    #     design-system/clipboardcopy.tsx), is allowed for this origin only.
    #   - COOP same-origin: every sign-in and connector flow is a full-page
    #     redirect (location.assign), never a popup, so no window of this origin
    #     needs a handle on a window of another. An MCP client that opens the
    #     consent screen in a popup loses its handle on that window; the grant
    #     still completes, because the code reaches the client at its registered
    #     redirect_uri, not through the window.
    #   - CORP same-origin: nothing here is meant to be embedded by another
    #     origin. The link-preview image is an absolute URL on another host, and
    #     link-preview fetchers are servers, which CORP does not bind.
    #
    # `always` is required on all of them: without it nginx omits the header on
    # error responses, which are exactly the pages a mistyped or expired link
    # lands on.
    #
    # REPEATED in every location that sets an add_header of its own. nginx's
    # add_header does not merge with an inherited one — a location with any
    # add_header REPLACES the whole inherited set — so a header declared only
    # here would be silently dropped on exactly the asset and shell responses
    # below. This is the one place where DRY loses to correctness.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src blob:; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/x-icon;
    gzip_min_length 1024;
    # Keep gzipped and identity responses cache-separated in shared caches.
    gzip_vary on;

    # Hashed build assets are content-addressed — cache them hard. The security
    # set is repeated because this location's Cache-Control add_header would
    # otherwise drop the inherited one (see the server block above).
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src blob:; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # The app shell must revalidate — otherwise a shared cache can keep serving a
    # stale index.html that points at build assets a new deploy has replaced.
    # This IS the document the browser executes the app from, so the full
    # security set matters most here; repeated for the same add_header reason.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src blob:; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Fixed names each deploy replaces, so every read revalidates. =404, not the
    # shell: a browser refuses index.html as a worker and keeps its old one.
    location ~ ^/(?:sw\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
        # Replaces the whole type map here, so it names every file this serves.
        types {
            application/javascript js;
            application/manifest+json webmanifest;
        }
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src blob:; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # The MCP App documents. The api fetches these server-side and inlines them
    # into resources/read, so their effective content-security policy — when
    # they render inside an MCP host — comes from _meta.ui.csp, not from this
    # file, and the api discards these response headers entirely (apps/fetch.go
    # reads the body and checks only the content type).
    #
    # So the headers here cost the MCP path nothing, and the ONLY client that
    # ever observes them is a browser loading /mcp-apps/<view>.html directly —
    # a load no legitimate flow performs (the host reads via resources/read on
    # /mcp, never by fetching this URL) and an attacker would. A directly loaded
    # view must therefore be un-frameable (its bridge pins whichever frame
    # embeds it as the trusted host — mcp-apps/bridge.ts) and inert: its inline
    # script/style are meant to run only inside a host's sandbox, so
    # default-src 'none' renders a direct load harmless without touching the
    # inlined copy the host actually executes.
    #
    # try_files ... =404 is load-bearing: without it the SPA fallback below
    # answers a missing view with index.html and HTTP 200, and the api would
    # fetch the app shell believing it was a view.
    #
    # no-cache, not /assets/'s immutable: these are replaced on deploy and the
    # api's refresh must see new bytes through any shared cache.
    location ^~ /mcp-apps/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # A path that names a FILE is served from the build or answered 404, never
    # with the app shell. "Names a file" is a dot in the last segment
    # (/favicon.ico, /robots.txt, /backup.zip, /llms.txt,
    # /.well-known/security.txt), with or without a trailing slash
    # (/backup.zip/), or a segment that starts with a dot (/.env,
    # /.git/config). The shell under a 200 would tell a scanner probing those
    # that the file exists, and a browser probing an icon that it got one.
    #
    # No app route is shadowed: the router keeps the whole route in the #
    # fragment (a shared link is / plus #/…, see public/robots.txt), so the
    # only paths the app itself navigates to are extensionless. /assets/ and
    # /mcp-apps/ are ^~ prefixes, so this regex never overrides their caching,
    # and /index.html is an exact match, which nginx tries before any regex.
    # Whatever the api answers — /v1, /mcp, /oauth/, the /.well-known/oauth-*
    # documents and security.txt — the ingress routes to the api by its exact
    # path or prefix before a request can reach this server ("Route one host to
    # two services" in docs/how-to/deploy-margince.md). No add_header here, so
    # the server block's set is inherited.
    location ~ "/\.|\.[^/]*/?$" {
        try_files $uri =404;
    }

    # Client-side routing: every other unknown path falls back to the app
    # shell. No add_header of its own, so it inherits the server block's set.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The body every 404 above carries. It inherits the server block's set.
    # The empty types map is what makes it text/plain: the type is otherwise
    # looked up from the requested name, so /backup.zip's 404 would claim to
    # be a zip.
    location @not_found {
        types { }
        default_type text/plain;
        return 404 "Not found\n";
    }
}
