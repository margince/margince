name: ci-image
description: >-
  Name the CI image for this tree by digest, building and pushing it first when
  this run is the first to need it and may push. Hands back an empty name when
  no job here can pull it, and the jobs then set up on the runner.

inputs:
  push:
    description: >-
      Whether a missing image may be built and pushed. Only a run whose token
      can write packages sets it: a pull request from a fork gets a read-only
      token.
    required: true
  token:
    description: The token that logs in to the registry for a push.
    required: true

outputs:
  pinned-image:
    description: >-
      `ghcr.io/<owner>/ci@sha256:<digest>`, or empty when the jobs cannot pull
      the image for this tree.
    value: ${{ steps.resolve.outputs.pinned-image }}

runs:
  using: composite
  steps:
    # One tag per set of inputs, spelled by the script the image is built from,
    # so the name and the bytes cannot follow two different lists.
    - name: Name the image after its inputs
      id: tag
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail
        tag="$(scripts/ci-image-context.sh "$RUNNER_TEMP/ci-image")"
        repo="ghcr.io/${OWNER,,}/ci"
        echo "repo=$repo" >> "$GITHUB_OUTPUT"
        echo "ref=$repo:$tag" >> "$GITHUB_OUTPUT"
        echo "CI image inputs hash to $tag"

    # The jobs pull anonymously, as a `container:` with no credentials does, so
    # the lookup does too: an image only a logged-in client can see is one no
    # job here can start in.
    - name: Look the image up
      id: lookup
      shell: bash
      env:
        REF: ${{ steps.tag.outputs.ref }}
      run: scripts/ci-image-digest.sh "$REF" >> "$GITHUB_OUTPUT"

    - name: Log in to the registry
      if: steps.lookup.outputs.digest == '' && inputs.push == 'true'
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        ACTOR: ${{ github.actor }}
      run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

    # A build runs when an input moved, and on every run that may push while
    # the package can be pulled only with a login. The layer cache under the
    # `buildcache` tag lets a build that changed one input skip the others: the
    # apt layer comes first, so a tools or pnpm change keeps it. A cached layer
    # was built from the same Dockerfile lines and the same pins. The registry
    # cache needs BuildKit in a container, which runs a pinned BuildKit image.
    - name: Build and push the image
      if: steps.lookup.outputs.digest == '' && inputs.push == 'true'
      shell: bash
      env:
        REF: ${{ steps.tag.outputs.ref }}
        REPO: ${{ steps.tag.outputs.repo }}
        SOURCE: ${{ github.server_url }}/${{ github.repository }}
      run: |
        set -euo pipefail
        docker buildx create --use --name ci-image --driver docker-container \
          --driver-opt image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
        docker buildx build --platform linux/amd64 \
          --label "org.opencontainers.image.source=$SOURCE" \
          --cache-from "type=registry,ref=$REPO:buildcache" \
          --cache-to "type=registry,ref=$REPO:buildcache,mode=max" \
          --tag "$REF" --push "$RUNNER_TEMP/ci-image"
        docker buildx rm ci-image
        docker logout ghcr.io

    - name: Look the pushed image up
      id: pushed
      if: steps.lookup.outputs.digest == '' && inputs.push == 'true'
      shell: bash
      env:
        REF: ${{ steps.tag.outputs.ref }}
      run: scripts/ci-image-digest.sh "$REF" >> "$GITHUB_OUTPUT"

    # A digest, never a tag: the tag is ours to push again, the digest names
    # these bytes. check-image-pins.sh admits the job output on that promise.
    - name: Hand the image on
      id: resolve
      shell: bash
      env:
        REPO: ${{ steps.tag.outputs.repo }}
        FOUND: ${{ steps.lookup.outputs.digest }}
        PUSHED: ${{ steps.pushed.outputs.digest }}
        PUSH: ${{ inputs.push }}
      run: |
        set -euo pipefail
        digest="${FOUND:-$PUSHED}"
        if [ -z "$digest" ]; then
          if [ "$PUSH" = true ]; then
            echo "::warning::$REPO was pushed but cannot be pulled without logging in; make the package public, and until then the jobs set up on the runner"
          else
            echo "::warning::$REPO has no image for this tree that can be pulled without a login, and this run cannot push one, so the jobs set up on the runner"
          fi
          echo "pinned-image=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        image="$REPO@$digest"
        if ! [[ "$image" =~ ^ghcr\.io/[a-z0-9._-]+/ci@sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::'$image' is not a digest-pinned CI image" >&2
          exit 1
        fi
        echo "pinned-image=$image" >> "$GITHUB_OUTPUT"
        echo "The jobs run in $image"
