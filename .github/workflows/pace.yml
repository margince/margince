# Holds two workflows to their cadence while a branch is moving: main-health every
# two hours on main, cache-warm every three on main and on develop.
#
# GitHub's scheduler can run a cron hours late or not at all, with no record of a
# run it skipped, and it runs a cron only on the default branch. A push is
# delivered, and each of these only needs a new run once something has landed. A
# cold cache-warm slows every pull request's lanes into that branch.
#
# A dispatch through GITHUB_TOKEN does start a workflow, unlike a push made with it.
name: pace

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

# One at a time per branch, so a push arriving just after a dispatch reads that run
# rather than racing it. Only the newest waiting push matters: all ask one question.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pace:
    name: pace ${{ matrix.workflow }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    # One job per workflow, so a failed read for one does not hold back the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - workflow: main-health.yml
            interval: 7200
            branches: '["main"]'
          - workflow: cache-warm.yml
            interval: 10800
            branches: '["main", "develop"]'
    permissions:
      contents: read
      # To read the workflow's last run and to dispatch the next one.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start ${{ matrix.workflow }} if it is due
        if: contains(fromJSON(matrix.branches), github.ref_name)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ matrix.workflow }}
          INTERVAL: ${{ matrix.interval }}
          BRANCH: ${{ github.ref_name }}
        run: ./scripts/pace-workflow.sh "$WORKFLOW" "$INTERVAL" "$BRANCH"
