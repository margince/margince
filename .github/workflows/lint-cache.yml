name: lint-cache

# Refreshes golangci-lint's analysis cache after every push to main or develop,
# so a pull request's backend-lint starts from the tip it merges into rather than
# from cache-warm's last green run, often hours and dozens of merges behind.
# Each run restores the previous entry, so it analyzes only what the push changed.
# It gates nothing: a red run still analyzed the tree, and its entry is saved.
on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "extensions/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/lint-cache.yml"
      - ".github/actions/golangci-cache-key/**"
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, never cancelled: a cancelled run saves nothing.
# A push that lands mid-run waits, and only the newest waiting push runs next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

env:
  GOPROXY: https://proxy.golang.org|direct
  CHECK_BASE_REF: origin/${{ github.ref_name }}

jobs:
  warm:
    name: warm golangci
    timeout-minutes: 30
    # A dispatch from any other branch would save an entry no pull request reads.
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To delete this branch's older entries once the new one is saved.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: plain
      - name: Gate binaries on PATH
        uses: ./.github/actions/gate-binaries
        with:
          save: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Compute the golangci cache key
        id: golangci-key
        uses: ./.github/actions/golangci-cache-key
      - name: Restore the golangci-lint analysis cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ steps.golangci-key.outputs.key }}
          restore-keys: ${{ steps.golangci-key.outputs.restore-keys }}
      # Both passes, each into its own cache directory, as backend-lint runs them.
      - name: Lint the pushed tree (make lint)
        run: make -j2 lint
      - name: Save the golangci-lint analysis cache
        id: save
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ steps.golangci-key.outputs.key }}
      # A restore takes the newest entry, so the older ones on this branch only
      # take room under the repository's cache limit. Only entries saved before
      # this one go, so a newer entry from cache-warm stays.
      - name: Delete this branch's older golangci entries
        if: ${{ !cancelled() && steps.save.outcome == 'success' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ steps.golangci-key.outputs.key }}
          PREFIX: ${{ steps.golangci-key.outputs.restore-keys }}
        run: |
          entries="$(gh cache list --ref "$GITHUB_REF" --key "$PREFIX" --limit 1000 --json key,createdAt)"
          saved="$(jq -r --arg keep "$KEEP" '.[] | select(.key == $keep) | .createdAt' <<<"$entries")"
          if [[ -z "$saved" ]]; then
            echo "the entry just saved is not listed yet, so nothing is deleted"
            exit 0
          fi
          jq -r --arg saved "$saved" '.[] | select(.createdAt < $saved) | .key' <<<"$entries" |
            while read -r key; do
              gh cache delete "$key" --ref "$GITHUB_REF"
            done
