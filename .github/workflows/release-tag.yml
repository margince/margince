# A version tag in, a GitHub release out.
#
# One gesture cuts a downloadable build:
#
#   git tag -a v1.0.0 -m "..." && git push origin v1.0.0
#
# The tag says which shelf it lands on. A plain v1.0.0 ships; a suffixed
# v1.0.0-rc.1 publishes as a pre-release, so a build meant for testing does not
# become the download the release page offers by default. The D13 deployment's
# production promotion is meant to select on that same answer and does not yet;
# nothing here depends on it, because a tag moves no branch, so tagging a
# candidate deploys nothing today either way.
#
# WHY THIS IS NOT release.yml. That lane drafts a constellation release into the
# dist service at test.margince.com, versioned YYYY.edition.bugfix, and its
# version grammar (pkg/version in margince-constellation) rejects a v-prefixed
# string by construction. The two release kinds therefore carry two version
# schemes, and one lane cannot name a build both ways. This lane owns the
# GitHub release; release.yml keeps the dist release and
# has surrendered its github-release job, so exactly one lane here can create a
# release.
name: release-tag

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize, never cancel: by the release job this workflow is creating a
# release and writing its notes, and a killed run leaves that half done.
concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve and VALIDATE before anything is published. Every check below
  # fails in seconds.
  version:
    name: The tag is a version, on main, with a verdict
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      # merge-attest's verdict on the tagged commit. The Checks API needs its
      # own scope, and naming any scope sets the rest to none, so contents
      # has to be spelled out alongside it.
      checks: read
      # The open issues that carry release: blocker.
      issues: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          # The ancestry check needs main, and a tag push checks out one commit
          # by default.
          fetch-depth: 0

      - name: Read the tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-tag-version.sh "$TAG" >> "$GITHUB_OUTPUT"

      - name: The tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A release built from a commit that never merged is a release nobody
          # reviewed. origin/main is asserted SEPARATELY from the ancestry it
          # feeds: the checkout above is credential-less by now, so nothing here
          # can fetch what is missing, and `merge-base` against an absent ref
          # fails exactly as a tag off main does. One message per cause, or a
          # fetch-depth regression reads as "your tag is not on main" and sends
          # somebody to re-merge work that is already merged.
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "release-tag: origin/main is not in this checkout." >&2
            echo "  The ancestry check cannot run, so this refuses rather than" >&2
            echo "  passing blind. Check the checkout step's fetch-depth." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "release-tag: $TAG does not point at a commit on main." >&2
            echo "  Merge the work first, then tag the merge commit." >&2
            exit 1
          fi

      - name: LICENSE carries this release's values
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Fetched again by name so the ref holds the annotated tag object: its
          # tagger date, in the tagger's own time zone, is the day the release
          # was made. A checkout may store the tag as a bare commit ref instead.
          git fetch --quiet --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_date="$(git for-each-ref --format='%(taggerdate:short)' "refs/tags/$TAG")"
          bash scripts/release-license-stamped.sh "$TAG" "$tag_date" LICENSE

      - name: No open issue blocks a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Milestones are months and name no release, so what a plain tag
          # waits for is this label. A candidate ships before its blockers on
          # purpose, so it only reports them.
          blockers="$(gh issue list --repo "$GH_REPO" --state open --label "release: blocker" \
            --limit 1000 --json number,title --jq '.[] | "#\(.number) \(.title)"')"
          if [ -z "$blockers" ]; then
            echo "release-tag: no open issue carries release: blocker."
          elif [ "$PRERELEASE" = true ]; then
            echo "release-tag: $TAG is a pre-release; these still block the release:"
            echo "$blockers"
          else
            echo "release-tag: $TAG is blocked by:" >&2
            echo "$blockers" >&2
            echo "  Close them, or take the label off one the release can ship without," >&2
            echo "  then re-run ALL jobs of this run: docs/how-to/cut-a-release.md." >&2
            exit 1
          fi

      - name: The tagged commit has no adverse verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # main takes ~85 merges a day and a repository role can merge past a
          # red required check — deliberately, and that is not changing. So the
          # tip is not evidence: of the 20 commits before this lane was written,
          # 9 carried an adverse `verdict` from merge-attest and 10 were clean.
          # A release is worth one API call to avoid tagging one of the 9.
          #
          # This reads merge-attest's verdict, which fires on an adverse `ci`
          # OR on a commit no pull request names. It says NOTHING about an
          # absent verdict — merging past `ci` is a standing decision here — so
          # a missing check-run passes. This is a release selector, not a
          # correctness gate, and must not be described as one.
          #
          # THREE states, because merge-attest waits for the `ci` fan-in and so
          # posts minutes after the merge, not at push time:
          #   absent     — passes, for the reason above.
          #   unsettled  — REFUSES. A queued or running check-run carries
          #                conclusion null, which is indistinguishable from an
          #                absent one once the conclusions are joined, so a tag
          #                pushed straight after the merge skipped this step
          #                without saying it had.
          #   completed  — judged on the conclusion.
          #
          # per_page=100 rather than the endpoint's default of 30: it truncates
          # instead of erroring, so the verdict would fall off the tail as the
          # number of checks on a commit grows and this step would degrade to
          # "nothing to refuse". The remaining ceiling — 100 check-runs on one
          # commit — is named rather than paginated for. `filter=latest`, the
          # default, is deliberate and is the opposite of merge-attest's choice:
          # that judge reads the oldest attempt because it asks what the verdict
          # was AT the merge, and this one asks what it is now.
          runs="$(gh api "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "verdict")]')"
          if [ "$(jq 'length' <<<"$runs")" -eq 0 ]; then
            echo "release-tag: no verdict check-run on $SHA — nothing to refuse."
            exit 0
          fi
          if [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" -gt 0 ]; then
            echo "release-tag: the verdict on $SHA has not settled yet." >&2
            echo "  merge-attest waits for the ci fan-in, so it reports minutes" >&2
            echo "  after the merge. Let it finish, then re-run ALL jobs of this" >&2
            echo "  run — a verdict that has not concluded is not a verdict this" >&2
            echo "  lane may read as absent." >&2
            exit 1
          fi
          verdict="$(jq -r '[.[] | .conclusion] | join(",")' <<<"$runs")"
          case "$verdict" in
            *failure*|*cancelled*|*timed_out*|*action_required* )
              echo "release-tag: $SHA carries an adverse verdict ($verdict)." >&2
              echo "  merge-attest reports either an adverse ci verdict or a commit" >&2
              echo "  no pull request names. Tag a commit that has neither." >&2
              exit 1 ;;
            * )
              echo "release-tag: verdict on $SHA is $verdict." ;;
          esac

  # The hand-written half of the notes is a draft release, written before the
  # tag. Only a token that can write sees a draft, so this read sits in a job of
  # its own instead of in version; it still runs before the release is made.
  draft:
    name: A plain tag has its draft notes
    needs: [version]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Find the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A published release of this tag is a re-run, and its body already
          # holds the notes. --paginate because the list truncates at its page
          # size instead of erroring.
          body="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$VERSION\") | .body // \"\"")"
          if [ -n "${body//[[:space:]]/}" ]; then
            echo "release-tag: $VERSION has its notes."
          elif [ "$PRERELEASE" = true ]; then
            echo "release-tag: $VERSION is a pre-release; its notes are the generated list."
          else
            echo "release-tag: $VERSION has no draft release with notes." >&2
            echo "  Create a draft release for tag $VERSION with its highlights and" >&2
            echo "  upgrade notes, then re-run ALL jobs: docs/how-to/cut-a-release.md." >&2
            exit 1
          fi

  release:
    name: Publish the GitHub release
    needs: [version, draft]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      # The only job here that writes to this repository, and it writes exactly
      # one thing: the release. Every other job is read-only.
      contents: write
    steps:
      # A re-run of ONLY the failed jobs does not re-execute `version`, and
      # GitHub drops the outputs of a job that did not run. Every use of
      # `version` below then expands to the empty string, and the release would
      # be cut under no name at all. Named here, once, rather than as a failure
      # that traces back to nothing the releaser did.
      - name: Require the release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "The version job reported no version. That happens when only the" >&2
            echo "failed jobs were re-run: version did not re-execute and GitHub" >&2
            echo "dropped its outputs. Re-run ALL jobs so the tag is read again." >&2
            exit 1
          fi
      # The merge subjects since the last release, and the script that lists
      # them: full history and tags, no file contents but the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/release-notes.sh
          sparse-checkout-cone-mode: false
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The install step belongs on this page and not only in the docs,
          # because the release page is where a reader decides how to run it.
          # A QUOTED heredoc, so the backticks and brackets stay literal.
          cat > install.md <<'NOTES'
          Margince ships as container images for your own servers: the api, the
          worker and the web front end. How to build, deploy and configure them:
          [docs/how-to/deploy-margince.md](https://github.com/margince/margince/blob/main/docs/how-to/deploy-margince.md)
          NOTES

          # The hand-written half: the draft's body, or on a re-run the
          # published body above the marker, so the generated half is rebuilt
          # instead of stacked a second time.
          marker='<!-- release-tag: generated below -->'
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$VERSION\")" > existing.json
          jq -r '.body // ""' existing.json |
            awk -v marker="$marker" '$0 == marker {stop = 1} !stop {print}' > written.md

          # The newest plain release this commit descends from; none before the
          # first one, which then lists no generated changes.
          previous="$(git tag --merged "$REVISION^" --list 'v[0-9]*' --sort=-v:refname |
            awk '!/-/ && !found {print; found = 1}')"

          # GitHub refuses a body over 125,000 characters. The generated half
          # gets what the written text leaves, less room for the headings, and
          # the whole body is measured before the release is written.
          limit=125000
          room=$((limit - $(wc -m < written.md) - $(wc -m < install.md) - 1000))
          {
            cat written.md
            printf '\n%s\n\n## Changes\n\n' "$marker"
            if [ -n "$previous" ]; then
              git log --first-parent --format=%s "$previous..$REVISION" |
                bash scripts/release-notes.sh "$previous" "$VERSION" "$GH_REPO" "$room"
            else
              echo "The first release: the notes above cover everything before it."
            fi
            printf '\n## Install\n\n'
            cat install.md
            printf '\nRevision: %s\n' "$REVISION"
          } > notes.md
          size="$(wc -m < notes.md)"
          if [ "$size" -gt "$limit" ]; then
            echo "release-tag: the notes of $VERSION are $size characters; GitHub takes $limit." >&2
            echo "  Shorten the draft release, then re-run ALL jobs." >&2
            exit 1
          fi

          # Re-running a failed run after the release was created must not fail:
          # it edits the existing release instead.
          if [ -s existing.json ]; then
            echo "release-tag: $VERSION exists as a draft or a release — filling it in"
            # The notes are rebuilt above on every run, so a re-run is also the
            # only way to correct them. Without this the body keeps whatever the
            # first run wrote, and a wrong instruction on the release page would
            # be unfixable by the lane that wrote it.
            args=(--title "Margince $VERSION" --notes-file notes.md --draft=false --prerelease="$PRERELEASE")
            gh release edit "$VERSION" "${args[@]}"
          else
            args=(--target "$REVISION" --title "Margince $VERSION" --notes-file notes.md --verify-tag)
            if [ "$PRERELEASE" = true ]; then
              args+=(--prerelease)
            fi
            gh release create "$VERSION" "${args[@]}"
          fi

          echo "release-tag: published $VERSION" >> "$GITHUB_STEP_SUMMARY"
