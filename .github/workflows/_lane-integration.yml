# The real-Postgres lane, as a callable unit.
#
# Called by ci.yml. It carries NO `if:` of its own — the caller decides whether
# this lane runs at all, and that is the whole point of the split: a lane's jobs
# either all run or the lane is skipped, so `needs.<lane>.result == 'skipped'`
# means exactly one thing (the caller skipped it) rather than "some job inside
# quietly did not run". The `ci` aggregate reads that distinction and refuses a
# skip on the merge queue, so an internal conditional here would reopen the
# skip-as-pass hole one level down.
#
# `defaults.run.working-directory` does NOT inherit from a calling workflow, so
# it is restated below. Without it every step would run from the repository root
# and the Go jobs would fail to find their module.
name: _lane-integration

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

# A module the proxy cannot serve is not a broken build: the PIPE falls through
# to the source on any error, where Go's default comma falls through only on a
# 404. Why that distinction reached `main` as a product break:
# backend/gates/buildinputfetch_test.go, which holds this line.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # The lane's one compile. A shard's slice is per-TEST, so every shard runs
  # nearly every package, and each used to compile and link nearly the whole
  # lane itself. This job builds every package's covered test binary once, with
  # the flags the shards ran (scripts/test-integration-parallel.sh,
  # INTEGRATION_BUILD_OUT), and the shards run those binaries.
  #
  # It needs no database. A package that does not compile fails this job, the
  # shards then do not start, and the fan-in names the build as the cause.
  integration-build:
    name: integration build
    timeout-minutes: 30
    # The compile scales with cores (`go test` and `zstd -T0` take them all), so
    # a larger runner is one repository variable away. A label no runner has
    # queues the job for up to 24 hours, which timeout-minutes does not bound.
    runs-on: ${{ vars.INTEGRATION_BUILD_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The `integration` flavour, which cache-warm.yml writes on `main` by
      # running one shard from source.
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: integration
      - name: Compile every integration test binary
        env:
          INTEGRATION_BUILD_OUT: ${{ runner.temp }}/integration-bin
        run: make test-integration
      # The test durations the shards split by: the newest entry the
      # `integration-timing` job of cache-warm.yml saved on main. The key never
      # matches, so the restore takes the newest entry by prefix.
      - name: Restore the measured test durations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/integration-test-timing.txt
          key: integration-test-timing-${{ github.run_id }}
          restore-keys: integration-test-timing-
      # Chosen once and packed with the binaries, so every shard of the run
      # deals from the same file; the fan-in checks that they did. With no cache
      # entry, the committed file stands in.
      - name: Add the test durations to the binaries
        run: |
          timing="$RUNNER_TEMP/integration-test-timing.txt"
          if [[ -s "$timing" ]]; then
            echo "The shards split by the cached test durations ($(grep -vc '^#' "$timing") lines)."
          else
            timing="$GITHUB_WORKSPACE/scripts/integration-test-timing.txt"
            echo "No cached test durations: the shards split by the committed scripts/integration-test-timing.txt."
          fi
          cp "$timing" "$RUNNER_TEMP/integration-bin/test-timing.txt"
      # The shards share one queue of parts in the cache service
      # (scripts/lib-shardqueue.sh). Asked once here and packed with the
      # binaries, so every shard of the run works the same way; a run that may
      # not write caches gets the fixed split.
      - name: Expose the results service to the next steps
        uses: ./.github/actions/results-service-env
      - name: Choose how the shards share the lane
        env:
          QUEUE_PREFIX: shard-queue-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mode="$("$GITHUB_WORKSPACE/scripts/shard-queue-mode.sh" "$QUEUE_PREFIX")"
          printf 'mode=%s\nattempt=%s\n' "$mode" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/integration-bin/shard-queue.txt"
          echo "The shards share the lane by: $mode"
      # A tarball because an artifact keeps no file mode, and a binary without
      # its execute bit fails every slot. zstd because the binaries come to
      # about 2.8 GB and pack to about a third of that; the upload then stores
      # the tarball as it is, since a second compression buys nothing.
      - name: Pack the test binaries
        run: tar -I 'zstd -T0' -cf "$RUNNER_TEMP/integration-bin.tar.zst" -C "$RUNNER_TEMP/integration-bin" .
      # Not named `integration-*`: the fan-in downloads that pattern and has no
      # use for the binaries.
      - name: Upload the test binaries
        uses: ./.github/actions/upload-artifact-retried
        with:
          name: test-binaries-integration
          path: ${{ runner.temp }}/integration-bin.tar.zst
          compression-level: '0'
          if-no-files-found: error
          retention-days: 1

  # Sharded across independent runners. One runner already fans packages out
  # onto per-package clone DBs, but the heaviest package (compose/integration,
  # minutes of serial tests) floors any package-level split — so the lane is cut
  # per TEST into parts of every package, and each shard runs parts against its
  # own Postgres/Redis/MinIO. Which parts: the groups it claims from the queue
  # the shards share, so a fast runner takes more (scripts/lib-shardqueue.sh),
  # or a fixed slice when the build chose that (INTEGRATION_SHARD). The
  # `integration` fan-in below reconciles the slices back into one verdict and
  # one coverage profile.
  #
  # The caller runs this lane in parallel with the Go gate, not behind it: gating
  # the longest lane on the build gate serialized the two slowest jobs and
  # dominated PR wall-clock. A broken build is still caught by the Go gate
  # itself, and sonarcloud gates its scan on that result directly.
  integration-shards:
    name: integration shard (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [integration-build]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # A red shard must not cancel its siblings: one CI run should report
      # every failing test, not the first shard to trip.
      fail-fast: false
      # Eight. The slice is per-TEST, and each shard also pays a fixed cost of
      # downloading the lane's binaries and building its template, so more
      # shards buy a smaller slice at the price of another copy of that cost.
      # Six was right while a shard's own tests were the small half (~40s
      # against ~420s of restore and compile). The tests have grown since: the
      # `internal/compose/integration` package alone sums to ~2600s of test
      # time, so six shards left it ~440s each, too near the package budget,
      # and a slow runner killed the shard with no test reported. Eight leaves
      # ~330s each. Raise it again only against a measurement of the same kind.
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The test binaries come from the build job, but a shard still needs Go and
      # this cache. It checks the binaries against its checkout with `go list`
      # and the toolchain's version, and it `go run`s gen-composition,
      # cmd/migrate (794 packages, for the template and every clone) and
      # tools/sql-census. Those builds are in the `integration` flavour that
      # cache-warm.yml writes; without it each shard compiles them from cold.
      - name: Restore the Go build cache
        id: go-cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: integration
      - name: Download the test binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-binaries-integration
          path: ${{ runner.temp }}
      - name: Unpack the test binaries
        run: |
          mkdir -p "$RUNNER_TEMP/integration-bin"
          tar -I zstd -xf "$RUNNER_TEMP/integration-bin.tar.zst" -C "$RUNNER_TEMP/integration-bin"
      - name: Expose the results service to the next steps
        uses: ./.github/actions/results-service-env
      # The claims of each attempt are their own, so `Re-run failed jobs` gets a
      # fresh queue. When the build did not run again, the green shards of the
      # earlier attempt keep their groups, and the shards that run again skip
      # them (INTEGRATION_QUEUE_DONE).
      - name: Read how the shards share the lane
        id: queue
        run: |
          mode="$(sed -n 's/^mode=//p' "$RUNNER_TEMP/integration-bin/shard-queue.txt")"
          built="$(sed -n 's/^attempt=//p' "$RUNNER_TEMP/integration-bin/shard-queue.txt")"
          spec="" later=false
          if [[ "$mode" == queue ]]; then
            spec="cache:shard-queue-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            [[ "$built" == "$GITHUB_RUN_ATTEMPT" ]] || later=true
          fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "later=$later" >> "$GITHUB_OUTPUT"
          echo "mode=$mode, binaries built in attempt $built, this is attempt $GITHUB_RUN_ATTEMPT"
      - name: Download the shard results of the earlier attempt
        if: steps.queue.outputs.later == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: integration-shard-*
          path: ${{ runner.temp }}/earlier
      # The same compose stack dev machines use (docker-compose.dev.yml:
      # Postgres + Redis + MinIO, digest-pinned there) plus scripts/db-init.sql
      # for the cluster-level margince_app role — migration 0015 GRANTs to it,
      # and the parallel lane's clones inherit those grants. One stack
      # definition instead of hand-mirrored GH service containers; the lane's
      # database admin goes through cmd/migrate's db verbs on the test DSN
      # (scripts/lib-testdb.sh db_admin), so no host psql is assumed.
      - name: Start the dev infra stack (compose + app role)
        run: make db-up
      # INTEGRATION_SHARD_OUT collects the slice manifests + binary coverage
      # pods the fan-in reconciles and merges — so the scan is NOT a second
      # Postgres/Redis/MinIO stack running the whole lane a second time.
      - name: Integration shard (slice + coverage)
        env:
          INTEGRATION_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          INTEGRATION_SHARD_OUT: ${{ runner.temp }}/shard-out
          INTEGRATION_BIN_DIR: ${{ runner.temp }}/integration-bin
          INTEGRATION_TEST_TIMING: ${{ runner.temp }}/integration-bin/test-timing.txt
          INTEGRATION_QUEUE: ${{ steps.queue.outputs.spec }}
          INTEGRATION_QUEUE_DONE: ${{ steps.queue.outputs.later == 'true' && format('{0}/earlier', runner.temp) || '' }}
          # The tests are DB-bound, not CPU-bound: on the 4-core runner the
          # nproc-derived default leaves the slice mostly waiting on Postgres.
          # So this stays above `min(nproc, 8)` = 4 — the CPU reading behind it
          # is right, and a slice that sits waiting on Postgres wants more than
          # one package per core.
          #
          # It is EIGHT rather than the sixteen it was, because the CPU reading
          # priced no memory and memory is what ran out. Sixteen concurrent
          # packages are sixteen `go test` heaps plus sixteen Postgres backends
          # with their own work_mem, on a 4-core/16GB runner that also carries
          # the compose stack. The probe on the step below caught two shards
          # going from 14.7GB available and zero reclaim stall to 4kB of swap
          # free and 63% of wall time stalled, and then being signalled — while
          # a third shard in the same run never left 14.7GB and passed (#5483).
          #
          # Keep the probe's PSI at 0.00 the test of this number. A slice that
          # starts stalling on reclaim again is this value asking to come down
          # further, and the log says so on every run without anyone bisecting.
          INTEGRATION_JOBS: 8
        # The probe runs BESIDE the shard rather than around it because the
        # failure it exists to explain takes the runner with it: these shards are
        # killed mid-run with `exit 143`, and the job then skips every remaining
        # step, artifact upload included. There is no "after" to collect in, so
        # the record has to already be in the log (#5483).
        #
        # It is killed on the way out rather than left to the runner, so a shard
        # that ENDS does not keep a writer on a descriptor the step has finished
        # with. The trap cannot change the exit status make reports: it runs
        # after it, and `kill` failing on an already-dead probe is not a failure
        # of the lane.
        run: |
          probe="$GITHUB_WORKSPACE/scripts/probe-runner-pressure.sh"
          # Checked BEFORE it is backgrounded, and absolute because this lane
          # runs from `backend/`. A `&` puts the startup failure in a subshell
          # where `set -e` cannot see it, so a probe that cannot run would leave
          # the shard green with no trace — which is the silent half of the
          # problem it exists to solve, not a harmless no-op.
          test -x "$probe"
          "$probe" &
          probe_pid=$!
          trap 'kill "$probe_pid" 2>/dev/null || true' EXIT
          make test-integration
      # `!cancelled()` and not the default success(): a RED shard is exactly when
      # somebody needs this artifact, and on failure the script writes the
      # failing packages' logs + a failure-summary.txt into the same directory.
      # Uploading only on green kept the evidence for the runs that did not need
      # it and destroyed it with the runner for the runs that did.
      #
      # It does NOT reach the shard kills of #5483, and the guard is not what to
      # widen. Those mark the JOB cancelled, so this step is skipped along with
      # both post-actions — verified on run 34797597596, shard 1/6. `always()`
      # would fire here, but it would also fire on the cancellation `ci` issues
      # itself on every push to an open pull request, where the directory is
      # empty and `if-no-files-found: error` would turn a cancelled shard into a
      # failed one. That is why the probe on the step above writes to stdout
      # instead: those runs are read from the log, not from an artifact.
      - name: Upload the shard manifest + coverage pods
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-artifact-retried
        with:
          name: integration-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-out
          if-no-files-found: error
          retention-days: 1

  # Unit coverage for SonarCloud. The shards run only the integration-tagged
  # packages, but the unit-only packages need a `-cover` pass of their own —
  # otherwise SonarCloud sees them at a false ~0% new-code coverage and the
  # gate fails on well-unit-tested code. Untagged tests never open a real DB
  # (the test-lanes gate enforces it), so this pass needs no services; it runs
  # beside the shards and the fan-in merges its pods with theirs.
  #
  # It lives in this lane rather than beside it because the fan-in is what
  # consumes its pods: when the fan-in does not run, nothing ever reads them.
  # Split across two scopes — this job on `backend`, the shards on `backend_db` —
  # a rulebook-only change ran this job and then discarded its output.
  integration-unit-coverage:
    name: integration unit coverage
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Shallow: the unit tests that read history all live in backend/gates,
      # which this pass skips, and deterministic-gates runs them with full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The `plain` flavour, not `integration`: this pass is untagged. Coverage
      # instrumentation means its own package builds miss, but the dependency
      # builds underneath — the bulk of a cold compile — hit.
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: plain
      # Only packages with code of their own. A test-only package (backend/gates
      # today) covers code whose own tests already cover it: 307 of 254k
      # statements, for the longest package run of the lane. It still runs,
      # uncovered, in deterministic-gates.
      - name: Unit tests with binary coverage
        run: |
          mkdir -p "$RUNNER_TEMP/covdata-unit"
          pkgs=$(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./...)
          [ -n "$pkgs" ] || { echo "go list found no package with code; refusing an empty coverage pass" >&2; exit 1; }
          echo "skipped as test-only: $(go list -f '{{if not .GoFiles}}{{.ImportPath}}{{end}}' ./... | xargs)"
          # shellcheck disable=SC2086 # one argument per package
          go test $pkgs -cover -coverpkg=./... -covermode=atomic -args -test.gocoverdir="$RUNNER_TEMP/covdata-unit"
      - name: Upload the unit coverage pods
        uses: ./.github/actions/upload-artifact-retried
        with:
          name: integration-covdata-unit
          path: ${{ runner.temp }}/covdata-unit
          if-no-files-found: error
          retention-days: 1

  # The fan-in: this is the result the caller's `integration` job reports, and
  # therefore what the `ci` aggregate reads. It must RUN and FAIL when a shard
  # fails — `needs` alone would leave it skipped, and a skipped required check
  # counts as passing — hence the always() guard plus the explicit result
  # assertions. Then it proves the slices add up
  # (scripts/test-integration-reconcile.sh: every shard present, same discovery,
  # union complete + disjoint) and merges every binary coverage pod (shards +
  # unit) into the one text profile the sonarcloud job consumes. The shards are
  # checked after that, so a shard that died is named with the tests it took.
  integration:
    name: integration (isolation + erasure + HTTP e2e)
    timeout-minutes: 20
    needs: [integration-build, integration-shards, integration-unit-coverage]
    # always(), and not !cancelled(): the latter is false for every job once a
    # run is cancelled, so cancelling mid-lane would have skipped this check and
    # greened it. The assertion below sees `cancelled` and fails on it.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build first: when it fails the shards are skipped, and "shards:
      # skipped" would name the wrong job. The shards are checked after the
      # reconcile, which names the tests a red or lost shard took.
      - name: The build and the unit pass are green
        working-directory: .
        env:
          BUILD_RESULT: ${{ needs.integration-build.result }}
          UNIT_RESULT: ${{ needs.integration-unit-coverage.result }}
        run: |
          [ "$BUILD_RESULT" = "success" ] || { echo "integration build: $BUILD_RESULT"; exit 1; }
          [ "$UNIT_RESULT" = "success" ] || { echo "unit coverage pass: $UNIT_RESULT"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download the shard + unit artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: integration-*
          path: ${{ runner.temp }}/shards
      - name: Reconcile the slices and merge coverage
        working-directory: .
        run: ./scripts/test-integration-reconcile.sh "$RUNNER_TEMP/shards" backend/coverage.out
      - name: Every shard is green
        working-directory: .
        env:
          SHARDS_RESULT: ${{ needs.integration-shards.result }}
        run: '[ "$SHARDS_RESULT" = "success" ] || { echo "integration shards: $SHARDS_RESULT"; exit 1; }'
      # What this run measured, for cache-warm.yml to weigh the next splits by.
      # Only a run whose slices reconciled gets here. Neither step can fail the
      # lane: a lost file costs the next split some freshness, never a verdict.
      - name: Collect the measured test durations
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/test-timing"
          cat "$RUNNER_TEMP"/shards/integration-shard-*/test-timing.txt > "$RUNNER_TEMP/test-timing/test-timing.txt"
      # Not `integration-*`, which the download above reads as shard output.
      - name: Upload the measured test durations
        continue-on-error: true
        uses: ./.github/actions/upload-artifact-retried
        with:
          name: test-timing-integration
          path: ${{ runner.temp }}/test-timing/test-timing.txt
          if-no-files-found: error
          retention-days: 3
      - name: Upload Go coverage
        uses: ./.github/actions/upload-artifact-retried
        with:
          name: go-coverage
          path: backend/coverage.out
          if-no-files-found: ignore
          retention-days: 1

  integration-ext-migrations:
    name: integration (extension migration gate)
    timeout-minutes: 20
    # Parallel to the shards, not after them: it reads the tree and none of their
    # output, so waiting for the slowest shard only lengthens the lane.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The extension migration gate (ADR-0120) — the ONE gate in the tier that
      # is not textual: it applies each unit's migrations as that unit's own
      # restricted ext_<name> role against a throwaway database and checks the
      # resulting catalog against the allowlist.
      #
      # It lives on the integration lane, and not in check-backend where
      # it started. From the first unit that ships a migrations/ layer the gate
      # needs a cluster, and the Go gate is the fastest merge gate and
      # container-free: arming it there would put a compose-stack start on every
      # backend PR forever, to buy locality once. This lane is already the slow,
      # cluster-bearing path.
      #
      # It ARMS ITSELF off the same condition the script tests, so the first
      # migrations/ layer to land gets the cluster with no workflow edit and
      # nobody having to remember. `make db-up` is the same compose stack the
      # shards use (docker-compose.dev.yml + scripts/db-init.sql for the
      # cluster-level margince_app role migration 0015 GRANTs to), not a
      # hand-mirrored service container. No margince_test template is built:
      # the gate deliberately migrates a FRESH database under the root
      # workspace rather than cloning the shared template, because a template
      # migrated under the COMPOSED workspace already holds the very
      # ext.ext_<name>_* objects the gate is about to apply.
      #
      # If the glob matches and the cluster is missing, the script FAILS with a
      # named error rather than skipping — a gate that quietly checks nothing
      # looks exactly like a passing one.
      - name: Extension migration gate (armed by the tree)
        working-directory: .
        run: |
          if ls -d extensions/*/migrations >/dev/null 2>&1; then
            echo "an enabled unit declares migrations/ — starting the test cluster"
            make db-up
          else
            echo "no enabled unit declares a migrations/ layer — the gate stays hermetic"
          fi
          make check-ext-migrations
