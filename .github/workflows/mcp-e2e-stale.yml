# Which MCP end-to-end verdicts does this pull request make stale?
#
# Each committed verdict under backend/internal/compose/aicert/records/mcp_e2e*/
# carries a stamp of what it measured. This holds every verdict against the
# stamps of the base tree and of this change, and names the ones that were
# current before and are not now: the change moved a scenario, the copy of a
# tool it names, the server instructions, the judge or the harness. The list
# comes from the stamps (backend/internal/compose/mcpe2e), never from a list
# kept by hand.
#
# IT REPORTS AND NEVER BLOCKS, for the reason docs-describing.yml gives: `ci` is
# the one required check, and a paid run is never what a pull request waits on.
name: mcp-e2e-stale

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - docs/reference/mcp-info.json
      - e2e/llm/**
      - backend/internal/compose/aicert/records/mcp_e2e/**
      - backend/internal/compose/aicert/records/mcp_e2e_rest/**
      - backend/internal/compose/mcpe2e/**

permissions:
  contents: read

# A module the proxy cannot serve falls through to the source, as in every
# workflow that installs Go (backend/gates/buildinputfetch_test.go).
env:
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stale:
    name: MCP verdicts this change makes stale (reports, never blocks)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, for the sticky comment the list lives in.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: List the verdicts this change makes stale
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/base"
          # A base that cannot be read says nothing, rather than a list made
          # against the wrong tree. The job still succeeds.
          if ! git fetch -q --depth=1 origin "$BASE_SHA" || ! git worktree add -q "$base" "$BASE_SHA"; then
            echo "could not check out the base; saying nothing rather than guessing" >&2
            exit 0
          fi
          status=0
          list="$(cd backend && go run ./internal/compose/mcpe2e/mcpe2ecmd newly-stale -base "$base")" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "could not stamp one of the two trees; saying nothing rather than guessing" >&2
            exit 0
          fi
          printf '%s\n' "${list:-This change makes no MCP end-to-end verdict stale.}" | tee -a "$GITHUB_STEP_SUMMARY"

          # One sticky comment, found by its marker, and deleted once nothing
          # is stale, so a fixed finding leaves nothing behind.
          marker='<!-- mcp-e2e-stale -->'
          existing="$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/comments" \
            --jq "[.[] | select(.body != null and (.body | contains(\"$marker\"))) | .id] | first // empty" || true)"
          if [ -z "$list" ]; then
            if [ -n "$existing" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${existing}" >/dev/null || true
            fi
            exit 0
          fi
          body="$(printf '%s\n%s' "$marker" "$list")"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing}" -f body="$body" >/dev/null || true
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR}/comments" -f body="$body" >/dev/null || true
          fi
