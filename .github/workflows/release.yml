name: Release

# A dist release by hand. A tag push cuts its test dist release in
# release-tag.yml, which calls _release-dist.yml after its own SBOM job. This
# run calls the same lane for a tag that already exists.
#
# Two dist services exist, each with its own registry and publisher tokens. A
# tag push publishes to test. Only this run reaches production, with target
# production, so each production release is chosen by hand after test took the
# same tag. A run with target test serves again a tag whose test release failed.
#
# The run builds the commit the tag names. --ref only picks the copy of this
# workflow that runs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to build, such as v1.0.0. It must be on main, and its version above every release that went out.'
        required: true
        type: string
      target:
        description: 'The dist service: test (dist.test.margince.com) or production (dist.margince.com).'
        required: true
        type: choice
        options: [test, production]
        default: test

permissions:
  contents: read

jobs:
  # The dist service has no pre-release, so a suffixed tag runs nothing.
  sbom:
    name: SBOMs
    if: ${{ !contains(inputs.tag, '-') }}
    # A newer run of the same tag and target replaces this scan.
    concurrency:
      group: release-dist-sbom-${{ inputs.target }}-${{ inputs.tag }}
      cancel-in-progress: true
    uses: ./.github/workflows/_release-sbom.yml
    with:
      tag: ${{ inputs.tag }}
      ref: refs/tags/${{ inputs.tag }}
      artifact: release-sboms

  dist:
    name: Dist release
    needs: [sbom]
    uses: ./.github/workflows/_release-dist.yml
    with:
      tag: ${{ inputs.tag }}
      target: ${{ inputs.target }}
      sbom-artifact: release-sboms
    # The dist jobs read the publisher and tool tokens. Production tokens
    # come from the dist-production environment that those jobs name.
    secrets: inherit
