name: scheduled

# The checks whose answer changes when nothing is being merged.
#
# Everything in ci.yml answers "is this diff sound?" and runs because a diff
# exists. These four answer "is main still sound?", which a PR gate structurally
# cannot: two of them go stale on their own, one goes quiet, and one was too
# expensive to ask on every merge.
#
#   govulncheck        — the vulnerability database changes daily. A per-PR scan
#                        proves the day it merged, not today. This is the only
#                        thing here that can catch a CVE disclosed after a merge.
#   sonarcloud gate    — main's quality gate stopped being a required PR check
#                        (ADR-less product decision: merge speed during heavy
#                        development, to be re-required once releases exist). A
#                        gate nobody is blocked by is a gate nobody reads, so
#                        this reads it and files an issue when it goes red.
#   backend lane       — main has gone red twice with the breakage MASKED: a
#                        docs-only commit landing after a breaking one matches no
#                        classifier scope, so every gate skips and the run reports
#                        green. main's last-known-green is therefore not evidence
#                        main is green. This re-runs the lane unconditionally.
#   fe clock drift     — the frontend suite, run as if it were 200 days from now.
#                        Three tests began failing on a date nobody edited
#                        anything on (#1977): a fixture carried an absolute expiry
#                        and the component compares it to now. No PR gate can
#                        catch that, because the change that breaks it is the
#                        CALENDAR rather than a diff — and it sat red on main for
#                        a month behind the classifier skipping the frontend jobs.
#   perf budgets       — PERF-3/PERF-7 rode the integration lane at the SMB tier
#                        until it stopped being worth 37.9s of every merge gate
#                        for a claim it could not make: the SLO binds at
#                        mid-market, and a row measured below it renders
#                        `inconclusive`, never `within budget`. Weekly is the
#                        honest cadence for a budget nobody merges against —
#                        drift nobody looks for is drift nobody finds. SMB only:
#                        mid-market does not finish inside a CI budget (see
#                        bench-perf-check), and an alarm that cannot finish files
#                        a breach it never measured.
#
# A fifth job earns its place here for the same reason rather than the same
# question. reap-caches is maintenance, not a verdict on main — but the state it
# maintains only ever drifts BETWEEN merges, and its failure mode is silence:
# caches evict each other and lanes get slower with nothing to point at. A thing
# that decays on the calendar belongs on the calendar.
#
# Findings become ISSUES, not just a red run. A failed scheduled workflow notifies
# essentially nobody by default, and this whole file exists because "we will check
# regularly" decays into nobody checking.
on:
  schedule:
    # 08:00 Asia/Ho_Chi_Minh — clear of Renovate's 02:00–06:00 window, and early
    # enough in the working day that a finding is read the morning it appears.
    - cron: "0 1 * * *"
    # Monday only, an hour later so it never shares a runner minute with the
    # daily lane: perf-budgets seeds 250k contacts twice and is the one job here
    # measured in tens of minutes. Jobs pick their cadence by matching
    # github.event.schedule against these strings, so the two must stay distinct
    # — and a job that matches NEITHER never runs on a schedule at all.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      perf:
        description: "Also run the PERF-3/PERF-7 budgets (SMB tier; mid-market is by hand, `make bench-perf`)"
        type: boolean
        default: false
      llm:
        description: "Also run the six use cases against a real model (COSTS TOKENS; needs CLAUDE_CODE_OAUTH_TOKEN)"
        type: boolean
        default: false

permissions:
  contents: read

# A slow lane must not stack up on itself: a run still going when the next fires
# means the tree is in trouble, and two concurrent copies help nobody diagnose it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  vuln:
    # The DAILY cadence. Spelled per job because a job with no `if` runs on
    # every trigger the workflow has, so the weekly perf cron would otherwise
    # run this a second time on Mondays — a second 45-minute gate, and a
    # second "still failing" comment on every issue the 01:00 run just filed.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
    name: govulncheck (main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Restore-only here: the action saves on `push` to main, and a schedule is
      # not a push, so this lane never competes with the writers in ci.yml.
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: plain
      - run: make vuln

  quality-gate:
    # The DAILY cadence. Spelled per job because a job with no `if` runs on
    # every trigger the workflow has, so the weekly perf cron would otherwise
    # run this a second time on Mondays — a second 45-minute gate, and a
    # second "still failing" comment on every issue the 01:00 run just filed.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
    name: sonarcloud quality gate (main)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      status: ${{ steps.gate.outputs.status }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: .
    steps:
      # Reads the gate through the API rather than re-running the scanner: the
      # verdict this asks about is the one the last ci.yml scan already published,
      # so re-analysing would answer a different question and cost a full lane.
      - name: Read main's quality gate
        id: gate
        env:
          PROJECT_KEY: margince_margince
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN not set; nothing to read." >&2
            echo "status=SKIPPED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Bearer header rather than `-u "$TOKEN:"`. The basic-auth spelling is
          # what Sonar's own docs show, but it trips gitleaks' curl-auth-user rule
          # — correctly, in the sense that the rule cannot tell a variable from a
          # literal. Sonar accepts either, so the header avoids arguing for an
          # allowlist entry, and an allowlist that grows is how a secret scan
          # starts reporting "no leaks found" over a tree that has one.
          # Timeouts, because a stalled read here is worse than a failed one: the
          # concurrency group below does not cancel in progress, so a request that
          # hangs holds the lane and every later scheduled run queues behind it.
          # A day with no answer is recoverable; a lane that stops answering is not.
          body="$(curl -fsS --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT_KEY&branch=main")"
          status="$(printf '%s' "$body" | jq -r '.projectStatus.status')"
          echo "quality gate on main: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # NONE is not a pass. It means no analysis is attached to main at all,
          # which reads identically to green on every dashboard and is exactly the
          # silence this job exists to break.
          case "$status" in
            OK) ;;
            ERROR | WARN)
              printf '%s' "$body" | jq -r \
                '.projectStatus.conditions[]? | select(.status != "OK")
                 | "  failing: \(.metricKey) \(.comparator) \(.errorThreshold) (actual \(.actualValue))"'
              exit 1
              ;;
            *)
              echo "no quality gate result for main (status=$status)" >&2
              exit 1
              ;;
          esac

  backend-lane:
    # The DAILY cadence. Spelled per job because a job with no `if` runs on
    # every trigger the workflow has, so the weekly perf cron would otherwise
    # run this a second time on Mondays — a second 45-minute gate, and a
    # second "still failing" comment on every issue the 01:00 run just filed.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
    name: backend lane (main)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # rbacbaselineerafixture_test.go reads the migration baseline commit and
          # fail rather than degrade on a shallow checkout.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: plain
      - name: Cache the gate binaries
        id: gate-binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: gate-binaries-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.mod', 'backend/Makefile') }}
      - name: Install the pinned gate binaries
        if: steps.gate-binaries.outputs.cache-hit != 'true'
        working-directory: .
        run: make tools
      - name: Gate binaries onto PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Backend merge gate (make check-backend)
        working-directory: .
        run: make check-backend

  # PERF-3/PERF-7 on the SMB tier, weekly. It is the only job here gated on a
  # cadence rather than running every time the workflow fires: the daily lane
  # must not pay 40+ minutes of contact seeding for a budget nobody merges
  # against. A dispatch runs it only when asked (the `perf` input), so somebody
  # re-checking govulncheck by hand does not also seed a quarter of a million
  # contacts twice.
  #
  # It records NOTHING. MARGINCE_BENCH_RECORD stays unset, so the suite gates and
  # prints; `make bench-perf` is the only thing that writes into
  # docs/reference/perfbench/, and it is run by a person. A machine writing its
  # own numbers into the tree is the failure that switch exists to prevent.
  perf-budgets:
    name: perf budgets (PERF-3/PERF-7, SMB tier)
    outputs:
      outcome: ${{ steps.bench.outputs.outcome }}
    if: github.event.schedule == '0 2 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.perf)
    runs-on: ubuntu-latest
    # The SMB tier measures in under a minute on a fast machine; 30 leaves room
    # for a slow runner and for the seed, without letting a hung one sit until
    # the six-hour default. Mid-market is deliberately not here — see
    # bench-perf-check in backend/Makefile for why a job that cannot finish is
    # worse than no job.
    #
    # The target's own `go test -timeout` is 20m, DERIVED from this rather than
    # equal to it: checkout, setup-go, the cache restore and `db-up` all spend
    # wall clock before the test starts, so a 30m inner budget inside a 30m job
    # could never fire. The job would be killed first and the hang would report
    # as an opaque timeout with no goroutine dump — and the reporter would file a
    # budget breach for what was actually a hang.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The `integration` flavour, not a third one of its own: this suite builds
      # with `-tags 'integration bench'`, and the dependency builds underneath —
      # which is what the restored cache is actually worth — are the ones the
      # integration shards already warmed. The handful of `bench`-tagged package
      # builds recompile, and that is the whole delta.
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: integration
      - name: Start the dev infra stack (compose + app role)
        if: steps.funded.outputs.configured == 'yes'
        working-directory: .
        run: make db-up
      # The step separates "a budget breached" from "the lane could not run",
      # because the job result cannot: a failed checkout, a cold cache, a
      # refused database or a hung seed all reach the reporter as `failure`, and
      # an issue that says a budget is breaching sends somebody bisecting a
      # regression that may not exist.
      #
      # The distinction is taken from the harness's own words. search.Gate()
      # fails with `search: perfbench: <query> p95 …` (perfbench.go:107) — the
      # only path that prints that prefix is a measured budget being exceeded.
      # Anything else that fails is the lane, not the product.
      - name: PERF-3/PERF-7 on the SMB tier
        id: bench
        working-directory: .
        run: |
          set -o pipefail
          if make bench-perf-check 2>&1 | tee bench.log; then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "search: perfbench:" bench.log; then
            echo "outcome=breach" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=lane-failed" >> "$GITHUB_OUTPUT"
          fi
          exit 1

  # The six deck use cases, driven by a REAL assistant.
  #
  # WEEKLY, and gated on a secret that may not exist. This is the half the Go
  # suite in integration/e2e/usecases/ cannot answer: those tests pin the
  # payloads, the refusals and the legibility fields, and they would all stay
  # green while the product became unusable to a model. The only way to learn
  # whether an assistant can drive this surface and say something TRUE is to
  # have one try.
  #
  # It costs real tokens, which is why it is weekly and not per-merge, and why
  # it shares the Monday cron with perf-budgets rather than the daily one.
  #
  # NOT DETERMINISTIC, by construction. Each scenario runs three times and
  # passes at two, because one bad run out of three is the weather and two is a
  # defect. A job that demanded 3/3 would be red most weeks and would teach
  # everyone to ignore it.
  #
  # The secret is CLAUDE_CODE_OAUTH_TOKEN — a subscription token minted by
  # `claude setup-token`, which is the credential the Claude CLI accepts for a
  # subscription outside an interactive login. Know what that means before
  # re-pointing it: the lane bills one human's subscription, and anybody with
  # write access can spend it by dispatching this workflow. The runner also
  # accepts ANTHROPIC_API_KEY, and a Console key billed to the project is the
  # better answer the day there is one — but this job supplies exactly one
  # credential either way, for the reason given at the step. If the secret is
  # absent the job SKIPS rather than fails: a lane nobody has funded yet must
  # not turn main red every Monday, and a skipped job says "not configured"
  # where a red one says "broken".
  llm-use-cases:
    name: use cases, driven by a model (weekly)
    outputs:
      outcome: ${{ steps.lane.outputs.outcome }}
    # Same Monday cron as perf-budgets. A dispatch runs it only when asked, so
    # somebody re-checking govulncheck by hand does not spend tokens.
    if: >-
      (github.event.schedule == '0 2 * * 1'
        || (github.event_name == 'workflow_dispatch' && inputs.llm))
    runs-on: ubuntu-latest
    # Eighteen model calls, plus a database rebuild between the runs of each
    # write scenario. Locally the sweep takes about 25 minutes; 60 leaves room
    # for a slow runner and a slow model without letting a hung one sit until
    # the six-hour default.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The lane reaches the app through the FRONTEND port — dev_app_base_url
      # returns Vite's, and its /v1 and /mcp proxy is what the assistant talks
      # to. So a job that only exercises the API still needs the frontend
      # installed and running. Worth knowing before anyone tries to trim it:
      # the saving is not available without changing what the lane connects to.
      # The secret gate, and it is a STEP rather than a job-level `if` because a
      # job condition cannot read `secrets` — GitHub does not expose that context
      # to `jobs.<id>.if`, so a job guarded on it would evaluate the secret to an
      # empty string and skip forever, including after somebody adds it.
      # Checked here, where the context exists, and reported as a skip rather
      # than a failure: an unfunded lane must not turn main red every Monday.
      - name: Is the model lane funded?
        id: funded
        env:
          KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "configured=no" >> "$GITHUB_OUTPUT"
            {
              echo "### The model-driven use cases did not run"
              echo
              echo "\`CLAUDE_CODE_OAUTH_TOKEN\` is not set for this repository, so there"
              echo "is nothing to drive the assistant with. This is a SKIP, not a failure:"
              echo "the lane costs real tokens and nobody has funded it yet."
              echo
              echo "To turn it on, add the secret: a subscription token from"
              echo "\`claude setup-token\`. It bills the account that minted it, and"
              echo "anybody with write access can spend it by dispatching this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: plain
      - name: Install the frontend
        if: steps.funded.outputs.configured == 'yes'
        working-directory: .
        # --ignore-scripts (githubactions:S6505): no lifecycle scripts run at
        # install; esbuild ships prebuilt platform binaries as optional deps.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the Claude CLI
        if: steps.funded.outputs.configured == 'yes'
        uses: ./.github/actions/install-claude-cli
        with:
          version: 2.1.236
      - name: Start the dev infra stack (compose + app role)
        if: steps.funded.outputs.configured == 'yes'
        working-directory: .
        run: make db-up
      # The step separates "the model answered badly" from "the lane could not
      # run", because the job result cannot: a missing CLI, a stack that will
      # not boot, a seed that fails, or a credential the MCP endpoint rejects
      # all reach the reporter as `failure`. Filing "the assistant is answering
      # wrongly" for any of those sends somebody reading transcripts for a
      # defect that is not there — which is exactly what happened on this lane's
      # first local run, where a passport destroyed by a database rebuild
      # presented itself as six scenarios of unhelpful model behaviour.
      #
      # The distinction is taken from the runner's own words: it prints
      # "scenarios: N passed, M failed" only once every scenario has actually
      # been driven. No such line means the lane never got that far.
      #
      # Exactly ONE credential reaches the CLI. Adding ANTHROPIC_API_KEY beside
      # the token would not be a fallback: the CLI ranks the key above the
      # token, so the token would go unused, and a stale key would then fail
      # every run while the summary above named the token as what funds it.
      - name: The six use cases (MARGINCE_E2E_LLM=1 make e2e-llm)
        id: lane
        if: steps.funded.outputs.configured == 'yes'
        working-directory: .
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MARGINCE_E2E_LLM: "1"
          E2E_LLM_SLUG: ci
        run: |
          set -o pipefail
          if make e2e-llm 2>&1 | tee llm.log; then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "^scenarios: " llm.log; then
            echo "outcome=scenario-failed" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=lane-failed" >> "$GITHUB_OUTPUT"
          fi
          exit 1
      # The transcripts are the finding. A verdict line says case 6 failed; only
      # the transcript says the assistant quoted the record correctly and then
      # repeated a note's wrong month in its own voice. Kept for 30 days, which
      # outlives the next two runs — long enough to compare a regression against
      # the week it appeared.
      - name: Keep the run transcripts
        if: always() && steps.funded.outputs.configured == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-llm-transcripts
          path: e2e/llm/records/
          retention-days: 30
          # ERROR, not warn. An empty records/ means the lane never drove a
          # scenario, and the first CI run passed this step while uploading
          # nothing — a green step on top of a job that had already failed 30
          # seconds in. The absence of transcripts is itself the finding.
          if-no-files-found: error

  # PERF-1's PERCEIVED budget (MOBILE-AC-2), the browser half of what
  # perf-budgets measures over HTTP.
  #
  # A SIBLING job rather than a step in perf-budgets, because the two share a
  # cadence and nothing else: that one is Go against a seeded Postgres, this one
  # is Playwright against the built SPA with the network mocked at the edge.
  # Folding this in would make a browser toolchain a dependency of a job that
  # seeds a quarter of a million contacts, and a failure in either would report
  # as the other.
  #
  # It records NOTHING, for the reason bench-perf-check states above: a record
  # is a human's to publish, and a scheduled job is the machine that rule is
  # about. `make bench-mobile-check` CLEARS MARGINCE_BENCH_RECORD rather than
  # leaving it unset, so writing nothing is a property of the target rather than
  # of this runner's environment.
  #
  # Why this budget is schedulable when the acceptance lane's unthrottled
  # assertion was not: the Fast-3G profile's per-request latency dominates
  # runner contention, and the recorded p95 is 65 ms against a 300 ms budget.
  # The assertion that was removed sat at 1027 against 1000 — a single
  # wall-clock sample on a runner shared with six integration shards, which
  # measured the machine. Headroom is what makes the difference, so if this lane
  # starts failing on contention rather than on a regression, the answer is to
  # take it out again rather than to widen the budget it exists to hold.
  perf-mobile:
    name: perf budget (MOBILE-AC-2, throttled Fast-3G)
    outputs:
      outcome: ${{ steps.bench.outputs.outcome }}
    # The same weekly cadence and the same dispatch input as perf-budgets: both
    # are the perf lane, and a reader turning "the budgets" on by hand means
    # both halves of the published page rather than whichever one they recalled.
    if: github.event.schedule == '0 2 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.perf)
    runs-on: ubuntu-latest
    # DERIVED from the measurement rather than picked: 20 samples over a link
    # throttled to Fast-3G is what the spec's own 300s per-test bound covers,
    # and install, `pnpm build` and the browser download are the rest. A job
    # ceiling equal to the inner bound could never let the inner one fire, and a
    # hang would then report as an opaque cancellation with no p95 line — which
    # the outcome branch below reads as a lane failure, correctly, but with
    # nothing to say why.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The browser only. `make bench-mobile-check` runs the install and the
      # build itself, so doing them here as well would install twice and leave
      # two spellings of the lane's setup to drift apart.
      - name: Install the Playwright Chromium browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      # The step separates "the budget breached" from "the lane could not run",
      # exactly as perf-budgets does and for the same reason: a failed install,
      # a build error or a preview server that never came up all reach the
      # reporter as `failure`, and an issue saying a budget is breaching sends
      # somebody bisecting a regression that does not exist.
      #
      # The distinction is taken from the spec's own words. It logs
      # `perfbench [fast-3g/390px]: record_open_perceived p95=…` and THEN
      # asserts, so the line is present exactly when a measurement was taken —
      # its absence means the run never got that far.
      - name: MOBILE-AC-2 on a throttled Fast-3G profile at 390px
        id: bench
        working-directory: .
        run: |
          set -o pipefail
          if make bench-mobile-check 2>&1 | tee bench-mobile.log; then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "perfbench \[fast-3g/390px\]:" bench-mobile.log; then
            echo "outcome=breach" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=lane-failed" >> "$GITHUB_OUTPUT"
          fi
          exit 1

  # The suite's verdict must not depend on the calendar.
  #
  # A fixture date only becomes a bomb when the COMPONENT compares it to now to
  # decide a state, and no static rule separates those from the dates a component
  # merely formats — "an absolute date in a file that never pins the clock"
  # matches most of the suite's fixtures, nearly all of them harmless. So the
  # gate is a second RUN rather than a pattern: shift the clock, require the same
  # verdict. A test that pins its own clock is unaffected, which is correct — it
  # is already immune to what this lane looks for.
  fe-clock-drift:
    name: fe clock drift (main, +200 days)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: make fe-clock-drift

  # Delete the build caches nothing can restore. The go-build key ends in the
  # commit sha and falls back through restore-keys to the newest entry sharing
  # its deps hash, so within one deps hash only the newest is ever read — and one
  # push to main writes ~5 GB across the two flavours against a 10 GB quota. Left
  # alone, GitHub evicts least-recently-used, which reaches node-cache,
  # gate-binaries and setup-go first: the cheap caches are evicted by the
  # expensive ones and several lanes get slower with nothing to point at.
  #
  # The only job holding `actions: write`, and it runs no build code — the same
  # permission isolation the report job below uses for `issues: write`. The test
  # runs FIRST, beside the tool it tests, exactly as test-secret-scan.sh runs
  # beside the scan: this one deletes, so "it succeeded" is not evidence it kept
  # the right entry.
  reap-caches:
    # The DAILY cadence. Spelled per job because a job with no `if` runs on
    # every trigger the workflow has, so the weekly perf cron would otherwise
    # run this a second time on Mondays — a second 45-minute gate, and a
    # second "still failing" comment on every issue the 01:00 run just filed.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
    name: reap superseded build caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The reaper keeps the reachable entry (stubbed, deletes nothing)
        run: ./scripts/test-reap-build-caches.sh
      - name: Reap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: ./scripts/reap-build-caches.sh

  # The one job holding `issues: write`, and it runs no build code — the same
  # permission isolation sbom.yml's signing job uses. It must RUN when an upstream
  # fails, so it is guarded on !cancelled() rather than needs alone.
  report:
    name: report
    needs: [vuln, quality-gate, backend-lane, fe-clock-drift, perf-budgets, perf-mobile, llm-use-cases, reap-caches]
    if: >-
      !cancelled()
      && (needs.vuln.result == 'failure'
        || needs.quality-gate.result == 'failure'
        || needs.backend-lane.result == 'failure'
        || needs['fe-clock-drift'].result == 'failure'
        || needs.perf-budgets.result == 'failure'
        || needs['perf-mobile'].result == 'failure'
        || needs['llm-use-cases'].result == 'failure'
        || needs.reap-caches.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: .
    steps:
      # The reporting script lives in the tree, so this job needs the tree — the
      # only thing it checks out for. persist-credentials: false because the issue
      # filing authenticates with GH_TOKEN explicitly, not the git credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One open issue per failing check, keyed on an exact title. Re-filing daily
      # would bury the original and its discussion; a comment on the existing one
      # says "still red" without costing anyone a second triage.
      - name: File or update an issue per failing check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VULN_RESULT: ${{ needs.vuln.result }}
          GATE_RESULT: ${{ needs.quality-gate.result }}
          GATE_STATUS: ${{ needs.quality-gate.outputs.status }}
          LANE_RESULT: ${{ needs.backend-lane.result }}
          CLOCK_RESULT: ${{ needs['fe-clock-drift'].result }}
          PERF_RESULT: ${{ needs.perf-budgets.result }}
          PERF_OUTCOME: ${{ needs.perf-budgets.outputs.outcome }}
          MOBILE_RESULT: ${{ needs['perf-mobile'].result }}
          MOBILE_OUTCOME: ${{ needs['perf-mobile'].outputs.outcome }}
          LLM_RESULT: ${{ needs['llm-use-cases'].result }}
          LLM_OUTCOME: ${{ needs['llm-use-cases'].outputs.outcome }}
          CACHE_RESULT: ${{ needs.reap-caches.result }}
        run: ./scripts/scheduled-report.sh
