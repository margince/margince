name: scheduled

# The checks whose answer changes when nothing is being merged.
#
# Everything in ci.yml answers "is this diff sound?" and runs because a diff
# exists. These answer "is main still sound?", which a PR gate structurally
# cannot: two of them go stale on their own, two go quiet, and one was too
# expensive to ask on every merge.
#
#   govulncheck        — the vulnerability database changes daily. A per-PR scan
#                        proves the day it merged, not today. This is the only
#                        thing here that can catch a CVE disclosed after a merge.
#   sonarcloud gate    — main's quality gate stopped being a required PR check
#                        (ADR-less product decision: merge speed during heavy
#                        development, to be re-required once releases exist). A
#                        gate nobody is blocked by is a gate nobody reads, so
#                        this reads it and files an issue when it goes red.
#   renovate liveness  — Renovate is the ONLY mechanism that adopts a fix for a
#                        lockfile-only transitive advisory; renovate.json argues
#                        that at length. When it stops, nothing here notices: no
#                        lane reddens, no PR is blocked, and the tracker reads
#                        like a healthy day. It stopped for nineteen days after
#                        this repository changed owner, and what found it was
#                        somebody chasing a Dependabot alert.
#   backend lane       — main has gone red twice with the breakage MASKED: a
#                        docs-only commit landing after a breaking one matches no
#                        classifier scope, so every gate skips and the run reports
#                        green. main's last-known-green is therefore not evidence
#                        main is green. This re-runs the lane unconditionally.
#   fe clock drift     — the frontend suite, run as if it were 200 days from now.
#                        Three tests began failing on a date nobody edited
#                        anything on (#1977): a fixture carried an absolute expiry
#                        and the component compares it to now. No PR gate can
#                        catch that, because the change that breaks it is the
#                        CALENDAR rather than a diff — and it sat red on main for
#                        a month behind the classifier skipping the frontend jobs.
#   every story        — fe-uat renders only the stories a diff reaches, so a story
#                        red on main stays hidden until a change fans out to it.
#   perf budgets       — PERF-3/PERF-7 rode the integration lane at the SMB tier
#                        until it stopped being worth 37.9s of every merge gate
#                        for a claim it could not make: the SLO binds at
#                        mid-market, and a row measured below it renders
#                        `inconclusive`, never `within budget`. Weekly is the
#                        honest cadence for a budget nobody merges against —
#                        drift nobody looks for is drift nobody finds. Two jobs,
#                        one per tier: SMB is the drift alarm; mid-market is where
#                        the SLO binds and enforces the same budgets, which five
#                        runner measurements showed hold.
#
#   vendor live        — one real call to each data vendor, daily. The offline
#                        tests read a recording of the vendor's API, which stays
#                        green when the vendor changes it.
#
#   home growth        — Home's reads as the bench mail grows a year per step,
#                        nightly. It fits how a read grows and fails when one is
#                        predicted to reach 10 s within the horizon. Too slow
#                        for a merge gate, and growth is a calendar question.
#
#   role sweep         — every MCP tool and action called as every seeded role,
#                        weekly. It takes longer than a merge-gate shard allows,
#                        so the per-PR lane holds the committed matrix to the
#                        registry and the listing, and this re-measures it.
#
#   slop trend         — the slop scores and the comment numbers, once a week,
#                        beside last week's. Not a verdict: the comment checks
#                        judge only added lines, and this is what shows whether
#                        the rest of the tree gets better.
#
# The weekly perf measurements also RECORD what they measured. The records job
# (_records.yml) proposes them as a pull request and never writes to main: a
# record is published when a human reviews and merges it. The MCP use cases a
# model drives are not here: they cost tokens, so mcp-sweep.yml runs them only
# when a maintainer starts it.
#
# One more job earns its place here for the same reason rather than the same
# question. reap-caches is maintenance, not a verdict on main — but the state it
# maintains only ever drifts BETWEEN merges, and its failure mode is silence:
# caches evict each other and lanes get slower with nothing to point at. A thing
# that decays on the calendar belongs on the calendar.
#
# Findings become ISSUES, not just a red run. A failed scheduled workflow notifies
# essentially nobody by default, and this whole file exists because "we will check
# regularly" decays into nobody checking.
on:
  schedule:
    # 08:00 Asia/Ho_Chi_Minh — clear of Renovate's 02:00–06:00 window, and early
    # enough in the working day that a finding is read the morning it appears.
    - cron: "0 1 * * *"
    # Monday only, an hour later so it never shares a runner minute with the
    # daily lane: perf-budgets seeds 250k contacts twice and is the one job here
    # measured in tens of minutes. Jobs pick their cadence by matching
    # github.event.schedule against these strings, so the two must stay distinct
    # — and a job that matches NEITHER never runs on a schedule at all.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      perf:
        description: "Also run and record the PERF budgets (SMB tier and mobile) and measure mid-market once"
        type: boolean
        default: false
      perf_measure:
        description: "Measure PERF-3/PERF-7 on the mid-market tier on five runners and print each p95 in the job summary (nothing recorded)"
        type: boolean
        default: false
      trend:
        description: "Also record the slop trend (craft slop and craft stats against last week's run)"
        type: boolean
        default: false
      roles:
        description: "Also run the MCP role sweep (`make test-roles`, about ten minutes on a runner)"
        type: boolean
        default: false
      growth:
        description: "Also run the Home growth bench (`make bench-growth`, the nightly size)"
        type: boolean
        default: false

permissions:
  contents: read

# A slow lane must not stack up on itself: a run still going when the next fires
# means the tree is in trouble, and two concurrent copies help nobody diagnose it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# A module the proxy cannot serve is not a broken build: the PIPE falls through
# to the source on any error, where Go's default comma falls through only on a
# 404. Why that distinction reached `main` as a product break:
# backend/gates/buildinputfetch_test.go, which holds this line.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  vuln:
    # The DAILY cadence. Spelled per job because a job with no `if` runs on
    # every trigger the workflow has, so the weekly perf cron would otherwise
    # run this a second time on Mondays — a second 45-minute gate, and a
    # second "still failing" comment on every issue the 01:00 run just filed.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
    name: govulncheck (main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Restore-only here: the action saves on `push` to main, and a schedule is
      # not a push, so this lane never competes with the writers in ci.yml.
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: plain
      - run: make vuln

  quality-gate:
    # The DAILY cadence. Spelled per job because a job with no `if` runs on
    # every trigger the workflow has, so the weekly perf cron would otherwise
    # run this a second time on Mondays — a second 45-minute gate, and a
    # second "still failing" comment on every issue the 01:00 run just filed.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
    name: sonarcloud quality gate (main)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      status: ${{ steps.gate.outputs.status }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: .
    steps:
      # Reads the gate through the API rather than re-running the scanner: the
      # verdict this asks about is the one the last ci.yml scan already published,
      # so re-analysing would answer a different question and cost a full lane.
      - name: Read main's quality gate
        id: gate
        env:
          PROJECT_KEY: margince_margince
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN not set; nothing to read." >&2
            echo "status=SKIPPED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Bearer header rather than `-u "$TOKEN:"`. The basic-auth spelling is
          # what Sonar's own docs show, but it trips gitleaks' curl-auth-user rule
          # — correctly, in the sense that the rule cannot tell a variable from a
          # literal. Sonar accepts either, so the header avoids arguing for an
          # allowlist entry, and an allowlist that grows is how a secret scan
          # starts reporting "no leaks found" over a tree that has one.
          # Timeouts, because a stalled read here is worse than a failed one: the
          # concurrency group below does not cancel in progress, so a request that
          # hangs holds the lane and every later scheduled run queues behind it.
          # A day with no answer is recoverable; a lane that stops answering is not.
          body="$(curl -fsS --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT_KEY&branch=main")"
          status="$(printf '%s' "$body" | jq -r '.projectStatus.status')"
          echo "quality gate on main: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # NONE is not a pass. It means no analysis is attached to main at all,
          # which reads identically to green on every dashboard and is exactly the
          # silence this job exists to break.
          case "$status" in
            OK) ;;
            ERROR | WARN)
              printf '%s' "$body" | jq -r \
                '.projectStatus.conditions[]? | select(.status != "OK")
                 | "  failing: \(.metricKey) \(.comparator) \(.errorThreshold) (actual \(.actualValue))"'
              # A rating names no finding, and whoever triages the issue may have
              # no dashboard access, so the log names each finding behind it.
              # A failed listing still leaves the gate red.
              echo "open security and reliability findings in new code on main:"
              curl -fsS --connect-timeout 10 --max-time 60 \
                -H "Authorization: Bearer $SONAR_TOKEN" \
                "https://sonarcloud.io/api/issues/search?componentKeys=$PROJECT_KEY&branch=main&inNewCodePeriod=true&issueStatuses=OPEN,CONFIRMED&impactSoftwareQualities=SECURITY,RELIABILITY&ps=100" \
                | jq -r '.issues[]
                  | "  \([.impacts[]? | "\(.softwareQuality)/\(.severity)"] | join(",")) \(.rule) \(.component | sub("^[^:]*:"; "")):\(.line // "-") \(.message)"' \
                || echo "  could not list the findings; open the project's issues on SonarCloud" >&2
              exit 1
              ;;
            *)
              echo "no quality gate result for main (status=$status)" >&2
              exit 1
              ;;
          esac

  renovate-liveness:
    # The DAILY cadence. Spelled per job because a job with no `if` runs on
    # every trigger the workflow has, so the weekly perf cron would otherwise
    # run this a second time on Mondays — a second 45-minute gate, and a
    # second "still failing" comment on every issue the 01:00 run just filed.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
    name: renovate liveness (main)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      status: ${{ steps.liveness.outputs.status }}
      outcome: ${{ steps.liveness.outputs.outcome }}
    defaults:
      run:
        working-directory: .
    steps:
      # The script lives in the tree, so this job needs the tree.
      # persist-credentials: false because the reads below authenticate with
      # GH_TOKEN explicitly rather than through the git credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Read-only against the tracker, and cheap: two REST reads and one search.
      # It asks whether the bot has ACTED lately, which is the only question
      # that distinguishes a healthy quiet week from an installation that
      # stopped resolving — the repository's own files look identical either way,
      # so nothing a gate could read from the tree can answer this.
      - name: Has Renovate run lately?
        id: liveness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: ./scripts/check-renovate-liveness.sh

  # The backend's counterpart to fe-clock-drift: the suite's verdict must not
  # depend on the calendar. It moves the runner's own clock, and
  # scripts/clock-drift-host.sh says why no other shift reaches both Go and
  # Postgres.
  #
  # Order matters: checkout, module download, the gate binaries and the compose
  # pull all finish at the real date, because a 200-day jump expires the TLS
  # certificates they verify. Only then does the clock move.
  backend-clock-drift:
    # The DAILY cadence, spelled per job: a job with no `if` runs on every
    # trigger the workflow has, so the weekly perf cron would run this too.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
    name: backend clock drift (main, +200 days)
    runs-on: ubuntu-latest
    # This runs the integration lane too, on one
    # runner rather than across the shards ci.yml splits it into.
    # Nine slices at 15 minutes plus 30s kill grace, and eight 60s gaps, take
    # up to 148 minutes; the rest covers setup and the clock restore.
    timeout-minutes: 170
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.suites.outputs.outcome }}
    env:
      BACKEND_CLOCK_SKEW: machine:200
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # rbacbaselineerafixture_test.go reads the migration baseline commit and
          # fails rather than degrades on a shallow checkout.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: integration
      - name: Gate binaries on PATH
        uses: ./.github/actions/gate-binaries
      - name: Start the dev infra stack (compose + app role)
        run: make db-up
      - name: Compile the suites at the real date
        run: make -C backend build
      # `build` reads no `_test.go`, so a module only a tagged test imports is
      # still missing here. It has to arrive while certificates verify: a runner
      # 200 days ahead trusts none, and the fetch fails as `[setup failed]` on a
      # package that reads as a finding about the tree.
      - name: Fetch what only the tagged tests import
        run: make -C backend fetch-test-deps
      # Keep the clock jump, suites and recovery in one shell: the runner's
      # control-plane credentials must be valid before it starts another step.
      # The script moves the clock once per suite slice and restores it after each,
      # so the runner agent sees real time between slices.
      # outcome=calendar only on the line scripts/backend-clock-drift.sh prints
      # after the suites failed under a shift it proved still in force.
      - name: The backend suites at the moved clock
        id: suites
        run: |
          if ./scripts/clock-drift-host.sh run "${BACKEND_CLOCK_SKEW##*:}" 2>&1 | tee clock-drift.log; then
            exit 0
          fi
          if grep -q '^backend-clock-drift: the suites failed at ' clock-drift.log; then
            echo "outcome=calendar" >> "$GITHUB_OUTPUT"
          fi
          exit 1
      # The clock goes back even when the suites failed. A runner handed back to
      # the pool 200 days ahead poisons whatever runs on it next, and that
      # failure would surface in someone else's lane with nothing to point at.
      - name: Restore the clock
        if: always()
        run: ./scripts/clock-drift-host.sh restore "${BACKEND_CLOCK_SKEW##*:}"

  # PERF-3/PERF-7 on the SMB tier, weekly. It is the only job here gated on a
  # cadence rather than running every time the workflow fires: the daily lane
  # must not pay 40+ minutes of contact seeding for a budget nobody merges
  # against. A dispatch runs it only when asked (the `perf` input), so somebody
  # re-checking govulncheck by hand does not also seed a quarter of a million
  # contacts twice.
  #
  # It records through `make bench-perf`, the target run by hand, so the
  # weekly number and a by-hand one are one measurement. The record is written
  # before the gate, so a breach is proposed too; the records job carries it to a
  # pull request, never to main.
  perf-budgets:
    name: perf budgets (PERF-3/PERF-7, SMB tier)
    outputs:
      outcome: ${{ steps.bench.outputs.outcome }}
    if: github.event.schedule == '0 2 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.perf)
    runs-on: ubuntu-latest
    # The SMB tier measures in under a minute on a fast machine; 30 leaves room
    # for a slow runner and for the seed, without letting a hung one sit until
    # the six-hour default. Mid-market has its own job, perf-mid-market, because
    # its seed is two orders of magnitude larger.
    #
    # The target's own `go test -timeout` is 20m, DERIVED from this rather than
    # equal to it: checkout, setup-go, the cache restore and `db-up` all spend
    # wall clock before the test starts, so a 30m inner budget inside a 30m job
    # could never fire. The job would be killed first and the hang would report
    # as an opaque timeout with no goroutine dump — and the reporter would file a
    # budget breach for what was actually a hang.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The `integration` flavour, not a third one of its own: this suite builds
      # with `-tags 'integration bench'`, and the dependency builds underneath —
      # which is what the restored cache is actually worth — are the ones the
      # integration shards already warmed. The handful of `bench`-tagged package
      # builds recompile, and that is the whole delta.
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: integration
      - name: Start the dev infra stack (compose + app role)
        working-directory: .
        run: make db-up
      # The step separates "a budget breached" from "the lane could not run",
      # because the job result cannot: a failed checkout, a cold cache, a
      # refused database or a hung seed all reach the reporter as `failure`, and
      # an issue that says a budget is breaching sends somebody bisecting a
      # regression that may not exist.
      #
      # The distinction is taken from the harness's own words. search.Gate()
      # fails with `search: perfbench: <query> p95 …` (perfbench.go:107) — the
      # only path that prints that prefix is a measured budget being exceeded.
      # Anything else that fails is the lane, not the product.
      - name: PERF-3/PERF-7 on the SMB tier
        id: bench
        working-directory: .
        run: |
          set -o pipefail
          if make bench-perf BENCH_PERF_TIER=smb BENCH_PERF_TIMEOUT=20m BENCH_RENDER= 2>&1 | tee bench.log; then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "search: perfbench:" bench.log; then
            echo "outcome=breach" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=lane-failed" >> "$GITHUB_OUTPUT"
          fi
          exit 1
      # The committed file goes up whether or not this run rewrote it; records
      # keeps it only when it differs from the tree.
      - name: Keep the record
        if: always()
        uses: ./.github/actions/upload-artifact-retried
        with:
          name: bench-perf-record
          path: docs/reference/perfbench/bench-perf.json
          retention-days: 30
          if-no-files-found: ignore

  # PERF-3/PERF-7 on the mid-market tier, where the PERF-7 SLO binds. It runs
  # `make bench-perf-check`, which writes no record and proposes no pull request.
  # A measured breach reaches the reporter the way the SMB one does.
  #
  # The budgets are the shared Perf3Budget and Perf7Budget. Five runs on
  # runners measured the PERF-3 p95 at 147 to 186 ms against 200 ms, so they
  # hold with little room. BENCH_PERF_GATE below is the line that lets a breach
  # fail the job. A dispatch with `perf_measure` always measures only, on five
  # runners at once, so the spread between runners can be read again.
  perf-mid-market:
    name: perf budgets (PERF-3/PERF-7, mid-market tier, run ${{ matrix.run }})
    outputs:
      outcome: ${{ steps.bench.outputs.outcome }}
    if: github.event.schedule == '0 2 * * 1' || (github.event_name == 'workflow_dispatch' && (inputs.perf || inputs.perf_measure))
    runs-on: ubuntu-latest
    # The go test budget (45m) sits inside this, with room for checkout, the cache
    # restore and `db-up`, for the reason given on perf-budgets.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.perf_measure && '[1,2,3,4,5]' || '[1]') }}
    env:
      BENCH_PERF_GATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: integration
      - name: Start the dev infra stack (compose + app role)
        working-directory: .
        run: make db-up
      # Breach and lane failure are told apart as on perf-budgets: only the
      # harness's own "search: perfbench:" message is a measured breach.
      - name: PERF-3/PERF-7 on the mid-market tier
        id: bench
        working-directory: .
        env:
          MEASURE_ONLY: ${{ inputs.perf_measure }}
        run: |
          set -o pipefail
          if [ "$MEASURE_ONLY" = "true" ]; then BENCH_PERF_GATE=0; fi
          if make bench-perf-check BENCH_PERF_CHECK_TIER=mid_market BENCH_PERF_CHECK_TIMEOUT=45m 2>&1 | tee bench.log; then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "search: perfbench:" bench.log; then
            echo "outcome=breach" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=lane-failed" >> "$GITHUB_OUTPUT"
          fi
          exit 1
      - name: Report the p95 of this run
        if: always()
        working-directory: .
        run: |
          {
            echo "### mid-market tier, run ${{ matrix.run }}"
            echo
            echo "| query | p50 | p95 | p99 | budget |"
            echo "|---|---|---|---|---|"
            sed -nE 's/.*perfbench \[[a-z_]+\]: ([a-z_0-9]+) p50=([^ ]+) p95=([^ ]+) p99=([^ ]+) \(budget ([^,]+),.*/| \1 | \2 | \3 | \4 | \5 |/p' bench.log
            grep -h "gate not enforced" bench.log || true
          } >> "$GITHUB_STEP_SUMMARY"

  # PERF-1's PERCEIVED budget (MOBILE-AC-2), the browser half of what
  # perf-budgets measures over HTTP.
  #
  # A SIBLING job rather than a step in perf-budgets, because the two share a
  # cadence and nothing else: that one is Go against a seeded Postgres, this one
  # is Playwright against the built SPA with the network mocked at the edge.
  # Folding this in would make a browser toolchain a dependency of a job that
  # seeds a quarter of a million contacts, and a failure in either would report
  # as the other.
  #
  # It records through `make bench-mobile`, the target run by hand, and
  # the records job proposes the record as a pull request, as for perf-budgets.
  #
  # Why this budget is schedulable when the acceptance lane's unthrottled
  # assertion was not: the Fast-3G profile's per-request latency dominates
  # runner contention, and the recorded p95 is 65 ms against a 300 ms budget.
  # The assertion that was removed sat at 1027 against 1000 — a single
  # wall-clock sample on a runner shared with the integration shards, which
  # measured the machine. Headroom is what makes the difference, so if this lane
  # starts failing on contention rather than on a regression, the answer is to
  # take it out again rather than to widen the budget it exists to hold.
  perf-mobile:
    name: perf budget (MOBILE-AC-2, throttled Fast-3G)
    outputs:
      outcome: ${{ steps.bench.outputs.outcome }}
    # The same weekly cadence and the same dispatch input as perf-budgets: both
    # are the perf lane, and a reader turning "the budgets" on by hand means
    # both halves of the published page rather than whichever one they recalled.
    if: github.event.schedule == '0 2 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.perf)
    runs-on: ubuntu-latest
    # DERIVED from the measurement rather than picked: 20 samples over a link
    # throttled to Fast-3G is what the spec's own 300s per-test bound covers,
    # and install, `pnpm build` and the browser download are the rest. A job
    # ceiling equal to the inner bound could never let the inner one fire, and a
    # hang would then report as an opaque cancellation with no p95 line — which
    # the outcome branch below reads as a lane failure, correctly, but with
    # nothing to say why.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version input: the pin is package.json's "packageManager", which pnpm
      # and corepack read too. A second one here is refused as a mismatch.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The browser only. `make bench-mobile` runs the install and the
      # build itself, so doing them here as well would install twice and leave
      # two spellings of the lane's setup to drift apart.
      # Retried and split in the action, because `--with-deps` shells out to
      # apt inside the runner and an unresponsive mirror hangs with no output.
      - name: Install the Playwright Chromium browser
        uses: ./.github/actions/install-playwright-chromium
      # The step separates "the budget breached" from "the lane could not run",
      # exactly as perf-budgets does and for the same reason: a failed install,
      # a build error or a preview server that never came up all reach the
      # reporter as `failure`, and an issue saying a budget is breaching sends
      # somebody bisecting a regression that does not exist.
      #
      # The distinction is taken from the spec's own words. It logs
      # `perfbench [fast-3g/390px]: record_open_perceived p95=…` and THEN
      # asserts, so the line is present exactly when a measurement was taken —
      # its absence means the run never got that far.
      - name: MOBILE-AC-2 on a throttled Fast-3G profile at 390px
        id: bench
        working-directory: .
        run: |
          set -o pipefail
          if make bench-mobile BENCH_RENDER= 2>&1 | tee bench-mobile.log; then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "perfbench \[fast-3g/390px\]:" bench-mobile.log; then
            echo "outcome=breach" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=lane-failed" >> "$GITHUB_OUTPUT"
          fi
          exit 1
      - name: Keep the record
        if: always()
        uses: ./.github/actions/upload-artifact-retried
        with:
          name: bench-mobile-record
          path: docs/reference/perfbench/bench-mobile.json
          retention-days: 30
          if-no-files-found: ignore

  # The suite's verdict must not depend on the calendar.
  #
  # A fixture date only becomes a bomb when the COMPONENT compares it to now to
  # decide a state, and no static rule separates those from the dates a component
  # merely formats — "an absolute date in a file that never pins the clock"
  # matches most of the suite's fixtures, nearly all of them harmless. So the
  # gate is a second RUN rather than a pattern: shift the clock, require the same
  # verdict. A test that pins its own clock is unaffected, which is correct — it
  # is already immune to what this lane looks for.
  # The weekly trend of the slop scores and the comment numbers. No gate reads
  # them: the paper behind the scores found they do not predict a failing test,
  # so the job writes this week beside last week in the run summary and keeps
  # the JSON for next week. It fails only when it cannot measure.
  slop-trend:
    name: slop trend (weekly)
    if: github.event.schedule == '0 2 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.trend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Reads the previous run's artifact, the only history the trend has.
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # craft scores TypeScript with the frontend's own compiler.
      - name: Install the frontend packages
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Fetch last week's numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prev="$RUNNER_TEMP/slop-trend-prev"
          mkdir -p "$prev"
          # The newest live artifact from a run on main. A manual run on another
          # branch must not become the week the next run is compared with.
          url="$(gh api "repos/$REPO/actions/artifacts?name=slop-trend&per_page=50" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].archive_download_url // empty')"
          if [[ -z "$url" ]]; then
            echo "No earlier slop-trend artifact from main: this run records the first one."
            exit 0
          fi
          gh api "$url" > "$RUNNER_TEMP/slop-trend-prev.zip"
          unzip -o -q "$RUNNER_TEMP/slop-trend-prev.zip" -d "$prev"
      # runner.temp is not available in a job's env, so the paths are set here.
      - name: Record the trend
        run: SLOP_TREND_DIR="$RUNNER_TEMP/slop-trend" make slop-trend PREV="$RUNNER_TEMP/slop-trend-prev"
      - uses: ./.github/actions/upload-artifact-retried
        with:
          name: slop-trend
          path: ${{ runner.temp }}/slop-trend/*.json
          retention-days: 90

  fe-clock-drift:
    name: fe clock drift (main, +200 days)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version input: the pin is package.json's "packageManager", which pnpm
      # and corepack read too. A second one here is refused as a mismatch.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: make fe-clock-drift

  fe-all-stories:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
    name: every story renders (main)
    runs-on: ubuntu-latest
    # Every story takes about half an hour on four local workers, plus builds; a runner is slower.
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps
        working-directory: frontend
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the Playwright Chromium browser
        uses: ./.github/actions/install-playwright-chromium
      - name: Render every story (make fe-uat ARGS=--all-stories)
        env:
          # The runner is this job's alone, so every core captures.
          FE_UAT_WORKERS: "4"
        run: make fe-uat ARGS=--all-stories
      - name: Collect the manifest and the failing captures
        if: failure()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fe-uat-failures"
          manifest=.tmp/fe-uat/manifest.json
          mkdir -p "$out"
          [ -f "$manifest" ] || exit 0
          cp "$manifest" "$out/"
          jq -r '.stories[] | select(.pass | not) | .png // empty' "$manifest" |
            while IFS= read -r png; do cp "$png" "$out/"; done
      - uses: ./.github/actions/upload-artifact-retried
        if: failure()
        with:
          name: fe-uat-failures
          path: ${{ runner.temp }}/fe-uat-failures
          if-no-files-found: ignore
          retention-days: 14

  # Delete the build caches nothing can restore. The go-build key ends in the
  # commit sha and falls back through restore-keys to the newest entry sharing
  # its deps hash, so within one deps hash only the newest is ever read — and one
  # push to main writes ~5 GB across the two flavours against a 10 GB quota. Left
  # alone, GitHub evicts least-recently-used, which reaches node-cache,
  # gate-binaries and setup-go first: the cheap caches are evicted by the
  # expensive ones and several lanes get slower with nothing to point at.
  #
  # The only job holding `actions: write`, and it runs no build code — the same
  # permission isolation the report job below uses for `issues: write`. The test
  # runs FIRST, beside the tool it tests, exactly as test-secret-scan.sh runs
  # beside the scan: this one deletes, so "it succeeded" is not evidence it kept
  # the right entry.
  reap-caches:
    # The DAILY cadence. Spelled per job because a job with no `if` runs on
    # every trigger the workflow has, so the weekly perf cron would otherwise
    # run this a second time on Mondays — a second 45-minute gate, and a
    # second "still failing" comment on every issue the 01:00 run just filed.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
    name: reap superseded build caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The reaper keeps the reachable entry (stubbed, deletes nothing)
        run: ./scripts/test-reap-build-caches.sh
      - name: Reap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: ./scripts/reap-build-caches.sh

  # One real call to each data vendor, through the production adapter, so a
  # vendor that changed its API is found before a customer's enrichment breaks.
  # The offline pin in surfe/testdata/vendor-wire.json cannot see that change.
  # The credit read costs nothing. Never a required check: a vendor outage must
  # block no merge.
  vendor-live:
    # Daily, and on main only: a dispatch can run from any branch, and a branch
    # must not spend the vendor key or file issues about main.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *')
    name: vendor live check (Surfe credits)
    outputs:
      outcome: ${{ steps.funded.outputs.outcome || steps.live.outputs.outcome }}
      detail: ${{ steps.live.outputs.detail }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A step, not a job `if`, because `jobs.<id>.if` cannot read `secrets`.
      # No key is "not checked", which is no verdict.
      - name: Is there a Surfe key?
        id: funded
        env:
          KEY: ${{ secrets.SURFE_LIVE_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "configured=no" >> "$GITHUB_OUTPUT"
            echo "outcome=not-checked" >> "$GITHUB_OUTPUT"
            {
              echo "### Surfe: not checked, no key. This is not a pass"
              echo
              echo "\`SURFE_LIVE_KEY\` is not set for this repository, so nothing read"
              echo "Surfe's API today. Add a low-limit Surfe key as that secret."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.funded.outputs.configured == 'yes'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Restore the Go build cache
        if: steps.funded.outputs.configured == 'yes'
        uses: ./.github/actions/go-build-cache
        with:
          flavor: plain
      # The test prints one line, `VENDOR_LIVE surfe credits <outcome> [detail]`,
      # and nothing from the response. No line means the check broke before a
      # verdict, and the reporter files that as `no-verdict`.
      - name: Read Surfe's credit balance (make vendor-live)
        id: live
        if: steps.funded.outputs.configured == 'yes'
        env:
          MARGINCE_SURFE_LIVE_KEY: ${{ secrets.SURFE_LIVE_KEY }}
        run: |
          set -o pipefail
          status=0
          make vendor-live 2>&1 | tee vendor-live.log || status=$?
          lines="$(grep -c -E '^VENDOR_LIVE surfe credits ' vendor-live.log || true)"
          line="$(grep -m1 -E '^VENDOR_LIVE surfe credits ' vendor-live.log || true)"
          # Exactly one verdict line counts; two are no verdict at all.
          [ "$lines" = 1 ] || line=""
          verdict="${line#VENDOR_LIVE surfe credits }"
          outcome="${verdict%% *}"
          detail=""
          [ "$verdict" != "$outcome" ] && detail="${verdict#* }"
          case "$status/$outcome" in
          0/ok)
            # A pass carries no detail, so `ok` with anything after it is not one.
            if [ -n "$line" ] && [ -z "$detail" ]; then
              echo "outcome=ok" >> "$GITHUB_OUTPUT"
            else
              echo "::error::make vendor-live gave no verdict that matches its exit status"
              status=1
            fi
            ;;
          [1-9]*/drift | [1-9]*/refused)
            echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
            echo "detail=$detail" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::make vendor-live gave no verdict that matches its exit status"
            [ "$status" -ne 0 ] || status=1
            ;;
          esac
          exit "$status"

  # The speed records the weekly perf jobs measured, proposed as a pull request
  # by the records unit that mcp-sweep.yml shares. !cancelled(), because a
  # measurement that failed may still have recorded: a breach is recorded
  # before its gate fails.
  records:
    name: the speed records
    needs: [perf-budgets, perf-mobile]
    if: >-
      !cancelled()
      && (needs.perf-budgets.result != 'skipped'
        || needs['perf-mobile'].result != 'skipped')
    permissions:
      contents: read
    uses: ./.github/workflows/_records.yml
    with:
      part: speed
      how: >-
        PERF-3/PERF-7: `make bench-perf BENCH_PERF_TIER=smb`, the SMB tier; a PERF-7 row
        measured below mid-market renders `inconclusive`. Job result `${{ needs.perf-budgets.result }}`,
        outcome `${{ needs.perf-budgets.outputs.outcome || 'none' }}`. MOBILE-AC-2: `make bench-mobile`,
        Playwright Chromium on a throttled Fast-3G profile at 390px. Job result
        `${{ needs['perf-mobile'].result }}`, outcome `${{ needs['perf-mobile'].outputs.outcome || 'none' }}`.
    secrets:
      RECORDS_APP_CLIENT_ID: ${{ secrets.RECORDS_APP_CLIENT_ID }}
      RECORDS_APP_PRIVATE_KEY: ${{ secrets.RECORDS_APP_PRIVATE_KEY }}

  # The MCP role sweep, weekly. Every tool and action is called as every seeded
  # role, and the answers must equal the committed mcp-tool-roles/ and
  # toolchecks/ folders. It outgrew a merge-gate shard, so the per-PR lane checks the
  # committed matrix against the registry and the listing, and this measures it.
  role-sweep:
    name: MCP role sweep (weekly)
    if: >-
      github.event.schedule == '0 2 * * 1'
        || (github.event_name == 'workflow_dispatch' && inputs.roles)
    runs-on: ubuntu-latest
    # The make target's own go-test timeout is 45 minutes; this leaves room for
    # the stack to start.
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: integration
      - name: Start the dev infra stack (compose + app role)
        run: make db-up
      - name: The role sweep
        run: make test-roles

  # Home's growth bench, on the nightly cron. The step tells a measured breach
  # from a lane that never got to measure, as perf-budgets does: only the
  # test's own breach line says a budget broke.
  home-growth:
    name: home growth bench (nightly)
    outputs:
      outcome: ${{ steps.bench.outputs.outcome }}
    if: github.event.schedule == '0 1 * * *' || (github.event_name == 'workflow_dispatch' && inputs.growth)
    runs-on: ubuntu-latest
    # The target's go-test timeout is 45 minutes; this leaves room for setup.
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: integration
      - name: Start the dev infra stack (compose + app role)
        run: make db-up
      - name: Home growth bench
        id: bench
        env:
          MARGINCE_BENCH_GROWTH_STEPS: "4"
        run: |
          set -o pipefail
          if make bench-growth BENCH_GROWTH_TIMEOUT=45m 2>&1 | tee growth.log; then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "home-growth: breach" growth.log; then
            echo "outcome=breach" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=lane-failed" >> "$GITHUB_OUTPUT"
          fi
          exit 1

  # The one job holding `issues: write`, and it runs no build code — the same
  # permission isolation sbom.yml's signing job uses. It must RUN when an upstream
  # fails, so it is guarded on !cancelled() rather than needs alone.
  report:
    name: report
    needs: [vuln, quality-gate, renovate-liveness, backend-clock-drift, fe-clock-drift, fe-all-stories, perf-budgets, perf-mid-market, perf-mobile, records, reap-caches, slop-trend, vendor-live, role-sweep, home-growth]
    # Every result, not only the failures — see the same condition in
    # main-health.yml for why. In short: the reporter now retracts a finding
    # whose check came back green, and a job gated on a failure is never reached
    # on the run that would do it.
    #
    # This lane's two weekly jobs are the reason the condition says `!cancelled()`
    # rather than `always()`: perf-budgets and perf-mobile are `skipped` on the
    # daily cron, and a skipped check is the absence of a verdict. The reporter
    # reads it as neither red nor green, which is only true if it arrives as
    # `skipped` rather than being turned into one by this expression.
    #
    # Only a run on the default branch files or closes an issue about main: a
    # dispatch on another branch measured that branch, not main.
    if: >-
      !cancelled()
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: .
    steps:
      # The reporting script lives in the tree, so this job needs the tree — the
      # only thing it checks out for. persist-credentials: false because the issue
      # filing authenticates with GH_TOKEN explicitly, not the git credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One open issue per failing check, keyed on an exact title. Re-filing daily
      # would bury the original and its discussion; a comment on the existing one
      # says "still red" without costing anyone a second triage.
      - name: File or update an issue per failing check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VULN_RESULT: ${{ needs.vuln.result }}
          GATE_RESULT: ${{ needs.quality-gate.result }}
          GATE_STATUS: ${{ needs.quality-gate.outputs.status }}
          RENOVATE_RESULT: ${{ needs['renovate-liveness'].result }}
          RENOVATE_STATUS: ${{ needs['renovate-liveness'].outputs.status }}
          RENOVATE_OUTCOME: ${{ needs['renovate-liveness'].outputs.outcome }}
          CLOCK_RESULT: ${{ needs['fe-clock-drift'].result }}
          BACKEND_CLOCK_RESULT: ${{ needs['backend-clock-drift'].result }}
          BACKEND_CLOCK_OUTCOME: ${{ needs['backend-clock-drift'].outputs.outcome }}
          STORIES_RESULT: ${{ needs['fe-all-stories'].result }}
          PERF_RESULT: ${{ needs.perf-budgets.result }}
          PERF_OUTCOME: ${{ needs.perf-budgets.outputs.outcome }}
          PERF_MEASURE_ONLY: ${{ inputs.perf_measure }}
          PERF_MM_RESULT: ${{ needs['perf-mid-market'].result }}
          PERF_MM_OUTCOME: ${{ needs['perf-mid-market'].outputs.outcome }}
          MOBILE_RESULT: ${{ needs['perf-mobile'].result }}
          MOBILE_OUTCOME: ${{ needs['perf-mobile'].outputs.outcome }}
          SPEED_RECORDS_RESULT: ${{ needs.records.result }}
          SPEED_RECORDS_PR_RESULT: ${{ needs.records.outputs.proposed }}
          CACHE_RESULT: ${{ needs.reap-caches.result }}
          TREND_RESULT: ${{ needs['slop-trend'].result }}
          VENDOR_LIVE_RESULT: ${{ needs['vendor-live'].result }}
          VENDOR_LIVE_OUTCOME: ${{ needs['vendor-live'].outputs.outcome }}
          VENDOR_LIVE_DETAIL: ${{ needs['vendor-live'].outputs.detail }}
          ROLE_SWEEP_RESULT: ${{ needs['role-sweep'].result }}
          GROWTH_RESULT: ${{ needs['home-growth'].result }}
          GROWTH_OUTCOME: ${{ needs['home-growth'].outputs.outcome }}
        run: ./scripts/scheduled-report.sh
