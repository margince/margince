# The Go build cache has one writer, and it is not a gate.
#
# A warm build cache for this repo measures ~550 MB and is worth most of a Go
# job's wall clock. Until now it was written as a BYPRODUCT of two gating jobs on
# a push to main — which means it depended on a main push surviving to
# completion, and at this repository's merge velocity 64% of them were cancelled.
# The cache was being seeded by accident, rarely.
#
# It cannot move to the merge queue. actions/cache scopes an entry to the branch
# that wrote it plus the default branch, and a merge_group run lives on a
# throwaway `gh-readonly-queue/main/...` ref: an entry saved there is invisible
# to every PR lane and dies with the ref. RESTORING works from anywhere — only
# the write is scoped — so the writer has to run on main, which is what this
# does.
#
# On a SCHEDULE rather than on push. Seeding both flavours means redoing a full
# `make check-backend` and an integration shard against a live Postgres; at ~80
# merges a day, running that pair per push would burn the pipeline and mostly
# self-cancel — the same starvation this whole change exists to remove, merely
# made harmless. Go's build cache is content-addressed and the key ends in the
# commit SHA with restore-keys walking back to the newest prior entry, so a
# three-hour-old entry is substantially warm and never WRONG: it misses the
# entries whose inputs changed and recompiles those.
#
# This workflow gates nothing. A red or cancelled run costs latency on the next
# lane and nothing else.
name: cache-warm

on:
  schedule:
    # Every three hours. Ten-ish merges of drift against a content-addressed
    # cache, which is still a warm restore. pace.yml starts a run from a push once
    # the newest is three hours old, because GitHub drops some of these.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One writer at a time. Two concurrent runs would race for the same key and the
# loser's ~550 MB upload would evict the entry it meant to seed. Never cancel: a
# cancelled run saves nothing, and the entire point is that a run finishes.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# A job in the CI image runs `sh` unless told otherwise, and the steps use bash.
defaults:
  run:
    shell: bash
    working-directory: backend

# A module the proxy cannot serve is not a broken build: the PIPE falls through
# to the source on any error, where Go's default comma falls through only on a
# 404. Why that distinction reached `main` as a product break:
# backend/gates/buildinputfetch_test.go, which holds this line.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # The CI image for main's tree, built here when no pull request pushed it.
  ci-image:
    name: ci-image
    timeout-minutes: 60
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      pinned-image: ${{ steps.image.outputs.pinned-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find or build the CI image
        id: image
        uses: ./.github/actions/ci-image
        with:
          push: "true"
          token: ${{ github.token }}

  # The untagged compile every non-integration Go job reads, once on the runner
  # and once in the CI image: the two put the checkout and the module cache at
  # different paths, so neither can read the other's entry. The image leg runs
  # only when the image can be pulled. Both legs wait on `ci-image`, which is a
  # lookup unless no run has pushed main's image yet; a failed build still
  # leaves the runner leg to run.
  plain:
    name: warm plain (${{ matrix.where }})
    timeout-minutes: 45
    needs: [ci-image]
    strategy:
      fail-fast: false
      matrix:
        where: ${{ fromJSON(needs.ci-image.outputs.pinned-image == '' && '["runner"]' || '["runner", "image"]') }}
    container: ${{ matrix.where == 'image' && needs.ci-image.outputs.pinned-image || '' }}
    # Default branch only, dispatch included. A cache entry is scoped to the
    # branch that wrote it, so a run dispatched from a feature branch spends ~10
    # minutes and ~550 MB of the 10 GB quota on an entry no PR lane and no queue
    # build can read — and it takes the `cancel-in-progress: false` slot ahead of
    # the scheduled main run that would have written a usable one. The workflow
    # says above that the writer has to run on main; this is what makes that true
    # rather than merely intended.
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate this mirrors diffs against origin/main; a shallow checkout
          # would silently disarm it and warm a different set of artifacts than
          # the gate actually compiles.
          fetch-depth: 0
      # The image has Go, so its leg asks for no version and setup-go restores
      # and saves only that leg's module cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.where == 'runner' && 'backend/go.mod' || '' }}
          cache-dependency-path: backend/go.sum
      # KEY ONLY, no restore. This job exists to produce the entry every other Go
      # job restores, and restoring the previous entry before compiling is what
      # made it grow without bound: Go trims a build cache only when its own
      # `trim.txt` marker is over 24 hours old, and this workflow restores that
      # marker and runs every three hours — so the trim can never fire, and
      # nothing was ever removed. Measured on the `plain` entry: 7.43 GB, 7.72,
      # 7.82, 8.40 across nine hours. Monotonic, roughly a gigabyte a day,
      # against a design note that described it as ~550 MB. Eleven Go jobs
      # restore it per run, and the restore alone was 6m35s of a 13m merge gate.
      #
      # Compiled from an empty GOCACHE (the step above; skipping the restore here
      # is necessary but NOT sufficient, because setup-go restores one too), what
      # this saves is exactly the working set of the lane it mirrors — bounded by
      # the build rather than by history. The cold compile costs THIS job, which
      # is scheduled and which nobody waits on.
      # setup-go restores a build cache of its own — small (~25 MB) but not
      # nothing, and it lands in GOCACHE before anything here runs. Without this
      # the entry saved below would carry those artifacts forward, which is the
      # accumulation this job exists to stop, just with a smaller seed.
      #
      # `go clean -cache` rather than `cache: false` on setup-go: only the BUILD
      # cache has to be cold. Turning setup-go's caching off entirely would also
      # drop the module cache and make this job re-download every dependency to
      # produce the same artifacts.
      - name: Start from an empty build cache
        shell: bash
        run: |
          go clean -cache
          echo "GOCACHE is $(go env GOCACHE), now $(du -sm "$(go env GOCACHE)" 2>/dev/null | cut -f1 || echo 0) MB"
      - name: Compute the Go build cache key (this job writes it, never reads it)
        id: go-cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: plain
          restore: "false"
      # `make check-backend` runs golangci over every module, so the gate
      # binaries have to be here or lint-modules fails before it compiles
      # anything — which is what this job exists to do. The action keys them
      # as the ci lane does, and saves a miss here, on main, where every PR
      # can read it. The image holds them.
      - name: Gate binaries on PATH
        if: matrix.where == 'runner'
        uses: ./.github/actions/gate-binaries
        with:
          save: "true"
      # The entry every PR restores: a PR can read only its own entries and
      # main's, and ci.yml saves none.
      - name: Compute the golangci cache key
        id: golangci-key
        uses: ./.github/actions/golangci-cache-key
      - name: Restore the golangci-lint analysis cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ steps.golangci-key.outputs.key }}
          restore-keys: ${{ steps.golangci-key.outputs.restore-keys }}
      # Anything in the cache newer than this stamp was written by a lint run.
      - name: Stamp the restored golangci-lint analysis cache
        run: |
          mkdir -p ~/.cache/golangci-lint
          touch "$RUNNER_TEMP/golangci-restored.stamp"
      # In the image pnpm is on PATH, so the contract drift gate regenerates
      # the frontend's types and needs its packages; on the runner it skips.
      - name: Frontend packages for the contract drift gate
        if: matrix.where == 'image'
        working-directory: frontend
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile what the gate compiles (make check-backend)
        working-directory: .
        env:
          # In CI a missing base ref is a broken checkout, never a skip.
          CONTRACT_BREAKING_REQUIRE_BASE: "1"
          MIGRATION_VERSIONS_REQUIRE_BASE: "1"
        run: make check-backend
      # A red check-backend can stop before lint runs, and then the cache is the
      # one restored above: saving it again would only spend quota.
      - name: Check whether lint wrote to the golangci-lint analysis cache
        id: golangci-wrote
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(find ~/.cache/golangci-lint -type f -newer "$RUNNER_TEMP/golangci-restored.stamp" -print -quit)" ]; then
            echo "wrote=true" >> "$GITHUB_OUTPUT"
          fi
      # !cancelled(), for the reason given on the build cache save below: a red
      # lint still analysed the tree. The census does not hold this one back,
      # because golangci replays no test result.
      - name: Refresh the golangci-lint analysis cache
        if: ${{ !cancelled() && steps.golangci-wrote.outputs.wrote == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ steps.golangci-key.outputs.key }}
      # The entry about to be saved replays test results, and a replay is only
      # honest if the cache can see every input the test read. Go never rechecks
      # a file outside the test's module, so each such read must go through its
      # tree digest (gatekit.DeclareInputs). The census reruns the cached pass
      # with Go's test log on and judges what every package really read. Only
      # an undeclared read withholds the entry, leaving readers on the last one
      # that was honest. A PR's backend-lint job runs the same census, so a read
      # is caught before it merges rather than here.
      - name: Census the test cache's inputs (make test-input-census)
        id: census
        if: ${{ !cancelled() }}
        working-directory: .
        run: make test-input-census
      # !cancelled() rather than success(): a red gate still compiled the tree,
      # and those artifacts are exactly as reusable as a green run's. This
      # workflow is not a verdict, so a failure here must still leave the cache
      # better than it found it — unless the census found a replay it cannot trust.
      - name: Refresh the shared build cache
        if: ${{ !cancelled() && steps.census.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.key }}

  # What the integration lane reads: the `-tags=integration -cover
  # -coverpkg=./...` compile of its build job, and the `go run` tools its shards
  # use. It does what the lane does, the build and then one shard from its
  # binaries, so the entry holds both.
  integration:
    name: warm integration
    timeout-minutes: 45
    # Default branch only, for the reason spelled out on `plain` above.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Key only, for the reason spelled out on the `plain` job above.
      # setup-go restores a build cache of its own — small (~25 MB) but not
      # nothing, and it lands in GOCACHE before anything here runs. Without this
      # the entry saved below would carry those artifacts forward, which is the
      # accumulation this job exists to stop, just with a smaller seed.
      #
      # `go clean -cache` rather than `cache: false` on setup-go: only the BUILD
      # cache has to be cold. Turning setup-go's caching off entirely would also
      # drop the module cache and make this job re-download every dependency to
      # produce the same artifacts.
      - name: Start from an empty build cache
        shell: bash
        run: |
          go clean -cache
          echo "GOCACHE is $(go env GOCACHE), now $(du -sm "$(go env GOCACHE)" 2>/dev/null | cut -f1 || echo 0) MB"
      - name: Compute the Go build cache key (this job writes it, never reads it)
        id: go-cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: integration
          restore: "false"
      - name: Start the dev infra stack (compose + app role)
        run: make db-up
      - name: Compile every integration test binary
        env:
          INTEGRATION_BUILD_OUT: ${{ runner.temp }}/integration-bin
        run: make test-integration
      - name: Run one shard from the binaries
        env:
          INTEGRATION_SHARD: 1/8
          INTEGRATION_BIN_DIR: ${{ runner.temp }}/integration-bin
          INTEGRATION_SHARD_OUT: ${{ runner.temp }}/shard-out
          # The value of the shard it mirrors, in _lane-integration.yml, for its
          # reason: sixteen ran the 16GB runner out of memory and got it signalled.
          INTEGRATION_JOBS: 8
        run: make test-integration
      - name: Refresh the shared build cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.key }}

  # The test durations the integration shards split by. The committed
  # scripts/integration-test-timing.txt goes stale between refreshes by hand:
  # measured, its weights summed to 57% of the lane's real time, and shards it
  # balanced to the second ran from 7.7 to 12.5 minutes. So each test weighs its
  # mean over the newest green fan-ins, pull requests included, because one run
  # times each test on one runner and runners differ by a third. Saved on main,
  # because a pull request reads only its own entries and main's.
  integration-timing:
    name: integration test durations
    timeout-minutes: 10
    # Default branch only, for the reason spelled out on `plain` above.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads the test-timing-integration artifacts of ci.yml runs.
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the newest measured test durations
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/timing"
          mkdir -p "$dir"
          # Runs from branches of this repository only. A fork's pull request
          # writes what its own code measured, so it could skew the split; a
          # floor on every weight (scripts/lib-laneorder.sh) keeps even skewed
          # times from piling a package onto one shard.
          urls="$(gh api "repos/$REPO/actions/artifacts?name=test-timing-integration&per_page=50" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)][:5][].archive_download_url')"
          n=0
          while IFS= read -r url; do
            [[ -n "$url" ]] || continue
            n=$((n + 1))
            gh api "$url" > "$dir/$n.zip"
            unzip -o -q "$dir/$n.zip" -d "$dir/$n"
          done <<< "$urls"
          if (( n == 0 )); then
            echo "No test-timing-integration artifact yet: the shards keep splitting by the last entry, or the committed file."
          fi
          echo "runs=$n" >> "$GITHUB_OUTPUT"
      - name: Weigh each test by its mean
        if: steps.fetch.outputs.runs != '0'
        run: scripts/refresh-integration-test-timing.sh -o "$RUNNER_TEMP/integration-test-timing.txt" "$RUNNER_TEMP"/timing/*/test-timing.txt
      - name: Save the test durations for the shards
        if: steps.fetch.outputs.runs != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/integration-test-timing.txt
          key: integration-test-timing-${{ github.run_id }}

  # What fe-quality and fe-bundle read: tsc's build info for all four projects
  # and the compiler lint's cache. It restores the last entry first, unlike the
  # Go jobs: tsc rewrites its build info whole, and ESLint drops the entry of
  # each file that is gone, so the entry cannot grow with history.
  frontend:
    name: warm frontend
    timeout-minutes: 30
    # Default branch only, for the reason spelled out on `plain` above.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version input: the pin is package.json's "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The composed typecheck composes first, and only the Go generator can.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Compute the frontend cache key
        id: frontend-key
        uses: ./.github/actions/frontend-cache-key
      - name: Restore tsc's build info and the compiler lint's cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.frontend-key.outputs.path }}
          key: ${{ steps.frontend-key.outputs.key }}
          restore-keys: ${{ steps.frontend-key.outputs.restore-keys }}
      - name: Type-check and lint what the frontend lane does
        run: make fe-typecheck fe-typecheck-composed fe-compiler-lint
      # !cancelled(): a red typecheck still wrote build info for every file it read.
      - name: Refresh the frontend cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.frontend-key.outputs.path }}
          key: ${{ steps.frontend-key.outputs.key }}
