# Has every commit author on this pull request accepted CLA.md?
#
# Staff are covered by their employment and the group's IP assignment, not by
# the CLA, so members of the `margince` organisation are allowlisted rather than
# asked; asking them would blur which instrument covers which code. Bots author
# nothing a person owns. Everyone else accepts once, by posting the sign phrase
# below as a comment, and the acceptance is committed to the private
# margince/cla-signatures repository — that file is the record of the grant.
#
# pull_request_target, because recording an acceptance needs the signatures
# secret, which a fork's `pull_request` run never receives. That is safe only
# because nothing here checks out or runs the pull request's code; keep it so.
name: cla

on:
  pull_request_target:
    # `closed` lets the action lock a merged PR, so an acceptance comment
    # cannot be edited or deleted after its code has landed.
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read

# Queued, never cancelled: two acceptances on one PR both commit to the same
# signatures file, and a cancelled run could lose one of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: cla
    timeout-minutes: 5
    # A comment starts a run only when it can change the answer; CodeRabbit and
    # the other bots comment on every PR and would otherwise each cost a runner.
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (contains(github.event.comment.body, 'recheck')
              || contains(github.event.comment.body, 'Contributor License Agreement')))
    runs-on: ubuntu-latest
    permissions:
      # write, to re-run the PR's failed check once its author has accepted.
      actions: write
      pull-requests: write
      statuses: write
    steps:
      # Read from the organisation on every run, so a joiner is covered the day
      # they join. A list that comes back short only asks a member to sign,
      # which is the safe direction; an empty one means the token lost its
      # Members permission, and that has to stop here rather than prompt all staff.
      - name: Organisation members and bots are covered elsewhere
        id: allowlist
        env:
          GH_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        run: |
          set -euo pipefail
          members=$(gh api --paginate orgs/margince/members -q '.[].login' | paste -sd, -)
          if [ -z "$members" ]; then
            echo "::error::no members listed for the margince organisation — CLA_SIGNATURES_TOKEN needs the organisation Members: read permission"
            exit 1
          fi
          echo "logins=${members},renovate[bot],coderabbitai[bot],github-actions[bot],dependabot[bot]" >> "$GITHUB_OUTPUT"
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/margince/margince/blob/main/CLA.md
          # One file per CLA version, so the record shows which text was accepted.
          path-to-signatures: signatures/v1.json
          remote-organization-name: margince
          remote-repository-name: cla-signatures
          branch: main
          allowlist: ${{ steps.allowlist.outputs.logins }}
          custom-pr-sign-comment: I have read the Margince Contributor License Agreement, version 1.0, and I accept it.
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can merge it, every author
            of a commit in this pull request needs to accept the
            [Margince Contributor License Agreement, version 1.0](https://github.com/margince/margince/blob/main/CLA.md).
            You keep the copyright in your work; the licensing section of
            [CONTRIBUTING.md](https://github.com/margince/margince/blob/main/CONTRIBUTING.md)
            explains why we ask. To accept, post the sentence below as a comment
            on this pull request. One acceptance covers every later contribution.
          custom-allsigned-prcomment: Every author of this pull request has accepted the Margince Contributor License Agreement.
          create-file-commit-message: "chore: start the acceptance record for CLA version 1.0"
          signed-commit-message: "chore: $contributorName accepted CLA version 1.0 on margince/margince#$pullRequestNo"
