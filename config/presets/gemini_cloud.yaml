# yaml-language-server: $schema=../margince.schema.json
# config/presets/gemini_cloud.yaml — every lane on Gemini, one credential.
#
# WHAT THIS PRESET IS NOT CERTIFIED FOR: it binds a model to every task, and the
# certification records do not grade every one of those bindings as certified.
# Which tasks, and how badly, is in docs/reference/ai-certification.md under
# this file's name. Read it before binding this preset to a workspace whose
# confidentiality decisions matter: a task graded `supported_degraded` or
# `not_supported` answers wrongly often enough to have been measured doing so.
#
# No task list here on purpose. The bands move when a prompt is fixed or the
# corpus grows, and a list in this comment would read as true long after it
# stopped being.
#
# The binding a dev stack bootstraps with, lifted out of margince.dev.yaml so it
# can be named, diffed and reused. Copy the `seeds` block into your own
# config/margince.yaml, or point a certification run at this file:
#
#     make e2e-ai ROUTING=config/presets/gemini_cloud.yaml
#
# The default judge (Claude, through `claude -p`) is off this preset, so one
# judge grades it all.
#
# Needs GEMINI_API_KEY and nothing else. Not loaded automatically — see README.md.
version: 1

seeds:
  ai_routing:
    # cloud_frontier, not eu_hosted: the Gemini Developer API states no EU
    # processing region, so nothing here keeps text in the EU.
    profile: cloud_frontier     # eu_hosted | sovereign | cloud_frontier
    tiers:
      local_small: { provider: gemini, model: gemini-3.1-flash-lite }
      cheap_cloud: { provider: gemini, model: gemini-3.1-flash-lite }
      # thinking_level low: a prose site sends no schema, so without it
      # gemini-3.6-flash thinks at its own default — measured at 4–8k reasoning
      # tokens against the ~8k output cap, which cut one call in eight short.
      premium:     { provider: gemini, model: gemini-3.6-flash, thinking_level: low }
      frontier:    { provider: gemini, model: gemini-3.6-flash, thinking_level: low }
    # The embed lane rides the SAME provider as the tiers above, so this preset
    # needs one credential rather than two.
    #
    # 1536 is one of gemini-embedding-001's supported output widths; on the
    # gemini provider the number is a request for that width. Why, once:
    # docs/how-to/connect-a-cloud-model-provider.md §3.
    embeddings:
      provider: gemini
      model: gemini-embedding-001
      dimensions: 1536
    # The decision model, opt-in: uncomment ONE block to have a decision site
    # asked a decision model before its ladder. Through OpenRouter,
    # JEV_COMPATIBLE_API_KEY takes your OpenRouter key:
    # decisions:
    #   provider: jev_compatible
    #   model: typesafe/jev-1.13
    #   base_url: https://openrouter.ai/api/alpha/decisions
    # Or TypeSafe's own API, keyed by TYPESAFE_API_KEY:
    # decisions:
    #   provider: jev
    #   model: jev-1.13.0
