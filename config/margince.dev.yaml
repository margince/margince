# yaml-language-server: $schema=./margince.schema.json
# config/margince.dev.yaml — what a DEV stack does differently.
#
# Read only when MARGINCE_ENV=dev, on top of config/margince.yaml, later layer
# winning per key. `make dev` exports that variable for both the api and the
# worker, so this file is the dev stack's posture and nothing else's.
#
# It is tracked, and config/margince.yaml is not. That is the point: what arms a
# destructive capability on every engineer's machine belongs in a file review
# can see, not in text a shell script appends to a generated one — which is how
# the reset used to be turned on, invisibly, at first boot.
#
# A base key this file does not name keeps the base's value. To try something
# without committing it, edit config/margince.yaml instead; it is yours.
version: 1

operations:
  # Arms POST /v1/admin/reset-data, the api and worker lanes behind it, and the
  # "Reset data" action /me offers. It PURGES this installation's tenant data
  # back to its first-boot state.
  #
  # Safe HERE and nowhere else, because a dev database holds seed data an engineer
  # can recreate with `make seed-dev`. Deliberately not derived from MARGINCE_ENV
  # by the code: a deployment being CALLED dev is not consent to erase what is in
  # it, so the arming is stated in the posture's own file and every other posture
  # gets the compiled default, which is off.
  allow_data_reset: true

seeds:
  # The tier→model binding a dev stack is bootstrapped with. It lives HERE
  # rather than in margince.example.yaml
  # because a vanilla installation deliberately binds nothing: that file says so
  # ("nothing guesses which vendor your text goes to"), and naming a cloud
  # vendor in the artefact every deployment copies would be that guess.
  #
  # Consumed ONCE, at bootstrap, like every other seed — so editing this after a
  # dev database exists changes nothing until `make dev-fresh`. To rebind a
  # running stack, use Settings -> AI; that is the path a real operator has.
  #
  # A per-engineer override goes in config/margince.yaml, which is yours and is
  # gitignored — but note the layering: this overlay is applied AFTER the base,
  # so declaring `seeds.ai_routing` here wins over the same key there. Comment
  # this block out to let your own file bind instead.
  ai_routing:
    profile: eu_hosted          # eu_hosted | sovereign | cloud_frontier
    tiers:
      local_small: { provider: gemini, model: gemini-3.1-flash-lite }
      cheap_cloud: { provider: gemini, model: gemini-3.1-flash-lite }
      premium:     { provider: gemini, model: gemini-3.5-flash }
      frontier:    { provider: gemini, model: gemini-3.1-pro-preview }
    # The embed lane rides the SAME provider as the tiers above, so a dev
    # stack needs one credential (GEMINI_API_KEY) rather than two.
    #
    # 1536 is one of gemini-embedding-001's supported output widths; on the
    # gemini provider the number is a request for that width. Why, once:
    # docs/how-to/connect-a-cloud-model-provider.md §3.
    embeddings:
      provider: gemini
      model: gemini-embedding-001
      dimensions: 1536
