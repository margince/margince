# yaml-language-server: $schema=./margince.schema.json
# config/margince.example.yaml — the dev deployment configuration (A107/ADR-0061).
#
# `make dev` copies this to config/margince.yaml on first run and then LEAVES it
# — created if missing and left alone if it exists
# — so your edits persist across `make dev-stop` / `make dev`. To reset, delete
# config/margince.yaml and re-run `make dev`.
#
# The api bootstraps the demo organization + admin from this file the first time
# it boots against an empty database; an existing installation just reads it.
#
# This is the BASE. MARGINCE_ENV selects an overlay beside it —
# config/margince.dev.yaml for a dev stack — and its keys win over this file's.
# Within a key: a scalar replaces, a mapping merges, a list replaces entirely.
# The whole file layer still sits between compiled defaults and the environment
# (OPS-CFG-1): defaults -> this file -> the overlay -> env vars -> flags.
version: 1

# These four are what the installation IS, and they are read ONCE — the first
# time this build boots against an empty database. After that the settings rows
# are authoritative and this block is never consulted again, so a real
# deployment replaces the demo values below BEFORE first boot.
#
# Getting one wrong is not fatal: Settings → General edits all four afterwards.
# But base_currency stops being changeable once anything has converted against
# it (a closed deal, a sent offer, a mirrored invoice, a loaded rate sheet), so
# it is the one worth checking twice.
organization:
  name: Demo Workspace
  base_currency: EUR
  # The language AI writes in for the whole team — en, de or vi. Not a person's
  # display language, which each user picks for themselves.
  base_language: en
  timezone: Europe/Berlin

bootstrap_admin:
  email: admin@demo.test
  display_name: Demo Admin
  # Read at boot (must be >=12 chars). `make dev` seeds the referenced file
  # (config/margince-admin-password) on first run; the path is relative to the
  # repo root the api is launched from.
  #
  # This is the OPERATOR's password, and the admin it creates reaches nothing
  # but the change-password route until the person using the account replaces
  # it. `make seed-dev` performs that first login and chooses the password the
  # docs name — so the value here is spent once and never signed in with again.
  #
  # scripts/dev.sh writes this file; scripts/seed-dev.sh READS it, so changing
  # the operator password means changing it in one place (or deleting the file
  # and letting dev.sh reseed it). The password seed-dev then chooses is its own
  # ADMIN_PASSWORD default.
  # Either spelling works. The reference form is preferred and is the only one
  # that can name the environment:
  #
  #   password: ${file:/run/secrets/admin-password}   the mounted secret store
  #   password: ${env:MARGINCE_ADMIN_PASSWORD}        the environment
  #
  # A secret field REFUSES a literal — writing the password here fails the boot
  # and names the line, because this file is the most-pasted artefact an
  # installation has and a value that can be written here eventually is.
  #
  # The two are not equally compliant: ${file:} keeps the value in the secret
  # store, while ${env:} only keeps it out of THIS file. OPS-CFG-3 names the
  # environment alongside files, so ${env:} is a deliberate transitional form.
  password_file: config/margince-admin-password

# Retention posture at first boot (optional). Consumed ONCE, when the api
# bootstraps the organization against an empty database — it is not re-read, and
# an admin can change the posture afterwards on the privacy settings screen.
#
#   standard    (or omitted) the shipped storage-limitation ladder runs: an
#               unconverted lead is anonymized after a year, a meeting transcript
#               and an AI payload are erased after a year, activities and lost
#               deals are archived. Art. 5(1)(e) compliant out of the box.
#   retain_only the SAME policy rows are planted, and nothing destructive ever
#               fires: no anonymize, no erase, however over-age a record becomes.
#               Archive still runs, because archiving retains. For an
#               installation under a contractual or statutory keep-everything
#               obligation — a seven-year engagement being the case that named it.
#
# Why declare it here rather than just toggling it in the UI: bootstrap plants the
# policy rows, and the nightly pass can fire before an admin first signs in. This
# closes that window. The rows stay visible under either posture, so an admin can
# always see what WOULD happen if the obligation lapsed.
# seeds:
#   retention:
#     default_policy: retain_only

# The tier→model binding a FRESH installation is bootstrapped with (optional).
#
# Declared here so a deployment names its models in the file it already reviews,
# rather than having to call an API after first boot — which is what keeps an
# infrastructure-as-code install declarative. Consumed exactly once, like every
# other seed: the database is authoritative afterwards, and an admin re-points a
# lane through PUT /v1/ai/routing without a restart.
#
# Omitted, the installation binds nothing and its AI lanes are simply absent.
# That is a state, not a fault — nothing guesses which vendor your text goes to.
#
# Held to the same bar the routing file always was, at BOOTSTRAP, which is the
# one moment somebody is watching: an unknown tier, a cloud provider under the
# sovereign profile, or an embeddings width outside [1,2000] fails the boot
# rather than surfacing at the first model call.
#
# Credentials are NOT here and never will be. A binding names providers; each
# one's BYOK key lives in the key vault, put there by an admin under
# Settings -> AI -> Model provider keys, so this section is safe to commit.
#
# The conventional environment variables (GEMINI_API_KEY, ANTHROPIC_API_KEY, …)
# are still read, but only to SEED: a boot that finds one MAY seal it into the
# vault and record where, after which the variable can be unset. It needs a
# key-vault root key and a stored model binding to do that — the sealing runs on
# the path that resolves a binding — so an unbound installation keeps the
# environment as its only copy. Unset the variable once the boot log says the key
# was sealed, not merely because it was set.
#
# A key in the environment is readable by every process in the container and
# survives in shell history and process listings; one in the vault is encrypted
# at rest and rotatable without a restart, which is why the vault is the home.
#
# seeds:
#   ai_routing:
#     profile: eu_hosted          # eu_hosted | sovereign | cloud_frontier
#     tiers:
#       local_small: { provider: gemini, model: gemini-3.1-flash-lite }
#       cheap_cloud: { provider: gemini, model: gemini-3.1-flash-lite }
#       premium:     { provider: gemini, model: gemini-3.5-flash }
#       frontier:    { provider: gemini, model: gemini-3.1-pro-preview }
#     embeddings:
#       provider: gemini
#       model: gemini-embedding-001
#       dimensions: 1536

# Entitlement (optional). The token is verified offline against the validation
# module bundled in the binary — no callout, so an air-gapped installation proves
# its entitlement like any other. A file reference, never an inline value: the
# token is a credential and this file is not.
#
# Omitted, a PRODUCTION installation refuses to boot: it serves on a license or
# it does not serve, and MARGINCE_ENV is fail-closed, so an installation that
# names no posture is production. A dev or CI process runs unlicensed by saying
# so (MARGINCE_ENV=dev), which is what every lane in this repository does.
# Configured and REFUSED, the api and the worker both refuse to boot in every
# posture — a license that is present and unhonored is an operator mistake, not a
# downgrade to choose silently. MARGINCE_LICENSE overrides the file when it holds
# a non-empty value; exporting it empty falls through to the file rather than
# switching the installation off.
#
# What the license grants is also enforced: once every licensed full seat is in
# use, inviting a member is refused. Nobody already working loses anything.
#
# Sealed on the first boot that resolves it: the token goes into the key vault
# and the installation records where. The boot log says so, and from then on
# this whole block can be DELETED and the vault answers instead — deleting only
# the file it points at, and leaving the block, fails the boot instead.
# To rotate, put the new token back here — the declaration still wins, and the
# next boot re-seals it. docs/reference/configuration.md, "the vault also holds
# the two deployment credentials".
# license:
#   token: ${file:config/margince-license}

# AI runtime posture (optional). Uncomment to turn on Layer-3 AI payload capture
# (ai_call_payload) — OFF by default because it stores special-category-adjacent
# content that then ages under the retention engine and the Art. 17 erasure
# cascade. Honored by both the api and worker roles (both take --config).
# ai:
#   capture_payloads: true

# How large a file this installation accepts, per route (optional, OPS-CFG-12).
#
# DECIMAL megabytes — 25 means 25,000,000 bytes, not 26,214,400. The number you
# write here is the number the server's refusal names and the number the upload
# form states, and those three agreeing is the whole reason the unit is decimal.
#
# The ceiling bounds the WHOLE request, part framing included, not the file
# alone. The overhead is a few hundred bytes, so it only matters within a
# rounding error of the limit.
#
# Each key is separate on purpose: raising what a scanned contract may weigh is
# not a reason to let a CSV import attempt more parsing work. An omitted key
# takes the default below; a value outside 1–100 MB is a boot error, not a
# silent clamp. Past 100 MB the answer is an upload straight to object storage,
# which is a different design rather than a bigger number.
#
# What this section does NOT decide is which routes may carry a file at all —
# that stays in the source, and it is what keeps a route carrying no file from
# claiming the wider bound by sending a multipart header.
# uploads:
#   attachment_mb: 25        # POST /v1/attachments — the documents surface
#   csv_import_mb: 10        # POST /v1/imports/sources
#   linkedin_import_mb: 8    # POST /v1/me/linkedin-connections
#   knowledge_document_mb: 5 # POST /v1/knowledge/corpora/{id}/documents — a
#                            # document filed into an asked corpus. Low because
#                            # the cost of a big one is passages the ask scans,
#                            # not the bytes on disk.

# Capture pipeline posture (optional).
#
# trace_payloads keeps each traced message's sender and a bounded subject in the
# 24-hour Capture activity trace every member sees under Settings.
#
# ON unless you set it to false. Without the sender the trace is a list of
# decisions naming nobody, which cannot answer the question the page exists for:
# why a message did not arrive. What is kept is one address and one subject line
# (320 and 300 characters), never a body, and a member reads only rows from
# their own connections — no grant widens them, so this is somebody's own mail
# shown back to them.
#
# It covers messages the pipeline DROPPED because every party was internal to
# your own domains. Those are the ones the CRM otherwise stores nothing about,
# and they are exactly what an operator is looking for when a message went
# missing. Turn it off if your works agreement requires it; the trace then keeps
# recording every decision and names nobody.
#
# The hourly sweep deletes payloads with the rows that carry them, and an
# erasure request reaches them inside the window.
# capture:
#   trace_payloads: false

# Rates & costs "Refresh from sources" (worker role): an admin triggers an async
# refresh that stages confirm-first proposals into the approvals inbox; a human
# approves every change, nothing is auto-applied. Field reference:
# docs/reference/configuration.md#rates.
rates:
  # Base-relative FX JSON API ({base,rates}); defaults to api.frankfurter.dev.
  fx_source: https://api.frankfurter.dev/v1/latest
  # Currencies proposed to bootstrap an empty FX sheet; defaults to USD/GBP/CHF.
  fx_currencies: [USD, GBP, CHF]
  # provider -> pricing-page URL the model-cost refresh crawls + AI-extracts.
  # Name the provider exactly as `seeds.ai_routing` binds it; a provider with no
  # entry here is never refreshed, and its seeded rates go stale in silence.
  model_pricing:
    gemini: https://ai.google.dev/gemini-api/docs/pricing
    # anthropic: https://docs.anthropic.com/en/docs/about-claude/pricing
    # openai: https://platform.openai.com/docs/pricing
    # OpenRouter publishes prices as JSON rather than a page — per-token, so a
    # proposal is the catalog's number x 1e12 to reach micro-USD/MTok. Uncomment
    # for an OpenAI-wire broker. The key is the generic
    # adapter's name: it refreshes whichever broker openai_compatible is bound to,
    # so change the URL if that is not OpenRouter.
    #
    # A JSON catalog is read one passage PER MODEL and narrowed to the models
    # the binding names ON THIS PROVIDER — a broker lists hundreds, and
    # asking for all of them overruns the extraction's output ceiling. Two
    # consequences worth knowing: a model you do not bind is never repriced from
    # here (its seeded rate in ai.SeedModelRates stands), and if NONE of this
    # provider's bound ids appears in the catalog the refresh fails loudly rather
    # than reporting a successful no-op — that means an id here disagrees with
    # the vendor's own spelling. Debug it with `make ai-probe`
    # (docs/how-to/debug-an-ai-task.md).
    # openai_compatible: https://openrouter.ai/api/v1/models

# Remote MCP connector (Gate 1). On means /mcp and /oauth/* are served, so any
# human here can lend one of their passports to an outside client; it is on in
# this file so a local stack works unedited. The code default is off — delete
# this block and none of it exists. It needs --public-base-url (a bare origin),
# which cmd/api refuses to boot without; that refusal only catches an unset
# flag, and mail, reset links and the Gmail/Graph connectors need it too, so a
# deployment that already sets it serves the surface the moment it copies this.
mcp:
  connector_enabled: true

# The MCP App views (the ui:// documents a host renders beside a tool's answer)
# are static files the web tier serves, and the api reads them over HTTP:
# GET <origin>/mcp-apps/<view>.html, once at startup and periodically after.
# There is nothing to configure here — the origin is --mcp-apps-base-url /
# MARGINCE_MCP_APPS_BASE_URL, which DEFAULTS to --public-base-url, and the
# connector gate above already makes that a boot error to omit.
#
# Set it only when the api cannot reach the public origin: a container without
# ingress hairpin routing, external DNS or egress. The value has to be
# API-reachable, which is not the same as publicly reachable. A CDN origin works
# and is recommended — it trades the dependency on the web tier for a better
# one rather than removing it. The scheme must be https unless the host is a
# literal loopback or private address (or localhost): a cleartext hostname like
# http://web.internal is a boot error, not a silent one. See
# docs/reference/configuration.md.

# Ordered company-context rollout (OPS-CFG-10). The default is onboarding;
# moving backward disables reads/injection/surfaces but never deletes confirmed
# company data. Stages include the prior stage: off < read < tasks < onboarding.
company_context:
  rollout: onboarding

# Ops kill switches (OPS-CFG-9): capabilities this installation turns on
# deliberately, in the file the deployment reviews. The whole section is
# COMMENTED OUT, and that is the shipped posture — every switch is off unless an
# operator writes it, so a deployment that mounts this file as-is arms nothing.
#
# A dev stack gets the Reset data button from config/margince.dev.yaml, the
# tracked overlay MARGINCE_ENV=dev selects on top of this file — which is why a
# dev stack has the button and this file still does not.
#
# operations:
#   # Arms POST /v1/admin/reset-data, the lanes behind it, and the "Reset data"
#   # action /me offers. It PURGES this installation's tenant data back to its
#   # first-boot state.
#   #
#   # Not derived from MARGINCE_ENV: a deployment being called dev or staging is
#   # not consent to erase what is in it. Not a `setting` row either — an admin
#   # must not be able to arm their own tenant's purge through the API.
#   allow_data_reset: true
