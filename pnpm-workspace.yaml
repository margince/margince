# The pnpm workspace root, and it is the REPOSITORY root rather than frontend/.
#
# That is forced rather than preferred: a unit's frontend package lives at
# extensions/<name>/frontend, pnpm resolves members only underneath its root,
# and a member outside the root is not expressible. So the SPA stops being the
# root and becomes one member of two kinds — the core one, and however many
# units the installation enabled.
packages:
  - frontend
  # A unit's frontend layer is NOT a member here, and that is the point. It was,
  # through an `extensions/*/frontend` glob — which meant an installation that
  # enabled a frontend-bearing unit of its own could not run
  # `pnpm install --frozen-lockfile` without rewriting this tracked lockfile, an
  # upstream-owned file. Membership did not go away; it moved to the GENERATED
  # workspace under build/composition-frontend/workspace/, emitted by
  # tools/gen-composition from the same extensions/ scan the Go side uses, whose
  # lockfile is ignored build output. Presence under extensions/ is still the
  # enablement — it is just resolved in the composed lane rather than this one.

# esbuild ships a platform binary and needs its install script to run.
allowBuilds:
  esbuild: true

# Transitive-dependency floors we hold ourselves because the direct dependency
# pins below them. Each one is a patch-level lift with a reason to exist and a
# condition for going away — never a blanket "newest wins".
overrides:
  # Two high DoS advisories, one CPU-exhaustion family: GHSA-5p4m-2wfm-xmqj
  # (quadratic cost resolving `!!omap`), fixed in 4.3.1, and
  # GHSA-2883-xcg3-v3hh (the merge-key budget does not count an empty merge
  # source, so `<<: *arr` over N empty mappings K times is O(N*K) work under the
  # limit), fixed in 4.3.2. Reached only through openapi-typescript ->
  # @redocly/openapi-core, which depends on an EXACT js-yaml version — 4.3.1
  # today — so no update can lift it and an override is the only route. The
  # exposure here is small — the tool parses our own backend/api/*.yaml at build
  # time, never anything a user supplies — but the fix is a patch bump, and a
  # high advisory sitting open on a public repository costs more than it saves.
  # Drop this once @redocly/openapi-core depends on a RANGE rather than a pin:
  # a lifted pin only moves the floor this line has to hold, so which version
  # it names is never the test for retiring the override.
  #
  # Pinned to the 4.x line on purpose: an open `>=4.3.2` resolves to 5.x, whose
  # API the consumer was never written against, and swapping a DoS advisory for
  # a broken type generator is not a trade.
  js-yaml: '^4.3.2'
  # GHSA-g3hv-75wg-m249 (CVE-2026-118764): a medium DoS in minimatch's glob
  # preprocessing — an attacker-chosen pattern amplifies globParts in the first
  # phase, and the quadratic pairwise second phase then burns CPU and memory on
  # the inflated set. Vulnerable from 7.0.0 through 11.0.0; the only fix is
  # 11.0.1, a major lift from the 10.2.6 the tree resolves. Reached through
  # eslint, @eslint/config-array, @typescript-eslint/typescript-estree and glob —
  # all build- and lint-time tooling that globs repo-controlled paths, never a
  # pattern a user supplies — so the exposure is small, but a medium advisory
  # open on a public repository costs more than a patch lift.
  #
  # Scoped to the vulnerable range, not every minimatch: the tree also resolves
  # 5.1.9, which sits below the advisory's 7.0.0 floor and must not be dragged
  # across a major it was never written against. Drop this once every consumer
  # above resolves minimatch >= 11.0.1 on its own.
  'minimatch@>=7.0.0 <11.0.1': '11.0.1'
