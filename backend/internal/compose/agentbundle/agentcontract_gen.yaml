          content:
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Export this edition's permitted frozen metrics and chart readings.
  /analytics/evaluate:
    get:
      tags:
        - Reports
      operationId: evaluateReporting
      summary: Evaluate reporting
      responses:
        '200':
          description: Reporting result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingEvaluation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
        - name: scope_kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - owner
              - team
              - workspace
        - name: scope_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: pipeline_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum:
              - this_month
              - last_month
              - last_week
              - this_quarter
              - custom
        - name: start_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: target_basis
          in: query
          required: false
          schema:
            type: string
            enum:
              - month
              - fiscal_quarter
        - name: close_window
          in: query
          required: false
          schema:
            type: string
            enum:
              - fiscal_quarter
              - all_open
        - name: metrics
          in: query
          required: false
          schema:
