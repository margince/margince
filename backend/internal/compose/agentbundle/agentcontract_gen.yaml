        write committed mid-read may land in a later section — the stamp is what makes
        that honest rather than hidden.
      parameters:
        - name: project_id
          in: query
          schema: {type: string, format: uuid}
          description: >-
            Narrow the timeline sections to one body of work: what is filed under this project or under no project; correspondence filed under another project is left out.
      responses:
        '200':
          description: The company's 360 view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company360'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /companies/{id}/graph:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Companies]
      operationId: getCompanyGraph
      summary: The account's connections one hop out — its contacts, its open deals and their stakeholders, its parent, children and partner companies.
      description: |-
        The company view's connections card: who and what this account is attached to,
        as an explicit node/edge set the client draws rather than a picture the server
        renders.
      responses:
        '200':
          description: The company's one-hop connection graph.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyGraph'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /companies/{id}/coverage:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Companies]
      operationId: getCompanyCoverage
      summary: How well this account is covered — who answers, who is missing from the buying team, and the warmest way in.
      description: |-
        The decision layer of the company Contacts tab. `GET /companies/{id}/contacts`
        is the roster; this is the reading of it a rep opens the page for: is anybody
        here talking to us, which buying roles nobody holds, and who is the warmest
        route in.
      responses:
        '200':
          description: The account's coverage.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyCoverage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /companies/{id}/contacts:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Companies]
      operationId: listCompanyContacts
      summary: The account's contacts, ranked by who is worth writing to next, filtered and paged over the WHOLE account.
      description: |-
        The company Contacts tab's list. `GET /companies/{id}/360` carries a contacts
        SECTION — a 25-row summary with a "there is more" flag — and this is the paging
        surface behind it: the same contacts, the same ranking, over every one of them.
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ContactEngagement'}
          description: Keep only contacts in this engagement state. Omitted means every state.
        - name: q
          in: query
          schema: {type: string}
          description: |-
            Case-insensitive SUBSTRING match over the contact's name and title.
        - name: sort
          in: query
          schema:
            type: string
            enum: [recommended, last_interaction, -last_interaction, strength, -strength, name, -name]
            default: recommended
          description: |-
            `recommended` is the ranking described above. The rest are plain orders for a
            reader who wants the account by one column, each in both directions: a
            `-` prefix reverses it.
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the account's contacts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyContactListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /companies/{id}/partner:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Companies, Partners]
      operationId: getPartner
      summary: Read the partner extension on a company (404 if the company is not a partner).
      responses:
        '200':
          description: The partner record.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Partner'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Read the partner extension on a company (404 if the company is not a partner).
  /companies/{id}/enrich:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Companies, AI]
      operationId: scrapeCompany
      summary: Enrich this company from its website (evidence-or-omit) — a staged proposal.
      description: |-
        The `enrich` verb applied to an existing company. Fetches
        the company's website — the `url` override, else the company's own domain — parses it, and returns a
        staged read-back of firmographic / value / Impressum fields. Shares the cold-start read-back's
        fetch + evidence gate: EVERY returned field carries a non-empty `evidence_snippet` + `source_url`
        + `confidence`, or it is ABSENT (the no-guess gate). NOTHING is written to the company until a human
        accepts via /approvals — on accept it fills only the company's EMPTY fields, never overwriting a
        human-set value. A blocked or thin page degrades to 422, zero fabricated fields.

        Needs the passport permission Buy contact data.

        Waits for a human to approve.

        Holds the request open while an AI model answers.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrichCompanyRequest'}
            examples:
              override:
                value: {url: 'https://acme.com/about'}
      responses:
        '200':
          description: A staged enrichment proposal with per-field evidence (nothing written yet).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrichmentProposal'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: No URL to read (no override, company has no domain) / page unreadable — honest degradation, zero fabricated fields.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                unreadable:
                  value:
                    type: 'https://errors.gradion.com/company_unreadable'
                    title: Could not read enough
                    status: 422
                    code: company_unreadable
                    detail: Couldn't read enough from this company's site. Retry or add a URL.
  /companies/{id}/deep-read:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Companies, AI]
      operationId: deepReadCompany
      summary: Read the company's WHOLE site in the background — a crawl that ends in staged proposals.
      description: |-
        The deep read (founder ratification R2, the A102 crawl seam): discovers up to 12 pages of the
        company's own site — well-known paths, sitemap, same-registrable-domain nav links, every
        one robots-checked and SSRF-guarded, discovery is deterministic code and NEVER model-chosen —
        extracts each page through the shared evidence gate, and stages the merged findings as
        approvals (one `deepread` bundle of company facts; one `site_lead` per contact found on team
        pages, published details only). NOTHING is written to real records until a human accepts.
        Asynchronous: answers 202 with the read to poll; progress and the outcome (including what was
        SKIPPED and why — robots, off-domain, page cap, model budget) are on the read report. Re-running
        while a read is in flight answers the SAME read (idempotent per company+url). Budget-guarded: the
        crawl stops early and reports `partial` when the model lane demotes to queue-or-local.

        Needs the passport permission Buy contact data.

        Waits for a human to approve.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrichCompanyRequest'}
      responses:
        '202':
          description: The crawl is queued; poll the read.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteReadStarted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: No URL to read (no override, company has no domain).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '501':
          description: The process role wired no model path or no job runner — declared absent, never a silent no-op.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /companies/{id}/technical-enrich:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Companies, AI]
      operationId: technicalEnrichCompany
      summary: Read what the company publicly runs — mail system, website stack, operated services, hosting.
      description: |-
        Reads three free public sources for the domain ALREADY ON THE RECORD: DNS (MX for the
        mail provider, TXT for the SPF/DMARC/DKIM posture, A/AAAA plus reverse lookup for the
        hosting hint), certificate-transparency logs (subdomains, mapped to operated services),
        and one polite fingerprint fetch of the company's own homepage through the same
        robots-respecting reader the site read uses — no second crawler.

        Needs the passport permission Buy contact data.

        Waits for a human to approve.
      responses:
        '202':
          description: The lookup is queued; poll the run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TechnicalEnrichStarted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: The company record carries no domain, so there is nothing to look up.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '501':
          description: The process role wired no job runner — declared absent, never a silent no-op.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /companies/{id}/technical-enrich/latest:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Companies]
      operationId: getLatestTechnicalEnrich
      summary: What the last technical lookup did, per source, so a run that ended after the rep left is still visible.
      description: |-
        Per LANE rather than per run, because the three sources fail independently and a
        single verdict would hide which of them is stale: an account can hold a mail provider
        read this morning beside services last read a week ago because the certificate log has
        been down since.
      responses:
        '200':
          description: What each source last did for this account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TechnicalEnrichStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /companies/{id}/vat-check:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Companies]
      operationId: getCompanyVatCheck
      summary: What the EU VAT register answered about this company's VAT ID, and the receipt for having asked.
      description: |-
        The verdict is the smaller half. A business treating a sale as intra-EU has to show it
        verified its counterpart, and what a tax authority accepts is the CONSULTATION NUMBER
        the register issues — the receipt, tied to the number consulted and the day it was
        asked. A `valid` flag with no receipt proves nothing, which is why the receipt and the
        date the register itself reported both travel here.
      responses:
        '200':
          description: The current standing, and the proof it was checked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyVatCheck'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /companies/{id}/site-reads/latest:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Companies]
      operationId: getLatestSiteRead
      summary: The newest deep read on this account, so a crawl that failed after the rep navigated away is still visible.
      description: |-
        A read id lives only in the browser tab that started the crawl, so a read that
        ended after the rep left the page could not be found again. An account whose
        crawl failed then looked exactly like one nobody had tried to enrich — no
        industry, no description, no facts — and a draft written from it had nothing to
        stand on. 404 when the account has never been read, which is the honest
        difference between "never tried" and "tried and got nothing".
      responses:
        '200':
          description: The newest read's report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteReadReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /companies/{id}/site-reads/{readId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: readId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Companies]
      operationId: getSiteRead
      summary: One deep read's progress and outcome — pages read, pages skipped and WHY, what got staged.
      responses:
        '200':
          description: The read report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteReadReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: One deep read's progress and outcome — pages read, pages skipped and WHY, what got staged.
  /companies/{id}/access:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Companies]
      operationId: getCompanyAccess
      summary: Who can open this company and who can change it, and why.
      description: |-
        Every live member who can open this company, with whether they can also change it and the
        reasons for both. Each member is judged by the same admission the company read and edit
        paths apply (object grant, row scope, capture privacy, shares, seat), under that member's
        live authority, all in one snapshot.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The members who can open the company, one page at a time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordAccess'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /companies/{id}/strength:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Companies]
      operationId: getCompanyStrength
      summary: Relationship strength for a company (max over current employees).
      responses:
        '200':
          description: The company's relationship-strength breakdown.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelationshipStrength'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Relationship strength for a company (max over current employees).
  /companies/{id}/finance-summary:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Companies, Finance]
      operationId: getCompanyFinanceSummary
      summary: Does this customer actually pay us, and on time?
      description: |-
        The finance card's whole read: what we have
        invoiced, what is still open, and how they pay — plus the handful of recent
        invoices the card shows.
      responses:
        '200':
          description: The account's finance summary, in whatever state it is in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyFinanceSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /companies/{id}/facts:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Companies]
      operationId: listCompanyFacts
      summary: The company's confirmed facts, grouped by category on the client. Site-read facts carry evidence (snippet, source URL, confidence); human/migration values may omit it.
      responses:
        '200':
          description: The company's facts (empty array when none).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyFactListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: The company's confirmed facts, grouped by category on the client. Site-read facts carry evidence (snippet, source URL, confidence); human/migration values may omit it.
    post:
      tags: [Companies]
      operationId: createCompanyFact
      summary: State a fact about this company by hand.
      description: |-
        The half the fact store never had. Facts arrived only from a site read, so a rep who knew
        the company runs a product the crawl never found had nowhere to record it — and the
        correction path cannot help, because there is no row to correct.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCompanyFactRequest'}
      responses:
        '201':
          description: The stated fact.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyFact'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The company already states this fact; confirm or correct it instead.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /companies/{id}/profile-fields:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Companies]
      operationId: listCompanyProfileFields
      summary: The company's confirmed profile fields. A field with no stored value is absent (evidence-or-omit); site-read values carry evidence, human/migration values may omit it.
      responses:
        '200':
          description: The company's profile fields (empty array when none).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyProfileFieldListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: The company's confirmed profile fields. A field with no stored value is absent (evidence-or-omit); site-read values carry evidence, human/migration values may omit it.
  /partners:
    get:
      tags: [Partners]
      operationId: listPartners
      summary: List partner companies (companies with a partner row), filterable by role/cert status.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - name: partner_role
          in: query
          schema: {type: string, enum: [hosting, consulting, strategic]}
        - name: cert_status
          in: query
          schema: {type: string, enum: [applied, certified, suspended]}
      responses:
        '200':
          description: A page of partner records.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Partner'}}
                  page: {$ref: '#/components/schemas/PageInfo'}
      description: List partner companies (companies with a partner row), filterable by role/cert status.
  /commissions:
    get:
      tags: [Commissions]
      operationId: listCommissionEntries
      summary: The commission ledger — what partners earned on won deals.
      description: |-
        Accrued automatically when a deal attributed `sourced` is won, at the partner's
        margin tier as it stood that day. A clawback is a reversal row plus a void on the
        original, never an edit — so the ledger reads the same tomorrow as it did when a
        partner was told what they had earned.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: partner_company_id
          in: query
          schema: {type: string, format: uuid}
          description: The entries owed to one partner.
        - name: deal_id
          in: query
          schema: {type: string, format: uuid}
          description: The entries accrued on one deal.
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/CommissionStatus'}
      responses:
        '200':
          description: A page of ledger entries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommissionEntryListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /commissions/summary:
    get:
      tags: [Commissions]
      operationId: getCommissionSummary
      summary: What is owed, by partner and status — the open-liability figure.
      responses:
        '200':
          description: One row per partner and status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommissionSummaryResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      description: What is owed, by partner and status — the open-liability figure.
  /commissions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Commissions]
      operationId: getCommissionEntry
      summary: One ledger entry.
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommissionEntry'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: One ledger entry.
  /deals:
    get:
      tags: [Deals]
      operationId: listDeals
      summary: List deals (live by default; cursor-paginated). Supports Kanban-by-stage reads.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ListMembershipFilter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: pipeline_id
          in: query
          schema: {type: string, format: uuid}
        - name: stage_id
          in: query
          schema: {type: string, format: uuid}
          description: Read one Kanban column.
        - name: owner_id
          in: query
          schema: {type: string, format: uuid}
        - name: owner_team_id
          in: query
          schema: {type: string, format: uuid}
          description: |-
            Rows owned by any member of this team. NARROWS the caller's row scope, never widens it:
            a team the caller cannot see returns their own visible rows filtered to nothing, not a
            wider set. Distinct from the `team` row scope itself, which also admits unassigned rows
            and rows reached by a record grant. One dial for every owner-scoped list.
        - name: unassigned
          in: query
          schema: {type: boolean}
          description: |-
            `true` returns only rows with no owner. Unassigned rows are visible at every row scope, so this names the unowned queue rather than widening what the caller sees.
            Mutually exclusive with `owner_id` and `owner_team_id`; combining them is `422`.
        - name: company_id
          in: query
          schema: {type: string, format: uuid}
        - name: q
          in: query
          schema: {type: string}
          description: Full-text query over the deal's name and description, plus a substring match on the name.
        - name: status
          in: query
          schema: {type: string, enum: [open, won, lost]}
        - name: forecast_category
          in: query
          schema: {type: string, enum: [commit, best_case, pipeline, omitted]}
          description: |-
            One of the forecast's named buckets. The same `deal.forecast_category` the forecast
            reads, so a tile's figure and the list behind it are one answer rather than two
            derivations that can disagree.
        - name: stalled
          in: query
          schema: {type: boolean}
          description: Deterministic stalled flag (no activity past the threshold).
        - name: project_id
          in: query
          schema: {type: string, format: uuid}
          description: Filter to the deals belonging to one body of work.
        - name: partner_company_id
          in: query
          schema: {type: string, format: uuid}
          description: Filter to deals attributed to a specific partner company (deal.partner_company_id).
        - name: partner_sourced
          in: query
          schema: {type: boolean}
          description: true ⇒ a partner is named; false ⇒ none is. The partner pipeline slice.
        - name: partner_attribution
          in: query
          schema: {type: string, enum: [sourced, influenced]}
          description: Deals a partner brought (`sourced`) or merely helped (`influenced`).
        - name: commercial_motion
          in: query
          description: >-
            `unset` matches deals with no motion recorded, which no enum value can express.
          schema: {type: string, enum: [new_business, renewal, upsell, cross_sell, expansion, existing_business, unset]}
        - name: priority
          in: query
          description: '`unset` matches deals nobody has prioritised.'
          schema: {type: string, enum: [low, medium, high, unset]}
        - name: acquisition_source
          in: query
          description: >-
            An acquisition-source key, or `unset` for unclassified deals. A retired key still filters, so history stays reachable after the source leaves the picker.
          schema: {type: string}
        - name: tag_id
          in: query
          schema:
            type: array
            items: {type: string, format: uuid}
          style: form
          explode: true
          description: |-
            Narrow to the records carrying these tags. Repeat the parameter for several.
        - name: tag_mode
          in: query
          schema: {type: string, enum: [any, all, none], default: any}
          description: |-
            How several `tag_id` values combine. `any` selects a record carrying at least one
            of them, `all` a record carrying every one, `none` a record carrying not one.
      responses:
        '200':
          description: A page of deals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: List deals (live by default; cursor-paginated). Supports Kanban-by-stage reads.
    post:
      tags: [Deals]
      operationId: createDeal
      summary: Create a deal.
      description: |-
        Amount is integer minor-units + ISO-4217 currency (no float money). The stage
        must belong to the deal's pipeline (422 otherwise). Deals attach to contact/company,
        never to a raw lead.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDealRequest'}
            examples:
              minimal:
                value:
                  name: Acme — Platform expansion
                  amount_minor: 5000000
                  currency: EUR
                  pipeline_id: 018f3a1b-0000-7000-8000-0000000000c0
                  stage_id: 018f3a1b-0000-7000-8000-0000000000c1
                  company_id: 018f3a1b-0000-7000-8000-000000000020
                  source: manual
      responses:
        '201':
          description: Created deal.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deal'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: Validation error (e.g. stage not in pipeline, lost without lost_reason).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                stage_mismatch:
                  value:
                    type: 'https://errors.gradion.com/validation_error'
                    title: Validation failed
                    status: 422
                    code: validation_error
                    detail: stage_id does not belong to pipeline_id.
                    details:
                      errors:
                        - {field: stage_id, code: stage_not_in_pipeline}
  /deals/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deals]
      operationId: getDeal
      summary: Get a deal by id (the 360 record).
      responses:
        '200':
          description: The deal.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deal'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Get a deal by id (the 360 record).
    patch:
      tags: [Deals]
      operationId: updateDeal
      summary: Update a deal (partial). Closing is `POST /deals/{id}/advance`'s; a patch naming a closing field is refused 422 `set_by_advance`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateDealRequest'}
      responses:
        '200':
          description: Updated deal.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deal'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Update a deal (partial). Closing is `POST /deals/{id}/advance`'s; a patch naming a closing field is refused 422 `set_by_advance`.

        Needs the passport permission Change records.

        Runs at once.
    delete:
      tags: [Deals]
      operationId: archiveDeal
      summary: Archive (soft-delete) a deal.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Archived deal.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deal'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
      description: |-
        Archive (soft-delete) a deal.

        Needs the passport permission Change records.

        Runs at once.
  /deals/{id}/advance:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Deals]
      operationId: advanceDeal
      summary: Advance a deal to a new stage (audit-logged with prior + next stage).
      description: |-
        The `advance_deal` MCP verb. A move with a closed-won/closed-lost stage at EITHER end is confirm-first
        (irreversible / touches money) — for an agent caller this requires an approval
        token. Closing a deal is the obvious half; REOPENING one is the other, and it is
        the same money: moving a won deal back to an open stage clears its close date,
        its lost reason and the FX rate frozen at close, and takes revenue out of a
        quarter that has already been reported.

        Needs the passport permission Change records.

        May wait for a human to approve, depending on the change.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdvanceDealRequest'}
            examples:
              advance:
                value:
                  to_stage_id: 018f3a1b-0000-7000-8000-0000000000c2
              closeWon:
                summary: Closing won (requires approval token for agents)
                value:
                  to_stage_id: 018f3a1b-0000-7000-8000-0000000000c9
                  status: won
      responses:
        '200':
          description: The deal at its new stage.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deal'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: RBAC denied, or a transition attempted without an approval token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                approvalRequired:
                  value:
                    type: 'https://errors.gradion.com/approval_required'
                    title: Approval required
                    status: 403
                    code: approval_required
                    detail: Advancing to a closed-won stage is confirm-first; supply an approval token.
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /deals/{id}/stakeholders:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deals]
      operationId: listDealStakeholders
      summary: List a deal's stakeholders (deal↔contact relationships).
      responses:
        '200':
          description: Stakeholder relationships for the deal.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelationshipListResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: List a deal's stakeholders (deal↔contact relationships).
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects (live by default; cursor-paginated).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: company_id
          in: query
          schema: {type: string, format: uuid}
          description: The anchor company. A project has exactly one.
        - name: owner_id
          in: query
          schema: {type: string, format: uuid}
        - name: owner_team_id
          in: query
          schema: {type: string, format: uuid}
          description: |-
            Rows owned by any member of this team. NARROWS the caller's row scope, never widens it:
            a team the caller cannot see returns their own visible rows filtered to nothing, not a
            wider set. Distinct from the `team` row scope itself, which also admits unassigned rows
            and rows reached by a record grant. One dial for every owner-scoped list.
        - name: unassigned
          in: query
          schema: {type: boolean}
          description: |-
            `true` returns only rows with no owner. Unassigned rows are visible at every row scope, so this names the unowned queue rather than widening what the caller sees.
            Mutually exclusive with `owner_id` and `owner_team_id`; combining them is `422`.
        - name: phase
          in: query
          schema: {type: string, enum: [initiative, pursuing, delivering, closed]}
          description: Omit for all phases; `phase != closed` is the open-projects slice the link ladder probes.
        - name: key
          in: query
          schema: {type: string}
          description: Exact (case-insensitive) key lookup.
        - name: q
          in: query
          schema: {type: string}
          description: Name/key quick-find.
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: List projects (live by default; cursor-paginated).
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project on a company.
      description: |-
        `company_id` names the project's CUSTOMER — the company the work is for. A project is
        work several companies do together, and the others are put on with
        `PUT /projects/{id}/companies`; this one is required because a project starts with a client.
        The `key` is MINTED BY THE SERVER from the name (initials plus the lowest free
        number, e.g. `ERA-1`) and is read-only thereafter: it is what a human writes in a
        subject line to file mail under this project, so a caller-chosen one is a matcher
        a caller can get wrong. A collision is resolved by taking the next number, never
        reported.
        The project starts in `initiative` and its creation row is appended to the phase history.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProjectRequest'}
      responses:
        '201':
          description: Created project.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: A live project already holds this key.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /bulk/preview:
    post:
      tags: [Bulk]
      operationId: previewBulkChange
      summary: Say what one change over a selection of records would do, without doing it.
      description: |-
        The first half of a bulk change. The caller names up to 500 contacts, companies, deals or
        leads, each with the `version` it was shown, and one verb: `reassign_owner` (with
        `owner_id`), `archive`, `add_to_list` / `remove_from_list` (with the Shortlist's `list_id`,
        while lists are switched on), `add_tag` / `remove_tag` (with `tag_id`), or `create_task`
        (with `task`). Or it names up to 500 Worklist tasks and promises (`worklist_item`) and the
        verb `complete`. The answer says which records the change would alter (`affected`), which it
        would leave alone and why (`excluded`), and up to three before/after rows to show the user.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkChangePreviewRequest'}
      responses:
        '200':
          description: What the change would do.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkChangePreview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /bulk/execute:
    post:
      tags: [Bulk]
      operationId: executeBulkChange
      summary: Apply one change to a selection of records, record by record.
      description: |-
        The second half of a bulk change. Every audit row the change writes carries the same `batch_id`, which
        the answer returns.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkChangeExecuteRequest'}
      responses:
        '200':
          description: What changed and what was skipped.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkChangeResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429':
          description: The change would take this agent past its write budget for the window.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
  /bulk/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Bulk]
      operationId: getBulkChange
      summary: Read what one bulk change did, and whether it was undone.
      description: |-
        The record of one executed bulk change or undo: its record type and verb, how many records
        it changed, each record it left alone with the reason, what an undo could not bring back,
        and the batches it undid or was undone by.
      responses:
        '200':
          description: The bulk change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkOperation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /bulk/{id}/undo/preview:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Bulk]
      operationId: previewBulkUndo
      summary: Say what undoing one bulk change would do, without doing it.
      description: |-
        Undoing more than 10 records needs that token.

        Needs the passport permission Change records.

        Runs at once.
      responses:
        '200':
          description: What the undo would do.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkChangePreview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /bulk/{id}/undo:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Bulk]
      operationId: undoBulkChange
      summary: Put back what one bulk change did, record by record.
      description: |-
        A compensating bulk change with its own `batch_id`. A reassignment hands each record back to
        the owner it had before; an archive brings each record back with the child rows, list
        memberships and tags its archive took down; a Shortlist or tag change is reversed on each
        record it changed; and `create_task` archives each task it created. Each record gets its own audit row, carrying
        the undo's `batch_id`, and its own event (`contact.restored`, `company.restored`,
        `deal.restored` for an archive).

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkUndoRequest'}
      responses:
        '200':
          description: What was put back and what was skipped.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkChangeResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429':
          description: The undo would take this agent past its write budget for the window.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project by id.
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Get a project by id.
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project.
      description: |-
        `phase` is NOT settable here — a transition goes through `advanceProjectPhase` so the
        history row and `project.phase_changed` are written from the same transaction.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProjectRequest'}
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Projects]
      operationId: archiveProject
      summary: Archive a project (soft delete; archive is the delete).
      description: |-
        Archives the project and its phase history, and frees its key for reuse. It does NOT
        archive the activities or deals it grouped — the grouping dies, the history does not.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/ApprovalToken'
      responses:
        '204': {description: Archived.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{id}/advance:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Projects]
      operationId: advanceProjectPhase
      summary: Move a project along the phase ladder (audit-logged with prior + next phase).
      description: |-
        The one phase-transition verb. Writes one phase-history row in the same transaction as
        the row update and emits `project.phase_changed` instead of `project.updated`.
        Transitions may move in either direction (a closed project may re-open); every
        transition is recorded. Closing without a `reason` is `422 closed_reason_required`.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdvanceProjectPhaseRequest'}
      responses:
        '200':
          description: The project at its new phase.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: Validation error (e.g. closing without a reason).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /projects/{id}/360:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Projects]
      operationId: getProject360
      summary: The whole project page in one round trip — the project, its company, its phase history, its deals, stakeholders, contracts, documents, commitments, timeline and filing coverage.
      description: |-
        One composite read assembled inside ONE workspace transaction, so the sections describe
        one consistent moment rather than a stack of independently-timed round trips. `as_of`
        stamps that moment; the isolation level is Read Committed, so a write committed mid-read
        may land in a later section — the stamp is what makes that honest rather than hidden.
      responses:
        '200':
          description: The project's 360 view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project360'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{id}/health-assessments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Projects]
      operationId: listProjectHealthAssessments
      summary: How this project has been going, newest judgement first.
      description: |-
        The whole history, corrections included, so a delivery review can read what was said
        in March rather than only what is true now. A superseded reading stays in the list and
        says so.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The assessments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectHealthAssessmentListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{id}/stakeholders:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Projects]
      operationId: listProjectStakeholders
      summary: List a project's stakeholders (project↔contact relationships).
      description: |-
        `relationship` rows of kind `project_stakeholder` — the deal-stakeholder surface's twin,
        reusing its role vocabulary and adding the delivery roles. One contact may hold edges on
        several projects at the same company simultaneously.
      responses:
        '200':
          description: Stakeholder relationships for the project.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelationshipListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Projects]
      operationId: setProjectStakeholder
      summary: Attach a contact to a project with a role (idempotent per contact).
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetProjectStakeholderRequest'}
      responses:
        '200':
          description: The stakeholder edge.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Relationship'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Attach a contact to a project with a role (idempotent per contact).

        Needs the passport permission Change records.

        Runs at once.
  /projects/{id}/stakeholders/{contact_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - {name: contact_id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [Projects]
      operationId: removeProjectStakeholder
      summary: Detach a contact from a project (archives the edge).
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      responses:
        '204': {description: Detached.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: |-
        Detach a contact from a project (archives the edge).

        Needs the passport permission Change records.

        Runs at once.
  /projects/{id}/companies:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Projects]
      operationId: setProjectCompany
      summary: Put a company on a project with a role (idempotent per company).
      description: |-
        A project is work several companies do together — a customer, a partner, a subcontractor —
        so a company is an edge (`relationship` of kind `project_company`), not the project's one
        anchor. Sending a company already on the project re-roles the edge that exists rather than
        adding a second one.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetProjectCompanyRequest'}
      responses:
        '200':
          description: The companies on the project, after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectCompanyListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{id}/companies/{company_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - {name: company_id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [Projects]
      operationId: removeProjectCompany
      summary: Take a company off a project (archives the edge).
      description: |-
        The company keeps every record it owns; only its place on this project ends. Taking the
        LAST company off a project is refused: a project no company is on is work nobody is doing,
        and it would vanish from every company page that could lead a reader back to it.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      responses:
        '204': {description: Taken off.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /pipelines:
    get:
      tags: [Pipelines]
      operationId: listPipelines
      summary: List pipelines.
      parameters:
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: Pipelines (ordered by position).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PipelineListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
      description: List pipelines.
  /pipelines/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pipelines]
      operationId: getPipeline
      summary: Get a pipeline (with its ordered stages).
      responses:
        '200':
          description: The pipeline.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pipeline'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Get a pipeline (with its ordered stages).
  /stages:
    get:
      tags: [Pipelines]
      operationId: listStages
      summary: List stages (optionally filtered by pipeline).
      parameters:
        - name: pipeline_id
          in: query
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: Stages ordered by position within pipeline.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StageListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
      description: List stages (optionally filtered by pipeline).
  /stages/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pipelines]
      operationId: getStage
      summary: Get a stage by id.
      responses:
        '200':
          description: The stage.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stage'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Get a stage by id.
  /deals/{id}/stage-evidence:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deals]
      operationId: listStageEvidence
      summary: What has been observed about this deal against its stage's criteria.
      description: The evidence ledger for one deal, newest observation first.
      responses:
        '200':
          description: The deal's evidence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StageEvidenceListResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /stage-automation/report:
    get:
      tags: [Pipelines]
      operationId: getStageAutomationReport
      summary: What each stage transition has earned.
      description: |-
        Every from→to transition in one pipeline, with what happened to the moves
        the product proposed on it. This is the evidence behind letting a
        transition move deals by itself: it reports, and decides nothing.
      parameters:
        - name: pipeline_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: window_days
          in: query
          required: false
          description: |-
            How far back to count, in days. The default matches the launch
            gate's own window, so what a reader sees is what the gate reads.
          schema: {type: integer, minimum: 1, maximum: 365, default: 30}
      responses:
        '200':
          description: The pipeline's transitions and their record.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StageAutomationReport'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /stage-automation/policies/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pipelines]
      operationId: listTransitionPolicies
      summary: What each transition in this pipeline is allowed to do.
      description: |-
        One rule per from→to transition an admin has decided about. A transition
        absent from this list has no rule, which is the default state of every
        transition in the product and means it proposes.
      responses:
        '200':
          description: The pipeline's transition rules.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransitionPolicyList'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /stages/{id}/exit-criteria:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pipelines]
      operationId: listStageExitCriteria
      summary: What a deal must satisfy before it leaves this stage.
      description: |-
        The stage's exit criteria in `position` order. Live rows only unless
        `include_archived` is set — an archived criterion stays readable because
        evidence recorded against it cites it by id, and a reader opening an older
        deal must still see what the stage asked for at the time.
      parameters:
        - name: include_archived
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: The stage's criteria.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StageExitCriterionListResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /channel-providers:
    get:
      tags: [Activities]
      operationId: listChannelProviders
      summary: Which messaging transports THIS installation has registered.
      description: |-
        The resolver for `ProviderRef`. Because a provider vocabulary is a
        deployment fact rather than an installation-independent one, the contract cannot
        enumerate it; this operation moves that typing from build time to a runtime
        capability document. A client renders `label` wherever it would otherwise print a
        raw provider id.
      responses:
        '200':
          description: Every transport registered in this installation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelProviderDirectory'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tasks:
    post:
      tags: [Activities]
      operationId: createTask
      summary: Create a task — a commitment with an owner, on the records it is about.
      description: |-
        A task is an activity of kind `task`, and this is the one door that says so:
        `POST /activities` with `kind: task` stores the same row, but a caller
        (an agent above all) should not have to know that a to-do is a species of
        timeline entry. Takes what a task needs and nothing a meeting does.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTaskRequest'}
      responses:
        '200':
          description: The existing source-linked reminder, including an explicitly restored reminder.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '201':
          description: The task, as an activity.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities:
    get:
      tags: [Activities]
      operationId: listActivities
      summary: List activities (the timeline; cursor-paginated, filterable by type/entity).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: kind
          in: query
          schema: {type: string, enum: [email, call, meeting, note, task, message]}
        - name: channel_provider
          in: query
          description: |-
            Filter to messages carried by one transport. Since `kind=message` no longer names
            the transport, this is the only way to ask the question `kind=telegram` used to
            answer.
          schema: {$ref: '#/components/schemas/ProviderRef'}
        - name: entity_type
          in: query
          schema: {type: string, enum: [contact, company, deal, lead, project]}
          description: Filter to activities linked to an entity type (with entity_id).
        - name: entity_id
          in: query
          schema: {type: string, format: uuid}
        - name: assignee_id
          in: query
          schema: {type: string, format: uuid}
          description: Open tasks for an assignee.
        - name: q
          in: query
          schema: {type: string}
        - name: project_id
          in: query
          schema: {type: string, format: uuid}
          description: >-
            Narrow the timeline sections to one body of work: what is filed under this project or under no project; correspondence filed under another project is left out.
        - name: thread_key
          in: query
          schema: {type: string}
          description: >-
            One provider conversation. The company view's timeline groups by thread client-side over the page it holds, so a group cut off by that page completes itself through this rather than by widening the page for every account that has no long thread.
        - name: occurred_after
          in: query
          schema: {type: string, format: date-time}
          description: >-
            Only activities that occurred at or after this instant (inclusive). Pairs with `occurred_before` for a date range; either may stand alone.
        - name: occurred_before
          in: query
          schema: {type: string, format: date-time}
          description: >-
            Only activities that occurred strictly before this instant (exclusive), so a day range is `occurred_after=<day 00:00>&occurred_before=<next day 00:00>`.
        - name: waiting_reply
          in: query
          schema: {type: boolean}
          description: >-
            Restrict the list to an inbound message still awaiting an answer: the newest message of each thread that nobody has answered. Combined with `entity_type`/`entity_id` it answers what on this record is waiting for a reply.
      responses:
        '200':
          description: A page of activities (newest first by default).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: >-
            The `entity_type`/`entity_id` this read was narrowed TO is outside the caller's row scope, or names nothing. Filtering BY a record is a read OF it, so an unreadable one owes the same existence-hiding answer a direct read would — the caller cannot tell "not yours" from "not there". Note this is the NARROWING TARGET, not the activities: a readable target with no activities answers 200 with an empty page.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
      description: List activities (the timeline; cursor-paginated, filterable by type/entity).
    post:
      tags: [Activities]
      operationId: logActivity
      summary: Log an activity (the `log_activity` MCP verb).
      description: |-
        Captured activities carry `source_system` + `source_id`; re-running capture with the
        same pair is idempotent (no duplicate). Captured and sent MAIL is keyed
        `source_system: email` + the RFC822 Message-ID, one identity shared by every mail
        transport, so the same message reaching two connected mailboxes is one activity —
        and that reserved value is refused here (422): only a connector, or this system's
        own send, may claim a mail identity. An activity may link to >1 entity
        (contact and deal). `log_activity` is (reversible).

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateActivityRequest'}
      responses:
        '201':
          description: Created activity.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '200':
          description: Idempotent no-op — an activity with the same (source_system, source_id) already exists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Activities]
      operationId: getActivity
      summary: Get an activity by id (includes its links and raw capture payload).
      responses:
        '200':
          description: The activity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Get an activity by id (includes its links and raw capture payload).
    patch:
      tags: [Activities]
      operationId: updateActivity
      summary: Update an activity (e.g. complete a task).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateActivityRequest'}
      responses:
        '200':
          description: Updated activity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Update an activity (e.g. complete a task).

        Needs the passport permission Change records.

        Runs at once.
    delete:
      tags: [Activities]
      operationId: archiveActivity
      summary: Archive (soft-delete) an activity.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Archived activity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
      description: |-
        Archive (soft-delete) an activity.

        Needs the passport permission Change records.

        Runs at once.
  /activities/{id}/email-presentation:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Activities]
      operationId: getEmailPresentation
      summary: Everything one email needs to be read and acted on, in one read.
      description: |-
        The composed read behind the canonical email viewer: the message, who it went to,
        what came with it, and what this caller may do about who else reads it.
      parameters:
        - name: thread_cursor
          in: query
          required: false
          schema: {type: string}
          description: |-
            Continue the thread's member page from a previous response's `thread.next_cursor`.
      responses:
        '200':
          description: The email.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailPresentation'}
        '404': {$ref: '#/components/responses/NotFound'}
  /activities/{id}/meeting-brief:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Activities]
      operationId: getMeetingBrief
      summary: The pre-meeting brief for one booked meeting — goal, commitments, where the deal stands.
      parameters:
        - name: project_id
          in: query
          schema: {type: string, format: uuid}
          description: >-
            The body of work to prepare for, for a meeting filed under NO project. A meeting filed under a project scopes itself by that filing: naming the same project here is accepted, naming a different one is `404` — the brief for a meeting about one engagement is not available as a brief about another. Must be a live project the caller can read.
      responses:
        '200':
          description: The pre-meeting brief.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeetingBrief'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        The pre-meeting brief for one booked meeting — goal, commitments, where the deal stands.

        Holds the request open while an AI model answers.
  /activities/{id}/relink:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Activities]
      operationId: relinkActivity
      summary: Re-associate a captured activity to a chosen deal/entity (idempotent, source-preserving).
      description: |-
        Adds or moves an activity's typed link to a target entity (e.g. attach a captured email to the
        right deal) in **one idempotent action** — re-issuing the same `(activity, entity_type, entity_id)`
        does **not** create a duplicate link (`Idempotency-Key` + a unique `(activity_id, entity_type,
        entity_id)` constraint). The activity's original `source`/`captured_by` provenance is **preserved**
        (the relink is a `human:*` or `agent:*` association event, not a re-capture). — it is an internal association, not an outbound action.

        Needs the passport permission Change records.

        May wait for a human to approve, depending on the change.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, entity_id]
              properties:
                entity_type: {type: string, enum: [contact, company, deal, lead, project]}
                entity_id: {type: string, format: uuid}
                replace_existing_of_type:
                  type: boolean
                  default: false
                  description: When true, replaces any existing link of the same entity_type (move) rather than adding (associate).
      responses:
        '200':
          description: The activity with its updated links (idempotent — no duplicate on replay).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities/relink-thread:
    post:
      tags: [Activities]
      operationId: relinkThread
      summary: Re-associate every activity of one conversation thread to a chosen record, in one transaction.
      description: |-
        The thread twin of `relinkActivity`: the same association applied to every non-archived
        activity carrying `thread_key` that the caller may write. A mis-filed conversation is
        usually mis-filed whole, and one call here is the remedy rather than one call per message.
        An activity in the thread the
        caller cannot write is left where it is and is not counted — the response says how many
        moved. An activity already carrying the link is not counted either (the single
        relink's idempotency, per row). All rows commit together or none do.

        Needs the passport permission Change records.

        May wait for a human to approve, depending on the change.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RelinkThreadRequest'}
      responses:
        '200':
          description: How many activities moved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelinkBatchResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities/relink-bulk:
    post:
      tags: [Activities]
      operationId: relinkActivities
      summary: Re-associate a named set of activities to a chosen record, in one transaction.
      description: |-
        The explicit-id twin of `relinkThread`, for a selection that is not one conversation. Unlike the thread
        form, every named id must be one the caller can see and write: an id outside the caller's
        sight answers `404` and one they may read but not write answers `403`, and in either case
        NOTHING moves — the whole set is one transaction. An activity already carrying the link is
        left as it is and not counted.

        Needs the passport permission Change records.

        May wait for a human to approve, depending on the change.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RelinkActivitiesRequest'}
      responses:
        '200':
          description: How many activities moved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelinkBatchResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities/{id}/transcript-proposals/latest:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Activities]
      operationId: getLatestTranscriptRead
      summary: The newest reading of this transcript, so one that ended after the rep navigated away is still visible.
      description: |-
        A read id lives only in the browser tab that started the reading, so a reading that finished
        after the rep left the page could not be found again — and a transcript nobody had read looked
        exactly like one whose reading had failed. 404 when this transcript has never been read, which
        is the honest difference between "never tried" and "tried and got nothing".
      responses:
        '200':
          description: The newest reading's report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TranscriptReadReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /activities/{id}/transcript-proposals/{readId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: readId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Activities]
      operationId: getTranscriptRead
      summary: One reading's progress and outcome — how many lines it addressed, what it staged, and why it produced nothing.
      responses:
        '200':
          description: The read report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TranscriptReadReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: One reading's progress and outcome — how many lines it addressed, what it staged, and why it produced nothing.
  /activities/{id}/draft-email:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Activities, AI]
      operationId: draftEmail
      summary: Draft a reply/follow-up email for context (the `draft_email` MCP verb).
      description: |-
        Drafting is (never auto-sends). The draft is returned, not sent. Keeping the rep's
        unsent message is a separate, explicit act at `PUT /mail-drafts`, which this route
        never performs.

        Needs the passport permission Draft messages.

        Runs at once.

        Holds the request open while an AI model answers.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                intent:
                  type: string
                  description: Optional steering, e.g. "polite follow-up referencing Friday".
      responses:
        '200':
          description: A drafted email (never sent).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailDraft'}
        '404': {$ref: '#/components/responses/NotFound'}
  /activities/{id}/reply-recipient:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Activities]
      operationId: getReplyRecipient
      summary: Who a reply to this message would be addressed to.
      description: |-
        Asked without drafting, so a composer can show the recipient when it opens
        rather than after a model call. `address` is resolved by the same reply-address
        rule the automation reply path uses, so the address offered here is one that
        path would also compose to.
      responses:
        '200':
          description: The recipient a reply would go to, with empty fields where unknown.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplyRecipient'}
        '404': {$ref: '#/components/responses/NotFound'}
  /activities/{id}/send-email:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Activities, AI]
      operationId: sendEmail
      summary: Send a (possibly edited) email draft — runs directly, consent-gated.
      description: |-
        The `send_email` MCP verb. It RUNS DIRECTLY: a passport carries the
        granting human's own seat, grants and row scope, so a send it can make is one its
        holder could make unaided in the app, and asking that same contact to confirm again
        made the agent surface weaker than the contact behind it rather than safer. An
        installation that wants sends confirmed sets a tier floor on `send_email`, which
        stages the call for a human exactly as it always did.
        A grant for a different purpose does not authorize the
        send; `unknown` and `withdrawn` both block.

        Needs the passport permission Send messages.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendEmailRequest'}
      responses:
        '202':
          description: Accepted for send (queued); the resulting activity is logged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '403':
          description: Approval token missing for a send, or RBAC denied.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: 'Consent not granted for the send purpose (`code: consent_not_granted`) — suppressed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /emails:
    post:
      tags: [Activities, AI]
      operationId: sendCompanyEmail
      summary: Start a new email conversation from a record — runs directly, consent-gated.
      description: |-
        The account-started twin of `send_email`. "Write email" from a company,
        a contact or a deal is a NEW conversation: there is no prior message to anchor to, and
        the product refuses to fabricate a placeholder activity to obtain one — that would put a
        timeline entry on the record for a message nobody has sent yet.

        Needs the passport permission Send messages.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendCompanyEmailRequest'}
      responses:
        '202':
          description: Accepted for send (queued); the resulting outbound activity is logged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '201':
          description: |-
            Scheduled, not sent. No activity and no delivery row exist yet;
            the timeline stays silent until it fires.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScheduledSend'}
        '403':
          description: Approval token missing for a send, or RBAC denied.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: A named link target does not exist, or is outside the caller's row scope.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: 'Consent not granted for the send purpose (`code: consent_not_granted`) — suppressed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities/{id}/send-message:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Activities, AI]
      operationId: sendMessage
      summary: Reply on a captured messaging-channel conversation — runs directly, consent-gated.
      description: |-
        The `send_message` MCP verb — the channel twin of `send_email`. It RUNS DIRECTLY, on the passport holder's own seat, grants and row scope: a reply it can
        send is one that contact could send unaided in the app. An installation that wants
        replies confirmed sets a tier floor on `send_message`.

        Needs the passport permission Send messages.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendMessageRequest'}
      responses:
        '202':
          description: Accepted for send (queued); the resulting outbound activity is logged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '403':
          description: Approval token missing for a send, or RBAC denied.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Consent not granted for the send purpose (`code: consent_not_granted`) — suppressed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /scheduling/profile:
    get:
      tags: [Activities]
      operationId: getSchedulingProfile
      summary: Read the caller's reusable booking page and scheduling policy.
      responses:
        default:
          description: The operation could not be completed.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '200':
          description: Personal scheduling configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SchedulingProfile'}
      description: Read the caller's reusable booking page and scheduling policy.
  /scheduling/invitations:
    post:
      tags: [Activities]
      operationId: createMeetingInvitation
      summary: Reserve a meeting and request a calendar-native invitation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MeetingInvitationRequest'}
      responses:
        default:
          description: The operation could not be completed.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '202':
          description: Durable invitation command; inspect status before claiming confirmation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeetingInvitation'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Reserve a meeting and request a calendar-native invitation.

        Needs the passport permission Send messages.

        Waits for a human to approve.
  /scheduling/invitations/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Activities]
      operationId: getMeetingInvitation
      summary: Read invitation delivery and calendar state.
      responses:
        default:
          description: The operation could not be completed.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '200':
          description: Current invitation state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeetingInvitation'}
      description: Read invitation delivery and calendar state.
  /availability:
    get:
      tags: [Activities, AI]
      operationId: getAvailability
      summary: Free/busy availability for one or more hosts in a window (the `check_availability` MCP verb).
      description: |-
        With reliable=true, reads live calendar occupancy and applies bookable hours,
        notice, buffers and booking horizon. Without it, returns CRM-only availability
        for compatibility. This read never books or sends an invitation.
      parameters:
        - {name: reliable, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: host_user_id, in: query, required: false, schema: {type: string, format: uuid}, description: 'Host to check (defaults to the caller).'}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: duration_minutes, in: query, required: false, schema: {type: integer, default: 30}}
      responses:
        '200':
          description: Candidate free slots in the window.
          content:
            application/json:
              schema:
                type: object
                required: [slots, truncated]
                properties:
                  slots:
                    type: array
                    items:
                      type: object
                      required: [start, end]
                      properties:
                        start: {type: string, format: date-time}
                        end: {type: string, format: date-time}
                  truncated:
                    type: boolean
                    description: |-
                      True when at least one more free slot exists after the last one returned: the
                      walk is capped and found a further candidate before stopping. To reach the rest,
                      ask again with `from` set after the last slot returned — narrowing the window
                      does not help, since the walk starts at `from` either way. Declared because a
                      capped list read as complete is how a caller concludes there is no later opening.
                  calendar_backing:
                    type: string
                    enum: [calendar, none, unknown]
                    description: |-
                      What these slots were computed FROM, which decides what an empty window means.
        '422': {$ref: '#/components/responses/ValidationError'}
  /bookings:
    post:
      tags: [Activities, AI]
      operationId: bookMeeting
      summary: Book a meeting at a chosen slot — runs directly (the `book_meeting` MCP verb).
      description: |-
        Records the meeting on the timeline. No invite is sent. Use the explicit
        scheduling invitation command to create an event and notify the attendee.

        Needs the passport permission Send messages.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, end, links]
              properties:
                host_user_id: {type: string, format: uuid}
                start: {type: string, format: date-time}
                end: {type: string, format: date-time}
                subject: {type: string}
                attendee_emails:
                  type: array
                  items: {type: string, format: email}
                  description: |-
                    Who the meeting is with. **Accepted and not delivered to**: nothing in this
                    build emails these addresses or adds them to a calendar event, and the
                    created activity does not carry them either. Supply them for the caller's
                    own record of intent, and tell the attendee yourself.
                links:
                  type: array
                  minItems: 1
                  maxItems: 25
                  description: |-
                    Entities to associate the resulting meeting activity with. At least one is
                    required: a meeting belonging to no record appears on no timeline and is one
                    nobody will find again, which is the same reason `SendCompanyEmailRequest`
                    carries the bound. Each one is row-scope probed and written as its own row,
                    so the list is bounded at 25 — the same bound the `book_meeting` tool applies
                    before it stages.
                  items:
                    type: object
                    required: [entity_type, entity_id]
                    properties:
                      entity_type: {type: string, enum: [contact, company, deal, lead, project]}
                      entity_id: {type: string, format: uuid}
                consent: {$ref: '#/components/schemas/CaptureConsent'}
      responses:
        '201':
          description: Meeting booked; the logged meeting activity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '403':
          description: Approval token missing for the booking, or RBAC denied.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: 'Slot no longer available (`code: slot_taken`).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /automations/catalog:
    get:
      tags: [Automations]
      operationId: listAutomationCatalog
      summary: The closed starter library of automation types the workspace can instantiate.
      description: |-
        Each entry names its trigger, action, tier, and a JSON-schema for
        its parameters. Closed set: the build does not invent types the catalog omits.
      responses:
        '200':
          description: Catalog entries.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AutomationCatalogEntry'}}
  /automations:
    get:
      tags: [Automations]
      operationId: listAutomations
      summary: List the workspace's configured automation instances.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Automation instances.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Automation'}}
                  page: {$ref: '#/components/schemas/PageInfo'}
      description: List the workspace's configured automation instances.
  /automations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Automations]
      operationId: getAutomation
      summary: Read one automation instance.
      responses:
        '200':
          description: The automation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Automation'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Read one automation instance.
  /leads:
    get:
      tags: [Leads]
      operationId: listLeads
      summary: List leads (their OWN list, distinct from contacts; cursor-paginated).
      description: |-
        Leads are segregated by construction — they never appear in /contacts.
        Without an explicit `sort`, the operational queue is ordered by SLA urgency
        (breached, at risk, within SLA), then score descending, then oldest first.
        Explicit sort values retain their documented field ordering.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ListMembershipFilter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/IncludeArchived'
        - $ref: '#/components/parameters/CapturedByKind'
        - $ref: '#/components/parameters/AiWritten'
        - name: status
          in: query
          schema: {type: string, enum: [new, contacted, engaged, promoted, disqualified]}
        - name: owner_id
          in: query
          schema: {type: string, format: uuid}
        - name: owner_team_id
          in: query
          schema: {type: string, format: uuid}
          description: |-
            Rows owned by any member of this team. NARROWS the caller's row scope, never widens it:
            a team the caller cannot see returns their own visible rows filtered to nothing, not a
            wider set. Distinct from the `team` row scope itself, which also admits unassigned rows
            and rows reached by a record grant. One dial for every owner-scoped list.
        - name: unassigned
          in: query
          schema: {type: boolean}
          description: |-
            `true` returns only rows with no owner. Unassigned rows are visible at every row scope, so this names the unowned queue rather than widening what the caller sees.
            Mutually exclusive with `owner_id` and `owner_team_id`; combining them is `422`.
        - name: source
          in: query
          schema: {type: string}
          description: Filter by capture source (inbound, webform, referral, import, crawl, manual, ...).
        - name: sla_state
          in: query
          schema: {type: string, enum: [within_target, at_risk, breached]}
          description: 'Triage by first-response SLA state. `breached` is the overdue queue.'
        - name: min_score
          in: query
          schema: {type: integer}
          description: Triage by score.
        - name: q
          in: query
          schema: {type: string}
        - name: tag_id
          in: query
          schema:
            type: array
            items: {type: string, format: uuid}
          style: form
          explode: true
          description: |-
            Narrow to the records carrying these tags. Repeat the parameter for several.
        - name: tag_mode
          in: query
          schema: {type: string, enum: [any, all, none], default: any}
          description: |-
            How several `tag_id` values combine. `any` selects a record carrying at least one
            of them, `all` a record carrying every one, `none` a record carrying not one.
        - name: from_contact_id
          in: query
          schema: {type: string, format: uuid}
          description: |-
            Only the leads worked from this contact (`from_contact_id` on the lead). The contact
            page asks it to find the open lead a contact is already worked through.
      responses:
        '200':
          description: A page of leads.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeadListResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Leads]
      operationId: createLead
      summary: Create a lead.
      description: |-
        With name + email returns 201 + stable UUID; round-trips on GET.
        `company_name` is FREE TEXT — a lead has NO company FK. Lead-internal exact-email
        dedupe → 409 with existing lead id. Bulk/connector sourcing uses (source_system, source_id)
        for idempotent re-import.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateLeadRequest'}
            examples:
              sourced:
                value:
                  full_name: Sam Prospect
                  email: sam@newco.com
                  title: Head of RevOps
                  company_name: NewCo GmbH
                  source_system: apollo
                  source_id: apollo-9931
                  source: 'connector:apollo:apollo-9931'
      responses:
        '201':
          description: Created lead.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lead'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: A live lead already owns this email.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities/follow-up-settings:
    get:
      tags: [Activities]
      operationId: getFollowUpSettings
      summary: How long a sent message may go unanswered before the worklist reminds its sender.
      description: |-
        The workspace's follow-up window: a message a seat sent to a customer that is still
        the last word after this many days comes back on the sender's worklist as a
        follow-up. Read by every role; changed by admin/ops. Governed by the
        `installation_settings` RBAC object.
      responses:
        '200':
          description: The follow-up settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FollowUpSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /email-signature-template:
    get:
      tags: [Contacts]
      operationId: getEmailSignatureTemplate
      summary: The workspace's signature template.
      description: |-
        The layout every member's mail signs with when it is set, filled in with each member's
        own name, title and phone. Read by a seat that may read installation settings; changed
        by admin/ops. Governed by the `installation_settings` RBAC object.
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailSignatureTemplate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /leads/settings:
    get:
      tags: [Leads]
      operationId: getLeadSettings
      summary: How this installation handles leads.
      description: |-
        The first-response target is opt-in: off by default. While it is off
        no lead carries `sla_deadline_at`/`sla_state`, the `sla_state` filter matches nothing,
        the work queue orders by score alone and the breach scan records nothing. Read by every
        role (the list needs it to know what to render); changed by admin/ops.
      responses:
        '200':
          description: The lead settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeadSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /leads/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Leads]
      operationId: getLead
      summary: Get a lead by id.
      responses:
        '200':
          description: The lead.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lead'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Get a lead by id.
    patch:
      tags: [Leads]
      operationId: updateLead
      summary: Update a lead (partial).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateLeadRequest'}
      responses:
        '200':
          description: Updated lead.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lead'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Update a lead (partial).

        Needs the passport permission Change records.

        Runs at once.
    delete:
      tags: [Leads]
      operationId: disqualifyLead
      summary: Disqualify (soft-archive) a lead, with a reason.
      description: |-
        Sets `archived_at` + `status=disqualified` and records the reason and note; still fetchable by id.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DisqualifyLeadRequest'}
      responses:
        '200':
          description: Disqualified lead.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lead'}
        '404': {$ref: '#/components/responses/NotFound'}
  /leads/{id}/promote:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Leads]
      operationId: promoteLead
      summary: Promote a lead to a contact on genuine engagement (non-lossy merge).
      description: |-
        Promotion runs in one transaction: if the lead email
        matches a live contact it MERGES into that contact (no duplicate); else creates a
        contact. Sets `contact.converted_from_lead_id`, carries provenance + activities (zero
        orphaned FKs), marks lead `status=promoted` + archives it. One audit row recording
        trigger + evidence; emits `lead.promoted` + `contact.*`. Cold outbound with no reply
        must NOT call this path. Runs directly for an agent too, on the passport
        holder's own authority; an installation that wants promotions confirmed sets a tier
        floor on `promote_lead`.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromoteLeadRequest'}
            examples:
              inboundReply:
                value:
                  trigger: inbound_reply
                  evidence:
                    activity_id: 018f3a1b-0000-7000-8000-000000000040
                    note: Prospect replied to our outreach.
      responses:
        '200':
          description: The resulting (created or merged-into) contact.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PromoteLeadResponse'}
        '403':
          description: Approval required (agent-triggered) or RBAC denied.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Lead already promoted.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: Trigger not allowed (e.g. cold-outbound-no-reply does not promote).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /leads/{id}/demote:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Leads]
      operationId: demoteLead
      description: |-
        The documented reverse of POST /leads/{id}/promote, deterministic and conservative:
        it **blocks rather than orphans**.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DemoteLeadRequest'}
      responses:
        '200':
          description: The restored lead and what the reversal did.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemoteLeadResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Lead was never promoted, has already been demoted, or a live lead now holds its email (`duplicate_email`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: The promoted contact owns a deal — the reversal is refused rather than orphaning it.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
      summary: 'The documented reverse of POST /leads/{id}/promote, deterministic and conservative: it **blocks rather than orphans**.'
  /lead-sources:
    get:
      tags: [Leads]
      operationId: listLeadSources
      summary: List lead sources, active and inactive, in display order.
      description: |-
        `data` is the administered list. `discovered` names source values that
        live on leads but are not in the list — connector-written keys such as
        `connector:apollo:…` grouped by their connector prefix, seed values,
        imports — with how many live leads carry each. Adding one as a source
        (POST with that key) makes it administrable.
      responses:
        '200':
          description: The lead source list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeadSourceListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /acquisition-sources:
    get:
      tags: [Deals]
      operationId: listAcquisitionSources
      summary: List deal acquisition sources, active and retired, in display order.
      description: |-
        The administered business channels a deal can be attributed to. This list is
        deliberately separate from `/lead-sources`: that one also models how a RECORD
        reached Margince (connector, import, crawl) and scores lead intent, while this
        one only names how an OPPORTUNITY reached the business. Retired entries are
        returned so a deal still carrying one renders its label and a filter can still
        find it; they cannot be newly assigned.
      responses:
        '200':
          description: The acquisition source list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquisitionSourceListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /record-roles:
    get:
      tags: [Assignments]
      operationId: listRecordRoles
      summary: List responsibility roles, active and retired, in display order.
      description: |-
        The administered vocabulary of responsibilities a colleague or team can hold on a
        company, deal or project. A role names what someone is accountable for and grants
        no access: visibility stays with ownership and record grants. Retired roles are
        returned so an assignment still carrying one renders its label.
      responses:
        '200':
          description: The role list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordRoleListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /records/{record_type}/{record_id}/assignments:
    parameters:
      - name: record_type
        in: path
        required: true
        schema: {$ref: '#/components/schemas/AssignmentRecordType'}
      - name: record_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Assignments]
      operationId: listRecordAssignments
      summary: Who is responsible for this record, by role.
      description: |-
        Answers with the live assignments on one company, deal or project, ordered by role
        then subject name. Requires ordinary read access to the record itself; the answer
        is 404 for a record this caller cannot see, so the list never reveals a record's
        existence.
      responses:
        '200':
          description: The record's assignments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordAssignmentListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /lead-disqualify-reasons:
    get:
      tags: [Leads]
      operationId: listLeadDisqualifyReasons
      summary: List disqualification reasons, active and inactive, in display order.
      responses:
        '200':
          description: The reason list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeadDisqualifyReasonListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
      description: List disqualification reasons, active and inactive, in display order.
  /relationships:
    get:
      tags: [Relationships]
      operationId: listRelationships
      summary: List relationships (employment, deal_stakeholder, or partner edges).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: kind
          in: query
          schema: {type: string, enum: [employment, deal_stakeholder, project_stakeholder, project_company, partner_of, referred_by, co_sell_with, works_with, billing_contact]}
        - name: contact_id
          in: query
          schema: {type: string, format: uuid}
        - name: company_id
          in: query
          schema: {type: string, format: uuid}
        - name: deal_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: A page of relationships.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelationshipListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
      description: List relationships (employment, deal_stakeholder, or partner edges).
    post:
      tags: [Relationships]
      operationId: createRelationship
      summary: Create a relationship edge (employment or deal stakeholder).
      description: |-
        `employment` requires contact_id + company_id; `deal_stakeholder` requires
        deal_id + contact_id. An employment they already hold is refused 409: end the
        existing one before recording a new one. At most one current-primary employer
        per contact; `is_current_primary` is decided here only when you OMIT it — an
        employment for somebody with no other current one then becomes their primary
        — and an employment that has already ended never takes the flag. Send the
        field to decide it yourself. A later PATCH can change it on the same terms,
        the ended-employment rule included: see `updateRelationship`.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRelationshipRequest'}
            examples:
              employment:
                value:
                  kind: employment
                  contact_id: 018f3a1b-0000-7000-8000-000000000010
                  company_id: 018f3a1b-0000-7000-8000-000000000020
                  role: vp_engineering
                  is_current_primary: true
                  source: manual
              stakeholder:
                value:
                  kind: deal_stakeholder
                  deal_id: 018f3a1b-0000-7000-8000-000000000030
                  contact_id: 018f3a1b-0000-7000-8000-000000000010
                  role: champion
                  source: manual
      responses:
        '201':
          description: Created relationship.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Relationship'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /relationships/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Relationships]
      operationId: updateRelationship
      summary: Update a relationship (role, primary flag, dates).
      description: |-
        Only the fields you send change. An employment somebody has LEFT is not
        their current primary one, whichever half of the patch makes it so: an
        `ended_at` that has already arrived clears `is_current_primary`, and
        sending `is_current_primary: true` for an employment that is already over
        does NOT take. Neither is an error — the response is 200 carrying the row
        as it stands, with the flag false, so read the response rather than
        retrying.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateRelationshipRequest'}
      responses:
        '200':
          description: Updated relationship.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Relationship'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Relationships]
      operationId: archiveRelationship
      summary: Archive (soft-delete) a relationship.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Archived relationship.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Relationship'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
      description: |-
        Archive (soft-delete) a relationship.

        Needs the passport permission Change records.

        Runs at once.
  /lists:
    get:
      tags: [Lists]
      operationId: listLists
      summary: Find the lists this caller may see, by name.
      description: |-
        A list is found by its sharing: every seat finds a workspace list, the members of its team
        (or of its owner's teams) find a team list, and only its owner and steward find a private
        one. `visible_count` is how many members THIS caller may see, never the list's whole size.
      parameters:
        - name: entity_type
          in: query
          schema: {type: string, enum: [contact, company, deal, lead, project]}
        - name: list_type
          in: query
          schema: {type: string, enum: [static, dynamic]}
        - name: q
          in: query
          description: Matches the name or purpose, case-insensitively.
          schema: {type: string}
        - name: sharing
          in: query
          description: >-
            Only lists with one of these sharing settings. `private` alone reads the caller's own private lists; `team` and `workspace` together read the lists shared with others.
          schema:
            type: array
            items: {type: string, enum: [private, team, workspace]}
          style: form
          explode: true
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: Lists, by name.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Lists]
      operationId: createList
      summary: Make a Live List (a saved filter) or a Shortlist (chosen records).
      description: |-
        A Live List stores the filter tree it was previewed with, validated against the record
        type's filter vocabulary; a Shortlist stores none. Sharing defaults to `team` and the
        steward to the caller.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateListRequest'}
      responses:
        '201':
          description: Created list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/List'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /lists/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Lists]
      operationId: getList
      summary: Read one list, with the count of its members this caller may see.
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/List'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Read one list, with the count of its members this caller may see.
    patch:
      tags: [Lists]
      operationId: updateList
      summary: Change a list's name, purpose, filter, sharing, team or steward.
      description: |-
        Needs list authority: the list's steward, or a seat with the list update grant that reads
        every row. `version` must be the one the caller read; a list changed since answers `409`.
        An archived list is read-only (`409`). Every change is recorded as a revision.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateListRequest'}
      responses:
        '200':
          description: The changed list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/List'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Lists]
      operationId: archiveList
      summary: Archive a list. Its members and history stay, read-only.
      responses:
        '200':
          description: Archived list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/List'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: |-
        Archive a list. Its members and history stay, read-only.

        Needs the passport permission Change records.

        Runs at once.
  /lists/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Lists]
      operationId: restoreList
      summary: Bring an archived list back.
      responses:
        '200':
          description: The restored list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/List'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
      description: |-
        Bring an archived list back.

        Needs the passport permission Change records.

        Runs at once.
  /lists/{id}/members:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Lists]
      operationId: listListMembers
      summary: Page through the members of a list this caller may see.
      description: |-
        A Shortlist's chosen members, with who added each, when and why; or a Live List's filter
        evaluated now, completely, in pages. Both are row-scoped: a member record this caller
        cannot see is absent, and nothing says it was there. For member rows with their record's
        own columns, read the record list (`listContacts`, `listCompanies`, `listDeals`,
        `listLeads`) with `list_id`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: entity_id
          in: query
          description: >-
            Only these records, at most 200, answered in one page; a record that is not a member, or that this caller cannot see, is absent. Takes no cursor.
          schema:
            type: array
            maxItems: 200
            items: {type: string, format: uuid}
          style: form
          explode: true
      responses:
        '200':
          description: One page of members.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListMemberListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Lists]
      operationId: addListMember
      summary: Add one record to a Shortlist, with an optional note on why.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListMemberChangeRequest'}
      responses:
        '201':
          description: Added member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Add one record to a Shortlist, with an optional note on why.

        Needs the passport permission Change records.

        Runs at once.
  /lists/{id}/members/remove:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Lists]
      operationId: removeListMember
      summary: Take one record off a Shortlist, with an optional note on why.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListMemberChangeRequest'}
      responses:
        '200':
          description: Removed. The body is the handle `restoreListMember` takes to put the record back.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemovalUndo'}
        '204':
          description: >-
            Not sent. A removal answers `200` with its undo handle, and a record that is not on the list answers `404`.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Take one record off a Shortlist, with an optional note on why.

        Needs the passport permission Change records.

        Runs at once.
  /lists/{id}/members/{recordId}/why:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: recordId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Lists]
      operationId: explainListMember
      summary: Say why a record is, or is not, on a list.
      description: |-
        For a Live List: every clause of the filter with its verdict for this record and the
        record's current value, evaluated by the same SQL that decides membership. A value this
        caller may not read (a masked field, a fact on a linked record) is `hidden`. For a
        Shortlist: who added the record, when, and the note they left. A record this caller cannot
        see answers `404`, whether or not it is a member.
      responses:
        '200':
          description: The explanation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListMemberExplanation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /records/{entity_type}/{entity_id}/lists:
    parameters:
      - name: entity_type
        in: path
        required: true
        schema: {type: string, enum: [contact, company, deal, lead]}
      - name: entity_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Lists]
      operationId: getRecordLists
      summary: The lists one record is on that this caller may find.
      description: |-
        Every Shortlist the record was chosen for, and every Live List whose filter selects it
        now, evaluated by the same SQL the member read uses. Only lists this caller may find, and
        not archived ones; a Live List whose filter no longer compiles is left out. A record that
        does not exist, is archived, or that this caller cannot see answers `404`. Each list carries its identity, kind and sharing; read
        `getList` for its counts and health.
      responses:
        '200':
          description: The lists the record is on, by name.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordListsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /lists/{id}/history:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Lists]
      operationId: listListHistory
      summary: Read what changed on a list, newest first.
      description: |-
        Every change of the list's definition, every Shortlist membership change, and every record
        a Live List was seen to gain or lose, about a record this caller can see now. A change
        about a record they cannot see is absent. The check runs every 15 minutes and takes the
        Live Lists checked longest ago first, so with very many lists one can wait longer; the
        list's `last_check` says when it was. `member_entered` and `member_left` are stamped with
        the check that saw them, and a record that joined and left between two checks is not
        recorded.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListHistoryResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /filters/vocabulary:
    get:
      tags: [Views]
      operationId: getFilterVocabulary
      summary: Read what a new filter clause may name on one record type.
      description: |-
        The per-resource filter vocabulary: every field a dynamic list, saved view
        or filtered export may name for this record type, each with the operator
        subset its type admits.
      parameters:
        - name: resource
          in: query
          required: true
          description: The record type whose vocabulary to read.
          schema: {type: string, enum: [contact, company, deal, lead, project]}
      responses:
        '200':
          description: The vocabulary for this resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FilterVocabulary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /analytics/metrics:
    get:
      tags:
        - Reports
      operationId: getReportingMetrics
      summary: Get reporting metrics
      responses:
        '200':
          description: Reporting result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: Get reporting metrics
  /analytics/evaluate.csv:
    get:
      tags:
        - Reports
      operationId: exportReportingEvaluation
      summary: Evaluate reporting
      responses:
        '409': {$ref: '#/components/responses/Conflict'}
        '200':
          description: Reporting result.
          content:
            text/csv:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
        - in: query
          name: evaluation_key
          required: true
          schema: {type: string}
        - in: query
          name: evaluated_at
          required: true
          schema: {type: string, format: date-time}
        - in: query
          name: framework_revision
          required: true
          schema: {type: integer, format: int64}
        - name: scope_kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - owner
              - team
              - workspace
        - name: scope_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: pipeline_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum:
              - this_month
              - last_month
              - last_week
              - this_quarter
              - custom
        - name: start_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: target_basis
          in: query
          required: false
          schema:
            type: string
            enum:
              - month
              - fiscal_quarter
        - name: close_window
          in: query
          required: false
          schema:
            type: string
            enum:
              - fiscal_quarter
              - all_open
        - name: metrics
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ReportingMetricID'
            maxItems: 8
        - name: blocks
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ReportingBlockKind'
            maxItems: 20
      description: Evaluate reporting
  /analytics/editions/{id}/export.csv:
    get:
      tags: [Reports]
