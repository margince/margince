        data: {type: array, items: {$ref: '#/components/schemas/ListMember'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    ListClauseVerdict:
      type: object
      description: >-
        One node of a Live List's filter judged for one record: a group (`join`, `children`) or a clause (`field`, `op`, `operand`). `result` is null where SQL answers unknown, which the filter treats as not selected.
      required: [result]
      properties:
        join: {type: string, enum: [and, or]}
        children: {type: array, items: {$ref: '#/components/schemas/ListClauseVerdict'}}
        field: {type: string}
        op: {type: string}
        operand: {description: 'The clause''s value as the filter states it.'}
        result: {type: [boolean, 'null']}
        value: {type: [string, 'null'], description: 'The record''s current value of the field, as text.'}
        hidden: {type: boolean, description: 'The value is not shown to this caller.'}
        value_label: {type: [string, 'null'], description: 'For a reference to a company or project this caller may open, its name.'}
    ListMemberExplanation:
      type: object
      required: [list_id, entity_id, list_type, member]
      properties:
        list_id: {type: string, format: uuid}
        entity_id: {type: string, format: uuid}
        list_type: {type: string, enum: [static, dynamic]}
        member: {type: boolean}
        eligible: {type: boolean, description: 'For a Live List, whether the record is live and eligible at all, before any clause.'}
        clauses: {$ref: '#/components/schemas/ListClauseVerdict'}
        added_by: {type: [string, 'null']}
        added_by_name: {type: [string, 'null']}
        added_at: {type: [string, 'null'], format: date-time}
        note: {type: [string, 'null']}
    ListHistoryEntry:
      type: object
      required: [id, kind, occurred_at, actor]
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          enum: [member_added, member_removed, member_entered, member_left, revised]
          description: >-
            `member_entered` and `member_left` are a Live List's observed changes, stamped with the check that saw them.
        definition_version:
          type: [integer, 'null']
          format: int64
          description: >-
            For an observed change, the list version whose filter it was seen under.
        reason: {type: [string, 'null'], enum: [chosen, bulk, record_archived, record_restored, evaluated, filter_changed, automation, null], description: '`filter_changed` marks the first check after the filter changed; `automation` a record an automation rule added.'}
        occurred_at: {type: string, format: date-time}
        actor: {type: string}
        actor_name: {type: [string, 'null']}
        entity_type: {type: [string, 'null']}
        entity_id: {type: [string, 'null'], format: uuid}
        note: {type: [string, 'null']}
        version: {type: [integer, 'null'], format: int64}
        name: {type: [string, 'null']}
        definition: {type: [object, 'null'], additionalProperties: true}
        sharing: {type: [string, 'null']}
    RecordListsResponse:
      type: object
      required: [data, truncated]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/List'}}
        truncated: {type: boolean, description: 'More lists hold the record than one answer carries; `data` is the first 1000 by name.'}
    ListHistoryResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ListHistoryEntry'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    FilterVocabulary:
      type: object
      description: |-
        What a filter may say about one record type. Read from the
        engine that evaluates filters, so the set here and the set the engine
        accepts are the same set.
      required: [resource, fields]
      properties:
        resource:
          type: string
          enum: [contact, company, deal, lead, project]
        fields:
          type: array
          description: |-
            Every offerable field, core and custom together — a filter names them
            the same way, so splitting them here would invite a caller to treat
            one kind as second class. A retired field of either kind is absent
            (see `custom`); a core field retired by an ADR is absent for the same
            reason and has no catalog row a client could learn that from.
          items: {$ref: '#/components/schemas/FilterVocabularyField'}
    FilterVocabularyField:
      type: object
      description: One field a filter clause may name, with what it accepts.
      required: [name, type, operators, custom]
      properties:
        name:
          type: string
          description: |-
            The name a filter clause uses. For a custom field this is the
            physical `cf_`-prefixed column, which is the same `column_name` the
            custom-field catalog reports — join on it to show an admin's label,
            since the catalog owns labels and this vocabulary does not.
        type:
          type: string
          enum: [text, number, date, currency, picklist, multiselect, boolean, id, domain]
          description: |-
            The six custom-field types, plus `id` for a reference to another record and
            `domain` for a host column. The type decides the operators, which is why it is here.
        operators:
          type: array
          description: |-
            The operator subset this field's type admits, in one
            stable order. An operator absent here is one the engine refuses for
            this field, so a builder can disable it rather than discover it.
          items:
            type: string
            enum: [eq, neq, gt, lt, gte, lte, in, contains, exists]
        custom:
          type: boolean
          description: |-
            Whether this is a workspace-defined custom-field column. Where true,
            `name` is the catalog's `column_name` — join on it to show an admin's
            `label`, which the catalog owns and this vocabulary does not.
        options:
          type: array
          items: {type: string}
          description: |-
            A picklist field's allowed values, present (non-empty) when
            `type=picklist` and absent otherwise. Offer these rather than a text
            box: a value outside the set compiles and matches nothing, so a typo
            reads as a settled answer instead of a mistake.
        references:
          type: string
          enum: [tag, app_user, team, company, pipeline, stage, project]
          description: |-
            The record type this field's ids point at — present for every `id`
            field, absent for every other type. Offer the record rather than a
            box for its uuid.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: |-
            For a `currency` field, the ISO 4217 code its values are counted in: the
            installation's base currency for a deal's `amount`, the field's own currency
            for a custom one. The operand is a whole number of that currency's minor
            units (cents for EUR, whole yen for JPY), so a builder that lets a reader
            type an amount scales it by the currency's exponent. Absent for every other
            type, and where this reader may not learn the currency.
    Tag:
      type: object
      description: A tag. Mirrors the `tag` table.
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 64}
        color: {type: [string, 'null'], enum: [teal, amber, rose, slate, sky, violet, lime, orange, null]}
        description: {type: [string, 'null']}
        suggestible:
          type: boolean
          description: |-
            Whether captured mail and meeting notes may suggest this tag. A suggestible tag
            carries a description of what interest looks like, and that description is what
            the suggestion is matched against. Only Admin and Ops set it.
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 64}
        color: {type: [string, 'null'], enum: [teal, amber, rose, slate, sky, violet, lime, orange, null]}
        description: {type: [string, 'null']}
    RowTag:
      type: object
      description: |-
        A tag as a list ROW carries it: the word and its colour, nothing else. The full
        assignment — who applied it, when — comes from the record's own tags read, because a
        page of fifty rows does not need fifty assignments to draw a chip.
      required: [tag_id, name]
      properties:
        tag_id: {type: string, format: uuid}
        name: {type: string}
        color: {type: [string, 'null'], enum: [teal, amber, rose, slate, sky, violet, lime, orange, null]}
    RecordTagsResponse:
      type: object
      description: |-
        What one record carries. `withheld` says the caller could not read the vocabulary,
        which is why `data` is empty — a reader has to be able to tell that from a record
        with no tags on it.
      required: [data, withheld]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/RecordTag'}}
        withheld: {type: boolean}
    RecordTag:
      type: object
      description: One tag on one record, with the assignment that put it there.
      required: [tag_id, name, archived, assigned_at]
      properties:
        tag_id: {type: string, format: uuid}
        name: {type: string}
        color: {type: [string, 'null'], enum: [teal, amber, rose, slate, sky, violet, lime, orange, null]}
        description: {type: [string, 'null']}
        archived: {type: boolean}
        assigned_at: {type: string, format: date-time}
        assigned_by: {$ref: '#/components/schemas/RecordTagAssigner'}
    RecordTagAssigner:
      type: object
      description: Who applied a tag. `kind` says by what hand, which a reader needs to tell a colleague's choice from an import's.
      required: [kind]
      properties:
        user_id: {type: [string, 'null'], format: uuid}
        display_name: {type: [string, 'null']}
        kind: {type: string, enum: [human, agent, import]}
    TagDetail:
      type: object
      description: One tag with how much of the workspace carries it.
      required: [id, name, usage]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 64}
        color: {type: [string, 'null'], enum: [teal, amber, rose, slate, sky, violet, lime, orange, null]}
        description: {type: [string, 'null']}
        suggestible:
          type: boolean
          description: |-
            Whether captured mail and meeting notes may suggest this tag. A suggestible tag
            carries a description of what interest looks like, and that description is what
            the suggestion is matched against. Only Admin and Ops set it.
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
        usage: {$ref: '#/components/schemas/TagUsage'}
    TagUsage:
      type: object
      description: |-
        How many records of each advertised type carry this tag, counted within what the
        reader may see. Project taggings are storage the product does not advertise and are
        not counted.
      required: [contacts, companies, deals, leads]
      properties:
        contacts: {type: integer}
        companies: {type: integer}
        deals: {type: integer}
        leads: {type: integer}
    UpdateTagRequest:
      type: object
      description: |-
        A partial update: an omitted field is left alone.
      properties:
        name: {type: string, maxLength: 64}
        color: {type: string, enum: [teal, amber, rose, slate, sky, violet, lime, orange, none]}
        description: {type: string}
        suggestible:
          type: boolean
          description: Turns suggestions of this tag on or off. Turning them on needs a description, sent here or already held.
    MergeTagsRequest:
      type: object
      required: [into_tag_id]
      properties:
        into_tag_id:
          type: string
          format: uuid
          description: The tag that survives. Must be live, and must not be this tag.
        into_tag_version:
          type: integer
          format: int64
          minimum: 1
          description: |-
            The version the surviving tag was read at, refusing the merge with 409 if it has
            moved since. A merge is a TWO-row operation and the routed id pins only one of
            them, so without this the word a caller decided to fold INTO can be renamed
            between the decision and the act, and the merge still runs as though it had not
            been.
    MergeTagsResult:
      type: object
      description: What the merge did, in the two numbers that differ.
      required: [into_tag_id, moved, collapsed]
      properties:
        into_tag_id: {type: string, format: uuid}
        moved:
          type: integer
          description: Records that carried only the source and now carry the target.
        collapsed:
          type: integer
          description: |-
            Records that already carried both. Their duplicate tagging is dropped rather than
            moved, so the target gains nothing from them — which is why this is not folded
            into `moved`.
    Taggable:
      type: object
      required: [id, tag_id, entity_type, entity_id]
      properties:
        id: {type: string, format: uuid}
        tag_id: {type: string, format: uuid}
        entity_type: {type: string, enum: [contact, company, deal, lead, project]}
        entity_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    ApplyTagRequest:
