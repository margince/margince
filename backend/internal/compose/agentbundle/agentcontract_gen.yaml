        name: {type: string}
        query: {type: object, additionalProperties: true}
    UpdateSavedViewRequest:
      type: object
      description: A partial update; omitted fields keep their stored value.
      properties:
        name: {type: string}
        query: {type: object, additionalProperties: true}
    SavedViewListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/SavedView'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    User:
      type: object
      description: A seat — human or first-party agent.
      required: [id, email, display_name, status, is_agent]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        greeting_name:
          type: [string, 'null']
          maxLength: 100
          description: >-
            The name a colleague's greeting uses ("Hi Sofia,"), absent or null when nobody has said. Read through one rule on both sides: this when set, else the first word of `display_name`. Present on the caller's own seat; absent on the roster.
        timezone: {type: string, default: UTC, description: IANA name.}
        locale:
          type: string
          enum: [en, de, vi]
          description: >-
            The language this contact chose for their own interface, absent when they never chose one. Distinct from the installation's `base_language`, which is what AI writes in for the whole team: this one changes only what THIS contact sees.
        status:
          type: string
          enum: [invited, active, suspended, deactivated]
          default: active
          description: >-
            `invited` is a seat that exists and has never been entered: the member holds a licensed seat and appears in the roster, but has set no password and can sign in by no method until they redeem their invitation link. Redeeming it makes them `active`, which is the only status that may sign in.
        is_agent: {type: boolean, default: false, description: First-party Agent Runner identity vs a human seat.}
        roles:
          type: array
          items: {type: string}
          description: >-
            This member's assigned system role keys. Present ONLY for an admin caller — the roster is readable by every authenticated member (it feeds the share/assignee pickers), and a rep has no business enumerating who holds `admin`. Normally exactly one key: `inviteUser` assigns one and `changeUserRole` replaces the whole set with one. Clients that render a single current role must still handle the empty and multi-key cases. Deliberately absent on `MeResponse.user`, whose sibling `MeResponse.roles` is the one authority for the caller's own roles — the same fact spelled twice could disagree.
        team_ids:
          type: array
          items: {type: string, format: uuid}
          description: >-
            The live teams this user belongs to, ordered by team name. Present ONLY for an admin caller, on the same terms as `roles`: the roster answers every authenticated user because the share and assignee pickers read it, and who is in which team is not theirs to enumerate. An ARCHIVED team is absent — its memberships resolve no scope and no share, so listing one would describe access the user does not have.
        allowed_actions:
          type: array
          items:
            type: string
            enum: [change_role, issue_password_link, deactivate, reactivate]
          description: >-
            The member verbs the CALLER would be admitted to on this user right now, computed by the same checks those endpoints run: the `user_admin` verb each takes, a seat that may write, the ceiling over the target (a non-admin never acts on an admin, and otherwise holds everything the verb reaches), the member's status and kind, the last-admin guard, an archived role still held, the licensed seat ceiling on reactivation, and whether this installation can build a set-password link. Present on `listUsers`'s management view for a human caller only; absent means not computed, and a client offers nothing then. It is an offer, not a promise: every write re-checks under its lock, and `change_role` says a role change is possible at all — which roles, is `listAssignableRoles`'s answer.
        last_active_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When this member last used the product: the latest request any of their sign-in sessions made, including a session since signed out, revoked or expired. Clearing dead sessions records the latest of their requests on the member first, so the value outlives the sessions. Signing in counts as activity. Work an agent or a connected app did on their behalf does not.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    SeatName:
      type: object
      description: >-
        A colleague's id and the name a human would recognise them by. Deliberately nothing else: this answers what an id is CALLED, for a caller that already holds the id off a record they can read. Email, status and seat type are the roster's answers, and a naming read has no business disclosing them.
      required: [id, display_name]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
    SeatNameListResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/SeatName'}}
    Team:
      type: object
      description: Mirrors the `team` table.
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        parent_team_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
        member_count: {type: integer, description: 'Active memberships; populated by listTeams.'}
    ForecastReadings:
      type: object
      description: >-
        Four money readings over one period, the counts that say what they leave out, and the frame they were computed in.
      required:
        - period_start
        - period_end
        - scope_kind
        - won_minor
        - evidence_minor
        - best_case_minor
        - open_minor
        - weighted_minor
        - eligible_count
        - priced_count
        - confirmed_date_count
        - fx_missing_count
        - as_of
        - timezone
        - base_currency
      properties:
        period_start: {type: string, format: date}
        period_end:
          type: string
          format: date
          description: The last day INSIDE the period, not an exclusive bound.
        scope_kind:
          type: string
          enum: [workspace, managed_teams, team, owner]
          description: >-
            Which population these readings cover. `managed_teams` is what an omitted scope resolves to for a team manager — their teams and themselves — and is a RESULT only: it names no single subject, so no forecast can be recorded against it and no standing call is looked up for it. The write schemas keep the three nameable scopes.
        scope_id: {type: string, format: uuid}
        won_minor:
          type: integer
          format: int64
          description: >-
            Deals whose ACTUAL close instant fell in this period, by its local days. Not the expected date: a deal expected in March and won in April is April's.
        evidence_minor:
          type: integer
          format: int64
          description: >-
            Committed pipeline whose close date somebody confirmed. A provisional date is a guess, so it is excluded here and included in open_minor.
        best_case_minor: {type: integer, format: int64}
        open_minor: {type: integer, format: int64}
        weighted_minor:
          type: integer
          format: int64
          description: >-
            Each open deal at its stage probability, rounded PER DEAL and then summed. Not the sum rounded once — the two differ by up to one minor unit per deal.
        eligible_count:
          type: integer
          description: Deals considered, priced or not.
        priced_count:
          type: integer
          description: >-
            How many carried an amount. The gap to eligible_count is what the money readings do not cover: an unpriced deal is real pipeline contributing zero.
        confirmed_date_count: {type: integer}
        fx_missing_count:
          type: integer
          description: >-
            Priced deals no rate could convert. Counted rather than silently totalled as zero, which would read as a smaller pipeline instead of an unconverted one.
        as_of: {type: string, format: date-time}
        timezone:
          type: string
          description: The zone the period's days were cut in, as an IANA name.
        base_currency: {type: string}
        current_call: {$ref: '#/components/schemas/ForecastCall'}
        scope_limited:
          type: boolean
          description: >-
            True when deals the caller cannot read were left out. A BOOLEAN and never a count: a count of what somebody may not read is itself a statement about how much of it there is, so the reader is told the figure is partial and not by how much.
        landing: {$ref: '#/components/schemas/ForecastLanding'}
        sufficiency: {$ref: '#/components/schemas/ForecastSufficiency'}
        snapshots:
          type: array
          items: {$ref: '#/components/schemas/ForecastSnapshotRef'}
          description: >-
            The frozen states of this period and population, newest first: the ten most recent plus the period's first, so a reader has both the latest and the "since the period opened" anchor. These are the ids `getForecastMovement` takes in `from` and `to`. Only whole-pipeline snapshots are listed; one restricted to a single pipeline covers a different population. Empty when nothing was frozen, and always empty for `managed_teams`, which nothing is frozen against.
      additionalProperties: false
    ForecastSnapshotRef:
      type: object
      description: One frozen forecast, by the handle a movement read takes.
      required: [id, taken_at, trigger]
      properties:
        id: {type: string, format: uuid}
        taken_at: {type: string, format: date-time}
        trigger:
          type: string
          enum: [daily, call, period_close, recheck]
          description: Why it was taken.
      additionalProperties: false
    ForecastLanding:
      type: object
      description: >-
        Where the period finishes if nothing changes, and what that answer rests on.
      required: [amount_minor, measure, won_minor, remaining_minor]
      properties:
        amount_minor:
          type: integer
          format: int64
          description: The projection itself, in the installation's base currency.
        measure:
          type: string
          enum: [commit_evidence, weighted, manager_call]
          description: >-
            Which reading the forward half was built from — the one ACTUALLY used, which is not always the one configured: a manager-call installation with no current call falls back to commit evidence and says so in `caveat`.
        won_minor:
          type: integer
          format: int64
          description: The money already banked, the backward half of the sum.
        remaining_minor:
          type: integer
          format: int64
          description: >-
            The forward half. Zero for a manager call, which is a single authored TOTAL rather than a remainder — a call is not added to won_minor, and a reconciliation line drawing this must say the call instead of a split.
        caveat:
          type: string
          enum: [call_absent, call_below_actual]
          description: >-
            Why this answer is not the plain one, absent when it is. `call_absent` is a manager-call installation with no current call. `call_below_actual` is an authored call less than the money already won — reported and never corrected, because the call is somebody's stated belief and the server does not overrule it.
      additionalProperties: false
    ForecastSufficiency:
      type: object
      description: >-
        Whether the open pipeline supports the reference landing, and what the reference is.
      properties:
        absent:
          type: string
          enum: [insufficient_basis, insufficient_history]
          description: >-
            Why there is no answer, when there is none. Every other field is then absent and the surface says this rather than drawing a figure. `insufficient_basis` is neither a manager call nor four completed comparable periods; `insufficient_history` is too few closed deals for a conversion rate to be a rate rather than an anecdote.
        basis:
          type: string
          enum: [manager_call, historical_median]
          description: >-
            Where the reference came from. A current authored call outranks history: a manager who wrote a number down has said what this period is for, and the median of the last four completed comparable periods is the fallback for when nobody has.
        reference_landing_minor: {type: integer, format: int64}
        remaining_to_support_minor:
          type: integer
          format: int64
          description: >-
            The reference minus what is already won, floored at zero — a period already past its reference needs no more pipeline.
        needed_open_minor:
          type: integer
          format: int64
          description: The open pipeline that remainder implies at the conversion rate.
        current_open_minor: {type: integer, format: int64}
        coverage_bp:
          type: integer
          format: int64
          description: >-
            Current over needed in BASIS POINTS, so the server chooses no rounding for the client. Nothing needed is 10000 (full) rather than a division by zero or an unbounded ratio, because "covered" is actionable and "infinity" is not.
      additionalProperties: false
    InputCheck:
      type: object
      description: One finding from the nightly input check.
      required: [id, type, subject_kind, subject_id, severity, status, first_seen_at, last_seen_at]
      properties:
        id: {type: string, format: uuid}
        type:
          type: string
          description: >-
            Which question noticed it. The key set in `claim` and `observed` depends on this.
        subject_kind: {type: string, enum: [deal, signal, offer, contract]}
        subject_id: {type: string, format: uuid}
        subject:
          allOf: [{$ref: '#/components/schemas/AttentionSubject'}]
          readOnly: true
          nullable: true
          description: >-
            The record this finding is about, named and addressed — the same shape the Worklist carries, so a client routes it through the one registry rather than mapping `subject_kind` onto a screen a second time.
        severity: {type: string, enum: [low, medium, high]}
        affected_minor:
          type: integer
          format: int64
          description: >-
            How much money the finding puts in question. Absent where that cannot be said — which is different from zero, and zero would claim nothing is at stake.
        currency: {type: string}
        owner_id: {type: string, format: uuid}
        status: {type: string, enum: [open, resolved, expired]}
        claim:
          type: object
          additionalProperties: true
          description: What the record says, as structured values only.
        observed:
          type: object
          additionalProperties: true
          description: What the check found, as structured values only.
        first_seen_at: {type: string, format: date-time}
        last_seen_at:
          type: string
          format: date-time
          description: >-
            The most recent run that still found it. A finding seen for weeks is a different thing from one that appeared last night.
      additionalProperties: false
    DataCoverage:
      type: object
      description: How current the sources behind the forecast's numbers are.
      required: [run_id, as_of, sources]
      properties:
        run_id: {type: string, format: uuid}
        as_of: {type: string, format: date-time}
        sources:
          type: array
          description: >-
            The sources the run tried, and how far it reached into each. A source absent from this list is one the run did not attempt — different from one it attempted and could not read, which the state field says.
          items: {$ref: '#/components/schemas/ForecastAssuranceSource'}
      additionalProperties: false
    ForecastAssurance:
      type: object
      description: >-
        What the most recent nightly input check found, and how much of the pipeline it was able to reach.
      required: [run_id, as_of, status, eligible_deals, sources]
      properties:
        run_id: {type: string, format: uuid}
        as_of: {type: string, format: date-time}
        status:
          type: string
          enum: [complete, incomplete]
          description: >-
            `incomplete` means an upstream was unavailable. The run still happened and recorded what it could reach — refusing to run would produce no record in exactly the case worth reporting.
        readiness:
          type: string
          enum: [ready, ready_with_exceptions, needs_review, checks_incomplete]
          description: >-
            What the run entitles a reader to conclude. `checks_incomplete` is not a worse `needs_review`: one says the pipeline has problems, the other says we could not look.
        eligible_deals:
          type: integer
          description: How many deals the run evaluated, counted one per deal.
        eligible_signals: {type: integer}
        sources:
          type: array
          description: Every source the run tried, and how far it reached into each.
          items: {$ref: '#/components/schemas/ForecastAssuranceSource'}
      additionalProperties: false
    ForecastAssuranceSource:
      type: object
      required: [source, state]
      properties:
        source:
          type: string
          enum: [mail, calendar, documents, contracts, offers, incumbent]
        state:
          type: string
          enum: [checked, stale, unavailable, permission_limited, not_connected]
        checked_through:
          type: string
          format: date-time
          description: >-
            How current the source was. Present only for a `checked` source: a date on an unread one would read as "checked up to then" when nothing was read at all.
      additionalProperties: false
    ForecastMovement:
      type: object
      description: >-
        The classified difference between two snapshots. opening_minor plus every bucket equals closing_minor, exactly.
      required: [reading, opening_minor, closing_minor, buckets, deals]
      properties:
        reading: {type: string, enum: [open, weighted, evidence, best_case]}
        opening_minor: {type: integer, format: int64}
        closing_minor: {type: integer, format: int64}
        buckets:
          type: array
          description: >-
            The named causes, in the order a waterfall draws them — what arrived, what crossed the period, what was repriced, and only then what the machinery did. A bucket that moved nothing is absent rather than zero.
          items: {$ref: '#/components/schemas/ForecastMovementBucket'}
        deals:
          type: array
          description: One row per deal that moved, each in exactly one bucket.
          items: {$ref: '#/components/schemas/ForecastMovementDeal'}
      additionalProperties: false
    ForecastMovementBucket:
      type: object
      required: [name, amount_minor, deal_count]
      properties:
        name:
          type: string
          enum: [new, pulled_in, pushed_out, amount, category, stage_weight, won, lost, reopened_or_archived, fx, definition, model]
        amount_minor: {type: integer, format: int64}
        deal_count: {type: integer}
      additionalProperties: false
    ForecastMovementDeal:
      type: object
      required: [deal_id, bucket, amount_minor]
      properties:
        deal_id: {type: string, format: uuid}
        bucket: {type: string}
        amount_minor: {type: integer, format: int64}
        from_minor:
          type: integer
          format: int64
          description: Absent for a deal that was not in the opening snapshot at all.
        to_minor: {type: integer, format: int64}
        audit_id:
          type: string
          format: uuid
          description: >-
            The audit row for the change, stored when the closing snapshot was taken rather than reconstructed from timestamps — which is wrong exactly when two changes land in the same second. Absent where the reference has aged out of retention, which reads as "no longer recorded" rather than as no change.
        approval_id: {type: string, format: uuid}
      additionalProperties: false
    ForecastCall:
      type: object
      required: [id, period_start, period_end, scope_kind, amount_minor, currency, author_id, created_at]
      properties:
        id: {type: string, format: uuid}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
        scope_kind: {type: string, enum: [workspace, team, owner]}
        scope_id: {type: string, format: uuid}
        amount_minor: {type: integer, format: int64}
        currency: {type: string}
        note: {type: string}
        author_id: {type: string, format: uuid}
        supersedes_id:
          type: string
          format: uuid
          description: >-
            The call this one replaces. Absent on the first call of a period, which is a different fact from replacing nothing.
        created_at: {type: string, format: date-time}
      additionalProperties: false
    AnalyticsQuery:
      type: object
      description: One question, in the vocabulary the schema returned.
      required: [entity, measures]
      properties:
        entity: {type: string, description: "The population, by name."}
        scope_kind:
          type: string
          description: |-
            `workspace`, `team` or `owner` — the same vocabulary `AnalyticsScope.kind` answers in,
            minus `managed_teams`, which is RESOLVED and never requested (a caller names one team,
            or names nothing and is given it). No enum here on purpose: the resolver is the
            authority on what this seat may measure, and a second list would be a second answer to
            that, refusing on shape what it should refuse on authority.
        scope_id:
          type: string
          format: uuid
          description: The team or seat to measure, for `scope_kind` `team` or `owner`.
        group_by:
          type: array
          items: {type: string}
          description: >-
            The dimensions. Omitted is a single-row answer over the whole population, which is a real question rather than a missing one.
        measures:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/AnalyticsMeasure'}
          description: >-
            What to compute. At least one — a query with none asks for group keys and nothing beside them, which is a list rather than an analytic question.
        filters:
          type: array
          items: {$ref: '#/components/schemas/AnalyticsFilter'}
        limit:
          type: integer
          description: >-
            How many groups at most. Omitted takes the default; a grouping by a high-cardinality field would otherwise return a row per record.
        save:
          type: boolean
          description: >-
            Keep this answer so a report sentence can cite it, returning `run_id`. Opt-in rather than automatic: most queries are somebody exploring, and saving every one would fill the table with results nothing will ever point at.
      additionalProperties: false
    AnalyticsMeasure:
      type: object
      required: [fn]
      properties:
        fn:
          type: string
          enum: [count, count_distinct, sum, avg, min, max, median, p75]
          description: >-
            The aggregate. `count` counts ROWS and takes no field; `count_distinct` counts values and skips nulls. The two differ on an unpriced deal, so naming the wrong one reports a column's coverage as its population. `median` and `p75` answer null below a five-value sample floor: a percentile over three deals is one deal's value wearing a statistic's name, and the count beside the blank still says how many there were.
        field:
          type: string
          description: What to aggregate. Required for every fn but `count`.
        as:
          type: string
          description: >-
            The caller's name for the result column. It never reaches the statement — results map by position — so it cannot carry anything into SQL.
      additionalProperties: false
    AnalyticsFilter:
      type: object
      required: [field, op]
      properties:
        field: {type: string}
        op:
          type: string
          enum: [eq, ne, lt, lte, gt, gte, is_null, is_not_null]
        value:
          description: >-
            The value to compare against, bound as a parameter. Omitted exactly for `is_null` and `is_not_null`; given to either, the query is refused rather than having it silently dropped.
      additionalProperties: false
    AnalyticsAnswer:
      type: object
      required: [columns, rows, withheld, total_safe, schema_version]
      properties:
        columns:
          type: array
          items: {type: string}
          description: What each value in a row means, in order.
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
          description: >-
            One object per group, marked `_withheld` when the floor kept it back. A withheld row carries null for every column INCLUDING its group keys: keeping the keys turned a grouping by identity into a paginated dump of every record's identity with only the measures blanked. The row itself stays so the answer's row count is not a signal of its own.
        withheld:
          type: boolean
          description: >-
            Whether anything was kept back. A boolean and never a count: a count of what somebody may not see states how much of it there is.
        total_safe:
          type: boolean
          description: >-
            Whether a total over these rows may be shown. False once anything is withheld, because the total minus the shown groups is the withheld remainder.
        schema_version:
          type: string
          description: The vocabulary this was asked in.
        run_id:
          type: string
          format: uuid
          description: >-
            Where this answer was saved, present only when the query asked for it. A report block cites this id plus a cell's coordinates instead of carrying the number.
        labels: {$ref: '#/components/schemas/AnalyticsIdLabels'}
        population_narrowed: {$ref: '#/components/schemas/PopulationNarrowed'}
      additionalProperties: false
    PopulationNarrowed:
      type: [string, 'null']
      enum: [owners_you_may_measure, null]
      description: >-
        Why this answer covers fewer rows than the report's population, or absent when it covers all of them. A drill-through or explanation carries the same value as the answer it explains, and its records are narrowed the same way. `owners_you_may_measure`: the report measures every record the caller may read, the question broke it down by owner, and only the owners the caller may measure are counted — themselves, the members of the teams they manage, and rows nobody owns. An all-scope seat is never narrowed. It names a reason and never a count, because how many rows were left out would describe them.
    AnalyticsIdLabels:
      type: object
      description: >-
        Display names for the ids in the grouped columns that name a company or a project, keyed by column and then id, read under this caller's own grants. An id this caller may not name is absent, and so is a column with nothing named; the id still stands on the row. A withheld row carries no id, so nothing here names it.
      additionalProperties:
        type: object
        additionalProperties: {type: string}
    AnalyticsRefusal:
      description: >-
        A problem body whose `details` spell out an analytics refusal, present whenever the engine refused the question. A 400 the engine did not write — a malformed scope, a document outside the block grammar — carries the problem alone.
      type: object
      required: [status, code]
      properties:
        type: {type: string, format: uri, default: 'about:blank'}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string, format: uri}
        details: {$ref: '#/components/schemas/AnalyticsRefusalDetails'}
    AnalyticsRefusalDetails:
      type: object
      description: >-
        Why a question was not answered, in parts a client can render. `detail` beside it says the same as one sentence, for a reader that has only prose.
      required: [kind, message, suggest]
      properties:
        kind:
          type: string
          enum: [invalid, unsupported, privacy]
          description: >-
            `invalid`: the question means nothing as asked, such as a sum over a stage name. `unsupported`: it names a population, field, aggregate or comparison this caller's vocabulary does not have. `privacy`: the answer would describe too few records.
        message: {type: string, description: "What is wrong, in the asker's terms."}
        suggest: {type: string, description: "The smallest change that would have worked."}
      additionalProperties: false
    ReportDocument:
      type: object
      description: >-
        A report as composed: structure and words, with every figure named by a handle.
      required: [blocks]
      properties:
        blocks:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ReportBlock'}
      additionalProperties: false
    ReportBlock:
      type: object
      description: One element of a report. What fields are legal is decided by `kind`.
      required: [kind]
      properties:
        kind:
          type: string
          enum:
            - title
            - subtitle
            - scope
            - generated_at
            - summary
            - methodology
            - follow_ups
            - stat_strip
            - bar
            - waterfall
            - ranked_list
            - record_table
            - callout
            - evidence_drawer
          description: >-
            The closed set a renderer knows how to draw. An unknown kind is refused rather than dropped: a report missing a block it was composed with says something different from the one composed.
        text:
          type: string
          description: The composer's own words. Prose, never a figure.
        cells:
          type: array
          items: {$ref: '#/components/schemas/ReportCell'}
          description: >-
            The figures this block shows, in render order. Required for a block whose purpose is to display a number; refused on one that renders none, where the figure would be silently unshown.
        severity:
          type: string
          enum: [note, warning, partial, unknown, unsupported]
          description: >-
            Types a callout, and is meaningless elsewhere. A callout says what the numbers cannot — a partial figure, an unanswerable question, an unsupported grouping — and an untyped one renders as prose, which is how a measured absence becomes indistinguishable from one nobody looked for.
        value:
          type: number
          format: double
          description: >-
            ALWAYS REFUSED, and the field exists so the refusal can name what it found. A composer that puts a number here is asking the renderer to draw a figure the database never computed. Carrying one beside a valid handle is refused too, and that case is worse: the literal is what renders, the two can disagree, and nothing downstream can tell.
      additionalProperties: false
    ReportCell:
      type: object
      description: Exactly one live saved-run cell, live catalog metric reference, or frozen edition metric reference.
      oneOf:
        - required: [run_id, column]
        - required: [metric_ref]
        - required: [edition_ref]
      properties:
        metric_ref: {$ref: '#/components/schemas/ReportMetricReference'}
        edition_ref: {$ref: '#/components/schemas/ReportEditionReference'}
        run_id:
          type: string
          format: uuid
          description: The saved run. Resolved under the reading caller's own authority.
        group:
          type: array
          items: {}
          description: >-
            The cell's group key values, one per grouping in the saved question. Omitted for an ungrouped run, which has one cell.
        column:
          type: string
          description: >-
            Which measure of the cell to show. A cell can carry several and a block shows one, so which is not a detail a renderer may pick.
      additionalProperties: false
    ReportMetricReference:
      type: object
      additionalProperties: false
      required: [selection, metric]
      properties:
        selection: {$ref: '#/components/schemas/ReportingSelection'}
        metric: {$ref: '#/components/schemas/ReportingMetricID'}
    ReportEditionReference:
      type: object
      additionalProperties: false
      required: [edition_id, metric]
      properties:
        edition_id: {type: string, format: uuid}
        metric: {$ref: '#/components/schemas/ReportingMetricID'}
    RenderedReport:
      type: object
      description: The composed document with every figure resolved for this reader.
      required: [blocks]
      properties:
        blocks:
          type: array
          items: {$ref: '#/components/schemas/RenderedBlock'}
      additionalProperties: false
    RenderedBlock:
      type: object
      required: [kind, values]
      properties:
        kind: {type: string}
        text: {type: string}
        severity: {type: string}
        values:
          type: array
          items: {$ref: '#/components/schemas/RenderedValue'}
          description: One entry per cell the block named, in the same order.
      additionalProperties: false
    RenderedValue:
      type: object
      required: [withheld]
      properties:
        coverage: {$ref: '#/components/schemas/ReportingCoverage'}
        context: {$ref: '#/components/schemas/ReportingContext'}
        unit: {type: string}
        definition_version: {type: string}
        value:
          nullable: true
          description: >-
            The figure the database computed, or null when it was withheld. A null with `withheld` false means the cell resolved to no value at all, which is a different fact from one kept back.
        withheld:
          type: boolean
          description: >-
            The privacy floor kept this figure back for this reader. The block still renders — a figure that vanished would leave the report reading as complete while saying less.
      additionalProperties: false
    CustomField:
      type: object
      description: |-
        A workspace-defined runtime field on an existing core object. `column_name` is the physical `cf_`-prefixed
        identifier, stable across rename; `status=retired` hides the field from the API
        and filtering while the column and its values are preserved. Deliberately carries no
        `source`/`captured_by` — the catalog row itself has no such columns; provenance
        on create lives in the audit row.
      required: [id, object, label, slug, type, status, column_name, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        object:
          type: string
          enum: [contact, company, deal, lead, project, contract]
          description: The existing core object this field is added to.
        label: {type: string, description: Display label; the only thing a rename updates.}
        slug: {type: string, description: Admin-facing key the column_name derives from.}
        type:
          type: string
          enum: [text, number, date, currency, picklist, multiselect, boolean]
          description: The supported field types. Multiselect values are JSON string arrays; empty arrays clear the selection. Immutable once created.
        status:
          type: string
          enum: [active, retired]
          description: 'retired = soft: hidden from the API and filtering, column and values preserved.'
        column_name:
          type: string
          readOnly: true
          description: >-
            Server-derived, `cf_`-prefixed, slug-derived physical column identifier: never client-supplied, immutable once live, stable across rename.
        currency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
          description: ISO-4217 currency code; present when `type=currency`, null otherwise.
        options:
          type: [array, 'null']
          items: {type: string}
          description: Allowed picklist values; present (non-empty) when `type=picklist`, null otherwise.
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at:
          type: [string, 'null']
          format: date-time
          description: >-
            Base envelope field; stays null even when `status=retired`, because retiring is a status flip rather than an archive.
        version: {$ref: '#/components/schemas/RowVersion'}
    CustomFieldLiveLists:
      type: object
      description: >-
        The Live Lists whose filter names a custom field: the ones the caller may find by name, and how many more exist that they may not find.
      required: [lists, unseen_count]
      properties:
        lists:
          type: array
          items: {$ref: '#/components/schemas/CustomFieldLiveList'}
        unseen_count:
          type: integer
          description: Live Lists that name the field but that this caller may not find.
    CustomFieldLiveList:
      type: object
      required: [id, name, sharing]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        sharing: {type: string, enum: [private, team, workspace]}
    CustomFieldListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/CustomField'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    CreateCustomFieldRequest:
      type: object
      description: |-
        always (a schema change is never) — see `createCustomField`. `currency` is
        required when `type=currency` (pattern `^[A-Z]{3}$`); `options` is required
        non-empty when `type=picklist`. Neither conditional
        requirement is expressed as an OpenAPI 3.1 `oneOf`/`if`-`then` here — a prose note
        plus a 422 on mismatch is sufficient, matching how Offer/Product money fields are
        documented elsewhere in this contract.
      required: [object, label, type, source]
      properties:
        object:
          type: string
          enum: [contact, company, deal, lead, project, contract]
        label: {type: string}
        type:
          type: string
          enum: [text, number, date, currency, picklist, multiselect, boolean]
        currency: {type: [string, 'null'], pattern: '^[A-Z]{3}$'}
        options: {type: [array, 'null'], items: {type: string}}
        source: {type: string}
    RenameCustomFieldRequest:
      type: object
      description: >-
        Merge-PATCH; `label` only — `column_name`, `object`, and `type` are absent from this request schema entirely (immutable, not just ignored if sent).
      properties:
        label: {type: string}
    UpdateCustomFieldOptionsRequest:
      type: object
      description: >-
        Replaces the picklist's full allowed-option set (ordered); at least one option is required — an empty array is rejected (422).
      required: [options]
      properties:
        options:
          type: array
          items: {type: string}
          minItems: 1
    ReportScope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [owner, team, workspace]}
        id: {type: string, format: uuid}
    RunReportRequest:
      type: object
      description: |-
        A typed, validated query plan (not free-form SQL). For prebuilt reports, filters
        parameterize the plan; for ad-hoc, the object/group_by/aggregates compile to a plan.
        **Field vocabulary:** every key in `filters`, every entry in `group_by`, and every
        `aggregates[].field` MUST be a field in the target report's declared vocabulary.
        An out-of-vocabulary field returns `422 code: report_field_not_allowed`. `additionalProperties`
        is open only to admit *values*, never to admit arbitrary SQL identifiers.
        **`/reports/{report}` path param:** a prebuilt-report key (README "Prebuilt
        reports"). Saved reports are not served; a UUID here is refused.
      properties:
        scope: {$ref: '#/components/schemas/ReportScope'}
        filters:
          type: object
          additionalProperties: true
          description: Typed predicates (period, status, owner, ...) — keys must be in the report vocabulary.
        group_by:
          type: array
          items: {type: string}
        aggregates:
          type: array
          items:
            type: object
            required: [fn]
            properties:
              fn:
                type: string
                enum: [count, sum, avg, min, max, median, p75]
                description: >-
                  `median` and `p75` answer NULL below a five-value sample floor rather than a number. A median over three deals is one deal's value wearing a statistic's name, and a reader comparing groups of different sizes would take the smallest group's outlier for its norm. The row still arrives with its count, so a blank beside n=3 has told the reader something true.
              field: {type: [string, 'null']}
              as: {type: [string, 'null']}
    ReportResult:
      type: object
      required: [report, plan, columns, rows, as_of, timezone, base_currency, fiscal_year_start_month]
      properties:
        report: {type: string}
        as_of:
          type: string
          format: date-time
          description: >-
            The instant this result was computed. A report is a reading taken at a time, and without it two screens showing different numbers look like a bug rather than two moments.
        timezone:
          type: string
          description: >-
            The installation's reporting zone, as an IANA name. Day and period boundaries in this result are cut in it, never in UTC and never in the reader's own zone.
        base_currency:
          type: string
          description: >-
            The installation's configured base currency, as an ISO-4217 code.
        fiscal_year_start_month:
          type: integer
          minimum: 1
          maximum: 12
          description: >-
            The month the installation's financial year opens, so a quarter in this result can be placed without assuming it starts in January.
        plan:
          type: object
          additionalProperties: true
          description: The validated query plan that was executed (shown before/after run).
        columns:
          type: array
          items: {type: string}
        rows:
          type: array
          items: {type: object, additionalProperties: true}
          description: Aggregate rows; each carries its own `derivation_url` handle for the exact cell (group keys bound to the row's values).
        total_rows:
          type: integer
          description: >-
            Groups that matched. `rows` is capped at the report row limit, so a total above its length means this answer is the top of a longer one rather than all of it. The drill-through's `total_rows` counts source rows for the same reason.
        excluded_by_permission: {type: [integer, 'null'], description: 'Visible rows a field mask withheld from this run — excluded from every aggregate and from the drill-through alike, so the numbers stay reconcilable. Null when no mask applied; 0 means masked but nothing excluded.'}
        population_narrowed: {$ref: '#/components/schemas/PopulationNarrowed'}
        generated_at: {type: string, format: date-time}
        derivation_url:
          type: [string, 'null']
          description: Handle for "Explain This Number" drill-through to source rows (`GET /reports/{report}/derivation`); the result-level handle explains the whole filtered set, each row's handle the single cell.
    ReportDerivation:
      type: object
      description: |-
        The "Explain This Number" resolution: a plain-language definition of
        the exact filter+group+aggregate plus the underlying source rows, which reconcile
        exactly to the explained aggregate (AC-X1).
      required: [report, definition, plan, columns, rows]
      properties:
        report: {type: string}
        definition:
          type: string
          description: Plain-language reading of the exact filter + group + aggregate that produced the number.
        plan:
          type: object
          additionalProperties: true
          description: The validated predicate/group/aggregate set that was resolved.
        columns:
          type: array
          items: {type: string}
        rows:
          type: array
          items: {type: object, additionalProperties: true}
          description: The underlying source rows (drill-through), row-scoped exactly like the report.
        aggregates:
          type: object
          additionalProperties: true
          description: The requested aggregates recomputed over exactly these source rows — equals the explained cell.
        total_rows: {type: integer, description: Source rows matched (rows is capped at the report row limit).}
        excluded_by_permission: {type: [integer, 'null'], description: 'Visible rows a field mask withheld — the same exclusion the explained report applied, so the drill-through reconciles exactly.'}
        population_narrowed: {$ref: '#/components/schemas/PopulationNarrowed'}
        generated_at: {type: string, format: date-time}
        as_of:
          type: string
          format: date-time
          description: |-
            The instant these figures were computed at — the moment any currency conversion read the
            rate sheet, not the moment this response was assembled (`generated_at`).
        as_of_pinned:
          type: boolean
          description: |-
            Whether the handle carried the instant the explained number was computed at.
    SearchResult:
      type: object
      required: [type, id]
      properties:
        type: {type: string, enum: [contact, company, deal, activity, lead, project, product, offer_template, tag]}
        id: {type: string, format: uuid}
        title: {type: [string, 'null'], description: Display label (name/subject).}
        snippet: {type: [string, 'null']}
        score: {type: [number, 'null'], description: Relevance score.}
        carried_by:
          type: [integer, 'null']
          description: >-
            For a `tag` hit only: how many contacts, companies, deals and leads carry this word, as THIS caller may see them — the same types the tag page counts and the filters offer, not every type `taggable` admits. It is what tells a searcher whether the word is worth opening before they open it. Null on every other hit type, and null when no count was taken.
        works_at:
          allOf: [{$ref: '#/components/schemas/SearchHitEmployer'}]
          readOnly: true
          nullable: true
          description: >-
            On a `contact` hit found through `with_employees`: the company it currently works at that the query matched, which is why the hit is here — the contact's own text did not match. When the contact works at several matching companies, the best-matching one. Null on every other hit, a contact the query matched by its own text included.
        logo_url:
          type: [string, 'null']
          readOnly: true
          description: >-
            For a `company` hit only: the company's logo, the same URL its record carries as `Company.logo_url`. Absent when it has none, and on every other hit type.
        is_partner:
          type: [boolean, 'null']
          description: >-
            For a `company` hit only: whether the account carries a LIVE partner programme. True when a partner record exists and has not been retired, false when it was checked and carries none. Null on every other hit type, and null when the marker was not taken — a caller who may not read partner programmes gets null rather than false, because null means UNKNOWN while false would tell them this account is not a partner. A client renders the partner marker, with a route to the company's partner record, on `true` alone.
        email_summary:
          allOf: [{$ref: '#/components/schemas/EmailSummary'}]
          readOnly: true
          nullable: true
          description: >-
            The canonical email row, on an `activity` hit whose activity is an email THIS caller may read. Null on every other hit type, and null for a non-email activity — a call, a note, a task and a meeting are activities too, and each keeps its generic hit. An email whose content is not this caller's produces no hit at all, because the activity branch is content-gated. A client renders the canonical row when this is present and falls back to `title`/`snippet` when it is not.
        trust_tier:
          type: [string, 'null']
          enum: [authoritative, external, unverified, null]
          description: >-
            Provenance tier of the underlying record. EVERY hit this server returns carries `authoritative`, with no exception: search reads the store the record lives in, so a hit is never a copy of somebody else's. `external` and `unverified` are declared for connector-sourced rows and nothing emits either yet, and `null` means UNKNOWN rather than authoritative — this field is never guessed. A client must accept all four and must not expect any but the first.
    SearchHitEmployer:
      type: object
      description: >-
        A company a contact currently works at, by any current employment — the same reading as the company's own roster, not only the contact's primary employer.
      required: [company_id, company_name]
      properties:
        company_id: {type: string, format: uuid}
        company_name: {type: string}
    SearchResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/SearchResult'}}
        page: {$ref: '#/components/schemas/PageInfo'}
        types_with_more:
          type: array
          items: {type: string, enum: [contact, company, deal, activity, lead, project, product, offer_template, tag]}
          description: >-
            On a `per_type` answer only: the types that matched more hits than the page carries for them. Absent on a ranked answer, whose `page.has_more` says the same thing for the list as a whole.
    ColdStartField:
      type: object
      description: |-
        One read-back field. EVERY field carries a non-empty `evidence_snippet` + `confidence`, or it is
        omitted (the no-guess gate). `source_kind` says where the evidence lives; `source_url` is present
        ONLY for `source_kind=url` (nullable otherwise — text/self-description evidence has no URL).
      required: [field, value, evidence_snippet, source_kind, confidence]
      properties:
        field: {type: string, enum: [display_name, offer_summary, icp, value_proposition, usp, customer_pains, desired_outcomes, buying_center, buying_intents, common_objections, sales_motion, legal_name, registered_address, register_vat, industry, history, legal_form, register_court, register_number]}
        value: {type: string}
        evidence_snippet: {type: string, minLength: 1, description: 'Verbatim source text (from the page, the pasted text, or the user''s own words) — non-empty or the field is absent.'}
        source_kind: {type: string, enum: [url, text, self_description], description: 'Where evidence_snippet came from. For self_description the "evidence" is the user''s own statement — a self-declared ICP is grounded in that statement, not fabricated.'}
        source_url: {type: [string, 'null'], format: uri, description: 'Present only when source_kind=url; null for text/self_description.'}
        evidence_offset: {type: [integer, 'null'], description: 'Optional char offset of evidence_snippet within the pasted text (source_kind=text), for highlight-back; null for url/self_description.'}
        confidence: {type: number, minimum: 0, maximum: 1}
    CompanyProfileField:
      type: object
      required: [field, value, source, captured_by, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >-
            The stored row, so a dossier sentence written from this field can cite something the reader can open. Without it a field-derived claim could only cite the company, which tells the reader where to look but not at what — and the grounding filter drops a sentence whose citation it cannot resolve.
        retrieved_at:
          type: [string, 'null']
          format: date-time
          description: When the source was last read. Distinct from captured_at, which is when we first recorded the claim.
        verified_at:
          type: [string, 'null']
          format: date-time
          description: When a human last confirmed this claim. Paired with verified_by — a verification without an actor describes a confirmation nobody made.
        verified_by:
          type: [string, 'null']
          readOnly: true
          description: The human who confirmed the claim. Server-stamped, never accepted from a request body.
        field: {type: string, enum: [display_name, offer_summary, icp, value_proposition, usp, customer_pains, desired_outcomes, buying_center, buying_intents, common_objections, sales_motion, legal_name, registered_address, register_vat, industry, history, legal_form, register_court, register_number]}
        value: {type: string}
        source: {type: string, enum: [human, agent, site_read, connector, migration, technical_lookup]}
        captured_by: {type: string, readOnly: true}
        evidence_snippet: {type: [string, 'null']}
        source_url: {type: [string, 'null'], format: uri}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        updated_at: {type: string, format: date-time}
        version:
          type: integer
          format: int64
          readOnly: true
          description: >-
            The row's version, for the `If-Match` a correction sends. The write path has always honoured the precondition; without the version on the read, no client could supply one, and two contacts correcting the same claim overwrote each other with no conflict and no trace.
    CompanyFact:
      type: object
      required: [id, category, field, value, value_key, source, captured_by, updated_at]
      properties:
        retrieved_at:
          type: [string, 'null']
          format: date-time
          description: When the source was last read. Distinct from captured_at, which is when we first recorded the claim.
        verified_at:
          type: [string, 'null']
          format: date-time
          description: When a human last confirmed this claim. Paired with verified_by — a verification without an actor describes a confirmation nobody made.
        verified_by:
          type: [string, 'null']
          readOnly: true
          description: The human who confirmed the claim. Server-stamped, never accepted from a request body.
        id:
          type: string
          format: uuid
          readOnly: true
          description: >-
            The stored row, so a brief sentence written from this fact can cite something the reader can open. Without it a fact-derived claim had to cite the company, which told the reader where to look but not at what.
        category: {type: string, enum: [company, offering, market, signal]}
        field: {type: string, enum: [founded_year, employee_range, phone, contact_email, location, service, product, capability, served_industry, company_size, geography, language, certification, partner, named_customer, technology, quantified_outcome, mail_provider, email_security, hosting_provider, operated_service]}
        value: {type: string}
        value_key: {type: string}
        source: {type: string, enum: [human, agent, site_read, connector, migration, technical_lookup]}
        captured_by: {type: string, readOnly: true}
        evidence_snippet: {type: [string, 'null']}
        source_url: {type: [string, 'null'], format: uri}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        suspect_reason:
          type: [string, 'null']
          enum: [null, phone_shaped_location, not_a_phone, not_a_year, not_an_email, not_a_size]
          readOnly: true
          description: >-
            Why this fact's VALUE contradicts its FIELD, or null when it does not. The extractor picks the field from a closed per-page menu and the category follows the field, so a phone number on a contact page can land as `location` and a register number as `employee_range` — the row is well-formed and still wrong. Computed at read from the value's shape; it never gates the fact, because a heuristic that hid data would be worse than one that flags it.
        updated_at: {type: string, format: date-time}
        version:
          type: integer
          format: int64
          readOnly: true
          description: >-
            The row's version, for the `If-Match` a correction or a removal sends. The write path has always honoured the precondition; without the version on the read no client could send one, so two readers editing the same fact silently overwrote each other. Spelled inline rather than as a $ref to RowVersion: a $ref with sibling keys drops them under OpenAPI 3.0, and the generator then emitted no property at all — the field was in the contract and absent from every client that reads it.
    CompanyFactListResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/CompanyFact'}}
    CompanyProfileFieldListResponse:
      type: object
      description: A company's confirmed profile fields. Items reuse CompanyProfileField — the table's field/source vocabulary is identical.
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/CompanyProfileField'}}
    EnrichCompanyRequest:
      type: object
      description: Optional override. With no body the company's own domain is read.
      properties:
        url: {type: string, format: uri, description: Company URL to read instead of the company's domain.}
    TranscriptReadReport:
      type: object
      description: >-
        What one reading of one transcript did. The three outcomes are kept apart on purpose: still reading, read it and it stated nothing, and could not read it are different answers, and collapsing the last two makes a correct empty result look like a broken feature.
      required: [read_id, activity_id, status, line_count, proposal_ids, created_at]
      properties:
        read_id: {type: string, format: uuid}
        activity_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, done, failed]}
        status_detail:
          type: [string, 'null']
          description: >-
            Why it ended as it did, in words a rep can act on. Set on failure, and on a done reading that produced nothing so an empty result explains itself.
        line_count:
          type: integer
          description: >-
            How many lines the reading addressed, so a cited line can be shown against the size of what was read. It is the count at READ time; a later body edit re-normalizes and can change it, and each proposal's own evidence stays authoritative about what it saw.
        proposal_ids:
          type: array
          description: The approvals this reading staged. Empty on a reading that found nothing to propose.
          items: {type: string, format: uuid}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    SiteReadStarted:
      type: object
      description: The 202 handle for a queued deep read.
      required: [read_id, status]
      properties:
        read_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, deferred, running], description: 'The joined dossier state when a read is already in flight.'}
    TechnicalEnrichStarted:
      type: object
      description: The 202 handle for a queued technical lookup.
      required: [company_id, status]
      properties:
        company_id: {type: string, format: uuid}
        status:
          type: string
          enum: [queued]
          description: |-
            The lookup this call asked for is on its way. One value, because that is all
            the caller can be told honestly: River deduplicates by arguments, so pressing
            the button while a lookup is already in flight JOINS it — and the insert does
            not report which of the two happened. A `running` this endpoint could not tell
            apart from `queued` would be a promise the handler cannot keep.
    CompanyVatCheck:
      type: object
      description: |-
        One company's current VAT standing, and the evidence for it. The row keeps only the
        CURRENT consultation; what a re-check overwrote lives in the audit trail.
      required: [company_id, vat_number, status, checked_at, recorded_at]
      properties:
        company_id: {type: string, format: uuid}
        vat_number:
          type: string
          description: |-
            The number AS CONSULTED, which is not necessarily the number on the profile today.
            A receipt names the number it was issued for, so an edit made afterwards must not
            silently inherit this proof.
        status:
          type: string
          enum: [valid, invalid, unavailable]
          description: |-
            `valid` and `invalid` are answers ABOUT the number, and `invalid` covers both a
            number the register rejected and one that was never asked about because it is not
            VAT-ID shaped: no request is made for a value that cannot be a VAT ID, and a reader
            fixes their own field either way.
        consultation_number:
          type: [string, 'null']
          description: |-
            The register's receipt. Issued only for a check made under this installation's own
            VAT ID, so it is absent when none is configured — the check still ran, it just
            carries no proof a tax authority would accept.
        registered_name:
          type: [string, 'null']
          description: Who the register says the number belongs to. Absent when it named nobody.
        registered_address:
          type: [string, 'null']
          description: The address the register holds, when it returned one.
        checked_at:
          type: string
          format: date-time
          description: |-
            The day the REGISTER reported, not the day this installation recorded it. A receipt
            attests to when the register was asked.
        recorded_at:
          type: string
          format: date-time
          readOnly: true
          description: |-
            When this installation WROTE the consultation, on its own clock. Distinct from
            `checked_at` on purpose, and the distinction is load-bearing: VIES answers with a
            date and no time, so two consultations on one day carry the same `checked_at`. A
            client waiting for a re-check to land would wait forever on that field, and the
            server's own rate floor reads this one for the same reason.
    TechnicalEnrichStatus:
      type: object
      description: |-
        What each public source last did for one account. Per lane rather than per run: the
        three fail independently, so one verdict would hide which of them is stale.
      required: [company_id, lanes]
      properties:
        company_id: {type: string, format: uuid}
        lanes:
          type: array
          items: {$ref: '#/components/schemas/TechnicalEnrichLane'}
    TechnicalEnrichLane:
      type: object
      description: What one public source last did.
      required: [lane, attempts]
      properties:
        lane:
          type: string
          enum: [dns, certlog, homepage]
          description: 'The public source: DNS records, certificate-transparency logs, or the company''s own homepage.'
        outcome:
          type: [string, 'null']
          enum: [null, applied, empty, failed, refused]
          description: |-
            What the last attempt did. `empty` is an authoritative nothing — the source answered
            and the company publishes none of what this lane reads — while `failed` is a lookup
            that did not complete, which changes nothing on the record. `refused` is the site's
            robots.txt declining the homepage read.
        attempts: {type: integer, description: 'How many times this lane has been tried since it last succeeded.'}
        last_success_at:
          type: [string, 'null']
          format: date-time
          description: 'When this source last answered. The observed-at behind every fact the lane owns.'
        next_attempt_at:
          type: [string, 'null']
          format: date-time
          description: 'When the scheduled pass will ask again, backed off after a failure.'
    SiteReadPage:
      type: object
      description: One page the crawl fetched.
      required: [url, kind]
      properties:
        url: {type: string, format: uri}
        kind: {type: string, enum: [home, impressum, about, team, services, products, contact, other]}
    SiteReadSkip:
      type: object
      description: One page the crawl deliberately did NOT read — honest degradation is reportable.
      required: [url, reason]
      properties:
        url: {type: string, format: uri}
        reason:
          type: string
          enum: [robots, off_domain, page_cap, byte_cap, unreadable]
    SiteReadReport:
      type: object
      description: |-
        One deep read's full account: what was read, what was skipped and why, whether the crawl ended
        early (`partial` + `stopped_reason`), and the proposals the findings staged. The report is
        the transparency surface — a crawl that silently dropped pages would read as "covered
        everything" when it did not.
      required: [read_id, company_id, seed_url, status, status_code, status_detail, next_attempt_at, pages, skipped, proposal_ids, created_at]
      properties:
        read_id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        seed_url: {type: string, format: uri}
        status: {type: string, enum: [queued, deferred, running, done, partial, failed, cancelled]}
        status_code: {type: [string, 'null'], enum: [null, budget_deferred]}
        status_detail: {type: [string, 'null'], description: 'Safe guidance only; never provider payload, prompt, SQL, or stack data.'}
        next_attempt_at: {type: [string, 'null'], format: date-time}
        pages:
          type: array
          items: {$ref: '#/components/schemas/SiteReadPage'}
        skipped:
          type: array
          items: {$ref: '#/components/schemas/SiteReadSkip'}
        stopped_reason:
          type: [string, 'null']
          enum: [budget, page_cap, byte_cap, deadline, null]
          description: 'Why the crawl ended early; null when it exhausted discovery.'
        fact_count: {type: integer, description: Evidenced fields staged in the deepread proposal.}
        phase: {type: [string, 'null'], enum: [crawling, extracting, null], description: 'Live position while status is running; null once terminal.'}
        pages_read: {type: integer, description: 'Pages committed so far — live progress while running, final count once terminal.'}
        proposal_ids:
          type: array
          items: {type: string, format: uuid}
          description: 'The staged approvals this read produced (the deepread bundle first, then one per site_lead).'
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    EnrichmentProposal:
      type: object
      description: A staged enrichment of one company. Field shape is the read-back's (evidence-or-omit); NOTHING is written until accepted via /approvals, which fills only the company's empty fields.
      required: [proposal_id, company_id, source_url, status, fields]
      properties:
        proposal_id: {type: string, format: uuid}
        company_id: {type: string, format: uuid, description: The company this proposal enriches — the accept executor writes only here.}
        source_url: {type: string, format: uri}
        status: {type: string, enum: [staged], description: Always staged — accept via the approval inbox.}
        fields:
          type: array
          items: {$ref: '#/components/schemas/ColdStartField'}
        created_at: {type: string, format: date-time}
    ApprovalEvidence:
      type: object
      description: >-
        One claim's backing material, so confirming a proposal is a check rather than a vote of confidence in the model. Per claim, not per approval: a proposal asserting three things carries three of these.
      required: [evidence_snippet]
      properties:
        evidence_snippet: {type: string, description: 'The fragment as it reads in the source, quoted rather than paraphrased.'}
        source_type: {type: [string, 'null'], enum: [activity, deal, signal, relationship, page, contract, null]}
        source_id: {type: [string, 'null'], format: uuid}
        source_lines:
          type: array
          description: >-
            1-based line numbers within the source record's body that this claim was read from, for a source whose body is line-addressed (a meeting transcript today,: line N is the Nth newline-split segment of activity.body). Absent for a source that is not line-addressed.
          items: {type: integer, minimum: 1}
    Approval:
      type: object
      description: A staged confirm-first action awaiting human decision.
      required: [id, kind, status, proposed_by, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, description: 'Examples: coldstart | send_email | advance_deal | promote_lead | overnight | deal_follow_up | commitment_task.'}
        status: {type: string, enum: [pending, approved, rejected, expired]}
        proposal_id: {type: [string, 'null'], format: uuid, description: 'For kind=coldstart, the ColdStartProposal this approval accepts (links the staged proposal to its approval item).'}
        proposed_by: {type: string, description: 'agent:<id> / connector:<n> that staged this.'}
        on_behalf_of: {type: [string, 'null'], format: uuid}
        expires_at: {type: [string, 'null'], format: date-time, description: 'When the staged action expires unactioned (mirrors approval.requested.expires_at). After this it auto-transitions to status=expired and cannot be approved.'}
        bundle_id:
          type: [string, 'null']
          format: uuid
          description: |-
            The act that staged this proposal together with its siblings: today, a website read's company facts and the leads it published. Null for a proposal staged on its own. It is a grouping id, not a foreign key: there is no
            bundle entity, and every member keeps its own diff hash, version pin, expiry and
            verdict. Decide the whole set with
            `POST /approval-bundles/{bundle_id}/approve|reject`, or any member on its own.
        target_entity_type: {type: [string, 'null'], description: Entity the effect mutates (for precondition re-validation).}
        target_entity_id: {type: [string, 'null'], format: uuid}
        target_label:
          type: [string, 'null']
          description: >-
            What the target record was CALLED when this proposal was staged, where its type has a name at all. Resolved at staging time and frozen: the record may be renamed, archived or merged before anyone opens the inbox, and a caption re-resolved then would name something the approver was never shown. Absent means the type carries no name, or the row had already gone — a card then says nothing rather than "unknown".
        target_version: {type: [integer, 'null'], description: 'The `version` of the target row when the diff was staged. On approve-execute the server RE-READS the row; if its current version ≠ target_version the execution is rejected with 409 ErrVersionSkew (the world changed since the human last saw the diff — re-stage). This closes the stage→approval race.'}
        diff_hash: {type: [string, 'null'], description: 'Hash of the staged proposed_change; the minted approval_token is bound to this hash so a token cannot authorize a different effect.'}
        summary: {type: [string, 'null'], description: One-line description of the proposed change.}
        proposed_change:
          type: object
          additionalProperties: true
          description: The staged diff/payload that will execute on approve.
        evidence:
          type: array
          description: Per-claim evidence (snippet + source id) backing the proposal.
          items: {$ref: '#/components/schemas/ApprovalEvidence'}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        result_entity_type: {type: [string, 'null']}
        result_entity_id: {type: [string, 'null'], format: uuid}
        approval_token: {type: [string, 'null'], description: 'Signed single-use token minted on approve (schema ApprovalToken, serialized as compact JWS); authorizes exactly the downstream operation it is bound to.'}
        decided_by: {type: [string, 'null'], format: uuid}
        decided_at: {type: [string, 'null'], format: date-time}
        effect_failed_at:
          type: [string, 'null']
          format: date-time
          description: |-
            When the work an APPROVED decision released failed to run. Absent on every
            row whose effect ran — an approved row carrying this is a decision a contact
            made whose promised work never happened.
        effect_failure:
          type: [string, 'null']
          description: |-
            The sentence a reader is shown about that failure, written for them and never copied from the executor's error. Present exactly when `effect_failed_at` is.
        created_at: {type: string, format: date-time}
    ApproveRequest:
      type: object
      description: |-
        Approve a staged action. **Who may approve:** the principal must hold the RBAC required
        to perform the action on the target (≥ the on_behalf_of human's authority for that effect);
        a lower-privilege user cannot approve an action they could not themselves perform. **Edit
        path:** if `edited_payload` is supplied, the edited effect RE-ENTERS the admission gate from
        scratch (re-tiered, re-RBAC-checked, new diff_hash) before a token is minted — an edit can
        never escalate a staged note into an external send without re-gating.
      properties:
        edited_payload:
          type: object
          additionalProperties: true
          description: Optional edits — the edited payload is re-admitted, then it executes (edit-then-send).
    ApprovalListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Approval'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    ApprovalBundleDecisionRequest:
      type: object
      additionalProperties: false
      description: |-
        Decide every still-pending member of one bundle. There is no `edited_payload` arm: an edit
        is a judgment about ONE proposed change, and there is no such thing as one edit spanning several. Edit a member
        through `POST /approvals/{id}/approve`, then decide the rest here.
      properties:
        reason:
          type: string
          description: Recorded on every member this call decides — one stated reason for one decision.
    ApprovalBundleDecision:
      type: object
      description: |-
        The per-member result of a bundle decision. Deciding a bundle is not all-or-nothing: the
        members were always independent authorities, so one that expired, one someone else already
        decided, and one whose follow-on effect failed each report for themselves while their
        siblings decide normally.
      required: [bundle_id, data]
      properties:
        bundle_id: {type: string, format: uuid}
        data:
          type: array
          description: |-
            Every member of the bundle this caller could decide, in the state it is in AFTER the
            decision. Members outside their authority are absent — the same existence-hiding the
            inbox and a single approval read give — so this list may be shorter than the bundle.
          items: {$ref: '#/components/schemas/ApprovalBundleMember'}
    ApprovalBundleMember:
      type: object
      description: One member of a bundle, and what the bundle decision did to it.
      required: [approval, outcome]
      properties:
        approval: {$ref: '#/components/schemas/Approval'}
        outcome:
          type: string
          enum: [decided, already_decided, expired, effect_failed, refused]
          description: |-
            What THIS call did to the member. `decided` — the verdict was recorded now.
            `already_decided` — it carried a verdict before this call, which is left standing
            (the status says which). `expired` — it lapsed undecided and is no longer
            approvable; re-propose instead. `effect_failed` — the verdict IS recorded and
            audited, but the follow-on change did not land; the member reads approved and
            unredeemed, and the server log carries the cause. `refused` — its kind refused
            approving it before anything was decided (the same check a single approval runs),
            so it is still pending and can be declined or decided later.
    RowVersion:
      type: integer
      format: int64
      readOnly: true
      minimum: 1
      description: |-
        Monotonic row version, incremented by the server on every mutation.
        Echoed back as the `version` field on every mutable entity. To make a write conditional,
        send the last-seen value in `If-Match`; a mismatch returns `409 code: version_skew`
        (ErrVersionSkew) so the client re-reads before retrying.
    Partner:
      type: object
      description: |-
        First-class partner state as a 1:1 extension of a company. Company identity is never duplicated.
        Behavior is Fast-follow, but the V1 schema is
        forward-compatible.
      required: [company_id, cert_status, created_at, updated_at]
      properties:
        company_id: {type: string, format: uuid, description: The company this partner record extends (PK = FK).}
        masked_fields:
          type: array
          readOnly: true
          items: {type: string}
          description: >-
            The fields of THIS row the caller's role withholds (a field mask — e.g. `margin_tier` for a seat that reads partners but not their commercial terms). A named field is null because it is withheld, not because it is empty; absent or empty means nothing is withheld.
        partner_role: {type: string, enum: [hosting, consulting, strategic], description: Functional role; implementation + dev are Margince's turf.}
        cert_status: {type: string, enum: [applied, certified, suspended]}
        margin_tier: {type: [string, 'null'], enum: [null, tier1_15, tier2_20, tier3_25], description: The partner's margin tier; the allowed values are in the table's CHECK constraint.}
        gate_metrics: {type: [object, 'null'], additionalProperties: true, description: 'Program gate metrics (certified seats, CSAT, ...).'}
        relationship_stage: {type: string, enum: [research, identified, contacted, in_conversation, fit_confirmed, agreement_pending, active, active_referring, dormant, no_fit], default: research}
        partner_fit_score: {type: [integer, 'null'], minimum: 0, maximum: 100, description: 'Current partner-fit score; if partner_fit_override_reason is non-null this is the Commercial Judgement value.'}
        partner_fit_score_computed: {type: [integer, 'null'], minimum: 0, maximum: 100, readOnly: true, description: 'Retained machine-computed partner-fit value while a Commercial Judgement override is in force.'}
        partner_fit_override_reason: {type: [string, 'null'], readOnly: true, description: 'Non-null ⇒ partner_fit_score is a human Commercial Judgement override and recompute is suppressed until cleared.'}
        relationship_health: {type: [string, 'null'], description: 'Decimal-as-string 0..1 computed by the partner relationship-health formula; basis for 30/60/90 partner dormancy flags.'}
        last_contact_at: {type: [string, 'null'], format: date-time}
        next_step: {type: [string, 'null']}
        next_step_due_at: {type: [string, 'null'], format: date}
        served_segments: {type: [array, 'null'], items: {type: string}}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    ConsentPurpose:
      type: object
      required: [id, key, label, created_at]
      properties:
        id: {type: string, format: uuid}
        key: {type: string, description: 'Stable machine key (e.g. transactional, marketing_email, profiling).'}
        label: {type: string}
        requires_double_opt_in: {type: boolean, default: false, description: 'When true, a grant is only effective after a confirmed DOI event (German email norm).'}
        created_at: {type: string, format: date-time}
    ContactConsentState:
      type: object
      description: A contact's current consent for one purpose.
      required: [purpose_id, state]
      properties:
        purpose_id: {type: string, format: uuid}
        purpose_key: {type: [string, 'null']}
        state: {type: string, enum: [unknown, granted, withdrawn]}
        lawful_basis: {type: [string, 'null']}
        double_opt_in_confirmed_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    ConsentEvent:
      type: object
      description: An append-only proof row (Art. 7 demonstrability). Never updated or deleted.
      required: [id, purpose_id, new_state, occurred_at]
      properties:
        id: {type: string, format: uuid}
        purpose_id: {type: string, format: uuid}
        new_state: {type: string, enum: [granted, withdrawn], description: Proof rows record only transitions to granted/withdrawn (never to unknown).}
        lawful_basis: {type: [string, 'null']}
        source: {type: [string, 'null'], description: 'How consent was captured (e.g. webform, import, double_opt_in).'}
        actor_type: {type: string, enum: [human, agent, system, connector]}
        actor_id: {type: [string, 'null']}
        occurred_at: {type: string, format: date-time}
    RecordGrant:
      type: object
      description: A manual per-record share — widens own/team/all base scope for one record.
      required: [id, record_type, record_id, subject_type, subject_id, access, granted_by, created_at, version]
      properties:
        id: {type: string, format: uuid}
        record_type: {type: string, enum: [deal, contact, company, lead, project]}
        record_id: {type: string, format: uuid}
        subject_type: {type: string, enum: [user, team]}
        subject_id: {type: string, format: uuid}
        access:
          type: string
          enum: [read, write]
          description: "'write' also satisfies 'read'."
        granted_by: {type: string, format: uuid}
        reason: {type: [string, 'null'], description: 'Accountability/lawful-basis note surfaced in the audit row.'}
        expires_at: {type: [string, 'null'], format: date-time, description: 'Optional TTL; an expired grant matches no rows.'}
        created_at: {type: string, format: date-time}
        version: {type: integer, format: int64}
    RecordAccess:
      type: object
      description: |-
        Who can open one contact or company and who can change it. `data` is one page of the
        members who can open it; `group_counts` and `page.total` count all of them.
      required: [visibility, archived, detail, you, data, page, group_counts, can_change_count, team_access_count]
      properties:
        visibility:
          type: string
          enum: [workspace, owner]
          description: '`workspace` opens to every member whose role reads this record type; `owner` only to its owner and the members it is shared with.'
        owner_id:
          type: [string, 'null']
          format: uuid
          description: The owner, or null when nobody owns the record.
        archived:
          type: boolean
          description: An archived record still opens; nobody can change it until it is restored.
        detail:
          type: boolean
          description: |-
            True for a caller holding the `user_admin` read grant, the boundary `GET /users` applies to
            who is in which team. Then every member is judged with their teams, and role keys and team
            names ride the rows. When false, every member other than the caller is judged without their
            teams, so no row tells the caller who belongs to a team; `team_access_count` counts the
            members whose access or edit rights that leaves out.
        you: {$ref: '#/components/schemas/RecordAccessVerdict'}
        data:
          type: array
          items: {$ref: '#/components/schemas/RecordAccessMember'}
        page: {$ref: '#/components/schemas/PageInfo'}
        group_counts: {$ref: '#/components/schemas/RecordAccessGroupCounts'}
        can_change_count:
          type: integer
          minimum: 0
          description: How many of the members who can open the record can also change it.
        team_access_count:
          type: integer
          minimum: 0
          description: How many members have access or edit rights only through a team and are not shown as such, because `detail` is false. Always 0 when `detail` is true.
        refresh_at:
          type: [string, 'null']
          format: date-time
          description: When the earliest share on this record lapses and this answer changes; null when no share expires.
    RecordAccessGroupCounts:
      type: object
      description: How many members fall in each group, by their first reason in the order owner, direct share, team share, everyone.
      required: [owner, shared, team_shared, everyone]
      properties:
        owner: {type: integer, minimum: 0}
        shared: {type: integer, minimum: 0}
        team_shared: {type: integer, minimum: 0}
        everyone: {type: integer, minimum: 0}
    RecordAccessVerdict:
      type: object
      description: One member's access to the record and the reasons for it.
      required: [can_change, read_reasons, change_reasons]
      properties:
        can_change:
          type: boolean
          description: Whether the record's edit path admits this member.
        read_reasons:
          type: array
          items: {$ref: '#/components/schemas/RecordAccessReason'}
          description: Why the record opens for this member.
        change_reasons:
          type: array
          items: {$ref: '#/components/schemas/RecordAccessReason'}
          description: Why this member can change it; empty when they cannot.
    RecordAccessMember:
      type: object
      description: A member who can open the record.
      required: [user_id, display_name, group, can_change, read_reasons, change_reasons]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        group:
          type: string
          enum: [owner, shared, team_shared, everyone]
          description: The group the panel lists this member under, from their first reason.
        can_change: {type: boolean}
        read_reasons:
          type: array
          items: {$ref: '#/components/schemas/RecordAccessReason'}
        change_reasons:
          type: array
          items: {$ref: '#/components/schemas/RecordAccessReason'}
        roles:
          type: array
          items: {type: string}
          description: The member's role keys. Present only when `detail` is true.
    RecordAccessReason:
      type: object
      description: |-
        One reason a member can open or change the record. `workspace_visible` means the record is
        open to everyone whose role reads this record type. `owner` means they own it.
        `user_share` and `team_share` are live shares. `same_team_as_owner` and `all_records` come
        from the member's role scope and apply only to changing. `write_share` is a share that allows
        changing.
      required: [code]
      properties:
        code:
          type: string
          enum: [workspace_visible, owner, user_share, team_share, same_team_as_owner, all_records, write_share]
        access:
          type: string
          enum: [read, write]
          description: The share's access level, on the three share codes.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: When the share lapses, on the three share codes; null when it does not.
        team_id:
          type: string
          format: uuid
          description: The team behind a team share. Present only when `detail` is true.
        team_name:
          type: string
          description: The team's name. Present only when `detail` is true.
    UserListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/User'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    TeamListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Team'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    CaptureConsent:
      type: object
      description: |-
        The consent passthrough every capture surface (booking, public forms, imports) must carry. Names the purpose and the exact
        wording/version shown, so the resulting grant is demonstrable (Art 7(1)).
      required: [policy_version]
      properties:
        purpose_id:
          type: string
          format: uuid
          description: |-
            The purpose the grant lands on. OMIT IT on a surface that is confined to one purpose
            — the booking doors are, to the `transactional` lane — and the server resolves that
            lane's own id for this installation.
        policy_version: {type: string, maxLength: 200, description: Version id of the consent wording shown to the subject.}
        wording:
          type: [string, 'null']
          maxLength: 2000
          description: |-
            The exact wording shown, stored with the consent event for demonstrability.
        marketing:
          type: object
          description: |-
            An affirmative marketing tick the subject made on the same form. It does NOT record a
            grant: the surface mails a single-use confirmation link to the address on the booking
            and the grant exists only once the subject spends it. That is what lets an anonymous
            form carry the question at all — a stranger who knows an address can cause one
            confirmation mail to be sent to its owner, never a subscription in their name.
          required: [purpose_id, policy_version, wording]
          properties:
            purpose_id:
              type: string
              format: uuid
              description: |-
                The marketing purpose being asked about. It must require double opt-in; a purpose
                that does not is refused, because there would be nothing for the mailed link to ask.
            policy_version: {type: string, maxLength: 200, description: Version id of the marketing wording shown to the subject.}
            wording: {type: string, maxLength: 2000, description: 'The exact marketing wording shown, carried onto the grant the confirmation records.'}
    AutomationCatalogEntry:
      type: object
      description: An automation *type* in the closed starter library.
      required: [key, name, trigger, action, params_schema]
      properties:
        key: {type: string, description: 'Stable type key, e.g. stalled_deal_nudge.'}
        name: {type: string}
        description: {type: string}
        trigger: {type: string, description: 'What fires it (e.g. deal.stage_changed or schedule).'}
        action: {type: string, description: 'What it does (e.g. create_task or send_email).'}
        tier: {type: string, enum: [auto_execute, confirmation_required], description: 'confirmation_required actions stage to /approvals at run time.'}
        params_schema: {type: object, additionalProperties: true, description: JSON-schema for this type's parameters (drives the editor form).}
    Automation:
      type: object
      description: A configured automation instance (feedback/14).
      required: [id, key, name, status, params, created_at]
      properties:
        id: {type: string, format: uuid}
        key: {type: string, description: The catalog type this instance is built from.}
        name: {type: string}
        status: {type: string, enum: [enabled, paused]}
        paused_reason:
          type: [string, 'null']
          enum: [list_archived, list_invalid, list_unavailable, burst, null]
          description: >-
            Why a rule paused itself: the list it watches or adds to was archived, its filter stopped working, its owner can no longer find it, or one check moved more than 100 records. Null for a rule running or paused by hand. Resuming clears it.
        params: {type: object, additionalProperties: true}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    Product:
      type: object
      description: A rate-card entry. Mirrors the `product` table — data an offer line snapshots from, never a configurator.
      required: [id, name, unit, unit_price_minor, currency, default_tax_rate, active, source, captured_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        sku: {type: [string, 'null'], description: Optional; unique per workspace while live.}
        description: {type: [string, 'null']}
        unit: {type: string, description: "'unit' | 'hour' | 'day' | …; display only, free text."}
        unit_price_minor: {type: integer, format: int64, description: Integer minor units (P11); no float money.}
        billing_model: {type: [string, 'null'], enum: [one_time, recurring, null], description: 'Whether this price repeats. Null means nobody has classified it, which is NOT the same as one_time: every row written before the field existed carries null, and reading it as one-off would assert a classification nobody made.'}
        billing_interval_months: {type: [integer, 'null'], enum: [1, 3, 6, 12, null], description: 'How many months one billing period spans. Required with `recurring`, refused otherwise.'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        default_tax_rate: {type: number, format: double, description: 'Percent, e.g. 19.00 (DE USt.); per-line override allowed.'}
        active: {type: boolean}
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: Server-stamped from the authenticated principal; never client-supplied.}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
      additionalProperties: true
    ProductListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Product'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    CreateProductRequest:
      type: object
      required: [name, unit_price_minor, currency, source]
      properties:
        name: {type: string}
        sku: {type: [string, 'null']}
        description: {type: [string, 'null']}
        unit: {type: [string, 'null'], description: Defaults to 'unit'.}
        unit_price_minor: {type: integer, format: int64, minimum: 0}
        billing_model: {type: [string, 'null'], enum: [one_time, recurring, null], description: 'Whether this price repeats. Null means nobody has classified it, which is NOT the same as one_time: every row written before the field existed carries null, and reading it as one-off would assert a classification nobody made.'}
        billing_interval_months: {type: [integer, 'null'], enum: [1, 3, 6, 12, null], description: 'How many months one billing period spans. Required with `recurring`, refused otherwise.'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        default_tax_rate: {type: [number, 'null'], format: double, minimum: 0, description: Percent; defaults to 0.}
        active: {type: [boolean, 'null'], description: Defaults to true.}
        source: {type: string}
      additionalProperties: true
    UpdateProductRequest:
      type: object
      description: Any subset; omit a field to leave it unchanged. A price change never re-prices existing offer lines (they hold snapshots).
      properties:
        name: {type: string}
        sku: {type: [string, 'null']}
        description: {type: [string, 'null']}
        unit: {type: string}
        unit_price_minor: {type: integer, format: int64, minimum: 0}
        billing_model: {type: [string, 'null'], enum: [one_time, recurring, not_specified, null], description: 'Whether this price repeats. Send `not_specified` to say nobody has classified it — an omitted field and a JSON null both mean "leave the classification alone", which is why clearing it needs a word of its own. Reading a product back, this field is never `not_specified`: it is one_time, recurring, or null.'}
        billing_interval_months: {type: [integer, 'null'], enum: [1, 3, 6, 12, null], description: 'How many months one billing period spans. Required with `recurring`, refused otherwise.'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        default_tax_rate: {type: number, format: double, minimum: 0}
        active: {type: boolean}
      additionalProperties: true
    DealRoomState:
      type: string
      description: |-
        Where the room stands. A room is created `live`, and `live` and `closed` are
        the two that serve a buyer. `draft`, `building`, `ready` and `publishing` are
        retired: no writer produces them, and the enum keeps them so an old audit
        image still reads.
      enum: [draft, building, ready, publishing, live, paused, closed, expired, archived]
    DealRoom:
      type: object
      description: |-
        One buyer-facing room per deal.
      required: [id, deal_id, title, state, source, captured_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        deal_id:
          type: string
          format: uuid
          description: The deal this room projects. Immutable — a room never moves between deals.
        title: {type: string}
        welcome_message:
          type: [string, 'null']
          description: The buyer's first paragraph on opening the room.
        state: {$ref: '#/components/schemas/DealRoomState'}
        steward_user_id:
          type: [string, 'null']
          format: uuid
          description: |-
            The named human a buyer is pointed at for help. Defaults to the deal's owner
            at create time and transfers deliberately thereafter; null once that user is
            deleted, which is the state a steward transfer exists to repair.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: When buyer access lapses on its own. Extending is an explicit human act.
        closed_at: {type: [string, 'null'], format: date-time}
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: Server-stamped from the authenticated principal; never client-supplied.}
        preview_available:
          type: boolean
          readOnly: true
          description: >-
            Whether THIS caller may open the buyer preview of THIS room — the same question `POST /deal-rooms/{id}/preview` answers, computed here so a screen can say no before the press rather than after it. Four things must hold, and a plain `writable` would answer only one: the caller holds `update` on deal rooms, is a contact rather than an agent (a preview is a seat's own view, and a system caller has no seat to preview from), the underlying deal is writable AND live, and the room is not archived. False is not "this room is broken" — it is the ordinary reading for a colleague who may read the room and not present it.
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
      additionalProperties: true
    DealRoomListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/DealRoom'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    CreateDealRoomRequest:
      type: object
      required: [deal_id, title, source]
      properties:
        deal_id: {type: string, format: uuid}
        title: {type: string, minLength: 1}
        welcome_message: {type: [string, 'null']}
        steward_user_id:
          type: [string, 'null']
          format: uuid
          description: Defaults to the deal's owner when omitted.
        expires_at: {type: [string, 'null'], format: date-time}
        source: {type: string}
      additionalProperties: true
    DealRoomParticipantCapability:
      description: |-
        What a participant may do in the room. Coarse and room-wide on purpose — a
        per-document permission matrix is a product nobody asked for.
      type: string
    DealRoomDeliveryState:
      type: string
      description: |-
        What happened to the credential we last sent this contact — delivery, modelled
        apart from access. A bounced invitation and a revoked one look identical
        otherwise, and a seller chasing silence needs to tell them apart.
      enum: [none, pending, sent, delivered, failed, consumed, superseded]
    DealRoomParticipant:
      type: object
      description: |-
        One named contact admitted to one room.
      required: [id, room_id, full_name, email, capability, delivery_state, source, captured_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        room_id: {type: string, format: uuid}
        full_name: {type: string}
        email: {type: string, format: email, description: Stored lowercase.}
        capability: {$ref: '#/components/schemas/DealRoomParticipantCapability'}
        delivery_state: {$ref: '#/components/schemas/DealRoomDeliveryState'}
        invited_by:
          type: [string, 'null']
          format: uuid
          description: The user who admitted them. Null once that user is deleted.
        credential_expires_at:
          type: [string, 'null']
          format: date-time
          description: When the standing credential lapses. Null when none stands.
        last_seen_at:
          type: [string, 'null']
          format: date-time
          description: When they last made a request. Null if they have never signed in.
        download_count:
          type: [integer, 'null']
          readOnly: true
          description: |-
            How many documents this contact has taken out of the room, counting each
            download. Absent until they take one.
        documents_downloaded:
          type: [array, 'null']
          readOnly: true
          items: {type: string}
          description: The titles of the documents they downloaded, each named once.
        has_signed_in:
          type: boolean
          readOnly: true
          description: |-
            Whether this contact has ever exchanged a credential for a session.
        link_requested_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: |-
            When this contact last asked for a new link from the public page. The
            seller sees it beside the row so a buyer whose mail never arrived (no
            relay configured, or a link still standing) can be handed one by hand.
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: |-
            When their access was taken away. The row survives revocation so their
            comments stay attributed to a name.
        source: {type: string}
        captured_by: {type: string, readOnly: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: true
    DealRoomParticipantListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/DealRoomParticipant'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    DealRoomDocumentGroup:
      type: string
      description: |-
        One of four fixed groups, as a machine key: `commercial`, `legal`,
        `security_privacy`, `delivery_operations`. Labels are the client's i18n; the
        key never carries a display string. Not configurable, not AI-assigned — the
        contact adding the document picks. A plain string rather than an inline enum
        for the reason `DealRoomParticipantCapability` gives.
    DealRoomDocument:
      type: object
      description: |-
        One document a room puts in front of its buyer: a pointer at an attachment
        filed on the deal, with a buyer-facing title, a group and an order. The
        attachment row is the exact version shown.
      required: [id, room_id, attachment_id, group_key, title, position, filename, source, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        room_id: {type: string, format: uuid}
        attachment_id: {type: string, format: uuid}
        group_key: {$ref: '#/components/schemas/DealRoomDocumentGroup'}
        title: {type: string}
        position: {type: integer}
        filename: {type: string, readOnly: true, description: "The attachment's stored filename, for the seller's reference."}
        content_type: {type: [string, 'null'], readOnly: true}
        byte_size: {type: [integer, 'null'], format: int64, readOnly: true}
        archived_at: {type: [string, 'null'], format: date-time}
        source: {type: string}
        captured_by: {type: string, readOnly: true}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: true
    DealRoomDocumentListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/DealRoomDocument'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    DealRoomAuthor:
      type: object
      description: Who spoke — which side, and the name that side knows them by.
      required: [side, name]
      properties:
        side: {type: string, description: '`seller` or `buyer`.'}
        name: {type: string}
      additionalProperties: false
    DealRoomComment:
      type: object
      required: [id, thread_id, body, author, created_at]
      properties:
        id: {type: string, format: uuid}
        thread_id: {type: string, format: uuid}
        body: {type: string}
        author: {$ref: '#/components/schemas/DealRoomAuthor'}
        created_at: {type: string, format: date-time}
      additionalProperties: false
    DealRoomThread:
      type: object
      description: |-
        One thread of the room's conversation, with its comments. Served to both
        sides in the same shape: the buyer and the seller read the same
        conversation, and neither side's ids beyond the thread's own are in it.
      required: [id, room_id, required_change, state, author, created_at, comments]
      properties:
        id: {type: string, format: uuid}
        room_id: {type: string, format: uuid}
        document_id: {type: [string, 'null'], format: uuid, description: Null for a room-level thread.}
        required_change: {type: boolean}
        state: {type: string, description: '`open` or `resolved`. A plain string, not an inline enum, for the reason `DealRoomParticipantCapability` gives.'}
        author: {$ref: '#/components/schemas/DealRoomAuthor'}
        created_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        version: {$ref: '#/components/schemas/RowVersion'}
        comments:
          type: array
          items: {$ref: '#/components/schemas/DealRoomComment'}
      additionalProperties: false
    DealRoomThreadListResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/DealRoomThread'}}
      additionalProperties: false
    OpenDealRoomThreadRequest:
      type: object
      required: [body]
      properties:
        document_id:
          type: [string, 'null']
          format: uuid
          description: The room document the thread is about. Omit for a room-level exchange.
        body: {type: string, minLength: 1, description: The first comment.}
        required_change:
          type: boolean
          description: Only with a document. Marks the thread as one the seller still owes an answer on.
        source: {type: string, description: 'Provenance. Required on the seller edge; a buyer''s comment always carries the credential''s own value. `manual` for someone writing through this product.'}
        request_id:
          type: string
          format: uuid
          description: |-
            An id the CLIENT mints for this attempt, so a repeated delivery of the
            same attempt lands once.
      additionalProperties: false
    PostDealRoomCommentRequest:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1}
        source: {type: string}
        request_id:
          type: string
          format: uuid
          description: |-
            An id the CLIENT mints for this attempt, so a repeated delivery of the
            same attempt lands once.
      additionalProperties: false
    OfferTemplate:
      type: object
      description: >-
        A branded, workspace-governed DE/EN PDF layout for offers. Deliberately carries no source/captured_by — like CustomField, this is workspace-authored config, not a captured record; provenance lives in the audit row, not this schema.
      required: [id, name, locale, is_default, layout, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: Unique per workspace among live (non-archived) templates.}
        locale: {type: string, default: de-DE, description: 'DE/EN at launch (de-DE, en-US); drives the rendered PDF label set.'}
        is_default: {type: boolean, default: false, description: At most one default template per locale (partial unique index).}
        layout: {type: object, additionalProperties: true, description: 'Logo/header/footer/terms-block refs: bounded params rather than a CMS.'}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    CreateOfferTemplateRequest:
      type: object
      required: [name, layout]
      properties:
        name: {type: string}
        locale: {type: [string, 'null'], default: de-DE}
        is_default: {type: [boolean, 'null'], description: Defaults to false.}
        layout: {type: object, additionalProperties: true}
    UpdateOfferTemplateRequest:
      type: object
      description: Full replace via PUT (unlike updateProduct's merge-PATCH) — every writable field must be supplied; omitting one resets it, it is not left unchanged.
      required: [name, locale, is_default, layout]
      properties:
        name: {type: string}
        locale: {type: string}
        is_default: {type: boolean}
        layout: {type: object, additionalProperties: true}
    OfferTemplateListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/OfferTemplate'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    OfferLineItem:
      type: object
      description: |-
        A typed offer line. `description`/`unit_price_minor` are SNAPSHOTS (copied from the
        optional product at line creation); `line_net_minor`/`line_tax_minor`/`line_total_minor`
        are DERIVED server-side and never stored or client-settable.
      required: [id, position, description, unit, quantity, unit_price_minor, discount_pct, tax_rate, line_net_minor, line_tax_minor, line_total_minor, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer, description: 'Display order, unique per offer.'}
        product_id: {type: [string, 'null'], format: uuid, description: Optional rate-card ref; the line survives the product.}
        description: {type: string}
        unit: {type: string}
        quantity: {type: number, format: double, description: 'Up to 3 decimal places (numeric 14,3); must be > 0.'}
        unit_price_minor: {type: integer, format: int64, description: Snapshot; never re-read from product after creation.}
        billing_model: {type: [string, 'null'], enum: [one_time, recurring, null], description: 'Whether this price repeats. Null means nobody has classified it, which is NOT the same as one_time: every row written before the field existed carries null, and reading it as one-off would assert a classification nobody made.'}
        billing_interval_months: {type: [integer, 'null'], enum: [1, 3, 6, 12, null], description: 'How many months one billing period spans. Required with `recurring`, refused otherwise.'}
        interval_count: {type: [integer, 'null'], minimum: 1, description: 'How many billing periods the buyer commits to. Recurring lines only. Null while the term is still being settled; sending the offer refuses a recurring line that still has none.'}
        discount_pct: {type: number, format: double, description: '0–100, up to 2 decimal places.'}
        tax_rate: {type: number, format: double, description: 'Percent, up to 2 decimal places.'}
        line_net_minor: {type: integer, format: int64, readOnly: true, description: 'round(qty × unit_price × (1 − discount_pct/100)) — server-computed.'}
        line_tax_minor: {type: integer, format: int64, readOnly: true, description: 'round(line_net × tax_rate/100) — server-computed.'}
        line_total_minor: {type: integer, format: int64, readOnly: true, description: line_net + line_tax — server-computed.}
        evidence: {type: [object, 'null'], additionalProperties: true, description: '{snippet, source_id} when AI-drafted; an AI-drafted line without evidence is omitted.'}
        price_grounded: {type: boolean, readOnly: true, default: true, description: 'false only for an AI-proposed line whose price could not be grounded in conversation evidence or the rate card (unit_price_minor is 0 in that case: a sentinel, never a guessed value); true for every human-entered or grounded line.'}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Offer:
      type: object
      description: A versioned Angebot bound to one deal. Mirrors the `offer` table; totals are derived from the nested line items.
      required: [id, deal_id, offer_number, revision, status, currency, net_minor, tax_minor, gross_minor, line_items, source, captured_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        deal_id: {type: string, format: uuid}
        offer_number: {type: string, readOnly: true, description: 'Human-facing Angebot number, minted server-side, unique per workspace (with revision).'}
        revision: {type: integer, readOnly: true, description: Bumped when a sent offer is regenerated; the prior revision becomes superseded.}
        status: {type: string, enum: [draft, sent, accepted, rejected, expired, superseded]}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        buyer_company_id: {type: [string, 'null'], format: uuid}
        buyer_snapshot: {type: [object, 'null'], additionalProperties: true, readOnly: true, description: Buyer legal block captured at send time.}
        issuer_snapshot: {type: [object, 'null'], additionalProperties: true, readOnly: true, description: Seller legal block captured at send time.}
        valid_until: {type: [string, 'null'], format: date}
        intro_text: {type: [string, 'null']}
        terms_text: {type: [string, 'null']}
        net_minor: {type: integer, format: int64, readOnly: true, description: 'Σ line nets; derived, never client-set.'}
        tax_minor: {type: integer, format: int64, readOnly: true, description: 'Σ line taxes; derived, never client-set.'}
        gross_minor: {type: integer, format: int64, readOnly: true, description: 'net + tax; derived, never client-set.'}
        arr_minor: {type: integer, format: int64, readOnly: true, description: 'The annualized NET value of this offer''s recurring lines — derived from the per-period price and its cadence, never client-set. Zero where the offer has no recurring line, including an offer whose lines are all unclassified: an unknown classification annualizes to nothing rather than to a guess.'}
        net_tcv_minor: {type: integer, format: int64, readOnly: true, description: 'The total the buyer commits to: one-off lines in full, plus each recurring line''s per-period net multiplied by the periods committed. A recurring line with no settled term contributes nothing, because there is no committed total until somebody says how long.'}
        fx_rate_to_base: {type: [string, 'null'], readOnly: true, description: 'Native→base, frozen at send. Decimal-as-string to avoid float rounding.'}
        fx_rate_date: {type: [string, 'null'], format: date, readOnly: true}
        template_id: {type: [string, 'null'], format: uuid}
        pdf_asset_ref: {type: [string, 'null'], description: 'Rendered PDF ref, set by renderOffer. Null, as are buyer_company_id and buyer_snapshot, for a reader who cannot open the buyer company; cleared when a draft''s buyer changes.'}
        accepted_at: {type: [string, 'null'], format: date-time, readOnly: true}
        ai_generated: {type: boolean, readOnly: true, default: false, description: 'True only on the response of the regenerate call that produced this draft revision; false on every other read — provenance is stamped on the drafting call itself, not persisted across future reads.'}
        ai_disclosure: {type: [string, 'null'], readOnly: true, description: 'The provenance notice shown to the drafting user, marking the text as model-written so they review it before sending; non-null iff ai_generated=true. Carried beside the draft rather than inside body, and not appended to it on send.'}
        diff_from_previous:
          type: [object, 'null']
          readOnly: true
          description: 'Populated only on a regenerate response — added/removed/changed line items vs the immediately prior revision, so the human sees exactly what the AI proposed. Null on every other read; transient, never persisted.'
          properties:
            added: {type: array, items: {$ref: '#/components/schemas/OfferLineItem'}}
            removed: {type: array, items: {$ref: '#/components/schemas/OfferLineItem'}}
            changed:
              type: array
              items:
                type: object
                properties:
                  before: {$ref: '#/components/schemas/OfferLineItem'}
                  after: {$ref: '#/components/schemas/OfferLineItem'}
        line_items:
          type: array
          readOnly: true
          items: {$ref: '#/components/schemas/OfferLineItem'}
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: Server-stamped from the authenticated principal; never client-supplied.}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
      additionalProperties: true
    OfferListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Offer'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    OfferLineItemInput:
      type: object
      description: |-
        One line to add. With `product_id`, description/unit/unit_price_minor/tax_rate default
        from the product (a SNAPSHOT — later product edits never touch the line); without it,
        description and unit_price_minor are required. Totals are never accepted here (422).
      required: [quantity]
      properties:
        position: {type: [integer, 'null'], minimum: 1, description: Defaults to the next free position.}
        product_id: {type: [string, 'null'], format: uuid}
        description: {type: [string, 'null']}
        unit: {type: [string, 'null']}
        quantity: {type: number, format: double, description: '> 0, up to 3 decimal places.'}
        unit_price_minor: {type: [integer, 'null'], format: int64, minimum: 0}
        billing_model: {type: [string, 'null'], enum: [one_time, recurring, null], description: 'Whether this price repeats. Null means nobody has classified it, which is NOT the same as one_time: every row written before the field existed carries null, and reading it as one-off would assert a classification nobody made.'}
        billing_interval_months: {type: [integer, 'null'], enum: [1, 3, 6, 12, null], description: 'How many months one billing period spans. Required with `recurring`, refused otherwise.'}
        interval_count: {type: [integer, 'null'], minimum: 1, description: 'How many billing periods the buyer commits to. Recurring lines only. Null while the term is still being settled; sending the offer refuses a recurring line that still has none.'}
        discount_pct: {type: [number, 'null'], format: double, minimum: 0, maximum: 100}
        tax_rate: {type: [number, 'null'], format: double, minimum: 0}
    UpdateOfferLineItemRequest:
      type: object
      description: Any subset; omit a field to leave it unchanged. Totals are derived and not settable (422).
      properties:
        position: {type: integer, minimum: 1}
        description: {type: string}
        unit: {type: string}
        quantity: {type: number, format: double}
        unit_price_minor: {type: integer, format: int64, minimum: 0}
        billing_model: {type: [string, 'null'], enum: [one_time, recurring, null], description: 'Whether this price repeats. Null means nobody has classified it, which is NOT the same as one_time: every row written before the field existed carries null, and reading it as one-off would assert a classification nobody made.'}
        billing_interval_months: {type: [integer, 'null'], enum: [1, 3, 6, 12, null], description: 'How many months one billing period spans. Required with `recurring`, refused otherwise.'}
        interval_count: {type: [integer, 'null'], minimum: 1, description: 'How many billing periods the buyer commits to. Recurring lines only. Null while the term is still being settled; sending the offer refuses a recurring line that still has none.'}
        discount_pct: {type: number, format: double, minimum: 0, maximum: 100}
        tax_rate: {type: number, format: double, minimum: 0}
    CreateOfferRequest:
      type: object
      required: [currency, source]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        buyer_company_id: {type: [string, 'null'], format: uuid, description: Defaults to the deal's company.}
        valid_until: {type: [string, 'null'], format: date}
        intro_text: {type: [string, 'null']}
        terms_text: {type: [string, 'null']}
        template_id: {type: [string, 'null'], format: uuid}
        line_items:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/OfferLineItemInput'}
        source: {type: string}
      additionalProperties: true
    UpdateOfferRequest:
      type: object
      description: Header-field patch; allowed only while status=draft (422 offer_not_draft otherwise). Totals are derived and not settable (422).
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: |-
            Refused while the draft carries priced lines. A line's price is an integer with no
            unit of its own, so moving the currency would leave every one of them where it is
            and read it in the new one — a silent reprice of a document a buyer will sign.
            Remove the lines and re-enter them in the new currency, or start a new offer in it.
            Changing the currency on a draft with no priced lines is free, and re-sending the
            currency the offer already holds is not a change.
        buyer_company_id: {type: [string, 'null'], format: uuid}
        valid_until: {type: [string, 'null'], format: date}
        template_id: {type: [string, 'null'], format: uuid}
        intro_text: {type: [string, 'null']}
        terms_text: {type: [string, 'null']}
      additionalProperties: true
    MorningBrief:
      type: object
      description: |-
        One persisted Morning-Brief run for the acting rep: the ranked, honest-short queue of winnable deals plus the metadata that
        reproduces it.
      required: [id, generated_at, as_of, candidate_count, items, factors_omitted]
      properties:
        id: {type: string, format: uuid}
        generated_at: {type: string, format: date-time, description: When this run was assembled.}
        as_of: {type: string, format: date-time, description: The data cutoff this brief reflects; the next run derives "changed overnight" from it.}
        local_day: {type: string, format: date, description: 'The morning this run is for, as a calendar date in the installation reporting timezone. A rep has exactly one run per local day, and the on-open read serves today''s — never an older one dressed as today.'}
        candidate_count: {type: integer, minimum: 0}
        revenue_norm_minor: {type: integer, format: int64, description: The workspace-P90 (or fallback) base value the revenue factor normalized against.}
        revenue_norm_currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: >-
            What `revenue_norm_minor` is in — the installation's base currency as it stood when this run was ranked. A proportion is only checkable against a NAMED base, and a bare figure reads as whatever currency the reader assumes.
        items:
          type: array
          items: {$ref: '#/components/schemas/MorningBriefItem'}
          description: The ranked queue, best-first, capped at the honest-short target (7).
        narrative:
          type: [string, 'null']
          description: |-
            One sentence about the night, written by the overnight agent. Null when the pass
            never ran, and ALSO null when it ran and honestly had nothing to say — `annotated_at`
            is what tells those apart, which is why both fields exist.
        annotated_at:
          type: [string, 'null']
          format: date-time
          description: |-
            When the overnight agent last wrote its findings, null when no pass has. A reader
            showing a run with no narrative must consult this before saying "a quiet night":
            without it, a model that never ran and a night with nothing in it look identical.
        factors_omitted:
          type: array
          description: |-
            The ranking factors this run could not read, so a client can say "the order does
            not account for this" instead of presenting a queue as fully ranked. Never
            returned absent, and empty on the ordinary read: empty and withheld are different
            answers, and a factor that floors silently makes a deal rank lower than it is with
            nothing marking why.
          items:
            type: string
            enum: [warmth]
    MorningBriefItem:
      type: object
      description: |-
        `rank` reflects the L2 re-order within the
        deterministic candidate set, so it is not necessarily descending in `composite`.
      required: [id, deal_id, rank, composite, feature_vector, evidence_ids, state]
      properties:
        id: {type: string, format: uuid}
        deal_id: {type: string, format: uuid}
        rank: {type: integer, minimum: 1, description: 'Position in the queue (1 = top), after the L2 re-order.'}
        composite: {type: number, minimum: 0, maximum: 1}
        feature_vector: {$ref: '#/components/schemas/MorningBriefFeatureVector'}
        evidence_ids:
          type: array
          items: {type: string, format: uuid}
          description: The source rows (deal / activity / relationship) behind the factors; never empty (evidence-or-omit).
        state: {type: string, enum: [new, acted, dismissed, snoozed], description: The acting rep's queue state for this item.}
        state_at: {type: [string, 'null'], format: date-time, description: When the rep acted/dismissed/snoozed; null while new.}
        snoozed_until: {type: [string, 'null'], format: date-time, description: 'When a snoozed item re-surfaces; set exactly while reopen_on=time, null otherwise — the other conditions lift on an event rather than a date.'}
        reopen_on:
          type: [string, 'null']
          enum: [time, reply, meeting, null]
          description: 'What the item is waiting for; set exactly while state=snoozed, null otherwise.'
        reopen_ref:
          type: [string, 'null']
          format: uuid
          description: 'The meeting being waited for; set exactly while reopen_on=meeting.'
        lineage:
          $ref: '#/components/schemas/MorningBriefItemLineage'
        finding:
          type: [string, 'null']
          description: |-
            What the overnight agent found about this deal — why it is on the list, what changed,
            and the one next move. Null when no pass has annotated this run. It is agent-authored
            prose and the surface marks it as such; the rank beside it stays the deterministic
            engine's, which no annotation can change.
    MorningBriefItemLineage:
      type: [object, 'null']
      additionalProperties: false
      description: |-
        Why this deal is back after the rep dismissed it. Absent on an item that was never
        dismissed, which is the ordinary case.
      required: [dismissed_on, returned_with_activity_at]
      properties:
        dismissed_on:
          type: string
          format: date
          description: |-
            The local day the rep dismissed this deal, in the installation reporting timezone —
            the same zone `local_day` is stamped in, so "you dismissed it Tuesday" and "this is
            Thursday's brief" are measured the same way. A date, not an instant: the sentence
            names a day.
        returned_with_activity_at:
          type: string
          format: date-time
          description: |-
            When the activity that re-qualified the deal occurred. An instant, because it names a
            specific event. It is the EARLIEST activity after the dismissal: a later one did not
            bring the deal back, it arrived once the deal was already coming.
    AnnotateBriefRequest:
      type: object
      description: |-
        One overnight pass's findings for the acting rep's own current run.
      required: [items]
      properties:
        narrative:
          type: string
          maxLength: 600
          description: |-
            One sentence about the night as a whole. An empty string is a real answer — a quiet
            night has no sentence — and is stored as null with the pass still stamped.
        items:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/AnnotateBriefItem'}
          description: At most one finding per queued item; a repeated item id is refused.
    AnnotateBriefItem:
      type: object
      description: One finding about one queued deal.
      required: [item_id, finding, cited_evidence]
      properties:
        item_id:
          type: string
          format: uuid
          description: A brief item belonging to the caller's own current run. Anything else refuses.
        finding:
          type: string
          maxLength: 600
          description: The prose the rep reads beside the rank.
        cited_evidence:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
          description: |-
            What this finding rests on. REQUIRED and non-empty: an empty list is not "a claim with
            no sources", it is the verification being skipped, and it is the easy path — a model
            that omits the field would get its prose onto the rep's screen unchecked, under the
            same agent tag a grounded finding carries.
    MorningBriefFeatureVector:
      type: object
      required: [winnability, revenue, timing, momentum, warmth]
      properties:
        winnability: {type: number, minimum: 0, maximum: 1, description: stage win probability / 100.}
        revenue: {type: number, minimum: 0, maximum: 1, description: 'min(1, base value / REVENUE_NORM); floor 0 when no evidencable amount.'}
        timing: {type: number, minimum: 0, maximum: 1, description: bucketed days-until-expected-close urgency.}
        momentum: {type: number, minimum: 0, maximum: 1, description: '1.0 with an evidenced overnight change, else the 0.4 floor.'}
        warmth: {type: number, minimum: 0, maximum: 1}
    AttentionSubject:
      type: object
      description: "The record this item is about, named so a reader knows who it concerns before opening anything."
      required: [type, id]
      properties:
        type: {type: string, enum: [company, contact, deal, lead, activity, project]}
        id: {type: string, format: uuid}
        label: {type: string, description: "The record's display name. Absent when the caller may not read it, which is not the same as unnamed."}
