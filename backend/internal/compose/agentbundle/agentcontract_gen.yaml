  /webhook-subscriptions:
    post:
      tags: [Webhooks]
      operationId: createWebhookSubscription
      summary: Register an outbound webhook subscription (returns the signing secret once).
      description: |-
        Registers a target URL + event-type subset. Registering outbound egress, so an agent
        principal's call is — staged for human approval, then redeemed with the
        `X-Approval-Token`; a human on a session registers directly. Every register/change/delete
        is audited. The `signing_secret` in the response is shown EXACTLY ONCE — deliveries are
        signed with it on the Standard Webhooks scheme (verify the `webhook-signature` header).
        `target_url` must be https://.

        Needs the passport permission Change records.

        Waits for a human to approve.
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWebhookSubscriptionRequest'}
      responses:
        '201':
          description: Created subscription plus the one-time signing secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSubscriptionCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /webhook-subscriptions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Webhooks]
      operationId: updateWebhookSubscription
      summary: Pause/resume a subscription or re-target its event set.
      description: |-
        A partial update (pause/resume or re-target the event set). Re-targeting can widen
        outbound egress, so an agent principal's call is — staged for approval and redeemed
        with the `X-Approval-Token`; a human updates directly.

        Needs the passport permission Change records.

        Waits for a human to approve.
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWebhookSubscriptionRequest'}
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSubscription'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: List tags.
      description: |-
        The workspace's tag vocabulary. Read it before applying one: apply_tag takes a tag_name and
        REFUSES a word the workspace does not hold, so a caller who cannot see the existing words
        asks for a near-duplicate — "K5 Conference" beside "K5 Conference 2026" — and an admin
        coins it, and the vocabulary stops being one.
      parameters:
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: Tags.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TagListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Tags]
      operationId: createTag
      summary: Create a tag.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTagRequest'}
      responses:
        '201':
          description: Created tag.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tag'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Create a tag.

        Needs the passport permission Change records.

        Runs at once.
  /tags/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tags]
      operationId: getTag
      summary: Read one tag, with how much of the workspace carries it.
      description: |-
        The word and its weight. `usage` counts the records this caller may see — an admin
        deciding whether to retire a tag needs to know what retiring it costs, and a count
        that included rows they cannot read would be a number they cannot act on.
      responses:
        '200':
          description: The tag.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TagDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Tags]
      operationId: updateTag
      summary: Rename, recolour or describe a tag.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTagRequest'}
      responses:
        '200':
          description: The updated tag.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Rename, recolour or describe a tag.

        Needs the passport permission Change records.

        Runs at once.
    delete:
      tags: [Tags]
      operationId: archiveTag
      summary: Archive a tag.
      description: |-
        Retiring a word leaves every record that carries it alone: the taggings stay, so a
        history that says "this was a Key Account in March" is still true. What changes is
        that nobody can apply it again.

        Needs the passport permission Change records.

        Runs at once.
      responses:
        '200':
          description: Archived tag.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tag'}
        '404': {$ref: '#/components/responses/NotFound'}
  /tags/{id}/merge:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Tags]
      operationId: mergeTags
      summary: Fold this tag into another, moving every record that carries it.
      description: |-
        The fix for a vocabulary that grew two words for one idea. Every record carrying the
        source ends up carrying the target, the source is archived, and its NAME IS RELEASED
        — a later create may reuse it, and links to the old tag stop working.

        Needs the passport permission Change records.

        Waits for a human to approve.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MergeTagsRequest'}
      responses:
        '200':
          description: What the merge moved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MergeTagsResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /records/{entity_type}/{entity_id}/tags:
    parameters:
      - name: entity_type
        in: path
        required: true
        schema: {type: string, enum: [contact, company, deal, lead]}
      - name: entity_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Tags]
      operationId: getRecordTags
      summary: The tags on one record, and who put them there.
      description: |-
        ONE read for every advertised record type, because the panel that draws them is one
        component: a per-type block on each record response would be one copy per type of one
        shape, and they would drift.
      responses:
        '200':
          description: The record's tags.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordTagsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /tags/{id}/apply:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Tags]
      operationId: applyTag
      summary: Apply a tag to an entity (contact/company/deal/lead/project).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplyTagRequest'}
      responses:
        '201':
          description: Applied tag (taggable row).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Taggable'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Apply a tag to an entity (contact/company/deal/lead/project).

        Needs the passport permission Change records.

        Runs at once.
    delete:
      tags: [Tags]
      operationId: removeTag
      summary: Take one tag off one entity, leaving the tag itself in place.
      description: |-
        Undo for applyTag. archiveTag retires a tag from the whole workspace, which is not the
        same act and not a way back from a mistaken tagging. Idempotent: removing a tagging that
        is not there succeeds, because the caller asked for a state that is already true.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplyTagRequest'}
      responses:
        '200':
          description: Removed. The body is the handle that puts the tagging back.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemovalUndo'}
        '204': {description: The record did not carry the tag; nothing was removed.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /reports/{report}:
    parameters:
      - name: report
        in: path
        required: true
        schema: {type: string}
        description: A prebuilt report key. Saved reports are not served; a UUID here is refused.
        examples:
          prebuilt: {value: open-deals-per-company}
    post:
      tags: [Reports]
      operationId: runReport
      summary: Run a report (the `run_report` MCP verb) and return aggregate rows.
      description: |-
        Executes a validated, typed query plan (NOT free-form SQL). Every aggregate cell is
        reconcilable via the `derivation` for "Explain This Number".
        Bound by RBAC; an agent caller cannot read beyond the human's scope. Audit-logged.

        Needs the passport permission Read records.

        Runs at once.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunReportRequest'}
            examples:
              winRateBySource:
                value:
                  filters: {period: last_quarter}
                  group_by: [source]
      responses:
        '200':
          description: Report result (aggregate rows + plan + per-cell derivation handles).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportResult'}
              examples:
                result:
                  value:
                    report: open-deals-per-company
                    plan:
                      object: deal
                      filters: {status: open}
                      group_by: [company_id]
                      aggregates: [{fn: count, as: open_deals}]
                    columns: [company_id, open_deals]
                    rows:
                      - {company_id: 018f3a1b-0000-7000-8000-000000000020, open_deals: 3}
                    total_rows: 1
                    generated_at: '2026-06-04T08:00:00Z'
                    as_of: '2026-06-04T08:00:00Z'
                    timezone: Europe/Berlin
                    base_currency: EUR
                    fiscal_year_start_month: 1
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: The plan failed validation (out-of-vocabulary field, invalid aggregate).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /reports/{report}/derivation:
    parameters:
      - name: report
        in: path
        required: true
        schema: {type: string}
        description: A prebuilt report key. Saved reports are not served; a UUID here is refused.
    get:
      tags: [Reports]
      operationId: explainReport
      summary: '"Explain This Number" — resolve a derivation handle to its definition + source rows.'
      description: |-
        Resolves the drill-through handle minted as `derivation_url` on every `runReport`
        aggregate row. Returns (a) the exact filter+group+aggregate
        definition **in plain language** and (b) the underlying source rows, row-scoped through
        the SAME RBAC clauses the report itself used — an explanation never out-sees the report.
        The drill-through rows reconcile exactly to the explained aggregate (AC-X1).
      parameters:
        - name: handle_version
          in: query
          schema: {type: string, enum: ['2']}
          description: Version of a scope-bearing derivation handle; legacy handles omit it.
        - name: scope_kind
          in: query
          schema: {type: string, enum: [workspace, team, owner]}
          description: Requested population, revalidated against the current reader.
        - name: scope_id
          in: query
          schema: {type: string, format: uuid}
          description: Team or owner identifier for the requested scope.
        - name: by
          in: query
          schema:
            type: array
            items: {type: string}
          style: form
          explode: true
          description: The plan's grouping dimensions (each must also appear as a predicate parameter carrying the explained row's group-key value).
        - name: agg
          in: query
          schema:
            type: array
            items: {type: string}
          style: form
          explode: true
          description: 'The plan''s aggregates as `fn:field:alias` triplets (field empty for `count`), e.g. `sum:amount_minor:unweighted_minor`.'
      responses:
        '200':
          description: The plain-language definition + drill-through source rows behind the number.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportDerivation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: A predicate key, grouping dimension, or aggregate is outside the report's vocabulary.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /search:
    get:
      tags: [Search]
      operationId: search
      summary: Cross-object search (contacts, companies, deals, activities, leads).
      description: Hybrid full-text search. Results are scoped by RBAC; leads are a distinct result type.
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string}
          description: The search query.
        - name: types
          in: query
          schema:
            type: array
            items: {type: string, enum: [contact, company, deal, activity, lead, project, product, offer_template, tag]}
          style: form
          explode: false
          description: Restrict to these object types (default all).
        - name: per_type
          in: query
          schema: {type: integer, minimum: 1, maximum: 20}
          description: >-
            Answer GROUPED instead of as one ranked list: up to this many hits of EACH type, each type's best first. Relevance is not comparable across types — a message naming an account ten times outranks the account itself — so a short ranked list can hold nothing but messages, while a grouped answer carries every type that matched. `data` holds each type's hits together, best first. The page is the whole answer, so it takes no `cursor` and no `limit`; `types_with_more` names the types holding more than it carries, and asking again without `per_type`, with `types` set to one of them, pages through the rest.
        - name: with_employees
          in: query
          schema: {type: boolean, default: false}
          description: >-
            Also find the contacts who currently work at a company the query matches, each carrying that company as `works_at`. A contact the query matches by its own text is returned once, as itself; one found only through its employer ranks after every contact matched by its own text. Staff are read from the best-matching companies only, as many as a grouped page can show (20), so a word matching hundreds of accounts reaches the contacts at its strongest matches rather than at all of them. It needs the caller to read contacts, companies and the employment between them, and finds no one through the installation's own company or through a query using the websearch operators (`or`, `-word`, quotes), where `-acme` would reach every other company in the workspace. Honoured by both page shapes, so a contact a grouped page shows is also on the ranked list narrowed to `types=contact`.
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ranked cross-object results, or with `per_type` a few of each type.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
              examples:
                hits:
                  value:
                    data:
                      - {type: contact, id: 018f3a1b-0000-7000-8000-000000000010, title: 'Dana Buyer', score: 0.91}
                      - {type: deal, id: 018f3a1b-0000-7000-8000-000000000030, title: 'Acme — Platform expansion', score: 0.74}
                    page: {next_cursor: null, has_more: false}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /installation/settings:
    get:
      tags: [Identity]
      operationId: getInstallationSettings
      summary: The installation's own settings.
      description: |-
        Reads the installation's identity and reporting basis: its name, the
        IANA timezone every reporting period is computed in, and the ISO-4217 base currency
        every money roll-up converts to. Every role may read them — a rep reading amounts
        benefits from knowing which currency they are in — and only admin/ops may change them
        (PATCH). Governed by the `installation_settings` RBAC object.
      responses:
        '200':
          description: The installation settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dedupe/candidates/{id}/disposition:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Contacts]
      operationId: disposeDedupeCandidate
      summary: Decide one pair — merge through the owner's verb, or dismiss forever.
      description: |-
        `merge` requires `winner_id` (one of the pair) and executes `mergeContact`/
        `mergeCompany` server-side — one merge in the system, no second verb.
        `not_a_duplicate` flips the row and suppresses the pair from every future
        sweep (AC-dedupe-7). `409 already_disposed`; `422` when `winner_id` is not
        one of the pair. Deciding a pair CHANGES both records, so the caller needs
        write authority over each of them and not merely the object grant — a seat
        that can read the pair but change neither gets `403`.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DedupeDispositionRequest'}
      responses:
        '200':
          description: The disposed candidate.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DedupeCandidate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /dedupe/candidates/{id}/undo:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Contacts]
      operationId: undoDedupeDisposition
      summary: Re-open a disposed pair.
      description: |-
        A dismissed pair re-opens (the suppression lifts). A merged pair needs the
        merge verb's reversibility — `409 not_undoable` until the
        survivor-side restore exists or when the survivor mutated since. Re-opening
        changes both records the pair names, so it needs write authority over each,
        exactly as the disposition does — `403` otherwise.

        Needs the passport permission Change records.

        Runs at once.
      responses:
        '200':
          description: The re-opened candidate.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DedupeCandidate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: The approval inbox — list staged actions awaiting human decision.
      description: |-
        Lists confirm-first items proposed by agents/AI moments (cold-start accept,
        transcript proposal, overnight reconciliation, drafted sends, deal advances).
        Each item carries the proposed change + evidence + confidence.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected]}
        - name: kind
          in: query
          schema: {type: string}
          description: Filter by proposal kind (e.g. coldstart, send_email, advance_deal, overnight).
        - name: target_entity_type
          in: query
          schema: {type: string}
          description: |-
            Filter to the approvals staged against ONE record, together with `target_entity_id`.
            The two are a discriminated reference and only mean something as a pair, so supplying
            one without the other is a 422 rather than a filter that quietly matches every record
            of a type or every type of an id.
        - name: target_entity_id
          in: query
          schema: {type: string, format: uuid}
          description: The record the staged actions act on. Requires `target_entity_type`.
        - name: bundle_id
          in: query
          schema: {type: string, format: uuid}
          description: |-
            Filter to the proposals ONE act staged together (see `Approval.bundle_id`) — today, a
            website read's company facts plus the leads it published. Members the caller could not
            decide are absent from this page exactly as they are absent from the unfiltered inbox,
            so a bundle may report fewer members than it holds.
      responses:
        '200':
          description: A page of approval items.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /approvals/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Approvals]
      operationId: getApproval
      summary: Get a single approval item (full proposed diff + evidence).
      description: |-
        The staged change in full, with the evidence it was formed on. An item this
        caller could not decide answers `404`, exactly as an out-of-scope record
        does — the same existence-hiding the inbox list applies.
      responses:
        '200':
          description: The approval item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '404': {$ref: '#/components/responses/NotFound'}
  /approvals/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Approvals]
      operationId: approveApproval
      summary: Approve a staged action (commits it; mints the approval token).
      description: |-
        Approving commits the proposed change in one audit transaction. The (optionally
        edited) payload is what executes. Returns the approval with the resulting entity ref
        + the `approval_token` that authorized the downstream operation.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApproveRequest'}
            examples:
              editThenApprove:
                value:
                  edited_payload: {subject: 'Re: proposal (revised)'}
      responses:
        '200':
          description: Approved + committed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Already decided (approved/rejected).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /approvals/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Approvals]
      operationId: rejectApproval
      summary: Reject a staged action (discards it; nothing commits).
      description: |-
        A rejection is a decision, not a free action: it demands exactly the authority
        approving demands, and is recorded the same way. Governed for a passport
        identically to `approveApproval`.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Rejected; no records changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Already decided.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /approval-bundles/{bundle_id}/approve:
    parameters:
      - $ref: '#/components/parameters/BundleId'
    post:
      tags: [Approvals]
      operationId: approveApprovalBundle
      summary: Approve every still-pending member of one bundle.
      description: |-
        A bundle is the set of proposals ONE act staged together; it is a grouping, never a
        second authority object. Each member is decided **on its own terms** — its own verdict,
        audit row, `approval.decided` event and follow-on effect — so the record carries N
        per-effect decisions rather than one decision covering N effects, and a member that has
        expired, that somebody already answered, or whose follow-on change fails to land is
        reported on its own instead of taking its siblings with it.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalBundleDecisionRequest'}
      responses:
        '200':
          description: The per-member result of the decision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalBundleDecision'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /approval-bundles/{bundle_id}/reject:
    parameters:
      - $ref: '#/components/parameters/BundleId'
    post:
      tags: [Approvals]
      operationId: rejectApprovalBundle
      summary: Reject every still-pending member of one bundle; no records change.
      description: |-
        The rejecting half of `approveApprovalBundle`, with the same per-member semantics: a
        rejection is a decision too, so it demands the same authority per member and is recorded
        per member. Already-decided and expired members are reported, not overwritten.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalBundleDecisionRequest'}
      responses:
        '200':
          description: The per-member result of the decision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalBundleDecision'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /custom-fields:
    get:
      tags: [CustomFields]
      operationId: listCustomFields
      summary: List custom fields for an object (admin read; includes retired by default).
      description: |-
        Unlike a normal resource list, this admin view returns both
        active and retired fields by default — `status` narrows to one lifecycle state.
        Backs the custom-fields admin field table.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - name: object
          in: query
          required: true
          schema: {type: string, enum: [contact, company, deal, lead, project, contract]}
          description: Target core object.
        - name: status
          in: query
          schema:
            type: string
            enum: [active, retired]
          description: >-
            Filter to one lifecycle state. Omitted returns both active and retired — this admin list intentionally does not default-exclude retired rows.
      responses:
        '200':
          description: A page of custom fields for the given object.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomFieldListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [CustomFields]
      operationId: createCustomField
      summary: Define a new custom field on an existing core object (a schema change).
      description: |-
        Runs the governed engine's single-transaction add: schema
        change + catalog row + one audit entry land or roll back together. Always —
        a schema change is never — so an agent caller must supply `X-Approval-Token`,
        exactly like `advanceDeal`'s closed-won transition; a human's direct call is
        itself the approval. `column_name` is server-derived and never client-supplied —
        immutable once live. When the requested `label`/`type`/`object` combination is
        judged structural — a new object, a relationship, or logic, never one of the six
        closed types on one of the five closed objects — the request is refused with a
        `structural_change_refused` 422 (see the example below) and nothing is written:
        a structural change ships as a reviewed source change, not a runtime column.

        Needs the passport permission Change records.

        Waits for a human to approve.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCustomFieldRequest'}
            examples:
              text:
                value:
                  object: deal
                  label: Renewal date
                  type: date
                  source: manual
              currency:
                value:
                  object: deal
                  label: Budget ceiling
                  type: currency
                  currency: USD
                  source: manual
              picklist:
                value:
                  object: deal
                  label: Procurement route
                  type: picklist
                  options: [direct, reseller, marketplace]
                  source: manual
      responses:
        '201':
          description: The newly created custom field.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomField'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: RBAC denied, or an agent create attempted without an approval token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                approvalRequired:
                  value:
                    type: 'https://errors.gradion.com/approval_required'
                    title: Approval required
                    status: 403
                    code: approval_required
                    detail: Adding a custom field is a schema change and is confirm-first; supply an approval token.
        '409':
          description: >-
            The slug already exists in this workspace, the derived column name is taken platform-wide (the physical column namespace on a shared core table is global), or the target table is busy with concurrent activity — the last is retryable.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                duplicateSlug:
                  summary: The same (object, slug) already exists in this workspace
                  value:
                    type: 'https://errors.gradion.com/conflict'
                    title: Conflict
                    status: 409
                    code: conflict
                    detail: 'a custom field named "renewal_date" already exists on deal in this workspace: conflict'
                columnTaken:
                  summary: Another workspace holds the derived column name
                  value:
                    type: 'https://errors.gradion.com/conflict'
                    title: Conflict
                    status: 409
                    code: conflict
                    detail: custom-field column "cf_renewal_date" is taken platform-wide; choose another label
                tableBusy:
                  summary: The bounded lock wait fired — retry the schema change
                  value:
                    type: 'https://errors.gradion.com/conflict'
                    title: Conflict
                    status: 409
                    code: conflict
                    detail: 'the target table is busy with concurrent activity; retry the schema change: conflict'
        '422':
          description: Field definition failed validation, or is judged structural (`structural_change_refused`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                validation:
                  value:
                    type: 'https://errors.gradion.com/validation_error'
                    title: Validation failed
                    status: 422
                    code: validation_error
                    detail: One or more fields are invalid.
                    details:
                      errors:
                        - {field: currency, code: required_for_type_currency}
                structuralChangeRefused:
                  summary: The requested field is structural, not a bounded scalar attribute
                  value:
                    type: 'https://errors.gradion.com/structural_change_refused'
                    title: Structural change refused
                    status: 422
                    code: structural_change_refused
                    detail: This looks like a new object, relationship, or logic — not a scalar attribute on an existing object. Runtime custom fields only add bounded scalar columns; a structural change ships as a reviewed source change instead.
                    details:
                      route: source_development_path
        '501':
          description: >-
            Schema changes are not enabled on this deployment — the schema-change pool (schema-dsn) is not mounted.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                schemaPoolUnmounted:
                  value:
                    type: 'https://errors.gradion.com/not_implemented'
                    title: Not Implemented
                    status: 501
                    code: not_implemented
                    detail: operation custom-field schema changes is specified but not yet implemented
  /custom-fields/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [CustomFields]
      operationId: renameCustomField
      summary: Rename a custom field's display label (not a schema change).
      description: |-
        Audited catalog `label` update only; `column_name` never
        moves — the physical column identity is stable across rename. Merge-PATCH:
        `column_name`, `object`, and `type` are absent from the request schema entirely.
        A retired field refuses rename with a 409 `conflict` — retirement is terminal,
        so its label is frozen.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameCustomFieldRequest'}
      responses:
        '200':
          description: The renamed custom field.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomField'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /custom-fields/{id}/lists:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [CustomFields]
      operationId: listCustomFieldLiveLists
      summary: The Live Lists whose filter names this custom field.
      description: |-
        What retiring the field would leave behind, asked before the retire is confirmed. A list
        the caller may find is named; the ones they may not find are only counted, so a private
        list's name never leaves its owner and steward. Archived lists are left out. Needs the
        grant that retires a field.
      responses:
        '200':
          description: The Live Lists that filter on the field.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomFieldLiveLists'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /custom-fields/{id}/retire:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [CustomFields]
      operationId: retireCustomField
      summary: Retire (soft-retire) a custom field — irreversible-feeling, confirm-first.
      description: |-
        Sets `status=retired`; hides the field from the API and
        filtering while the column and every value in it are preserved — the engine never
        drops a column as a side effect. (mirrors `archiveContact`'s
        posture: an irreversible-feeling state change users must confirm) — an agent caller
        must supply `X-Approval-Token`. Not the generic archive shape: this is a status flip
        on a still-fetchable row, not `archived_at` (which stays null). Retiring is never
        refused because a Live List filters on the field: the list keeps evaluating on the kept
        values and reports health `retired_field`. Which lists those are is read, for the
        caller's own visibility, from `listCustomFieldLiveLists` rather than carried here: a
        replayed answer would otherwise repeat list names the caller may no longer find.

        Needs the passport permission Change records.

        Waits for a human to approve.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
      responses:
        '200':
          description: >-
            The retired custom field (`status: "retired"`, `archived_at` still null).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomField'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: RBAC denied, or an agent retire attempted without an approval token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                approvalRequired:
                  value:
                    type: 'https://errors.gradion.com/approval_required'
                    title: Approval required
                    status: 403
                    code: approval_required
                    detail: Retiring a custom field is confirm-first; supply an approval token.
        '404': {$ref: '#/components/responses/NotFound'}
  /custom-fields/{id}/options:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [CustomFields]
      operationId: updateCustomFieldOptions
      summary: Edit a picklist custom field's allowed options (regenerates the column's CHECK).
      description: |-
        Only valid for `type=picklist` fields (422 `not_picklist`
        otherwise). Replaces the catalog's `options` array and regenerates the physical
        column's CHECK constraint from the new set via the governed engine (the same
        one-transaction owner-ALTER shape as `createCustomField` — this is the
        one DDL path rename/retire never touch). Removing every option is refused (422,
        detail "A picklist needs at least one option") — a picklist always keeps at least
        one allowed value. like `retireCustomField`: this mutates a schema-adjacent CHECK
        constraint, so an agent caller must supply `X-Approval-Token`. A retired field
        refuses the edit with a 409 `conflict` — retirement is terminal, so its options
        are frozen; removing an option that stored values still use is also a 409
        (`ADD CONSTRAINT` validates existing rows — migrate the values first).

        Needs the passport permission Change records.

        Waits for a human to approve.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCustomFieldOptionsRequest'}
      responses:
        '200':
          description: The custom field with its regenerated option set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomField'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: RBAC denied, or an agent options edit attempted without an approval token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                approvalRequired:
                  value:
                    type: 'https://errors.gradion.com/approval_required'
                    title: Approval required
                    status: 403
                    code: approval_required
                    detail: Editing a picklist's options changes a schema-adjacent CHECK constraint and is confirm-first; supply an approval token.
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            Stored values still use a removed option, the field is retired (options are frozen — retirement is terminal), or the target table is busy with concurrent activity — the last is retryable.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                removedOptionInUse:
                  summary: Records still carry an option the edit removes
                  value:
                    type: 'https://errors.gradion.com/conflict'
                    title: Conflict
                    status: 409
                    code: conflict
                    detail: 'existing deal values still use a removed option; migrate them first: conflict'
                fieldRetired:
                  summary: The field is retired — its options are frozen
                  value:
                    type: 'https://errors.gradion.com/conflict'
                    title: Conflict
                    status: 409
                    code: conflict
                    detail: 'the field is retired; a retired field cannot be renamed or have its options edited: conflict'
        '422':
          description: The field is not a picklist, or the edit would remove every option.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                notPicklist:
                  value:
                    type: 'https://errors.gradion.com/not_picklist'
                    title: Validation failed
                    status: 422
                    code: not_picklist
                    detail: Only a picklist field's options can be edited.
                lastOption:
                  value:
                    type: 'https://errors.gradion.com/validation_error'
                    title: Validation failed
                    status: 422
                    code: validation_error
                    detail: A picklist needs at least one option
                    details:
                      errors:
                        - {field: options, code: min_one_required}
        '501':
          description: >-
            Schema changes are not enabled on this deployment — the schema-change pool (schema-dsn) is not mounted.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                schemaPoolUnmounted:
                  value:
                    type: 'https://errors.gradion.com/not_implemented'
                    title: Not Implemented
                    status: 501
                    code: not_implemented
                    detail: operation custom-field schema changes is specified but not yet implemented
  /consent-purposes:
    get:
      tags: [Compliance]
      operationId: listConsentPurposes
      summary: List the workspace's consent purposes (e.g. transactional, marketing_email, profiling).
      description: |-
        UNPAGED, deliberately. A workspace's consent purposes are configuration — a handful of
        them, set up once — so the answer is the whole set and `page` reports `has_more: false`.
      responses:
        '200':
          description: A page of consent purposes.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ConsentPurpose'}}
                  page: {$ref: '#/components/schemas/PageInfo'}
  /contacts/{id}/consent:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Compliance]
      operationId: getContactConsent
      summary: Read a contact's per-purpose consent state plus the append-only proof log.
      description: |-
        7 demonstrability). Read-only; never falls back to a
        blanket flag.
      responses:
        '200':
          description: Per-purpose consent state + proof log.
          content:
            application/json:
              schema:
                type: object
                required: [state, events]
                properties:
                  state: {type: array, items: {$ref: '#/components/schemas/ContactConsentState'}}
                  events: {type: array, items: {$ref: '#/components/schemas/ConsentEvent'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /record-grants:
    get:
      tags: [Access]
      operationId: listRecordGrants
      summary: List manual per-record grants, filtered by record or by subject.
      description: |-
        Filter by a record (`record_type`+`record_id`) to answer
        "who has been granted access to this record?", or by a subject (`subject_type`+`subject_id`) to
        answer "what has this user/team been granted?". Read-only; tiered base scope (own/team/all) is
        not returned here — this surfaces only the *manual* grants on top of it.
      parameters:
        - {name: record_type, in: query, schema: {type: string, enum: [deal, contact, company, lead, project]}}
        - {name: record_id, in: query, schema: {type: string, format: uuid}}
        - {name: subject_type, in: query, schema: {type: string, enum: [user, team]}}
        - {name: subject_id, in: query, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of record grants.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/RecordGrant'}}
                  page: {$ref: '#/components/schemas/PageInfo'}
  /users:
    get:
      tags: [Identity]
      operationId: listUsers
      summary: List workspace members (roster) — cursor-paginated. Read-only.
      description: |-
        The workspace member roster: id + display name + email + seat/status. Any authenticated member
        may read it (needed to pick a record-share subject and to resolve subject/granter names). Excludes
        archived users. Bounded by authenticated membership: every seat may read who else works here,
        because a share or assignee picker only some seats could read would be a broken feature.
        `User.roles` rides the row only for a caller holding the `user_admin` grant,
        who is the only one who can act on it.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: {type: string}
          description: Case-insensitive match over display_name/email.
        - name: include_inactive
          in: query
          schema: {type: boolean, default: false}
          description: Admin management view — include deactivated/suspended members. Honored only for an admin caller.
        - name: include_invited
          in: query
          deprecated: true
          schema: {type: boolean, default: false}
          description: |-
            Also list invited seats — members who have not signed in yet. Naming the colleagues a record
            already points at is `GET /users/names`, which answers id and display name alone; a roster row
            carries the member's email and seat status with it.
            Pickers leave it off, so nobody is offered work they cannot open.
      responses:
        '200':
          description: A page of workspace members.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /users/names:
    get:
      tags: [Identity]
      operationId: nameSeats
      summary: Name the colleagues behind a set of ids. Read-only.
      description: |-
        The display names behind ids the caller already holds — a record's owner, an activity's
        author, an assignee on a card.
      parameters:
        - name: id
          in: query
          required: true
          description: The seats to name. Repeat the parameter for several, up to 100; more is `422`.
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: {type: string, format: uuid}
          style: form
          explode: true
      responses:
        '200':
          description: The names, for the ids that resolved to one.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeatNameListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /teams:
    get:
      tags: [Identity]
      operationId: listTeams
      summary: List workspace teams — cursor-paginated. Read-only.
      description: |-
        Teams available as record-share subjects, with a member count. Any authenticated member may read.
        Excludes archived teams. Bounded by authenticated membership, like the member roster beside it.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: {type: string}
          description: Case-insensitive match over team name.
      responses:
        '200':
          description: A page of teams.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /products:
    get:
      tags: [Offers]
      operationId: listProducts
      summary: List rate-card products (live by default; cursor-paginated).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: active
          in: query
          schema: {type: boolean}
        - name: q
          in: query
          schema: {type: string}
          description: Case-insensitive name/SKU substring match.
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      description: List rate-card products (live by default; cursor-paginated).
    post:
      tags: [Offers]
      operationId: createProduct
      summary: Create a rate-card product.
      description: |-
        Price is integer minor-units + ISO-4217 currency (P11, no float money). `sku` is
        optional; when present it is unique per workspace (409 on a live duplicate).

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProductRequest'}
      responses:
        '201':
          description: Created product.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Offers]
      operationId: getProduct
      summary: Get a product by id.
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Get a product by id.
    patch:
      tags: [Offers]
      operationId: updateProduct
      summary: Update a product (partial). Existing offer lines keep their price snapshot.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProductRequest'}
      responses:
        '200':
          description: Updated product.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Update a product (partial). Existing offer lines keep their price snapshot.

        Needs the passport permission Change records.

        Runs at once.
    delete:
      tags: [Offers]
      operationId: archiveProduct
      summary: Archive (soft-delete) a product. Lines referencing it survive with their snapshot.
      responses:
        '200':
          description: Archived product.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: |-
        Archive (soft-delete) a product. Lines referencing it survive with their snapshot.

        Needs the passport permission Change records.

        Runs at once.
  /deal-rooms:
    get:
      tags: [Deals]
      operationId: listDealRooms
      summary: List Deal Rooms (live by default; cursor-paginated).
      description: |-
        Scoped by the parent deal's visibility: a room whose deal the caller cannot
        see is absent, indistinguishable from one that does not exist.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: deal_id
          in: query
          schema: {type: string, format: uuid}
          description: Only the room belonging to this deal.
        - name: state
          in: query
          schema: {$ref: '#/components/schemas/DealRoomState'}
        - name: participant_email
          in: query
          schema: {type: string, format: email}
          description: >-
            Only rooms this address may currently enter — a live, non-revoked seat. The admin's path to "which rooms is this departed contact still in".
      responses:
        '200':
          description: A page of Deal Rooms.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealRoomListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Deals]
      operationId: createDealRoom
      summary: Open a Deal Room on a deal.
      description: |-
        Starts LIVE, and reaches nobody: the invitation is what decides who may read
        a room, so a room nobody has been invited to is private without a second gate.
        At most one active room per deal: a second create while the first is still
        building, ready, publishing, live or paused is rejected
        (409 `deal_room_already_open`). Archiving the first frees the deal for another.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDealRoomRequest'}
      responses:
        '201':
          description: The new Deal Room, live and awaiting its first invitation.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealRoom'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /deal-rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deals]
      operationId: getDealRoom
      summary: Get a Deal Room by id.
      responses:
        '200':
          description: The Deal Room.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealRoom'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Get a Deal Room by id.
  /deal-rooms/{id}/participants:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deals]
      operationId: listDealRoomParticipants
      summary: List the contacts admitted to a room.
      description: |-
        Revoked participants are included by default and marked: their comments and
        decisions stay attributed to them, so a roster that hid them would
        leave unexplained names on the room's history.
      parameters:
        - name: active_only
          in: query
          schema: {type: boolean}
          description: Only participants whose access has not been revoked.
      responses:
        '200':
          description: The room's roster.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealRoomParticipantListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /deal-rooms/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deals]
      operationId: listDealRoomDocuments
      summary: List the documents a room puts in front of its buyer.
      description: |-
        Each entry points at an attachment already filed on the room's deal; the room
        holds no bytes of its own. Grouped by one of four fixed groups and ordered
        within each.
      responses:
        '200':
          description: The room's documents.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealRoomDocumentListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /deal-rooms/{id}/threads:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deals]
      operationId: listDealRoomThreads
      summary: The room's conversation — every thread with its comments.
      description: |-
        Live on both sides: nothing here waits for a publish. Optionally narrowed to
        one document. A room-level thread has no `document_id`.
      parameters:
        - name: document_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The threads, oldest first, each with its comments oldest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealRoomThreadListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Deals]
      operationId: openDealRoomThread
      summary: Open a thread as the seller's side — a question on a document, or a room-level update.
      description: |-
        The first comment is the body. Refused once the room can no longer reach a
        buyer (closed, expired, archived). A document thread is pinned to the
        document's current version.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenDealRoomThreadRequest'}
      responses:
        '201':
          description: The new thread with its first comment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealRoomThread'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /deal-rooms/{id}/threads/{threadId}/comments:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: threadId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Deals]
      operationId: replyDealRoomThread
      summary: Reply in a thread as the seller's side.
      description: |-
        Refused on a resolved thread and in a room that can no longer reach a buyer.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostDealRoomCommentRequest'}
      responses:
        '201':
          description: The thread as it now stands.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealRoomThread'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /offer-templates:
    get:
      tags: [Offers]
      operationId: listOfferTemplates
      summary: List offer templates (branded DE/EN PDF layouts), newest first.
      description: Default view excludes archived rows; pass include_archived=true to include them.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: locale
          in: query
          schema: {type: string}
          description: Filter to one locale (e.g. de-DE, en-US).
      responses:
        '200':
          description: A page of offer templates.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfferTemplateListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Offers]
      operationId: createOfferTemplate
      summary: Create an offer template.
      description: |-
        `name` must be unique among this workspace's live templates (409
        `offer_template_name_duplicate`). At most one default template per locale (409
        `offer_template_default_conflict` — setting `is_default=true` while another
        default already holds that locale).

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOfferTemplateRequest'}
      responses:
        '201':
          description: Created offer template.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfferTemplate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: A template with this name already exists, or a default already exists for this locale.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                nameDuplicate:
                  summary: A live template with this name already exists in this workspace
                  value:
                    type: 'https://errors.gradion.com/offer_template_name_duplicate'
                    title: Duplicate name
                    status: 409
                    code: offer_template_name_duplicate
                    detail: An offer template named "Standard DE" already exists in this workspace.
                defaultConflict:
                  summary: Another template already holds is_default for this locale
                  value:
                    type: 'https://errors.gradion.com/offer_template_default_conflict'
                    title: Default template conflict
                    status: 409
                    code: offer_template_default_conflict
                    detail: 'A default template already exists for locale "de-DE"; archive or un-default it first.'
        '422': {$ref: '#/components/responses/ValidationError'}
  /offer-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Offers]
      operationId: getOfferTemplate
      summary: Get an offer template by id.
      responses:
        '200':
          description: The offer template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfferTemplate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Get an offer template by id.
    put:
      tags: [Offers]
      operationId: updateOfferTemplate
      summary: Update an offer template (full replace — every writable field is replaced).
      description: |-
        Uses PUT (not PATCH) — omitting a writable field resets it, it is not a partial no-op.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOfferTemplateRequest'}
      responses:
        '200':
          description: Updated offer template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfferTemplate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Offers]
      operationId: archiveOfferTemplate
      summary: Archive (soft-delete) an offer template.
      description: |-
        Sets archived_at (soft-archive); hidden from the default list but still fetchable by id. Offers already carrying this template_id are unaffected — a template is never deleted out from under an existing offer.

        Needs the passport permission Change records.

        Runs at once.
      responses:
        '200':
          description: Archived offer template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfferTemplate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /deals/{id}/outcome-reviews:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deals]
      operationId: listDealOutcomeReviews
      summary: The reviews written about this deal's closings.
      description: |-
        Every review this deal carries, newest first, including reviews of EARLIER closings.
        A deal that was closed, reopened and closed again has more than one thing to have an
        opinion about, and an old review stays readable rather than being reattached to the
        current closing or hidden.
      responses:
        '200':
          description: The deal's reviews.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutcomeReviewListResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /activity-review-templates:
    get:
      tags: [Activities]
      operationId: listActivityReviewTemplates
      summary: The question sets an outcome review can ask.
      responses:
        '200':
          description: Every live template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityReviewTemplateListResponse'}
      description: The question sets an outcome review can ask.
  /deals/{id}/offers:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Offers]
      operationId: listDealOffers
      summary: List a deal's offers, newest revision first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: {type: string, enum: [draft, sent, accepted, rejected, expired, superseded]}
      responses:
        '200':
          description: A page of the deal's offers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfferListResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: List a deal's offers, newest revision first.
    post:
      tags: [Offers]
      operationId: createOffer
      summary: Create a draft offer under a deal (offer_number minted server-side).
      description: |-
        Line items may ride the create; each snapshots description/price from its optional
        `product_id` unless given explicitly. Totals are DERIVED — a body carrying
        `net_minor`/`gross_minor`/`line_total` (any spelling) is rejected 422.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOfferRequest'}
      responses:
        '201':
          description: Created draft offer with computed totals.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /offers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Offers]
      operationId: getOffer
      summary: Get an offer with its line items and computed totals.
      responses:
        '200':
          description: The offer.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Get an offer with its line items and computed totals.
    patch:
      tags: [Offers]
      operationId: updateOffer
      summary: Update offer header fields — allowed only while status=draft.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOfferRequest'}
      responses:
        '200':
          description: Updated draft offer.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: Validation error — including any mutation of a non-draft offer (offer_not_draft).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
      description: |-
        Update offer header fields — allowed only while status=draft.

        Needs the passport permission Change records.

        Runs at once.
    delete:
      tags: [Offers]
      operationId: archiveOffer
      summary: Archive (soft-delete) an offer.
      description: |-
        An accepted offer prices its deal and is refused 409 `offer_accepted`; archive any other status.

        Needs the passport permission Change records.

        Runs at once.
      responses:
        '200':
          description: Archived offer.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /offers/{id}/line-items:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Offers]
      operationId: addOfferLineItem
      summary: Add a line item to a draft offer (position defaults to next; totals recomputed).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfferLineItemInput'}
      responses:
        '201':
          description: The offer with the new line and recomputed totals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Add a line item to a draft offer (position defaults to next; totals recomputed).

        Needs the passport permission Change records.

        Runs at once.
  /offers/{id}/line-items/{lineItemId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: lineItemId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [Offers]
      operationId: updateOfferLineItem
      summary: Update a draft offer's line item (totals recomputed; totals themselves are not settable).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOfferLineItemRequest'}
      responses:
        '200':
          description: The offer with the updated line and recomputed totals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Update a draft offer's line item (totals recomputed; totals themselves are not settable).

        Needs the passport permission Change records.

        Runs at once.
    delete:
      tags: [Offers]
      operationId: removeOfferLineItem
      summary: Remove a line item from a draft offer (totals recomputed).
      responses:
        '200':
          description: The offer without the line, totals recomputed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
      description: |-
        Remove a line item from a draft offer (totals recomputed).

        Needs the passport permission Change records.

        Runs at once.
  /signals:
    get:
      tags: [Signals]
      operationId: listSignals
      summary: List signals (cursor-paginated), newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: status
          in: query
          schema: {type: string, enum: [open, acknowledged, resolved, dismissed]}
        - name: kind
          in: query
          schema: {type: string, enum: [stalled_deal, champion_left, reengagement, buying_intent, risk, other, contract_ended, new_opportunity, commitment_made, ghosted_thread, project_gone_quiet, funding, leadership_change, expansion, product_launch, technical_change]}
        - name: resolution_state
          in: query
          schema: {type: string, enum: [resolved, low_confidence, unresolved, dropped]}
        - name: company_id
          in: query
          schema: {type: string, format: uuid}
          description: |-
            Signals about one company, matched two ways because a signal reaches an
            account two ways: the resolver stamps `resolved_company_id` (a contact-subject
            signal attributed to the contact's account), and a signal created directly
            about the company carries the `entity_type=company` subject pair.
            Matching only the first arm hides every hand-created account signal.
            Deal-subject signals are NOT folded in — a signal about a deal is reported on
            that deal, not silently re-attributed to its account.
      responses:
        '200':
          description: A page of signals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      description: List signals (cursor-paginated), newest first.
  /signals/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Signals]
      operationId: getSignal
      summary: Get a signal by id.
      responses:
        '200':
          description: The signal.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Signal'}
        '404': {$ref: '#/components/responses/NotFound'}
      description: Get a signal by id.
  /signals/{id}/warmth:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Signals]
      operationId: getSignalWarmth
      summary: The warm/cold classification with the full "why warm" evidence.
      description: |-
        A signal resolved to a company where we hold ≥1 live contact edge
        (employment or deal stakeholder) is WARM and routes to the warm room; a resolved
        company with no contact is COLD and routes to the cold queue. Reads only our own relational core — never an external profile.
      responses:
        '200':
          description: The warm/cold branch with its evidence ids.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalWarmth'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: The signal is not resolved to a company (unresolved / low-confidence / dropped signals have no warmth).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /signals/{id}/intro-path:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Signals]
      operationId: getSignalIntroPath
      summary: The proposed warm-intro path for a warm signal — an actionable move, not a notification.
      description: |-
        Names the route-in contact (the strongest live relationship at the resolved
        company), the relationship we have, and a concrete suggested next move with a
        drafted message carrying the AI provenance notice and evidence back to the
        warm signal. PROPOSAL ONLY: nothing is sent and no record mutates — the outbound
        send rides the governed send tool (POST /activities/{id}/send-email); the warm
        room proposes, the rep sends.
      responses:
        '200':
          description: The proposed intro path.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalIntroPath'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: The signal is cold or not resolved — there is no warm path to propose.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /brief:
    get:
      tags: [Brief]
      operationId: getMorningBrief
      summary: The acting rep's latest Morning-Brief run (the on-open read-model re-read; never re-ranks).
      responses:
        '200':
          description: The latest brief run with its ranked queue.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MorningBrief'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: The rep has no brief run yet (none has been generated).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
      description: The acting rep's latest Morning-Brief run (the on-open read-model re-read; never re-ranks).
  /brief/annotations:
    put:
      tags: [Brief]
      operationId: annotateMorningBrief
      summary: Write the overnight pass's findings onto the acting rep's own brief for today.
      description: |-
        The overnight `morning_brief` agent's write-back. Its goal has always asked for why each
        deal is on the list, what changed, and one next move; this is where that answer lands, so
        it reaches the contact instead of staying in the run's raw result where nothing renders it.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnnotateBriefRequest'}
      responses:
        '204':
          description: The findings were written.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: The rep has no brief run today, so there is nothing to annotate.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /forecast:
    get:
      tags: [Reports]
      operationId: getForecast
      summary: What a period is expected to close, and what the figure does not cover.
      description: Four readings over one period, plus the counts that say what they leave out.
      parameters:
        - name: period
          in: query
          schema: {type: string, enum: [quarter, month, week], default: quarter}
          description: >-
            The window length. Quarters and months follow the installation's financial year; a week is the working week, Monday to Sunday in the installation's own zone, and moves with no fiscal year.
        - name: as_of
          in: query
          schema: {type: string, format: date}
          description: >-
            Which period to read, by naming a day inside it. Omitted means today's. A DAY rather than an instant: which period a moment falls in is a question about the installation's calendar, not about the caller's clock.
        - name: scope_kind
          in: query
          schema: {type: string, enum: [workspace, team, owner], default: workspace}
        - name: scope_id
          in: query
          schema: {type: string, format: uuid}
          description: >-
            Whose forecast, for a team or owner scope. Refused with the workspace scope, which names no subject.
      responses:
        '200':
          description: The readings for that period.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForecastReadings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /forecast/assurance:
    get:
      tags: [Reports]
      operationId: getForecastAssurance
      summary: What last night's input check found, and how much of the pipeline it reached.
      description: |-
        A forecast is only as good as its inputs, and the failures are mundane: a close
        date that went by, an amount that disagrees with the offer that was sent, a deal
        nobody has heard from in ninety days. None is a bug in the arithmetic; every one
        makes the total wrong.
      responses:
        '200':
          description: The most recent completed run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForecastAssurance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No run has completed yet. A fresh installation has not been checked.
  /analytics/coverage:
    get:
      tags: [Reports]
      operationId: getDataCoverage
      summary: How current the sources behind the numbers are.
      description: |-
        Source health: which connectors the nightly check could read, how far back each
        reaches, and what it could not open.
      responses:
        '200':
          description: The most recent run's source health.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataCoverage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No run has completed yet. A fresh installation has not been checked.
  /forecast/assurance/exceptions:
    get:
      tags: [Reports]
      operationId: listInputChecks
      summary: The open findings this caller can see.
      description: |-
        What the nightly check found, ordered the way a manager with ten minutes before a
        call needs it: high severity first, then by the money at stake.
      responses:
        '200':
          description: The open findings, most material first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/InputCheck'}
                additionalProperties: false
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /forecast/movement:
    get:
      tags: [Reports]
      operationId: getForecastMovement
      summary: What moved the forecast between two snapshots, and which deals moved it.
      description: The difference between two frozen states, classified into named causes.
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: uuid}
          description: The opening snapshot.
        - name: to
          in: query
          required: true
          schema: {type: string, format: uuid}
          description: The closing snapshot.
        - name: reading
          in: query
          schema: {type: string, enum: [open, weighted, evidence, best_case], default: open}
          description: >-
            Which of the four money answers this movement explains. A waterfall is drawn for ONE of them; mixing two adds figures that do not belong in one total.
      responses:
        '200':
          description: The classified difference.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForecastMovement'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /forecast/calls:
    get:
      tags: [Reports]
      operationId: listForecastCalls
      summary: What this period's forecast has been called, newest first.
      description: The calls made for one period and scope, newest first — not just the one standing now.
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [quarter, month, week]
            default: quarter
          description: The window length. Quarters follow the installation's financial year.
        - name: as_of
          in: query
          schema: {type: string, format: date}
          description: >-
            Which period to read, named by a day inside it. Defaults to today, so a caller who names nothing asks about the period they are in.
        - name: scope_kind
          in: query
          schema: {type: string, enum: [workspace, team, owner], default: workspace}
        - name: scope_id
          in: query
          schema: {type: string, format: uuid}
          description: Whose forecast, for a team or owner scope. A workspace scope names none.
      responses:
        '200':
          description: The calls made for that period and scope, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [calls]
                additionalProperties: false
                properties:
                  calls:
                    type: array
                    items: {$ref: '#/components/schemas/ForecastCall'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /analytics/query:
    post:
      tags: [Reports]
      operationId: runAnalyticsQuery
      summary: Answer a question nobody wrote a report for.
      description: |-
        A typed query over the vocabulary `/analytics/schema` returns. The caller names a
        population, what to group by, what to measure and how to narrow — never SQL, and
        never a field that is not in their own schema.

        Needs the passport permission Read records.

        Runs at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnalyticsQuery'}
      responses:
        '200':
          description: The answer, as this caller may read it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalyticsAnswer'}
        '400':
          description: >-
            The question is unanswerable as written: a population or field this caller cannot name, a measure that means nothing over that column, an aggregate or comparison the engine does not have, or a filter separating out too few records to answer about. `details` carries the refusal's kind and what would have worked.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/AnalyticsRefusal'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /analytics/reports/render:
    post:
      tags: [Reports]
      operationId: renderAnalyticsReport
      summary: Resolve a report document's figures for this reader.
      description: |-
        A report document carries STRUCTURE and WORDS. It never carries a figure: every
        number names a saved run and a cell inside it, and this is where those handles turn
        into numbers.

        Needs the passport permission Read records.

        Runs at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportDocument'}
      responses:
        '200':
          description: The document with every figure resolved for this caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RenderedReport'}
        '400':
          description: >-
            The document is not in the block grammar — an unknown block, a literal number, a figure block naming no cell, or an untyped callout — and the message names the block by index. Or a cited run's question, re-asked for this reader, is refused, and `details` carries the refusal's kind and what would have worked.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/AnalyticsRefusal'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /contacts/{id}/network:
    get:
      tags: [Contacts]
      operationId: getContactNetwork
      security: [{bearerAuth: []}]
      summary: Who on our team knows this contact, and how well.
      description: |-
        The contact-anchored answer to the question the company connections card answers
        per account: which colleagues have a real recorded relationship with this
        contact, warmest first.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The colleagues who know this contact.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactNetwork'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /deals/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deals]
      operationId: getDealStatus
      security: [{bearerAuth: []}]
      summary: Where the deal stands, what could lose it, and the one thing to do next.
      description: |-
        The deal page's one written card, replacing the three that stood beside each
        other and disagreed: a brief that restated records, a health score with no
        words, and a next-move box that read an open task back to you and then said
        it had nothing to add.

        May hold the request open while an AI model answers, when no stored answer exists yet.
      parameters:
        - name: facts_only
          in: query
          required: false
          schema: {type: boolean}
          description: Refresh the card and shared action cache from current facts without model calls. Takes precedence over refresh.
        - name: refresh
          in: query
          required: false
          schema: {type: boolean}
          description: Rewrite even when the fingerprint still matches. The reader asking for a second opinion.
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealStatusCard'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /deals/{id}/coverage:
    get:
      tags: [Deals]
      operationId: getDealCoverage
      security: [{bearerAuth: []}]
      summary: Who covers this deal, and what is wrong with how it is covered.
      description: |-
        Every seat on the deal, which of them are actually engaged, which colleagues
        carry the contact, and the risks that follow.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The deal's coverage and its risks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealCoverage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /deals/{id}/commitments:
    get:
      tags: [Deals]
      operationId: getDealCommitments
      security: [{bearerAuth: []}]
      summary: What the customer committed to that this deal waits on.
      description: |-
        The open commitments the contacts employed at the deal's company made to us, read
        out of captured activities: overdue first, then by nearest due date, at most 25.
        Each carries the quoted words and the activity they came from, so a reader can check
        it, and its claim id, so a reader with `contact:update` can dismiss it
        (`POST /claims/{id}/settle`).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The customer's open commitments on this deal's account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealCommitments'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /imports:
    post:
      tags: [Import]
      operationId: createImportRun
      security: [{bearerAuth: []}]
      summary: Create an import run from an uploaded source and a column mapping, and dry-run it.
      description: |-
        Takes the connector, the `source_ref` from
        `uploadImportSource`, and the mapping the human settled on, and runs the
        validation pass — which writes **no** domain rows (AC-M5). The run
        arrives at `awaiting_approval` carrying the report
        `getImportRunReport` reads.

        Needs the passport permission Change records.

        Runs at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateImportRunRequest'}
      responses:
        '202':
          description: 'The run, validated and awaiting a human (dry run complete, zero rows written).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /imports/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Import]
      operationId: getImportRun
      security: [{bearerAuth: []}]
      summary: Read one import run's lifecycle state.
      description: |-
        A run that stopped part-way reports `failed` **with its
        checkpoint**, which is what makes it a resumable state rather than a
        dead end — the distinction the chapter pins by name.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
  /imports/{id}/report:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Import]
      operationId: getImportRunReport
      security: [{bearerAuth: []}]
      summary: Read the run's report — what will happen, or what did.
      description: |-
        Available from `awaiting_approval` onward, and it is the
        same shape before and after approval: the dry run reports what the
        commit will do, the finished run reports what it did. One shape means a
        human comparing the two is comparing like with like.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportRunReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /imports/{id}/approve:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Import]
      operationId: approveImportRun
      security: [{bearerAuth: []}]
      summary: Approve a validated import run and commit it.
      description: |-
        Valid **only** from
        `awaiting_approval`: approving a run that is already running, complete
        or failed is a conflict, not a no-op, because each of those means the
        approver is looking at a state that is not the one they judged.

        Needs the passport permission Change records.

        Runs at once.
      responses:
        '202':
          description: 'Approved; the commit is under way (or complete — the run record says which).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /companies/{id}/profile-fields/{field}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/ProfileFieldKey'
    patch:
      tags: [Companies]
      operationId: updateCompanyProfileField
      summary: State or correct a profile field — the canonical value changes, the machine's proposal survives.
      description: |-
        Where the field maps to a column on `company`, THE COLUMN IS
        WHAT CHANGES; the sidecar keeps the machine's proposal, excerpt, source URL and confidence in
        history rather than overwriting them. A correction that changed only the sidecar
        would be a lie about having been accepted. Provenance flips to `human` with the acting
        principal and the timestamp; the whole thing commits as one mutation with its audit entry and
        its outboxed event.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCompanyProfileFieldRequest'}
      responses:
        '200':
          description: The corrected profile field.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyProfileField'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /companies/{id}/profile-fields/{field}/confirm:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/ProfileFieldKey'
    post:
      tags: [Companies]
      operationId: confirmCompanyProfileField
      summary: Confirm a profile field without changing its value.
      description: |-
        The same act as a correction, minus the value change: `verified_at` and
        `verified_by` are stamped and the field moves from extracted to confirmed. Version-guarded
        like the correction, so two readers confirming a field one of them has since corrected do not
        silently overwrite each other.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The confirmed profile field.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyProfileField'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /companies/{id}/facts/{factKey}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/FactKey'
    patch:
      tags: [Companies]
      operationId: updateCompanyFact
      summary: Correct an extracted fact.
      description: |-
        The correction path the fact store never had — without it the page can render a
        "confirmed" state nothing is able to produce. Same guarantees as the profile-field
        correction: canonical value first, machine proposal preserved in history, provenance flipped
        to `human`, one transaction carrying the row, the audit entry and the event.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCompanyFactRequest'}
      responses:
        '200':
          description: The corrected fact.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyFact'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Companies]
      operationId: deleteCompanyFact
      summary: Remove a fact this company does not state.
      description: |-
        A crawl reads what a page says, and a page says wrong things: a phone number filed as a
        location, a customer who left three years ago. Correction answers "this value is wrong";
        this answers "this is not a fact about this company at all", which correction cannot say.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The fact is gone.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /companies/{id}/facts/{factKey}/confirm:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/FactKey'
    post:
      tags: [Companies]
      operationId: confirmCompanyFact
      summary: Confirm an extracted fact without changing its value.
      description: |-
        Stamps `verified_at` + `verified_by` and moves the fact from extracted to confirmed. Version-guarded.

        Needs the passport permission Change records.

        Runs at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The confirmed fact.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyFact'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Bearer token — the token IS the Agent Seat Passport, minted via `POST /passports` (the local/A1 issuance path; the hosted
        A2 surface replaces issuance with the spec's OAuth2 + PKCE + DCR Authorization Server).
        The token binds the workspace (tenant) and the principal — an agent acting
        under a passport (`agent:<id>` + passport id + on-behalf-of `human:<user-uuid>`). The
        principal's effective RBAC (own/team/all + field masks) is enforced server-side; an agent can
        never exceed its granting human's permissions. Mutations by this scheme ride the autonomy
        gate + approval staging. Human interactive sessions use `cookieAuth`, not this
        scheme.
  parameters:
    ProfileFieldKey:
      name: field
      in: path
      required: true
      schema:
        type: string
        enum: [display_name, offer_summary, icp, value_proposition, usp, customer_pains, desired_outcomes, buying_center, buying_intents, common_objections, sales_motion, legal_name, registered_address, register_vat, industry, history, legal_form, register_court, register_number]
      description: The profile field's key — the same closed vocabulary `CompanyProfileField.field` carries.
    FactKey:
      name: factKey
      in: path
      required: true
      schema: {type: string}
      description: |-
        One fact's identity within its company, spelled `<field>:<value_key>` (e.g.
        `named_customer:acme-inc`). A fact is multi-valued, so `field` alone does not name a row and
        `value_key` alone is only unique within a field.
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
      description: Opaque resource id (UUID; ordering semantics are not exposed).
    BundleId:
      name: bundle_id
      in: path
      required: true
      schema: {type: string, format: uuid}
      description: |-
        The act that staged a set of proposals together (`Approval.bundle_id`). It names a
        grouping over approval rows, not a resource of its own — there is nothing to GET, and a
        bundle exists exactly as long as some member points at it.
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
      description: |-
        Opaque keyset cursor from a prior response's `page.next_cursor`. The cursor encodes the
        effective `sort` of the originating request (field + direction) plus the last row's keyset
        (sort-key tuple + the `created_at`/`id` tie-breaker). **Stability:** results are stable
        under concurrent inserts/updates (keyset pagination, not offset). Supplying `cursor`
        together with a `sort` that differs from the one the cursor was minted under returns
        `422 code: cursor_param_mismatch` — re-issue the query without the cursor. Filters are
        **not** fingerprinted by the cursor: changing a filter mid-walk changes which rows the
        remaining pages see, so re-issue the query without the cursor when changing filters.
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      description: Max items in the page.
    Sort:
      name: sort
      in: query
      schema: {type: string}
      description: |-
        Sort spec: ONE field, `-` prefix = descending (e.g. `-updated_at`). The house
        `created_at`/`id` tie-breaker is always appended so ordering is total and the keyset
        cursor is deterministic. The default sort when omitted is `-created_at,id` — also the only
        accepted multi-field spelling; any other comma-separated multi-field spec returns
        `422 code: sort_unsupported`. **Allowed sort fields per resource** are the columns that
        resource's list publishes, plus the workspace's active `cf_` columns (custom columns carry no
        index in V1 — a `cf_` sort runs as a tenant-scoped scan). A column a reader can see is one
        they can order by: a header that cannot be clicked is a dead control. Some columns are not
        yet offered even so — one that orders by a JOINED value, such as a stage by its position in
        its pipeline or a partner by its company's name, needs a sort the server cannot express
        yet — and a resource's own list documents which. An out-of-vocabulary field returns
        `422 code: sort_field_not_allowed`.
    ListMembershipFilter:
      name: list_id
      in: query
      schema: {type: string, format: uuid}
      description: |-
        Only the members of this list — a Shortlist's chosen records, or the records a Live List's
        filter selects now — narrowed before sorting and paging, so the page is the list's members
        in the record list's own columns. The list must be one the caller may find and of this
        record type; otherwise `404` or `422`. Sharing a list never widens what the read shows:
        the caller's row scope still applies to every row.
    IncludeArchived:
      name: include_archived
      in: query
      schema: {type: boolean, default: false}
      description: Include soft-deleted (archived) rows. Default false.
    CapturedByKind:
      name: captured_by_kind
      in: query
      schema: {type: string, enum: [human, agent, connector, system]}
      description: |-
        Filter by WHO created the record, matched on the `captured_by` prefix
        (`human:<uuid>` | `agent:<id>` | `connector:<name>` | `system:<id>`).
    AiWritten:
      name: ai_written
      in: query
      schema: {type: boolean}
      description: |-
        `true` returns only records an AI **wrote into**; `false` only records it
        did not touch. Omit for both.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: {type: string, maxLength: 255}
      description: |-
        Client-supplied key making a mutation safe to retry — an update exactly as much as a
        create. **Scope:** the key is unique within
        `(workspace_id, principal, request-path)` and retained **24h**; a replay within that window
        returns the original status + body. Reusing the same key with a *different* request body
        returns `409 code: idempotency_key_conflict` (never a silent replay of mismatched intent).
        **On an update behind `If-Match`** the key is what separates "not applied" from "applied,
        answer lost": without it the blind retry answers `409 version_skew`, because the first
        attempt already bumped the version.
        **Precedence vs natural keys:** on `logActivity`/`createLead`, the Idempotency-Key (transport
        retry-safety) is checked first; if absent, the `(source_system, source_id)` natural key governs. The two never both create a row. **Declaring this parameter is
        what makes an operation replay-safe** — an operation that omits it ignores the header rather
        than half-honouring it, so read this contract, not the client, to know which calls are safe
        to retry blind.
    ApprovalToken:
      name: X-Approval-Token
      in: header
      schema: {type: string}
      description: |-
        A signed, single-use approval token (see schema `ApprovalToken`) minted by
        POST /approvals/{id}/approve, authorizing exactly one confirm-first operation. It is a
        compact JWS whose claims **bind** the token to a specific approval, effect, tenant and
        principal — it is NOT a bare opaque string. The server rejects a token that is
        expired, already consumed, or whose `diff_hash`/`workspace_id`/`passport_id`/`tool` does not
        match the operation being executed (`403 code: approval_token_invalid`). Required when an
        AGENT principal invokes a operation; a human's direct call is itself the approval.
    IfMatch:
      name: If-Match
      in: header
      schema: {type: string}
      description: |-
        Optional optimistic-concurrency precondition for a mutating request (PATCH/advance/merge):
        the last-seen entity `version`. If the row's current `version` differs, the write is
        rejected with `409 code: version_skew` (ErrVersionSkew) and no change is made — re-read,
        re-apply, retry. Omitting it is last-write-wins (discouraged for agent/automated writers).
        Accepted on every native (SoR-mode) mutating endpoint that returns a versioned entity.
  responses:
    Unauthorized:
      description: No valid credential — a missing/invalid/expired `crm_session` cookie (human path) or a missing/invalid/expired bearer token (agent path).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            unauth:
              value: {type: 'https://errors.gradion.com/unauthorized', title: Unauthorized, status: 401, code: unauthorized, detail: No valid session cookie or bearer token.}
    Forbidden:
      description: Authenticated but not permitted (RBAC row/field scope, or approval missing).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            rbac:
              value: {type: 'https://errors.gradion.com/forbidden', title: Forbidden, status: 403, code: forbidden, detail: Your role does not permit this action.}
    PermissionDenied:
      description: 'RBAC object/action denial — the authenticated principal''s role lacks the grant for this object+action (`code: permission_denied`, ErrPermissionDenied). Distinct from `scope_exceeds_grantor`/`seat_tier_insufficient` (agent-passport limits) and `approval_required` (gate).'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            denied:
              value: {type: 'https://errors.gradion.com/permission_denied', title: Permission denied, status: 403, code: permission_denied, detail: Your role does not grant permission for this action on this object.}
    NotFound:
      description: No such resource in this workspace (or out of RBAC scope).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            notFound:
              value: {type: 'https://errors.gradion.com/not_found', title: Not found, status: 404, code: not_found, detail: Resource not found.}
    Conflict:
      description: State conflict (duplicate key, concurrent edit, already-decided, default-pipeline collision).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    VersionConflict:
      description: 'Optimistic-lock failure — the entity changed since the version in If-Match (`code: version_skew`).'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            skew:
              value: {type: 'https://errors.gradion.com/version_skew', title: Version conflict, status: 409, code: version_skew, detail: The resource changed since your last read; re-read and retry.}
    ValidationError:
      description: Request failed validation (RFC 7807 with field-level `details.errors`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            invalid:
              value:
                type: 'https://errors.gradion.com/validation_error'
                title: Validation failed
                status: 422
                code: validation_error
                detail: One or more fields are invalid.
                details:
                  errors:
                    - {field: 'emails[0].email', code: invalid_email}
  schemas:
    UpdateCompanyProfileFieldRequest:
      type: object
      description: 'A human correction. The canonical store changes; the machine''s proposal and its evidence survive in history.'
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          description: >-
            The corrected value. Where this field maps to a column on `company`, the COLUMN is what changes — a correction the header ignores is not a correction.
    UpdateCompanyFactRequest:
      type: object
      description: The correction path the fact store never had — without it the page can render a confirmed state nothing is able to produce.
      required: [value]
      properties:
        value: {type: string, minLength: 1}
    CreateCompanyFactRequest:
      type: object
      description: >-
        A fact a contact states about a company. The category and field come from the same closed vocabulary a site read writes (company_fact_field_vocab), so a hand-stated fact and a read one are the same kind of row and the same readers find both. The dedupe key is derived from the value on the server, never supplied: a caller-chosen key could collide with an unrelated fact or slip past the uniqueness the store depends on.
      required: [category, field, value]
      properties:
        category: {type: string, enum: [company, offering, market, signal]}
        field:
          type: string
          description: A field belonging to `category`; the pairing is checked, so a market field under `company` is a 422 rather than a row nobody can read back.
        value: {type: string, minLength: 1}
    WebhookSubscription:
      type: object
      description: >-
        An outbound webhook subscription: a tenant-configured target URL that receives signed HTTP POSTs for a chosen subset of the published event catalog. The signing secret is NEVER returned here — it is surfaced once, at create/rotate, in `WebhookSubscriptionCreated`.
      required: [id, owner_id, target_url, event_types, state, version]
      properties:
        id: {type: string, format: uuid}
        owner_id: {type: string, format: uuid}
        target_url: {type: string, format: uri, description: HTTPS-only delivery endpoint.}
        event_types:
          type: array
          items: {type: string}
          description: The subscribed event types, each from the published event catalog.
        state: {type: string, enum: [active, paused]}
        version: {type: integer, format: int64, description: Optimistic-concurrency version; echo it in If-Match on update.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    WebhookSubscriptionCreated:
      type: object
      description: >-
        The create/rotate response — the subscription plus the `signing_secret`, which is shown EXACTLY ONCE and never retrievable again. Store it now: deliveries are signed with it on the Standard Webhooks scheme (standardwebhooks.com).
      required: [subscription, signing_secret]
      properties:
        subscription: {$ref: '#/components/schemas/WebhookSubscription'}
        signing_secret:
          type: string
          description: >-
            The per-subscription signing secret (`whsec_` + standard base64). Shown once; decode the base64 to raw bytes and use them as the HMAC-SHA256 key to verify the `webhook-signature` header against `{webhook-id}.{webhook-timestamp}.{raw body}` (Standard Webhooks — standardwebhooks.com).
    CreateWebhookSubscriptionRequest:
      type: object
      required: [target_url, event_types]
      properties:
        target_url: {type: string, format: uri, pattern: '^https://', description: 'HTTPS-only; http:// is rejected (the contract enforces the scheme, matching the store''s check).'}
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
          description: At least one event type from the published catalog; a true set — duplicates are rejected.
    UpdateWebhookSubscriptionRequest:
      type: object
      description: A partial update; omitted fields keep their stored value. Use it to pause/resume or re-target the event set.
      minProperties: 1
      properties:
        state: {type: string, enum: [active, paused]}
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
    InstallationSettings:
      type: object
      description: |-
        The installation's identity and reporting basis. Read by every role,
        changed only by admin/ops.
      required: [name, timezone, base_currency, base_language, fiscal_year_start_month, dead_work_banner_hours, oauth_access_token_ttl_minutes, forecast_forward_measure, base_currency_locked, max_upload_bytes, sign_in_providers, operations]
      properties:
        name:
          type: string
          description: The company's display name.
        timezone:
          type: string
          description: |-
            IANA zone name every reporting period boundary is computed in (not a user's own
            display timezone, which is per-user).
        base_currency:
          type: string
          description: ISO-4217 code every money roll-up converts to.
        base_language:
          type: string
          enum: [en, de, vi]
          description: |-
            The language AI writes in when what it writes is read by the whole team — claims,
            signals, extracted facts, agent answers. Not a user's display language, which is
            per-user.
        date_format:
          type: string
          enum: [locale, dmy, mdy, ymd]
          description: 'Display dates using the UI language, DD.MM.YYYY, MM/DD/YYYY, or YYYY-MM-DD. Defaults to locale; never changes stored dates or reporting boundaries.'
        time_format:
          type: string
          enum: [locale, 24h, 12h]
          description: 'Display times using the UI language, a 24-hour clock, or a 12-hour clock. Defaults to locale; never changes timezones or stored instants.'
        fiscal_year_start_month:
          type: integer
          minimum: 1
          maximum: 12
          description: |-
            The month the installation's business year begins, 1..12. January (1) is the
            default, which is the calendar year every installation reported by before this
            setting existed.
        sign_in_providers:
          type: array
          description: |-
            Every external sign-in provider this deployment holds credentials for, and whether
            the installation currently offers it on the login screen. The list is what the
            DEPLOYMENT makes possible: an admin can turn one off, but cannot add one, because
            a client id and secret cannot be invented from a settings screen.
          items:
            $ref: '#/components/schemas/SignInProvider'
        base_currency_locked:
          type: boolean
          description: |-
            True once a conversion rate has been frozen against the base currency — by a closed
            deal, a sent offer, a mirrored invoice, a contract, a commission entry, or a loaded
            rate sheet — after which it can no longer be changed.
        base_currency_locked_reason:
          type: string
          description: |-
            Why the currency is locked, naming what has already converted against it. Absent
            when it is still changeable.
        max_upload_bytes:
          type: integer
          format: int64
          description: |-
            The largest upload request this installation accepts, in bytes — set by whoever
            operates it, not compiled into the build. Read-only:
            it is a deployment fact, so PATCH does not carry it.
        oauth_access_token_ttl_minutes:
          type: integer
          minimum: 5
          maximum: 129600
          description: |-
            How long the access token an MCP connector's OAuth handshake mints lives, in minutes —
            for the code exchange and every refresh rotation alike. 30 days by default, at most
            90. A change applies to the next token minted; tokens already issued keep the expiry
            they were issued with.
        operations:
          $ref: '#/components/schemas/OperationSettings'
        dead_work_banner_hours:
          type: integer
          minimum: 1
          maximum: 168
          description: |-
            How far back the maintenance banner looks before it calls dead work a problem, in
            hours. 24 by default, bounded above by River's own seven-day retention — a window
            past that cannot narrow anything, since every terminal row still there is inside it.
        forecast_forward_measure:
          type: string
          enum: [commit_evidence, weighted, manager_call]
          description: |-
            Which remaining-pipeline reading a projected landing is built from. A setting
            rather than a fixed choice, because it is a question about how this installation
            SELLS rather than about the software: a team with a disciplined commit stage means
            something by it, and one that commits everything does not — their weighted number
            is the honest one.
    SignInProvider:
      type: object
      additionalProperties: false
      required: [key, label, enabled]
      description: >-
        One external sign-in provider this deployment holds credentials for, and whether the installation currently offers it. An admin can turn one off; they cannot add one, because a client id and secret cannot be invented from a settings screen.
      properties:
        key:
          type: string
          description: The provider key the sign-in routes are served under.
        label:
          type: string
          description: The provider's display name, as the login screen shows it.
        enabled:
          type: boolean
          description: Whether this installation currently offers it on the login screen.
    OperationSettings:
      type: object
      additionalProperties: false
      description: |-
        The worker's operating values: how often each background pass runs, how far ahead a
        mailbox subscription is renewed, and how fast one mailbox sends. A running worker reads
        them again within a minute of a change, so none needs a restart.
      required: [agent_runner_interval_seconds, webhook_retry_interval_seconds, time_scan_interval_seconds, close_date_sweep_interval_seconds, follow_up_reconcile_interval_seconds, retention_sweep_interval_seconds, geocode_backfill_interval_seconds, technical_backfill_interval_seconds, gmail_watch_scan_interval_seconds, graph_watch_scan_interval_seconds, gmail_watch_renew_within_hours, graph_watch_renew_within_hours, send_rate_limit, send_rate_window_seconds, send_max_age_hours]
      properties:
        agent_runner_interval_seconds: {type: integer, minimum: 10, maximum: 3600, description: 'How often scheduled agents are checked for a run that is due, in seconds. Default 30.'}
        webhook_retry_interval_seconds: {type: integer, minimum: 10, maximum: 3600, description: 'How often failed webhook deliveries are retried, in seconds. Default 30.'}
        time_scan_interval_seconds: {type: integer, minimum: 60, maximum: 86400, description: 'How often time-based automation rules are checked, in seconds. Default 3600.'}
        close_date_sweep_interval_seconds: {type: integer, minimum: 3600, maximum: 604800, description: 'How often deals whose close date has passed are flagged, in seconds. Default 86400.'}
        follow_up_reconcile_interval_seconds: {type: integer, minimum: 3600, maximum: 604800, description: 'How often stalled deals are checked for a follow-up to propose, in seconds. Default 86400.'}
        retention_sweep_interval_seconds: {type: integer, minimum: 3600, maximum: 604800, description: 'How often data past its retention period is removed, in seconds. Default 86400. It cannot be switched off.'}
        geocode_backfill_interval_seconds: {type: integer, minimum: 0, maximum: 604800, description: 'How often addresses without coordinates are looked up, in seconds, from 300; 0 switches the sweep off. Default 3600.'}
        technical_backfill_interval_seconds: {type: integer, minimum: 0, maximum: 604800, description: 'How often company domains without technical facts are looked up, in seconds, from 300; 0 switches the sweep off. Default 21600.'}
        gmail_watch_scan_interval_seconds: {type: integer, minimum: 600, maximum: 43200, description: 'How often Gmail push subscriptions are checked for renewal, in seconds. Default 21600.'}
        graph_watch_scan_interval_seconds: {type: integer, minimum: 600, maximum: 43200, description: 'How often Microsoft 365 mail subscriptions are checked for renewal, in seconds. Default 21600.'}
        gmail_watch_renew_within_hours: {type: integer, minimum: 24, maximum: 144, description: 'How far ahead of expiry a Gmail push subscription is renewed, in hours. A watch lasts seven days. Default 48.'}
        graph_watch_renew_within_hours: {type: integer, minimum: 24, maximum: 60, description: 'How far ahead of expiry a Microsoft 365 mail subscription is renewed, in hours. A subscription lasts just under three days. Default 24.'}
        send_rate_limit: {type: integer, minimum: 1, maximum: 1000, description: 'How many messages one mailbox may send per window. A burst bound, not a quota. Default 30.'}
        send_rate_window_seconds: {type: integer, minimum: 10, maximum: 3600, description: 'The window the send rate is counted over, in seconds. Default 60.'}
        send_max_age_hours: {type: integer, minimum: 1, maximum: 168, description: 'How long a delivery held back by the send rate may wait before it stops with a reason, in hours. Default 24.'}
    SourceAuthor:
      type: object
      description: |-
        Who wrote a record in the system it was imported from, when that is not
        whoever recorded it here.
      required: [display_name]
      properties:
        user_id:
          type: [string, 'null']
          format: uuid
          description: The member this author is, when they hold a seat here. Null for an author who never did.
        display_name:
          type: string
          description: What to show. The member's current display name when `user_id` is set, else the name the source system carried.
        via:
          type: [string, 'null']
          description: >-
            Which system the record came from (`hubspot`), so a surface can say where the attribution comes from rather than presenting it as something typed here. Null when the origin was not recorded.
    EmailSummary:
      type: object
      description: |-
        One retained email, reduced to what a row shows without opening it. Present on an
        activity only when `kind=email`; every other kind carries none, and a reader that
        branches on this field is asking the one question that decides the canonical row.
      required: [activity_id, occurred_at, display_status, attachment_count, move, version]
      properties:
        request_has_reminder:
          type: boolean
          description: An unfinished reminder covers this readable source request. This obligation fact names no private task, owner, or task content. Absent when the source is withheld.
        activity_id: {type: string, format: uuid}
        subject:
          type: [string, 'null']
          description: Null when the message has none, and when the content is withheld.
        preview:
          type: [string, 'null']
          description: |-
            One line of the sender's own text, signature and quoted history already removed.
            Null when withheld, and when the message has no text of its own.
        occurred_at: {type: string, format: date-time}
        direction: {type: [string, 'null'], enum: [null, inbound, outbound]}
        counterparty:
          type: [string, 'null']
          description: |-
            Who the message was with, named for the row: "Ana Sommer", or "Ana Sommer +2" when
            the exchange had more. Null when no participant resolves to a name this caller may
            see — the row then says the direction alone rather than inventing a stranger.
        counterparty_contact_id:
          type: string
          format: uuid
          description: |-
            The contact `counterparty` names, when the party it was taken from resolved to one
            this caller may see. Present so a client can key a face on the RECORD rather than on
            the phrase: the phrase cannot be turned back into a contact, and matching it by name
            is wrong in both directions — a contact renamed since capture stops matching and
            draws a second colour, and two contacts sharing a name cannot be told apart. Absent
            when the far side resolved to no contact, which is a face the client has nothing
            better to key than the words.
        attachment_count:
          type: integer
          description: How many files came with it. Zero when withheld, like every other count.
        move:
          type: string
          enum: [needs_reply, waiting_for_them, none]
          description: |-
            Whose move it is, derived from what this reader can see of the thread. `none` when
            the question cannot be answered honestly — an unanswerable move is not a claim.
        display_status:
          $ref: '#/components/schemas/EmailAccessStatus'
        delivery:
          allOf: [{$ref: '#/components/schemas/EmailDelivery'}]
          description: |-
            What happened to an outbound message, when this row is one and a delivery was
            staged for it. Absent on an inbound message, and on an outbound one logged
            rather than sent — neither has a delivery to report, which is a different
            thing from one that has not left yet.
        version:
          allOf: [{$ref: '#/components/schemas/RowVersion'}]
          description: |-
            The activity's version, carried so a row can open an editor that writes with
            If-Match. A row without it can only read.
    EmailDelivery:
      type: object
      required: [state]
      description: |-
        Whether an outbound message actually left, and why not when it did not.
      properties:
        state:
          type: string
          enum: [pending, sent, parked, bounced]
          description: |-
            What became of the message. `pending` is staged and not yet attempted — a real
            state a reader may see, and not the same as parked.
        reason:
          type: [string, 'null']
          description: |-
            Why it did not arrive, in the words it was recorded with — written for a human
            because a rep is the one who has to act on it. Null unless the state is `parked`
            or `bounced`.
        delivered_at:
          type: [string, 'null']
          format: date-time
          description: When the provider accepted it. Null unless the state is `sent`.
        files:
          type: array
          items: {$ref: '#/components/schemas/EmailDeliveryFile'}
          description: |-
            What the message was staged with, as it was at that moment. Empty when it carried
            nothing.
    EmailDeliveryFile:
      type: object
      required: [filename]
      description: One file a message was staged with, frozen at staging.
      properties:
        filename: {type: string}
        content_type: {type: [string, 'null']}
        byte_size:
          type: [integer, 'null']
          format: int64
    EmailAccessStatus:
      type: string
      enum: [workspace, team, participants, selected, withheld]
      description: |-
        What a reader is allowed to know about who else reads this message, in one word the
        badge can print.
    EmailParty:
      type: object
      description: One address on a message, resolved to a contact or a seat when it is one.
      required: [address]
      properties:
        address: {type: string}
        display_name: {type: [string, 'null']}
        contact_id:
          type: [string, 'null']
          format: uuid
          description: Set when the address belongs to a contact this caller may see.
        user_id:
          type: [string, 'null']
          format: uuid
          description: Set when the address belongs to a seat in this workspace.
    EmailAttachmentSummary:
      type: object
      description: One file that came with the message. Metadata only; bytes are fetched separately.
      required: [id, filename]
      properties:
        id: {type: string, format: uuid}
        filename: {type: string}
        byte_size: {type: [integer, 'null']}
        content_type: {type: [string, 'null']}
        bytes_withheld:
          type: boolean
          readOnly: true
          description: >-
            True when the message is private to its owner and the file was recorded by name, size and type only. There are no bytes to fetch.
    EmailAccess:
      type: object
      description: |-
        Who reads this message, and what this caller may do about that. `can_change` and
        `change_mode` are decided by the same authority that would execute the write, so a
        control this block offers is a control the write will accept.
      required: [content_state, display_status, can_change, change_mode]
      properties:
        content_state:
          type: string
          enum: [available, withheld]
        display_status:
          $ref: '#/components/schemas/EmailAccessStatus'
        audience:
          allOf: [{$ref: '#/components/schemas/ActivityAudience'}]
          nullable: true
        selected_members:
          type: array
          description: |-
            Who is named on a `selected` audience. Returned only to a caller who may both read
            the content and change it — a reader with no standing to edit the set has no
            standing to enumerate it either.
          items: {$ref: '#/components/schemas/AudienceMember'}
        can_change: {type: boolean}
        change_mode:
          type: string
          enum: [thread_contribution, message_audience, none]
          description: |-
            Which write this caller's Access control performs. `thread_contribution` changes
            only this owner's contribution to a captured thread; `message_audience` sets a
            hand-logged message's own audience. The browser never decides this by reading
            `captured_by` — the server knows which write it would accept.
        change_scope:
          type: string
          enum: [thread, message, none]
          description: What the editor must say it is about to change, in the words the user reads.
        explanation:
          type: [string, 'null']
          description: |-
            Why the message is limited, when the caller may know. Always null while the content
            is withheld: the reason describes the message.
    EmailThreadPage:
      type: object
      description: |-
        The rest of the conversation, newest first, as summaries. Bounded and paged rather
        than whole: a thread has no ceiling, and a drawer that fetched every message would
        make opening the newest one cost the whole history.
      required: [members]
      properties:
        members:
          type: array
          items: {$ref: '#/components/schemas/EmailSummary'}
        next_cursor:
          type: [string, 'null']
          description: Pass back as `thread_cursor` for the next page. Null when this is the last.
    EmailPresentation:
      type: object
      description: |-
        One email, composed for reading. The message and its parties come from the activity's
        own store; the access block is assembled from the same authority that performs the
        write, so what this says a caller may do is what the caller may do.
      required: [id, lifecycle, occurred_at, summary, access, version, from, to, cc, bcc, attachments, links, bcc_withheld, can_reply, can_relink]
      properties:
        id: {type: string, format: uuid}
        lifecycle:
          type: string
          enum: [delivered]
          description: |-
            What kind of message this is. One value today: this read serves delivered
            correspondence. A scheduled send and a draft awaiting approval will borrow the
            frame when the reads that serve them land, and they are not listed until then.
        occurred_at: {type: string, format: date-time}
        summary:
          $ref: '#/components/schemas/EmailSummary'
        body:
          type: [string, 'null']
          description: |-
            The message as plain text, normalised. Null when withheld. Provider payloads are
            never handed to a browser to parse.
        thread_key: {type: [string, 'null']}
        from:
          type: array
          items: {$ref: '#/components/schemas/EmailParty'}
        to:
          type: array
          items: {$ref: '#/components/schemas/EmailParty'}
        cc:
          type: array
          items: {$ref: '#/components/schemas/EmailParty'}
        bcc:
          type: array
          description: |-
            Empty for every caller but the seat that sent or imported the message. Being
            allowed to read what was written does not disclose who was copied blind.
          items: {$ref: '#/components/schemas/EmailParty'}
        bcc_withheld:
          type: boolean
          description: |-
            True when the message has blind recipients this caller may not see. The viewer says
            that they exist rather than showing an empty list that reads as none.
        attachments:
          type: array
          items: {$ref: '#/components/schemas/EmailAttachmentSummary'}
        links:
          type: array
          description: What the message is filed against, named for a reader.
          items: {$ref: '#/components/schemas/ActivityLink'}
        thread:
          $ref: '#/components/schemas/EmailThreadPage'
        access:
          $ref: '#/components/schemas/EmailAccess'
        can_reply: {type: boolean}
        can_relink: {type: boolean}
        version:
          allOf: [{$ref: '#/components/schemas/RowVersion'}]
          description: The activity's version, for the If-Match its own actions send.
    DedupeCandidate:
      type: object
      required: [id, entity_type, left_id, right_id, confidence, evidence, status, created_at, can_decide]
      properties:
        id: {type: string, format: uuid}
        entity_type: {type: string, enum: [contact, company, lead], description: 'A pair is always same-type: a lead is proposed as a duplicate of a lead or of nothing.'}
        left_id: {type: string, format: uuid, description: 'Canonical ordering: left is the lower id — {A,B} and {B,A} are one row.'}
        right_id: {type: string, format: uuid}
        confidence: {type: number, minimum: 0, maximum: 1}
        evidence:
          type: array
          description: 'Per-field agree/collide snapshot captured at detection: what the review queue renders, never re-derived against since-edited rows.'
          items:
            type: object
            required: [field, left_value, right_value, signal]
            properties:
              field: {type: string, description: 'full_name, company, domain, …'}
              left_value: {type: [string, 'null']}
              right_value: {type: [string, 'null']}
              signal: {type: string, description: 'agree | collide | one_sided'}
              score: {type: [number, 'null'], description: 'The field''s contribution where scored (e.g. name_sim).'}
        status: {type: string, enum: [open, merged, not_a_duplicate]}
        can_decide:
          type: boolean
          description: |-
            Whether THIS caller could dispose of the pair — merge it, dismiss it,
            or undo a decision. Deciding needs write authority over BOTH ends:
            dismissing suppresses both records as duplicates for the whole
            workspace, and merging rewrites one into the other.
        disposed_by: {type: [string, 'null'], format: uuid}
        disposed_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    DedupeDispositionRequest:
      type: object
      required: [disposition]
      properties:
        disposition: {type: string, enum: [merge, not_a_duplicate]}
        winner_id: {type: [string, 'null'], format: uuid, description: 'Required for merge: the surviving record — must be one of the pair.'}
    ImportObject:
      type: string
      enum: [company, lead, contact]
      description: |-
        What the file's rows are, and therefore what the run creates.
    CreateImportRunRequest:
      type: object
      required: [connector, object, source_ref, mapping]
      properties:
        connector: {type: string, enum: [csv], description: 'The source kind. The Salesforce connector runs the same engine and arrives with its own ticket.'}
        object: {$ref: '#/components/schemas/ImportObject'}
        source_ref: {type: string, description: 'From `uploadImportSource`.'}
        mapping:
          type: object
          additionalProperties: {type: string}
          description: |-
            `{source column → target field}`, as the human settled it. Validated against
            the object's live field catalog before the run is created.
        source_key:
          type: string
          description: |-
            The source column holding the row's stable id. For a row this run
            CREATES it is written to the row's provenance, so a re-uploaded file
            updates rather than duplicates and an undo can find what
            the run created. A row that names an existing record by
            `id` records nothing: the run did not create that company, and undo
            must not archive it.
        on_duplicate:
          $ref: '#/components/schemas/ImportOnDuplicate'
        context_tag_id:
          type: string
          format: uuid
          description: |-
            A tag applied to every record this run CREATES, so a batch stays
            findable as a batch — "the K5 conference list", "the January
            partner file".
    ImportOnDuplicate:
      type: string
      enum: [create, skip]
      default: create
      description: |-
        What to do with a row naming a record the estate ALREADY holds — found
        by the same dedupe ladder every create path runs, not by this
        importer's own memory of what it once wrote.
    ImportRunLinks:
      type: object
      description: |-
        The connections between records a run makes, counted apart from the rows
        it writes.
      required: [offered, applied]
      properties:
        offered:
          type: integer
          minimum: 0
          description: |-
            Links the file asks for. A dry run reports this and nothing else,
            because resolving an endpoint is a read the dry run has not done —
            it says how many rows named an employer, not how many will find one.
        applied:
          type: integer
          minimum: 0
          description: 'Links actually written. Zero on a dry run, which writes nothing.'
        unresolved:
          type: array
          description: |-
            The links that named something the run could not act on, each with
            the reason. Enumerated rather than counted, because the answer a
            contact needs is WHICH company was not found — that is the row of the
            spreadsheet they have to go and fix.
          items: {$ref: '#/components/schemas/ImportUnresolvedLink'}
    ImportUnresolvedLink:
      type: object
      required: [from, to, reason]
      properties:
        from: {type: string, description: 'The record the link starts at, by the key the file identified it with.'}
        to: {type: string, description: 'What the file named as the other end — a company name, not an id, because no id was found.'}
        reason: {type: string, description: 'Why it was not applied, in the words of the contact who made the file.'}
    ImportRunDisposition:
      type: object
      description: What the run will do, or did, counted per outcome. The four sum to the rows read — a disposition that does not add up is hiding something.
      required: [created, updated, unchanged, skipped]
      properties:
        created: {type: integer, minimum: 0}
        duplicates:
          type: integer
          minimum: 0
          description: |-
            Rows naming a record the estate already holds. NOT a fifth outcome
            and never added to the other four — each duplicate is already
            counted in `created` (it lands and files a review pair) or in
            `skipped` (when the run asked for `on_duplicate: skip`). It is the
            number a human needs before approving: "100 companies, 94 of them
            already here" is a different decision from "100 new companies".
        updated: {type: integer, minimum: 0, description: 'Rows matched to an existing record whose mapped values differ. An editable source re-imported after a correction lands here — this is not the frozen-snapshot case, where a match can never differ.'}
        unchanged: {type: integer, minimum: 0, description: 'Matched, and every mapped value already equal. Counted separately from `updated` because reporting work that never happened inflates both the report and the audit trail.'}
        skipped: {type: integer, minimum: 0}
    ImportRowIssue:
      type: object
      description: One row the import could not take, named by its line so a human can go fix it.
      required: [line, reason]
      properties:
        line: {type: integer, minimum: 1, description: 'The line in the uploaded file, counting the header as line 1.'}
        column: {type: [string, 'null'], description: 'The offending column, when one is to blame.'}
        reason: {type: string, description: 'What is wrong, in terms of the file the human uploaded — never a database or driver message.'}
    ImportRunReport:
      type: object
      description: |-
        The same shape before and after approval: a dry run reports what the
        commit will do, a finished run reports what it did.
      required: [run_id, status, rows_read, disposition, issues, source_key_used]
      properties:
        run_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ImportRunStatus'}
        rows_read: {type: integer, minimum: 0}
        disposition: {$ref: '#/components/schemas/ImportRunDisposition'}
        issues:
          type: array
          items: {$ref: '#/components/schemas/ImportRowIssue'}
          description: 'Row-level refusals, enumerated. A file half-ignored under a success message is worse than a refusal.'
        source_key_used:
          type: string
          description: 'Which column identified a row for idempotency — the request''s `source_key`, or the natural key chosen in its absence. Stated because the whole re-run guarantee rests on it.'
        mapping:
          type: object
          additionalProperties: {type: string}
          description: '`{source column → target field}` as the run was staged with it, after validation — the same shape the create request''s `mapping` takes. A report says where each column went, not only how many rows landed. Absent for a run that carries no mapping.'
        links:
          $ref: '#/components/schemas/ImportRunLinks'
        estimated_duration_seconds:
          type: [integer, 'null']
          description: 'A dry run''s estimate for the commit. Null when the run has already finished and the real duration is on the run record.'
        undo:
          allOf: [{$ref: '#/components/schemas/ImportUndoReport'}]
          description: 'Present once the run has been undone; absent otherwise.'
    ImportRunStatus:
      type: string
      enum: [pending, validating, awaiting_approval, running, complete, failed, undoing, undone]
      description: |-
        `failed` is resumable, not terminal: the run
        carries the checkpoint it stopped at, and resuming continues from
        there rather than re-reading the file from the top. `undoing`/`undone` are the reversal's own states, reachable only from
        `complete` and only for the `csv` connector.
    ImportUndoReport:
      type: object
      description: |-
        The result of undoing a committed import run. Every
        import-created row lands in exactly one of three buckets: reversed,
        kept because a human edited it since, or errored
        because it could not be reversed — a single irreversible row never
        aborts the rest of the run.
      required: [run_id, status, reversed_count, kept, errored]
      properties:
        run_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ImportRunStatus'}
        reversed_count: {type: integer, minimum: 0, description: 'Import-created rows that were untouched since and have been reversed (archived).'}
        updates_not_reversed:
          type: integer
          minimum: 0
          description: >-
            Rows this run corrected rather than created, which undo leaves corrected. A row count, from the run's own report: two rows naming one record count twice. Absent or zero means the run corrected nothing, and what it did reverse is `reversed_count`, `kept` and `errored`.
        kept:
          type: array
          description: 'Import-created rows a human edited since import, therefore left in place (A93).'
          items:
            type: object
            required: [object, id]
            properties:
              object: {$ref: '#/components/schemas/ImportObject'}
              id: {type: string, format: uuid}
        errored:
          type: array
          description: |-
            Import-created rows the reversal could not archive (a business
            rule refused it, or the caller's row scope no longer covers it) —
            left exactly as they stood, named with why, rather than the
            whole run aborting on one row it cannot process.
          items:
            type: object
            required: [object, id, reason]
            properties:
              object: {$ref: '#/components/schemas/ImportObject'}
              id: {type: string, format: uuid}
              reason: {type: string, description: 'What kept it from reversing, in terms the operator can act on — never a database or driver message.'}
    ImportRun:
      type: object
      required: [id, connector, object, status, checkpoint, source, captured_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        connector: {type: string, enum: [csv, salesforce]}
        object: {$ref: '#/components/schemas/ImportObject'}
        status: {$ref: '#/components/schemas/ImportRunStatus'}
        checkpoint: {type: integer, minimum: 0, description: 'What a resume continues from.'}
        error: {type: [string, 'null'], description: 'Why a failed run stopped, in the uploader''s terms. Never a driver or SQL message.'}
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal; never client-supplied.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Problem:
      type: object
      description: RFC 7807 problem+json with a stable machine `code` and structured `details`.
      required: [status, code]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
          description: A URI identifying the problem type.
        title: {type: string, description: 'Short, human-readable summary.'}
        status: {type: integer, description: HTTP status code.}
        code:
          type: string
          description: Stable machine-readable error code (e.g. duplicate_email, validation_error).
        detail: {type: string, description: Human-readable explanation for this occurrence.}
        instance: {type: string, format: uri, description: URI of the specific occurrence.}
        details:
          type: object
          additionalProperties: true
          description: |-
            Structured machine context — e.g. `existing_id` on 409 duplicate, or an
            `errors` array of `{ field, code, message }` on 422 validation.
    PageInfo:
      type: object
      required: [has_more]
      properties:
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor for the next page, or null if none.
        has_more: {type: boolean}
        total:
          type: integer
          minimum: 0
          description: >-
            How many rows match this request in total, ignoring the cursor and the page size — what the reader is told the list holds. Optional because a keyset page does not need one: a list that omits it says it does not count, never that it counted zero, so a client reads absence as unknown and falls back to how many rows it has loaded. Where it is sent it is exact rather than an estimate, counted over the same filters and the same row scope as the page beside it, in the same transaction, so the two cannot disagree about what matching means.
    Address:
      type: [object, 'null']
      description: Structured postal address.
      properties:
        line1: {type: [string, 'null']}
        line2: {type: [string, 'null']}
        city: {type: [string, 'null']}
        region: {type: [string, 'null']}
        postal_code: {type: [string, 'null']}
        country: {type: [string, 'null'], description: ISO-3166 alpha-2.}
      additionalProperties: true
    Money:
      type: object
      description: Money as integer minor-units + ISO-4217 currency. Never a float.
      properties:
        amount_minor:
          type: [integer, 'null']
          format: int64
          description: Smallest currency unit (e.g. cents). 100000 EUR-cents = €1,000.00.
        currency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
          description: ISO-4217 uppercase.
    ContactEmail:
      type: object
      required: [id, email, email_type, is_primary, position, source, captured_by]
      properties:
        id: {type: string, format: uuid}
        contact_id: {type: string, format: uuid}
        email: {type: string, format: email, description: Stored lowercased.}
        email_type: {type: string, enum: [work, personal, other], default: work}
        is_primary: {type: boolean, default: false, description: At most one primary per type (DB-enforced).}
        position: {type: integer, default: 0, description: Explicit ordering.}
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal (human:<uuid> | agent:<id> | connector:<name>); never client-supplied.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    ContactPhone:
      type: object
      required: [id, phone, phone_type, is_primary, position, source, captured_by]
      properties:
        id: {type: string, format: uuid}
        contact_id: {type: string, format: uuid}
        phone: {type: string, description: E.164 normalized.}
        phone_type: {type: string, enum: [work, mobile, home, other], default: work}
        is_primary: {type: boolean, default: false}
        position: {type: integer, default: 0}
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal (human:<uuid> | agent:<id> | connector:<name>); never client-supplied.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    ContactReachability:
      type: object
      required: [provider, reachable, since]
      properties:
        provider: {$ref: '#/components/schemas/ProviderRef'}
        reachable: {type: boolean}
        since:
          type: string
          format: date-time
          description: When the current state took hold — the block timestamp while unreachable, otherwise when the identity was first established.
    RelationshipStrength:
      type: object
      description: |-
        Deterministic relationship-strength — a transparent function over captured
        interaction features (recency, frequency, direction, reciprocity), NOT a trained model. A fixed
        interaction set + fixed clock yields a stable value (P6/P12). The `factors` decompose the score and
        `contributing_activity_ids` are the receipts, so the UI can show its inputs — no mystery number.
      required: [score, bucket, factors]
      properties:
        score: {type: integer, minimum: 0, maximum: 100, description: 0..100 composite.}
        bucket: {type: string, enum: [none, weak, moderate, strong], description: Coarse band derived from score for display — the same vocabulary every strength band on the wire uses.}
        factors:
          type: object
          description: The 0..1 sub-scores the composite was built from (the explanation).
          required: [recency, frequency, reciprocity, direction]
          properties:
            recency: {type: number, minimum: 0, maximum: 1}
            frequency: {type: number, minimum: 0, maximum: 1}
            reciprocity: {type: number, minimum: 0, maximum: 1}
            direction: {type: number, minimum: 0, maximum: 1}
        contributing_activity_ids:
          type: array
          items: {type: string, format: uuid}
          description: The activities the score was computed from (the receipts behind the number).
        contributing_activities:
          type: array
          readOnly: true
          description: >-
            The same receipts, named. In the order they were counted, and omitting an id this reader cannot discover at all — so the list can be SHORTER than `contributing_activity_ids`, which stays the count. A number that shrank to what one reader may open would tell two readers different things about one score.
          items: {$ref: '#/components/schemas/ActivityReference'}
        computed_at: {type: string, format: date-time, description: When this value was last recomputed (fixed-clock reproducible).}
        last_interaction: {type: [string, 'null'], format: date-time, description: Timestamp of the most recent qualifying interaction; null when there are none.}
        inbound_90d: {type: integer, minimum: 0, description: Count of qualifying inbound interactions in the trailing 90-day window.}
        outbound_90d: {type: integer, minimum: 0, description: Count of qualifying outbound interactions in the trailing 90-day window.}
    ActivityReference:
      type: object
      description: |-
        One activity a derived number was computed from, named well enough to be
        recognised and opened.
      required: [activity_id, kind, occurred_at, content_state]
      properties:
        activity_id: {type: string, format: uuid}
        kind:
          type: string
          enum: [email, call, meeting, note, task, message]
          description: >-
            What KIND of activity it is, so a client dispatches on it: an email opens the drawer, a task opens the task detail, anything else opens the activity itself.
        subject:
          type: [string, 'null']
          description: >-
            The activity's own subject line. Null when it has none, and when the content is not this reader's — the two are told apart by `content_state`, never by this field being empty.
        occurred_at: {type: string, format: date-time}
        content_state:
          type: string
          enum: [available, withheld]
          description: >-
            Whether this reader may read what the activity says. The same vocabulary `ActivityAccess.content_state` uses, because it is the same question about the same row.
        email_summary:
          allOf: [{$ref: '#/components/schemas/EmailSummary'}]
          readOnly: true
          nullable: true
          description: >-
            The canonical email row, present exactly when this activity is an email this reader may receive a summary of. A client renders it the way every other surface renders a cited message, and opens the same drawer.
    Provider:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      maxLength: 32
      description: |-
        A licensed data provider registered in THIS installation; the domain/run contract
        remains provider-neutral. Deliberately a pattern-constrained string rather than an
        enum, for the reason `ProviderRef` gives for messaging transports: which providers
        exist is a deployment fact — what this binary composed — so an enum would assert
        that the legal set is identical everywhere, which is false. The registry refuses a
        name no adapter is compiled for, and `GET /v1/provider-connections` resolves the
        live set.
    Contact:
      type: object
      description: A contact. Mirrors the `contact` table.
      required: [id, full_name, source, captured_by, created_at, updated_at]
      properties:
        legal_hold:
          type: boolean
          readOnly: true
          description: >-
            True while a litigation or investigation hold is preserving this record. A held record is never acted on by a retention sweep and an Art. 17 erasure against it is refused, so a screen that offers either action has to know. Placed and lifted through /retention/legal-holds, never by an ordinary edit.
        tags: {type: array, items: {$ref: '#/components/schemas/RowTag'}}
        id: {type: string, format: uuid}
        first_name: {type: [string, 'null']}
        last_name: {type: [string, 'null']}
        full_name: {type: string, description: Always present (display name).}
        title: {type: [string, 'null'], description: Denormalized current title; authoritative title is on the employment relationship.}
        employer:
          readOnly: true
          description: >-
            Where this contact works TODAY: their current primary employment edge, resolved to the account it names. History is not here — the full career ribbon is `contact_360.employments`, and a past employer never appears in this field. Absent is not "works nowhere": the field is also absent when the caller may not read relationship edges (an edge discloses its endpoints as a PAIR, which the grant on the contact does not cover) or when the employer sits outside their company row scope. A reader is told who somebody works for or nothing at all, never a company they have no grant for.
          allOf: [{$ref: '#/components/schemas/ContactEmployer'}]
        owner_id: {type: [string, 'null'], format: uuid}
        visibility:
          type: string
          enum: [workspace, owner]
          readOnly: true
          description: >-
            Who this record is for. `workspace` is every seat that holds the read grant. `owner` is capture privacy: a connector made this record from a message nothing had judged yet, and it belongs to the mailbox owner alone until something does — not to their team, their manager, or an admin. You are only ever sent a row you may already read, so this discloses nothing new; it says WHY you can see it, which is what lets a page tell "private to you" from "shared with everybody" instead of leaving the owner to guess. An `owner` row reaches the workspace through a verdict or through the owner's own `POST /contacts/{id}/publish`, and never travels back.
        writable:
          type: boolean
          readOnly: true
          description: >-
            Whether THIS caller may change THIS row: the same question the server's write gate answers on a mutation — the owner, the owner's team where the role is team-scoped, a live `write` record grant, or an unbounded seat. Server-computed per row, per caller. It is a UX signal, never the enforcement. A client uses it to draw or withhold edit affordances so a reader is not offered a control the save would refuse; the server refuses an unauthorized write with 403 whatever this said. Absent means NOT writable, so a client reading a response from a server too old to send it fails closed.
        social:
          type: object
          additionalProperties: true
          description: '{ linkedin, twitter, github, ... }'
        address: {$ref: '#/components/schemas/Address'}
        emails:
          type: array
          items: {$ref: '#/components/schemas/ContactEmail'}
        primary_email:
          type: [string, 'null']
          format: email
          readOnly: true
          description: >-
            The one address this contact is reachable at, chosen by the server: the primary one if they have one, else the first live address in the order `emails` is sent in. Null when every address is archived, or when they have none.
        phones:
          type: array
          items: {$ref: '#/components/schemas/ContactPhone'}
        bought_fields:
          type: array
          readOnly: true
          description: >-
            Which of this contact's values a data provider's purchase put there and which still hold what it wrote. A value a colleague has since edited, replaced or archived is not listed, and neither is one "Delete bought data" took back. Sent on the single-contact read (and so on the 360), never on a list. An employment is listed only when the caller may see that employment edge and its company.
          items: {$ref: '#/components/schemas/BoughtField'}
        reachability:
          type: array
          readOnly: true
          description: |-
            Exposes `{provider, reachable, since}` only — the channel account id (an opaque
            third-party identifier) stays out of this broad read; a governed surface owns it.
            A blocked identity still appears here, with `reachable: false`, so the record keeps
            showing that a conversation exists even when a reply cannot currently be delivered.
          items: {$ref: '#/components/schemas/ContactReachability'}
        consent:
          type: array
          readOnly: true
          description: |-
            Per-purpose consent summary. The single flat `consent_state` flag was
            REMOVED — consent is per-purpose and demonstrable. Mutate via
            `POST /contacts/{id}/consent`; read the full proof log via `GET /contacts/{id}/consent`.
          items: {$ref: '#/components/schemas/ContactConsentState'}
        merged_into_id: {type: [string, 'null'], format: uuid, description: Set when this row was merged away.}
        converted_from_lead_id: {type: [string, 'null'], format: uuid, description: Canonical origin pointer if promoted from a lead.}
        strength: {allOf: [{$ref: '#/components/schemas/RelationshipStrength'}], readOnly: true, description: 'Deterministic relationship-strength. Read-only derived view; NULL until capture has interactions. No mystery number — the factors + contributing activities are the explanation.'}
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal (human:<uuid> | agent:<id> | connector:<name>); never client-supplied.'}
        author:
          allOf: [{$ref: '#/components/schemas/SourceAuthor'}]
          readOnly: true
          nullable: true
          description: >-
            Who created this contact in the system it came FROM, present only on a record imported from another system whose importer named the author. Null on everything else, which is most rows: a contact somebody entered here has no author but the one `captured_by` already names.
        raw: {type: [object, 'null'], additionalProperties: true}
        version: {$ref: '#/components/schemas/RowVersion'}
        last_activity_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: >-
            When something last happened with this contact: the newest `occurred_at` of an activity linked to it, maintained on the activity write as `deal.last_activity_at` is (a read accelerator that a rebuild must reproduce). NULL until the first linked activity. Sortable.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
      additionalProperties: true
    BoughtField:
      type: object
      description: One value on a contact that a data provider's purchase wrote and still owns.
      required: [target, provider, applied_at]
      properties:
        target:
          type: string
          description: >-
            Which value: `title`, `linkedin`, `email:<contact email id>`, `phone:<contact phone id>` or `employment:<relationship id>`. Keyed by row id for the repeatable values, because a contact may hold several and only the row the purchase wrote is bought.
        provider: {$ref: '#/components/schemas/Provider'}
        applied_at: {type: string, format: date-time, description: When the purchase wrote it.}
    ContactEmployer:
      type: object
      description: >-
        The account a contact works at today, by their current primary employment edge — the one `uq_rel_current_primary_employer` keeps unique per contact, so a contact has at most one.
      required: [company_id, company_name]
      properties:
        company_id: {type: string, format: uuid}
        company_name: {type: string}
    CreateContactRequest:
      type: object
      required: [full_name, source]
      properties:
        full_name: {type: string}
        first_name: {type: [string, 'null']}
        last_name: {type: [string, 'null']}
        title: {type: [string, 'null']}
        owner_id: {type: [string, 'null'], format: uuid}
        social: {type: object, additionalProperties: true}
        address: {$ref: '#/components/schemas/Address'}
        emails:
          type: array
          items: {$ref: '#/components/schemas/ContactEmailInput'}
        phones:
          type: array
          items: {$ref: '#/components/schemas/ContactPhoneInput'}
        source: {type: string}
        source_system: {type: [string, 'null'], description: 'Which external system this record came from, when a caller imported it.'}
        source_author_id: {type: [string, 'null'], format: uuid, description: 'Who wrote this record in the system it came from, when the author holds a seat here. Written only by a declared importer, only beside a source_system; either author field or both may be sent, and the seat''s current name wins on read. captured_by still names the caller.'}
        source_author_name: {type: [string, 'null'], maxLength: 200, description: 'The source system''s own spelling of who wrote this record. Same door as source_author_id: a declared importer only, beside a source_system. Kept when a seat is also named, so the name survives the seat.'}
      additionalProperties: true
    ContactEmailInput:
      type: object
      description: |-
        One address on a contact, as a writer supplies it. One schema for create and update,
        so the two cannot describe an address differently.
      required: [email]
      properties:
        email: {type: string, format: email}
        email_type: {type: string, enum: [work, personal, other], default: work}
        is_primary: {type: boolean, default: false}
        position: {type: integer, default: 0}
    ContactPhoneInput:
      type: object
      description: |-
        One phone number on a contact, as a writer supplies it. One schema for create and
        update, so the two cannot describe a number differently.
      required: [phone]
      properties:
        phone: {type: string}
        phone_type: {type: string, enum: [work, mobile, home, other], default: work}
        is_primary: {type: boolean, default: false}
        position: {type: integer, default: 0}
    UpdateContactRequest:
      type: object
      description: Partial update. Omitted fields are unchanged.
      properties:
        full_name: {type: string}
        first_name: {type: [string, 'null']}
        last_name: {type: [string, 'null']}
        title: {type: [string, 'null']}
        owner_id: {type: [string, 'null'], format: uuid}
        visibility:
          type: string
          enum: [workspace, owner]
          description: |-
            Who may see this contact: `workspace` for everyone in the company,
            `owner` for the contact named by `owner_id` alone.
        social: {type: object, additionalProperties: true}
        address: {$ref: '#/components/schemas/Address'}
        emails:
          type: array
          items: {$ref: '#/components/schemas/ContactEmailInput'}
          description: |-
            REPLACES the contact's addresses with exactly this list, which is what a
            correction needs: a bounced address is fixed by sending the set that should
            stand, and an append-only field could never remove the one that is dead.
        phones:
          type: array
          items: {$ref: '#/components/schemas/ContactPhoneInput'}
          description: |-
            REPLACES the contact's numbers with exactly this list, the same way `emails`
            replaces addresses. A number that has been reassigned is corrected by sending
            the set that should stand; an append-only field could never remove the one
            that now reaches somebody else.
      additionalProperties: true
    ContactListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Contact'}
        page: {$ref: '#/components/schemas/PageInfo'}
    CompanyDomain:
      type: object
      required: [id, domain, is_primary, source, captured_by]
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        domain: {type: string, description: 'Lowercased, no scheme, no www.'}
        is_primary: {type: boolean, default: false}
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal (human:<uuid> | agent:<id> | connector:<name>); never client-supplied.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    ComputedField:
      type: object
      description: |-
        `computable: false` +
        `reason` is the honest floor for a field with no backend data model yet — the row is
        still returned, never omitted or fabricated.
      required: [key, label, kind, formula_sql, dependencies, computable]
      properties:
        key: {type: string}
        label: {type: string}
        kind:
          type: string
          enum: [currency_minor, count, duration_months, percent]
        value_minor:
          type: [integer, 'null']
          format: int64
          description: Present (and non-null) only when kind=currency_minor and computable=true.
        value:
          type: [number, 'null']
          description: Present (and non-null) only when kind is count/duration_months/percent and computable=true.
        formula_sql:
          type: string
          description: The literal GENERATED-column/view SQL definition; empty string when computable=false.
        dependencies:
          type: array
          items: {type: string}
        computable: {type: boolean}
        reason:
          type: [string, 'null']
          description: Set (non-null) iff computable=false, e.g. "not_yet_built", "awaiting_fx".
    Company:
      type: object
      description: A company. Mirrors the `company` table.
      required: [id, display_name, source, captured_by, created_at, updated_at]
      properties:
        legal_hold:
          type: boolean
          readOnly: true
          description: >-
            True while a litigation or investigation hold is preserving this record. A held record is never acted on by a retention sweep and an Art. 17 erasure against it is refused, so a screen that offers either action has to know. Placed and lifted through /retention/legal-holds, never by an ordinary edit.
        tags: {type: array, items: {$ref: '#/components/schemas/RowTag'}}
        linkedin_url:
          type: [string, 'null']
          description: Canonical LinkedIn company URL. A validated column rather than a governed custom field, because it bears identity semantics — matching, dedupe, enrichment — a custom field cannot express. Unique among live rows.
          pattern: '^https://([a-z]{2,3}\.)?linkedin\.com/company/[^/?#]+/?$'
        website_url:
          type: [string, 'null']
          readOnly: true
          description: The company's readable website, DERIVED from its primary domain row. Not accepted on write.
        id: {type: string, format: uuid}
        display_name: {type: string}
        is_anchor:
          type: boolean
          readOnly: true
          description: |-
            True only for this installation's own company.
            It is one ordinary company, reachable by id everywhere, but the surfaces that answer
            *which companies are we selling to* exclude it unless `include_anchor` is set, and it
            cannot be archived or merged. A caller that offers company actions should tell it apart.
        legal_name: {type: [string, 'null']}
        description:
          type: [string, 'null']
          maxLength: 500
          description: >-
            One human-written line saying what the company does, shown under the title on the company page. A column rather than a governed custom field for the same reason `linkedin_url` is one: it is part of what a company IS and every installation wants it. Distinct from `industry` (a category) and from the dossier (agent-written prose).
        industry: {type: [string, 'null']}
        size_band:
          type: [string, 'null']
          enum: [null, '1-10', '11-50', '51-200', '201-500', '501-1000', '1001-5000', '5000+']
        address: {$ref: '#/components/schemas/Address'}
        owner_id: {type: [string, 'null'], format: uuid}
        visibility:
          type: string
          enum: [workspace, owner]
          readOnly: true
          description: >-
            Who this record is for. `workspace` is every seat that holds the read grant. `owner` is capture privacy: a connector made this record from a message nothing had judged yet, and it belongs to the mailbox owner alone until something does — not to their team, their manager, or an admin. You are only ever sent a row you may already read, so this discloses nothing new; it says WHY you can see it, which is what lets a page tell "private to you" from "shared with everybody" instead of leaving the owner to guess. An `owner` row reaches the workspace through a sender verdict, or through `visibility` on `PATCH /companies/{id}`, which moves it BOTH ways for anybody the write gate admits. Read-only HERE, on the read schema, the same as the contact column beside it: the update request carries the writable copy.
        writable:
          type: boolean
          readOnly: true
          description: >-
            Whether THIS caller may change THIS row: the same question the server's write gate answers on a mutation — the owner, the owner's team where the role is team-scoped, a live `write` record grant, or an unbounded seat. Server-computed per row, per caller. It is a UX signal, never the enforcement. A client uses it to draw or withhold edit affordances so a reader is not offered a control the save would refuse; the server refuses an unauthorized write with 403 whatever this said. Absent means NOT writable, so a client reading a response from a server too old to send it fails closed.
        parent_company_id: {type: [string, 'null'], format: uuid, description: Single-level hierarchy FK; no cycles.}
        merged_into_id: {type: [string, 'null'], format: uuid}
        computed_fields:
          type: array
          readOnly: true
          description: |-
            Populated on
            `getCompany` only; the key is absent entirely (not an empty array) when the
            viewer's role lacks computed_field:read visibility.
          items: {$ref: '#/components/schemas/ComputedField'}
        domains:
          type: array
          items: {$ref: '#/components/schemas/CompanyDomain'}
        lifecycle:
          type: string
          enum: [unknown, target, prospect, opportunity, customer, former_customer, disqualified]
          description: >-
            Where the account stands with us. Single-valued: an account is at one point in a sales motion at a time. `unknown` is the default and means it — the retired `classification` defaulted to `prospect` and, having no writer, rendered that default on every unassessed account as though someone had judged it.
        relationship_types:
          type: array
          items: {type: string, enum: [customer, partner, supplier, investor, portfolio_company, competitor, other]}
          description: >-
            WHAT THE COMPANY IS to us. Multi-valued, because a company is legitimately several things at once — the partner program is built on companies that are simultaneously partners and customers. A company IS a partner iff it carries `partner` here AND has a `partner` row; removing the type while that row lives is refused (422).
        logo_url:
          type: [string, 'null']
          readOnly: true
          description: |-
            Where to fetch the company's logo image (A55) — the `getCompanyLogo`
            path for this record, cookie-authenticated and same-origin. A revision query changes
            with the stored image so a replacement cannot remain hidden behind an older cached
            response. The key is ABSENT entirely (not null) when no logo is stored, which is the
            common case and never an error: a client renders the deterministic monogram then,
            so it never shows a broken image or an empty slot.
            The stored object key is deliberately not exposed; it names a bucket path, and a
            client's business is the endpoint that streams the bytes.
        strength: {allOf: [{$ref: '#/components/schemas/RelationshipStrength'}], readOnly: true, description: 'Deterministic company-level relationship-strength roll-up. Read-only derived view; NULL until capture has interactions.'}
        contact_count:
          type: integer
          readOnly: true
          minimum: 0
          description: >-
            How many live contacts THE CALLER MAY SEE list this account as their current primary employer. Counted under the caller's contact row scope, exactly as the contact list is: a count is a read, and a number that moved when a colleague captured a private contact would disclose that contact. Present, zero included, on `listCompanies` and `getCompany` — the reads that render the column, and ABSENT entirely for a role without `contact:read` OR without `relationship:read` (the object grants come first, as on the contact list) — the number is a fact about the employment PAIRS, so the edge grant governs it exactly as it governs the employment list; write responses (create, update, archive, merge) omit it. Never client-supplied.
        open_deal_count:
          type: integer
          readOnly: true
          minimum: 0
          description: >-
            How many open, live deals belong to this account, counted across the WHOLE workspace — the same population the account's `computed_fields` open-pipeline row sums. The key is ABSENT entirely, not 0, for a role without `deal:read` or without `computed_field:read`. Present on `listCompanies` and `getCompany`; write responses omit it.
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal (human:<uuid> | agent:<id> | connector:<name>); never client-supplied.'}
        author:
          allOf: [{$ref: '#/components/schemas/SourceAuthor'}]
          readOnly: true
          nullable: true
          description: >-
            Who created this company in the system it came FROM, present only on a record imported from another system whose importer named the author. Null on everything else, which is most rows: a company somebody entered here has no author but the one `captured_by` already names.
        raw: {type: [object, 'null'], additionalProperties: true}
        partner: {$ref: '#/components/schemas/Partner'}
        version: {$ref: '#/components/schemas/RowVersion'}
        last_activity_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: >-
            When something last happened with this account: the newest `occurred_at` of a workspace-audience activity linked to it, maintained on the activity write as `deal.last_activity_at` is (a read accelerator that a rebuild must reproduce). NULL until the first such activity. Sortable.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
      additionalProperties: true
    CompanyDomainInput:
      type: object
      description: A client-supplied domain row on create/update. Closed — server-owned fields (id, source, captured_by) are never accepted from the request body.
      required: [domain]
      additionalProperties: false
      properties:
        domain: {type: string}
        is_primary: {type: boolean, default: false}
    CreateCompanyRequest:
      type: object
      required: [display_name, source]
      properties:
        display_name: {type: string}
        legal_name: {type: [string, 'null']}
        description: {type: [string, 'null'], maxLength: 500, description: One human-written line saying what the company does.}
        industry: {type: [string, 'null']}
        size_band: {type: [string, 'null'], enum: [null, '1-10', '11-50', '51-200', '201-500', '501-1000', '1001-5000', '5000+']}
        address: {$ref: '#/components/schemas/Address'}
        owner_id: {type: [string, 'null'], format: uuid}
        parent_company_id: {type: [string, 'null'], format: uuid}
        domains:
          type: array
          items: {$ref: '#/components/schemas/CompanyDomainInput'}
        source: {type: string}
        source_system: {type: [string, 'null'], description: 'Which external system this record came from, when a caller imported it.'}
        source_author_id: {type: [string, 'null'], format: uuid, description: 'Who wrote this record in the system it came from, when the author holds a seat here. Written only by a declared importer, only beside a source_system; either author field or both may be sent, and the seat''s current name wins on read. captured_by still names the caller.'}
        source_author_name: {type: [string, 'null'], maxLength: 200, description: 'The source system''s own spelling of who wrote this record. Same door as source_author_id: a declared importer only, beside a source_system. Kept when a seat is also named, so the name survives the seat.'}
      additionalProperties: true
    UpdateCompanyRequest:
      type: object
      properties:
        linkedin_url:
          type: [string, 'null']
          description: Canonical LinkedIn company URL. Null clears it. website_url is derived and refused here.
          pattern: '^https://([a-z]{2,3}\.)?linkedin\.com/company/[^/?#]+/?$'
        display_name: {type: string}
        legal_name: {type: [string, 'null']}
        description: {type: [string, 'null'], maxLength: 500, description: 'One human-written line saying what the company does. Absent leaves it untouched; an empty string clears it, the same spelling every other nullable text field on this record uses.'}
        industry: {type: [string, 'null']}
        size_band: {type: [string, 'null'], enum: [null, '1-10', '11-50', '51-200', '201-500', '501-1000', '1001-5000', '5000+']}
        address: {$ref: '#/components/schemas/Address'}
        owner_id: {type: [string, 'null'], format: uuid}
        parent_company_id: {type: [string, 'null'], format: uuid}
        domains:
          type: array
          description: Replace-set of the company's live domains (add new, archive removed, flip is_primary). Absent = untouched; an empty array clears all domains.
          items: {$ref: '#/components/schemas/CompanyDomainInput'}
        visibility:
          type: string
          enum: [workspace, owner]
          description: |-
            Who may see this company: `workspace` for everyone holding the read grant, `owner` for
            the seat named by `owner_id` alone. Absent = untouched.
        lifecycle:
          type: string
          enum: [unknown, target, prospect, opportunity, customer, former_customer, disqualified]
          description: Where the account stands with us. Absent = untouched.
        relationship_types:
          type: array
          description: >-
            Replace-set of what the company is to us (add new, archive removed), the same shape as `domains`. Absent = untouched; an empty array clears every type. Removing `partner` while the company still has a `partner` extension row is refused with 422 — the invariant binds both ways, and an invariant nothing enforces is a comment.
          items: {type: string, enum: [customer, partner, supplier, investor, portfolio_company, competitor, other]}
      additionalProperties: true
    CompanyListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Company'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    CompanyHierarchyRollup:
      type: object
      description: |-
        The account-tree roll-up over company.parent_company_id. A server read only,
        never client-summed. Money is base-currency converted — never a raw
        cross-currency sum.
      required: [root_id, scope, weighted_pipeline, closed_won, activity_count_30d, aggregated_account_count, restricted_excluded, computed_at]
      properties:
        root_id: {type: string, format: uuid}
        scope: {type: string, enum: [tree, self]}
        weighted_pipeline: {$ref: '#/components/schemas/Money'}
        closed_won: {$ref: '#/components/schemas/Money'}
        activity_count_30d: {type: integer}
        aggregated_account_count: {type: integer, description: Count of accounts (nodes) included in the roll-up.}
        restricted_excluded:
          type: array
          description: Nodes excluded because the viewer cannot read them — disclosed, never a silent drop.
          items:
            type: object
            required: [id, display_name]
            properties:
              id: {type: string, format: uuid}
              display_name: {type: string}
        computed_at: {type: string, format: date-time}
    CompanyStrength:
      description: |-
        A separate
        schema from the contact-facing `RelationshipStrength` because those two extra
        facts are meaningless on a contact.
      allOf:
        - $ref: '#/components/schemas/RelationshipStrength'
        - type: object
          required: [contact_count]
          properties:
            contributor_contact_id:
              type: [string, 'null']
              format: uuid
              description: |-
                The contact whose score this is. Null when the account has no contact the
                caller can read — the roll-up is taken over visible contacts only, so a
                score that exists always has a nameable contributor behind it.
            contact_count:
              type: integer
              minimum: 0
              description: How many current contacts of this account the caller can see and the score was chosen from.
    ProjectScope:
      type: object
      description: |-
        What a read narrowed to one project reports about the narrowing, so a surface can
        say "Scoped to KEY · N of M activities" from the server's own count rather than
        guessing. Present only when the request named a `project_id`.
      required: [project_id, name]
      properties:
        project_id: {type: string, format: uuid}
        name: {type: string}
        key: {type: [string, 'null'], description: 'The subject-line handle, when the project has one.'}
        in_scope: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
    WrittenBy:
      type: string
      enum: [model, deterministic]
      description: |-
        Which writer produced a piece of generated prose. `model` — the configured model
        lane. `deterministic` — the structured fallback, used when no lane is configured
        or the workspace's AI budget is exhausted. Never silently interchangeable: a
        reader deciding how much to trust a sentence needs to know which wrote it.
    CompanyBriefSentence:
      type: object
      required: [text, evidence]
      properties:
        text: {type: string}
        nature:
          type: string
          enum: [fact, assessment, recommendation]
          description: |-
            What KIND of claim this is, so the reader can tell a record from a reading of it.
            Absent means `fact` — the shape every sentence had before assessments existed.
        evidence:
          type: array
          description: |-
            The records this sentence was written from — always records the reader can
            already open, because the brief was assembled under their own row scope.
          items: {$ref: '#/components/schemas/CompanyBriefEvidence'}
    CompanyBriefEvidence:
      type: object
      description: One record a brief sentence was written from.
      required: [entity_type, entity_id]
      properties:
        entity_type: {type: string, enum: [deal, activity, contact, company, fact, profile_field]}
        entity_id: {type: string, format: uuid}
        name:
          type: string
          description: |-
            The record's own display name, when the writer had it at hand — a
            deal's name, an activity's subject. Absent for evidence kinds with
            no name of their own (fact, profile_field) and never invented: the
            writer either already knew the name from the record it read, or
            leaves this out. Descriptive only — grounding checks type and id,
            never the name. Withheld with `quote` when the reader may not read
            the record's content: an activity's name is its subject line, which
            belongs to the message's audience.
        quote:
          type: string
          description: |-
            The record's own words, verbatim — a message's subject line, a
            signal's sentence. Never a paraphrase and never a summary: it is
            what a reader checks the claim against without opening the record,
            so a writer that has no verbatim words leaves it out. Absent when
            the reader may not read the record's content, even where they may
            know it exists.
        at:
          type: string
          format: date-time
          description: |-
            The instant the evidence is dated — when the message was sent, when
            the deal was last worked, when the signal was read. The client
            prints it in the reader's own calendar. Absent for a record with no
            date of its own.
        origin:
          type: string
          description: |-
            Where the words came from, in the writer's own language and the
            reader's terms — "Email you sent", "Open deal, last worked",
            "Read from their mail". One short phrase, never a record kind the
            client already labels the chip with. Descriptive only, like `name`.
        email_summary:
          allOf: [{$ref: '#/components/schemas/EmailSummary'}]
          readOnly: true
          nullable: true
          description: >-
            The canonical email row, present when this citation resolves to an email this reader may receive a summary of. It is what lets a cited message be opened as the exact message rather than quoted at: the reader gets the same row the timeline draws, and the same drawer behind it.
    CompanyFinanceSummary:
      type: object
      description: |-
        What the accounting mirror knows about one customer.
      required: [company_id, state]
      properties:
        company_id: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/FinanceSummaryState'}
        billing_contacts:
          type: array
          description: >-
            Who to send this customer's invoices to, beside the figures — the one question a reader of this card asks that the accounting mirror cannot answer. Read from the installation's own relationships, NOT from the accounting source: it states who we record as handling the invoices, which the connector neither supplies nor is told.
          items: {$ref: '#/components/schemas/BillingContact'}
        provider:
          type: [string, 'null']
          description: >-
            Which accounting source this came from, in the source's own words ("offline_demo"). Rendered as a label beside the figures so a reader knows what they are looking at; absent when nothing is connected.
        last_synced_at:
          type: [string, 'null']
          format: date-time
          description: When the last successful sync finished. Null when none has.
        coverage_start:
          type: [string, 'null']
          format: date
          description: >-
            The issue date of the OLDEST invoice this connection has mirrored for the customer, and with `coverage_end` the period every figure on this card describes. Null when the mirror holds none.
        coverage_end:
          type: [string, 'null']
          format: date
          description: >-
            The issue date of the NEWEST mirrored invoice. On a live account it is recent and the trailing windows below mean what they say; on an account that stopped buying it is the answer to "when did this end", and it is what makes a 365-day figure readable as the historical number it is.
        net_invoiced:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: >-
            Issued minus credited over the last 365 days. Named "net invoiced" rather than "revenue": the source supports issued amounts, not a ledger revenue figure, and calling one the other is the kind of small wrong label a reader plans against.
        net_invoiced_lifetime:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: >-
            Named "net invoiced" for the same reason as the trailing figure, and never "revenue".
        open_balance:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: What is still open across unpaid invoices.
        overdue:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: >-
            The share of the open balance already past its due date.
        median_days_after_due:
          type: [integer, 'null']
          description: >-
            The median days between an invoice's DUE date and its settlement over the window — how late they pay, not how long they take. Negative reads as early. Deliberately not issue-to-settlement: an invoice paid on the last day of 30-day terms is punctual, and a figure that called it "30 days to pay" would read as slow.
        payment_behaviour:
          type: array
          description: >-
            Days-late per settled invoice, oldest first, for the sparkline. Never padded with zeroes, because a zero here reads as "paid exactly on time".
          items: {type: integer}
        recent_invoices:
          type: array
          maxItems: 5
          description: The five most recent invoices; `truncated` says whether there are more.
          items: {$ref: '#/components/schemas/FinanceInvoice'}
        truncated:
          type: boolean
          description: True when the account has more invoices than `recent_invoices` carries.
    FinanceSummaryState:
      type: string
      enum: [no_connection, unmapped, syncing, connected, stale, error]
      description: |-
        Why the figures are what they are — the six cases a company page must keep
        apart, because five of them look identical if you only render the numbers.
    FinanceInvoice:
      type: object
      description: One mirrored invoice, in the currency it was issued in.
      required: [id, issued_at, status, currency, gross_minor, open_minor]
      properties:
        id: {type: string, format: uuid}
        number:
          type: [string, 'null']
          description: The source's own invoice number, absent when it does not issue one.
        issued_at: {type: string, format: date}
        due_at: {type: [string, 'null'], format: date}
        paid_at:
          type: [string, 'null']
          format: date-time
          description: When it was settled in full. Null while anything is still open.
        status:
          type: string
          enum: [draft, open, partially_paid, paid, overdue, disputed, credited, void]
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        gross_minor: {type: integer, format: int64, description: The invoiced total in minor units.}
        open_minor: {type: integer, format: int64, description: What is still unpaid on it.}
        days_late:
          type: [integer, 'null']
          description: >-
            Days between the due date and settlement, or between the due date and today while it is still open. Absent when the invoice carries no due date — lateness against no deadline is not a reading.
    HealthDimension:
      type: object
      description: |-
        One named part of the relationship's health, with the reason for its rating.
      required: [rating, reason]
      properties:
        rating:
          type: string
          enum: [strong, good, at_risk]
          description: >-
            Three values, not a scale. A dimension that cannot be computed is ABSENT rather than rated `unknown`: absence is a fact about the reading, where a rating is a claim about the account.
        reason:
          type: string
          description: >-
            One sentence naming what this rating was read from, in English. A client that knows `reason_code` renders that instead, in the reader's language.
        reason_code:
          $ref: '#/components/schemas/HealthDimensionReasonCode'
        reason_params:
          $ref: '#/components/schemas/HealthDimensionReasonParams'
    HealthDimensionReasonCode:
      type: string
      description: |-
        Which sentence `reason` is, so a client can say it in the reader's language. Absent on a
        dimension the client rates itself.
      enum: [never_written, quiet, meeting_booked, last_met, single_threaded, several_contacts, deals_all_stalled, deals_some_stalled, deals_none_stalled]
    HealthDimensionReasonParams:
      type: object
      description: The values the reason names. Each code lists which it reads.
      properties:
        days: {type: integer}
        count: {type: integer}
        total: {type: integer}
        at:
          type: string
          format: date-time
          description: An instant, so the client names its day in the record's own zone.
    Company360Health:
      type: object
      description: |-
        How the relationship stands, in the parts a reader can act on (AC-company-3).
      properties:
        relationship:
          allOf: [{$ref: '#/components/schemas/HealthDimension'}]
          description: >-
            Whether we are in contact and both sides are talking. Read from the strength roll-up and the reply balance below.
        commercial:
          allOf: [{$ref: '#/components/schemas/HealthDimension'}]
          description: Whether work is moving — open pipeline and whether it is stalling.
        payment:
          allOf: [{$ref: '#/components/schemas/HealthDimension'}]
          description: >-
            Whether they pay, and on time. Absent on an account with no finance connection or too few settled invoices to say — which is different from paying badly.
        days_since_last_inbound:
          type: [integer, 'null']
          description: Null when they have never written, which is different from writing long ago.
        reply_balance:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: >-
            Of the interactions in the strength window, the share that came from them. 0.5 is an even exchange; near 0 is us talking to ourselves. Null when nothing was captured.
        last_meeting_at:
          type: [string, 'null']
          format: date-time
        active_contacts:
          type: [integer, 'null']
          description: How many contacts here have interacted at all — the account's real surface.
        single_threaded:
          type: [boolean, 'null']
          description: >-
            The whole relationship rests on one contact. Named as a fact rather than scored, because it is the one shape a rep can fix before it costs them the account.
        open_commitments:
          type: [integer, 'null']
          description: >-
            Commitments either side made with the contacts at this account, read out of conversations, still owed and not yet a task. Null when the caller cannot read contacts and activities.
    Company360StateStrip:
      type: object
      description: |-
        The three readings a company page leads with. Each half is
        independently gated: a caller who may read the account but not its mail gets the account
        half and a null engagement, because a state inferred from data they were not allowed to see
        would be a conclusion the page has no basis for — and it is the one a rep would act on.
      required: [account]
      properties:
        account:
          type: object
          required: [lifecycle, relationship_types]
          properties:
            lifecycle:
              type: string
              enum: [unknown, target, prospect, opportunity, customer, former_customer, disqualified]
            relationship_types:
              type: array
              items: {type: string, enum: [customer, partner, supplier, investor, portfolio_company, competitor, other]}
        engagement:
          type: [object, 'null']
          description: Null when the caller has no activity grant — not assessed, as distinct from never contacted.
          required: [state]
          properties:
            state:
              type: string
              enum: [never_contacted, active, waiting_on_them, waiting_on_us, dormant]
              description: >-
                `waiting_on_them` shares its threshold and its inputs with the `no_reply` suggestion by construction, so the strip and the nudge below it cannot disagree about whether an account is waiting.
            last_inbound_at: {type: [string, 'null'], format: date-time}
            last_outbound_at: {type: [string, 'null'], format: date-time}
        commercial:
          type: [object, 'null']
          description: Null when the caller has no deal grant.
          required: [open_count, stalled_count, priced_count, converted_count]
          properties:
            open_count: {type: integer, minimum: 0}
            stalled_count: {type: integer, minimum: 0}
            open_pipeline_minor_base:
              type: [integer, 'null']
              description: >-
                The open pipeline in the workspace's base currency, integer minor units. Null when NO open deal carries a figure that can be converted — distinct from zero, which would claim a priced pipeline worth nothing.
            priced_count:
              type: integer
              minimum: 0
              description: >-
                How many of `open_count` contributed to the sum. A deal with no amount, and one whose currency has no conversion rate on its date, both contribute nothing — so a total below `open_count` covers PART of the pipeline, and the page says so rather than showing a figure that is quietly short.
            converted_count:
              type: integer
              minimum: 0
              description: >-
                How many of `priced_count` needed a currency conversion to enter the sum — the rest were already in the base. Zero means the total is a same-currency sum and no rate stands behind it.
            fx_as_of:
              type: [string, 'null']
              format: date
              description: >-
                The OLDEST rate date among the converted deals. An open deal has frozen no rate — that happens on close — so each converts at the latest rate stored on or before this read's day, and an installation does not hold every currency's rate for every day: the dates behind one total can differ, and this is the furthest back any part of the figure reaches. Null when nothing needed converting.
            base_currency:
              type: [string, 'null']
              description: >-
                The ISO-4217 currency `open_pipeline_minor_base` is expressed in — the workspace's base. Null whenever the figure is.
            next_close_on:
              type: [string, 'null']
              format: date
              description: The nearest expected close date among the open deals; null when none names one.
        contracts:
          type: [object, 'null']
          description: >-
            What this account is under contract for. Null when the caller has no contract grant — gated independently of `commercial` above, because a role may read the pipeline and not the agreements behind it, and a zero would answer a question this reader has no standing to ask.
          required: [active_count, cancellation_pending]
          properties:
            active_count:
              type: integer
              minimum: 0
              description: How many agreements are under contract today — the derived reading, not a status count.
            total_basis_value_minor_base:
              type: [integer, 'null']
              description: >-
                The summed value of the active agreements recorded as a TOTAL, in base-currency minor units. Null when none carries a convertible figure — distinct from zero, which would claim agreements worth nothing.
            annualized_value_minor_base:
              type: [integer, 'null']
              description: >-
                The summed value of the active agreements recorded as ANNUALIZED, kept apart from the total-basis figure above and NEVER added to it. A three-year total and a per-year figure span different periods, so one number covering both would describe nothing. A surface holding both shows both.
            priced_count:
              type: integer
              minimum: 0
              description: How many of `active_count` contributed to either sum. A lower number means the figures cover part of the account, and the page says so.
            base_currency:
              type: [string, 'null']
              description: The ISO-4217 currency both sums are expressed in. Travels with the figures; null whenever they are.
            nearest_renewal_on:
              type: [string, 'null']
              format: date
              description: The soonest renewal date among the active agreements; null when none names one.
            cancellation_pending:
              type: boolean
              description: >-
                True when an active agreement has notice recorded and its effective date has not arrived. The customer is still under contract — that is what a notice period is — and the card says so rather than reading as though they left.
            cancellation_effective_on:
              type: [string, 'null']
              format: date
              description: The soonest cancellation effective date among the active agreements; null when none is pending.
        signal:
          type: [object, 'null']
          description: >-
            The most serious thing standing open about this account, or null when nothing is open — and also null when the caller has no signal grant, because a strip that said "nothing" to someone who may not look would be answering a question it cannot answer. Exactly one: the strip states the worst, the signals card lists them all, and a reader who needs the rest opens it.
          required: [kind, severity, summary]
          properties:
            kind:
              type: string
            severity: {type: string, enum: [info, warn, urgent]}
            summary:
              type: string
              description: >-
                The signal's one sentence, in the words its producer wrote — the strip does not rephrase what a conversation said.
    Company360Contact:
      type: object
      description: One current employee of the account, as the company view shows them.
      required: [contact_id, full_name, strength, deal_roles, consent]
      properties:
        contact_id: {type: string, format: uuid}
        full_name: {type: string}
        title: {type: [string, 'null']}
        provider_title:
          type: [string, 'null']
          description: >-
            A provider-sourced job title, populated ONLY where the canonical title is empty: a bought title fills a blank, never overwrites or seconds one a human typed.
        title_source:
          type: [string, 'null']
          enum: [canonical, provider, null]
          description: Which title the roster is showing — the installation's own record, or the provider fallback. Null when there is no title at all.
        primary_email: {type: [string, 'null']}
        strength: {$ref: '#/components/schemas/RelationshipStrength'}
        deal_roles:
          type: array
          description: This contact's stakeholder roles on the account's deals (champion, economic_buyer, …).
          items: {$ref: '#/components/schemas/Company360DealRole'}
        consent:
          type: object
          additionalProperties: {type: string, enum: [unknown, granted, withdrawn]}
          description: |-
            Consent state keyed by purpose key — per purpose, never one boolean. A purpose
            the contact has no row for reads `unknown`, which is default-deny for outbound,
            not "not applicable".
        routes:
          $ref: '#/components/schemas/Company360ContactRoutes'
    Company360ContactRoutes:
      type: object
      description: |-
        Who on our side can actually reach this contact, strongest first.
      required: [top, remainder, untried]
      properties:
        top:
          type: array
          maxItems: 3
          description: The strongest routes, ordered by the per-colleague relationship projection.
          items: {$ref: '#/components/schemas/Company360Route'}
        remainder:
          type: integer
          minimum: 0
          description: How many further colleagues have a recorded exchange with this contact, beyond `top`.
        untried:
          type: boolean
          description: >-
            True when nobody on our side has a recorded exchange with this contact. NOT the same claim as a cold relationship: "untried" says we never reached out, "cold" says we did and it went nowhere, and a page that renders them alike tells a rep an account is unreachable when nobody has tried.
    Company360Route:
      type: object
      description: One colleague who has actually exchanged messages with this contact.
      required: [user_id, display_name, strength_bucket]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        strength_bucket:
          type: string
          enum: [strong, developing, cold]
          description: The band, never the number — the score is a decayed count, and showing it invites a precision it does not have.
        last_interaction_at:
          type: [string, 'null']
          format: date-time
    Company360DealRole:
      type: object
      description: One contact's stakeholder role on one of the account's deals.
      required: [deal_id, role]
      properties:
        deal_id: {type: string, format: uuid}
        role: {type: string, description: 'champion | economic_buyer | blocker | influencer | user; empty when the edge records no role.'}
    Company360WorkAttention:
      type: object
      description: |-
        The ONE fact that explains why a piece of work in flight needs a contact, picked
        by the server so every reader of the account gets the same answer.
      required: [kind, title]
      properties:
        kind:
          type: string
          enum: [overdue_task, commitment_theirs]
          description: |-
            `overdue_task` — an open task on this work is past its due date.
            `commitment_theirs` — they said in a captured conversation that they would do
            something, and it is still open.
        title:
          type: string
          description: The task's subject, or the claim's body verbatim. Never a paraphrase.
        who:
          type: [string, 'null']
          description: >-
            The assignee's or the debtor's display name. Null when the name is not this caller's to read, or the row names nobody — the card then writes the sentence without a name rather than showing an id.
        due_at:
          type: [string, 'null']
          format: date-time
          description: When it was due. Null on a commitment that named no date.
        source_activity_id:
          type: [string, 'null']
          format: uuid
          description: The captured conversation the claim was read from — the receipt a reader opens to check it.
        source_evidence:
          allOf: [{$ref: '#/components/schemas/CompanyBriefEvidence'}]
          readOnly: true
          nullable: true
          description: >-
            The same receipt as `source_activity_id`, in the shape every other cited record on this page has — so the card renders it through the one citation path and an email among them opens as a message.
    Company360Deal:
      type: object
      required: [deal_id, name, status, stalled]
      properties:
        deal_id: {type: string, format: uuid}
        name: {type: string}
        status:
          type: string
          enum: [open, won, lost]
          description: |-
            Always `open` in the 360's `deals.data` — closed deals are reported by
            `won_lifetime` and `lost_count`, not listed. The full vocabulary is declared
            because this is the deal's own status field, not a filter echo.
        stage_id: {type: [string, 'null'], format: uuid}
        stage_name: {type: [string, 'null']}
        amount: {$ref: '#/components/schemas/Money'}
        expected_close_date: {type: [string, 'null'], format: date}
        stalled: {type: boolean, description: No linked activity inside the 60-day stall window.}
        attention: {$ref: '#/components/schemas/Company360WorkAttention'}
    Company360ProjectPhase:
      type: string
      enum: [initiative, pursuing, delivering, closed]
      description: Where a project stands on the record page; the same ladder the project's own `phase` walks.
    Company360Project:
      type: object
      description: >-
        One body of work on the record page: enough to name it, say where it stands and who holds it. The full row is `GET /projects/{id}`. Shared by the company page and the contact page, so a project reads the same on both.
      required: [project_id, name, phase, quiet]
      properties:
        project_id: {type: string, format: uuid}
        name: {type: string}
        key: {type: [string, 'null'], description: 'The subject-line handle, when the project has one.'}
        phase: {$ref: '#/components/schemas/Company360ProjectPhase'}
        last_activity_at: {type: [string, 'null'], format: date-time}
        target_end_date: {type: [string, 'null'], format: date}
        owner_id: {type: [string, 'null'], format: uuid}
        owner_name:
          type: [string, 'null']
          description: The owner's display name; null when the project has no owner or the owner is no longer an active member.
        quiet:
          type: boolean
          description: >-
            Nothing has been filed against this project for the module's quiet window, counted from its last activity or, when it has none, from the day it was opened. Computed server-side because the payload carries no created_at and the window is one number the product spells in one place.
        attention:
          allOf: [{$ref: '#/components/schemas/Company360WorkAttention'}]
          description: >-
            Present on the company record page, which decorates the row from the account's own tasks and captured commitments. The contact page carries the same project row without it — the question "why does this need a contact" is asked of an account, not of a contact.
    Company360Deals:
      type: object
      description: The account's open deals plus the two lifetime figures the header needs.
      required: [data, page, won_lifetime, lost_count]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Company360Deal'}}
        page: {$ref: '#/components/schemas/PageInfo'}
        won_lifetime:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: Every won deal on this account, converted at each deal's frozen close-time rate. Never a live re-conversion.
        lost_count: {type: integer, minimum: 0}
    Company360NextStep:
      type: object
      description: One open task on the account, ordered overdue → due → undated.
      required: [activity_id, subject, overdue]
      properties:
        activity_id: {type: string, format: uuid}
        subject: {type: string}
        due_at: {type: [string, 'null'], format: date-time}
        overdue: {type: boolean}
        assignee_id: {type: [string, 'null'], format: uuid}
        linked_deal_id: {type: [string, 'null'], format: uuid}
        linked_contact_id: {type: [string, 'null'], format: uuid}
        version:
          allOf: [{$ref: '#/components/schemas/RowVersion'}]
          description: |-
            The task's version, carried so the tick and the snooze beside this row can write with
            `If-Match`. The same reason `EmailSummary` carries one: a projection a reader can act
            from has to name the row it will act on, or every press is last-write-wins.
    Company360NextMeeting:
      type: object
      description: |-
        The next meeting with this account that has not happened yet, and who is in it.
      required: [activity_id, starts_at, subject, participants]
      properties:
        activity_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        subject: {type: string}
        linked_deal_id:
          type: [string, 'null']
          format: uuid
          description: The deal this meeting is filed against, when the caller may read it.
        participants:
          type: array
          description: The attendees on file, row-scoped. Empty is honest — a meeting can be booked before anyone is linked to it.
          items: {$ref: '#/components/schemas/Company360MeetingParticipant'}
    Company360MeetingParticipant:
      type: object
      description: One attendee of the next meeting, named only when the caller may read them.
      required: [contact_id, display_name]
      properties:
        contact_id: {type: string, format: uuid}
        display_name: {type: string}
    Company360Suggestion:
      type: object
      description: |-
        One deterministic next-step suggestion. It is derived, not decided: the rule
        that fired, the records it fired on, and nothing the reader cannot check.
      required: [kind, fingerprint, reason, evidence]
      properties:
        kind:
          type: string
          enum: [no_reply, stalled_deal, no_next_step, lifecycle_conflict, commitment_unmet, question_unanswered, risk_raised, need_raised]
          description: |-
            The four RULE kinds, computed from the account's records with no model:
        title:
          type: [string, 'null']
          description: |-
            What to do, in the RULE's own words — "Follow up: no reply in 24 days".
        due_at:
          type: [string, 'null']
          format: date-time
          description: |-
            The date the EVIDENCE carries — when the thread went quiet, when the deal last moved.
        fingerprint:
          type: string
          description: |-
            Identifies this suggestion by its EVIDENCE, not by its kind: a hash over the
            kind, the subject and the records it fired on. Dismissing a suggestion stores
            this, so the same advice stays gone — and re-arms by itself when the evidence
            changes, because the situation is then genuinely a new one.
        reason:
          type: string
          description: The rule that fired, in the words the rep reads. Never a score.
        subject_type: {type: [string, 'null'], enum: [null, deal, contact, company]}
        subject_id: {type: [string, 'null'], format: uuid}
        written_by:
          allOf: [{$ref: '#/components/schemas/WrittenBy'}]
          description: |-
            Which writer raised this row. Absent on the 360's own rows — every one of those
            is a rule — and `model` on a finding the account scan read from the account's
            words. Never silently interchangeable: a reader weighing advice needs to know
            whether a comparison or a reading stands behind it.
        evidence:
          type: array
          description: The records the rule fired on — always ones this reader can open.
          items: {$ref: '#/components/schemas/CompanyBriefEvidence'}
        action:
          type: [object, 'null']
          description: |-
            What performing this advice means, named by the server rather than inferred by the
            client from the evidence order (AC-company-14). A rule that cannot name an action
            carries null and the card advises without offering a button, which is honest — a
            control that does nothing teaches the reader to stop pressing them.
          required: [kind]
          properties:
            kind:
              type: string
              enum: [draft_reply, open_deal, add_task]
              description: |-
                `draft_reply` — open the composer on the message that went unanswered.
                `open_deal` — open the deal that stalled.
                `add_task` — write the step named in `task`, through `POST /tasks`.
            activity_id:
              type: [string, 'null']
              format: uuid
              description: The unanswered outbound message a `draft_reply` anchors on.
            deal_id:
              type: [string, 'null']
              format: uuid
              description: The deal an `open_deal` opens, and the optional link an `add_task` carries.
            task:
              allOf: [{$ref: '#/components/schemas/CreateTaskRequest'}]
              nullable: true
              description: |-
                The step an `add_task` writes, prepared here as the exact body `POST /tasks` takes
                — subject, and the record it hangs on. Present on every `add_task`, null otherwise.
    Company360SinceLastVisit:
      type: object
      description: |-
        What changed on this account since the caller last acknowledged seeing it. Read-only:
        the 360 never advances the baseline — `POST /companies/{id}/view-ack` does.
      required: [new_activities]
      properties:
        baseline_at:
          type: [string, 'null']
          format: date-time
          description: The caller's last acknowledged visit, or null if they have never acknowledged one (first visit — counts run from the account's whole history).
        new_activities: {type: integer, minimum: 0}
        deal_stage_moves:
          type: [integer, 'null']
          description: Null when the caller has no deal read grant — not counted, as opposed to counted as zero.
        pending_proposals:
          type: [integer, 'null']
          description: |-
            Null when the caller cannot triage approvals (an agent principal) — not
            counted, as opposed to counted as zero. Saturates at 200: deciding who may
            see a staged change is a per-row check, and a badge is not worth making one
            record page pay for an unbounded backlog.
    BillingContact:
      type: object
      description: |-
        One contact who handles a company's invoices, and in what capacity.
      required: [relationship_id, contact_id, full_name, role]
      properties:
        relationship_id:
          type: string
          format: uuid
          description: The edge itself, so the panel can change or archive this one row.
        contact_id: {type: string, format: uuid}
        full_name: {type: string}
        role: {$ref: '#/components/schemas/BillingContactRole'}
        title: {type: [string, 'null']}
        email:
          type: [string, 'null']
          description: The contact's current reachable address, read live. Null when none is on file.
    BillingContactRole:
      type: string
      enum: [recipient, approver, accounts_payable]
      description: |-
        In what capacity somebody handles the invoice: `recipient` (it is addressed to
        them), `approver` (they sign it off internally), `accounts_payable` (they pay it).
        One contact may hold several, and each is a separate edge.
    Company360:
      type: object
      description: |-
        The company record page in one payload. Every section except `company` is
        optional: absent means the caller lacks its grant, and `sections_omitted` names it.
      required: [as_of, company, sections_omitted]
      properties:
        as_of:
          type: string
          format: date-time
          description: The instant the assembling transaction read. Sections are consistent to this moment under Read Committed.
        company: {$ref: '#/components/schemas/Company'}
        moment:
          description: >-
            The ONE thing this account needs today, selected server-side by the same rule the contact page uses. Today it fires on what we OWE the account's contacts — a promise past its date, or the next one coming due — read from both places a promise is recorded: a task somebody filed, and a commitment an extractor read out of a conversation. Absent when the caller lacks a grant the rule needs, named in `sections_omitted` as `moments`; the quiet success state is a moment of kind `nothing_needed`, not an absence.
          allOf: [{$ref: '#/components/schemas/ContactMoment'}]
        scope:
          $ref: '#/components/schemas/ProjectScope'
          description: The project this was narrowed to, when the request named one.
        last_inbound_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When they last wrote to us, over the same three-link walk the timeline uses (the activity's own link, its deal's company, the employer of the contact it is filed against). Null means nothing inbound was ever captured — which is a fact about the account, not a missing field. Absent entirely when the caller has no activity grant, named in `sections_omitted` as `last_touch`.
        last_outbound_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When we last wrote to them, same walk. Shown BESIDE last_inbound_at rather than folded into one "last touch": which direction went last is the whole question — an account we mailed a fortnight ago with no reply is not the same as one that just wrote to us.
        last_contact:
          description: >-
            The newest exchange with the account in either direction, over the same walk: an email, a call, a chat message, or a meeting that was neither canceled nor a no-show. A note is not contact. Absent when there was none, or when the caller has no activity grant (then `sections_omitted` names `last_touch`). The "Last contact" tile reads this, and the timeline applies the same rule to the rows it draws.
          allOf: [{$ref: '#/components/schemas/Company360LastContact'}]
        state_strip:
          $ref: '#/components/schemas/Company360StateStrip'
        next_meeting:
          $ref: '#/components/schemas/Company360NextMeeting'
        health:
          $ref: '#/components/schemas/Company360Health'
        sections_omitted:
          type: array
          description: The sections withheld for lack of a grant — so a client can say "you can't see this" instead of "there is none".
          items:
            type: string
            enum: [contacts, deals, projects, strength, activities, tags, list_memberships, pending_approvals, next_steps, since_last_visit, suggestions, last_touch, state_strip, health, next_meeting, moments, billing_contacts]
        contacts:
          type: object
          required: [data, page]
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Company360Contact'}}
            page: {$ref: '#/components/schemas/PageInfo'}
        billing_contacts:
          type: array
          description: >-
            Who handles this account's invoices, ordered by capacity: addressed, approved, paid. Each entry is one edge, so the panel can change or archive a single role without touching the others. Empty means nobody is named — which for a paying customer is a gap worth showing, not a blank. Absent when the caller lacks the contact or relationship grant, named in `sections_omitted` as `billing_contacts`; a contact outside the caller's row scope is simply not listed, and no count states how many were withheld.
          items: {$ref: '#/components/schemas/BillingContact'}
        deals: {$ref: '#/components/schemas/Company360Deals'}
        projects:
          type: array
          description: >-
            The company's unarchived projects, work in motion first (delivering, pursuing, initiative, then closed), under the caller's project row scope. Absent when the caller has no project grant, named in `sections_omitted` as `projects`.
          items: {$ref: '#/components/schemas/Company360Project'}
        projects_page:
          allOf: [{$ref: '#/components/schemas/PageInfo'}]
          description: >-
            Whether `projects` was cut short. The list is capped, and a card that counted the rows and said "3 in flight" would state a number the account does not have. Absent exactly when `projects` is.
        attention_withheld:
          type: boolean
          description: >-
            The reader may not read this account's activities, so no `attention` was derived on any deal or project row. The rows themselves are still listed and still true — this says the reasons behind them are missing, which a card must show rather than let an unexplained row read as a settled one.
        strength: {$ref: '#/components/schemas/CompanyStrength'}
        activities: {$ref: '#/components/schemas/ActivityListResponse'}
        tags: {type: array, items: {$ref: '#/components/schemas/Tag'}}
        list_memberships:
          type: array
          description: >-
            The Shortlists this company is on that the caller may find. Absent while the installation has not switched lists on.
          items: {$ref: '#/components/schemas/List'}
        pending_approvals:
          type: object
          required: [data, page]
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Approval'}}
            page: {$ref: '#/components/schemas/PageInfo'}
        next_steps:
          type: object
          required: [data, page]
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Company360NextStep'}}
            page: {$ref: '#/components/schemas/PageInfo'}
        since_last_visit: {$ref: '#/components/schemas/Company360SinceLastVisit'}
        suggestions:
          type: array
          description: |-
            What this account looks like it needs next, computed from its own records —
            no model involved. Each carries WHY, so a rep can disagree with the reason
            rather than with a verdict.
          items: {$ref: '#/components/schemas/Company360Suggestion'}
        suggestions_dropped:
          type: integer
          minimum: 0
          description: |-
            How many further suggestions this caller has that `suggestions` does not
            list — the card offers at most a handful, because advice past that is a list
            a rep learns to scroll past. Reported rather than dropped in silence: a
            truncated list with no count reads as "that is everything".
    CompanyGraphNode:
      type: object
      description: |-
        One record in the account's one-hop neighbourhood. `id` is the record's own id,
        so a client routes to it with the same route it uses everywhere else.
      required: [id, kind, label, root]
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          enum: [company, contact, deal, user]
          description: |-
            `company`, `contact` and `deal` are the account's own records.
            `user` is a member of THIS workspace — someone on our side who is connected to the
            account. `intro_path` is a plain boolean and is never sent as null on any node —
            a client reads its absence as "not on the warm-intro path".
        label:
          type: string
          description: The record's display name — the company's, the contact's full name, the deal's name, the workspace member's display name.
        root:
          type: boolean
          description: |-
            This node is the account the graph is centred on. Exactly one node carries
            `true`. Always present, because "is this the centre" is a fact about every
            node and a client that had to read absence as false would branch on it.
        detail:
          type: [string, 'null']
          description: |-
            One short line of context the node cannot be read without: a contact's title,
            or a deal's stage name. Null when the record has none on file, and always null
            on a company or a user — how a related company is attached, and how a
            teammate is connected, is the EDGE's kind, and saying it twice would let the two
            disagree.
        strength:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: |-
            Null for an
            company, a deal or a user, none of which have a relationship of their own,
            and for a contact whose strength this caller's contact scope did not resolve.
        strength_bucket:
          type: [string, 'null']
          enum: [null, none, weak, moderate, strong]
          description: The server's band for `strength` — the same vocabulary `RelationshipStrength.bucket` uses. Never re-derived from the score by a client.
        intro_path:
          type: boolean
          description: |-
            This contact is the route in the active signal's warm-intro path proposes.
            At most one node carries it, and only when `intro_path` at the top level is
            present. Absent on every other node — there is nothing to say about them.
        logo_url:
          type: [string, 'null']
          description: |-
            The company node's resolved logo (A55), same value `Company.logo_url` carries.
            Absent on a company with no resolved logo and on every contact or deal node —
            a client draws the node's monogram or its token-coloured circle instead.
    EmploymentImportItem:
      type: object
      required: [key, provider, company_name, role, employment_status, state]
      properties:
        key: {type: string}
        provider: {type: string}
        company_name: {type: string}
        role: {type: string}
        domain: {type: string}
        started: {type: string, description: 'Provider date at its original precision, YYYY-MM or YYYY-MM-DD.'}
        ended: {type: string, description: 'Provider date at its original precision, YYYY-MM or YYYY-MM-DD.'}
        employment_status: {type: string, enum: [current, former, unknown]}
        state: {type: string, enum: [pending, linked, needs_match, needs_review, dismissed]}
        company_id: {type: string, format: uuid}
        relationship_id: {type: string, format: uuid}
        retrieved_at: {type: string, format: date-time}
        research_state: {type: string, description: Current company research state or a reason it cannot yet run.}
    EmploymentImportReport:
      type: object
      required: [contact_id, items]
      properties:
        warnings: {type: array, items: {type: string}, description: Retained evidence that requires administrator review.}
        contact_id: {type: string, format: uuid}
        items: {type: array, items: {$ref: '#/components/schemas/EmploymentImportItem'}}
    Company360LastContact:
      type: object
      required: [at, kind, activity_id]
      properties:
        at: {type: string, format: date-time}
        kind:
          type: string
          enum: [email, call, meeting, message]
        activity_id: {type: string, format: uuid}
    MeetingBrief:
      type: object
      description: |-
        The pre-meeting brief for one booked meeting, assembled fresh on every
        read from what the CALLER can see.
      required: [activity_id, generated_at, generated_by, sections]
      properties:
        activity_id: {type: string, format: uuid}
        generated_at:
          type: string
          format: date-time
          description: The instant this read assembled the brief. Always now — nothing here is stored.
        generated_by: {$ref: '#/components/schemas/WrittenBy'}
        scope:
          $ref: '#/components/schemas/ProjectScope'
          description: The project this was narrowed to, when the request named one.
        sections:
          type: array
          description: >-
            A section with no surviving sentence is absent, never present-and-empty: `risks` in particular is specified as omitted when empty, and the same rule reads honestly for every other.
          items: {$ref: '#/components/schemas/MeetingBriefSection'}
        omitted:
          type: array
          description: >-
            What this reader's own grants kept OUT of the brief, named so a silence is never mistaken for an absence. A brief that cannot see the Deal Room reads exactly like a brief about a deal with no room, and a rep would walk in believing the buyer had done nothing. Empty when the reader could see everything the brief looks at.
          items: {$ref: '#/components/schemas/MeetingBriefOmission'}
        plan:
          $ref: '#/components/schemas/MeetingPlan'
          description: >-
            What to DO in the room, built over the same records as `sections`. Optional on the wire so a client written before it keeps rendering the cited summary; the server writes one on every read.
    MeetingBriefOmission:
      type: object
      description: One source this reader may not see, and what that costs the brief.
      required: [source, reason]
      properties:
        source:
          type: string
          description: 'A machine key, so a client can render its own wording.'
        reason:
          type: string
          description: One sentence a reader can act on, naming what is missing and why.
    MeetingPlan:
      type: object
      description: |-
        The preparation plan: what to DO in the room, as against `sections`, which is what is
        KNOWN about it.
      required: [generated_by, readiness, meeting_type, likely_asks, questions, scenarios, company_arc, advance, unknowns]
      properties:
        generated_by:
          $ref: '#/components/schemas/WrittenBy'
          description: >-
            Which writer produced the plan. Independent of the brief's own: the plan can fall to its deterministic floor while the sections were written by a model, and the reverse.
        readiness:
          $ref: '#/components/schemas/MeetingPlanReadiness'
        meeting_type: {$ref: '#/components/schemas/MeetingPlanType'}
        objective: {$ref: '#/components/schemas/MeetingPlanObjective'}
        opening:
          $ref: '#/components/schemas/CompanyBriefSentence'
          description: The suggested opener. Always a `recommendation`.
        top_risk: {$ref: '#/components/schemas/MeetingPlanRisk'}
        likely_asks:
          type: array
          maxItems: 5
          description: What the other side is likely to ask, each an assessment with the record behind it.
          items: {$ref: '#/components/schemas/MeetingPlanAsk'}
        questions:
          type: array
          maxItems: 5
          description: What to ask them, ranked. Three is a plan a rep can hold; the cap is five.
          items: {$ref: '#/components/schemas/MeetingPlanQuestion'}
        scenarios:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/MeetingPlanScenario'}
        company_arc:
          type: array
          maxItems: 5
          description: >-
            The moments that change TODAY's conversation, oldest first, built from the whole history this caller may read rather than from the newest page of it.
          items: {$ref: '#/components/schemas/MeetingPlanArcMoment'}
        advance: {$ref: '#/components/schemas/MeetingPlanAdvance'}
        unknowns:
          type: array
          description: >-
            What the record does not say, each with the question that would close it. Derived from absence, so an empty list means the record answered everything this plan asks of it — not that nobody looked.
          items: {$ref: '#/components/schemas/MeetingPlanUnknown'}
        manager_coaching:
          $ref: '#/components/schemas/MeetingPlanCoaching'
          description: >-
            Present only for a lead reading a teammate's meeting. Absent for everybody else, including the rep whose meeting it is — a rep reading their own brief is preparing, not being coached.
    MeetingPlanCoaching:
      type: object
      description: |-
        The coaching layer, for a lead reading a teammate's meeting.
      required: [focus, failure_mode, listen_for, watch_for, intervene_if, paths]
      properties:
        focus:
          type: string
          description: The ONE thing to coach on. A list of five is a list nobody coaches from.
        failure_mode:
          type: string
          description: How this meeting most plausibly goes wrong for this rep, given this account.
        listen_for:
          type: string
          description: What a good version of this conversation sounds like.
        watch_for:
          type: string
          description: The move that says it is going wrong.
        intervene_if:
          type: string
          description: >-
            The narrow condition under which a lead should step in. Narrow on purpose: a lead who takes over a rep's meeting has coached nobody.
        paths:
          type: array
          maxItems: 3
          description: The ways this meeting can go, for a lead to rehearse against.
          items: {$ref: '#/components/schemas/MeetingPlanCoachingPath'}
    MeetingPlanCoachingPath:
      type: object
      required: [label, play]
      properties:
        label: {type: string}
        play: {type: string}
    MeetingPlanReadiness:
      type: string
      enum: [outline, prepared]
      description: |-
        How much of a preparation this plan actually is, so a surface can decide whether to lead
        with it.
    MeetingPlanTypeValue:
      type: string
      enum: [relationship, first_discovery, followup_discovery, demo, commercial, decision, delivery, renewal_risk, unknown]
      description: >-
        What kind of meeting this is, which decides what a good plan for it looks like. `unknown` is a first-class answer rather than a failure: it means the records do not say what this meeting is for, and the plan then opens by asking rather than by guessing.
    MeetingPlanTier:
      type: string
      enum: [high, medium, low]
      description: >-
        A three-step ordinal, for ranking. Never a probability: nothing here is measured finely enough to print one, and a number would claim a precision the evidence does not have.
    MeetingPlanType:
      type: object
      required: [value, confidence]
      properties:
        value: {$ref: '#/components/schemas/MeetingPlanTypeValue'}
        confidence: {$ref: '#/components/schemas/MeetingPlanTier'}
    MeetingPlanObjective:
      type: object
      description: The outcome to earn, and the reminder not to force it.
      required: [sentence, caveat]
      properties:
        sentence:
          $ref: '#/components/schemas/CompanyBriefSentence'
          description: One cited `recommendation`.
        caveat:
          type: string
          description: >-
            The one-line "do not force this" reminder. Fixed product copy keyed to the meeting type, not read from the records, which is why it carries no evidence of its own.
    MeetingPlanRisk:
      type: object
      description: The one thing that can change this conversation, and what to do when it does.
      required: [text, response_plan]
      properties:
        text:
          $ref: '#/components/schemas/CompanyBriefSentence'
          description: The risk, as an `assessment` citing the record it was read from.
        response_plan: {$ref: '#/components/schemas/MeetingPlanResponse'}
    MeetingPlanResponse:
      type: object
      description: >-
        What to say, what to show, and what not to promise. Three sentences rather than a paragraph, because a rep reads this while walking.
      required: [say, show, avoid]
      properties:
        say: {type: string}
        show: {type: string}
        avoid: {type: string}
    MeetingPlanAsk:
      type: object
      required: [question, basis, relevance, prepare]
      properties:
        question:
          type: string
          description: What they are likely to ask, in their own words where the record has them.
        basis:
          $ref: '#/components/schemas/CompanyBriefSentence'
          description: Why we expect it — a `fact` or `assessment` citing the record.
        relevance: {$ref: '#/components/schemas/MeetingPlanTier'}
        prepare: {type: string, description: How to answer it.}
    MeetingPlanQuestion:
      type: object
      description: >-
        One question to ask, with why it matters here and what the answer sounds like. Evidence is required: a question no record motivated is a question that would read the same on any account, which is the failure this whole shape exists to prevent.
      required: [ask, why, listen_for, evidence]
      properties:
        ask: {type: string}
        why: {type: string}
        listen_for: {type: string}
        evidence:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/CompanyBriefEvidence'}
    MeetingPlanScenario:
      type: object
      description: What the meeting may turn into, and what to do if it does.
      required: [label, play, evidence]
      properties:
        label: {type: string}
        play: {type: string}
        evidence:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/CompanyBriefEvidence'}
    MeetingPlanArcMoment:
      type: object
      description: >-
        One stretch of the relationship that still bears on today. A moment, not a message: it spans the conversations it was built from, and cites them.
      required: [from, to, title, summary]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        title: {type: string}
        summary:
          $ref: '#/components/schemas/CompanyBriefSentence'
          description: A `fact` citing the conversations the moment is made of.
    MeetingPlanAdvance:
      type: object
      description: >-
        How to close: the least that still counts, the most worth aiming at, and what to fall back to. A meeting that ends with none of the three ended with nothing.
      required: [minimum, best, fallback]
      properties:
        minimum: {$ref: '#/components/schemas/CompanyBriefSentence'}
        best: {$ref: '#/components/schemas/CompanyBriefSentence'}
        fallback: {$ref: '#/components/schemas/CompanyBriefSentence'}
    MeetingPlanUnknownKind:
      type: string
      enum: [intent_not_captured, no_open_deal, decision_route_not_captured, no_prior_meeting, no_commitments_captured, no_history, attendees_not_visible]
      description: >-
        Which gap this is. A closed vocabulary so a surface can order and label them, and so a writer cannot invent an eighth.
    MeetingPlanUnknown:
      type: object
      required: [kind, question]
      properties:
        kind: {$ref: '#/components/schemas/MeetingPlanUnknownKind'}
        question:
          type: string
          description: The question to ask in the room that would close this gap.
    MeetingBriefSection:
      type: object
      description: One of the nine fixed sections, with its cited sentences.
      required: [kind, sentences]
      properties:
        kind:
          type: string
          enum: [header, goal, what_changed, attendees, commitments, deal_state, risks, talking_points, company_context]
          description: |-
            A
            closed enum rather than a free-text heading, so a surface can label, order and
            collapse them and no writer can invent a tenth.
        sentences:
          type: array
          minItems: 1
          description: >-
            The section's lines, each citing the records it was written from. A sentence whose citations do not resolve is dropped whole rather than shown uncited.
          items: {$ref: '#/components/schemas/CompanyBriefSentence'}
    ContactConsentGuard:
      type: object
      description: |-
        Whether an outbound message to this contact is allowed right now, per purpose and
        channel, WITH the reason.
      required: [contact_id, entries]
      properties:
        contact_id: {type: string, format: uuid}
        entries:
          type: array
          items: {$ref: '#/components/schemas/ContactConsentGuardEntry'}
    ContactConsentGuardEntry:
      type: object
      required: [purpose_key, purpose_class, channel, verdict, reason]
      properties:
        purpose_key: {type: string}
        purpose_label: {type: [string, 'null']}
        purpose_class:
          type: string
          description: |-
            Which gate this purpose answers to. `business_correspondence` and
            `transactional` are never consent-gated — their lawful basis is Art 6(1)(b)/(f), and
            treating a reply to someone who wrote to us as a consent violation is a frame that is
            legally wrong. `phone_outreach` is specced and dormant.
          enum: [business_correspondence, transactional, marketing, phone_outreach]
        channel:
          type: string
          enum: [email, phone]
        verdict:
          type: string
          description: '`allowed` proceeds. `blocked` refuses and `reason` says why. `unknown` means no decision is recorded — the offered action is to request consent, never a silent grant.'
          enum: [allowed, blocked, unknown]
        reason:
          type: string
          description: >-
            The answer in the reader's words — "she wrote to you on 2 May", "opt-out 12 Jul", "no consent recorded". A verdict a rep cannot explain to the contact is not usable.
        qualifying_event:
          description: The recorded event that flipped business correspondence to allowed, when one did.
          allOf: [{$ref: '#/components/schemas/ConsentQualifyingEvent'}]
    ConsentQualifyingEvent:
      type: object
      description: |-
        The deterministic event that makes business correspondence lawful: an
        inbound message, an inquiry they initiated, an active deal with their company, or
        a recorded in-person exchange. Recording WHICH event and when is what makes the Art
        6(1)(f) balancing accountable rather than merely asserted.
      required: [kind, occurred_at]
      properties:
        kind:
          type: string
          enum: [inbound_message, inquiry, active_deal, in_person, meeting, requested_by_subject]
        occurred_at: {type: string, format: date-time}
        source_entity_type: {type: [string, 'null'], enum: [activity, deal, null]}
        source_entity_id: {type: [string, 'null'], format: uuid}
        note:
          type: [string, 'null']
          description: The typed evidence for a hand-recorded exchange (`in_person` or `requested_by_subject`), where a named human's note is the record.
    ContactMoment:
      type: object
      description: |-
        One reason this contact is worth attention now, with the evidence behind it.
      required: [claim_key, rule, evidence_fingerprint, headline, why_now, confidence, evidence, recommended_action]
      properties:
        claim_key:
          type: string
          description: >-
            The stable identity of this moment as a claim — what the moment is ABOUT. Pass it with `evidence_fingerprint` to `POST /contacts/{id}/moment/dismiss`.
        evidence_fingerprint:
          type: string
          description: >-
            A digest of the evidence this moment fired on. The dismissal is held against it, so a dismissed moment RE-ARMS when its evidence moves — the reader dismissed "she went quiet", a reply arrives, and the page must not stay silent about the thing that just changed. Keying a dismissal on the path alone is what gets that wrong.
        rule: {$ref: '#/components/schemas/ContactMomentRule'}
        rule_version:
          type: string
          description: The ladder's version. A rule change that would reselect must be visible, not silent.
        headline:
          type: string
          description: The reason in one line, written from the evidence — never a model's paraphrase of it.
        why_now:
          type: string
          description: What makes it timely rather than merely true. A moment that would read the same next month is not a moment.
        confidence:
          type: string
          description: '`observed_fact` is a thing that happened; the softer values exist for sources that infer rather than observe.'
          enum: [observed_fact, high, medium]
        freshness_at:
          type: string
          format: date-time
          description: When the fact behind this moment happened, so a reader can judge its age themselves.
        evidence:
          type: array
          description: What the moment is derived from. Never empty — a reason with no evidence is an opinion.
          items: {$ref: '#/components/schemas/ContactMomentEvidence'}
        recommended_action:
          $ref: '#/components/schemas/ContactMomentAction'
        secondary_actions:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/ContactMomentAction'}
        may_be_done:
          $ref: '#/components/schemas/ContactMomentMayBeDone'
    ContactMomentMayBeDone:
      type: object
      description: |-
        Present when the moment is a promise we owe AND we wrote to the contact after it was
        made: the card asks whether that email kept it, and never decides on its own. `Done`
        completes the task (`PATCH /activities/{id}` with `is_done`) or settles the claim
        (`POST /claims/{id}/settle` with `done`). `Not yet` dismisses this moment through
        `POST /contacts/{id}/moment/dismiss`; the email is part of its fingerprint, so a
        later email asks again.
      required: [promise_type, promise_id, email_activity_id, wrote_at]
      properties:
        promise_type:
          type: string
          description: '`task` — an open task. `claim` — a `commitment_ours` claim with no task.'
          enum: [task, claim]
        promise_id: {type: string, format: uuid}
        email_activity_id:
          type: string
          format: uuid
          description: The newest attested outbound email to the contact sent after the promise was made.
        wrote_at: {type: string, format: date-time}
    ContactMomentRule:
      type: string
      description: |-
        Which rung of the fixed ladder selected this moment, in priority order.
        Named in the response so the same evidence cannot render differently across clients.
        Ties break by consequence, then nearest deadline, then most recent evidence, then
        stable id.
      enum: [meeting_prep, re_engaged, job_change, overdue_promise, gone_quiet, open_promise, public_signal, missing_next_step, thin_relationship, nothing_needed]
    ContactMomentEvidence:
      type: object
      description: One thing that actually happened, which the reader can open.
      required: [type, label]
      properties:
        type:
          type: string
          enum: [activity, task, relationship_change]
        id:
          type: string
          format: uuid
          description: The record to open. Absent when the evidence is a derived fact rather than a row.
        label: {type: string}
        snippet:
          type: string
          description: A verbatim excerpt of the evidence, never a summary of it.
        observed_at: {type: string, format: date-time}
    ContactMomentAction:
      type: object
      description: |-
        What to do about it: a TYPED descriptor, not a label the client has to interpret.
      required: [kind, label, state]
      properties:
        kind:
          type: string
          enum: [draft_reply, schedule_meeting, complete_task, log_activity, open_record, open_meeting_brief, open_research, ask_colleague]
        label: {type: string}
        destination:
          description: Where the action goes. Absent for an action that opens no surface of its own.
          allOf: [{$ref: '#/components/schemas/ContactMomentDestination'}]
        state:
          type: string
          description: '`available` proceeds. `will_confirm` stages a approval first. `blocked` cannot proceed, and `blocked_reason` says why.'
          enum: [available, will_confirm, blocked]
        blocked_reason: {type: string}
    ContactMomentDestination:
      type: object
      description: |-
        The surface an action opens and what it opens with. A destination the server did not
        name is a destination the client must not invent.
      required: [surface]
      properties:
        surface:
          type: string
          description: >-
            `composer` — the outbound draft drawer. `meeting_brief` — the pre-meeting dossier. `research` — the deep-research drawer. `record` — another record page. `task` — the task sheet. `activity_log` — the log-activity form, for writing down a note or a meeting that happened off-system. `booking` — arrange a calendar invitation with this contact.
          enum: [composer, meeting_brief, research, record, task, activity_log, booking]
        entity_type:
          type: [string, 'null']
          enum: [contact, company, deal, activity, null]
        entity_id: {type: [string, 'null'], format: uuid}
        prefill:
          type: object
          additionalProperties: {type: string}
          description: >-
            What the surface opens with — a draft intent, a subject, a task title. Strings only: a prefill is what a human is about to edit, never a structure the client must interpret.
    ContactNetworkColleague:
      type: object
      description: One colleague's own relationship with this contact.
      required: [user_id, display_name, strength_bucket, interactions_90d]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        strength:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        strength_bucket: {type: string, enum: [none, weak, moderate, strong]}
        interactions_90d: {type: integer, minimum: 0}
        last_at: {type: [string, 'null'], format: date-time}
        inbound_90d: {type: integer, minimum: 0, description: Interactions in the last 90 days where they wrote to this colleague.}
        outbound_90d: {type: integer, minimum: 0, description: Interactions in the last 90 days where this colleague wrote to them.}
        last_inbound_at: {type: [string, 'null'], format: date-time, description: When they last replied to this colleague. Null means they never have.}
        last_outbound_at: {type: [string, 'null'], format: date-time, description: When this colleague last wrote to them.}
    ContactNetwork:
      type: object
      description: |-
        The colleagues who know this contact, warmest first. Ordering is the answer, not
        a presentation detail: it is who to ask.
      required: [contact_id, colleagues]
      properties:
        contact_id: {type: string, format: uuid}
        colleagues: {type: array, items: {$ref: '#/components/schemas/ContactNetworkColleague'}}
    DealCoverageSeat:
      type: object
      description: One stakeholder seat, and whether it is a relationship or just a name.
      required: [contact_id, role, engaged]
      properties:
        contact_id: {type: string, format: uuid}
        contact_name:
          type: [string, 'null']
          description: >-
            The contact's display name. Null when the caller may not read that contact — the seat still counts toward coverage, because how many contacts carry a deal is not a fact this reader is being told they cannot know; only who they are. `our_side` has carried a display name from the start, and a buyer-side seat that carries only an id is the same list rendered half-anonymous.
        role: {type: string}
        engaged:
          type: boolean
          description: 'A two-way exchange in the window — both directions, not just our sends.'
    DealCoverageRisk:
      type: object
      description: |-
        One finding, with the records behind it. `kind` names the rule so a surface can
        explain the flag rather than assert it.
      required: [kind, summary]
      properties:
        kind:
          type: string
          enum: [single_threaded_theirs, single_threaded_ours, coverage_gap, champion_left, stakeholder_left, going_cold]
        summary: {type: string}
        contact_ids: {type: array, items: {type: string, format: uuid}}
        user_ids: {type: array, items: {type: string, format: uuid}}
        days_since_touch:
          type: [integer, 'null']
          minimum: 0
          description: |-
            Days since the deal's last captured touch, on `going_cold` only; null on every
            other kind. It carries the number rather than a second `kind`, so the 30-day and
            60-day no-touch views are the same finding filtered — a deal at
            61 days cannot appear on one surface and not the other.
    DealStatusCard:
      type: object
      description: |-
        Deal360 — the deal page's written briefing, the thing a rep reads in a
        minute before a call.
      required: [deal_id, story, generated_at, generated_by]
      properties:
        deal_id: {type: string, format: uuid}
        story:
          allOf: [{$ref: '#/components/schemas/DealStatusCardSection'}]
          description: |-
            What has happened and where that leaves things, in the order it
            happened. The section a reader with no memory of the deal starts at.
        blocker:
          allOf: [{$ref: '#/components/schemas/DealStatusCardSection'}]
          description: |-
            What is actually holding the deal up, named as a thing somebody can
            act on — an unsent mail, an unanswered objection, a decision-maker
            who has never replied. Absent when nothing is holding it up. "Time
            has passed" is not a blocker.
        buyer:
          allOf: [{$ref: '#/components/schemas/DealStatusCardSection'}]
          description: |-
            What the buyer wants, read from what they have said. What they are
            optimising for, what they have not objected to, what they asked for
            and never got. Absent when the buyer has said too little to read.
        verdict:
          allOf: [{$ref: '#/components/schemas/DealStatusCardVerdict'}]
          description: |-
            Whether this deal is real, and what that judgement rests on.
            Includes being willing to say it looks dead.
        next:
          allOf: [{$ref: '#/components/schemas/DealStatusCardMove'}]
          description: The one move to make, with the verb to perform it.
        reply_to:
          type: [string, 'null']
          format: uuid
          description: |-
            The inbound message an email from here would answer: the most recent
            one this deal has received that nobody has replied to. Null when the
            buyer has never written, or when the last thing they wrote has been
            answered — then a mail from here starts a thread rather than
            continuing one.
        generated_at: {type: string, format: date-time}
        generated_by: {$ref: '#/components/schemas/WrittenBy'}
      additionalProperties: false
    DealStatusCardVerdict:
      type: object
      description: |-
        An honest call on whether the deal closes, and why.
      required: [standing, because]
      properties:
        standing:
          type: string
          description: |-
            `live` — moving, with a next step both sides expect.
            `drifting` — nothing wrong, nothing happening; it dies of neglect if
            nobody acts.
            `blocked` — something specific is in the way and is named in `blocker`.
            `cold` — long silence after real engagement; treat as lost unless
            something changes.
            A plain string, not an inline enum, for the reason
            `DealRoomParticipantCapability` gives.
        because:
          allOf: [{$ref: '#/components/schemas/DealStatusCardSection'}]
          description: What the call rests on, cited like every other sentence.
      additionalProperties: false
    DealStatusCardSection:
      type: object
      required: [sentences]
      properties:
        sentences:
          type: array
          description: |-
            Each sentence cites the record it rests on. A sentence whose citations do
            not resolve is dropped whole rather than shown uncited.
          items: {$ref: '#/components/schemas/CompanyBriefSentence'}
      additionalProperties: false
    DealStatusCardMove:
      type: object
      description: |-
        The one thing to do next, and what performing it means. `action` is one of
        `draft_email`, `create_task`, `open_task`, `open_meeting_brief`, `none`.
        `open_task` opens existing work without creating another task. `arguments` is the body or operand the verb takes, ready
        to send; absent for `none`.
      required: [action, reason, evidence]
      properties:
        action: {type: string}
        reason: {type: string, description: "One sentence saying why this move and not another."}
        arguments:
          type: object
          additionalProperties: true
          description: "`draft_email`, `open_task` and `open_meeting_brief` carry `{activity_id}`; `create_task` carries a `CreateTaskRequest` body."
        evidence:
          type: array
          items: {$ref: '#/components/schemas/DealNextBestActionEvidence'}
      additionalProperties: false
    DealNextBestActionEvidence:
      type: object
      required: [text]
      properties:
        text: {type: string}
        activity_id: {type: [string, 'null'], format: uuid}
        occurred_at: {type: [string, 'null'], format: date-time}
        email_summary:
          allOf: [{$ref: '#/components/schemas/EmailSummary'}]
          readOnly: true
          nullable: true
          description: >-
            The canonical email row behind `activity_id`, when that activity is an email this reader may receive a summary of. The move's basis then opens the message it rests on instead of only naming it.
      additionalProperties: false
    DealCommitments:
      type: object
      required: [data, complete, has_more]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/DealCommitment'}}
        has_more:
          type: boolean
          description: True when more open commitments exist than the most urgent ones returned.
        complete:
          type: boolean
          description: False when a commitment was left out because its contact or its message is outside what the caller may read.
    DealCommitment:
      type: object
      required: [id, contact_id, contact_name, body, source_quote, source_activity_id, source_kind, occurred_at]
      properties:
        id: {type: string, format: uuid, description: 'The id of the claim, which `POST /claims/{id}/settle` takes.'}
        contact_id: {type: string, format: uuid}
        contact_name: {type: string}
        body: {type: string, description: 'What was committed to, in the language of the reader.'}
        source_quote: {type: string, description: 'The words it was read from, verbatim.'}
        source_activity_id: {type: string, format: uuid, description: 'The captured activity it was read from.'}
        source_kind: {type: string, description: 'The kind of activity it was read from (`email`, `meeting`, …), so a client opens it in the reader that kind needs.'}
        due_at: {type: string, format: date-time, nullable: true, description: 'Absent when the conversation named no day.'}
        occurred_at: {type: string, format: date-time, description: 'When it was said.'}
    DealCoverage:
      type: object
      required: [deal_id, stakeholders, our_side, risks, sections_omitted]
      properties:
        deal_id: {type: string, format: uuid}
        stakeholders: {type: array, items: {$ref: '#/components/schemas/DealCoverageSeat'}}
        our_side: {type: array, items: {$ref: '#/components/schemas/ContactNetworkColleague'}}
        risks: {type: array, items: {$ref: '#/components/schemas/DealCoverageRisk'}}
        sections_omitted:
          type: array
          description: |-
            The sections withheld for lack of the `relationship` grant — so a client can say
            "you can't see this" instead of "there is none". Never returned absent, and empty
            on the ordinary read: empty and forbidden are different answers, and a client that
            had to infer the difference from an empty `risks` array would render a withheld
            coverage view as a clean one.
          items:
            type: string
            enum: [stakeholders, our_side, risks]
    EmailSignatureTemplate:
      type: object
      required: [template]
      properties:
        template:
          type: string
          maxLength: 4000
          description: |-
            The workspace's signature layout as HTML, with the placeholders `{name}`, `{title}`,
            `{phone}` and `{logo}`. `{logo}` embeds the workspace's own company logo, sized for
            mail, in the message itself. A send keeps paragraphs, line breaks, bold, italic, underline, links
            and spans with a colour and a pixel size, and drops everything else. Empty means
            none: each member signs with their own plain-text signature.
    CompanyGraphEdge:
      type: object
      description: |-
        One edge, from the record that owns it to the record it points at. Both ends are
        always nodes in the same payload — an edge naming a record the caller may not
        read is dropped with its group, never returned dangling.
      required: [from, to, kind]
      properties:
        from: {type: string, format: uuid}
        to: {type: string, format: uuid}
        kind:
          type: string
          enum: [employment, has_deal, deal_stakeholder, parent_of, partner_of, referred_by, co_sell_with, owns, in_contact_with, corresponds_with]
          description: |-
            `employment` — the account employs the contact.
            `corresponds_with` — the two CONTACTS at its ends have been observed on the
            same captured activities. Undirected in fact (neither wrote "to" the other
            through us — we only saw them together), so `from`/`to` carry the pair's
            canonical order and mean nothing more. It is what stops the account picture
            being hub-and-spoke through our own team. Never drawn from a limited-audience
            activity, and it carries pooled counts only — no receipts, because the
            correspondence itself is not this caller's to read.
            `has_deal` — the deal belongs to the account.
            `deal_stakeholder` — the contact holds a stakeholder seat on the deal.
            `parent_of` — `from` is the parent company of `to` (the account's parent
            points at it; the account points at each child).
            `partner_of` / `referred_by` / `co_sell_with` — the A41 partner edges, from
            the company that records the edge to its counterparty.
            `owns` — `from` is the workspace member who owns the account.
            `in_contact_with` — `from` is the workspace member who has been IN recorded
            interactions (email, call, meeting) with the contact at `to`. It is drawn from
            the recorded participants of those interactions, so it holds for
            connector-captured mail as well as manually logged activity. Every participant
            role makes one, `cc` included: in an account team the contact permanently in
            copy is frequently the one who knows the customer, so excluding them removes
            exactly the contacts this edge exists to find. The quality bar sits in the score
            rather than a role filter — copy traffic is one-directional, so the reciprocity
            term ranks a permanently-cc'd colleague below anyone in a two-way thread. A
            task assigned to a teammate still makes none: an assignment is intent, while a
            recorded interaction is contact.
        role:
          type: [string, 'null']
          description: |-
            The edge's role where it has one — an employment title, a stakeholder role
            (champion, economic_buyer, …). Null on the edges that carry none, which includes
            both `owns` and `in_contact_with`.
        strength:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: |-
            How warm this particular colleague's relationship with this contact is, 0–100,
            on `in_contact_with` and `corresponds_with` edges only; null on every other
            kind, which describes a structural fact rather than a relationship. On
            `corresponds_with` the reciprocity term has nothing to say — no direction was
            observed between two externals — so the score leans on recency and frequency.
        strength_bucket:
          type: [string, 'null']
          enum: [none, weak, moderate, strong]
          description: |-
            The display band for `strength`, so a surface renders the same words everywhere.
            `none` means no qualifying interaction at all and is shown as "no signal yet",
            never as a zero: "we have never spoken" and "we spoke and it went cold" are
            different facts about an account.
    CompanyGraphIntroPath:
      type: object
      description: |-
        The warm-intro route the account's most recent open signal proposes: which signal,
        and which contact is the way in. The contact is ranked exactly as
        `GET /signals/{id}/intro-path` ranks it — strongest live relationship first — so
        the card and the warm room can never name different contacts.
      required: [signal_id, contact_id]
      properties:
        signal_id: {type: string, format: uuid}
        contact_id:
          type: string
          format: uuid
          description: 'The route-in contact. Always present in `nodes`, carrying `intro_path: true`.'
    CompanyCoverage:
      type: object
      required: [as_of, summary, deals, completeness]
      properties:
        as_of: {type: string, format: date-time}
        summary: {$ref: '#/components/schemas/CompanyCoverageSummary'}
        deals:
          type: array
          description: The account's open deals, so the reader can pick which committee to read.
          items: {$ref: '#/components/schemas/CompanyCoverageDeal'}
        selected_deal_id:
          type: string
          format: uuid
          nullable: true
          description: The deal the committee below describes. Null when the account has no visible open deal.
        best_way_in:
          $ref: '#/components/schemas/CompanyCoverageRoute'
        committee:
          $ref: '#/components/schemas/CompanyCoverageCommittee'
        completeness: {$ref: '#/components/schemas/CompanyCoverageCompleteness'}
    CompanyCoverageSummary:
      type: object
      required: [contacts_total, waiting, answered, no_reply, lapsed, untried]
      properties:
        contacts_total:
          type: integer
          description: Every contact the caller may see at this account, not a page of them.
        waiting: {type: integer, description: Contacts whose latest message we have not replied to.}
        answered: {type: integer, description: Contacts whose latest message we replied to inside the 90-day window.}
        no_reply: {type: integer, description: Contacts we have written to with nothing back.}
        untried: {type: integer, description: Contacts nobody has written to at all.}
        lapsed:
          type: integer
          description: >-
            Contacts whose exchange is real but older than the 90-day window. The five counts partition contacts_total, so a reader that ignores this one is short by exactly the contacts who have gone quiet.
    CompanyCoverageDeal:
      type: object
      required: [deal_id, name]
      properties:
        deal_id: {type: string, format: uuid}
        name: {type: string}
    CompanyCoverageRoute:
      type: object
      required: [contact_id, full_name, engagement]
      description: |-
        The warmest way into the account: the contact most worth writing to, by the same
        ranking the contact list opens on.
      properties:
        contact_id: {type: string, format: uuid}
        full_name: {type: string}
        title: {type: string, nullable: true}
        engagement: {$ref: '#/components/schemas/ContactEngagement'}
        last_inbound_at: {type: string, format: date-time, nullable: true}
    CompanyCoverageCommittee:
      type: object
      required: [seats, gaps, unlisted_seats]
      properties:
        seats:
          type: array
          items: {$ref: '#/components/schemas/CompanyCoverageSeat'}
        gaps:
          type: array
          description: |-
            The critical roles nobody holds on the selected deal — champion, then economic
            buyer. EMPTY whenever `unlisted_seats` is non-zero: a seat the caller cannot see
            is still a seat, and reporting a gap over a partial committee names a hole that
            may not exist.
          items: {type: string}
        unlisted_seats:
          type: integer
          description: |-
            Seats held by somebody this caller may not see. Counted rather than named, so the
            reader learns the committee is bigger than the list without learning who is on it.
    CompanyCoverageSeat:
      type: object
      required: [contact_id, full_name, role]
      properties:
        contact_id: {type: string, format: uuid}
        full_name: {type: string}
        role: {type: string}
        engagement: {$ref: '#/components/schemas/ContactEngagement'}
        relationship_version:
          type: integer
          format: int64
          minimum: 1
          description: |-
            The seat row's version, for the `If-Match` a patch against it carries.
        relationship_id:
          type: string
          format: uuid
          description: |-
            The seat's own row, which is what a reader patches to disagree with it —
            confirming the role, or changing it.
        ai_suggested:
          type: boolean
          description: |-
            The seat was read out of the contact's own messages rather than typed by a
            contact, and nobody has confirmed it yet.
        routes:
          $ref: '#/components/schemas/Company360ContactRoutes'
          description: |-
            Who on our side can reach this seat, strongest first — the same per-contact
            routes the company 360 carries, from the same read.
    CompanyCoverageCompleteness:
      type: object
      required: [committee_read]
      properties:
        committee_read:
          type: boolean
          description: |-
            Whether the buying committee could be read at all. False when the caller lacks the
            deal or relationship grant — the committee and its gaps are then absent rather than
            empty, because an empty committee and an unreadable one are different facts.
    ContactEngagement:
      type: string
      enum: [waiting, answered, no_reply, lapsed, untried]
      description: |-
        Where one contact stands with us, over the same 90-day window the relationship
        score uses. What decides between the two conversational states is who wrote
        LAST, not whether both directions have traffic.
    CompanyContact:
      type: object
      required: [contact_id, full_name, engagement, strength]
      properties:
        contact_id: {type: string, format: uuid}
        full_name: {type: string}
        title:
          type: string
          nullable: true
          description: The contact's job title, where one is on file.
        engagement: {$ref: '#/components/schemas/ContactEngagement'}
        strength: {$ref: '#/components/schemas/RelationshipStrength'}
        last_inbound_at:
          type: string
          format: date-time
          nullable: true
          description: |-
            When they last wrote to us, over ALL history rather than the window. A reply
            from two years ago is still the last thing they said, and the page prints it;
            `engagement` is what says whether it counts as current.
        last_outbound_at:
          type: string
          format: date-time
          nullable: true
          description: When we last wrote to them, over all history. Read beside `last_inbound_at`, the pair says which way the conversation is owed.
    CompanyContactListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/CompanyContact'}
        page: {$ref: '#/components/schemas/PageInfo'}
    CompanyGraph:
      type: object
      description: The account's one-hop connection graph, as nodes and edges the client lays out.
      required: [as_of, root_id, nodes, edges, dropped_count, groups_omitted]
      properties:
        as_of:
          type: string
          format: date-time
          description: The instant the assembling transaction read. Every group is consistent to this moment under Read Committed.
        root_id:
          type: string
          format: uuid
          description: 'The account the graph is centred on — the node carrying `root: true`.'
        nodes: {type: array, items: {$ref: '#/components/schemas/CompanyGraphNode'}}
        edges: {type: array, items: {$ref: '#/components/schemas/CompanyGraphEdge'}}
        dropped_count:
          type: integer
          minimum: 0
          description: |-
            How many nodes the per-group caps left out, summed across the groups that were
            read. Zero means the graph is the whole one-hop neighbourhood this caller can
            see; anything else means the card is showing a deterministic top slice.
        groups_omitted:
          type: array
          description: |-
            The groups withheld for lack of a grant — so a client can say "you can't see
            this" instead of "there is none". `contacts` withheld also withholds
            `deal_stakeholder` edges and the intro path, because both name a contact.
          items:
            type: string
            enum: [contacts, deals, intro_path, our_side]
        intro_path: {$ref: '#/components/schemas/CompanyGraphIntroPath'}
    Relationship:
      type: object
      description: |-
        The typed edge. Mirrors `relationship`. Shapes by `kind`:
        `employment` (contact↔company), `deal_stakeholder` (deal↔contact), `project_company`
        (project↔company, READ-ONLY here — it is written through `/projects/{id}/companies`, which
        holds the two rules this surface cannot: write authority over the project ROW, and the
        refusal that keeps a project's last company on it), `project_stakeholder`
        (project↔contact — the deal-stakeholder shape applied to a body of work), and the partner edges: `partner_of` (company served by a partner
        company), `referred_by` (company referred by a partner company), `co_sell_with` (company co-sold with a partner company).
        `works_with` is the one contact↔contact kind (contact_id ↔ counterparty_contact_id): two external
        contacts a rep asserts work together. Undirected in fact — the two columns carry no order,
        and one live edge exists per pair whichever way it was recorded.
      required: [id, kind, source, captured_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [employment, deal_stakeholder, project_stakeholder, project_company, partner_of, referred_by, co_sell_with, works_with, billing_contact]}
        contact_id: {type: [string, 'null'], format: uuid}
        company_id: {type: [string, 'null'], format: uuid}
        counterparty_company_id: {type: [string, 'null'], format: uuid, description: 'The other company on a partner edge (partner_of/referred_by/co_sell_with). Null for employment/deal_stakeholder.'}
        counterparty_contact_id: {type: [string, 'null'], format: uuid, description: 'The other contact on a works_with edge. Null for every other kind.'}
        deal_id: {type: [string, 'null'], format: uuid}
        project_id: {type: [string, 'null'], format: uuid, description: 'The project on a project_stakeholder or project_company edge. Null for every other kind.'}
        role:
          type: [string, 'null']
          description: >-
            employment: cto/vp_sales/...; deal or project stakeholder: champion/economic_buyer/blocker/influencer/user, plus sponsor/project_lead/delivery_lead/subject_matter_expert on a project.
        is_current_primary: {type: boolean, default: false, description: Employment; the one current primary employer (≤1 per contact).}
        employment_status: {type: string, enum: [current, former, unknown], description: 'Employment assertion. Omitted retains legacy date-based behavior; former and unknown never count as current merely because the end date is missing.'}
        started_precision: {type: string, enum: [day, month]}
        ended_precision: {type: string, enum: [day, month]}
        started_at: {type: [string, 'null'], format: date}
        ended_at: {type: [string, 'null'], format: date, description: Missing date; employment_status distinguishes former and unknown from ongoing.}
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal (human:<uuid> | agent:<id> | connector:<name>); never client-supplied.'}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    CreateRelationshipRequest:
      type: object
      required: [kind, source]
      properties:
        kind: {type: string, enum: [employment, deal_stakeholder, project_stakeholder, partner_of, referred_by, co_sell_with, works_with, billing_contact]}
        contact_id: {type: [string, 'null'], format: uuid}
        company_id: {type: [string, 'null'], format: uuid}
        counterparty_company_id: {type: [string, 'null'], format: uuid}
        counterparty_contact_id: {type: [string, 'null'], format: uuid}
        deal_id: {type: [string, 'null'], format: uuid}
        project_id: {type: [string, 'null'], format: uuid}
        role: {type: [string, 'null']}
        is_current_primary: {type: boolean}
        employment_status: {type: string, enum: [current, former, unknown], description: 'Employment assertion. Omitted retains legacy date-based behavior; former and unknown never count as current merely because the end date is missing.'}
        started_precision: {type: string, enum: [day, month]}
        ended_precision: {type: string, enum: [day, month]}
        started_at: {type: [string, 'null'], format: date}
        ended_at: {type: [string, 'null'], format: date}
        source: {type: string}
    UpdateRelationshipRequest:
      type: object
      properties:
        clear_started_at: {type: boolean, description: Remove an incorrect start date and its precision.}
        clear_ended_at: {type: boolean, description: Remove an incorrect end date and its precision.}
        role: {type: [string, 'null']}
        is_current_primary: {type: boolean}
        employment_status: {type: string, enum: [current, former, unknown], description: 'Employment assertion. Omitted retains legacy date-based behavior; former and unknown never count as current merely because the end date is missing.'}
        started_precision: {type: string, enum: [day, month]}
        ended_precision: {type: string, enum: [day, month]}
        started_at: {type: [string, 'null'], format: date}
        ended_at: {type: [string, 'null'], format: date}
    RelationshipListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Relationship'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    DealLastEmail:
      type: object
      description: The newest workspace-visible email on a deal, as `Deal.last_email` carries it.
      required: [occurred_at, direction]
      properties:
        occurred_at: {type: string, format: date-time}
        direction:
          type: [string, 'null']
          enum: [inbound, outbound, null]
          description: >-
            Which way the mail went. Null on a logged email that named no direction, which is a fact about how it was captured rather than about the exchange.
    Deal:
      type: object
      description: A deal. Mirrors the `deal` table.
      required: [id, name, pipeline_id, stage_id, status, source, captured_by, created_at, updated_at]
      properties:
        legal_hold:
          type: boolean
          readOnly: true
          description: >-
            True while a litigation or investigation hold is preserving this record. A held record is never acted on by a retention sweep and an Art. 17 erasure against it is refused, so a screen that offers either action has to know. Placed and lifted through /retention/legal-holds, never by an ordinary edit.
        tags: {type: array, items: {$ref: '#/components/schemas/RowTag'}}
        id: {type: string, format: uuid}
        name: {type: string}
        amount_minor: {type: [integer, 'null'], format: int64}
        currency: {type: [string, 'null'], pattern: '^[A-Z]{3}$'}
        expected_arr_minor: {type: [integer, 'null'], format: int64, description: 'Expected annual recurring revenue in minor units of `currency`. Null means the deal carries no recurring component, which is not the same as zero. `currency` is present exactly when `amount_minor` or `expected_arr_minor` is.'}
        arr_source_offer_id: {type: [string, 'null'], format: uuid, readOnly: true, description: 'The accepted offer `expected_arr_minor` came from, or null where a human set the figure. While it is set the recurring figure is the offer''s to state: an ordinary edit that would change or clear it is refused, and accepting another offer replaces both together.'}
        closing_occurrence_id: {type: [string, 'null'], format: uuid, readOnly: true, description: 'Which CLOSING this deal is currently on, as the id of the stage-history row that made it. Null while the deal is open, and null on a closed deal whose history does not record the move that closed it — an imported row, typically, where manufacturing an occurrence would invite a review of a closing nobody can point at. Reopening and re-closing yields a new one: the old closing stays in history and stays readable, it simply stops being the one this deal is on.'}
        masked_fields:
          type: array
          readOnly: true
          items: {type: string}
          description: >-
            The fields of THIS row withheld from the caller (a field mask — e.g. `amount_minor` for a rep on a deal they may read but not change), or pointing at a record they may not open. A named field is null because it is withheld, not because it is empty; absent or empty means nothing is withheld. Every withheld field is named, including one withheld only because another was: masking either money figure withholds both and the currency with them, and a withheld partner takes its attribution along. Sorting or filtering the list by any of them is refused (422).
        fx_rate_to_base: {type: [string, 'null'], description: 'Native→base, frozen at close (null while open). Decimal-as-string to avoid float rounding of the 10-dp rate.'}
        fx_rate_date: {type: [string, 'null'], format: date}
        pipeline_id: {type: [string, 'null'], format: uuid, description: 'The deal''s pipeline. A zero/placeholder UUID here is forbidden (dangling FK).'}
        stage_id: {type: [string, 'null'], format: uuid, description: 'The deal''s current stage; must belong to pipeline_id.'}
        company_id: {type: [string, 'null'], format: uuid, description: 'Primary company; never a raw lead. Null when the caller may not read that company, in which case `masked_fields` names it.'}
        partner_company_id: {type: [string, 'null'], format: uuid, description: 'Deal registration/attribution to a partner company. The company must have a live `partner` row — naming one that does not is refused 422 (`not_a_partner`), because commission prices from the margin tier on that row, and an attribution without one could never earn anything. Null when the caller may not read that company, in which case `masked_fields` names it.'}
        partner_attribution:
          type: [string, 'null']
          enum: [sourced, influenced, null]
          description: >-
            What the partner named by `partner_company_id` did: `sourced` (brought the deal) or `influenced` (helped one we had). Travels with the partner — naming a partner defaults it to `sourced`. Commission accrues on `sourced` only.
        description:
          type: [string, 'null']
          maxLength: 20000
          description: >-
            The human-authored statement of what the customer needs, what is in scope and what outcome is intended. Distinct from the GENERATED deal briefing: this is what a colleague wrote, and no assembler may overwrite it. It is supplied to the status/advice assembler as evidence, never as an instruction to follow.
        commercial_motion:
          type: [string, 'null']
          enum: [new_business, renewal, upsell, cross_sell, expansion, existing_business, null]
          description: >-
            Why this deal exists commercially: `new_business` (first purchase by this customer), `renewal` (continuing an agreement, when that is the primary purpose), `upsell` (more capacity or a higher tier of something they already have), `cross_sell` (a different offering to an existing customer), `expansion` (growth spanning offerings, or outside the more specific choices), `existing_business` (the relationship is known, the motion is not). A combined renewal-and-growth deal takes its PRIMARY purpose — one value is a reporting classification, not revenue split across motions. Null means unknown, which is different from `existing_business`: unknown has not been asked, `existing_business` has been asked and answered "not more precisely than this".
        priority:
          type: [string, 'null']
          enum: [low, medium, high, null]
          description: >-
            Human importance, set by a colleague and never derived. Deliberately independent of amount, score, stage and the computed urgency a worklist reads: those already exist, and a field that merely restates them would be a second answer to a question the product answers. Null is "nobody has said", not "medium" — new deals are born null and closing one preserves what it held.
        acquisition_source:
          type: [string, 'null']
          description: >-
            The business channel this opportunity came from, as an administered key from `/acquisition-sources` (referral, inbound, partner, event...). Deliberately NOT the technical `source` field beside it: `source` records how the RECORD reached Margince (a connector, an import, a crawl), while this records how the OPPORTUNITY reached the business. A deal typed in by hand can be a referral; an imported one can be outbound. Null means unclassified, which is different from the explicit `other` key.
        project_id: {type: [string, 'null'], format: uuid, description: 'The body of work this deal belongs to. A deal has at most one project; a project carries several deals over time. The deal and the project must name the same company — a cross-company pointer is refused 422. Null when the caller may not read that project, in which case `masked_fields` names it.'}
        owner_id: {type: [string, 'null'], format: uuid}
        writable:
          type: boolean
          readOnly: true
          description: >-
            Whether THIS caller may change THIS row: the same question the server's write gate answers on a mutation — the owner, the owner's team where the role is team-scoped, a live `write` record grant, or an unbounded seat. Server-computed per row, per caller. It is a UX signal, never the enforcement. A client uses it to draw or withhold edit affordances so a reader is not offered a control the save would refuse; the server refuses an unauthorized write with 403 whatever this said. Absent means NOT writable, so a client reading a response from a server too old to send it fails closed.
        status: {type: string, enum: [open, won, lost], default: open}
        lost_reason: {type: [string, 'null'], description: Required when status=lost.}
        won_without_contract_reason:
          type: [string, 'null']
          enum: [imported, purchase_order, verbal, renewal_by_email, other, null]
          readOnly: true
          description: >-
            Why this deal was won with no contract behind it. NULL on a won deal that HAS one — the two are distinguishable, which is what makes "how many won deals have no paper, and why" answerable. Cleared on reopen and on any transition away from won.
        won_without_contract_detail:
          type: [string, 'null']
          readOnly: true
          description: Required when the reason is `other`, which explains nothing on its own.
        forecast_category: {type: [string, 'null'], enum: [null, commit, best_case, pipeline, omitted]}
        expected_close_date: {type: [string, 'null'], format: date, description: 'An open deal may not have a close date in the past: saving one is rejected with 422 close_date_past, and a date that ages into the past is corrected by the nightly run.'}
        close_date_provisional: {type: boolean, readOnly: true, description: 'True while the close date is a machine-computed replacement awaiting human confirmation; a provisional deal stays out of Commit/Best-case. Cleared when a human sets the date.'}
        wait_until: {type: [string, 'null'], format: date, description: "'Customer asked us to wait until' date; suppresses the stalled flag but not the overdue close-date flag."}
        closed_at: {type: [string, 'null'], format: date-time}
        last_activity_at: {type: [string, 'null'], format: date-time, description: 'Drives the deterministic stalled flag. Counts workspace-audience activities only, so a deal whose only recent mail is limited to its participants reads as stalled.'}
        stalled: {type: boolean, readOnly: true, description: Derived — no activity past the threshold (absolute duration).}
        last_email:
          allOf: [{$ref: '#/components/schemas/DealLastEmail'}]
          nullable: true
          readOnly: true
          description: >-
            The newest email on this deal that the whole workspace may see — what a board card states as "last mail, N days ago" beside the deal, so a rep reads the silence without opening every card. Null on a deal nobody has mailed about. Counts what `last_activity_at` counts, narrowed to mail: workspace-audience rows only, and never the product's own system writing — a message limited to its participants must not move a date every colleague reads, and a mail the installation sent itself is not the buyer engaging. The rows a reader may discover through `GET /activities` can therefore be newer than this instant.
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal (human:<uuid> | agent:<id> | connector:<name>); never client-supplied.'}
        author:
          allOf: [{$ref: '#/components/schemas/SourceAuthor'}]
          readOnly: true
          nullable: true
          description: >-
            Who created this deal in the system it came FROM, present only on a record imported from another system whose importer named the author. Null on everything else, which is most rows: a deal somebody entered here has no author but the one `captured_by` already names.
        raw: {type: [object, 'null'], additionalProperties: true}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
      additionalProperties: true
    CreateDealRequest:
      type: object
      required: [name, pipeline_id, stage_id, source]
      properties:
