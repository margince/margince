        definition: {type: object, additionalProperties: true, description: 'A Live List''s new filter tree.'}
        sharing: {type: string, enum: [private, team, workspace]}
        team_id: {type: [string, 'null'], format: uuid, description: 'Null shares a team list with the teams of its owner.'}
        steward_id: {type: string, format: uuid}
    ListMemberChangeRequest:
      type: object
      required: [entity_type, entity_id]
      properties:
        entity_type: {type: string, enum: [contact, company, deal, lead, project]}
