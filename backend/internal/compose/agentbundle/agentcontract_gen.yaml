          type: object
          additionalProperties: true
          description: The saved column choice, sort, and filter state, in the list-view vocabulary; persisted and restored verbatim.
        version: {type: integer, format: int64, description: Optimistic-concurrency version; echo it in If-Match on update.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    CreateSavedViewRequest:
      type: object
      required: [resource, name, query]
