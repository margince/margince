    AdvanceDealRequest:
      type: object
      required: [to_stage_id]
      properties:
        to_stage_id: {type: string, format: uuid, description: Target stage (must belong to the deal's pipeline).}
        status: {type: string, enum: [open, won, lost], description: Set when advancing into a terminal stage.}
        lost_reason: {type: [string, 'null'], description: Required if status=lost.}
        won_without_contract_reason:
          type: [string, 'null']
          enum: [imported, purchase_order, verbal, renewal_by_email, other, null]
          description: >-
            Why this win has no agreement behind it. Omit when the deal has a signed contract with its paper attached — the server looks for one, and refuses a win that offers neither. Both answers are legitimate; recording which is what makes the gap countable.
        won_without_contract_detail:
          type: [string, 'null']
          maxLength: 500
          description: |-
            What the reason was. Required when it is `other`, which explains nothing alone.
    DealListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Deal'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    CommissionStatus:
      type: string
      enum: [accrued, approved, paid, void]
      description: 'accrued → approved → paid, with void as the exit at any point.'
    CommissionAttribution:
      type: string
      enum: [sourced, influenced]
      description: What the partner did for the deal the entry was accrued on.
    CommissionEntry:
      type: object
      description: |-
        What one partner earned on one won deal. Every rate-bearing value is frozen at accrual: the tier a human can change next
        quarter, and the deal amount that can be corrected after the close, would
        otherwise make the same entry answer a different question each time it is read.
        Carries no owner — visibility is inherited from the deal.
      required: [id, deal_id, partner_company_id, status, attribution_at_accrual, rate_bps, basis_amount_minor, currency, amount_minor, captured_by, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        deal_id: {type: string, format: uuid, description: The won deal this was accrued on.}
        partner_company_id: {type: string, format: uuid, description: The partner who earned it.}
        status: {$ref: '#/components/schemas/CommissionStatus'}
        trigger_event_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: 'The won-deal transition that produced this entry; null on one a human created. Unique, so a replayed event cannot accrue twice.'
        attribution_at_accrual: {$ref: '#/components/schemas/CommissionAttribution'}
        margin_tier_at_accrual:
          type: [string, 'null']
          description: The partner's tier as it stood at accrual; the rate below was derived from it.
        rate_bps:
          type: integer
          description: 'Basis points, so 15% is 1500 and no fractional-percent rounding enters the row.'
        basis_amount_minor: {type: integer, format: int64, description: The deal amount the rate applied to.}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        fx_rate_to_base:
          type: [string, 'null']
          description: 'Native→base at won time, carried so a base-currency roll-up reproduces without re-reading a deal whose frozen rate may since have been cleared.'
        amount_minor: {type: integer, format: int64, description: What the rate produced.}
        reversal_of:
          type: [string, 'null']
          format: uuid
          description: 'The entry this one undoes. A reversal is born void and is never approved or paid.'
        void_reason: {type: [string, 'null'], description: Required on a void; what a partner dispute is answered from.}
        captured_by: {type: string, readOnly: true, description: Server-stamped from the authenticated principal; never client-supplied.}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CommissionEntryListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/CommissionEntry'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    CommissionSummaryRow:
      type: object
      required: [partner_company_id, status, currency, entry_count, amount_minor]
      properties:
        partner_company_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/CommissionStatus'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        entry_count: {type: integer}
        amount_minor:
          type: integer
          format: int64
          description: 'Summed per currency, never across: two currencies added together is a number that means nothing.'
    CommissionSummaryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/CommissionSummaryRow'}
    Contract:
      type: object
      additionalProperties: true
      description: |-
        An agreement between the installation and one company. Mirrors the
        `contract` table. Carries no owner: visibility is inherited from the linked
        deal, falling back to the company.
      required: [id, title, status, value_basis, under_contract, source, captured_by, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        masked_fields:
          type: array
          readOnly: true
          items: {type: string}
          description: >-
            The fields of THIS row the caller may not read (a field mask). A named field is null because it is withheld, not because it is empty; absent or empty means nothing is withheld.
        company_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The counterparty. A company holds many contracts. Every contract has one, so null here always means withheld — a reader admitted through the DEAL may not be able to open the company, and handing the id back would make the agreement an existence oracle over a row their own company read refuses. `masked_fields` names it.
        deal_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The deal this agreement came from, when there was one. Absent on an import or a renewal that never ran through the pipeline, and null ALSO when the reader may not open that deal — the two are told apart by `masked_fields`, which names it only in the second case.
        project_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The delivery this agreement funds, when one is attached. Null for no project and for a project the reader may not open; `masked_fields` names it only in the second case.
        contract_number:
          type: [string, 'null']
          description: 'Free text: an imported agreement carries whatever number the counterparty''s own system gave it. Duplicates within an account are permitted: two systems reusing a number is their business, not a reason to refuse the row.'
        title: {type: string}
        value_minor:
          type: [integer, 'null']
          format: int64
          description: 'Total contract value in minor units, or twelve months of billing when `value_basis` is `annualized_12m`. Present exactly when `currency` is.'
        currency: {type: [string, 'null'], minLength: 3, maxLength: 3}
        arr_minor: {type: [integer, 'null'], format: int64, description: 'Annual recurring revenue in minor units of `currency`. Null means the agreement carries no recurring component, which is not the same as zero. `currency` is present exactly when `value_minor` or `arr_minor` is.'}
        value_basis:
          type: string
          enum: [total, annualized_12m]
          default: total
          description: |-
            What `value_minor` measures. An open-ended agreement has
            no finite total, so it records twelve months and says so. Figures on
            different bases are never summed — thirty-six months plus twelve months is
            not forty-eight months of anything.
        fx_rate_to_base:
          type: [string, 'null']
          description: Conversion rate frozen at activation. Present exactly when `fx_rate_date` is.
        fx_rate_date: {type: [string, 'null'], format: date}
        starts_on: {type: [string, 'null'], format: date}
        ends_on:
          type: [string, 'null']
          format: date
          description: Absent means open-ended.
        renewal_on: {type: [string, 'null'], format: date}
        auto_renew: {type: boolean, default: false}
        notice_period_days:
          type: [integer, 'null']
          minimum: 0
          description: Drives the renewal warning, which fires against the notice deadline rather than the renewal date.
        payment_term_days:
          type: [integer, 'null']
          minimum: 0
          description: >-
            How many days the customer has to pay. Zero is a real value and means due on receipt; absent means nobody has recorded terms, which is not the same thing.
        status:
          type: string
          enum: [draft, active, expired, cancelled, superseded]
          default: draft
          readOnly: true
          description: 'Read-only here: asserted through changeContractStatus so the transition, its event and any proposal are written from one transaction.'
        signed_on:
          type: [string, 'null']
          format: date
          description: 'When a human asserts it was signed. Never derived from a deal close time, and never a signing ceremony — in-product e-signature stays removed (A94).'
        cancellation_notice_on: {type: [string, 'null'], format: date}
        cancellation_effective_on:
          type: [string, 'null']
          format: date
          description: 'When the agreement actually ends. Never after `ends_on`: a cancellation cannot extend a term that already expired.'
        superseded_by_id:
          type: [string, 'null']
          format: uuid
          description: The successor that replaced this agreement, forming the renewal chain.
        under_contract:
          type: boolean
          readOnly: true
          description: |-
            The DERIVED reading: computed from the dates as of today,
            not read from `status`. The two may disagree, and a surface shows both — a
            contract whose dates have passed while its status change awaits approval is
            no longer under contract and still reports the status it was left in.
        source: {type: string}
        captured_by:
          type: string
          readOnly: true
          description: >-
            The principal that recorded this agreement, prefixed by kind ("human:<id>" / "agent:<id>").
        version: {type: integer, format: int64, readOnly: true}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
        archived_at: {type: [string, 'null'], format: date-time, readOnly: true}
    ContractListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Contract'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    Project:
      type: object
      description: A project — the body of work a client relationship is made of. Mirrors the `project` table.
      required: [id, name, phase, source, captured_by, created_at, updated_at]
      properties:
        legal_hold:
          type: boolean
          readOnly: true
          description: >-
            True while a litigation or investigation hold is preserving this record. A held record is never acted on by a retention sweep and an Art. 17 erasure against it is refused, so a screen that offers either action has to know. Placed and lifted through /retention/legal-holds, never by an ordinary edit.
        id: {type: string, format: uuid}
        name: {type: string}
        key:
          type: [string, 'null']
          pattern: '^[A-Za-z][A-Za-z0-9_-]{1,23}$'
          description: 'The short handle a human writes in a subject line. Letter-led and bounded so it can never be a bare number, which would match dates, amounts and order numbers. Unique among LIVE projects; archiving frees it.'
        masked_fields:
          type: array
          readOnly: true
          items: {type: string}
          description: >-
            The fields of THIS row the caller may not read (a field mask). A named field is null because it is withheld, not because it is empty; absent or empty means nothing is withheld.
        companies:
          type: array
          readOnly: true
          items: {$ref: '#/components/schemas/ProjectCompany'}
          description: >-
            The companies working this project, in the order they were attached. A project is work several companies do together — a customer, a partner, a subcontractor — so this is a list rather than one anchor. A company the caller may not read is OMITTED rather than named, so an empty list can mean either "no companies yet" or "none you can see".
        company_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The project's customer: the first company attached with that role, or null when the caller may not read it (in which case `masked_fields` names it) or when the project has no customer. It is a view of `companies`, kept because a project's client is the one company most readers mean; the full picture is the list.
        owner_id: {type: [string, 'null'], format: uuid}
        writable:
          type: boolean
          readOnly: true
          description: >-
            Whether THIS caller may change THIS row: the same question the server's write gate answers on a mutation — the owner, the owner's team where the role is team-scoped, a live `write` record grant, or an unbounded seat. Server-computed per row, per caller. It is a UX signal, never the enforcement. A client uses it to draw or withhold edit affordances so a reader is not offered a control the save would refuse; the server refuses an unauthorized write with 403 whatever this said. Absent means NOT writable, so a client reading a response from a server too old to send it fails closed.
        phase:
          type: string
          enum: [initiative, pursuing, delivering, closed]
          default: initiative
          readOnly: true
          description: 'Read-only here: transitions go through advanceProjectPhase so the history row and project.phase_changed are written from one transaction.'
        closed_reason: {type: [string, 'null'], description: Required when phase=closed.}
        description: {type: [string, 'null']}
        started_at: {type: [string, 'null'], format: date}
        target_end_date: {type: [string, 'null'], format: date}
        ended_at: {type: [string, 'null'], format: date}
        last_activity_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: 'The newest workspace-audience activity filed under the project, maintained from the timeline on link write; a read accelerator that a rebuild must reproduce. A message limited to its participants does not move it, even for a reader who may read that message: one number every reader sees can only count what every reader may see.'
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal; never client-supplied.'}
        author:
          allOf: [{$ref: '#/components/schemas/SourceAuthor'}]
          readOnly: true
          nullable: true
          description: >-
            Who created this project in the system it came FROM, present only on a record imported from another system whose importer named the author. Null on everything else, which is most rows: a project somebody entered here has no author but the one `captured_by` already names.
        raw: {type: [object, 'null'], additionalProperties: true}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
      additionalProperties: true
    Project360:
      type: object
      description: |-
        The project page in one payload. Every section except `project` is optional: absent
        means the caller lacks its grant, and `sections_omitted` names it. `documents` rides the
        project grant itself, so it is present whenever the page is.
      required: [as_of, project, sections_omitted]
      properties:
        as_of:
          type: string
          format: date-time
          description: The instant the assembling transaction read. Sections are consistent to this moment under Read Committed.
        project: {$ref: '#/components/schemas/Project'}
        sections_omitted:
          type: array
          description: The sections withheld for lack of a grant — so a client can say "you can't see this" instead of "there is none".
          items: {$ref: '#/components/schemas/Project360Section'}
        company:
          $ref: '#/components/schemas/Project360Company'
        phase_history:
          $ref: '#/components/schemas/Project360PhaseHistory'
        deals:
          type: object
          description: The deals rolled up to the project, newest first, every status.
          required: [data, page]
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Deal'}}
            page: {$ref: '#/components/schemas/PageInfo'}
        stakeholders:
          type: object
          description: The contacts seated on the project (`project_stakeholder` edges), each with the name the caller may read.
          required: [data, page]
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Project360Stakeholder'}}
            page: {$ref: '#/components/schemas/PageInfo'}
        health:
          $ref: '#/components/schemas/Project360Health'
        contracts: {$ref: '#/components/schemas/ContractListResponse'}
        documents:
          type: object
          description: The files attached to the project itself, newest first.
          required: [data, page]
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
            page: {$ref: '#/components/schemas/PageInfo'}
        commitments:
          type: object
          description: The open tasks filed under the project, soonest due first, undated last.
          required: [data, page]
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Project360Commitment'}}
            page: {$ref: '#/components/schemas/PageInfo'}
        activities: {$ref: '#/components/schemas/ActivityListResponse'}
        coverage: {$ref: '#/components/schemas/Project360Coverage'}
        rollups: {$ref: '#/components/schemas/Project360Rollups'}
    ProjectHealthState:
      type: string
      enum: [on_track, at_risk, off_track]
      description: How a project is going, as somebody judged it.
    ProjectHealthAssessment:
      type: object
      description: >-
        One judgement of how a project is going, on the day it applies to. Assessments are never edited: a mistake is corrected by superseding the row, so what was said and when it was said both survive the correction.
      required: [id, project_id, state, assessed_at, source, created_at, superseded]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/ProjectHealthState'}
        note:
          type: string
          description: >-
            Why. Required for anything but `on_track` — a risk nobody explained is an alarm nobody can act on.
        assessed_at:
          type: string
          format: date-time
          description: >-
            When the judgement APPLIES, which is not when it was written: a lead catching up on Monday records Friday's reading, and the timeline shows it on Friday.
        source: {type: string, readOnly: true, description: What recorded this assessment.}
        source_author:
          type: string
          readOnly: true
          description: >-
            Who is on record as having judged it, when that is not whoever typed it in.
        superseded:
          type: boolean
          readOnly: true
          description: True when a later correction replaced this reading.
        superseded_by_id:
          type: string
          format: uuid
          readOnly: true
          description: The correction that replaced it, when one has.
        supersedes_assessment_id:
          type: string
          format: uuid
          readOnly: true
          description: The reading this one corrects, when it is a correction.
        created_at: {type: string, format: date-time, readOnly: true}
    ProjectHealthAssessmentListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ProjectHealthAssessment'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    Project360Health:
      type: object
      description: >-
        How the project is going now. `current` is absent when nobody has judged it yet, which is different from a project judged and found healthy.
      properties:
        current: {$ref: '#/components/schemas/ProjectHealthAssessment'}
    Project360Section:
      type: string
      description: One section of the project page, as `sections_omitted` names it.
      enum: [company, phase_history, deals, stakeholders, contracts, commitments, activities, coverage, rollups, health]
    Project360Company:
      type: object
      description: The company the project is for — the two fields a page header needs, read under the company grant and row scope.
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Project360PhaseHistory:
      type: object
      description: |-
        Every phase transition the project has made, oldest first — the birth row has
        `from_phase` null — and the fold over them: how long the project has spent in each
        phase so far, in the order the phases were first entered. A re-opened project visits a
        phase twice; its seconds are summed.
      required: [data, phase_durations]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Project360PhaseTransition'}}
        phase_durations: {type: array, items: {$ref: '#/components/schemas/Project360PhaseDuration'}}
    Project360PhaseTransition:
      type: object
      required: [id, from_phase, to_phase, reason, changed_at, changed_by]
      properties:
        id: {type: string, format: uuid}
        from_phase: {type: [string, 'null'], description: Null on the birth row.}
        to_phase: {type: string}
        reason: {type: [string, 'null']}
        changed_at: {type: string, format: date-time}
        changed_by:
          type: object
          description: The principal that moved the phase — its id as stamped; and the seat's display name when the id names an app user.
          required: [id, display_name]
          properties:
            id: {type: string}
            display_name: {type: [string, 'null']}
    Project360PhaseDuration:
      type: object
      required: [phase, seconds, current]
      properties:
        phase: {type: string}
        seconds:
          type: integer
          format: int64
          minimum: 0
          description: Time spent in the phase so far, summed over every visit, measured up to `as_of` for the current one.
        current:
          type: boolean
          description: True for the phase the project is in at `as_of`.
    Project360Stakeholder:
      type: object
      required: [relationship_id, contact_id, contact_name, role]
      properties:
        relationship_id: {type: string, format: uuid}
        contact_id: {type: string, format: uuid}
        contact_name:
          type: [string, 'null']
          description: Null when the caller may not read the contact, or the contact is archived; the seat is still reported.
        role: {type: [string, 'null']}
    Project360Commitment:
      type: object
      required: [activity_id, subject, due_at, assignee_id, assignee_name, overdue]
      properties:
        activity_id: {type: string, format: uuid}
        subject: {type: string}
        due_at: {type: [string, 'null'], format: date-time}
        assignee_id: {type: [string, 'null'], format: uuid}
        assignee_name: {type: [string, 'null']}
        overdue: {type: boolean, description: Dated and already past at `as_of`.}
    Project360Coverage:
      type: object
      description: |-
        How well the project's correspondence is filed, counted over the caller's activity row
        scope. `attributed` is every live activity linked to the project (its whole lifecycle,
        and the same number as `rollups.activity_count`); `unattributed_nearby` is every live
        activity linked to one of the project's deals or stakeholder contacts that carries no
        project link at all — the filing debt a rep can work down.
      required: [attributed, unattributed_nearby]
      properties:
        attributed: {type: integer, minimum: 0}
        unattributed_nearby: {type: integer, minimum: 0}
    Project360Rollups:
      type: object
      description: |-
        The header figures. Money is in the installation's base currency at each deal's frozen
        rate, summed over the caller's deal row scope; the counts are over the caller's
        activity row scope. Present only when the caller holds both the deal and the activity
        grant, since a header that showed one half would read as a project with no deals or
        no work.
      required: [open_deal_value, won_deal_value, open_commitments, last_activity_at, activity_count]
      properties:
        open_deal_value: {$ref: '#/components/schemas/Money'}
        won_deal_value: {$ref: '#/components/schemas/Money'}
        open_commitments:
          type: integer
          minimum: 0
          description: Open tasks filed under the project, whole lifecycle.
        last_activity_at:
          type: [string, 'null']
          format: date-time
          description: 'The newest WORKSPACE-AUDIENCE activity filed under the project; null when nothing is filed yet. A message limited to its participants does not move it, even for a reader who may read that message.'
        activity_count: {type: integer, minimum: 0, description: Every live activity filed under the project.}
    CreateProjectRequest:
      type: object
      required: [name, company_id, source]
      properties:
        name: {type: string}
        company_id: {type: string, format: uuid}
        owner_id: {type: [string, 'null'], format: uuid}
        description: {type: [string, 'null']}
        started_at: {type: [string, 'null'], format: date}
        target_end_date: {type: [string, 'null'], format: date}
        source: {type: string}
        source_system: {type: [string, 'null'], description: 'Which external system this record came from, when a caller imported it.'}
        source_author_id: {type: [string, 'null'], format: uuid, description: 'Who wrote this record in the system it came from, when the author holds a seat here. Written only by a declared importer, only beside a source_system; either author field or both may be sent, and the seat''s current name wins on read. captured_by still names the caller.'}
        source_author_name: {type: [string, 'null'], maxLength: 200, description: 'The source system''s own spelling of who wrote this record. Same door as source_author_id: a declared importer only, beside a source_system. Kept when a seat is also named, so the name survives the seat.'}
      additionalProperties: true
    SetProjectCompanyRequest:
      type: object
      required: [company_id]
      properties:
        company_id: {type: string, format: uuid}
        role:
          type: string
          description: 'What this company is to the project; defaults to `customer` when omitted.'
      additionalProperties: false
    ProjectCompanyListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ProjectCompany'}
      additionalProperties: false
    ProjectCompany:
      type: object
      description: One company's place on a project.
      required: [company_id, display_name, role]
      properties:
        company_id: {type: string, format: uuid}
        display_name: {type: string}
        role:
          type: string
          description: >-
            What this company is to the project — `customer` is its client, and the rest name the other sides of a joint delivery. Free text rather than an enum: an installation whose deliveries have a shape this vocabulary does not carry should not have to rename it.
      additionalProperties: false
    UpdateProjectRequest:
      type: object
      description: |-
        Note `phase` is absent by design — it moves only through advanceProjectPhase.
        `key` is absent for a different reason: the server mints it from the name and
        it is read-only thereafter. A key is what a human writes in a subject line to
        file mail under a project, so a caller-chosen one is a matcher a caller can
        get wrong — a project keyed after a contact's name would claim every bracketed
        mention of that word.
      properties:
        name: {type: string}
        owner_id: {type: [string, 'null'], format: uuid}
        description: {type: [string, 'null']}
        started_at: {type: [string, 'null'], format: date}
        target_end_date: {type: [string, 'null'], format: date}
        ended_at: {type: [string, 'null'], format: date}
      additionalProperties: true
    AdvanceProjectPhaseRequest:
      type: object
      required: [to_phase]
      properties:
        to_phase: {type: string, enum: [initiative, pursuing, delivering, closed]}
        reason: {type: [string, 'null'], description: 'Required when to_phase=closed (422 closed_reason_required); recorded on the phase-history row either way.'}
    BulkRecordType:
      type: string
      description: |-
        The kind of record a bulk change acts on. One change acts on one kind. A lead takes every
        verb but `archive` and `complete`: a lead leaves the queue by being disqualified, which has
        no bulk verb.
        A `worklist_item` is a task or a promise (a conversation claim) as the Worklist lists it,
        named by the id its row carries; `complete` is its only verb, and no other kind takes it.
      enum: [contact, company, deal, lead, worklist_item]
    BulkVerb:
      type: string
      description: |-
        What a bulk change does to each record. `reassign_owner` hands the record to `owner_id`;
        `archive` retires it exactly as the single-record archive does. `add_to_list` and
        `remove_from_list` add it to or take it off the Shortlist `list_id` names, exactly as
        `addListMember` and `removeListMember` do, and change nothing on the record itself.
        `add_tag` and `remove_tag` put the tag `tag_id` names on the record or take it off, exactly
        as `applyTag` and `removeTag` do. `create_task` files one new task, described by `task`,
        under each record, exactly as `createTask` does. `complete` marks a `worklist_item` done:
        a task exactly as `updateActivity` with `is_done: true` does, a promise exactly as
        `settleConversationClaim` with `outcome: done` does.
      enum: [reassign_owner, archive, add_to_list, remove_from_list, add_tag, remove_tag, create_task, complete]
    BulkTask:
      type: object
      description: The task `create_task` files under every record of the selection.
      required: [subject]
      properties:
        subject: {type: string, minLength: 1, maxLength: 500, description: 'What has to be done, as one line.'}
        due_at: {type: string, format: date-time, description: 'When it is due. Optional.'}
        assignee_id: {type: string, format: uuid, description: 'Who owes it. Defaults to the caller; must name a colleague the caller may hand work to.'}
    BulkItem:
      type: object
      description: One selected record and the version the caller was shown.
      required: [id, version]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, format: int64, description: 'The version the caller read. A record whose version has moved since is skipped as `changed_since_preview`.'}
    BulkChangePreviewRequest:
      type: object
      required: [record_type, verb, items]
      properties:
        record_type: {$ref: '#/components/schemas/BulkRecordType'}
        verb: {$ref: '#/components/schemas/BulkVerb'}
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/BulkItem'}
        owner_id: {type: string, format: uuid, description: 'The new owner. Required for `reassign_owner` and refused for every other verb.'}
        list_id: {type: string, format: uuid, description: 'The Shortlist. Required for `add_to_list` and `remove_from_list` and refused for every other verb.'}
        note: {type: string, maxLength: 500, description: 'Why, for `add_to_list` and `remove_from_list`: recorded on every membership change the batch makes.'}
        tag_id: {type: string, format: uuid, description: 'The tag. Required for `add_tag` and `remove_tag` and refused for every other verb.'}
        task: {$ref: '#/components/schemas/BulkTask'}
    BulkChangeExecuteRequest:
      type: object
      required: [record_type, verb, items]
      properties:
        record_type: {$ref: '#/components/schemas/BulkRecordType'}
        verb: {$ref: '#/components/schemas/BulkVerb'}
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/BulkItem'}
        owner_id: {type: string, format: uuid, description: 'The new owner. Required for `reassign_owner` and refused for every other verb.'}
        list_id: {type: string, format: uuid, description: 'The Shortlist. Required for `add_to_list` and `remove_from_list` and refused for every other verb.'}
        note: {type: string, maxLength: 500, description: 'Why, for `add_to_list` and `remove_from_list`: recorded on every membership change the batch makes.'}
        tag_id: {type: string, format: uuid, description: 'The tag. Required for `add_tag` and `remove_tag` and refused for every other verb.'}
        task: {$ref: '#/components/schemas/BulkTask'}
        confirm_token: {type: string, description: 'The token a preview of exactly this selection returned. Required above 10 records.'}
    BulkSkipReason:
      type: string
      description: |-
        Why a record is left alone. `not_found`: the caller cannot see it, or it is already
        archived. `not_writable`: the caller may read it but not change it. `changed_since_preview`:
        its version moved since the caller read it. `no_change`: it already has this owner, is
        already on (or already off) the Shortlist, or already carries (or already lacks) the tag.
        `anchor_company`: it is the installation's own company, which is never archived.
        `not_previewed`: the preview whose token this execution presents did not list it.
        `refused`: a single-record rule refuses it; `code` says which.
      enum: [not_found, not_writable, changed_since_preview, no_change, anchor_company, not_previewed, refused, changed_since_batch, merged, erased, value_taken, no_previous_owner]
    BulkSkip:
      type: object
      required: [id, reason]
      properties:
        id: {type: string, format: uuid}
        reason: {$ref: '#/components/schemas/BulkSkipReason'}
        code:
          type: string
          description: |-
            Which single-record rule refused the record, when the reason is `refused` — the same
            code the single-record operation answers, for example `sole_project_company`.
        params:
          type: object
          additionalProperties: true
          description: The values the rule named, when it named any.
        message: {type: string, description: 'The refusal in English, for a code the client does not know.'}
    BulkRecordState:
      type: object
      description: The facts a bulk change can move on a record.
      required: [owner_id, archived]
      properties:
        owner_id: {type: [string, 'null'], format: uuid}
        archived: {type: boolean}
        listed: {type: boolean, description: 'For a list verb, whether the record is on the Shortlist.'}
        tagged: {type: boolean, description: 'For a tag verb, whether the record carries the tag.'}
        task_id: {type: string, format: uuid, description: 'For `create_task`, the task filed under the record, once the change ran.'}
        done: {type: boolean, description: 'For `complete`, whether the task or promise is done.'}
    BulkSampleRow:
      type: object
      description: One record the change would alter, as it is and as it would be.
      required: [id, label, before, after]
      properties:
        id: {type: string, format: uuid}
        label: {type: string, description: The record's name as its list shows it.}
        before: {$ref: '#/components/schemas/BulkRecordState'}
        after: {$ref: '#/components/schemas/BulkRecordState'}
    BulkChangePreview:
      type: object
      required: [record_type, verb, count, affected, excluded, sample, requires_confirmation]
      properties:
        record_type: {$ref: '#/components/schemas/BulkRecordType'}
        verb: {$ref: '#/components/schemas/BulkVerb'}
        count: {type: integer, description: The number of records the change would alter.}
        affected:
          type: array
          description: The records the change would alter.
          items: {type: string, format: uuid}
        excluded:
          type: array
          description: The records the change would leave alone, each with its reason.
          items: {$ref: '#/components/schemas/BulkSkip'}
        sample:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/BulkSampleRow'}
        requires_confirmation: {type: boolean}
        confirm_token: {type: string, description: 'Present when the change would alter at least one record. Required above 10 records; below that, presenting it holds the execution to `affected`.'}
        expires_at: {type: string, format: date-time}
    BulkChangeResult:
      type: object
      required: [batch_id, changed, skipped]
      properties:
        batch_id: {type: string, format: uuid, description: 'The id every audit row of this change carries as `batch_id`.'}
        changed: {type: integer, description: The number of records changed.}
        skipped:
          type: array
          description: The records left alone, each with its reason.
          items: {$ref: '#/components/schemas/BulkSkip'}
        left_behind:
          type: array
          description: What an undo restored a record without, because it could not come back.
          items: {$ref: '#/components/schemas/BulkLeftBehind'}
        undo_of: {type: string, format: uuid, description: 'For an undo, the change it put back.'}
    BulkLeftBehind:
      type: object
      description: |-
        One thing an undo could not bring back with its record. `kind` names the child table, or
        `list` and `tag` for a membership or tag; `ref_id` is that row, list or tag.
      required: [id, kind, ref_id]
      properties:
        id: {type: string, format: uuid, description: The record that was restored.}
        kind:
          type: string
          enum: [contact_email, contact_phone, contact_channel_identity, relationship, company_domain, company_relationship_type, partner, list, tag]
        ref_id: {type: string, format: uuid}
    BulkUndoRequest:
      type: object
      properties:
        confirm_token: {type: string, description: 'The token `previewBulkUndo` returned. Required above 10 records.'}
    BulkOperation:
      type: object
      description: One executed bulk change or undo, as `getBulkChange` reads it.
      required: [batch_id, record_type, verb, changed, skipped, left_behind, created_at]
      properties:
        batch_id: {type: string, format: uuid}
        record_type: {$ref: '#/components/schemas/BulkRecordType'}
        verb: {$ref: '#/components/schemas/BulkVerb'}
        owner_id: {type: string, format: uuid, description: 'The new owner a reassignment named.'}
        list_id: {type: string, format: uuid, description: 'The Shortlist a list verb named.'}
        tag_id: {type: string, format: uuid, description: 'The tag a tag verb named.'}
        task: {$ref: '#/components/schemas/BulkTask'}
        changed: {type: integer, description: The number of records changed.}
        skipped:
          type: array
          items: {$ref: '#/components/schemas/BulkSkip'}
        left_behind:
          type: array
          items: {$ref: '#/components/schemas/BulkLeftBehind'}
        undo_of: {type: string, format: uuid, description: 'Set on an undo: the change it put back.'}
        undone_by: {type: string, format: uuid, description: 'Set once the change was undone: the undo that put it back.'}
        created_at: {type: string, format: date-time}
    SetProjectStakeholderRequest:
      type: object
      required: [contact_id, role]
      properties:
        contact_id: {type: string, format: uuid}
        role:
          type: string
          enum: [champion, economic_buyer, blocker, influencer, user, sponsor, project_lead, delivery_lead, subject_matter_expert]
          description: 'The deal-stakeholder vocabulary plus the delivery roles a body of work running past close needs.'
    ProjectListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Project'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    Stage:
      type: object
      description: A pipeline stage. Mirrors the `stage` table.
      required: [id, pipeline_id, name, position, semantic, win_probability]
      properties:
        id: {type: string, format: uuid}
        pipeline_id: {type: string, format: uuid}
        name: {type: string}
        position: {type: integer, description: Unique within the pipeline.}
        semantic: {type: string, enum: [open, won, lost], default: open}
        win_probability: {type: integer, minimum: 0, maximum: 100, description: 'won=100, lost=0, open=0..100.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    StageEvidence:
      type: object
      description: |-
        One observation about a deal against one of its stage's exit criteria.
        Configuration says what a stage requires;
        this says what was seen, and where.
      required: [id, deal_id, criterion_id, source_type, source_id, author_side, commitment, met, observed_at, extracted_by]
      properties:
        id: {type: string, format: uuid}
        deal_id: {type: string, format: uuid}
        criterion_id: {type: string, format: uuid}
        source_type: {$ref: '#/components/schemas/StageEvidenceSource'}
        source_id:
          type: string
          format: uuid
          description: |-
            The activity, contract or deal-room decision this was read from.
        source_lines:
          type: [array, 'null']
          items: {type: integer}
          description: |-
            1-based transcript lines, when the claim quotes one.
        snippet:
          type: [string, 'null']
          description: The cited words, at most 500 characters.
        author_side: {$ref: '#/components/schemas/StageEvidenceAuthorSide'}
        commitment: {$ref: '#/components/schemas/StageEvidenceCommitment'}
        met:
          type: boolean
          description: Whether the criterion was satisfied, not merely discussed.
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: |-
            How sure the reader was. Absent for a deterministic writer: a record
            either states the fact or it does not.
        observed_at: {type: string, format: date-time}
        extracted_by:
          type: string
          description: |-
            Which writer made the claim — `deterministic`, or the model task that read it.
        refuted_at:
          type: [string, 'null']
          format: date-time
          description: |-
            When a human marked this claim incorrect. The row survives: why a
            stage move was reversed is a question asked later.
        refuted_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, format: int64}
    StageEvidenceSource:
      type: string
      description: What kind of record the observation was read from.
      enum: [activity, contract]
    StageEvidenceAuthorSide:
      type: string
      description: |-
        Who authored the cited thing. Computed by the engine from the activity's
        direction, its participants and the installation's own email domains —
        never claimed by a model.
      enum: [buyer, seller, unknown]
    StageEvidenceCommitment:
      type: string
      description: |-
        Whether the cited text agreed to the thing or merely floated it. "We
        could meet Thursday" is `proposed`; "Thursday works" is `agreed`.
      enum: [agreed, proposed, none]
    StageEvidenceListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/StageEvidence'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    StageExitCriterion:
      type: object
      description: |-
        One thing that must be true of a deal before it leaves a stage. Configuration, not observation: whether a
        particular deal has met it is evidence recorded elsewhere.
      required: [id, stage_id, key, label, kind, required, position]
      properties:
        id: {type: string, format: uuid}
        stage_id: {type: string, format: uuid}
        key:
          type: string
          description: |-
            The stable machine name an evidence extractor cites. Unique among the
            stage's live criteria and never editable; archiving frees it for reuse.
        label: {type: string, description: What a human reads.}
        kind: {$ref: '#/components/schemas/StageCriterionKind'}
        required:
          type: boolean
          default: true
          description: An optional criterion is gathered and shown but never blocks.
        hint: {type: [string, 'null'], description: Guidance for whoever reviews the evidence.}
        position: {type: integer, description: Order within the stage.}
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    StageCriterionKind:
      type: string
      description: |-
        What KIND of fact settles a criterion. This is not decoration: the kind
        decides which evidence sources may satisfy it. `buyer_confirmed`,
        `event_held`, `document_signed` and `terms_accepted` each name something the
        BUYER did, so a seller's own message can never settle one.
      enum: [buyer_confirmed, event_held, document_signed, role_identified, terms_accepted, custom]
    TransitionPolicyList:
      type: object
      required: [data, automation_enabled]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/TransitionPolicy'}
        automation_enabled:
          type: boolean
          description: |-
            Whether this installation permits stage automation at all
            (`deals.stage_autopilot_enabled`). It defaults to FALSE, and while it is
            off every transition is forced to `propose` regardless of its own rule.
    TransitionPolicy:
      type: object
      required: [id, pipeline_id, from_stage_id, to_stage_id, mode, clean_acceptance_threshold, correction_reversal_threshold, min_reviewed, min_observation_days, window_days, undo_window_hours, version]
      properties:
        id: {type: string, format: uuid}
        pipeline_id: {type: string, format: uuid}
        from_stage_id: {type: string, format: uuid}
        to_stage_id: {type: string, format: uuid}
        mode:
          type: string
          enum: [propose, auto]
          description: |-
            What the admin has asked for. `auto` is a request, not a state:
            moves still go to a contact until the thresholds below hold in the
            transaction that would apply them.
        clean_acceptance_threshold:
          type: number
          format: double
          description: |-
            The share of reviewed proposals a contact must have accepted
            UNCHANGED. An edit is agreement with a correction, which is a
            weaker claim about the proposal than agreement without one.
        correction_reversal_threshold:
          type: number
          format: double
          description: |-
            The ceiling on moves that were undone or whose evidence was
            corrected. The one threshold that is a maximum rather than a
            minimum, and the one the product suspends a rule for crossing.
        min_reviewed:
          type: integer
          description: |-
            How many proposals a contact must have answered before the rates
            mean anything. It also bounds suspension: the volume at which a
            record is worth trusting and the volume at which it is worth
            distrusting are one judgement.
        min_observation_days:
          type: integer
          description: |-
            The span the record must cover. A fine acceptance rate earned
            entirely in one afternoon has not been observed.
        window_days:
          type: integer
          description: How far back the rates are counted.
        undo_window_hours:
          type: integer
          description: |-
            How long a contact has to take an automatic move back. Frozen onto
            each move as it is applied, so editing this governs the next move
            and not the last one.
        enabled_by:
          type: string
          format: uuid
          description: |-
            Who FIRST trusted this transition with automatic moves. Not
            overwritten by later threshold edits — who first trusted it is a
            different fact from who last adjusted it, and the first is the one
            an auditor asks for.
        enabled_at: {type: string, format: date-time}
        suspended_at:
          type: string
          format: date-time
          description: |-
            When the PRODUCT turned this rule off. Absent on a rule that is
            running. It is not an admin's act and an ordinary save does not
            clear it.
        suspended_reason:
          type: string
          description: Why the product stopped it, in words an operator can act on.
        version:
          type: integer
          format: int64
    StageAutomationReport:
      type: object
      required: [data, window_days]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/StageTransitionRecord'}
        window_days:
          type: integer
          description: The window the counts were taken over.
    StageTransitionRecord:
      type: object
      required: [pipeline_id, from_stage_id, to_stage_id, from_stage_name, to_stage_name, reviewed, proposed, expired, superseded, accepted_clean, accepted_edited, rejected, auto_applied, unsafe, observation_days, clean_acceptance_rate, edit_rate, rejection_rate, unsafe_rate, evidence_kinds]
      properties:
        pipeline_id: {type: string, format: uuid}
        from_stage_id: {type: string, format: uuid}
        to_stage_id: {type: string, format: uuid}
        from_stage_name: {type: string}
        to_stage_name: {type: string}
        reviewed:
          type: integer
          description: |-
            Proposals a human answered. The denominator of every rate here, and
            zero means "nobody has answered one yet" rather than "the rates are
            bad" — read it before reading any rate below.
        proposed:
          type: integer
          description: Cards still standing, unanswered.
        expired:
          type: integer
          description: |-
            Cards whose window closed with nobody answering. A refusal by
            NOBODY, which is why it is neither a rejection nor reviewed.
        superseded:
          type: integer
          description: Cards a fresher reading replaced before anyone answered.
        accepted_clean:
          type: integer
          description: Approved with nothing changed.
        accepted_edited:
          type: integer
          description: |-
            Approved only after the human changed it. Not a clean acceptance:
            the question is whether the proposal is right AS IT STANDS.
        rejected: {type: integer}
        auto_applied:
          type: integer
          description: |-
            Applied without anybody being asked. Reported apart so a reader can
            see how much of a transition's record the autopilot wrote about
            itself.
        unsafe:
          type: integer
          description: |-
            Reviewed moves that were reversed OR whose evidence a human
            corrected. One outcome counts once even when both are true.
        observation_days:
          type: integer
          description: |-
            Whole days from the first answered proposal to the last, rounded
            down.
        clean_acceptance_rate: {type: number, format: double, minimum: 0, maximum: 1}
        edit_rate: {type: number, format: double, minimum: 0, maximum: 1}
        rejection_rate: {type: number, format: double, minimum: 0, maximum: 1}
        unsafe_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: The safety number, held to a ceiling rather than a floor.
        evidence_kinds:
          type: array
          description: |-
            The same moves cut by the criterion kinds they rested on, so an
            installation can see WHICH evidence it accepts rather than only that
            it accepts most things.
          items: {$ref: '#/components/schemas/StageTransitionEvidenceRecord'}
    StageTransitionEvidenceRecord:
      type: object
      required: [kind, reviewed, accepted_clean, unsafe]
      properties:
        kind: {type: string}
        reviewed: {type: integer}
        accepted_clean: {type: integer}
        unsafe: {type: integer}
    StageExitCriterionListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/StageExitCriterion'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    StageListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Stage'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    Pipeline:
      type: object
      description: A pipeline. Mirrors the `pipeline` table (with embedded stages on GET).
      required: [id, name, is_default, position]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        is_default: {type: boolean, default: false, description: At most one default per workspace.}
        position: {type: integer, default: 0}
        stages:
          type: array
          items: {$ref: '#/components/schemas/Stage'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
        version: {$ref: '#/components/schemas/RowVersion'}
    PipelineListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Pipeline'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    ActivityLink:
      type: object
      required: [entity_type, entity_id]
      properties:
        id: {type: string, format: uuid}
        activity_id: {type: string, format: uuid}
        entity_type: {type: string, enum: [contact, company, deal, lead, project]}
        entity_id: {type: string, format: uuid}
    RelinkThreadRequest:
      type: object
      description: |-
        The destination for every writable, non-archived activity of one conversation thread.
        `entity_type`/`entity_id`/`replace_existing_of_type` mean exactly what they mean on
        `relinkActivity`.
      required: [thread_key, entity_type, entity_id]
      properties:
        thread_key: {type: string, minLength: 1, maxLength: 512, description: 'The conversation key the activities carry (`Activity.thread_key`, also the `thread_key` list filter).'}
        entity_type: {$ref: '#/components/schemas/RelinkDestinationType'}
        entity_id: {type: string, format: uuid}
        replace_existing_of_type:
          type: boolean
          default: false
          description: When true, replaces each activity's existing link of the same entity_type (move) rather than adding (associate).
    RelinkActivitiesRequest:
      type: object
      description: |-
        The destination for a named set of activities. Every id must be one the caller can see and
        write, or the whole request is refused and nothing moves.
      required: [activity_ids, entity_type, entity_id]
      properties:
        activity_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: {type: string, format: uuid}
        entity_type: {$ref: '#/components/schemas/RelinkDestinationType'}
        entity_id: {type: string, format: uuid}
        replace_existing_of_type:
          type: boolean
          default: false
          description: When true, replaces each activity's existing link of the same entity_type (move) rather than adding (associate).
    RelinkBatchResult:
      type: object
      description: |-
        A count and nothing else. The moved ids are deliberately not echoed: a replay of the same
        Idempotency-Key, or an approval inbox showing the staged call, would otherwise hand back
        rows the reader may since have lost sight of.
      required: [relinked]
      properties:
        relinked: {type: integer, description: 'Activities that gained the link. One the caller could not write (thread form) or that already carried it is not counted.'}
    RelinkDestinationType:
      type: string
      description: The record kinds an activity may be filed under.
      enum: [contact, company, deal, lead, project]
    ActivityLinkInput:
      type: object
      description: |-
        One record an activity is filed under, as a caller supplies it. The read shape
        (ActivityLink) carries the ids the server assigned; this carries only the target.
      required: [entity_type, entity_id]
      properties:
        entity_type: {type: string, enum: [contact, company, deal, lead, project]}
        entity_id: {type: string, format: uuid}
    SchedulingProfile:
      type: object
      required: [enabled, provider, calendar_id, duration_minutes, notice_minutes, horizon_days, buffer_minutes, title, location]
      properties:
        enabled: {type: boolean}
        provider: {type: string, enum: ['', gcal, graphcal]}
        calendar_id: {type: string, maxLength: 512}
        blocking_calendars: {type: array, maxItems: 10, items: {type: string, maxLength: 512}}
        duration_minutes: {type: integer, minimum: 15, maximum: 480}
        notice_minutes: {type: integer, minimum: 0, maximum: 10080}
        horizon_days: {type: integer, minimum: 1, maximum: 90}
        buffer_minutes: {type: integer, minimum: 0, maximum: 120}
        title: {type: string, maxLength: 200}
        location: {type: string, maxLength: 1000}
        host_name: {type: string, maxLength: 200, description: Derived from the host account display name; request values are ignored. Names longer than 200 characters are abbreviated for this profile.}
        company_name: {type: string, maxLength: 200, description: Derived from the anchor company; request values are ignored. Names longer than 200 characters are abbreviated for this profile.}
        logo_url: {type: string, maxLength: 2000, description: Derived from the anchor company; request values are ignored. Absolute when the public origin is configured; otherwise relative to the API origin.}
        slug: {type: string, readOnly: true}
        public_url: {type: string, readOnly: true}
        replace_link: {type: boolean, writeOnly: true}
        email_reminder: {type: boolean, description: Send one operational email reminder one hour before future meetings.}
        video_call: {type: boolean, description: Add a video call link from the connected calendar (Google Meet or Microsoft Teams) to new meetings. Absent means on.}
    MeetingInvitationRequest:
      type: object
      required: [contact_id, attendee_email, start, end, subject, location, description]
      properties:
        contact_id: {type: string, format: uuid}
        attendee_email: {type: string, format: email}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        subject: {type: string, maxLength: 200}
        location: {type: string, maxLength: 1000}
        description: {type: string, maxLength: 5000}
        video_call: {type: boolean, description: Add a video call link from the connected calendar. Absent follows the host's profile setting.}
    MeetingInvitation:
      type: object
      required: [id, status, start, end, subject, location, version]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, confirmed, needs_attention, rescheduling, canceling, canceled]}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        subject: {type: string}
        location: {type: string}
        version: {type: integer, format: int64}
        calendar_url: {type: string}
        management_token: {type: string}
        reminder_status: {type: string, enum: [off, pending, queued, unavailable]}
        provider: {type: string, enum: [gcal, graphcal], description: The calendar provider that holds the event. Omitted on guest reads.}
        video_call: {type: boolean, description: A video call link was requested for this meeting.}
        video_url: {type: string, description: "The join link the calendar created. Absent until the calendar accepts the invitation, or when it could not create one."}
    Activity:
      type: object
      description: |-
        A polymorphic timeline item. **Per-kind field constraints** (enforced server-side to match the DB `activity_task_fields`
        CHECK; the OpenAPI cannot express these conditionally): `due_at`/`assignee_id`/`is_done`/
        `done_at` are valid ONLY when `kind=task`; `meeting_status` ONLY when `kind=meeting`;
        `duration_seconds` only for meeting/call; `direction` is null for note/task. Setting a
        disallowed field for the kind returns `422 code: field_not_valid_for_kind` (the API rejects
        what the DB CHECK would reject, rather than 500-ing at write time).
      required: [id, kind, occurred_at, source, captured_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [email, call, meeting, note, task, message]}
        channel_provider:
          allOf: [{$ref: '#/components/schemas/ProviderRef'}]
          nullable: true
          description: |-
            Which transport carried this message: set on every `kind=message` row, null on every other kind.
            The kind says what sort of interaction happened; this says what carried it.
        subject: {type: [string, 'null']}
        body: {type: [string, 'null']}
        language:
          type: [string, 'null']
          readOnly: true
          enum: [de, en, vi, null]
          description: >-
            What language this message is written in, read from its own text when it was captured. Null on a message whose text was too short to tell, on anything hand-logged, and on every row captured before this was recorded — all of which mean "not known", never "not any of these".
        occurred_at: {type: string, format: date-time}
        due_at: {type: [string, 'null'], format: date-time, description: Task only.}
        remind_at: {type: [string, 'null'], format: date-time, description: 'Task only.'}
        assignee_id: {type: [string, 'null'], format: uuid, description: Task only.}
        is_done: {type: boolean, default: false, description: Task only.}
        done_at: {type: [string, 'null'], format: date-time}
        duration_seconds: {type: [integer, 'null'], description: Meeting/call only.}
        host_user_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: >-
            Meeting only: the member of this company who held it. It is the one place an activity names OUR side of an exchange — a mail says only which contact it was with, and the mailbox behind it is not on the row. Null on every other kind, and on a meeting nobody was recorded as hosting.
        direction: {type: [string, 'null'], enum: [null, inbound, outbound], description: 'inbound/outbound for email/call; null for note/task.'}
        email_summary:
          allOf: [{$ref: '#/components/schemas/EmailSummary'}]
          readOnly: true
          nullable: true
          description: >-
            Present exactly when `kind=email`. What the canonical email row renders, so a list does not have to fetch a message per visible line to draw one. Every other kind carries none, and a reader branches on its presence rather than on the kind word.
        thread_key:
          type: [string, 'null']
          readOnly: true
          description: >-
            The provider's own conversation id (Gmail threadId, Graph conversationId, the RFC822 References root), stamped by capture. It is what makes a thread a thread: grouping by subject would merge two unrelated "Re: Update" exchanges and split one that was renamed mid-conversation. Null on anything capture did not thread — a note, a task, a message whose provider offered none.
        capture_label:
          type: [string, 'null']
          enum: [null, commitment, meeting, noise]
          readOnly: true
          description: >-
            What this message turned out to be, from the batched capture classification. Null means unclassified, which is a backlog state and not a verdict of "ordinary".
        bulk_mail_attested:
          type: boolean
          readOnly: true
          description: >-
            This message carried an RFC 2369 List-Unsubscribe header, so the SENDER declared it bulk. Per message, never per sender: the same address sends a newsletter and a reply, and treating the sender as bulk would bury the reply.
        audience:
          allOf: [{$ref: '#/components/schemas/ActivityAudience'}]
          readOnly: true
          description: >-
            Who may read this activity's CONTENT once the row is discoverable at all. `workspace` — everyone who can discover it (the default); `participants` — the humans on it (the capturing mailbox owner, anyone stamped as a participant by seat); `selected` — the participants plus the users and teams named through PATCH /activities/{id}/audience. Set only through that endpoint, by a human with write authority over the activity.
        audience_reason:
          type: [string, 'null']
          readOnly: true
          description: >-
            Why `audience` is what it is, for a captured message whose audience the system derived rather than a human set: `posture` (a mailbox asked for it), `workspace_floor` (the workspace turned mail sharing off), `no_record` (the message is filed under no record), `pending_verdict` (nothing has judged the message yet), `manual` (a human said so). Null on a row nothing derived. WITHHELD with the content — the reason describes what the message is about, so a colleague who may not read a held message does not learn why it is held either; it is absent whenever `content_state` is `withheld`.
        content_state:
          type: string
          enum: [available, withheld]
          readOnly: true
          description: >-
            Whether this response carries the activity's content. An `available` row is complete.
        meeting_status: {type: [string, 'null'], enum: [null, booked, held, no_show, canceled], description: 'Set only when kind=meeting.'}
        invitation_status:
          type: [string, 'null']
          readOnly: true
          enum: [null, pending, confirmed, rescheduling, canceling, needs_attention, canceled]
          description: Calendar delivery state, independent of the recorded meeting outcome. Absent for meetings without a Margince invitation.
        source_system: {type: [string, 'null'], description: 'Which system this record came from: `email` for any captured or sent mail (one identity across gmail/outlook/imap), else gcal/outlook/transcript or a caller''s own. Idempotency key part.'}
        source_id: {type: [string, 'null'], description: Provider message/event id; part of the idempotency key.}
        source_activity_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: >-
            The activity this one was derived from: today, the meeting whose transcript proposed a task. Null on almost every row: a task somebody typed came from nowhere but them. It is a reference, not a grant: opening it goes through the activity read path under the caller's own scope, so a reader who may not see the meeting gets the same answer they would get by asking for it directly.
        links:
          type: array
          description: One activity may link to >1 entity (contact + deal).
          items: {$ref: '#/components/schemas/ActivityLink'}
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal (human:<uuid> | agent:<id> | connector:<name>); never client-supplied.'}
        author:
          allOf: [{$ref: '#/components/schemas/SourceAuthor'}]
          readOnly: true
          nullable: true
          description: >-
            Who wrote this where it came FROM, present only on a record imported from another system whose importer named the author. Null on everything else, which is most rows: a message captured from a mailbox or typed here has no author but the one `captured_by` already names.
        raw: {type: [object, 'null'], additionalProperties: true}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    ProviderRef:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      maxLength: 32
      description: |-
        A reference to a messaging transport registered in THIS installation. Deliberately a pattern-constrained string rather than an enum:
        which providers exist is a deployment fact — what this binary composed, including
        any extension unit present under `extensions/` — so an enum here would assert that
        the legal set is identical in every installation, which is false. The contract
        states the invariant; `GET /v1/channel-providers` resolves the live set.
    ChannelProviderDirectory:
      type: object
      description: Every messaging transport this installation has registered.
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ChannelProviderEntry'}
        capture_sources:
          type: array
          description: |-
            The provenance ids the composed EXTENSION UNITS land records under, and what to call
            them: `ext:<unit>:<system>`, which a unit's ingress stamps on every record it lands
            and which `CaptureTraceEntry.connector` therefore carries for any of that unit's
            records that arrived on no channel.
          items: {$ref: '#/components/schemas/CaptureSourceEntry'}
    CaptureSourceEntry:
      type: object
      description: One capture provenance id that is not a transport, as the directory publishes it.
      required: [source, label]
      properties:
        source:
          type: string
          pattern: '^[a-z][a-z0-9_:.-]*$'
          maxLength: 96
          description: |-
            The provenance id itself, in the spelling `CaptureTraceEntry.connector` carries —
            `ext:<unit>:<system>` for a record an extension unit landed.
        label:
          type: string
          description: |-
            Human-readable name for it — show this where the id would otherwise appear. Derived
            and never operator-configured, on the same terms as `ChannelProviderEntry.label`, so
            it is safe to cache alongside the rest of the directory.
    ChannelProviderEntry:
      type: object
      description: One registered transport, as the directory publishes it.
      required: [provider, label, credential_model, supplies_transport, attachments]
      properties:
        provider: {$ref: '#/components/schemas/ProviderRef'}
        label:
          type: string
          description: |-
            Human-readable transport name, e.g. `Telegram`. Ships with the provider and is
            never operator-configured — the directory is readable by every authenticated
            seat, so anything an administrator typed would make this a disclosure decision
            rather than a display one.
        credential_model:
          type: string
          enum: [workspace_bot, per_member]
          description: |-
            How a connection to this transport is credentialed — one shared bot for the
            installation, or a secret each member deposits. Closed on purpose, unlike the
            provider vocabulary: this describes the SHAPE of a credential, which is
            installation-independent.
        supplies_transport:
          type: boolean
          description: |-
            Whether this provider can carry an outbound message at all; a capture-only
            transport reports false.
        attachments:
          type: object
          required: [carries, max_files, max_bytes_per_file, max_total_bytes, max_body_with_files]
          description: |-
            What this transport can carry alongside a message. Published because the
            composer must warn BEFORE a human presses send: a mismatch discovered at
            transmission parks the delivery, which is correct but late.
          properties:
            carries: {type: boolean}
            max_total_bytes:
              type: integer
              format: int64
              minimum: 1
              description: |-
                Largest total across every file on one message, in bytes — the smaller of
                this transport's own aggregate and the product's send budget. Always
                present and always positive.
            max_files:
              type: integer
              description: Most files in one message. Never more than the contract's own `attachment_ids` cap of 10.
            max_bytes_per_file:
              type: integer
              format: int64
              description: Largest single file, in bytes.
            max_body_with_files:
              type: integer
              description: |-
                Longest message text, in characters, when the message ALSO carries files —
                a transport that sends text-with-files as a caption bounds it far below a
                text-only message. Zero means no extra bound.
    CreateTaskRequest:
      type: object
      description: What a task needs. Stored as an activity of kind `task`.
      required: [subject, source]
      properties:
        request_activity_id:
          type: string
          format: uuid
          description: >-
            Accept this inbound request for the authenticated human, with activity read and create authority. Task only; agents cannot accept and assignee_id must name the caller when provided. The server verifies source access and copies its links instead of caller-supplied links. Subject and body are honored on creation. Retries return the same personal reminder without changing it. Explicit acceptance can restore an archived unfinished reminder with update authority. Completion settles the source request; automatic reconciliation never restores a reminder.
        subject: {type: string, minLength: 1, description: 'What has to be done, as one line.'}
        body: {type: [string, 'null'], description: 'Detail, if one line is not enough.'}
        due_at: {type: [string, 'null'], format: date-time, description: 'When it is due. Optional — a task without a date is still a task.'}
        assignee_id: {type: [string, 'null'], format: uuid, description: 'Who owes it. Defaults to the caller.'}
        links:
          type: array
          description: The records the task is about. Omit it and the task appears on no timeline.
          items:
            type: object
            required: [entity_type, entity_id]
            properties:
              entity_type: {type: string, enum: [contact, company, deal, lead, project]}
              entity_id: {type: string, format: uuid}
        source: {type: string}
      additionalProperties: false
    CreateActivityRequest:
      type: object
      required: [kind, source]
      properties:
        request_activity_id:
          type: string
          format: uuid
          description: >-
            Accept this inbound request for the authenticated human, with activity read and create authority. Task only; agents cannot accept and assignee_id must name the caller when provided. The server verifies source access and copies its links instead of caller-supplied links. Subject and body are honored on creation. Retries return the same personal reminder without changing it. Explicit acceptance can restore an archived unfinished reminder with update authority. Completion settles the source request; automatic reconciliation never restores a reminder.
        kind:
          type: string
          enum: [email, call, meeting, note, task, message]
        channel_provider:
          allOf: [{$ref: '#/components/schemas/ProviderRef'}]
          nullable: true
          description: |-
            Which transport carried this message. REQUIRED when `kind=message` and MUST be
            null otherwise; violating either direction returns
            `422 code: field_not_valid_for_kind`. Must name a provider this installation has
            registered.
        subject: {type: [string, 'null']}
        body: {type: [string, 'null']}
        occurred_at: {type: string, format: date-time}
        due_at: {type: [string, 'null'], format: date-time}
        remind_at: {type: [string, 'null'], format: date-time, description: Task only.}
        assignee_id: {type: [string, 'null'], format: uuid}
        host_user_id:
          type: string
          format: uuid
          description: >-
            Meeting only: the member of this company who HELD it, which is not the same question as who typed it up. Omit it for a meeting you held yourself and the server fills in the caller; name a colleague when you are minuting theirs, so it counts into their week rather than yours. A label and never an authority — what a caller may read is decided before this field is filled in.
        duration_seconds: {type: [integer, 'null']}
        direction: {type: [string, 'null'], enum: [null, inbound, outbound]}
        meeting_status:
          type: [string, 'null']
          enum: [null, booked, held, no_show, canceled]
        source_system: {type: [string, 'null']}
        source_author_id: {type: [string, 'null'], format: uuid, description: 'Who wrote this record in the system it came from, when the author holds a seat here. Written only by a declared importer, only beside a source_system; either author field or both may be sent, and the seat''s current name wins on read. captured_by still names the caller.'}
        source_author_name: {type: [string, 'null'], maxLength: 200, description: 'The source system''s own spelling of who wrote this record. Same door as source_author_id: a declared importer only, beside a source_system. Kept when a seat is also named, so the name survives the seat.'}
        source_id: {type: [string, 'null']}
        links:
          type: array
          items:
            type: object
            required: [entity_type, entity_id]
            properties:
              entity_type: {type: string, enum: [contact, company, deal, lead, project]}
              entity_id: {type: string, format: uuid}
        source: {type: string}
        raw:
          type: [object, 'null']
          additionalProperties: true
          description: >-
            Provenance an importer keeps with the record — the source system's own representation of this activity. Stored verbatim and returned by `getActivity`. It is content: a reader who may not read this activity's subject and body does not receive it either, and the retention and noise-redaction paths destroy it with the rest of the text.
        participants:
          type: [object, 'null']
          additionalProperties: false
          description: >-
            The message's own address headers, for mail this installation never captured. Email only — any other kind returns `422 code: field_not_valid_for_kind` — and `direction` is required alongside it, because the counterparty is derived from the two together: an inbound message is with its sender, an outbound one with the first recipient who is not the sending mailbox.
          properties:
            from: {type: [string, 'null']}
            to: {type: array, items: {type: string}}
            cc: {type: array, items: {type: string}}
        rfc_message_id:
          type: [string, 'null']
          description: >-
            This message's RFC 5322 Message-ID, angle brackets optional. Email only. It is the identity a later capture of the same message resolves against, so an import that supplies it is recognised rather than duplicated.
        thread_key:
          type: [string, 'null']
          description: >-
            The conversation this message belongs to. Email only. Defaults to `rfc_message_id` when absent, which files a message under itself — the same root a captured message takes when it starts a thread.
        ical_uid:
          type: [string, 'null']
          description: >-
            The calendar event's iCal UID. Meeting only. A recurring series shares one UID across every occurrence, so this identifies the series and `ical_instance` identifies the occurrence within it; neither alone identifies a meeting.
        ical_instance:
          type: [string, 'null']
          description: >-
            Which occurrence of `ical_uid` this is — the occurrence's own original start, as the calendar states it. Meeting only. Required whenever `ical_uid` is given, because a series without an occurrence names every meeting in it at once.
    ActivityAudience:
      type: string
      enum: [workspace, participants, selected]
      description: Who may read an activity's content — see Activity.audience.
    AudienceMember:
      type: object
      description: |-
        One user or team admitted to a message besides its participants. The same shape the
        audience write takes and the presentation reads back, so an editor that renders the
        current set submits it in the vocabulary it received.
      required: [subject_type, subject_id]
      properties:
        subject_type: {type: string, enum: [user, team]}
        subject_id: {type: string, format: uuid}
    UpdateActivityRequest:
      type: object
      properties:
        subject: {type: [string, 'null']}
        body: {type: [string, 'null']}
        occurred_at: {type: string, format: date-time}
        due_at: {type: [string, 'null'], format: date-time}
        assignee_id: {type: [string, 'null'], format: uuid}
        remind_at: {type: [string, 'null'], format: date-time, description: 'Task only. The reminder scan fires on this.'}
        is_done: {type: boolean, description: 'Completing a task writes one audit row + an `activity.updated` event carrying the `is_done` delta.'}
        meeting_status:
          type: [string, 'null']
          enum: [null, booked, held, no_show, canceled]
          description: |-
            How the meeting went, set AFTER it happened. Meeting only, and 422 with a
            `field_not_valid_for_kind` fault on the field otherwise — the same refusal create
            gives, held against the kind the row already carries rather than one the
            patch names, because a patch cannot change a kind.
    ActivityListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Activity'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    Attachment:
      type: object
      description: |-
        A file hung off an entity. Mirrors the `attachment` table: the row is the
        system of record and the tenant anchor; the bytes live in object storage,
        addressed by an internal object key that is never exposed on the wire.
      required: [id, entity_type, entity_id, filename, source, captured_by, created_at]
      properties:
        id: {type: string, format: uuid}
        entity_type: {type: string, enum: [contact, company, deal, activity, lead, project]}
        entity_id: {type: string, format: uuid}
        filename: {type: string}
        content_type: {type: [string, 'null']}
        byte_size: {type: [integer, 'null'], format: int64}
        checksum: {type: [string, 'null'], description: 'sha256 of the bytes, for integrity/dedupe.'}
        category:
          type: string
          enum: [contract, offer, legal, email_attachment, message_attachment, other]
          description: |-
            What kind of document this is. Closed vocabulary; `other` is the
            honest default, not a fallback for an unknown value.
        title:
          type: [string, 'null']
          description: A display name distinct from the filename, showing what a reader looks for rather than what arrived.
        doc_state:
          type: string
          enum: [draft, current, final, superseded]
          description: >-
            ASSERTED, never inferred. A human or the producing source sets it. Nothing derives currency from the newest upload date or a filename containing "final": the most recent upload is very often a draft, and an inference would be a confident wrong answer to the exact question this field exists to answer.
        pinned:
          type: boolean
          description: Held at the top of the account's library. An assertion by a human, like the state.
        supersedes_id:
          type: [string, 'null']
          format: uuid
          description: The document this one replaces. Refused when it would close a cycle.
        company_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: >-
            The account this file rolls up to, kept as a read path rather than a second parent. Visibility stays the primary parent's, and this is maintained on relink and merge so a file follows the record it belongs to.
        contract_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: >-
            The agreement this file belongs to: the same kind of roll-up as company_id above, and likewise not a second parent. Set at upload by the contact filing the paper; never inferred from a filename or a date, which is the guess the document state exists to refuse.
        bytes_withheld:
          type: boolean
          readOnly: true
          description: >-
            True for a file a private message carried that was recorded by name, size and type only: no bytes were kept, so there is nothing to download (404) or read.
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal; never client-supplied.'}
        created_at: {type: string, format: date-time}
    EmailDraft:
      type: object
      description: A drafted email (never sent by drafting). Send via /activities/{id}/send-email ().
      required: [subject, body, draft_ref, ai_generated]
      properties:
        subject: {type: string}
        body: {type: string}
        to: {type: array, items: {type: string, format: email}}
        in_reply_to_activity_id: {type: [string, 'null'], format: uuid}
        ai_generated: {type: boolean, readOnly: true, description: 'True when a model produced this draft; stamped on the drafting call itself, never persisted. Absent reads as false.'}
        ai_disclosure: {type: [string, 'null'], readOnly: true, description: 'The provenance notice shown to the drafting user, marking the text as model-written so they review it before sending; non-null iff ai_generated=true. Carried beside the draft rather than inside body, and not appended to it on send.'}
        voice_profile_version: {type: [integer, 'null'], readOnly: true, minimum: 1, description: 'The Voice DNA PROFILE version (not a model version) that styled this draft — the "built from your corpus · vN" provenance; null when no ready voice profile shaped it.'}
        draft_ref: {type: [string, 'null'], readOnly: true, description: 'Opaque reference identifying this served voice draft for learning feedback (rejectVoiceDraft); null when no voice profile styled it.'}
        voice_degraded: {type: boolean, readOnly: true, description: 'True when the sender''s voice could not even be looked up, so this draft may be missing a voice its sender built. A client should say so: the sender cannot detect a missing voice by reading the text. Absent reads as false.'}
    ReplyRecipient:
      type: object
      description: |-
        Who a reply to a message is addressed to: one contact, resolved from the
        message's participants by role.
      required: [full_name, first_name, address, mailbox_user_ids]
      properties:
        mailbox_user_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
          description: >-
            Every member of this company whose OWN mailbox this message was delivered to, in the order the imports were recorded. It says whose conversation a reply would be joining: a thread that reached only a colleague's mailbox is theirs, and a reply still goes out from the caller's own mailbox under the caller's own name.
        full_name:
          type: string
          description: The name as recorded, empty when no readable contact is on the message.
        first_name:
          type: string
          description: >-
            What a greeting uses. Split server-side rather than in a prompt: a model asked to shorten a name shortens "Dr. Anne-Marie Weiß-Konrad" differently every call.
        address:
          type: string
          description: >-
            Where the reply is sent: the counterparty's own corresponding address where the thread carries one, else their primary live address. Never one of this installation's own contacts. Empty when the thread offers none — including a thread whose every participant is a colleague — which the reader fills in themselves.
    CommunicationEvidence:
      type: object
      description: |-
        Records the caller can name in support of a send, each by id. Evidence is
        CHECKED, never trusted: the engine reads the named record and asks whether it
        actually supports the category claimed — a deal id that is closed, an invoice
        belonging to another company, or a record the caller cannot see supports
        nothing. Naming a record therefore never widens what a caller may do.
      properties:
        activity_id:
          type: [string, 'null']
          format: uuid
          description: The inbound message this send answers.
        deal_id:
          type: [string, 'null']
          format: uuid
          description: The live opportunity this send moves along.
        invoice_id:
          type: [string, 'null']
          format: uuid
          description: The invoice or payment event this send is about.
        contract_id:
          type: [string, 'null']
          format: uuid
          description: The live contract whose notice this send carries.
        consent_event_id:
          type: [string, 'null']
          format: uuid
          description: The recorded consent this send relies on.
        basis_id:
          type: [string, 'null']
          format: uuid
          description: A recorded communication basis this send relies on.
    SendEmailRequest:
      type: object
      required: [subject, body, to]
      properties:
        subject: {type: string}
        body: {type: string, description: The (possibly edited) final body that is sent.}
        html_body:
          type: [string, 'null']
          description: |-
            The same message as markup, or omitted for a plain-text send. It never
            REPLACES `body`: a message carrying both goes out as multipart/alternative
            with the plain part first, so a client that cannot render HTML still
            receives the words. The sender's signature and the unsubscribe footer are
            appended to BOTH parts by the server, in each part's own syntax.
        attachment_ids:
          type: array
          maxItems: 10
          items: {type: string, format: uuid}
          description: |-
            Files already in the record library to send with this message, named by id
            — never uploaded here. Each is snapshotted at staging so
            archiving or superseding one later cannot rewrite what the timeline says a
            sent message carried.
        to: {type: array, items: {type: string, format: email}}
        cc: {type: array, items: {type: string, format: email}}
        bcc:
          type: array
          items: {type: string, format: email}
          description: |-
            Blind copies. They receive the message and are therefore owed consent
            exactly as To and Cc are — the gate answers on every addressee, however
            they were addressed — and they are absent from the headers the recipients
            see, which is the whole of what "blind" means.
        draft_ref:
          type: [string, 'null']
          description: |-
            Opaque reference returned by the drafting operation. After a successful send, the
            server compares this protected original with the final body and records accepted or
            edited-and-sent metadata. Only a guarded, human-authored final edit may become a
            `draft_signal` corpus source. Omit for independently composed mail; no voice-learning
            outcome is inferred without a valid reference.
        mail_draft_id:
          type: [string, 'null']
          format: uuid
          description: |-
            The caller's saved draft (`PUT /mail-drafts`) this message was composed in. The
            send, or the scheduling, discards it in the SAME transaction, so a message that
            left the composer leaves no draft behind; a refused send commits nothing and the
            draft stays. Only a human caller's own draft for this message's anchor is
            discarded — any other id is ignored — and omitting it discards nothing.
        communication_context:
          type: [string, 'null']
          enum: [reply_to_inbound, requested_followup, precontract_quote, active_deal_followup, customer_service, account_notice, contract_notice, invoice_or_payment, marketing, null]
          description: |-
            What kind of communication this is. The caller CLAIMS a category; the engine
            resolves the one the evidence actually supports and records both, so a claim
            that the evidence does not carry is visible rather than silently honoured.
        marketing_purpose:
          type: [string, 'null']
          description: |-
            For a marketing send, the consent purpose key naming the topic it is for.
            Marketing consent is purpose-specific: a grant for one topic authorizes that
            topic and no other.
        operator_reason:
          type: [string, 'null']
          maxLength: 500
          description: |-
            What a human typed when a first message was genuinely ambiguous. It is
            RECORDED on the decision and grants nothing — a sentence a sender wrote about
            their own send is not evidence about the recipient. It exists so a later
            reader can see what the sender believed, not so the engine can be talked into
            an allow.
        evidence:
          allOf: [{$ref: '#/components/schemas/CommunicationEvidence'}]
          description: Records the caller names in support of this send. Checked, never trusted.
        consent_purpose:
          type: string
          description: |-
            DEPRECATED, and no longer required. The engine resolves what a message is from
            the record — the thread it answers, the deal or invoice it names, the evidence
            supplied in `evidence` — and a purpose key is not that. Send
            `communication_context` instead.
        scheduled_at:
          type: [string, 'null']
          format: date-time
          description: |-
            Send this message at this instant instead of now. Absolute
            and unambiguous; `scheduled_tz` records the zone the human picked it in.
        scheduled_tz:
          type: [string, 'null']
          description: |-
            The IANA zone name (e.g. `Europe/Berlin`) the human chose `scheduled_at` in.
            Required with `scheduled_at`. A zone NAME, never a numeric offset, which
            would freeze the DST rules of the day it was written (AC-DS-TZ4).
        also_links:
          type: array
          maxItems: 25
          description: |-
            Records to file this reply under IN ADDITION to the ones it inherits from the
            message it answers. Omit it and a reply is filed exactly as before.
          items: {$ref: '#/components/schemas/ActivityLinkInput'}
    ScheduledSend:
      type: object
      required: [id, status, scheduled_at, scheduled_tz, subject, to, version, created_at, updated_at]
      description: |-
        One message waiting for its moment. It is not an activity and not a
        delivery: nothing is on the timeline and nothing has been handed to a provider.
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [scheduled, released, sent, cancelled, held]
          description: |-
            `scheduled`: waiting; the rep may move or cancel it.
            `released` — it fired: the activity, the delivery row and the dispatch job exist,
            and the provider has not been called yet, so the delivery can still park or fail.
            A step rather than an ending.
            `sent` — the provider confirmed receipt. A message this system sent reads the same
            whether a rep scheduled it or sent it directly.
            `cancelled` — withdrawn before it fired; nothing was transmitted.
            `held` — a gate refused at fire, or the window was missed. It will not send itself;
            a human reschedules or cancels it.
        scheduled_at: {type: string, format: date-time}
        scheduled_tz:
          type: string
          description: The IANA zone the human picked the moment in, kept so it re-renders as meant.
        subject: {type: string}
        to: {type: array, items: {type: string, format: email}}
        cc: {type: array, items: {type: string, format: email}}
        bcc:
          type: array
          items: {type: string, format: email}
          description: |-
            Visible to the SENDER, who is the only contact this record is readable by. A scheduled
            message's blind-copy list is not workspace-readable the way a sent activity is.
        body: {type: string}
        anchor_activity_id:
          type: [string, 'null']
          format: uuid
          description: The conversation this reply will join; null for an account-started message.
        links:
          type: array
          items: {$ref: '#/components/schemas/ActivityLinkInput'}
          description: |-
            The records an account-started message files itself under, as the send named
            them. Absent on a reply: a reply's records come from its anchor, and the ones it
            was told to file under beyond those (`also_links` on the send) are not carried
            here, because the reply preview resolves from the anchor alone. Carried so a
            surface can ask the engine the SAME question the fire will ask: the account-send
            preview refuses a message that names no records, and a surface that could not
            name them would fall silent on exactly the cold sends where consent matters most.
        communication_context:
          allOf: [{$ref: '#/components/schemas/CommunicationContext'}]
          description: |-
            What the sender claimed the message is, frozen with it. Absent when nothing was
            claimed, which is the ordinary case for a reply — the engine derives it from the
            anchor.
        marketing_purpose:
          type: string
          description: For a marketing send, the consent purpose key it claimed, frozen with the message.
        consent_purpose:
          type: string
          description: |-
            The deprecated purpose key the sender still supplied, frozen with the message. The
            fire consults it where the record supports no category, so a preview that could
            not pass it would answer a different question than the send.
        evidence:
          allOf: [{$ref: '#/components/schemas/CommunicationEvidence'}]
          description: |-
            The records the sender named in support of the message, frozen with it. Absent
            when none were named. Evidence is what makes a claimed category supported, so a
            preview asked without it would answer "unproven" about a message the fire allows.
        activity_id:
          type: [string, 'null']
          format: uuid
          description: The timeline activity this produced, once released.
        held_reason:
          type: [string, 'null']
          enum: [consent_withdrawn, sender_inactive, missed_window, timer_exhausted, send_refused, null]
          description: |-
            Why a human has to look at it. `consent_withdrawn` — a recipient withdrew consent
            after it was scheduled. `sender_inactive` — the scheduler lost their seat or mailbox.
            `missed_window` — it came due while nothing was running and is now too late to be the
            message that was written. `timer_exhausted` — the job that wakes it ran out of
            attempts. `send_refused` — a gate refused for another reason at fire.
        review_id:
          type: [string, 'null']
          format: uuid
          description: |-
            The review this message's refusal opened, when one stands. Null on every message
            nobody refused, and on a held row whose review has since been answered.
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CommunicationContext:
      type: string
      enum: [reply_to_inbound, requested_followup, precontract_quote, active_deal_followup, customer_service, account_notice, contract_notice, invoice_or_payment, marketing]
      description: |-
        What kind of communication a message is — the closed vocabulary the engine resolves
        to. A caller CLAIMS one and the engine checks it against the record.
    SendCompanyEmailRequest:
      type: object
      required: [subject, body, to, links]
      description: |-
        One account-started send. It is SendEmailRequest plus the `links` an anchor would
        otherwise have supplied — the records this new conversation belongs to.
      properties:
        subject: {type: string}
        body: {type: string, description: The (possibly edited) final body that is sent.}
        html_body:
          type: [string, 'null']
          description: |-
            The same message as markup, or omitted for a plain-text send. It never
            REPLACES `body`: a message carrying both goes out as multipart/alternative
            with the plain part first, so a client that cannot render HTML still
            receives the words. The sender's signature and the unsubscribe footer are
            appended to BOTH parts by the server, in each part's own syntax.
        attachment_ids:
          type: array
          maxItems: 10
          items: {type: string, format: uuid}
          description: |-
            Files already in the record library to send with this message, named by id
            — never uploaded here. Each is snapshotted at staging so
            archiving or superseding one later cannot rewrite what the timeline says a
            sent message carried.
        to:
          type: array
          minItems: 1
          description: |-
            At least one addressee. A send whose To: line is empty is refused 422 before
            anything is staged — `cc` alone does not make a message addressed to anyone.
          items: {type: string, format: email}
        cc: {type: array, items: {type: string, format: email}}
        bcc:
          type: array
          items: {type: string, format: email}
          description: |-
            Blind copies. They receive the message and are therefore owed consent
            exactly as To and Cc are — the gate answers on every addressee, however
            they were addressed — and they are absent from the headers the recipients
            see, which is the whole of what "blind" means.
        draft_ref:
          type: [string, 'null']
          description: |-
            Opaque reference returned by the drafting operation, exactly as on `send_email`.
            Omit for independently composed mail.
        mail_draft_id:
          type: [string, 'null']
          format: uuid
          description: |-
            The caller's saved draft this message was composed in, discarded in the same
            transaction as the send or the scheduling, exactly as on `send_email`.
        communication_context:
          type: [string, 'null']
          enum: [reply_to_inbound, requested_followup, precontract_quote, active_deal_followup, customer_service, account_notice, contract_notice, invoice_or_payment, marketing, null]
          description: |-
            What kind of communication this is. The caller CLAIMS a category; the engine
            resolves the one the evidence actually supports and records both, so a claim
            that the evidence does not carry is visible rather than silently honoured.
        marketing_purpose:
          type: [string, 'null']
          description: |-
            For a marketing send, the consent purpose key naming the topic it is for.
            Marketing consent is purpose-specific: a grant for one topic authorizes that
            topic and no other.
        operator_reason:
          type: [string, 'null']
          maxLength: 500
          description: |-
            What a human typed when a first message was genuinely ambiguous. It is
            RECORDED on the decision and grants nothing — a sentence a sender wrote about
            their own send is not evidence about the recipient. It exists so a later
            reader can see what the sender believed, not so the engine can be talked into
            an allow.
        evidence:
          allOf: [{$ref: '#/components/schemas/CommunicationEvidence'}]
          description: Records the caller names in support of this send. Checked, never trusted.
        consent_purpose:
          type: string
          description: |-
            DEPRECATED, and no longer required. The engine resolves what a message is from
            the record — the thread it answers, the deal or invoice it names, the evidence
            supplied in `evidence` — and a purpose key is not that. Send
            `communication_context` instead.
        scheduled_at:
          type: [string, 'null']
          format: date-time
          description: |-
            Send this message at this instant instead of now. Absolute
            and unambiguous; `scheduled_tz` records the zone the human picked it in.
        scheduled_tz:
          type: [string, 'null']
          description: |-
            The IANA zone name (e.g. `Europe/Berlin`) the human chose `scheduled_at` in.
            Required with `scheduled_at`. A zone NAME, never a numeric offset, which
            would freeze the DST rules of the day it was written (AC-DS-TZ4).
        links:
          type: array
          minItems: 1
          maxItems: 25
          description: |-
            The records this conversation is filed under — the company it was started from, and
            optionally the contact and deal it concerns. At least one is required: a message
            belonging to no record is one nobody will find again, which is the gap this
            operation exists to close. Each target is row-scope probed, so an id the caller
            cannot see is refused 404 — and each probe is its own query, so the list is bounded
            at 25 (a message about more records than that is about none of them).
          items: {$ref: '#/components/schemas/ActivityLinkInput'}
    SendMessageRequest:
      type: object
      required: [body]
      description: |-
        One channel reply. It carries no subject and no addressee list, and that absence is the
        shape of the transport rather than an omission: a messaging channel has no subject line
        and no Cc, and the recipient is resolved from the conversation being answered (see the
        operation), never named by the caller.
      properties:
        body:
          type: string
          minLength: 1
          description: |-
            The (possibly edited) final message text that is sent. A messaging provider rejects a
            text-less message, so an empty or whitespace-only body is refused at request time
            (422 `empty_message_body`) rather than staged for a delivery that could only park.
        communication_context:
          type: [string, 'null']
          enum: [reply_to_inbound, requested_followup, precontract_quote, active_deal_followup, customer_service, account_notice, contract_notice, invoice_or_payment, marketing, null]
          description: |-
            What kind of communication this is. The caller CLAIMS a category; the engine
            resolves the one the evidence actually supports and records both, so a claim
            that the evidence does not carry is visible rather than silently honoured.
        marketing_purpose:
          type: [string, 'null']
          description: |-
            For a marketing send, the consent purpose key naming the topic it is for.
            Marketing consent is purpose-specific: a grant for one topic authorizes that
            topic and no other.
        operator_reason:
          type: [string, 'null']
          maxLength: 500
          description: |-
            What a human typed when a first message was genuinely ambiguous. It is
            RECORDED on the decision and grants nothing — a sentence a sender wrote about
            their own send is not evidence about the recipient. It exists so a later
            reader can see what the sender believed, not so the engine can be talked into
            an allow.
        evidence:
          allOf: [{$ref: '#/components/schemas/CommunicationEvidence'}]
          description: Records the caller names in support of this send. Checked, never trusted.
        consent_purpose:
          type: string
          description: |-
            DEPRECATED, and no longer required. The engine resolves what a message is from
            the record — the thread it answers, the deal or invoice it names, the evidence
            supplied in `evidence` — and a purpose key is not that. Send
            `communication_context` instead.
        attachment_ids:
          type: array
          maxItems: 10
          items: {type: string, format: uuid}
          description: |-
            Files already in the record library to send with this message, named by id
            — never uploaded here. Each is snapshotted at staging so
            archiving or superseding one later cannot rewrite what the timeline says a
            sent message carried.
    Lead:
      type: object
      description: A thin, segregated prospect. Mirrors the `lead` table. NO company FK.
      required: [id, status, score, source, captured_by, created_at, updated_at]
      properties:
        legal_hold:
          type: boolean
          readOnly: true
          description: >-
            True while a litigation or investigation hold is preserving this record. A held record is never acted on by a retention sweep and an Art. 17 erasure against it is refused, so a screen that offers either action has to know. Placed and lifted through /retention/legal-holds, never by an ordinary edit.
        tags: {type: array, items: {$ref: '#/components/schemas/RowTag'}}
        id: {type: string, format: uuid}
        full_name: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email, description: Lowercased; lead-internal dedupe key.}
        linkedin_url: {type: [string, 'null'], description: 'Normalized LinkedIn profile URL; the exact-match dedupe key.'}
        title: {type: [string, 'null']}
        company_name: {type: [string, 'null'], description: Free text; there is no foreign key to a company.}
        candidate_company_key: {type: [string, 'null'], description: Loose key for ABM routing without creating a company.}
        project_id: {type: [string, 'null'], format: uuid, description: 'The body of work this lead belongs to; a lead has at most one. NO same-company guard exists on this arm and none can: a lead has no company_id, only candidate_company_key, so the deal_project_same_company trigger has no lead twin. Promotion is where a mismatch becomes visible.'}
        status: {type: string, enum: [new, contacted, engaged, promoted, disqualified], default: new, description: 'The activity-driven ladder: new → contacted (we reached out) → engaged (they answered or a meeting is booked/held) → promoted (qualified: a contact exists) | disqualified. contacted and engaged are set by the system from captured activity and may be set by hand.'}
        score: {type: integer, default: 0, description: 'Lead-local scoring; never reads the contact graph. While an override is in force this is the human-set value (see score_override_reason).'}
        score_override_reason: {type: [string, 'null'], readOnly: true, description: 'Non-null ⇒ `score` is a human Commercial-Judgement override and recompute is suppressed; the machine value is retained in `score_computed`.'}
        score_computed: {type: [integer, 'null'], readOnly: true, description: 'Server-derived.'}
        owner_id: {type: [string, 'null'], format: uuid}
        writable:
          type: boolean
          readOnly: true
          description: >-
            Whether THIS caller may change THIS row: the same question the server's write gate answers on a mutation — the owner, the owner's team where the role is team-scoped, a live `write` record grant, or an unbounded seat. Server-computed per row, per caller. It is a UX signal, never the enforcement. A client uses it to draw or withhold edit affordances so a reader is not offered a control the save would refuse; the server refuses an unauthorized write with 403 whatever this said. Absent means NOT writable, so a client reading a response from a server too old to send it fails closed.
        source_system: {type: [string, 'null']}
        source_id: {type: [string, 'null']}
        promoted_contact_id: {type: [string, 'null'], format: uuid, description: Set on promotion (convenience mirror).}
        from_contact_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: >-
            The existing contact this lead was created from (`contact_id` on the create), and null for any other lead. While this lead is live, a second create from the same contact answers 409 `duplicate_contact_lead` naming this lead.
        merged_into_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: >-
            Set when this lead was merged away into another, and null otherwise. It is what separates a merged-away lead from a disqualified one — both are archived and neither carries a `promoted_contact_id`, so without this a reader can only see that the lead ended, not which of two very different things happened to it. Disqualified says a human judged the lead not worth pursuing; merged says it was the same lead as another one. The id names the survivor to read instead. `contact` and `company` already carry the same field for the same reason.
        promoted_at: {type: [string, 'null'], format: date-time}
        routed_at: {type: [string, 'null'], format: date-time, readOnly: true, description: 'When routing assigned an owner.'}
        first_response_at: {type: [string, 'null'], format: date-time, readOnly: true, description: 'First real response to this lead: an outbound activity, a human status change off `new`, or an explicit disposition. A cold-outbound auto-touch does NOT satisfy it.'}
        sla_deadline_at: {type: [string, 'null'], format: date-time, readOnly: true, description: 'Derived, not stored: COALESCE(routed_at, created_at) + first_response_target_minutes. Null on a terminal lead, which owes no first response.'}
        sla_state:
          type: [string, 'null']
          enum: [within_target, at_risk, breached]
          readOnly: true
          description: 'Derived from sla_deadline_at and first_response_at; null once responded or on a terminal lead. Orders the work queue above score.'
        last_activity_at: {type: [string, 'null'], format: date-time, readOnly: true, description: 'Most recent activity linked to this lead — the "last touch" a work queue row shows.'}
        open_task_count: {type: [integer, 'null'], readOnly: true, description: 'Open `kind=task` activities linked to this lead; the derived next step is the earliest of them.'}
        next_task_subject: {type: [string, 'null'], readOnly: true, description: 'Subject of the earliest open task linked to this lead.'}
        next_task_due_at: {type: [string, 'null'], format: date-time, readOnly: true, description: 'Due time of the earliest open task linked to this lead; undated tasks follow dated ones.'}
        score_reason: {type: [string, 'null'], readOnly: true, description: 'The highest-impact factor in the retained current score explanation, for a compact queue reason.'}
        source: {type: string, description: 'The stored source key.'}
        source_label: {type: [string, 'null'], readOnly: true}
        disqualify_reason_id: {type: [string, 'null'], format: uuid, readOnly: true, description: 'Set by DELETE /leads/{id} with a reason; null on an open lead.'}
        disqualify_reason: {type: [string, 'null'], readOnly: true, description: 'The label of disqualify_reason_id at read time.'}
        disqualify_note: {type: [string, 'null'], readOnly: true}
        status_set_by:
          type: [string, 'null']
          enum: [human, system]
          readOnly: true
          description: 'Who last placed the lead on its status: a human by hand (an agent acting for one counts as the human), or the system from captured activity. Null for a lead nobody has moved yet — one still on new, or one carried over from before the ladder existed.'
        qualified_deal_id: {type: [string, 'null'], format: uuid, readOnly: true, description: 'The deal opened by the qualify call that promoted this lead, when one was asked for.'}
        qualification_evidence:
          $ref: '#/components/schemas/LeadQualificationEvidence'
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal (human:<uuid> | agent:<id> | connector:<name>); never client-supplied.'}
        author:
          allOf: [{$ref: '#/components/schemas/SourceAuthor'}]
          readOnly: true
          nullable: true
          description: >-
            Who created this lead in the system it came FROM, present only on a record imported from another system whose importer named the author. Null on everything else, which is most rows: a lead somebody entered here has no author but the one `captured_by` already names.
        raw: {type: [object, 'null'], additionalProperties: true}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
      additionalProperties: true
    CreateLeadRequest:
      type: object
      required: [source]
      properties:
        full_name: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email}
        linkedin_url: {type: [string, 'null']}
        title: {type: [string, 'null']}
        company_name: {type: [string, 'null']}
        candidate_company_key: {type: [string, 'null']}
        project_id: {type: [string, 'null'], format: uuid}
        contact_id:
          type: [string, 'null']
          format: uuid
          description: >-
            An existing contact this lead is worked from. Its name, primary email, title, LinkedIn profile and current employer fill whichever of those fields this request leaves out, so a lead for a contact the CRM already holds is never retyped or left unnamed. The contact must be one the caller may read (422 otherwise). The lead records it as `from_contact_id`, and the contact itself is not changed. A contact already worked through a live lead answers 409 `duplicate_contact_lead` with that lead's id. Not combinable with `source_system` (422): a lead filled from a contact is not an import.
        status: {type: string, enum: [new, contacted, engaged, promoted, disqualified], default: new, description: 'The activity-driven ladder: new → contacted (we reached out) → engaged (they answered or a meeting is booked/held) → promoted (qualified: a contact exists) | disqualified. contacted and engaged are set by the system from captured activity and may be set by hand.'}
        owner_id: {type: [string, 'null'], format: uuid}
        source_system: {type: [string, 'null']}
        source_author_id: {type: [string, 'null'], format: uuid, description: 'Who wrote this record in the system it came from, when the author holds a seat here. Written only by a declared importer, only beside a source_system; either author field or both may be sent, and the seat''s current name wins on read. captured_by still names the caller.'}
        source_author_name: {type: [string, 'null'], maxLength: 200, description: 'The source system''s own spelling of who wrote this record. Same door as source_author_id: a declared importer only, beside a source_system. Kept when a seat is also named, so the name survives the seat.'}
        source_id: {type: [string, 'null']}
        source: {type: string}
      additionalProperties: true
    UpdateLeadRequest:
      type: object
      description: |-
        Partial update. `status` may move only between the open steps `new`/`contacted`/`engaged` here. **Disqualifying is done
        via DELETE /leads/{id}** (which sets status=disqualified AND archives — the invariant
        "disqualified ⇒ archived" is enforced on that one path); `promoted` is reachable only via
        POST /leads/{id}/promote. Both terminal states are therefore excluded from this enum.
      properties:
        full_name: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email}
        title: {type: [string, 'null']}
        company_name: {type: [string, 'null']}
        candidate_company_key: {type: [string, 'null'], description: 'Loose ABM routing key. Format: lowercased registrable domain when known (`acme.com`), else a slug of company_name. Never a company FK.'}
        project_id: {type: [string, 'null'], format: uuid, description: 'The body of work this lead belongs to; carries no same-company guard (a lead has no company).'}
        status: {type: string, enum: [new, contacted, engaged], description: 'A human may place an open lead on any open step, forwards or back; the system only ever moves forwards.'}
        source: {type: string, minLength: 1, description: 'Correct the source. Changing it recomputes the score (the source weight is part of it).'}
        score: {type: [integer, 'null'], minimum: 0, maximum: 100, description: 'Manual human score override. Omit to keep the computed lead-local score. Setting it REQUIRES `score_override_reason`; passing null clears the override and resumes recompute.'}
        score_override_reason: {type: [string, 'null'], minLength: 1, description: 'Written reason for the Commercial Judgement override. REQUIRED when `score` is set (422 otherwise); the override is sticky — it suppresses recompute until cleared.'}
        owner_id:
          type: [string, 'null']
          format: uuid
          description: |-
            Who owns this lead. The destination must be a seat that can be handed work — an
            active, unarchived human seat that is not read-only, and one inside the caller's own
            row scope — else `422 owner_not_assignable`, which names no more than that so the
            refusal does not disclose the roster or the team graph.
      additionalProperties: true
    PromoteLeadRequest:
      type: object
      required: [trigger]
      properties:
        trigger:
          type: string
          enum: [inbound_reply, meeting_booked, meeting_held, human_qualify]
          description: |-
            The genuine-engagement trigger. cold_outbound_no_reply is NOT permitted and is
            rejected with 422 — promotion is engagement, not import or an outbound touch.
        evidence:
          type: object
          description: Which inbound email/meeting (or human) triggered promotion; recorded in audit.
          properties:
            activity_id: {type: [string, 'null'], format: uuid}
            note: {type: [string, 'null']}
        deal:
          $ref: '#/components/schemas/QualifyDealRequest'
    QualifyDealRequest:
      type: object
      description: |-
        Open a deal in the same transaction as the promotion. Omit both ids to use the
        default pipeline's first open stage; a pipeline alone takes its first open stage; a
        stage alone is placed in its own pipeline. The deal's owner is the lead's owner
        and its company is left unset (a lead has no company). The deal's id lands
        on the lead as `qualified_deal_id`; a deal failure rolls the whole promotion back.
      properties:
        pipeline_id: {type: [string, 'null'], format: uuid}
        stage_id: {type: [string, 'null'], format: uuid}
        name: {type: [string, 'null'], description: 'Defaults to "<company> — <stage>" or the lead''s name.'}
        amount_minor: {type: [integer, 'null'], format: int64}
        currency: {type: [string, 'null'], description: 'ISO-4217; required with amount_minor.'}
    LeadQualificationEvidence:
      type: [object, 'null']
      readOnly: true
      description: |-
        The strongest genuine-engagement signal captured against this lead, derived from its
        linked activities at read time: a held meeting over a booked one over an inbound reply.
        What the qualify dialog shows as the reason and sends back as `trigger`; null when the
        lead has no such signal yet (a human may still qualify with `human_qualify`).
      required: [trigger]
      properties:
        trigger:
          type: string
          enum: [inbound_reply, meeting_booked, meeting_held]
        activity_id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
    PromoteLeadResponse:
      type: object
      required: [contact, merged]
      properties:
        contact: {$ref: '#/components/schemas/Contact'}
        merged:
          type: boolean
          description: True if promotion merged into an existing contact (no duplicate); false if a new contact was created.
        lead_id: {type: string, format: uuid}
        deal_id: {type: [string, 'null'], format: uuid, description: 'The deal opened alongside, when the request asked for one.'}
    DemoteLeadRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: 'Why the promotion is being reversed. Required and recorded in audit — an undo nobody explained is indistinguishable later from a mistake.'
    DemoteLeadResponse:
      type: object
      required: [lead, unwind]
      properties:
        lead: {$ref: '#/components/schemas/Lead'}
        unwind:
          type: string
          enum: [reversed, merge_lineage_only]
          description: |-
            `reversed` — the promotion had created a contact, which is now archived and the
            lead restored to `engaged`. `merge_lineage_only` — the promotion had merged into
            a pre-existing contact, which is left untouched; only the lineage pointers are
            nulled.
        contact_id:
          type: [string, 'null']
          format: uuid
          description: The contact the promotion had produced or merged into.
    LeadListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Lead'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    LeadSourceIntent:
      type: string
      enum: [high, neutral, low]
      description: 'What the scorer makes of a lead from this source: high adds the high-intent points, low subtracts the low-intent penalty, neutral does neither.'
    ReviewQuestion:
      type: object
      required: [key, label, type, required]
      properties:
        key: {type: string, description: 'Stable within a template. An answer is filed under it and a frozen response keeps both, so rewording a label never orphans an answer.'}
        label: {type: string, description: 'What the question asks, worded as the reader sees it.'}
        type: {type: string, enum: [text, multiselect], description: 'Text answers use answers; multiple-choice answers use choice_answers.'}
        options: {type: array, items: {type: string}, description: 'Allowed choices, required for multiselect. Frozen alongside the question in each submitted review.'}
        required: {type: boolean}
    ActivityReviewTemplate:
      type: object
      required: [id, key, label, outcome, questions, version, active, system, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        label: {type: string}
        outcome: {type: string, enum: [won, lost], description: 'Which outcome this template is for. A win review and a loss review ask different questions, and offering both at one close is asking somebody to do filing the record can do itself.'}
        questions: {type: array, items: {$ref: '#/components/schemas/ReviewQuestion'}}
        version: {$ref: '#/components/schemas/RowVersion'}
        active: {type: boolean}
        system: {type: boolean, description: 'Shipped with the product. A system template can be retired but not deleted, so an old review always has a template to name.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ActivityReviewTemplateListResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ActivityReviewTemplate'}}
    OutcomeReview:
      type: object
      required: [id, activity_id, deal_id, closing_occurrence_id, outcome, template_key, template_version, questions, answers, revision, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        activity_id: {type: string, format: uuid, description: 'The note this review was written as. It is where the prose, the author and the audience rules live.'}
        deal_id: {type: string, format: uuid}
        closing_occurrence_id: {type: string, format: uuid, description: 'Which closing this review is about. Compare it against the deal''s own `closing_occurrence_id` to tell whether it reviews the current outcome or an earlier one.'}
        outcome: {type: string, enum: [won, lost], description: 'What the deal did, as the closing recorded it — not as the stage reads today. A stage can be renamed or reconfigured; what happened cannot.'}
        template_key: {type: string}
        template_version: {type: integer}
        questions:
          type: array
          items: {$ref: '#/components/schemas/ReviewQuestion'}
          description: 'The questions as they were asked, FROZEN at submission. The template they came from is editable, and an edit must not change what this review appears to have asked.'
        choice_answers: {type: object, additionalProperties: {type: array, items: {type: string}}, description: 'Selected options by question key; values must belong to the frozen question vocabulary.'}
        answers: {type: object, additionalProperties: {type: string}, description: 'Keyed by question key. Every key here has a question in `questions`.'}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OutcomeReviewListResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/OutcomeReview'}}
    AcquisitionSource:
      type: object
      description: One administered business channel a deal can be attributed to.
      required: [id, key, label, sort_order, active, system, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        key:
          type: string
          description: >-
            The stable identifier stored on the deal. Lowercase, never changes once created — relabelling edits `label`, so a report keyed on the key survives the rename.
        label: {type: string, description: What readers see.}
        sort_order: {type: integer, description: Display order in pickers and settings.}
        active:
          type: boolean
          description: >-
            False is retired: still readable and still filterable on deals that carry it, but refused for a new assignment.
        system:
          type: boolean
          readOnly: true
          description: Seeded with the installation. Fully editable; it simply cannot be removed.
        version: {type: integer, format: int64, readOnly: true}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
    AcquisitionSourceListResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AcquisitionSource'}}
    RecordRole:
      type: object
      description: >-
        One administered responsibility a colleague or team can hold on a record. The role says WHAT someone is responsible for; it grants no access of its own.
      required: [id, key, label, record_types, assignee_kinds, sort_order, active, system, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        key:
          type: string
          description: >-
            The stable identifier. Lowercase, never changes once created — relabelling edits `label`, so a report keyed on the role survives the rename.
        label: {type: string, description: What readers see.}
        record_types:
          type: array
          minItems: 1
          description: Which record kinds this role may be held on.
          items: {$ref: '#/components/schemas/AssignmentRecordType'}
        assignee_kinds:
          type: array
          minItems: 1
          description: Whether a user, a team, or either may hold this role.
          items: {$ref: '#/components/schemas/AssignmentSubjectKind'}
        sort_order: {type: integer, description: Display order in pickers and settings.}
        active:
          type: boolean
          description: >-
            False is retired: existing assignments keep rendering their label, but the role is refused for a new assignment.
        system:
          type: boolean
          readOnly: true
          description: Seeded with the installation. Fully editable; it simply cannot be removed.
        version: {type: integer, format: int64, readOnly: true}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
    AssignmentRecordType:
      type: string
      enum: [company, deal, project]
      description: The kind of record an assignment hangs on.
    AssignmentSubjectKind:
      type: string
      enum: [user, team]
      description: Whether the responsible party is one colleague or a whole team.
    RecordRoleListResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/RecordRole'}}
    RecordAssignment:
      type: object
      description: >-
        One responsibility held on one record. It records WHO is responsible, never who may see the record: visibility stays with ownership and record grants, and adding an assignment changes nobody's access.
      required: [id, record_type, record_id, subject_kind, subject_id, subject_name, subject_inactive, role_id, role_key, role_label, role_active, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        record_type: {$ref: '#/components/schemas/AssignmentRecordType'}
        record_id: {type: string, format: uuid}
        subject_kind: {$ref: '#/components/schemas/AssignmentSubjectKind'}
        subject_id:
          type: string
          format: uuid
          description: The assigned user or team, per `subject_kind`.
        subject_name:
          type: string
          readOnly: true
          description: Resolved server-side so the row renders without a second lookup.
        subject_inactive:
          type: boolean
          readOnly: true
          description: >-
            True when the assigned user is deactivated. The assignment stays and keeps its label, so history stays readable; it simply reads as needing a successor.
        role_id: {type: string, format: uuid}
        role_key: {type: string, readOnly: true}
        role_label: {type: string, readOnly: true}
        role_active:
          type: boolean
          readOnly: true
          description: False when the role has since been retired. The assignment remains valid.
        source: {type: string, readOnly: true, description: What wrote this assignment.}
        version: {type: integer, format: int64, readOnly: true}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
    RecordAssignmentListResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/RecordAssignment'}}
    LeadSource:
      type: object
      description: One administered lead source. `key` is the value stored on `lead.source`; `label` is what a user sees.
      required: [id, key, label, intent, sort_order, active, system, lead_count, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        key: {type: string, description: 'Lowercase stable key, the stored value. Never changes after creation.'}
        label: {type: string}
        intent: {$ref: '#/components/schemas/LeadSourceIntent'}
        sort_order: {type: integer}
        active: {type: boolean, description: 'Inactive sources leave the create form and the filter; leads carrying them keep the value.'}
        system: {type: boolean, readOnly: true, description: 'Built-in. Can be renamed, re-weighted and deactivated, never deleted.'}
        lead_count: {type: integer, readOnly: true, description: 'Live leads carrying this key.'}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DiscoveredLeadSource:
      type: object
      description: A source value present on leads but absent from the administered list — a connector family, a seed, an import.
      required: [key, lead_count]
      properties:
        key: {type: string, description: 'The stored value, or for `connector:<name>:<id>` values the `connector:<name>` family.'}
        lead_count: {type: integer}
    LeadSourceListResponse:
      type: object
      required: [data, discovered]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/LeadSource'}}
        discovered: {type: array, items: {$ref: '#/components/schemas/DiscoveredLeadSource'}}
    LeadDisqualifyReason:
      type: object
      required: [id, label, sort_order, active, system, lead_count, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        label: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
        system: {type: boolean, readOnly: true}
        lead_count: {type: integer, readOnly: true, description: 'Leads disqualified with this reason.'}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LeadDisqualifyReasonListResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/LeadDisqualifyReason'}}
    FollowUpSettings:
      type: object
      required: [follow_up_after_days]
      properties:
        follow_up_after_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Days a sent message may stay unanswered before its sender is reminded to follow up.
    LeadSettings:
      type: object
      required: [first_response_enabled, first_response_target_minutes]
      properties:
        first_response_enabled: {type: boolean, description: 'Whether the first-response target is tracked at all. Off by default.'}
        first_response_target_minutes: {type: integer, description: 'How long a lead may wait for its first genuine response once the clock starts (routing, else creation). 15..10080.'}
        unassigned_escalation_user_id:
          type: [string, 'null']
          format: uuid
          description: |-
            Who answers when a lead nobody owns misses its target. Null means nobody is
            configured, and an unowned breach is recorded without being addressed. Also reads
            null once the named seat can no longer work the queue — suspended, archived, an
            agent, a read seat — because a desk nobody reads is the same silence as none.
    DisqualifyLeadRequest:
      type: object
      description: Why the lead is closed. Both fields are optional on the wire so an agent's governed disqualify still works; the UI always sends a reason.
      properties:
        reason_id: {type: [string, 'null'], format: uuid}
        note: {type: [string, 'null']}
    Signal:
      type: object
      description: |-
        A surfaced "something changed / worth attention" item. Mirrors the `signal` table:
        company-level and consent-gated by construction — the only mandatory attribution is
        to a company (`resolved_company_id` after resolution); `resolved_contact_id` is optional
        and set only under a recorded consent grant (P12). Unattributable signals are
        `dropped`, never retained as a contact-level dossier.
      required: [id, kind, source_channel, resolution_state, severity, summary, evidence, status, detected_at, source, captured_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          enum: [stalled_deal, champion_left, reengagement, buying_intent, risk, other, contract_ended, new_opportunity, commitment_made, ghosted_thread, project_gone_quiet, funding, leadership_change, expansion, product_launch, technical_change]
          description: |-
            The first six are what a human files by hand. The rest are what the producers
            raise: `contract_ended`, `new_opportunity` and `commitment_made` are read
            out of a settled conversation by the `signal_extract` site, each citing the message
            it is stated in; `ghosted_thread` is a comparison rather than a judgment — the newest
            interaction is ours, nobody answered it, and the account is one worth chasing;
            `project_gone_quiet` is the same kind of comparison on a project — it is being
            pursued or delivered and nothing has been filed against it for 30 days (the
            `projects-gone-quiet` report's own rule). Its subject is the project
            (`entity_type: project`), attributed to the project's company.
        source_channel:
          type: string
          enum: [derived, inbound, web, social, deal_room_engagement]
          default: derived
          description: Where the raw signal came from.
        raw_ref: {type: [string, 'null'], description: 'Pointer to the raw source payload the resolver works from: an email address/handle, a domain, a URL, or a company mention.'}
        entity_type:
          type: [string, 'null']
          enum: [deal, company, contact, project, null]
          description: The subject record the signal is about; null until a raw signal resolves (both entity fields set together).
        entity_id: {type: [string, 'null'], format: uuid}
        resolution_state:
          type: string
          enum: [resolved, low_confidence, unresolved, dropped]
          description: 'The raw→entity match outcome: an ambiguous match is `low_confidence` (surfaced, never silently asserted); an unattributable one is `dropped`.'
        resolution_confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        resolved_company_id: {type: [string, 'null'], format: uuid, description: The company the raw signal resolved to (the only required attribution level).}
        resolved_contact_id: {type: [string, 'null'], format: uuid, description: 'Optional contact resolution, set only under a recorded consent grant and never inferred.'}
        severity: {type: string, enum: [info, warn, urgent], default: info}
        summary: {type: string}
        evidence:
          type: array
          items: {$ref: '#/components/schemas/SignalEvidence'}
          description: Per-claim evidence; a claim without evidence is omitted.
        status: {type: string, enum: [open, acknowledged, resolved, dismissed], default: open}
        detected_at: {type: string, format: date-time}
        source: {type: string}
        captured_by: {type: string, readOnly: true, description: 'Server-stamped from the authenticated principal; never client-supplied.'}
        version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
        resolution:
          allOf: [{$ref: '#/components/schemas/SignalResolution'}]
          description: |-
            How a human resolved this signal, and who. Null while `status` is
            `open` or `acknowledged` — only a human outcome appends one.
    SignalResolution:
      type: object
      description: |-
        A human's answer on one signal. `outcome` is the status they set,
        `note` is what they wrote, `resolved_by` is who they are.
      required: [outcome, resolved_at]
      properties:
        outcome: {type: string, enum: [resolved, dismissed], description: 'The status the human set.'}
        note: {type: [string, 'null'], description: 'What they wrote about it, if anything.'}
        resolved_by: {type: [string, 'null'], format: uuid, description: 'The colleague who answered; null once their account is deleted.'}
        resolved_at: {type: string, format: date-time}
    SignalEvidence:
      type: object
      required: [snippet]
      properties:
        snippet: {type: string}
        source_type: {type: [string, 'null'], enum: [activity, deal, signal, relationship, page, contract, null]}
        source_id: {type: [string, 'null']}
    SignalListResponse:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Signal'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    SignalWarmContact:
      type: object
      required: [contact_id, relationship_kind, strength, strength_bucket]
      properties:
        contact_id: {type: string, format: uuid}
        full_name: {type: [string, 'null']}
        relationship_kind: {type: string, enum: [employment, deal_stakeholder]}
        relationship_role: {type: [string, 'null'], description: 'e.g. cto, champion, economic_buyer.'}
        strength: {type: integer}
        strength_bucket: {type: string, enum: [none, weak, moderate, strong]}
    SignalWarmth:
      type: object
      description: |-
        The warm/cold branch with its full evidence: source signal id, resolved company id, and
        the specific contact id(s) that make it warm. No mystery score — a numeric-only
        answer would be a contract violation.
      required: [warm, routing, source_signal_id, resolved_company_id, contact_ids, contacts]
      properties:
        warm: {type: boolean}
        routing:
          type: string
          enum: [warm_room, cold_queue]
          description: The real routing branch — warm signals surface in the warm room, cold ones queue separately.
        source_signal_id: {type: string, format: uuid}
        resolved_company_id: {type: string, format: uuid}
        contact_ids:
          type: array
          items: {type: string, format: uuid}
          description: Empty exactly when cold.
        contacts:
          type: array
          items: {$ref: '#/components/schemas/SignalWarmContact'}
    SignalIntroPath:
      type: object
      description: |-
        An actionable warm-intro path — names the route-in contact, the relationship we
        have, and a concrete next move with a drafted message. Proposal only: the send is
        the governed send tool, never this read.
      required: [signal_id, resolved_company_id, contact_id, relationship, next_move, evidence]
      properties:
        signal_id: {type: string, format: uuid}
        resolved_company_id: {type: string, format: uuid}
        contact_id: {type: string, format: uuid, description: The route-in contact (the strongest live relationship at the resolved company).}
        contact_name: {type: [string, 'null']}
        relationship: {$ref: '#/components/schemas/SignalWarmContact'}
        next_move:
          type: object
          required: [kind, draft_subject, draft_body, ai_disclosure]
          properties:
            kind:
              type: string
              enum: [draft_to_contact, intro_request]
            draft_subject: {type: string}
            draft_body: {type: string, description: 'Ends with the AI provenance notice, so a rep who sends this body unchanged sends the notice with it.'}
            ai_disclosure: {type: string, description: 'The provenance notice, repeated here as its own field; unlike the composer drafts this one is also rendered into draft_body above.'}
        evidence:
          type: object
          description: Provenance back to the warm signal (evidence-or-omit).
          required: [source_signal_id, resolved_company_id, contact_ids]
          properties:
            source_signal_id: {type: string, format: uuid}
            resolved_company_id: {type: string, format: uuid}
            contact_ids: {type: array, items: {type: string, format: uuid}}
    List:
      type: object
      description: >-
        A Live List (list_type dynamic: its members are its filter's current result) or a Shortlist (static: members chosen by hand). Mirrors the `list` table.
      required: [id, name, entity_type, list_type, sharing, version, health, can_edit]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        purpose: {type: [string, 'null'], description: 'What the list is for, in the words of its steward.'}
        entity_type: {type: string, enum: [contact, company, deal, lead, project]}
        list_type: {type: string, enum: [static, dynamic], default: static}
        definition: {type: [object, 'null'], additionalProperties: true, description: 'A Live List''s filter tree; null for a Shortlist.'}
        sharing:
          type: string
          enum: [private, team, workspace]
          description: >-
            Who may FIND the list. Never who may see its members: every member read applies the reader's own row scope.
        owner_id: {type: [string, 'null'], format: uuid}
        team_id: {type: [string, 'null'], format: uuid, description: 'The team a team list is shared with; null shares it with the teams of its owner.'}
        steward_id: {type: [string, 'null'], format: uuid, description: 'Who looks after the list and may change it.'}
        steward_name: {type: [string, 'null']}
        version: {type: integer, format: int64}
        visible_count:
          type: [integer, 'null']
          description: >-
            How many members this caller may see. Null when the list's filter can no longer be evaluated (health `invalid`). Never the list's whole size.
        health:
          type: string
          enum: [ok, ownerless, invalid, retired_field, retired_tag]
          description: >-
            `ownerless` when nobody looks after the list — no steward, or one who can no longer sign in — so somebody should take it over. `invalid` when a Live List's filter no longer compiles. `retired_field` when a Live List's filter names a custom field that has been retired: the list still evaluates on the kept values, and its steward should replace the clause. `retired_tag` when a Live List's filter names a tag that has been archived or merged away: that tag no longer matches any record, so a clause on it selects nothing, and its steward should name the tag that took its place. `invalid` outranks `ownerless`, which outranks `retired_field`, which outranks `retired_tag`.
        retired_tags:
          type: array
          items: {type: string, format: uuid}
          description: >-
            The archived or merged-away tags a Live List's filter names. Absent when it names none.
        retired_fields:
          type: array
          items: {type: string}
          description: >-
            The retired custom fields a Live List's filter names, by column name. Absent when it names none.
        can_edit: {type: boolean, description: 'Whether this caller holds list authority over the list.'}
        last_check:
          $ref: '#/components/schemas/ListCheck'
          description: A Live List's latest check; absent for a Shortlist or a Live List not checked yet.
        since_last_visit:
          $ref: '#/components/schemas/ListPulse'
          description: >-
            What a Live List gained and lost since this caller last opened it, counting only records they can see now. Absent on a first visit and for a Shortlist. A visit recorded in the last half hour is the one in progress, so the counts run from the visit before it.
        joined_since_visit:
          type: array
          items: {type: string, format: uuid}
          description: >-
            On a single Live List read: the members this caller can see that a check saw joining since their last visit and that are still members, newest first, at most 500. Absent from the library.
        changes_since_visit:
          $ref: '#/components/schemas/ListChangeSummary'
          description: >-
            On a single Live List read: what changed since this caller last opened it, counted from the list's history under their row scope, with no model involved. Absent on a first visit, for a Shortlist and from the library.
        dependencies:
          type: array
          description: >-
            What uses this list: the active automation rules that watch or add to it, then its filtered exports. Neither blocks a change; a rule pauses itself when its list is archived.
          items: {$ref: '#/components/schemas/ListDependency'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    ListCheck:
      type: object
      description: >-
        When a Live List's members were last compared with the check before. `complete` recorded who joined and left; `too_large` matched more records than one check may hold, so nothing was recorded; `invalid` could not evaluate the filter.
      required: [checked_at, outcome]
      properties:
        checked_at: {type: string, format: date-time}
        outcome: {type: string, enum: [complete, too_large, invalid]}
    ListChangeSummary:
      type: object
      required: [since, joined, left, filter_changes]
      properties:
        since: {type: string, format: date-time, description: 'The visit the summary runs from.'}
        joined: {$ref: '#/components/schemas/ListChangeGroup'}
        left: {$ref: '#/components/schemas/ListChangeGroup'}
        filter_changes: {type: integer, description: 'How many times the filter changed since then.'}
    ListChangeGroup:
      type: object
      description: The distinct records this caller can see that moved one way, and the newest three by name.
      required: [count, records]
      properties:
        count: {type: integer}
        records:
          type: array
          items: {$ref: '#/components/schemas/ListChangedRecord'}
    ListChangedRecord:
      type: object
      required: [entity_id]
      properties:
        entity_id: {type: string, format: uuid}
        name: {type: [string, 'null']}
    ListPulse:
      type: object
      required: [since, entered, left]
      properties:
        since: {type: string, format: date-time, description: 'The visit the counts run from.'}
        entered: {type: integer, description: 'Records seen joining since then.'}
        left: {type: integer, description: 'Records seen leaving since then.'}
    ListDependency:
      type: object
      required: [kind, occurred_at, blocking]
      properties:
        kind: {type: string, enum: [export, automation]}
