name: fx_rates_two_pairs_grounded
task: rate_extract
site: fx
source: hand_authored
sanitized_by: hand_authored/claude-opus-4-8
# The expected rates are what the SHEET stores: one unit of the foreign currency
# in the workspace base. The page states the opposite direction and the prompt
# forbids the model any arithmetic, so a correct read is the page's direction
# reported intact and inverted by fxAnchor — never converted by the model.
fixture:
  base_currency: EUR
  tracked_currencies: [USD, GBP]
  page_text: |
    Base currency EUR. 1 EUR = 1.0800 USD as of today.
    1 EUR = 0.8500 GBP, mid-market.
expect:
  outcome: accepted
  answer:
    USD: '0.9259259259'
    GBP: '1.1764705882'
  judge: none
  judge_none_reason: >
    Every value the sheet stores is compared exactly, and the cited passage must
    print it. The gate drops an uncited, untracked or low-confidence row before
    the sheet sees it, so nothing else the rubric asked reaches an
    administrator.
