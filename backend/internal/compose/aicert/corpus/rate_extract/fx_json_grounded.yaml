name: fx_rates_json_api_grounded
task: rate_extract
site: fx
source: hand_authored
sanitized_by: hand_authored/claude-opus-4-8
# The default fx_source (api.frankfurter.dev/v1/latest) is read as page text,
# not parsed JSON, so the extractor must ground a single-passage JSON body too.
fixture:
  base_currency: EUR
  tracked_currencies: [USD, GBP]
  page_text: |
    {"amount":1.0,"base":"EUR","date":"2026-07-22","rates":{"USD":1.08,"GBP":0.86}}
expect:
  outcome: accepted
  answer:
    USD: '0.9259259259'
    GBP: '1.1627906977'
  judge: none
  judge_none_reason: >
    Every value the sheet stores is compared exactly, and the cited passage must
    print it. The gate drops an uncited, untracked or low-confidence row before
    the sheet sees it, so nothing else the rubric asked reaches an
    administrator.
