name: custom_report_setup_names_back_a_measure_it_cannot_express
task: report_setup
site: custom_report_setup
source: hand_authored
sanitized_by: hand_authored/claude-fable-5
# The words ask for a measure the catalog has no metric for. The proposal
# keeps the one metric it can and names the other phrase back rather than
# mapping it to the nearest metric.
fixture:
  description: "Open pipeline in Austria this month, and the average discount per rep."
  today: "2026-11-03"
  lang: en
  products: []
  catalog:
    industries:
      - {id: software, label: Software}
    periods: [this_month, this_quarter]
    metrics:
      - {id: bookings_won, label: "Sales won", charts: [bookings_trend]}
      - {id: open_pipeline, label: "Open pipeline", charts: [stage_distribution, metric_reading]}
    charts:
      - {id: bookings_trend, label: bookings_trend}
      - {id: stage_distribution, label: stage_distribution}
      - {id: metric_reading, label: metric_reading}
expect:
  outcome: accepted
  answer:
    country: AT
    period: this_month
    metrics: [open_pipeline]
    unsupported: 1
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
  rubric: >
    Score whether the proposal keeps Open pipeline, Austria as AT and
    this_month, and names back "the average discount per rep" as a measure
    no metric here holds. Mapping that phrase to Sales won, or to any
    metric, fails the scenario. A product or an industry the words never
    asked for scores low.
