  body: |
    Guten Tag,

    hiermit bestaetigen wir Ihren Termin am Dienstag, 14. Oktober um 09:30 Uhr.
    Bitte bringen Sie Ihre Versichertenkarte mit. Sollten Sie den Termin nicht
    wahrnehmen koennen, sagen Sie bitte mindestens 24 Stunden vorher ab.

    Freundliche Gruesse
