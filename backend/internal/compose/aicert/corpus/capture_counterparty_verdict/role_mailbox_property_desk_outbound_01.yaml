  display_name: Parkview CS6
  email: parkview.team@example.com
  subject: Access card replacement
  direction: outbound
  wrote_back: false
  body: |
    Hello,

    My access card for the apartment stopped working yesterday evening. Could
    you arrange a replacement, or let me know when the office is open so I can
