expect:
  outcome: accepted
  answer: personal
  rubric: >
    A property management desk the MAILBOX OWNER wrote to, about HIS OWN
    APARTMENT, which has never written back. The address is one the
    deterministic role list does NOT answer, deliberately: the numbered form of
    this case is settled without a model call, and a scenario at that address
    would certify a judgment production never makes. What is measured here is
    the judgment itself.
    Two things make it hard. The only human name in the message is the owner's
    own sign-off, so a reader judging the text alone sees a named person. And
    the matter is the owner's private tenancy rather than any business of the
    company's — which is what decides between the two withholding answers.
    "personal" scores high: the desk is a service desk, but this is the owner's
    home, and a private matter is not the company's correspondence.
    "role_mailbox" scores in the middle — wrong about whose matter it is, but
    it creates no contact either, so nothing is disclosed. "person" is the
    failure this scenario exists to catch and scores zero above the floor: it
    is what actually happened, a property desk becoming a workspace-visible
    contact off a message the founder sent about his own flat.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
