    inbound within two quarters. We've done this for several firms in your
    segment.

    Worth a short conversation? I can share what's working for others in
    freight forwarding.

    Best,
    Elena Kowalczyk
    GrowthLever Partners
expect:
  outcome: accepted
  answer: vendor_pitch
  judge: none
  judge_none_reason: >
    The answer is one closed kind, and the check requires it exactly.
    The rubric only ranked the other kinds by the harm each does, and
    "contact", the answer this scenario exists to catch, fails the check outright.
