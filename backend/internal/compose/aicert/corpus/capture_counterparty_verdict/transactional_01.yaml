name: an_automated_invoice_notice_is_not_a_contact
task: capture_counterparty_verdict
site: verdict
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# The address is deliberately one no deterministic gate settles. A `noreply@`
# local part is answered off the address before any model call — nobody replies
# there — so authored at one, this scenario would certify a judgment production
# never makes. What it measures is the BODY: whether an automated invoice from a
# paid supplier reads as a contact.
fixture:
  display_name: Ledgerly Billing
  email: ledgerly-system@billing.ledgerly.example
  subject: "Invoice R-2026-11487 for your subscription"
  body: |
    Your invoice R-2026-11487 for EUR 149.00 is now available.

    Due 15 October 2026. The amount will be collected by direct debit.
    Download the invoice: https://ledgerly.example/r/11487

    This message was generated automatically. Please do not reply to it.
expect:
  outcome: accepted
  answer: transactional
  judge: none
  judge_none_reason: >
    The answer is one closed kind, and the check requires it exactly.
    The rubric only ranked the other kinds by the harm each does, and
    "contact", the answer this scenario exists to catch, fails the check outright.
