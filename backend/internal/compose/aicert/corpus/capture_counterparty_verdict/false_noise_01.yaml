name: real_prospect_must_not_be_noise
task: capture_counterparty_verdict
site: verdict
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
fixture:
  display_name: Priya Raman
  email: p.raman@northwind-logistics.example
  subject: quote for 3 pallets weekly, Rotterdam - Lyon
  body: |
    hi, got your name from a colleague. we ship about 3 pallets a week rotterdam to
    lyon and our current forwarder keeps missing the tuesday cutoff. can you do
    recurring lanes? what would that cost roughly. we'd want to start next month.

    priya
expect:
  outcome: accepted
  answer: person
  rubric: >
    This is the release-blocking false-noise case (ADR-0072/A118 §4). The sender
    is an unmistakable inbound prospect: a named human, a specific commercial
    need, a stated timeline, and a request for a quote. The message is lowercase
    and unpolished, which is exactly the trap — informality is not noise.
    A kind of "person" scores high: she is a human with an interest in this
    business, and hers is the one kind that becomes a contact record.
    "spam" and "newsletter" are the failure this scenario exists to catch and
    score zero regardless of stated confidence, because both hide a genuine
    prospect's first mail. "organization_sender" and "role_mailbox" are wrong in
    a milder way — they keep the correspondence visible and withhold only the
    contact record — so they score in the middle, above the hiding kinds and
    well below the right answer: Priya signs with her own name from her own
    address, and reading that as a shared mailbox loses the person a rep needs to
    reply to. A "person" verdict below the 0.7 floor also scores in the middle:
    abstaining is safe but costs a human the review.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
