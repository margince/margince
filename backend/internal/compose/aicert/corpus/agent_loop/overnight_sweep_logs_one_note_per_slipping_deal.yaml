expect:
  outcome: accepted
  answer: log_activity
  near_misses:
    - list_records
  rubric: >
    Grade the notes the run logged with log_activity, read against the list and
    the records its steps show it read. The goal is ONE note per listed deal:
    a subject naming the risk and a body stating the finding and the evidence.
    Pump station retrofit has had no recorded activity since 28 August and no
    next step; Office HVAC service is past its 15 September expected close date
    although it saw activity on 19 September. Score high when each note names
    that deal's own risk and cites the field or record it rests on. Score low
    when a note invents a cause no record carries (a lost champion, a
    competitor, a price dispute), gives both deals the same generic risk, or
    tells someone to advance a stage, send a message or archive a deal.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
