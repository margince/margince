          - rank: 1
            deal_id: 0198f3a1-7c42-7e0b-9d51-2a6f4b8c1e81
            name: "Rooftop solar canopy"
            amount_minor: 15800000
            currency: EUR
            evidence:
              - {source: deal.last_activity_at, snippet: "No recorded activity since 2026-08-20 (35 days)."}
