name: growth_fit_reads_their_facts_against_our_offering
task: growth_fit
site: growth_fit
source: hand_authored
sanitized_by: hand_authored/claude-fable-5
fixture:
  profile_fields:
    - label: their_offer
      field: offer_summary
      value: Load-shifting and demand-response software for industrial sites
    - label: their_icp
      field: icp
      value: Energy-intensive manufacturers running their own substations
    - label: their_industry
      field: industry
      value: Industrial energy software
    - label: their_buying_center
      field: buying_center
      value: Head of Operations, with sign-off from the CFO above EUR 100k
  facts:
    - label: their_size
      field: employee_range
      value: "51-200"
    - label: their_stack
      field: technology
      value: SAP S/4HANA
  # What WE sell, as the confirmed company context production prepends. It is
  # written to fit them — a software vendor selling to energy-heavy industry,
  # running SAP — so a weak band means their records were not read against it.
  our_offering:
    offer:
      - key: offer_summary
        value: SAP S/4HANA integration and data-pipeline services for industrial software vendors
    positioning:
      - key: icp
        value: B2B software companies of 50-500 employees selling into manufacturing and energy
      - key: value_proposition
        value: Their product reads plant and ERP data without a custom integration project
expect:
  outcome: accepted
  answer:
    # The records a defensible assessment has to rest on — not its wording. An
    # assessment that never touches what they sell or who they sell to is not
    # judging fit, it is describing a company. Their stack is here because it
    # is the fact a whitespace or objection claim would have to be built on.
    cites: [their_offer, their_icp, their_stack]
    # A RANGE, not a verdict. Whether this company is a strong or a moderate
    # fit is a judgment two careful readers can differ on. Calling it weak is
    # not: it would mean the model read their software-and-substations profile
    # against our offering and found nothing, which is a failure at the one
    # thing this surface is for.
    bands: [strong, moderate]
  bands:
    # Growth fit degrades to an abstention, never to a wrong band, so a model
    # that is unreliable here costs the reader a panel rather than misleading
    # them. The bar is still higher than the brief's: a band is a verdict a rep
    # may act on, where a brief sentence is prose beside records they can open.
    certified_min: 75
    degraded_min: 55
    floor: 45
  rubric: >
    The company summary describes THEM: a vendor of load-shifting software for
    manufacturers with their own substations, 51-200 staff, running SAP
    S/4HANA. The confirmed company context describes US: SAP integration
    services for industrial software vendors. A reply that reads their
    offer_summary or icp as ours has judged the wrong company and scores at the
    floor; citing THEIR offer_summary and icp records is correct evidence. The
    confirmed company context carries no record ids, so every id in the
    company summary, and every id a reply cites, is one of THEIR records: a
    citation of an offer_summary or icp profile field points at what they
    sell, never at our offering.
    Score whether every claim rests on something the company summary actually
    says, and whether claims drawn from OUR offering are labelled assessments
    rather than facts about them. Our own offering must never be cited as
    evidence: it is not a record the reader can open, and a citation pointing
    at it is worse than no citation because it looks checkable. Penalise any
    band reported as "unknown" — the counting step owns that decision, and a
    model that abstains here has declined the question it was asked. Penalise
    an invented fact about their revenue, their incumbent vendor or their
    buying timeline: none is in the summary, and each is the kind of claim a
    rep would repeat in a meeting.
