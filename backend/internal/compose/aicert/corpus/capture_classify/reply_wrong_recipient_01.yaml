name: the_wrong_recipient_is_neutral_not_a_refusal
task: capture_classify
site: classify
source: hand_authored
sanitized_by: hand_authored/claude-opus-5-5
fixture:
  - subject: 'Re: introduction'
    inbound: true
    body: |
      Hello, I am not the right one to ask about this. I moved to the finance team
      last spring.

      Kind regards,
      Petra
expect:
  outcome: accepted
  answer:
    - label: other
      reply: neutral
  rubric: >
    The candidate output is the harness's record of the run, not one reply.
    "replies" holds each raw reply in the order the pass asked, and "messages"
    holds what the pass stored for each message. That wrapper is the harness's,
    so never score it as a format fault; each reply inside it is the model's.
    A message answered under the 0.7 floor is re-asked alone, so a second reply
    is that re-ask and not a contradiction.
    The recipient says they are the wrong recipient and gives no view on the
    offer itself. They do not decline to go ahead and do not ask us to stop
    writing, so the reply verdict is "neutral", and the label is "other".
    "negative" is the failure this scenario exists to catch: a negative
    verdict can close the customer's deal as lost, and nobody at the customer
    said no.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
