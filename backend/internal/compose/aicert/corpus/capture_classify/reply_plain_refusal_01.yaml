name: a_plain_refusal_is_negative
task: capture_classify
site: classify
source: hand_authored
sanitized_by: hand_authored/claude-opus-5-5
fixture:
  - subject: 'Re: phase two proposal'
    inbound: true
    body: |
      Hi Jana, thank you for the proposal and the time you put into it. We have
      decided not to go ahead with phase two this year.

      Best regards,
      Marco
expect:
  outcome: accepted
  answer:
    - label: other
      reply: negative
  rubric: >
    The candidate output is the harness's record of the run, not one reply.
    "replies" holds each raw reply in the order the pass asked, and "messages"
    holds what the pass stored for each message. That wrapper is the harness's,
    so never score it as a format fault; each reply inside it is the model's.
    A message answered under the 0.7 floor is re-asked alone, so a second reply
    is that re-ask and not a contradiction.
    The customer declines the proposal in plain words. Nothing is promised
    or requested of us and no time is proposed, so
    the label is "other". The reply verdict is "negative": the sender says
    no to going ahead. "neutral" or null misses a refusal the owner needs to
    see; "positive" is the worst answer.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
