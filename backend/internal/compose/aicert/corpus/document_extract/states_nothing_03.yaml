name: attached_document_states_none_of_them
task: document_extract
site: fields
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# The abstention scenario, and the one that matters most. Most files attached
# to a deal are not order forms: they are specifications, minutes, checklists.
# Reading one and offering nothing is the correct answer, and a site that
# invents an amount here writes a number onto a deal nobody agreed to.
fixture:
  filename: qa-validation-requirements.txt
  text: |
    QA VALIDATION REQUIREMENTS
    Packaging line 3 — revision C

    Prepared for the joint validation review. This document lists what must
    be demonstrated before the line is released to production. It carries no
    commercial terms; see the separate order documentation.

    1. Seal integrity
       Burst testing at three points across the web, per the harmonised
       method. Two consecutive passing runs are required.

    2. Label placement
       Placement tolerance within specification across a full shift, sampled
       hourly. Deviations are logged with the operator and the batch.

    3. Traceability
       Every pallet must resolve to its batch and its inbound material lot
       within the plant system, demonstrated on live data.

    4. Changeover
       Full changeover completed inside the agreed window with no manual
       intervention outside the documented steps.

    Sign-off requires all four demonstrated in the same validation window.
    Partial sign-off is not available.
expect:
  outcome: accepted
  answer: {}
  judge: none
  judge_none_reason: >
    The right answer is every field not stated, and the check fails any field
    the reading offers above the floor, whatever its quote. A reading too
    unsure to clear the floor offers nothing, which is the right answer too.
