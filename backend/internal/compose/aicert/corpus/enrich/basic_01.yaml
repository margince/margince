name: contact_fields_from_a_mail_signature
task: enrich
site: signature
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# The whole mail, not the window: the trailing-lines derivation is production's
# step, and a fixture that pre-derived it could hand the model a window the pass
# would never build. The quoted history below is here for exactly that reason —
# it is excluded from the window, so a field evidenced in it cannot survive.
fixture:
  full_name: Anke Vogel
  email: a.vogel@nordwerk-metal.test
  body: |
    Hi Jana,

    Thanks for sending the drawings over. Two of the brackets need a tighter
    tolerance than the sheet states; I will mark them up and send them back
    tomorrow.

    > On Tuesday, Jana Ritter wrote:
    > Anke, could you have a look and let me know? My mobile is +49 170 555 0199
    > and my title is Head of Procurement if you need it for the file.

    Best regards,

    Anke Vogel
    Head of Quality Assurance
    Nordwerk Metalworks GmbH
    +49 521 555 0142
    https://www.linkedin.com/in/anke-vogel-qa
expect:
  outcome: accepted
  answer:
    title: Head of Quality Assurance
    company_name: Nordwerk Metalworks GmbH
    phone: +49 521 555 0142
    linkedin: https://www.linkedin.com/in/anke-vogel-qa
  judge: none
  judge_none_reason: >
    Every field the signature states is expected verbatim, so a reformatted
    phone disagrees. The gate refuses evidence outside the signature window,
    which holds the quoted reply's number and title out; nothing else the rubric
    asked reaches the contact record.
