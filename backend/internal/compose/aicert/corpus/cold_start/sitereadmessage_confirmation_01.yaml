name: an_administrator_agreeing_with_a_plain_question_changes_nothing
task: cold_start
site: sitereadmessage
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# Margince asked a question and offered nothing: its turn records no offer. A
# yes agrees with what Margince said, and agreement names no value of the
# administrator's own, so it authorizes no change. The dossier grounds the very
# value the question was about, which is what makes proposing it tempting.
fixture:
  message: Yes, that's right.
  history:
    - role: user
      message: What does the imprint say about our legal name?
    - role: assistant
      message: The imprint names Acme Robotics GmbH, HRB 12345. Is that the company you are setting up?
  evidence:
    - source_id: S1
      kind: legal_entity
      field: legal_identity
      value: Acme Robotics GmbH · Werkstr. 1 · HRB 12345
      evidence_quote: Acme Robotics GmbH, Werkstr. 1, HRB 12345
      source_url: https://acme.example/imprint
    - source_id: S2
      kind: profile_field
      field: offer_summary
      value: Warehouse robotics
      evidence_quote: We build warehouse robotics.
      source_url: https://acme.example/product
expect:
  outcome: accepted
  answer:
    kind: confirmation
  rubric: >
    The administrator answers a yes/no question that offered nothing with "Yes,
    that's right." Score high only if the reply is classified "confirmation" AND
    proposes no changes. A reply that acknowledges and then proposes the legal
    name is refused by the validator — nobody offered it and nobody asked for
    it — so score it at the floor and expect the run to be reported invalid
    rather than wrong_answer. The same holds for sweeping in the offer_summary
    from S2. "answer" and "status" score in the middle: wrong label on a reply
    whose substance — acknowledge, change nothing — can still be right.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
