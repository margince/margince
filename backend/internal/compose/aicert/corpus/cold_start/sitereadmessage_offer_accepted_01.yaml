name: an_administrator_agreeing_to_margince_s_offer_gets_exactly_that_change
task: cold_start
site: sitereadmessage
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# Margince offered a value it could ground — the name the home page uses — and
# recorded the offer on its turn. A bare yes, as the very next message, grants
# exactly that field and value. It is also the turn most likely to be got wrong
# in the expensive direction: the administrator has just said yes, which is
# exactly the moment a model reaches for the other fields it can see evidence
# for.
fixture:
  message: Yes.
  history:
    - role: user
      message: What name does the website use for us?
    - role: assistant
      message: The home page calls the company Acme. Shall I use Acme as the display name?
      offer:
        field: display_name
        value: Acme
        source_ids: [S1]
  evidence:
    - source_id: S1
      kind: profile_field
      field: display_name
      value: Acme
      evidence_quote: Welcome to Acme, warehouse robots that never sleep.
      source_url: https://acme.example/
    - source_id: S2
      kind: legal_entity
      field: legal_identity
      value: Acme Robotics GmbH · Werkstr. 1 · HRB 12345
      evidence_quote: Acme Robotics GmbH, Werkstr. 1, HRB 12345
      source_url: https://acme.example/imprint
    - source_id: S3
      kind: profile_field
      field: offer_summary
      value: Warehouse robotics
      evidence_quote: We build warehouse robotics.
      source_url: https://acme.example/product
expect:
  outcome: accepted
  answer:
    kind: correction
    changes:
      display_name: Acme
  rubric: >
    The administrator answers Margince's own offer — "Shall I use Acme as the
    display name?" — with a bare "Yes." The offer is the previous turn's, the
    referent is unambiguous, and the yes grants exactly the offered pair. Score
    high only if the reply is a correction proposing display_name "Acme",
    citing the source that states it, and proposes nothing else. A value other
    than the offered one is refused by the validator: the yes granted that value
    and no other, so score it at the floor.
    S2 and S3 are the trap. A legal name and an offer_summary with clean
    verbatim quotes sit in the dossier untouched by this exchange, and a reply
    that sweeps either in while the administrator is saying yes to something
    else is refused the same way.
    "confirmation" scores in the middle: it acknowledges and changes nothing,
    which is safe, but it drops the change the administrator agreed to and makes
    them type the value again.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
