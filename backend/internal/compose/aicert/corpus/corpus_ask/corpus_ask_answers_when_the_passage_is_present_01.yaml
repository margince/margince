  # The twin's whole point: with the decisive passage present, abstaining is now
  # the wrong answer, and the one passage that states the steps must be cited.
  answer:
    - new_project
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
  rubric: >
    Score whether the model answers from the one passage that states the steps.
    new_project says what to click, what a project requires and what happens
    next; a correct reply rests on it.

    This scenario exists to be read against
    corpus_ask_abstains_when_uncovered_03, which asks the identical question over
    the identical passages minus new_project and whose only correct answer is
    silence. Passing one and failing the other is the finding: refusing here
    means the answerability test has hardened into refusing anything that looks
    hard, and answering there means the model was never reading the passages at
    all. A binding that passes both is responding to the evidence in front of it.

    The trap passages are still present and still wrong to rest on. A key minted
    from a name and a fixed list of phases describe a project that already
    exists; neither is a step in making one.
