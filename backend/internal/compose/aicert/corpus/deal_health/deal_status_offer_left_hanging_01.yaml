name: deal_status_offer_left_hanging
task: deal_health
site: deal_status
source: hand_authored
sanitized_by: hand_authored/claude-fable-5
fixture:
  deal:
    name: "Nordwind Logistik — Einführung"
    status: open
    amount: "8400000 EUR (minor units)"
    expected_close: "2026-09-30"
  # The verb the rules chose. The model explains this move; it never picks
  # one, so the fixture has to carry what production hands it.
  move: "create_task: The last contact was 12 days ago and nothing is booked — agree the next step."
  timeline:
    # The story the timeline tells: pricing was asked for on a call, promised,
    # and never sent. The card must say that, not that the deal is progressing.
    - label: pricing_call
      kind: call
      direction: outbound
      subject: "Call — depot rollout scope and pricing"
      at: "2026-08-11"
      when: past
      excerpt: "They asked for a revised offer covering the two extra depots. We said it would go out this week."
    - label: earlier_intro
      kind: email
      direction: outbound
      subject: "Intro and first scope sketch"
      at: "2026-07-28"
      when: past
      excerpt: "First outline of the rollout, five depots, pilot in Hamburg."
expect:
  outcome: accepted
  # The card must rest on the call where the offer was promised: that is the
  # fact that makes this deal's standing what it is.
  answer: [pricing_call]
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
  rubric: >
    Score whether the briefing tells the truth about this deal, section by
    section. "story" must say that a revised offer covering the two extra
    depots was promised on the call and has not been sent — not that the deal
    is progressing, and not a restatement of its name and value. "blocker"
    must name the unsent offer as the thing holding it up; "no contact for N
    days" alone scores low, because elapsed time is not something a reader can
    act on. "buyer" must read what Nordwind is after from their own words —
    the two extra depots, the revised pricing — and score low if it invents a
    motive the summary never states. "verdict" should be blocked or drifting
    with reasoning naming the unsent offer; live scores low. "move_reason"
    must explain the given move rather than proposing a different one. Any
    invented person, meeting, discount or figure fails the scenario.
