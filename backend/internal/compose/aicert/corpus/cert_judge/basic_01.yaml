name: grades_a_well_grounded_answer_highly
task: cert_judge
site: judge
source: hand_authored
sanitized_by: hand_authored/claude-fable-5
fixture:
  rubric: |
    Score whether the summary point is actually supported by the cited
    activity and introduces no fact the activity does not state.
  product_rules: |
    Summarise the deal's recent activity as short points. Cite the id of every
    activity a point rests on, and state nothing the activity does not say.
  scenario_input: |
    Deal: {"id":"deal_9"}. Activity [act_1]: "Customer confirmed the Q3 budget
    is approved for this project."
  expected_answer: '{"summary_points":[{"text":"The customer confirmed the Q3 budget is approved.","source_ids":["act_1"]}]}'
  candidate_output: '{"summary_points":[{"text":"Customer confirmed Q3 budget is approved.","source_ids":["act_1"],"confidence":0.9}],"overall_confidence":0.9}'
expect:
  outcome: accepted
  answer:
    min: 80
    max: 100
  judge: none
  judge_none_reason: >
    The output graded is itself a grade, and a grader is certified by its score
    landing in the calibrated range, which the check requires. Its one-sentence
    reason is never read by the rule, and grading a grader with a grader would
    be circular.
