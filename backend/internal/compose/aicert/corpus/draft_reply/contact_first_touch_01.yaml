name: contact_first_touch_in_german
task: draft_reply
site: contact
source: hand_authored
sanitized_by: hand_authored/claude-fable-5
# The contact composer's hardest case: a contact nobody has written to yet, at a
# German employer. Every reflex a drafter has here is wrong — there is no thread
# to reply to, no earlier conversation to follow up on, and no reason for the
# draft to be in English.
fixture:
  envelope:
    output_language: de
    conversation_state: none
    now: 2026-08-11T09:00:00Z
    sender_name: Anna Krüger
    sender_email: anna.krueger@example.com
  # The envelope names the sender but never her company, so the rep's intent is
  # the only place "who is writing and why" can come from.
  intent: >-
    Mich kurz vorstellen – Anna Krüger von Nordlicht Software, wir bauen
    Software für die Angebotserstellung im Maschinenbau – und ein Gespräch dazu
    anbieten.
  recipient:
    id: 2f1c9d84-6b3a-4e17-9d52-8a4f1c0e7b93
    name: Marek Janetzke
    first_name: Marek
    # Production's fold always sends the surname (contactdraft.surname), and
    # the default "Sie" register needs it for the formal greeting.
    last_name: Janetzke
    title: Leiter IT
    employer: Beispiel Maschinenbau GmbH
    email: m.janetzke@example.com
expect:
  outcome: accepted
  answer: written
  rubric: >
    A first message, in German, to somebody nobody on this side has written to.
    The only facts supplied are the recipient's name, title and employer, and
    the caller's intent: Anna Krüger, of Nordlicht Software, which builds
    software for quoting in mechanical engineering, would like a conversation.

    Full marks (100): a short German message that says only what the intent
    says — who is writing, from which company, what that company builds — and
    asks for one conversation.

    Floor (40 or below), each on its own: an English draft; a subject or body
    implying an earlier exchange ("Nachfassen", "Follow-up", "Re:", "AW:",
    something "we discussed"); anything added to what our side does — a
    product name, a benefit such as "effizienter", a "Lösung", a price, a date,
    a mutual contact — or a problem the recipient's company is said to have.

    Deduction: -20 when the body never names Anna Krüger, because the intent is
    to introduce her.

    Correct, never a fault: any greeting the product rules allow; naming
    Beispiel Maschinenbau GmbH in the subject; restating the intent's own
    description of Nordlicht Software in different words.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
