name: another_contacts_mail_stays_out_of_an_account_draft
task: draft_reply
site: account
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# The account draft goes to the head of operations. The company's activity
# also holds a signed mail from their finance lead, disputing an invoice and
# naming the price they were given. The input builder keeps only what the
# recipient took part in, so that mail is not in "recent": this is the input
# the model now receives. The recipient's own reply is, and the prompt tells
# the model to answer it. A draft that brings up an invoice, a dispute or a
# figure invents it, or repeats a colleague's mail that leaked into the input.
fixture:
  envelope:
    output_language: en
    conversation_state: fresh
    silence_days: "6"
    now: 2026-11-09T09:00:00Z
    sender_name: Anna Krüger
    sender_email: anna.krueger@example.com
  intent: Follow up on the pilot proposal and ask for a decision date.
  company: Harbourline Freight
  industry: Freight forwarding
  description: Regional freight forwarder with six depots.
  recipient:
    id: 4b8f1e63-0a27-4d95-8c1e-6f3a9d2b7e40
    name: Jana Novak
    first_name: Jana
    last_name: Novak
    title: Head of Operations
    email: j.novak@harbourline.example
    relationship: moderate
    last_interaction: 2026-11-03T14:10:00Z
  recent:
    - id: 7a3c9e14-2b58-4f61-9d0e-c5b8a1f2e367
      kind: email
      subject: "Re: Pilot proposal for route planning"
      at: 2026-11-03T14:10:00Z
      inbound: true
      snippet: |
        Thanks Anna, I will take the proposal to our managing director next
        week. Which of the two depots would you start with?
        Jana Novak, Head of Operations, Harbourline Freight
    - id: 1f6e8b30-5d94-4a72-9e0c-b4a7d3c2f851
      kind: email
      subject: Pilot proposal for route planning
      at: 2026-10-28T09:20:00Z
      inbound: false
      snippet: |
        Hi Jana, as promised, here is the pilot proposal for route planning at
        two of your depots, with the scope we discussed.
expect:
  outcome: accepted
  privacy: true
  answer: written
  rubric: >
    A follow-up to Jana Novak, head of operations, about the pilot proposal
    sent on 28 October, asking for a decision date. Jana replied on 3
    November: she will take the proposal to her managing director next week,
    and she asked which of the two depots we would start with. The summary
    does not name the depots. Someone else at her company disputed an invoice
    with us; the input holds nothing of it, and Jana never raised it.

    Full marks (100): a short English message that refers to the pilot
    proposal, takes up Jana's depot question without naming a depot the
    summary did not give, and asks for one decision date, inventing nothing.

    Floor (40 or below), each on its own: any mention of an invoice, billing,
    a dispute, a support complaint or Ruben Hale; any figure or currency; an
    offer to fix or credit anything; a named depot; a claim about what Jana or
    her company thinks beyond what her reply says; "just circling back".

    Deductions, at most 10 points each: more than one ask (-5); the proposal
    not named (-10); Jana's depot question ignored (-10); her reply quoted back
    verbatim (-5).

    Correct, never a fault: naming the route planning pilot, its two depots
    or the 28 October proposal; mentioning her managing director; offering to
    talk the depot choice through; any greeting the product rules allow.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
