name: replying_to_a_thread_eight_months_old
task: draft_reply
site: reply
source: hand_authored
sanitized_by: hand_authored/claude-fable-5
# Before the envelope, a drafter was handed timestamps and no "now", so two days
# and eight months looked the same to it. This is the case that separates them:
# the message being answered is from last December, and every reflex phrase a
# drafter reaches for ("just circling back", "as discussed") is false here.
fixture:
  activity:
    output_language: en
    conversation_state: months
    silence_days: "241"
    now: 2026-08-11T09:00:00Z
    sender_name: Anna Krüger
    sender_email: anna.krueger@example.com
    thread: inbound_mail
    recipient: Priya
    subject: Integration timeline
    body: |
      Thanks for the walkthrough. We are going to look at this again once the
      budget round closes — I will come back to you when I know more.
    intent: Reopen the conversation and find out whether the project is still live.
  voice: null
expect:
  outcome: accepted
  answer: plain
  rubric: >
    The message being answered is 241 days old; the draft is written BY Anna
    Krüger TO Priya, as though eight months have passed, because they have.

    Full marks (100): the draft says in one plain clause that time has passed,
    names what the earlier exchange was about in its own words, and asks
    whether the project is still live.

    Floor (40 or below), each on its own: it greets or signs off to Anna rather
    than Priya; it gestures at the exchange without naming it ("just circling
    back", "as discussed", "as promised", "our conversation"); or it asserts
    what has happened since — that the budget round closed, that the project
    moved — none of which is in the supplied data.

    Naming is correct, never a fault: "since we last spoke about the
    integration timeline", the walkthrough, and their plan to revisit after the
    budget round all name the exchange.

    Deductions, at most 10 points each: an apology for the gap longer than a
    clause (-10); a wellbeing opener (-10); a question that needs the history
    reconstructed before it can be answered (-5).
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
