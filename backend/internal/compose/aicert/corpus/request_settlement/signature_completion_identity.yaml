name: signature_completion_requires_the_matching_document
task: request_settlement
site: request_settle
source: hand_authored
sanitized_by: hand_authored
fixture:
  - messages:
      - direction: inbound
        subject: Signature requested
        body: Please sign envelope ALPHA-104, the services agreement.
      - direction: inbound
        subject: Signature completed
        body: Envelope ALPHA-104 is fully signed by all required parties. Your signing is complete.
  - messages:
      - direction: inbound
        subject: Signature requested
        body: Please sign the services agreement.
      - direction: inbound
        subject: Signature completed
        body: A services agreement has been signed.
  - messages:
      - direction: inbound
        subject: Signature requested
        body: Please sign envelope ALPHA-104, the services agreement.
      - direction: inbound
        subject: Signature progress
        body: The other signer has signed envelope ALPHA-104. Your signature is still required.
expect:
  outcome: accepted
  answer:
    - verdict: settled
    - verdict: unsure
    - verdict: still_owed
      remaining_names: ALPHA-104|services agreement
  judge: none
  judge_none_reason: >
    The answer is one closed verdict per conversation, and the check fails any
    other verdict and a still_owed that does not name the envelope or the
    agreement. Only the first request is settled: the second names no
    document, and the third leaves our signature outstanding.
