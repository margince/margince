name: an_answer_off_the_thread_settles_a_request
task: request_settlement
site: request_settle
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# Requests are often answered somewhere other than the thread they arrived on:
# a meeting that took place, or a new mail of ours with the same subject. The
# evidence read hands these to the model as answers from outside the thread.
#
# The first is the shape that kept requests owed for days: a customer asked to
# talk, the meeting happened, and nobody wrote back on the thread because there
# was nothing left to write. The second delivers what was asked in a fresh mail
# rather than a reply.
fixture:
  - messages:
      - direction: inbound
        subject: 'Rollout next quarter'
        body: |
          Hi, could we find thirty minutes next week to talk through the
          rollout plan? Any afternoon works for me.
      - direction: outbound
        off_thread: meeting
        subject: 'Rollout planning'
        body: |
          Walked through the rollout with Anna. Agreed a phased start in
          November, beginning with the Hamburg team.
  - messages:
      - direction: inbound
        subject: 'Unterschriebene NDA'
        body: |
          Hallo, könnt ihr uns die unterschriebene NDA zurückschicken? Unsere
          Rechtsabteilung wartet darauf.
      - direction: outbound
        off_thread: email
        subject: 'Unterschriebene NDA'
        body: |
          Hallo Frau Weber, anbei die unterschriebene NDA als PDF.
expect:
  outcome: accepted
  answer:
    - verdict: settled
    - verdict: settled
  judge: none
  judge_none_reason: >
    The answer is one closed verdict per conversation, and the check fails any
    other verdict. The rubric only said both are settled and that still_owed
    or unsure, the shape this case exists to catch, scores at the floor.
