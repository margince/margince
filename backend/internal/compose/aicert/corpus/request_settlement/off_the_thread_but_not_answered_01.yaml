name: an_answer_off_the_thread_can_leave_the_request_owed
task: request_settlement
site: request_settle
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# The counterweight to the off-thread settle case. A call or a meeting with the
# customer is not an answer to every ask they made: the notes decide, and a call
# whose notes promise a next step leaves it owed.
#
# A meeting whose notes are about other matters is deliberately not a case here.
# Certified models split on it between still_owed and unsure whatever the prompt
# says, and both leave the request owed, so it measured a coin flip.
fixture:
  - messages:
      - direction: inbound
        subject: 'Pricing for 50 seats'
        body: |
          Could you send us pricing for 50 seats? We need it for the budget
          round at the end of the month.
      - direction: outbound
        off_thread: call
        subject: 'Call with Jan'
        body: |
          Spoke with Jan about the 50-seat pricing. I will send the quote by
          Friday once finance confirms the volume discount.
expect:
  outcome: accepted
  answer:
    - verdict: still_owed
      remaining_names: quote|pricing|price
  rubric: >
    The conversation is still_owed. The call notes say we will send the quote by
    Friday: the ask was discussed, and our own words name a next move we have
    not made. The remaining phrase must name the quote or the pricing, from our
    own seat.
    Score high for still_owed naming the quote. A model that settles it because
    a call happened is treating contact as an answer, which closes work nobody
    did, and should score at the floor. Answering unsure keeps the request owed
    but ignores a deferral the notes state plainly, and should score in the
    middle.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
