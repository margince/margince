name: declining_settles_a_request_and_so_does_handing_it_to_a_named_colleague
task: request_settlement
site: request_settle
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# Settled does not mean "we did what they asked". It means nothing is left on
# our desk, and the two ways that happens without delivering anything are
# declining and handing the ask to somebody named.
#
# The second shape is the one a rule written around "did we deliver it" gets
# wrong: the reply delivers nothing at all, and still nobody here owes a thing.
fixture:
  - messages:
      - direction: inbound
        subject: 'Invitation to join the panel'
        body: |
          We would be delighted to have you on the panel for the November
          session. Would you be able to join us?
      - direction: outbound
        subject: 'Re: Invitation to join the panel'
        body: |
          Thank you so much for thinking of me. Sadly I will be in Europe those
          days, so I have to pass this time. Let me introduce Rich Pham, who has
          been building the practice with me and would be a better guest for this
          topic anyway.
  - messages:
      - direction: inbound
        subject: 'Zugang zum Testsystem'
        body: |
          Können Sie uns zwei Zugänge zum Testsystem einrichten? Die Kollegen
          wollen nächste Woche anfangen.
      - direction: outbound
        subject: 'Re: Zugang zum Testsystem'
        body: |
          Klar. Ich habe die beiden Zugänge gerade angelegt, die
          Einladungsmails sind unterwegs.
expect:
  outcome: accepted
  answer:
    - verdict: settled
    - verdict: settled
  judge: none
  judge_none_reason: >
    The answer is one closed verdict per conversation, and the check fails any
    other verdict. The rubric only said both are settled and that still_owed,
    the reading of a decline this case exists to catch, scores at the floor.
