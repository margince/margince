name: a_declined_invitation_waits_on_nobody
task: owed_verdict
site: owed
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# A contact declining our invitation sends a mail with only the text their
# calendar generated. The calendar has already recorded the answer, so nobody
# waits on a reply from us.
fixture:
  - subject: 'Declined: Demo @ Thu 15:00 - 15:30 (CEST)'
    body: |
      Jonas Weber has declined this invitation.

      Demo
      Thursday 15:00 - 15:30 (Central European Summer Time)
    to: ['lars@ourco.test']
    has_calendar_part: true
    calendar_method: REPLY
expect:
  outcome: accepted
  answer: [informs_us]
  judge: none
  judge_none_reason: >
    The answer is one closed verdict per message, and the check requires every
    verdict exactly. The rubric only ranked the wrong answers, which the check
    fails outright.
