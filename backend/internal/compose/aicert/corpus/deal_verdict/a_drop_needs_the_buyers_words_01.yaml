  deal:
    name: "Cold storage monitoring"
    stage: "Proposal sent"
    amount: 42000
    currency: EUR
    close_date: "2026-12-18"
    probability: 50
  activities:
    - kind: email
      direction: inbound
      at: "2026-10-22"
      subject: "Re: Offer for cold storage monitoring"
      body: |
        Thanks for the offer. Could you name a reference customer in food
        logistics we could call?
    - kind: email
      direction: outbound
      at: "2026-10-23"
      subject: "Re: Offer for cold storage monitoring"
      body: |
        Hi Lena, happy to. Fresko Foods agreed to take a call; I will send you
        the contact details today.
    - kind: note
      direction: outbound
      at: "2026-11-03"
      subject: "Gut feeling"
      body: |
        No answer since the reference. I feel this one is slipping, they
        probably went with someone cheaper.
expect:
