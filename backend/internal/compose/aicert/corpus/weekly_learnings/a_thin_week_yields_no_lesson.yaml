name: a_week_that_invites_a_lesson_it_cannot_support_yields_none
task: weekly_learnings
site: learn
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# THE CASE THIS SITE EXISTS FOR. Three rows clears the floor, so the request is
# really made — and then there is nothing in them that supports a claim about
# cause. One deal won, one lost, one moved, no pattern between them.
#
# A model will happily explain why the won one was won. That explanation is the
# defect: a rep would act on it, and it rests on a single event that could as
# easily have gone the other way. Declining is the right answer, and this case
# scores it as correct rather than as a failure to produce.
fixture:
  week_start: "2026-07-06"
  counts:
    tasks_due: 3
    tasks_done: 2
    tasks_carried_over: 1
    deals_moved: 3
    deals_won: 1
    deals_lost: 1
    commitments_due: 1
    commitments_kept: 1
    meetings_held: 1
    leads_routed: 0
  deals:
    - id: "01a05500-0000-7000-8000-0000000000d1"
      label: "Nordwind expansion"
      outcome: "won"
    - id: "01a05500-0000-7000-8000-0000000000d2"
      label: "Weber Rahmenvertrag"
      outcome: "lost"
    - id: "01a05500-0000-7000-8000-0000000000d3"
      label: "Stahlbau Krämer"
      outcome: "moved"
expect:
  outcome: accepted
  answer:
    must_abstain: true
  bands: { certified_min: 70, degraded_min: 50, floor: 40 }
  rubric: >
    Returning no learnings is the correct answer. One deal won, one lost and one
    moved, with nothing recorded about why any went the way it did, supports no
    claim about what works. A reply that explains the win, or that offers "follow up
    faster" as a lesson, is wrong: the first is a coincidence with prose around
    it and the second is advice the week did not produce.
