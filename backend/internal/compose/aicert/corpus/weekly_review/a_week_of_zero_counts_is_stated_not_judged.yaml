name: a_week_of_zero_counts_is_stated_not_called_quiet
task: weekly_review
site: narrative
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
fixture:
  week_start: "2026-07-20"
  counts:
    tasks_due: 0
    tasks_done: 0
    tasks_carried_over: 0
    deals_moved: 0
    deals_won: 0
    deals_lost: 0
    proposals_accepted: 0
    proposals_rejected: 0
    brief_items_acted: 0
    brief_items_dismissed: 0
  deals: []
expect:
  outcome: accepted
  answer:
    must_mention: []
    # Every count is zero, so the product serves the quiet-week rule: zero
    # counts prove neither a quiet week nor a safe forecast. The failures are
    # claiming either, and inventing significance to fill the space.
    must_not_mention:
      ["quiet", "nothing happened", "nothing slipped", "breakthrough",
       "momentum", "productive", "busy", "great week"]
  bands: { certified_min: 70, degraded_min: 50, floor: 40 }
  rubric: >
    Every count is zero and no deal is listed. The right answer states the
    zero counts plainly, in one or two sentences. Saying that no tasks, deals
    or meetings were recorded IS stating the counts, and is right. Calling the
    week quiet, or saying nothing happened, no progress was made, nothing
    slipped or the forecast is safe, draws from the counts what they cannot
    show and is wrong. Inventing activity, a deal, a number
    or a reason the summary does not carry scores at the floor. Dressing the
    week up as productive, advising the rep what to do next, or congratulating
    or consoling them breaks the product's "state it" rule and caps the score
    at degraded.
