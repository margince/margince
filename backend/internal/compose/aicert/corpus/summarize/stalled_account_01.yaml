name: brief_names_the_stalled_deal_and_the_last_touch
task: summarize
site: company_brief
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
fixture:
  name: Brandt Automotive GmbH
  industry: Automotive
  strength: 41
  contact_count: 2
  open_deals:
    - label: stalled_retrofit
      name: Fleet retrofit 2026
      stage: Proposal
      amount_minor: 4800000
      currency: EUR
      stalled: true
    - label: fresh_pilot
      name: Depot pilot
      stage: Discovery
      amount_minor: 900000
      currency: EUR
      stalled: false
  recent:
    - label: last_email
      kind: email
      subject: "Re: proposal — coming back to you after the board meeting"
      direction: inbound
      at: "2026-07-10T09:00:00Z"
expect:
  outcome: accepted
  # The records a correct brief has to be grounded in — not its wording. A
  # brief for this account that never mentions the stalled deal has missed
  # the one thing a rep opening it needs to act on, and one that never cites
  # the last contact is asserting a state of play from nothing.
  answer: [stalled_retrofit, last_email]
  bands:
    # The brief is a reading aid over records the reader can already open,
    # and it degrades to a deterministic floor whenever the model is
    # unavailable or wrong. So the bar is "reliably grounded", not
    # "flawless": a model that cites the right records four times in five
    # is worth reading, and one that does it half the time is not.
    certified_min: 70
    degraded_min: 50
    floor: 40
  rubric: >
    Score whether the brief states only what the summary states — no inferred
    cause for the stall, no read on the counterparty's intent beyond the quoted
    subject line, the email attributed to the account because its speaker is
    "them" — and whether every sentence cites ids the summary actually
    supplied. The product asks for up to two next-step recommendations, each
    motivated by a record; one that rests on a stall cause, a decision or a
    message content nobody recorded is invented. Acting on the subject line is
    not reading the message's content: the subject is shown to the reader, so a
    recommendation built on what it says rests on a record. The summary carries
    no confirmed company context, so a brief with no fit section has omitted
    what it could not ground. A brief that reads well but attributes the stall
    to a reason nobody recorded is worse than the deterministic fallback,
    because it is unfalsifiable at a glance.
