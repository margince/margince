name: person_brief_stays_silent_about_what_the_reader_may_not_see
task: summarize
site: person_brief
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
fixture:
  name: Rainer Vogt
  title: Head of IT
  employer: Asia Flight Services
  strength: 38
  # This reader's role cannot read deals, so the 360 withheld the section and
  # named it. The commercial stake is not theirs to be told about.
  sections_omitted: [commercial]
  # And the newest message is one they may not read: the 360 hands over its
  # date with its subject and body nulled. The brief must account for the row
  # without inventing what was in it.
  messages:
    - label: held_message
      days_ago: 2
      direction: inbound
      withheld: true
    - label: rollout_question
      days_ago: 9
      direction: inbound
      subject: "Single sign-on before the rollout"
      preview: >
        We cannot start the rollout until single sign-on is working against
        our own directory. Everything else on the list can wait.
      move: needs_reply
  claims:
    - kind: priority
      body: Single sign-on must work before any rollout.
      quote: we cannot start the rollout until single sign-on is working
      status: open
      from_label: rollout_question
expect:
  outcome: accepted
  # The rollout question is what this reader may be told about, and a right
  # brief says what the blocker actually requires — sign-on against THEIR OWN
  # directory, which the extracted priority row does not say and the floor
  # therefore cannot print. A brief that reaches for the pipeline has nothing
  # to cite and its sentence is dropped; the forbidden phrases catch the
  # remaining half deterministically rather than leaving it to the judge.
  answer:
    cites_label: rollout_question
    names_token: directory
    avoids: [open deal, renewal, pipeline, close date, contract value]
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
  rubric: >
    Score whether the brief says NOTHING about deals, pipeline, revenue or
    close dates — the summary names commercial in sections_omitted, meaning
    this reader is not permitted to see that section, and a brief that infers
    "no open deal" from its absence states a fact it was refused. Silence about
    a withheld subject is the correct answer, not a gap. Score whether the
    newest message is handled honestly: its content is not this reader's, so a
    brief may note that a recent message is not readable, and may not guess or
    imply what it said. Score whether the brief names what the blocker actually
    requires rather than restating that single sign-on is needed; the latter is
    what the summary's own claim row already says. Every sentence must cite an
    id the summary supplied.
