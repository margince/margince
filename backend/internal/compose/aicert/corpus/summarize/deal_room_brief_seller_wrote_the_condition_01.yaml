  answer:
    cites_label: dashboards
    names_token: dashboards
    # The refusal is the seller's own. A brief attributing it to the buyer has
    # reported your side's words as theirs.
    avoids: ["marta cannot", "the buyer cannot", "buyer will not countersign"]
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
  rubric: >
    Score whether the brief reports the threads still waiting, including the
