# Condition-like wording written by the seller. The brief reports what the
# BUYER is waiting on, so the seller's own terms are not a blocker on the
# seller, and reporting them as the buyer's is putting words in their mouth.
fixture:
  title: Warehouse analytics pilot
  state: live
  buyers:
    - label: marta
      name: Marta Ilves
      signed_in: true
      last_seen_on: "2026-10-23"
  documents:
    - label: msa
      title: MSA
      group: legal
  # Three threads wait, so the floor quotes the two newest and the oldest is
  # the model's contribution. The seller's own refusal sits in the newest.
  threads:
    - label: pilotscope
      comments:
        - speaker: buyer
          author: Marta Ilves
          "on": "2026-10-22"
          body: How many sites does the pilot cover in the first month?
    - label: dashboards
      comments:
        - speaker: buyer
          author: Marta Ilves
          "on": "2026-10-20"
          body: Can we rename the dashboards before the pilot opens?
    - label: indemnity
      document_label: msa
      comments:
        - speaker: your_side
          author: Demo Admin
          "on": "2026-10-21"
          body: >
            We cannot countersign the MSA until your legal team accepts the
            mutual indemnity in clause 9.
        - speaker: buyer
          author: Marta Ilves
          "on": "2026-10-23"
          body: Our counsel is reading clause 9 this week and will come back.
expect:
