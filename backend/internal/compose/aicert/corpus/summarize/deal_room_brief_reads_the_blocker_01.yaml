expect:
  outcome: accepted
  answer:
    cites_label: cap
    names_token: liability
  bands:
    # The floor quotes the two newest waiting threads and is useful alone, so
    # the bar is reading the blocker reliably, not flawlessly.
    certified_min: 70
    degraded_min: 50
    floor: 40
  rubric: >
    Score whether the brief leads with what blocks this deal — the buyer's
    unanswered objection to the liability cap on the MSA redline — rather than
    with the newest message, a request to resend a file. Score whether it says
    what the objection is in the buyer's terms, and whether it notices that a
    buyer asked for a new link. Penalise any date the summary did not supply,
    and any words from your side reported as a buyer's.
