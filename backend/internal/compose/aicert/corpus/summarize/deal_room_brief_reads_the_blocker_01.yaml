  # Three threads wait on the reader. The two newest are small asks; the
  # oldest is the one legal sign-off turns on, and the floor only counts it,
  # so naming what it says is the model's contribution.
  threads:
    - label: resend
      document_label: order_form
      comments:
        - speaker: buyer
          author: Lena Vogt
          "on": "2026-10-22"
          body: Could you resend the order form? The link still shows the old version.
    - label: kickoff
      comments:
        - speaker: buyer
          author: Lena Vogt
          "on": "2026-10-21"
          body: Who from your side joins the kickoff call?
    - label: cap
      document_label: msa
      comments:
        - speaker: buyer
          author: Tomas Petrauskas
          "on": "2026-10-20"
          body: >
            Clause 11.2 caps liability at fees paid. Our legal team will not
            sign until the cap is twelve months of fees.
    - label: workflows
      document_label: proposal
      resolved: true
      comments:
        - speaker: your_side
          author: Demo Admin
          "on": "2026-10-18"
          body: Section 4 has the three workflows we scoped on the call.
        - speaker: buyer
          author: Lena Vogt
          "on": "2026-10-19"
