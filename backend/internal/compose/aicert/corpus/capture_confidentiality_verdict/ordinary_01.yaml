name: an_ordinary_customer_thread_is_opened_for_the_team
task: capture_confidentiality_verdict
site: thread
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
fixture:
  subject: Nachbestellung Paletten KW38
  attachments: []
  body: |
    Hallo Frau Keller,

    wir brauchen für KW38 nochmal 12 Paletten der gleichen Ausführung wie im
    Juli. Passt der Preis von damals noch? Liefertermin idealerweise Dienstag.

    Viele Grüße
    Martin Oswald
    Einkauf, Nordwind Logistik
expect:
  outcome: accepted
  answer: ordinary
  rubric: >
    Routine trade: a reorder, a price question, a delivery date, signed by a
    named buyer at a company. This is exactly what colleagues are meant to see,
    and holding it is what makes a classified mailbox feel broken — the CRM
    captures the mail and then shows the team nothing. "ordinary" scores high.
    Any holding kind is wrong here but wrong in the SAFE direction: the thread
    stays private and somebody clicks once to share it, so those score in the
    middle rather than at zero. The failure this case exists to catch is a
    classifier so cautious that nothing is ever opened.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
