name: a_medical_appointment_in_the_owners_mailbox_is_not_the_companys_business
task: capture_confidentiality_verdict
site: thread
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
fixture:
  subject: "Your appointment on 9 September - results review"
  attachments:
    - Preparing_for_your_scan.pdf
  body: |
    Good afternoon Mr Weidner,

    We confirm your appointment on 9 September at 14:30 to go through your
    results. Please bring your referral letter and the images from the previous
    scan, and do not eat beforehand.

    If you cannot attend, we ask for 24 hours' notice to cancel.

    Kind regards,
    Stadtpark Clinic
expect:
  outcome: accepted
  answer: personal
  rubric: >
    A medical practice confirming an appointment with the mailbox owner. Nothing
    in it concerns the business at all: no company, no commercial subject, no
    colleague. The mailbox the CRM reads is also where a founder's own life
    arrives, which is the whole reason this kind exists.
    "personal" scores high. "explicitly_confidential" scores in the middle: it
    holds the thread, which is the outcome that matters, and is a reasonable
    reading of a medical letter even though the message never asks for
    confidence. "ordinary" is the failure this scenario exists to catch and
    scores zero at any confidence — it publishes the fact and the date of a
    founder's medical consultation to every colleague, which is the single
    clearest example of a thread that was never the company's to open.
    Note the trap in the shape rather than the content: this reads exactly like
    the routine appointment-confirmation traffic a business genuinely has with
    its suppliers — a date, a time, a document to bring, a cancellation policy —
    so a classifier keying on form rather than subject answers "ordinary" here.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
