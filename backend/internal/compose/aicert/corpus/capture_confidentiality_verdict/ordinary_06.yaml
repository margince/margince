name: a_chinese_supplier_invoice_opens_the_thread
task: capture_confidentiality_verdict
site: thread
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# The opening side of the Chinese salary-sheet case: an invoice that bills a
# service and names no one's pay. A model that holds every mail in a language
# it reads less well fails here.
fixture:
  subject: "发票 2026-0318 - 三月托管服务"
  attachments:
    - 明光云 发票 2026-0318.pdf
  body: |
    财务部您好，

    附件是三月份托管服务的发票 2026-0318，付款条件不变，30 天内付款。

    明光云 账务部
  documents:
    - name: 明光云 发票 2026-0318.pdf
      excerpt: |
        发票 2026-0318
        明光云计算有限公司 致 远航科技有限公司
        生产集群托管服务，2026年3月 | 8,600.00 元
        备份存储，2 TB | 1,000.00 元
        不含税 9,600.00 元，增值税 6% 576.00 元，合计 10,176.00 元
expect:
  outcome: accepted
  answer: ordinary
  judge: none
  judge_none_reason: >
    The answer is one closed kind, and the check requires it exactly. The
    document bills a hosting service to the company and names no one's pay,
    so only "ordinary" fits it.
