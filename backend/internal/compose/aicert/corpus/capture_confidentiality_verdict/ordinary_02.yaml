    Enjoy the weekend!
    JK
expect:
  outcome: accepted
  answer: ordinary
  rubric: >
    A prospect saying a deal is progressing, which is the most ordinary thing a
    sales mailbox holds. The trap is one noun: "I have the NDA".
    Mentioning an NDA is not asking for confidence. An NDA is a routine
    agreement between two COMPANIES — signed by the company, not by a person —
    and the fact that one exists is not itself a secret; the material it covers
    might be, and none is here. Nothing in this mail asks for anything to be
    kept close: no marking, no "please don't forward", no small circle. It says
    a document is in hand and will be used later, alongside a CTO's name and a
    declined introduction.
    "ordinary" scores high. "explicitly_confidential" is the failure this case
    exists to catch and scores zero at any confidence: it is what the shipped
    prompt returned on this exact thread, because the kind's description listed
    "an NDA" as a bare noun and the model correctly followed a wrong
    instruction. The cost is not one click — a whole account's correspondence
    disappeared from the team that sells it, and the drawer named no reason, so
    nobody could see a verdict had been made at all.
    Other holding kinds score in the middle rather than zero: they are wrong in
    the safe direction. But this scenario is about the direction that is NOT
    safe here, because a CRM that hides ordinary deal traffic from the people
    working the deal has stopped being a CRM.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
