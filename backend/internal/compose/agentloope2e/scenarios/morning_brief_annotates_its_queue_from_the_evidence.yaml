name: morning_brief_annotates_its_queue_from_the_evidence
agent: morning_brief
worklist: [heat_recovery_retrofit, boiler_room_controls]
criteria:
  - Does the finding for Heat Recovery Retrofit say the customer's CFO signs off on Thursday and asks for the final quote with the two-year service option by Wednesday?
  - Does the finding for Heat Recovery Retrofit give sending that quote by Wednesday as the next move?
  - Does the finding for Boiler Room Controls say a discovery call asked for a site visit and no date is agreed?
  - Does the finding for Boiler Room Controls make getting that site visit scheduled its next move, where asking the facility manager to set or confirm a date counts?
  - Is every fact in the findings one the seeded records carry, with no invented price change, meeting or competitor?
seed:
  deals:
    - name: heat_recovery_retrofit
      activities:
        - days_ago: 1
          subject: "Re: retrofit proposal"
          body: "Thanks for the revised proposal. Our CFO signs off on Thursday; please send the final quote with the two-year service option by Wednesday."
    - name: boiler_room_controls
      activities:
        - days_ago: 12
          subject: Discovery call
          body: "Facility manager interested; wants a site visit before any proposal. No date agreed."
