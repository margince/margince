name: overnight_sweep_logs_one_note_per_slipping_deal
agent: overnight_at_risk_sweep
worklist: [pump_station_retrofit, office_hvac_service]
criteria:
  - Does the note on Pump Station Retrofit name that the deal has had no recorded activity for about four weeks?
  - Does the note on Office HVAC Service name that the deal has had no recorded activity for nearly three weeks?
  - Does each note cite the record or field it rests on?
  - Is every cause in the notes one the seeded records carry, with no invented lost champion, competitor or price dispute?
  - Does no note tell anyone to advance a stage, send a message or archive a deal?
