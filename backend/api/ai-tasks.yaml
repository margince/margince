# ai-tasks.yaml — the AI task contract (spec §1.2, ai-operational-spec.md).
#
# Authority relationship (ratified: this repository's AI runtime contract +
# certification arc): THIS file is the normative authority for the AI task
# DECLARATION — the task list, its tiers, each task's fallback ladder, execution
# mode (interactive | background), budget-exhaustion posture (degrade | queue),
# and (ADR-0074) whether the task ships at all, its named invocation sites, its
# payload-capture posture, its company-context policy, and which cost-unit rule
# prices it. The build repo's copy
# (backend/api/ai-tasks.yaml) must match it verbatim; the build's
# tools/gen-aitasks compiles that copy into the binary (tasks_gen.go) behind a
# drift gate, the same mechanism crm.yaml already uses for the HTTP contract.
# Tier→model binding (which concrete provider/model serves local_small /
# cheap_cloud / premium / frontier / local_large) stays a per-deployment config
# (config/ai-routing.yaml, §1.4) — editing THAT never requires a rebuild.
# Editing the ladders/posture below is a routing-POLICY change: it requires a
# spec update here, the mirrored edit in the build repo, `make gen`, and a
# rebuild — never a silent code diff.
# Closed pairing invariant: interactive tasks use `degrade`; background tasks
# use `queue`. Here `queue` means "return a typed budget deferral to the task's
# existing durable carrier" — the router never creates an unowned generic job.
# Deferral makes no provider call and does not consume a worker attempt.
#
# ADR-0074 fields, and what each is for:
#
#   status            shipped | planned. A `planned` task is declared but has no
#                     implementation: no site, no corpus scenario, no
#                     certification record. This is what stops an unimplemented
#                     task presenting as certified.
#   sites             the named model-invocation sites the build registers for
#                     this task. A task is NOT one prompt: rate_extract has
#                     always had two (pricing, fx), cold_start has four. A bare
#                     name defaults to kind `one_shot`; a mapping declares a
#                     different kind.
#   kind              one_shot | multi_turn | agent_loop — how the site invokes
#                     the model. `agent_loop` is a cumulative, tool-fed window,
#                     NOT a request factory, and must not be described as one.
#   no_payload        content from this task must NEVER reach ai_call_payload,
#                     whatever the deployment's capture posture says. A parsed
#                     field, not a phrase in `doc:` — a sentence in a comment
#                     must not be load-bearing for a data-protection control.
#   company_context   the ADR-0065 policy: `none`, or scopes + token_budget
#                     (+ conditional, meaning "only when the caller requests
#                     it"). Absent-by-accident must be a build error, never a
#                     runtime one.
#   agents            for a task with an agent_loop site: the scheduled agents it
#                     runs, and the tools each one attaches. The tool listing
#                     rides in EVERY step of a tool-fed window, so this list is
#                     both what a run MAY call and what that run pays for in
#                     prompt — and only the agent's own goal knows which tools
#                     that is. It NARROWS and never grants: every call still
#                     passes the same admission gate against the same passport.
#                     Required and non-empty per agent, because an empty
#                     allowlist is read downstream as "no narrowing" and would
#                     silently hand the agent the whole catalog back.
#   cost_unit         the ADR-0067/0068 unit rule BY NAME. The arithmetic
#                     (observed-unit and denominator functions, the work-shape
#                     floor) is behaviour and stays in code; naming the rule
#                     here lets the build prove the mapping is total.
#
# Deliberately NOT declared here (ADR-0074): answer schemas — two sites build
# theirs per call (one varies its very shape) and four tasks send none at all,
# and the enums involved derive from crm.yaml's generated vocabulary, so
# declaring them would create a third unguarded copy of a vocabulary whose
# synchronisation is already known to be un-gateable. Also not declared: a
# required certification band — the certification lane is paid and BYOK-gated,
# so it reports release readiness (naming its provider/model binding) and never
# gates a merge.
#
# frontier sits one rung above premium: the strongest model a deployment is
# willing to pay for. No task ladder selects it — it is declared so an operator
# can bind one, and so a task that genuinely needs the top rung has a name to
# reach for without redefining what premium means for every other task.
tiers: [local_small, cheap_cloud, premium, frontier, local_large]

tasks:
  capture_classify:
    display_name: "Message classification"
    ladder: [local_small, cheap_cloud]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [classify]
    company_context: none
    cost_unit: per_message
    no_payload: true

  owed_verdict:
    display_name: "Unanswered-message triage"
    ladder: [local_small, cheap_cloud]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [owed]
    company_context: none
    no_payload: true
    doc: "Whether an unanswered inbound message actually asks its recipient side for something — asks_us or informs_us. The waiting queue can prove somebody wrote and nobody replied; it cannot tell a question from a report, a receipt or a monthly statement, which is most of what a rep wanted to know. Judged over what SURVIVES the queue's own rules rather than over all unjudged mail, so the pass costs one call per ten messages a rep would otherwise have read. The prompt carries the recipient line and whether a calendar part came with it, because a report sent to a desk address with the reader merely copied reads exactly like a direct request without them. Below the confidence floor after a solo re-ask the message stays UNJUDGED, and unjudged is a real answer: the queue ranks such a row exactly as it did before this pass existed, so there is never a reason to guess. A verdict may only DEMOTE a row within the queue — never delete, archive or hide one (ADR-0063 §3.2, the floor the capture label sits under). The reason is sharper here than there: this is one model call's opinion about a customer's mail, so being wrong has to cost a rep a scroll rather than a customer. No cost_unit, and the omission is a decision rather than a gap: cost_unit names a task the connect-time backfill prices, and this pass deliberately does not run at backfill. Its candidates are the LIVE waiting queue, so judging a mailbox's history would spend a call per message on years of mail nobody will ever be shown — the hourly pass reaches everything the queue can surface, and reaches it when a rep is actually looking at it."

  capture_counterparty_verdict:
    display_name: "First-time sender check"
    ladder: [local_small]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [verdict]
    no_payload: true
    company_context: none
    doc: "ADR-0072/A118: the ambiguous first-time-sender creation gate. Exactly one KIND per address from a closed vocabulary — person, role_mailbox, organization_sender, newsletter, transactional, spam, personal, advisor — each resolving to a real|noise lifecycle status. ASYMMETRIC floor: a CREATING answer (person, advisor) needs 0.85 and every other kind needs 0.7, because the two mistakes are not the same size — refusing a contact leaves the mail visible and the question answerable by a person, while creating one puts a record in a shared CRM. Below its floor → unsure, never noise. Two kinds create a contact and they differ in WHO can see it: `person` becomes an ordinary workspace contact, and `advisor` becomes an owner-scoped one — a founder's lawyer is a genuine contact whose existence is not the workspace's business. Every other kind creates none. The question is WHO WROTE, because the older yes/no gate grouped a person and a company under one `real` answer and so named a contact after the company that sent the mail. `unsure` is deliberately not answerable — abstention is derived from the floor, not self-reported, so a model cannot talk its way past it by claiming certainty about its own uncertainty. Release-blocking false-noise eval threshold. The no-payload posture is the `no_payload` field above (ADR-0074); it was formerly asserted in this prose and matched by substring. Local-only ladder: the prompt carries subject and body, and this is the task that decides whether a sender is personal — a cloud rung would send a founder's family mail off the machine to ask whether it was family mail."

  capture_confidentiality_verdict:
    display_name: "Thread confidentiality check"
    ladder: [local_small]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [thread]
    no_payload: true
    company_context: none
    doc: "Decides what one email THREAD is about, so a classified mailbox can open the ordinary ones instead of holding everything. Closed vocabulary; exactly one kind (ordinary) opens a thread and every other kind holds it, so a wrong answer, an outage and a budget stop all fail towards privacy. Asymmetric floor: an opening answer below 0.8 resolves to unsure, which holds; a holding answer needs no floor, because requiring confidence to hold would publish the threads the model found hardest. Local-only ladder for the same reason as the sender verdict: the prompt carries subject, body and attachment names, and this is the task that decides whether a thread is private."

  signal_extract:
    display_name: "Signal extraction"
    ladder: [cheap_cloud, premium]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [thread_events]
    company_context: none
    no_payload: true
    doc: "SIG-F-3: read the material events out of a settled thread — contract_ended, new_opportunity, commitment_made — each citing the message it came from. Floor 0.7; below it the event is dropped, never guessed. An event is an OBSERVATION and is written directly; what follows from one is a structural claim and stages for a human."

  transcript_propose:
    display_name: "Meeting follow-up extraction"
    ladder: [cheap_cloud, premium]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [next_steps]
    company_context: none
    doc: "S-E04.3 / MEET-AC-3/4: read the next steps and commitments out of a meeting transcript, each citing the 1-based transcript lines it was read from (ADR-0058). Floor 0.7; below it the proposal is dropped, never guessed, and a transcript stating none yields no proposal at all. Every proposal is a structural claim, so it STAGES for a human (approval kind transcript_proposal) and writes nothing until confirmed."

  propose_roles:
    display_name: "Buying-role reading"
    ladder: [cheap_cloud, premium]
    execution_mode: interactive
    on_budget_exhausted: degrade
    status: shipped
    sites: [committee]
    company_context: none
    doc: "Read the buying roles out of what a contact has actually written - who signs, who carries it inside, who can stop it. Floor 0.75, higher than enrich's 0.6 because a wrong role misdirects a whole deal while a wrong phone number is a typo. A job title is NEVER evidence: the contract says a role is recorded and never inferred from one, so a proposal citing only a title is dropped. Every proposal quotes the message it was read from, verbatim, and the person who WROTE that message must be the person the role is proposed for - both contacts sit in one prompt, so evidence unbound from its author lets one sender hand a role to a colleague they have never spoken for. Written DIRECTLY as a seat, attributed to agent:propose_roles and reversible, per the installation's auto-write posture; the evidence lives on the audit row so a reader can check it, and the ai_suggested mark stays until a human confirms. Degrade is the budget answer but there is no deterministic floor: with no lane the endpoint declares 501 rather than guessing a role from a title."

  enrich:
    display_name: "Signature enrichment"
    ladder: [local_small, cheap_cloud]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [signature]
    company_context: none
    cost_unit: per_person

  summarize:
    display_name: "Record summary"
    ladder: [cheap_cloud, premium]
    execution_mode: interactive
    on_budget_exhausted: degrade
    status: shipped
    sites: [org_brief, org_ask, org_dossier, meeting_plan]
    company_context: {scopes: [identity], token_budget: 300, conditional: true}
    doc: "Four grounded-prose sites, all over what the VIEWER can already see, assembled per viewer because visibility is per viewer. org_brief — the standing account brief: what this account is, where it stands, what changed. Its operation is deprecated and the company record page no longer renders it — the page's lead card is now the account's work in flight, spelled from the records — but the assembly stays, because org_ask is served from the same handlers. org_ask — the prepared questions behind Ask Margince: the question is chosen from a fixed list rather than typed, because each one names the records its answer must be written from, which is what lets every sentence cite a record the reader could open themselves. org_dossier — what the COMPANY is, from its own recorded facts: deliberately not the account composite, because a dossier that could see the pipeline would describe the pipeline and the separation from the brief would collapse on the first prompt revision. meeting_plan — what to DO in one booked meeting: the outcome to earn, the opener, the one risk with its response, what the other side is likely to ask and what to ask them. It rides this lane rather than its own because it is the same task — grounded prose over records the caller can already see — but it reads a different projection: the account arc with the excerpts behind it, rather than the whole assembled input, because the specificity of every question comes from what people actually wrote."

  growth_fit:
    display_name: "Company fit assessment"
    ladder: [cheap_cloud, premium]
    execution_mode: interactive
    on_budget_exhausted: degrade
    status: shipped
    sites: [growth_fit]
    company_context: {scopes: [offer, positioning, proof], token_budget: 1200}
    doc: "How well one company fits what we sell. The only site on the company view that must read OUR offering as well as theirs — a fit is a claim about two companies, and judging one against a guess about the other is what the DOSS-AC-13 band cap exists to stop. Our own context is never citable: evidence is target-side only, so a factor drawn from what we sell is labelled an assessment and still cites their records, or the grounding filter drops it (DOSS-AC-6). The band the model proposes is not the band served — the deterministic completeness gate can lower it to `unknown` or cap it at `moderate`, and never raises it."

  draft_reply:
    display_name: "Reply drafting"
    ladder: [cheap_cloud, premium]
    execution_mode: interactive
    on_budget_exhausted: degrade
    status: shipped
    sites: [reply, person, account, first, intro, intro_note]
    company_context: {scopes: [positioning, sales, proof, market], token_budget: 1400}
    doc: "Six sites, one task: the reply to an activity, the person page's composer, the company page's first-touch outbound, the message that opens a conversation from a stated intent alone, the ask a rep sends a COLLEAGUE for an introduction (the only one written to somebody on our own side, which is why it carries its own phrasing), and the note that colleague then FORWARDS to the contact (draft_email over MCP, which names records to file under rather than records to write from). The last two are one workflow and two registers: the ask is internal and its overclaim is falsifiable by the teammate reading it, while the note goes out over that colleague's own name to a customer who cannot check it — which is why they carry separate prompts, separate wording tables and separate scenarios rather than one site with a flag. They differ in what a draft is grounded IN, and share the rules block every drafting surface writes under (compose/draftrules). The reply site alone has two system variants (voice-enabled and plain), selected per call from the workspace's Voice DNA state — a variant, not a site of its own; the composers and the first-message site gain theirs when Voice DNA reaches them."

  nl_search:
    display_name: "Natural-language search"
    ladder: [cheap_cloud, premium]
    execution_mode: interactive
    on_budget_exhausted: degrade
    status: planned
    company_context: {scopes: [offer, market], token_budget: 600}
    doc: "Declared, not built (ADR-0074)."

  cold_start:
    display_name: "Onboarding read"
    ladder: [cheap_cloud, premium]
    execution_mode: interactive
    on_budget_exhausted: degrade
    status: shipped
    sites:
      - {name: company_message, kind: multi_turn}
      - {name: sitereadmessage, kind: multi_turn}
      - {name: acts, kind: multi_turn}
      - field_extract
    company_context: none
    doc: "Four sites, not one: three conversational onboarding lanes plus the evidence-extraction pass the read-back rides. The extraction site is the consequential one and had no name before ADR-0074."

  transcript:
    display_name: "Transcript reading"
    ladder: [cheap_cloud, premium]
    execution_mode: interactive
    on_budget_exhausted: degrade
    status: planned
    company_context: none
    doc: "Declared, not built (ADR-0074). Pasted transcript text is T2/untrusted per ai-operational-spec §1 when a site lands."

  corpus_ask:
    display_name: "Document corpus question"
    ladder: [premium]
    execution_mode: interactive
    on_budget_exhausted: degrade
    status: shipped
    sites: [corpus_ask]
    company_context: none
    doc: "corpus_ask — one bounded document corpus, asked in free text and answered only from what the workspace filed in it. Everything a REFUSAL rests on is decided before this task is reached: readiness, the embed binding, and the grounding floor are settled deterministically, so the model is asked only when passages already cleared the floor. Its whole job is prose, and its answer is a list of claims each carrying a citation and a verbatim quote checked against the retrieved text — a claim whose quote is not found is dropped, and an answer with no surviving claim is not_covered. The ladder leads premium as a PREFERENCE and not a contract, because the guardrail is verbatim quoting and cheaper tiers paraphrase; a demoted rung is not trusted, it is checked like any other and falls back only if it actually fails. A missing chat lane, or a reply the guardrail refuses, degrades to the retrieved passages themselves with generated_by saying deterministic — deal_health's rule, for deal_health's reason, and honest because the grounded part of a grounded answer was never the prose. Over budget is NOT a separate outcome: an interactive task is never refused on budget, it is pinned to the on-box rung and asked, and whichever answer survives the quote check is what generated_by reports. What is invariant, and what the test asserts, is narrower: an over-budget ask never refuses and never spends a cloud rung."

  deal_health:
    display_name: "Deal status card"
    ladder: [cheap_cloud, premium]
    execution_mode: interactive
    on_budget_exhausted: degrade
    status: shipped
    sites: [deal_status]
    company_context: none
    doc: "deal_status — the deal page's one written card: where the deal stands, what could lose it, and why the recommended move is the right one. The model reads the deal's own facts (its fields, its health factors with the sentence behind each, its timeline, its open tasks and its Deal Room conversation — all assembled under the CALLER's row scope, with a withheld row contributing its date but not its words) and writes the sentences. The VERB never moves: which action the card offers is decided by rules from records and handed to the model in recommended_move, so a reader clicking Draft the reply reaches the mail the rules picked. A missing lane, an over-budget call or a reply the grounding filter refuses degrades to the same card composed deterministically, with generated_by saying so. The card is CACHED per reader on a fingerprint of its input plus the prompt and routing versions, so a deal nobody touched costs one call ever."

  weekly_review:
    display_name: "Weekly review narrative"
    ladder: [cheap_cloud, premium]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [narrative]
    company_context: none
    doc: "weekly_review/narrative — one or two sentences over a week's own counts and deal lines, for the rep reading them on Monday. It adds nothing: every fact it may state is already in the deterministic review beside it, which is what makes the whole thing safe to lose. A rep with no lane, an exhausted budget or a provider outage reads the same counts and the same lines, and the screen says which."

  brief_ranking:
    display_name: "Morning brief ranking"
    ladder: [premium, cheap_cloud]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [rank]
    company_context: none
    doc: "the one Premium-frontier default (§1.2 RATIFY): genuinely multi-hop reasoning"

  agent_loop:
    display_name: "Agent reasoning loop"
    ladder: [cheap_cloud, premium]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites:
      - {name: loop, kind: agent_loop}
    agents:
      morning_brief:
        tools: [annotate_brief, catch_me_up_on, list_records, read_brief, read_record]
      overnight_at_risk_sweep:
        tools: [at_risk_relationships, catch_me_up_on, list_records, log_activity,
                read_record, review_commitments, whats_slipping_this_week]
    company_context: {scopes: [identity, positioning, sales, offer], token_budget: 1200}
    doc: "The Surface-B reason-act loop: a cumulative, tool-fed message window, not a request factory. ADR-0074 names it the open risk for fixture-driven certification — if it cannot be certified honestly the census needs a `not_certifiable` kind."

  offer_draft:
    display_name: "Offer drafting"
    ladder: [cheap_cloud, premium]
    execution_mode: interactive
    on_budget_exhausted: degrade
    status: shipped
    sites: [draft]
    company_context: {scopes: [offer, positioning, proof], token_budget: 1600}

  document_extract:
    display_name: "Document extraction"
    ladder: [premium]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [fields]
    no_payload: true
    company_context: none
    doc: "read ONE attached document — a scanned form, an invoice, an order confirmation — for the four deal facts a human may then accept onto the deal (records-depth RD-PARAM-N-3), each carrying the quote it was read from. premium-only BY CONTRACT for site_extract's reason and one of its own: a rung that cannot carry the document is not a degraded answer to this question, it is a different question, so there is no rung to degrade to. no_payload BY CONTRACT: a scanned contract or invoice is exactly the content that must never reach ai_call_payload, whatever the deployment's capture posture says. A reading takes seconds and can fail, so it is a durable record its surface polls (records-depth RD-DDL-4), never work done inside the request that asks for it."

  site_extract:
    display_name: "Website deep read"
    ladder: [premium]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [profile]
    company_context: none
    doc: "premium-only BY CONTRACT: the no-guess gate demands verbatim quotes cheap tiers paraphrase; no fallback rung. Its response schema is built PER CALL (the citation enum is that call's passage ids), which is why ADR-0074 leaves answer schemas in code."

  site_fact_extract:
    display_name: "Website fact extraction"
    ladder: [cheap_cloud, premium]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [page_facts]
    company_context: none
    doc: "the deep read's page-parallel fact lane: tiny snippet-id-cited records a fast cheap tier serves reliably — its latency IS the read time, so the fast tier leads. Its response schema varies in SHAPE per call with the page menu (ADR-0074)."

  site_triage:
    display_name: "Website triage"
    ladder: [cheap_cloud, premium]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [triage]
    company_context: none
    doc: "what a mail domain's own site says it IS, before any organization is created from it: a company, one person's site, or a mailbox vendor selling addresses to the public. Runs on the SEED PAGE ALONE and leads with a fast tier because its whole job is to stop the crawl early — a personal page answered here costs one page instead of twelve. The provider class is the live.fr trap: that site belongs to a real company (Microsoft's) which is emphatically not the sender's employer."

  cert_judge:
    display_name: "Certification judging"
    ladder: [premium, cheap_cloud]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [judge]
    company_context: none
    doc: "the aicert quality judge — pinned to its own router in the cert lane, never the candidate's binding"

  voice_build:
    display_name: "Voice DNA build"
    ladder: [cheap_cloud, premium]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [derive, eval_draft, eval_scores]
    company_context: none
    doc: "owner-requested or automatic durable Voice DNA candidate build; own-authored corpus only, CompanyContext none (ADR-0066). Three sites: the derive pass plus the two evaluation passes."

  rate_extract:
    display_name: "Model pricing extraction"
    ladder: [premium, cheap_cloud]
    execution_mode: background
    on_budget_exhausted: queue
    status: shipped
    sites: [pricing, fx]
    company_context: none
    doc: "extract per-model AI pricing (per-MTok buckets) from a fetched pricing page, evidence-gated; feeds the model-cost refresh proposal producer. Two sites — the pricing-page pass and the FX pass — a distinction the build has carried unnamed (two prompt builders, two byte-pin tests, three corpus scenarios) since it was written."

# embed is a workload, not a task (ADR-0074). It has a real ladder and a real
# cost rule, but its tier is deliberately NOT one of the chat tiers above, and
# it has no prompt, no text answer and no completion path — so it carries no
# sites, no company-context policy, and no corpus or certification obligation.
# Forcing it through the task shape would make it unparseable and would give
# those obligations no meaning. Its absence from `tasks:` is why it escaped
# every completeness check before this ADR.
embed:
  tier: embed
  cost_unit: per_entity

degrade_to:
  frontier: premium
  premium: cheap_cloud
  cheap_cloud: local_small
  local_large: local_small
  local_small: local_small
