# The front server of a Margince install without containers. It plays the part
# the ingress plays in front of the images: one host, the api's paths to the
# api, everything else to the web server (web.conf in this folder, the same
# nginx.conf the web image runs). backend/gates/serverroutes_test.go holds the
# api's half of this file to the routes the api mounts.
#
# TLS is yours: put the certificate on this server, for example with certbot's
# nginx plugin, and set MARGINCE_PUBLIC_BASE_URL to the https address.

upstream margince_api {
    server 127.0.0.1:8080;
}

upstream margince_web {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    server_name margince.example.com;

    # The api bounds every body itself, per route and from its upload setting,
    # so a second, smaller ceiling here would refuse what the api allows.
    client_max_body_size 0;

    location ^~ /v1/ {
        proxy_pass http://margince_api;
        include /opt/margince/deploy/server/proxy.conf;
    }
    location ^~ /oauth/ {
        proxy_pass http://margince_api;
        include /opt/margince/deploy/server/proxy.conf;
    }
    location ~ ^/(healthz|readyz|metrics|mcp|setup/status|setup/claim|webhooks/gmail|webhooks/graph)$ {
        proxy_pass http://margince_api;
        include /opt/margince/deploy/server/proxy.conf;
    }
    # Full paths, never a /.well-known/ prefix, so a certificate challenge
    # under /.well-known/acme-challenge/ still reaches whoever answers it.
    location ~ ^/\.well-known/(security\.txt|oauth-authorization-server|oauth-protected-resource|oauth-protected-resource/mcp)$ {
        proxy_pass http://margince_api;
        include /opt/margince/deploy/server/proxy.conf;
    }

    location / {
        proxy_pass http://margince_web;
        include /opt/margince/deploy/server/proxy.conf;
    }
}
